<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        http-equiv="Permissions-Policy"
        content="camera=(self), microphone=(), xr-spatial-tracking=(self)"
    >

    <title>AR Game Cam</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;

            font-family:
                Arial,
                sans-serif;

            touch-action: none;
        }


        body {

            color: #fff;
        }


        #app {

            position: relative;

            width: 100%;

            height: 100dvh;

            overflow: hidden;

            background: #000;
        }


        /* =================================
           START SCREEN
        ================================= */

        #startScreen {

            position: absolute;

            inset: 0;

            z-index: 100;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            padding: 25px;

            text-align: center;

            background:
                radial-gradient(
                    circle at center,
                    #1c2730,
                    #070a0d
                );
        }


        #startScreen h1 {

            font-size:
                clamp(34px, 10vw, 52px);

            margin-bottom: 15px;
        }


        #startScreen p {

            max-width: 380px;

            line-height: 1.5;

            opacity: .75;

            margin-bottom: 30px;
        }


        #startButton {

            min-width: 230px;

            min-height: 52px;

            border: 0;

            border-radius: 16px;

            padding: 15px 25px;

            background: #fff;

            color: #111;

            font-size: 17px;

            font-weight: 700;
        }


        #startButton:disabled {

            opacity: .45;
        }


        /* =================================
           WEBXR CANVAS
        ================================= */

        #xrCanvas {

            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

            display: none;

            z-index: 1;

            background: transparent;
        }


        /* =================================
           UI
        ================================= */

        #ui {

            position: absolute;

            inset: 0;

            z-index: 20;

            display: none;

            pointer-events: none;
        }


        #topBar {

            position: absolute;

            top:
                calc(
                    12px +
                    env(safe-area-inset-top)
                );

            left: 12px;

            right: 12px;

            display: flex;

            justify-content:
                space-between;

            gap: 10px;
        }


        .badge {

            padding: 10px 14px;

            border-radius: 13px;

            background:
                rgba(0, 0, 0, .55);

            backdrop-filter:
                blur(10px);

            font-size: 14px;
        }


        /* =================================
           RETICLE
        ================================= */

        #reticle {

            position: absolute;

            left: 50%;

            top: 50%;

            width: 48px;

            height: 48px;

            transform:
                translate(-50%, -50%);

            border:
                2px solid white;

            border-radius: 50%;

            display: none;

            opacity: .9;
        }


        #reticle::before {

            content: "";

            position: absolute;

            left: 50%;

            top: 50%;

            width: 14px;

            height: 2px;

            transform:
                translate(-50%, -50%);

            background: white;
        }


        #reticle::after {

            content: "";

            position: absolute;

            left: 50%;

            top: 50%;

            width: 2px;

            height: 14px;

            transform:
                translate(-50%, -50%);

            background: white;
        }


        /* =================================
           STATUS
        ================================= */

        #status {

            position: absolute;

            left: 50%;

            bottom:
                calc(
                    85px +
                    env(safe-area-inset-bottom)
                );

            transform:
                translateX(-50%);

            width:
                calc(100% - 40px);

            max-width: 420px;

            padding: 12px 15px;

            border-radius: 14px;

            background:
                rgba(0, 0, 0, .68);

            backdrop-filter:
                blur(10px);

            text-align: center;

            line-height: 1.4;

            font-size: 14px;
        }


        /* =================================
           PLACE BUTTON
        ================================= */

        #placeButton {

            position: absolute;

            left: 50%;

            bottom:
                calc(
                    22px +
                    env(safe-area-inset-bottom)
                );

            transform:
                translateX(-50%);

            min-width: 210px;

            min-height: 50px;

            border: 0;

            border-radius: 16px;

            padding: 14px 22px;

            background: #fff;

            color: #111;

            font-size: 16px;

            font-weight: 700;

            pointer-events: auto;

            display: none;
        }


        /* =================================
           EXIT
        ================================= */

        #exitButton {

            position: absolute;

            right: 12px;

            bottom:
                calc(
                    22px +
                    env(safe-area-inset-bottom)
                );

            min-height: 46px;

            border: 0;

            border-radius: 14px;

            padding: 12px 15px;

            background:
                rgba(0, 0, 0, .65);

            color: white;

            pointer-events: auto;

            display: none;
        }


        /* =================================
           ERROR
        ================================= */

        #errorBox {

            display: none;

            margin-top: 20px;

            max-width: 380px;

            padding: 12px;

            border-radius: 12px;

            background:
                rgba(120, 20, 20, .75);

            color: #fff;

            font-size: 13px;

            line-height: 1.4;
        }

    </style>

</head>


<body>


<div id="app">


    <!-- =================================
         START
    ================================= -->

    <section id="startScreen">

        <h1>
            AR GAME
        </h1>


        <p>

            Камера и AR работают
            непосредственно внутри
            Telegram Mini App.

            <br><br>

            Наведи телефон на пол,
            дождись обнаружения поверхности
            и размести 3D-объект.

        </p>


        <button
            id="startButton"
            disabled>

            Проверка AR...

        </button>


        <div id="errorBox"></div>

    </section>


    <!-- =================================
         WEBXR CANVAS
    ================================= -->

    <canvas id="xrCanvas"></canvas>


    <!-- =================================
         UI
    ================================= -->

    <div id="ui">


        <div id="topBar">


            <div class="badge">

                AR MODE

            </div>


            <div
                class="badge"
                id="userName">

                Player

            </div>


        </div>


        <div id="reticle"></div>


        <div id="status">

            Поиск AR...

        </div>


        <button
            id="placeButton">

            Поставить объект

        </button>


        <button
            id="exitButton">

            Выйти

        </button>


    </div>


</div>


<script type="module">


/* =====================================================
   THREE.JS
===================================================== */

import * as THREE from
    "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


import {
    GLTFLoader
} from
    "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


/* =====================================================
   TELEGRAM
===================================================== */

const tg =
    window.Telegram?.WebApp;


if (tg) {

    tg.ready();

    tg.expand();

}


/* =====================================================
   ELEMENTS
===================================================== */

const startScreen =
    document.getElementById(
        "startScreen"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const errorBox =
    document.getElementById(
        "errorBox"
    );


const canvas =
    document.getElementById(
        "xrCanvas"
    );


const ui =
    document.getElementById(
        "ui"
    );


const status =
    document.getElementById(
        "status"
    );


const reticle =
    document.getElementById(
        "reticle"
    );


const placeButton =
    document.getElementById(
        "placeButton"
    );


const exitButton =
    document.getElementById(
        "exitButton"
    );


/* =====================================================
   TELEGRAM USER
===================================================== */

if (
    tg?.initDataUnsafe?.user
) {

    const user =
        tg.initDataUnsafe.user;


    document.getElementById(
        "userName"
    ).textContent =

        user.first_name ||

        user.username ||

        "Player";

}


/* =====================================================
   THREE VARIABLES
===================================================== */

let renderer;

let scene;

let camera;

let model = null;

let xrSession = null;

let referenceSpace = null;

let viewerSpace = null;

let hitTestSource = null;

let hitTestRequested = false;

let currentHitPose = null;

let objectPlaced = false;


/* =====================================================
   STATUS
===================================================== */

function setStatus(text) {

    status.textContent =
        text;

}


/* =====================================================
   ERROR
===================================================== */

function showError(text) {

    errorBox.textContent =
        text;

    errorBox.style.display =
        "block";

}


/* =====================================================
   INITIALIZE THREE
===================================================== */

function initThree() {


    scene =
        new THREE.Scene();


    /*
     * Camera
     */

    camera =
        new THREE.PerspectiveCamera(
            70,
            window.innerWidth /
            window.innerHeight,
            0.01,
            100
        );


    /*
     * Renderer
     */

    renderer =
        new THREE.WebGLRenderer({

            canvas,

            alpha: true,

            antialias: true,

            preserveDrawingBuffer: false

        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.xr.enabled =
        true;


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    /*
     * Lighting
     */

    const ambientLight =
        new THREE.HemisphereLight(
            0xffffff,
            0x666666,
            2
        );


    scene.add(
        ambientLight
    );


    const directionalLight =
        new THREE.DirectionalLight(
            0xffffff,
            2
        );


    directionalLight.position.set(
        2,
        4,
        2
    );


    scene.add(
        directionalLight
    );


    /*
     * Load GLB
     */

    const loader =
        new GLTFLoader();


    loader.load(

        "./models/creature.glb",

        gltf => {

            model =
                gltf.scene;


            /*
             * Начальный размер.
             *
             * GLB желательно экспортировать
             * из Blender в реальном размере.
             */

            model.scale.set(
                1,
                1,
                1
            );


            model.visible =
                false;


            scene.add(
                model
            );


            console.log(
                "creature.glb loaded"
            );


            setStatus(
                "Модель загружена"
            );

        },


        undefined,

        error => {

            console.error(
                "GLB ERROR",
                error
            );


            showError(
                "Не удалось загрузить models/creature.glb"
            );

        }

    );


    /*
     * Resize
     */

    window.addEventListener(
        "resize",
        resize
    );

}


/* =====================================================
   RESIZE
===================================================== */

function resize() {

    if (!renderer) {

        return;

    }


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();

}


/* =====================================================
   CHECK WEBXR
===================================================== */

async function checkAR() {


    /*
     * HTTPS
     */

    if (
        location.protocol !==
        "https:"
    ) {

        showError(
            "AR требует HTTPS."
        );


        startButton.textContent =
            "Требуется HTTPS";


        return false;

    }


    /*
     * WebXR
     */

    if (
        !navigator.xr
    ) {

        showError(
            "WebXR API отсутствует в Telegram WebView. На этом устройстве Telegram не предоставляет immersive AR."
        );


        startButton.textContent =
            "AR недоступен";


        return false;

    }


    try {

        const supported =
            await navigator.xr
                .isSessionSupported(
                    "immersive-ar"
                );


        console.log(
            "immersive-ar:",
            supported
        );


        if (!supported) {

            showError(
                "immersive-ar не поддерживается текущим Telegram WebView."
            );


            startButton.textContent =
                "AR не поддерживается";


            return false;

        }


        /*
         * Всё хорошо
         */

        startButton.disabled =
            false;


        startButton.textContent =
            "Включить камеру";


        setStatus(
            "AR готов"
        );


        return true;

    }
    catch (error) {

        console.error(
            error
        );


        showError(
            "Ошибка проверки WebXR: " +
            error.message
        );


        startButton.textContent =
            "Ошибка WebXR";


        return false;

    }

}


/* =====================================================
   START AR
===================================================== */

startButton.addEventListener(
    "click",
    startAR
);


async function startAR() {


    try {

        startButton.disabled =
            true;


        setStatus(
            "Запуск камеры и AR..."
        );


        /*
         * Запрашиваем настоящую AR-сессию.
         *
         * Важно:
         * никакого Chrome,
         * никакого Scene Viewer.
         */

        xrSession =
            await navigator.xr
                .requestSession(
                    "immersive-ar",
                    {

                        requiredFeatures: [
                            "hit-test"
                        ],

                        optionalFeatures: [
                            "local-floor",
                            "dom-overlay"
                        ],

                        domOverlay: {
                            root: document.body
                        }

                    }
                );


        /*
         * Передаём XR session Three.js
         */

        await renderer.xr.setSession(
            xrSession
        );


        /*
         * Reference spaces
         */

        referenceSpace =
            await xrSession
                .requestReferenceSpace(
                    "local"
                );


        viewerSpace =
            await xrSession
                .requestReferenceSpace(
                    "viewer"
                );


        /*
         * Состояние
         */

        hitTestSource =
            null;

        hitTestRequested =
            false;

        currentHitPose =
            null;

        objectPlaced =
            false;


        /*
         * UI
         */

        startScreen.style.display =
            "none";


        canvas.style.display =
            "block";


        ui.style.display =
            "block";


        reticle.style.display =
            "block";


        placeButton.style.display =
            "block";


        exitButton.style.display =
            "block";


        setStatus(
            "Медленно двигайте телефоном и ищите поверхность"
        );


        /*
         * AR закончился
         */

        xrSession.addEventListener(
            "end",
            onSessionEnd
        );


        /*
         * Запускаем XR render loop
         */

        renderer.setAnimationLoop(
            onXRFrame
        );

    }
    catch (error) {

        console.error(
            "AR START ERROR:",
            error
        );


        startButton.disabled =
            false;


        setStatus(
            "Не удалось запустить AR"
        );


        showError(
            error.name +
            ": " +
            error.message
        );

    }

}


/* =====================================================
   HIT TEST SOURCE
===================================================== */

async function requestHitTestSource() {


    if (
        hitTestRequested ||
        !xrSession ||
        !viewerSpace
    ) {

        return;

    }


    hitTestRequested =
        true;


    try {

        hitTestSource =
            await xrSession
                .requestHitTestSource({
                    space:
                        viewerSpace
                });


        console.log(
            "Hit test source ready"
        );

    }
    catch (error) {

        console.error(
            "HIT TEST ERROR",
            error
        );


        setStatus(
            "Hit-test недоступен"
        );

    }

}


/* =====================================================
   XR FRAME
===================================================== */

function onXRFrame(
    time,
    frame
) {


    if (
        !xrSession ||
        !frame
    ) {

        return;

    }


    /*
     * Создаём hit-test source
     */

    requestHitTestSource();


    /*
     * Получаем положение
     * камеры телефона
     */

    const pose =
        frame.getViewerPose(
            referenceSpace
        );


    /*
     * Если hit-test source готов
     */

    if (
        hitTestSource
    ) {

        const results =
            frame.getHitTestResults(
                hitTestSource
            );


        if (
            results.length > 0
        ) {

            const hit =
                results[0];


            const hitPose =
                hit.getPose(
                    referenceSpace
                );


            if (
                hitPose
            ) {

                currentHitPose =
                    hitPose;


                /*
                 * Показываем точку
                 */

                reticle.style.display =
                    "block";


                if (
                    !objectPlaced
                ) {

                    setStatus(
                        "Поверхность найдена — нажмите «Поставить объект»"
                    );

                }

            }

        }
        else {

            currentHitPose =
                null;


            if (
                !objectPlaced
            ) {

                setStatus(
                    "Ищем поверхность..."
                );

            }

        }

    }


    /*
     * Render
     */

    renderer.render(
        scene,
        camera
    );

}


/* =====================================================
   PLACE OBJECT
===================================================== */

placeButton.addEventListener(
    "click",
    placeObject
);


function placeObject() {


    if (!model) {

        setStatus(
            "Модель ещё загружается..."
        );


        return;

    }


    if (!currentHitPose) {

        setStatus(
            "Поверхность ещё не найдена"
        );


        return;

    }


    /*
     * Позиция поверхности
     */

    const position =
        currentHitPose.transform
            .position;


    /*
     * Ориентация поверхности
     */

    const orientation =
        currentHitPose.transform
            .orientation;


    /*
     * Устанавливаем модель
     */

    model.position.set(
        position.x,
        position.y,
        position.z
    );


    model.quaternion.set(
        orientation.x,
        orientation.y,
        orientation.z,
        orientation.w
    );


    model.visible =
        true;


    objectPlaced =
        true;


    /*
     * UI

     */

    reticle.style.display =
        "none";


    setStatus(
        "Объект размещён. Двигайтесь вокруг него."
    );

}


/* =====================================================
   EXIT
===================================================== */

exitButton.addEventListener(
    "click",
    async () => {

        if (
            xrSession
        ) {

            await xrSession.end();

        }

    }
);


/* =====================================================
   SESSION END
===================================================== */

function onSessionEnd() {


    renderer.setAnimationLoop(
        null
    );


    if (model) {

        model.visible =
            false;

    }


    xrSession =
        null;


    referenceSpace =
        null;


    viewerSpace =
        null;


    hitTestSource =
        null;


    hitTestRequested =
        false;


    currentHitPose =
        null;


    objectPlaced =
        false;


    canvas.style.display =
        "none";


    ui.style.display =
        "none";


    reticle.style.display =
        "none";


    placeButton.style.display =
        "none";


    exitButton.style.display =
        "none";


    startScreen.style.display =
        "flex";


    startButton.disabled =
        false;


    startButton.textContent =
        "Включить камеру";


    setStatus(
        "AR завершён"
    );

}


/* =====================================================
   INITIALIZATION
===================================================== */

initThree();


/*
 * Проверяем поддержку
 * immersive AR.
 */

checkAR();

</script>


</body>

</html>
