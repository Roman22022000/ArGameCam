}

body {

    height: 100%;

    overflow: hidden;

    inset: 0;

    z-index: 100;

    font-size: 12px;

    line-height: 1.5;

    pointer-events: none;

#controls {

    z-index: 90;

    display: none;

    width: 95px;

    min-height: 45px;

    border: none;

    border-radius: 12px;

    top: 10px;

        calc(

            env(safe-area-inset-bottom)

        linear-gradient(

            rgba(0,0,0,.95),

<!-- =====================================================
     THREE IMPORT MAP
===================================================== -->

<script type="importmap">

{
    "imports": {

        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

<script type="module">


import * as THREE from "three";


import {
    GLTFLoader
}
from
"three/addons/loaders/GLTFLoader.js";



/* =====================================================
   TELEGRAM
===================================================== */

const telegram =
    window.Telegram?.WebApp || null;


if (telegram) {

    telegram.ready();

    telegram.expand();

    if (
        telegram.disableVerticalSwipes
    ) {

        telegram.disableVerticalSwipes();

    }

}



/* =====================================================
   DOM
===================================================== */

const startScreen =
    document.getElementById(
        "startScreen"
    );


const startARButton =
    document.getElementById(
        "startARButton"
    );


const statusElement =
    document.getElementById(
        "status"
    );


const debugElement =
    document.getElementById(
        "debug"
    );


const controls =
    document.getElementById(
        "controls"
    );


const placeButton =
    document.getElementById(
        "placeButton"
    );


const resetButton =
    document.getElementById(
        "resetButton"
    );


const plusButton =
    document.getElementById(
        "plusButton"
    );


const minusButton =
    document.getElementById(
        "minusButton"
    );


const closeButton =
    document.getElementById(
        "closeButton"
    );


const scenePanel =
    document.getElementById(
        "scenePanel"
    );



/* =====================================================
   THREE
===================================================== */

let renderer = null;

let scene = null;

let model = null;


/*
 * ВАЖНО:
 *
 * В XR режиме renderer.xr
 * сам создаёт/управляет
 * XR camera.
 */

let xrCamera = null;



/* =====================================================
   MODEL
===================================================== */

let currentModel =
    "creature.glb";


let currentModelName =
    "Creature";


let modelScale =
    1;


/*
 * Мировая позиция объекта.
 *
 * После закрепления она
 * больше не изменяется.
 */

const objectWorldPosition =
    new THREE.Vector3();


const objectWorldQuaternion =
    new THREE.Quaternion();


let objectLocked =
    false;



/* =====================================================
   XR
===================================================== */

let xrSession =
    null;


let xrReferenceSpace =
    null;


let xrViewerSpace =
    null;


let xrHitTestSource =
    null;


let hitAvailable =
    false;


/*
 * Последняя найденная
 * поверхность.
 */

const hitPosition =
    new THREE.Vector3();


const hitQuaternion =
    new THREE.Quaternion();



/* =====================================================
   STATUS
===================================================== */

function setStatus(
    message
) {

    statusElement.textContent =
        message;

}



/* =====================================================
   INIT THREE
===================================================== */

function initThree() {

    if (
        renderer
    ) {

        return;

    }


    scene =
        new THREE.Scene();


    renderer =
        new THREE.WebGLRenderer({

            alpha: true,

            antialias: true

        });


    renderer.setPixelRatio(

        Math.min(
            window.devicePixelRatio,
            2
        )

    );


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    /*
     * WebXR включается здесь.
     */

    renderer.xr.enabled =
        true;


    /*
     * Canvas.
     */

    const canvas =
        renderer.domElement;


    canvas.style.position =
        "absolute";


    canvas.style.left =
        "0";


    canvas.style.top =
        "0";


    canvas.style.width =
        "100%";


    canvas.style.height =
        "100%";


    canvas.style.zIndex =
        "2";


    document
        .getElementById("app")
        .appendChild(canvas);


    /*
     * Свет.
     */

    const hemisphere =
        new THREE.HemisphereLight(

            0xffffff,

            0x555555,

            3

        );


    scene.add(
        hemisphere
    );


    const directional =
        new THREE.DirectionalLight(

            0xffffff,

            3

        );


    directional.position.set(

        5,
        10,
        5

    );


    scene.add(
        directional
    );

}



/* =====================================================
   LOAD MODEL
===================================================== */

function loadModel() {

    initThree();


    if (
        model
    ) {

        scene.remove(
            model
        );

        model =
            null;

    }


    const loader =
        new GLTFLoader();


    const url =
        "./models/" +
        currentModel;


    setStatus(
        "Загрузка " +
        currentModelName +
        "..."
    );


    debugElement.innerHTML =

        "LOADING<br>" +
        url;


    loader.load(

        url,


        function (
            gltf
        ) {

            model =
                gltf.scene;


            /*
             * Bounding Box.
             */

            const box =
                new THREE.Box3();


            box.setFromObject(
                model
            );


            const size =
                box.getSize(

                    new THREE.Vector3()

                );


            const center =
                box.getCenter(

                    new THREE.Vector3()

                );


            /*
             * Центрируем.
             */

            model.position.sub(
                center
            );


            /*
             * Нормализуем размер.
             */

            const maximum =
                Math.max(

                    size.x,
                    size.y,
                    size.z

                );


            if (
                maximum > 0
            ) {

                model.scale.setScalar(

                    1.5 /
                    maximum

                );

            }


            /*
             * Добавляем.
             */

            scene.add(
                model
            );


            /*
             * Пока объект не закреплён,
             * hit-test будет ставить его
             * на найденную поверхность.
             */

            setStatus(

                "3D загружен. " +
                "Наведите телефон на поверхность."

            );


            debugElement.innerHTML =

                "MODEL OK<br>" +
                currentModel;


        },


        function (
            progress
        ) {

            if (
                progress.total > 0
            ) {

                const percent =

                    progress.loaded /
                    progress.total *
                    100;


                setStatus(

                    "Загрузка 3D: " +
                    percent.toFixed(0) +
                    "%"

                );

            }

        },


        function (
            error
        ) {

            console.error(
                "GLB ERROR",
                error
            );


            setStatus(

                "Ошибка загрузки GLB"

            );


            debugElement.innerHTML =

                "GLB ERROR<br><br>" +

                url +
                "<br><br>" +

                String(error);

        }

    );

}



/* =====================================================
   START AR
===================================================== */

async function startARSession() {

    /*
     * Нажатие пользователя уже произошло.
     *
     * requestSession вызывается
     * непосредственно отсюда.
     */

    setStatus(
        "Запускаем WebXR..."
    );


    debugElement.innerHTML =
        "CHECKING WEBXR";


    if (
        !window.isSecureContext
    ) {

        setStatus(

            "AR требует HTTPS."

        );


        debugElement.innerHTML =

            "SECURE CONTEXT: NO";

        return;

    }


    if (
        !navigator.xr
    ) {

        setStatus(

            "WebXR недоступен."

        );


        debugElement.innerHTML =

            "navigator.xr = undefined";


        return;

    }


    try {

        const supported =

            await navigator.xr
                .isSessionSupported(

                    "immersive-ar"

                );


        if (
            !supported
        ) {

            setStatus(

                "Immersive AR не поддерживается " +
                "этим браузером или устройством."

            );


            debugElement.innerHTML =

                "immersive-ar: FALSE";


            return;

        }


    }
    catch (
        error
    ) {

        console.error(
            error
        );


        setStatus(

            "Ошибка проверки WebXR: " +
            error.name

        );


        debugElement.innerHTML =

            error.name +
            "<br>" +
            error.message;


        return;

    }


    try {

        /*
         * =================================================
         * REQUEST SESSION
         * =================================================
         */

        xrSession =

            await navigator.xr
                .requestSession(

                    "immersive-ar",

                    {

                        requiredFeatures: [

                            "hit-test"

                        ],

                        optionalFeatures: [

                            "local",

                            "local-floor",

                            "anchors"

                        ]

                    }

                );


        debugElement.innerHTML =
            "XR SESSION CREATED";


        /*
         * =================================================
         * REFERENCE SPACE
         * =================================================
         */

        try {

            xrReferenceSpace =

                await xrSession
                    .requestReferenceSpace(

                        "local-floor"

                    );

        }
        catch (
            error
        ) {

            console.warn(

                "local-floor unavailable"

            );


            xrReferenceSpace =

                await xrSession
                    .requestReferenceSpace(

                        "local"

                    );

        }


        /*
         * =================================================
         * VIEWER SPACE
         * =================================================
         */

        xrViewerSpace =

            await xrSession
                .requestReferenceSpace(

                    "viewer"

                );


        /*
         * =================================================
         * HIT TEST
         * =================================================
         */

        xrHitTestSource =

            await xrSession
                .requestHitTestSource({

                    space:
                        xrViewerSpace

                });


        /*
         * =================================================
         * THREE XR SESSION
         * =================================================
         */

        await renderer.xr.setSession(

            xrSession

        );


        /*
         * =================================================
         * UI
         * =================================================
         */

        startScreen.style.display =
            "none";


        controls.style.display =
            "flex";


        scenePanel.style.display =
            "block";


        closeButton.style.display =
            "block";


        /*
         * Загружаем модель.
         */

        loadModel();


        setStatus(

            "AR работает. " +
            "Наведите камеру на пол."

        );


        /*
         * =================================================
         * RENDER LOOP
         * =================================================
         */

        renderer.setAnimationLoop(

            renderXR

        );


        /*
         * =================================================
         * SESSION END
         * =================================================
         */

        xrSession.addEventListener(

            "end",

            onXRSessionEnded

        );


    }
    catch (
        error
    ) {

        console.error(
            "REQUEST SESSION ERROR",
            error
        );


        setStatus(

            "AR не запустился: " +
            error.name

        );


        debugElement.innerHTML =

            "XR ERROR<br><br>" +

            error.name +
            "<br>" +

            error.message;

        xrSession =
            null;

    }

}



/* =====================================================
   XR FRAME
===================================================== */

function renderXR(
    time,
    frame
) {

    if (
        !xrSession ||
        !frame
    ) {

        return;

    }


    /*
     * =================================================
     * VIEWER POSE
     * =================================================
     *
     * Здесь WebXR сообщает,
     * где физически находится
     * телефон.
     */

    const viewerPose =

        frame.getViewerPose(

            xrReferenceSpace

        );


    if (
        viewerPose
    ) {

        const position =
            viewerPose
                .transform
                .position;


        const orientation =
            viewerPose
                .transform
                .orientation;


        /*
         * =================================================
         * ЭТО РЕАЛЬНЫЕ 6DoF ДАННЫЕ
         * =================================================
         *
         * X = движение влево/вправо
         *
         * Y = движение вверх/вниз
         *
         * Z = движение вперёд/назад
         *
         * quaternion = ориентация
         */

        debugElement.innerHTML =

            "WEBXR 6DoF<br><br>" +

            "PHONE POSITION<br>" +

            "X: " +
            position.x.toFixed(3) +

            "<br>" +

            "Y: " +
            position.y.toFixed(3) +

            "<br>" +

            "Z: " +
            position.z.toFixed(3) +

            "<br><br>" +

            "OBJECT<br>" +

            "X: " +
            objectWorldPosition
                .x.toFixed(3) +

            "<br>" +

            "Y: " +
            objectWorldPosition
                .y.toFixed(3) +

            "<br>" +

            "Z: " +
            objectWorldPosition
                .z.toFixed(3) +

            "<br><br>" +

            "LOCK: " +
            (
                objectLocked
                    ? "YES"
                    : "NO"
            );

    }


    /*
     * =================================================
     * HIT TEST
     * =================================================
     */

    if (
        xrHitTestSource &&
        !objectLocked
    ) {

        const results =

            frame.getHitTestResults(

                xrHitTestSource

            );


        if (
            results.length > 0
        ) {

            const hit =
                results[0];


            const pose =

                hit.getPose(

                    xrReferenceSpace

                );


            if (
                pose
            ) {

                const p =
                    pose
                        .transform
                        .position;


                const q =
                    pose
                        .transform
                        .orientation;


                hitPosition.set(

                    p.x,
                    p.y,
                    p.z

                );


                hitQuaternion.set(

                    q.x,
                    q.y,
                    q.z,
                    q.w

                );


                hitAvailable =
                    true;


                /*
                 * Preview.
                 */

                if (
                    model
                ) {

                    model.position.copy(

                        hitPosition

                    );


                    model.quaternion.copy(

                        hitQuaternion

                    );

                }


                setStatus(

                    "Поверхность найдена. " +
                    "Нажмите ЗАКРЕПИТЬ."

                );

            }

        }

    }


    /*
     * =================================================
     * RENDER
     * =================================================
     *
     * renderer.xr автоматически
     * использует XR camera.
     */

    renderer.render(

        scene,

        renderer.xr.getCamera()

    );

}



/* =====================================================
   PLACE OBJECT
===================================================== */

function placeObject() {

    if (
        !model
    ) {

        setStatus(
            "Модель ещё загружается."
        );

        return;

    }


    if (
        !hitAvailable
    ) {

        setStatus(

            "Сначала наведите телефон " +
            "на поверхность."

        );

        return;

    }


    /*
     * =================================================
     * ФИКСИРУЕМ МИРОВУЮ КООРДИНАТУ
     * =================================================
     */

    objectWorldPosition.copy(

        hitPosition

    );


    objectWorldQuaternion.copy(

        hitQuaternion

    );


    model.position.copy(

        objectWorldPosition

    );


    model.quaternion.copy(

        objectWorldQuaternion

    );


    /*
     * =================================================
     * С ЭТОГО МОМЕНТА MODEL НЕ ДВИГАЕМ
     * =================================================
     */

    objectLocked =
        true;


    setStatus(

        "ОБЪЕКТ ЗАКРЕПЛЁН. " +
        "ХОДИТЕ ВОКРУГ НЕГО."

    );

}



/* =====================================================
   RESET
===================================================== */

function resetObject() {

    objectLocked =
        false;


    hitAvailable =
        false;


    setStatus(

        "Наведите телефон на поверхность."

    );

}



/* =====================================================
   SCALE UP
===================================================== */

function scaleUp() {

    if (
        !model
    ) {

        return;

    }


    modelScale *=
        1.15;


    model.scale.multiplyScalar(
        1.15
    );

}



/* =====================================================
   SCALE DOWN
===================================================== */

function scaleDown() {

    if (
        !model
    ) {

        return;

    }


    modelScale *=
        0.87;


    model.scale.multiplyScalar(
        0.87
    );

}



/* =====================================================
   END XR
===================================================== */

async function endXR() {

    if (
        xrSession
    ) {

        try {

            await xrSession.end();

        }
        catch (
            error
        ) {

            console.error(
                error
            );

        }

    }

}



/* =====================================================
   SESSION ENDED
===================================================== */

function onXRSessionEnded() {

    xrSession =
        null;


    xrReferenceSpace =
        null;


    xrViewerSpace =
        null;


    xrHitTestSource =
        null;


    hitAvailable =
        false;


    objectLocked =
        false;


    renderer.setAnimationLoop(
        null
    );


    startScreen.style.display =
        "flex";


    controls.style.display =
        "none";


    scenePanel.style.display =
        "none";


    closeButton.style.display =
        "none";


    setStatus(
        "AR завершён."
    );

}



/* =====================================================
   BUTTONS
===================================================== */

startARButton.addEventListener(

    "click",

    function () {

        startARSession();

    }

);


placeButton.addEventListener(

    "click",

    function () {

        placeObject();

    }

);


resetButton.addEventListener(

    "click",

    function () {

        resetObject();

    }

);


plusButton.addEventListener(

    "click",

    function () {

        scaleUp();

    }

);


minusButton.addEventListener(

    "click",

    function () {

        scaleDown();

    }

);


closeButton.addEventListener(

    "click",

    function () {

        endXR();

    }

);



/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(

    "resize",

    function () {

        if (
            renderer
        ) {

            renderer.setSize(

                window.innerWidth,

                window.innerHeight

            );

        }

    }

);



/* =====================================================
   SCENE SELECTION
===================================================== */

document
    .querySelectorAll(
        ".scene"
    )
    .forEach(

        function (
            button
        ) {

            button.addEventListener(

                "click",

                function () {

                    document
                        .querySelectorAll(
                            ".scene"
                        )
                        .forEach(

                            function (
                                item
                            ) {

                                item.classList
                                    .remove(
                                        "active"
                                    );

                            }

                        );


                    button.classList.add(
                        "active"
                    );


                    currentModel =
                        button.dataset.model;


                    currentModelName =
                        button.dataset.name;


                    objectLocked =
                        false;


                    hitAvailable =
                        false;


                    loadModel();

                }

            );

        }

    );



/* =====================================================
   WEBXR CHECK
===================================================== */

async function checkWebXR() {

    if (
        !window.isSecureContext
    ) {

        setStatus(
            "Откройте сайт через HTTPS."
        );

        return;

    }


    if (
        !navigator.xr
    ) {

        setStatus(

            "WebXR отсутствует."

        );

        debugElement.innerHTML =

            "navigator.xr = undefined";

        return;

    }


    try {

        const supported =

            await navigator.xr
                .isSessionSupported(

                    "immersive-ar"

                );


        if (
            supported
        ) {

            setStatus(

                "WebXR AR доступен. " +
                "Нажмите «Запустить AR»."

            );


            debugElement.innerHTML =

                "WEBXR: OK<br>" +
                "immersive-ar: YES";

        }
        else {

            setStatus(

                "immersive-ar недоступен " +
                "на этом устройстве."

            );


            debugElement.innerHTML =

                "WEBXR: OK<br>" +
                "immersive-ar: NO";

        }

    }
    catch (
        error
    ) {

        setStatus(

            "Ошибка WebXR: " +
            error.name

        );


        debugElement.innerHTML =

            error.name +
            "<br>" +
            error.message;

    }

}



/* =====================================================
   INIT
===================================================== */

checkWebXR();

</script>
