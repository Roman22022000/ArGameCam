<script type="importmap">

{
    "imports": {

        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

<script type="module">


import * as THREE
from "three";


import {
    GLTFLoader
}
from
"three/addons/loaders/GLTFLoader.js";



/* =====================================================
   TELEGRAM
===================================================== */

const tg =
    window.Telegram?.WebApp;


if (tg) {

    tg.ready();

    tg.expand();

    if (
        tg.disableVerticalSwipes
    ) {

        tg.disableVerticalSwipes();

    }

}



/* =====================================================
   DOM
===================================================== */

const startScreen =
    document.getElementById(
        "start"
    );


const startAR =
    document.getElementById(
        "startAR"
    );


const status =
    document.getElementById(
        "status"
    );


const debug =
    document.getElementById(
        "debug"
    );


const top =
    document.getElementById(
        "top"
    );


const tracking =
    document.getElementById(
        "tracking"
    );


const controls =
    document.getElementById(
        "controls"
    );


const placeButton =
    document.getElementById(
        "place"
    );


const resetButton =
    document.getElementById(
        "reset"
    );


const plusButton =
    document.getElementById(
        "plus"
    );


const minusButton =
    document.getElementById(
        "minus"
    );


const closeButton =
    document.getElementById(
        "close"
    );


const scenesPanel =
    document.getElementById(
        "scenes"
    );



/* =====================================================
   THREE
===================================================== */

let renderer =
    null;


let scene =
    null;


/*
 * ВАЖНО:
 *
 * Мы НЕ будем вручную вращать
 * эту камеру.
 *
 * WebXR сам управляет
 * XR camera.
 */

let camera =
    null;


let model =
    null;



/* =====================================================
   MODEL
===================================================== */

let modelFile =
    "creature.glb";


let modelName =
    "Creature";


let modelScale =
    1;


/*
 * Мировая координата
 * закреплённого объекта.
 */

const worldPosition =
    new THREE.Vector3();


const worldQuaternion =
    new THREE.Quaternion();


let objectPlaced =
    false;



/* =====================================================
   XR
===================================================== */

let session =
    null;


let referenceSpace =
    null;


let viewerSpace =
    null;


let hitTestSource =
    null;


let hitAvailable =
    false;



/* =====================================================
   HIT POSITION
===================================================== */

const hitPosition =
    new THREE.Vector3();


const hitQuaternion =
    new THREE.Quaternion();



/* =====================================================
   INIT THREE
===================================================== */

function initThree() {

    if (
        renderer
    ) {

        return;

    }


    scene =
        new THREE.Scene();


    /*
     * Обычная camera нужна
     * Three.js до XR.
     */

    camera =
        new THREE.PerspectiveCamera(

            70,

            window.innerWidth /
            window.innerHeight,

            0.01,

            1000

        );


    renderer =
        new THREE.WebGLRenderer({

            antialias:
                true,

            alpha:
                true

        });


    renderer.setPixelRatio(

        Math.min(

            window.devicePixelRatio,

            2

        )

    );


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    renderer.xr.enabled =
        true;


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    /*
     * Добавляем canvas.
     */

    renderer.domElement.id =
        "threeCanvas";


    renderer.domElement.style.position =
        "absolute";


    renderer.domElement.style.left =
        "0";


    renderer.domElement.style.top =
        "0";


    renderer.domElement.style.width =
        "100%";


    renderer.domElement.style.height =
        "100%";


    renderer.domElement.style.zIndex =
        "2";


    document
        .getElementById("app")
        .appendChild(

            renderer.domElement

        );


    /*
     * Свет.
     */

    const hemi =
        new THREE.HemisphereLight(

            0xffffff,

            0x444444,

            3

        );


    scene.add(
        hemi
    );


    const directional =
        new THREE.DirectionalLight(

            0xffffff,

            3

        );


    directional.position.set(

        5,
        10,
        5

    );


    scene.add(
        directional

    );

}



/* =====================================================
   LOAD GLB
===================================================== */

function loadModel() {

    if (
        model
    ) {

        scene.remove(
            model
        );

        model =
            null;

    }


    setStatus(
        "Загрузка 3D..."
    );


    const loader =
        new GLTFLoader();


    const url =
        "./models/" +
        modelFile;


    console.log(
        "GLB:",
        url
    );


    loader.load(

        url,


        gltf => {

            model =
                gltf.scene;


            /*
             * Рассчитываем
             * bounding box.
             */

            const box =
                new THREE.Box3();


            box.setFromObject(
                model
            );


            const size =
                box.getSize(

                    new THREE.Vector3()

                );


            const center =
                box.getCenter(

                    new THREE.Vector3()

                );


            /*
             * Центр модели.
             */

            model.position.sub(
                center
            );


            /*
             * Нормализуем размер.
             */

            const maxSize =
                Math.max(

                    size.x,
                    size.y,
                    size.z

                );


            if (
                maxSize > 0
            ) {

                const factor =
                    1.5 /
                    maxSize;


                model.scale.setScalar(

                    factor

                );

            }


            /*
             * Пока модель НЕ закреплена,
             * поставим её в точку
             * перед viewer.
             *
             * Это только preview.
             */

            model.position.set(

                0,
                0,
                -1.5

            );


            model.rotation.set(

                0,
                0,
                0

            );


            scene.add(
                model
            );


            setStatus(
                "3D загружен"
            );


            debug.innerHTML =

                "MODEL LOADED<br>" +

                "FILE: " +
                modelFile;

        },


        undefined,


        error => {

            console.error(
                error
            );


            setStatus(

                "Ошибка загрузки GLB"

            );


            debug.innerHTML =

                "GLB ERROR<br><br>" +

                url +
                "<br><br>" +

                String(error);

        }

    );

}



/* =====================================================
   START WEBXR
===================================================== */

async function startAR() {

    /*
     * Проверяем WebXR.
     */

    if (
        !navigator.xr
    ) {

        setStatus(

            "WebXR отсутствует. " +
            "Откройте сайт в совместимом " +
            "AR-браузере."

        );

        return;

    }


    let supported;


    try {

        supported =

            await navigator.xr
                .isSessionSupported(

                    "immersive-ar"

                );

    }
    catch (
        error
    ) {

        console.error(
            error
        );


        setStatus(

            "Не удалось проверить WebXR"

        );


        return;

    }


    if (
        !supported
    ) {

        setStatus(

            "Этот браузер не поддерживает " +
            "immersive AR."

        );


        return;

    }


    try {

        initThree();


        /*
         * =================================================
         * НАСТОЯЩАЯ AR SESSION
         * =================================================
         */

        session =

            await navigator.xr
                .requestSession(

                    "immersive-ar",

                    {

                        requiredFeatures: [

                            "hit-test"

                        ],

                        optionalFeatures: [

                            "local-floor",

                            "anchors"

                        ]

                    }

                );


        /*
         * =================================================
         * REFERENCE SPACE
         * =================================================
         *
         * Сначала local-floor.
         *
         * Если недоступен —
         * local.
         */

        try {

            referenceSpace =

                await session
                    .requestReferenceSpace(

                        "local-floor"

                    );

        }
        catch {

            referenceSpace =

                await session
                    .requestReferenceSpace(

                        "local"

                    );

        }


        /*
         * Viewer space нужен
         * для hit-test.
         */

        viewerSpace =

            await session
                .requestReferenceSpace(

                    "viewer"

                );


        /*
         * =================================================
         * HIT TEST
         * =================================================
         */

        hitTestSource =

            await session
                .requestHitTestSource({

                    space:
                        viewerSpace

                });


        /*
         * =================================================
         * THREE ↔ WEBXR
         * =================================================
         */

        await renderer.xr.setSession(
            session
        );


        /*
         * UI
         */

        startScreen.style.display =
            "none";


        top.style.display =
            "flex";


        controls.style.display =
            "flex";


        scenesPanel.style.display =
            "block";


        closeButton.style.display =
            "block";


        tracking.textContent =
            "6DoF";


        setStatus(

            "Наведите телефон на поверхность"

        );


        /*
         * Загружаем модель.
         */

        loadModel();


        /*
         * =================================================
         * XR LOOP
         * =================================================
         */

        renderer.setAnimationLoop(

            onXRFrame

        );


        /*
         * XR завершён.
         */

        session.addEventListener(

            "end",

            () => {

                session =
                    null;


                referenceSpace =
                    null;


                viewerSpace =
                    null;


                hitTestSource =
                    null;


                objectPlaced =
                    false;


                renderer.setAnimationLoop(
                    null
                );


                startScreen.style.display =
                    "flex";


                top.style.display =
                    "none";


                controls.style.display =
                    "none";


                scenesPanel.style.display =
                    "none";


                closeButton.style.display =
                    "none";


                setStatus(
                    "AR завершён"
                );

            }

        );

    }
    catch (
        error
    ) {

        console.error(
            "AR ERROR:",
            error
        );


        setStatus(

            "AR ERROR: " +
            error.message

        );

    }

}



/* =====================================================
   XR FRAME
===================================================== */

function onXRFrame(

    time,
    frame

) {

    if (
        !session
    ) {

        return;

    }


    /*
     * =================================================
     * ПОЛУЧАЕМ ПОЗУ ПОЛЬЗОВАТЕЛЯ
     * =================================================
     */

    const viewerPose =

        frame.getViewerPose(

            referenceSpace

        );


    if (
        !viewerPose
    ) {

        return;

    }


    /*
     * ВАЖНО:
     *
     * НЕ создаём свою camera3D.
     *
     * Three.js renderer.xr
     * использует viewer pose
     * для XR camera.
     *
     * Поэтому телефон:
     *
     * X → движение влево/вправо
     *
     * Y → вверх/вниз
     *
     * Z → вперёд/назад
     *
     * rotation → поворот
     */


    const viewerTransform =
        viewerPose
            .transform;


    const p =
        viewerTransform.position;


    const q =
        viewerTransform.orientation;


    /*
     * DEBUG
     */

    debug.innerHTML =

        "TRUE WEBXR 6DoF<br><br>" +

        "PHONE POSITION<br>" +

        "X: " +
        p.x.toFixed(3) +

        "<br>" +

        "Y: " +
        p.y.toFixed(3) +

        "<br>" +

        "Z: " +
        p.z.toFixed(3) +

        "<br><br>" +

        "OBJECT<br>" +

        "X: " +
        worldPosition.x
            .toFixed(3) +

        "<br>" +

        "Y: " +
        worldPosition.y
            .toFixed(3) +

        "<br>" +

        "Z: " +
        worldPosition.z
            .toFixed(3) +

        "<br><br>" +

        "LOCK: " +

        (
            objectPlaced
                ? "YES"
                : "NO"
        );


    /*
     * =================================================
     * HIT TEST
     * =================================================
     */

    if (
        hitTestSource &&
        !objectPlaced
    ) {

        const hits =

            frame.getHitTestResults(

                hitTestSource

            );


        if (
            hits.length > 0
        ) {

            const hit =
                hits[0];


            const hitPose =

                hit.getPose(

                    referenceSpace

                );


            if (
                hitPose
            ) {

                const hp =
                    hitPose
                        .transform
                        .position;


                const hq =
                    hitPose
                        .transform
                        .orientation;


                /*
                 * Сохраняем
                 * preview position.
                 */

                hitPosition.set(

                    hp.x,
                    hp.y,
                    hp.z

                );


                hitQuaternion.set(

                    hq.x,
                    hq.y,
                    hq.z,
                    hq.w

                );


                hitAvailable =
                    true;


                /*
                 * ПРЕДПРОСМОТР.
                 */

                if (
                    model
                ) {

                    model.position.copy(

                        hitPosition

                    );


                    model.quaternion.copy(

                        hitQuaternion

                    );

                }


                setStatus(

                    "Поверхность найдена — " +
                    "нажмите ЗАКРЕПИТЬ"

                );

            }

        }

    }


    /*
     * =================================================
     * ВАЖНЕЙШИЙ МОМЕНТ
     * =================================================
     *
     * После objectPlaced:
     *
     * model.position НЕ меняем.
     *
     * model.quaternion НЕ меняем.
     *
     * Она остаётся в world space.
     *
     * Движется только viewer.
     * =================================================
     */


    renderer.render(

        scene,

        renderer.xr.getCamera()

    );

}



/* =====================================================
   PLACE
===================================================== */

placeButton.addEventListener(

    "click",

    () => {

        if (
            !model
        ) {

            return;

        }


        if (
            !hitAvailable
        ) {

            setStatus(

                "Сначала наведите телефон " +
                "на поверхность"

            );

            return;

        }


        /*
         * =================================================
         * ЗАПИСЫВАЕМ WORLD POSITION
         * ОДИН РАЗ
         * =================================================
         */

        worldPosition.copy(

            hitPosition

        );


        worldQuaternion.copy(

            hitQuaternion

        );


        /*
         * Закрепляем.
         */

        model.position.copy(

            worldPosition

        );


        model.quaternion.copy(

            worldQuaternion

        );


        objectPlaced =
            true;


        setStatus(

            "СЦЕНА ЗАКРЕПЛЕНА. " +
            "ХОДИТЕ ВОКРУГ ОБЪЕКТА."

        );

    }

);



/* =====================================================
   RESET
===================================================== */

resetButton.addEventListener(

    "click",

    () => {

        objectPlaced =
            false;


        hitAvailable =
            false;


        setStatus(

            "Наведите камеру на новую поверхность"

        );

    }

);



/* =====================================================
   SCALE
===================================================== */

plusButton.addEventListener(

    "click",

    () => {

        if (
            !model
        ) {

            return;

        }


        modelScale *=
            1.15;


        model.scale.multiplyScalar(
            1.15
        );

    }

);


minusButton.addEventListener(

    "click",

    () => {

        if (
            !model
        ) {

            return;

        }


        modelScale *=
            .87;


        model.scale.multiplyScalar(
            .87
        );

    }

);



/* =====================================================
   CLOSE
===================================================== */

closeButton.addEventListener(

    "click",

    async () => {

        if (
            session
        ) {

            try {

                await session.end();

            }
            catch (
                error
            ) {

                console.error(
                    error
                );

            }

        }

    }

);



/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(

    "resize",

    () => {

        if (
            renderer
        ) {

            renderer.setSize(

                window.innerWidth,

                window.innerHeight

            );

        }

    }

);



/* =====================================================
   START
===================================================== */

startAR.addEventListener(

    "click",

    startAR

);



/* =====================================================
   INITIAL WEBXR CHECK
===================================================== */

async function checkWebXR() {

    if (
        !navigator.xr
    ) {

        status.textContent =

            "WebXR API отсутствует";

        return;

    }


    try {

        const supported =

            await navigator.xr
                .isSessionSupported(

                    "immersive-ar"

                );


        if (
            supported
        ) {

            status.textContent =

                "WebXR AR доступен";

        }
        else {

            status.textContent =

                "Immersive AR недоступен " +
                "на этом браузере";

        }

    }
    catch {

        status.textContent =

            "Не удалось определить AR";

    }

}


checkWebXR();

</script>

</body>

</html>
