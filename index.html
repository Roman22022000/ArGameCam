<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    >

    <title>AR Gallery</title>

    <!-- ============================================================
         TON CONNECT UI
         Используется для подключения TON-кошелька.
         ============================================================ -->

    <script src="https://unpkg.com/@tonconnect/ui@3.0.0/dist/tonconnect-ui.min.js"></script>


    <style>

        /* ============================================================
           GLOBAL
           ============================================================ */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
            border: 0;
        }


        /* ============================================================
           SCREENS
           ============================================================ */

        .screen {
            position: fixed;
            inset: 0;
            display: none;
            background: #000;
        }

        .screen.active {
            display: flex;
        }

        .center {
            align-items: center;
            justify-content: center;
            padding: 20px;
        }


        /* ============================================================
           PANELS
           ============================================================ */

        .panel {
            width: 320px;
            max-width: 100%;
        }

        .title {
            text-align: center;
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 30px;
        }


        /* ============================================================
           BUTTONS
           ============================================================ */

        .button {
            width: 100%;
            height: 52px;
            margin-bottom: 8px;
            background: #080808;
            color: #fff;
            border: 1px solid #242424;
            text-align: left;
            padding: 0 16px;
            font-size: 13px;
        }

        .button:hover {
            background: #111;
        }

        .primary {
            background: #fff;
            color: #000;
            border-color: #fff;
        }


        /* ============================================================
           STATUS
           ============================================================ */

        .status {
            text-align: center;
            color: #666;
            font-size: 12px;
            line-height: 1.45;
            min-height: 20px;
            margin-top: 14px;
            white-space: pre-line;
        }


        /* ============================================================
           PAGE
           ============================================================ */

        .page {
            flex-direction: column;
            padding: 14px 18px 18px;
        }

        .header {
            position: relative;
            width: 100%;
            height: 48px;
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .back {
            width: 40px;
            height: 40px;
            background: #080808;
            color: #fff;
            border: 1px solid #242424;
            font-size: 22px;
        }

        .pageTitle {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
        }


        /* ============================================================
           ROOM LIST
           ============================================================ */

        .grid {
            width: 100%;
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
            overflow: auto;
            padding-bottom: 10px;
        }

        .roomItem {
            min-height: 110px;
            background: #080808;
            color: #fff;
            border: 1px solid #202020;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 8px;
            font-size: 22px;
        }

        .roomItem:hover {
            background: #111;
        }

        .roomItem small {
            color: #666;
            font-size: 9px;
            letter-spacing: 1px;
        }


        /* ============================================================
           ROOM VIEWER
           ============================================================ */

        #roomViewerScreen {
            overflow: hidden;
            touch-action: none;
        }

        #roomCanvas {
            position: absolute;
            inset: 0;
        }

        #roomCanvas canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .roomHeader {
            position: absolute;
            z-index: 20;
            top: 14px;
            left: 14px;
            right: 14px;
            height: 40px;
            display: flex;
            align-items: center;
        }

        .roomTitle {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
        }

        .roomStatus {
            position: absolute;
            z-index: 25;
            left: 50%;
            top: 76px;
            transform: translateX(-50%);
            width: min(88vw, 560px);
            padding: 12px 14px;
            background: rgba(0, 0, 0, .78);
            border: 1px solid rgba(255, 255, 255, .14);
            color: #bbb;
            text-align: center;
            font-size: 11px;
            line-height: 1.45;
            white-space: pre-line;
            pointer-events: none;
        }


        /* ============================================================
           ROOM CONTROLS
           ============================================================ */

        .roomControls {
            position: absolute;
            z-index: 30;
            left: 0;
            right: 0;
            bottom: 16px;
            height: 128px;
            padding: 0 12px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            pointer-events: none;
        }

        .movePad {
            width: 112px;
            height: 112px;
            border: 1px solid rgba(255, 255, 255, .2);
            border-radius: 50%;
            background: rgba(8, 8, 8, .45);
            position: relative;
            pointer-events: auto;
            touch-action: none;
        }

        .movePad:before {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 68px;
            height: 68px;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 50%;
        }

        .moveKnob {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 46px;
            height: 46px;

            border-radius: 50%;

            border-radius: 12px;

            height: 58px;

        }

    </style>

    <script type="importmap">

        {

    <script type="module">

        /* ============================================================
           THREE.JS
           ============================================================ */

        import * as THREE from "three";

        import {
            GLTFLoader
        } from "three/addons/loaders/GLTFLoader.js";


        /* ============================================================
           CONFIG
           ============================================================ */

        /*
         * TON Connect manifest.
         */
        const TON_MANIFEST =
            "https://roman22022000.github.io/Ton_site/tonconnect-manifest.json";


        /*
         * NFT collection в user-friendly формате.
         */
        const REQUIRED_COLLECTION =
            "EQD9mm3hx-QvHyNG18gDaaJtSTTQTVVYVjJ6zhonXocj2eyI";


        /*
         * Та же коллекция в raw формате.
         */
        const REQUIRED_COLLECTION_RAW =
            "0:fd9a6de1c7e42f1d8346d7c80369a26d4934d04d5558563eb38689d7a1c8f6";


        /*
         * API генерации.
         */
        const GENERATION_API =
            "https://api.araicameragame.party/api/generation";


        /*
         * API комнат.
         *
         * GET:
         *     /api/rooms
         *
         * POST:
         *     /api/rooms/request
         *
         * Файлы:
         *     /api/rooms/file/...
         *
         * Модель:
         *     /api/rooms/model-file/...
         */
        const ROOMS_API =
            "https://api.araicameragame.party/api/rooms";


        /*
         * Размер виртуальной комнаты.
         */
        const ROOM_LENGTH = 7;
        const ROOM_WIDTH = 6;
        const ROOM_HEIGHT = 4;


        /*
         * Параметры камеры.
         */
        const ROOM_EYE_HEIGHT = 1.65;
        const ROOM_SPEED = 2.7;
        const ROOM_LOOK_SPEED = .006;
        const ROOM_CAMERA_RADIUS = .18;


        /* ============================================================
           DOM
           ============================================================ */

            $("userScreen");

            $("userStatus");

        const roomViewerStatus =

        const roomRollRight =
            $("roomRollRight");

        const roomReset =
            $("roomReset");


        const generationCode =
            $("generationCode");

        const generationSubmit =
            $("generationSubmit");

        const generationStatus =
            $("generationStatus");


        /* ============================================================
           GENERAL NAVIGATION
           ============================================================ */

        /*
         * FUNCTION: show
         *
         * Переключает активный экран.
         */
        function show(screen) {

            document
                .querySelectorAll(".screen")
                .forEach(
                    s =>
                        s.classList.remove("active")
                );

            screen.classList.add("active");
        }


        /*
         * FUNCTION: roomStatus
         *
         * Показывает или скрывает статус загрузки ROOM.
         */
        function roomStatus(
            text,
            on = true
        ) {

            roomViewerStatus.textContent =
                text || "";

            roomViewerStatus.style.display =
                on
                    ? "block"
                    : "none";
        }


        /* ============================================================
           TON / NFT
           ============================================================ */

        /*
         * FUNCTION: b64Bytes
         *
         * Преобразует Base64URL в Uint8Array.
         */
        function b64Bytes(v) {

            let s =
                String(v)
                    .replace(/-/g, "+")
                    .replace(/_/g, "/");


            while (s.length % 4) {
                s += "=";
            }


            const b =
                atob(s);


            const a =
                new Uint8Array(
                    b.length
                );


            for (
                let i = 0;
                i < b.length;
                i++
            ) {

                a[i] =
                    b.charCodeAt(i);
            }


            return a;
        }


        /*
         * FUNCTION: normalizeTonAddress
         *
         * Приводит TON-адрес к raw-формату.
         */
        function normalizeTonAddress(
            address
        ) {

            if (!address) {
                return "";
            }


            address =
                String(address).trim();


            if (
                /^-?\d+:[0-9a-fA-F]{64}$/
                    .test(address)
            ) {

                const p =
                    address.split(":");


                return (
                    p[0] +
                    ":" +
                    p[1].toLowerCase()
                );
            }


            try {

                const b =
                    b64Bytes(address);


                if (
                    b.length !== 36
                ) {

                    return address.toLowerCase();
                }


                let wc =
                    b[1];


                if (wc === 255) {
                    wc = -1;
                }


                let h = "";


                for (
                    let i = 2;
                    i < 34;
                    i++
                ) {

                    h +=
                        b[i]
                            .toString(16)
                            .padStart(
                                2,
                                "0"
                            );
                }


                return (
                    wc +
                    ":" +
                    h.toLowerCase()
                );

            } catch {

                return address.toLowerCase();
            }
        }


        const requiredCollection =
            normalizeTonAddress(
                REQUIRED_COLLECTION
            );


        /*
         * FUNCTION: checkCollectionNFT
         *
         * Проверяет наличие NFT необходимой коллекции.
         */
        async function checkCollectionNFT(
            wallet
        ) {

            const r =
                await fetch(
                    "https://tonapi.io/v2/accounts/" +
                    encodeURIComponent(wallet) +
                    "/nfts?limit=1000",
                    {
                        headers: {
                            Accept:
                                "application/json"
                        }
                    }
                );


            if (!r.ok) {

                throw new Error(
                    "TonAPI HTTP " +
                    r.status
                );
            }


            const d =
                await r.json();


            const items =
                Array.isArray(
                    d.nft_items
                )
                    ? d.nft_items
                    : [];


            return items.some(
                n => {

                    const a =
                        n.collection?.address ||
                        n.collection_address ||
                        "";


                    const x =
                        normalizeTonAddress(a);


                    return (
                        x ===
                            requiredCollection ||
                        x ===
                            REQUIRED_COLLECTION_RAW
                    );
                }
            );
        }


        let currentWallet = null;
        let accessGranted = false;
        let checkingNFT = false;


        /*
         * FUNCTION: processWallet
         *
         * Обрабатывает подключение TON-кошелька
         * и проверяет NFT.
         */
        async function processWallet(
            wallet
        ) {

            if (!wallet) {

                currentWallet =
                    null;

                accessGranted =
                    false;

                userWalletAddress.textContent =
                    "";

                authStatus.textContent =
                    "Подключите TON-кошелёк";

                show(authScreen);

                return;
            }


            if (
                checkingNFT ||
                !wallet.account?.address
            ) {

            currentWallet =
                wallet.account.address;

        let rooms = [];
