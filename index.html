<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>AR Gallery</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            overflow: hidden;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
        }

        .screen.active {
            display: flex;
        }


        /* =====================================================
           LOGIN
        ===================================================== */

        #loginScreen {
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .loginBox {
            width: 100%;
            max-width: 420px;

            border: 1px solid #333;

            padding: 30px 22px;

            text-align: center;
        }

        .title {
            font-size: 21px;
            letter-spacing: 3px;

            margin-bottom: 15px;
        }

        .description {
            color: #777;

            font-size: 12px;

            line-height: 1.6;

            margin-bottom: 25px;
        }

        #tonConnect {
            display: flex;
            justify-content: center;
            min-height: 44px;
        }

        #loginStatus {
            min-height: 20px;

            margin-top: 20px;

            color: #777;

            font-size: 12px;

            line-height: 1.5;
        }


        /* =====================================================
           HOME
        ===================================================== */

        #homeScreen {
            flex-direction: column;
        }

        .header {
            height: 65px;
            min-height: 65px;

            border-bottom: 1px solid #222;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 18px;
        }

        .headerTitle {
            font-size: 13px;
            letter-spacing: 2px;
        }

        #walletDisplay {
            max-width: 220px;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

            color: #777;

            font-size: 10px;
        }

        .homeContent {
            flex: 1;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }

        .menu {
            width: 100%;

            max-width: 400px;

            display: flex;

            flex-direction: column;

            gap: 10px;
        }

        .mainButton {
            width: 100%;

            height: 58px;

            background: #080808;

            border: 1px solid #333;

            color: #fff;

            font-size: 12px;

            letter-spacing: 2px;
        }

        .mainButton:hover {
            background: #151515;
        }


        /* =====================================================
           GENERATION
        ===================================================== */

        #generationScreen {
            flex-direction: column;
        }

        .generationContent {
            flex: 1;

            display: flex;

            align-items: flex-start;

            justify-content: center;

            overflow-y: auto;

            padding: 40px 20px;
        }

        .generationBox {
            width: 100%;

            max-width: 420px;

            border: 1px solid #222;

            padding: 25px;
        }

        .generationTitle {
            font-size: 14px;

            letter-spacing: 2px;

            margin-bottom: 12px;
        }

        .generationDescription {
            color: #777;

            font-size: 12px;

            line-height: 1.6;

            margin-bottom: 25px;
        }

        #generationCode {
            width: 100%;

            height: 55px;

            background: #050505;

            border: 1px solid #333;

            color: #fff;

            outline: none;

            text-align: center;

            font-size: 22px;

            letter-spacing: 7px;
        }

        #generationCode:focus {
            border-color: #777;
        }

        #generationSubmit {
            width: 100%;

            height: 55px;

            margin-top: 12px;

            background: #fff;

            color: #000;

            border: 1px solid #fff;

            font-size: 12px;

            letter-spacing: 2px;
        }

        #generationSubmit:disabled {
            opacity: 0.35;

            cursor: not-allowed;
        }

        #generationStatus {
            min-height: 40px;

            margin-top: 18px;

            text-align: center;

            color: #777;

            font-size: 11px;

            line-height: 1.5;
        }


        /* =====================================================
           GALLERY
        ===================================================== */

        #galleryScreen {
            flex-direction: column;
        }

        .gallery {
            flex: 1;

            overflow-y: auto;

            padding: 15px;

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(150px, 1fr)
                );

            gap: 12px;
        }

        .galleryItem {
            aspect-ratio: 1;

            border: 1px solid #222;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #555;

            font-size: 30px;
        }


        /* =====================================================
           BACK
        ===================================================== */

        .backButton {
            height: 36px;

            padding: 0 15px;

            background: #000;

            border: 1px solid #333;

            color: #fff;

            font-size: 10px;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .header {
                height: 60px;
                min-height: 60px;
            }

            .gallery {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .generationContent {
                padding: 25px 15px;
            }

            .generationBox {
                padding: 20px;
            }

        }

    </style>

</head>


<body>


<div id="app">


    <!-- =====================================================
         LOGIN
    ===================================================== -->

    <section
        id="loginScreen"
        class="screen active"
    >

        <div class="loginBox">

            <div class="title">
                AR GALLERY
            </div>

            <div class="description">

                Подключите TON-кошелёк.

                <br><br>

                После подключения будет
                выполнена проверка NFT.

            </div>


            <div id="tonConnect"></div>


            <div id="loginStatus">
                Кошелёк не подключён
            </div>

        </div>

    </section>



    <!-- =====================================================
         HOME
    ===================================================== -->

    <section
        id="homeScreen"
        class="screen"
    >

        <div class="header">

            <div class="headerTitle">
                AR GALLERY
            </div>

            <div id="walletDisplay">
                —
            </div>

        </div>


        <div class="homeContent">

            <div class="menu">

                <button
                    id="galleryButton"
                    class="mainButton"
                >
                    ГАЛЕРЕЯ
                </button>


                <button
                    id="generationButton"
                    class="mainButton"
                >
                    ГЕНЕРАЦИЯ
                </button>

            </div>

        </div>

    </section>



    <!-- =====================================================
         GALLERY
    ===================================================== -->

    <section
        id="galleryScreen"
        class="screen"
    >

        <div class="header">

            <div class="headerTitle">
                ГАЛЕРЕЯ
            </div>

            <button
                id="galleryBack"
                class="backButton"
            >
                НАЗАД
            </button>

        </div>


        <div
            id="gallery"
            class="gallery"
        ></div>

    </section>



    <!-- =====================================================
         GENERATION
    ===================================================== -->

    <section
        id="generationScreen"
        class="screen"
    >

        <div class="header">

            <div class="headerTitle">
                ГЕНЕРАЦИЯ
            </div>

            <button
                id="generationBack"
                class="backButton"
            >
                НАЗАД
            </button>

        </div>


        <div class="generationContent">

            <div class="generationBox">

                <div class="generationTitle">
                    НОМЕР
                </div>


                <div class="generationDescription">

                    Введите номер из пяти цифр.

                    <br><br>

                    Номер будет отправлен вместе
                    с адресом подключённого
                    TON-кошелька.

                </div>


                <input
                    id="generationCode"

                    type="text"

                    inputmode="numeric"

                    pattern="[0-9]*"

                    maxlength="5"

                    autocomplete="off"

                    placeholder="00000"
                >


                <button
                    id="generationSubmit"
                    disabled
                >
                    ОТПРАВИТЬ
                </button>


                <div
                    id="generationStatus"
                >
                    —
                </div>

            </div>

        </div>

    </section>


</div>



<!-- =========================================================
     TON CONNECT
========================================================= -->

<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>


<script>


/* ============================================================
   CONFIG
============================================================ */

const TON_MANIFEST =
    "https://roman22022000.github.io/Ton_site/tonconnect-manifest.json";


const API_URL =
    "https://api.araicameragame.party/api/generation";


/*
    КОЛЛЕКЦИЯ GETGEMS

    EQD9mm3hx-QvHyNG18gDaaJtSTTQTVVYVj6zhonXocj2eyI
*/

const REQUIRED_COLLECTION =
    "EQD9mm3hx-QvHyNG18gDaaJtSTTQTVVYVj6zhonXocj2eyI";


/*
    Канонический raw-адрес этой коллекции.
*/

const REQUIRED_COLLECTION_RAW =
    "0:fd9a6de1c7e42f1d8346d7c80369a26d4934d04d5558563eb38689d7a1c8f6";


/* ============================================================
   STATE
============================================================ */

let currentWallet = null;

let accessGranted = false;


/* ============================================================
   DOM
============================================================ */

const loginScreen =
    document.getElementById(
        "loginScreen"
    );


const homeScreen =
    document.getElementById(
        "homeScreen"
    );


const galleryScreen =
    document.getElementById(
        "galleryScreen"
    );


const generationScreen =
    document.getElementById(
        "generationScreen"
    );


const loginStatus =
    document.getElementById(
        "loginStatus"
    );


const walletDisplay =
    document.getElementById(
        "walletDisplay"
    );


const generationCode =
    document.getElementById(
        "generationCode"
    );


const generationSubmit =
    document.getElementById(
        "generationSubmit"
    );


const generationStatus =
    document.getElementById(
        "generationStatus"
    );


const gallery =
    document.getElementById(
        "gallery"
    );


/* ============================================================
   SCREEN
============================================================ */

function showScreen(screen) {

    document
        .querySelectorAll(".screen")
        .forEach(
            element => {

                element.classList.remove(
                    "active"
                );

            }
        );


    screen.classList.add(
        "active"
    );
}


/* ============================================================
   WALLET DISPLAY
============================================================ */

function shortWallet(address) {

    if (!address) {
        return "—";
    }

    return (
        address.substring(0, 8) +
        "..." +
        address.substring(
            address.length - 8
        )
    );
}


/* ============================================================
   TON ADDRESS NORMALIZATION
============================================================ */

/*
    ВАЖНО:

    wallet.account.address от TON Connect уже является
    raw-адресом вида:

        0:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

    Поэтому для кошелька НИКАКОЙ decode не нужен.

    Для friendly-адресов коллекции используем полноценный
    Base64URL decode + CRC и правильный workchain byte.
*/

function friendlyToRaw(address) {

    try {

        let value =
            address
                .replace(
                    /-/g,
                    "+"
                )
                .replace(
                    /_/g,
                    "/"
                );


        while (
            value.length % 4 !== 0
        ) {

            value += "=";

        }


        const binary =
            atob(value);


        const bytes =
            new Uint8Array(
                binary.length
            );


        for (
            let i = 0;
            i < binary.length;
            i++
        ) {

            bytes[i] =
                binary.charCodeAt(i);

        }


        if (
            bytes.length !== 36
        ) {

            return null;

        }


        /*
            byte 0 = tag
            byte 1 = signed workchain
            bytes 2..33 = 32-byte hash
            bytes 34..35 = CRC16
        */

        let workchain =
            bytes[1];


        if (
            workchain >= 128
        ) {

            workchain -= 256;

        }


        let hash = "";


        for (
            let i = 2;
            i < 34;
            i++
        ) {

            hash +=
                bytes[i]
                    .toString(16)
                    .padStart(
                        2,
                        "0"
                    );

        }


        return (
            workchain +
            ":" +
            hash
        ).toLowerCase();

    } catch (error) {

        console.error(
            "Friendly address decode error:",
            error
        );

        return null;
    }
}


function normalizeAddress(address) {

    if (!address) {
        return "";
    }


    address =
        String(
            address
        ).trim();


    /*
        Raw TON address.
    */

    if (
        /^-?\d+:[0-9a-fA-F]{64}$/
            .test(address)
    ) {

        return address
            .toLowerCase();

    }


    /*
        Friendly TON address.
    */

    const raw =
        friendlyToRaw(
            address
        );


    if (raw) {

        return raw;

    }


    return address
        .toLowerCase();
}


/* ============================================================
   TON CONNECT
============================================================ */

const tonConnectUI =
    new TON_CONNECT_UI.TonConnectUI({

        manifestUrl:
            TON_MANIFEST,

        buttonRootId:
            "tonConnect"

    });


/*
    Важно:

    Не делаем принудительный disconnect,
    если NFT не найден.

    Сначала показываем причину.
*/

tonConnectUI.onStatusChange(

    async wallet => {

        console.log(
            "TON CONNECT WALLET:",
            wallet
        );


        if (!wallet) {

            currentWallet = null;

            accessGranted = false;

            walletDisplay.textContent =
                "—";

            loginStatus.textContent =
                "Кошелёк не подключён";

            updateSendButton();

            showScreen(
                loginScreen
            );

            return;
        }


        /*
            TON Connect отдаёт raw address.

            Пример:

            0:xxxxxxxxxxxxxxxx...
        */

        currentWallet =
            wallet.account.address;


        console.log(
            "RAW WALLET:",
            currentWallet
        );


        walletDisplay.textContent =
            shortWallet(
                currentWallet
            );


        loginStatus.textContent =
            "Кошелёк подключён. Проверка NFT...";


        /*
            Проверяем NFT.
        */

        const result =
            await checkCollectionNFT(
                currentWallet
            );


        console.log(
            "NFT RESULT:",
            result
        );


        if (!result.success) {

            accessGranted = false;

            loginStatus.innerHTML =
                result.message;

            updateSendButton();

            /*
                НЕ отключаем кошелёк.
                Это позволит увидеть адрес и причину ошибки.
            */

            return;
        }


        /*
            NFT найден.
        */

        accessGranted = true;


        loginStatus.textContent =
            "NFT найден. Доступ разрешён";


        updateSendButton();


        showScreen(
            homeScreen
        );

    },

    error => {

        console.error(
            "TON CONNECT ERROR:",
            error
        );


        loginStatus.textContent =
            "Ошибка TON Connect: " +
            (
                error?.message ||
                "неизвестная ошибка"
            );
    }

);


/* ============================================================
   NFT CHECK
============================================================ */

async function checkCollectionNFT(
    walletAddress
) {

    try {

        /*
            Получаем raw-адрес кошелька.
        */

        const walletRaw =
            normalizeAddress(
                walletAddress
            );


        /*
            Получаем raw-адрес коллекции.
        */

        const collectionRaw =
            normalizeAddress(
                REQUIRED_COLLECTION
            );


        console.log(
            "WALLET RAW:",
            walletRaw
        );


        console.log(
            "COLLECTION RAW:",
            collectionRaw
        );


        /*
            Основной запрос TonAPI.

            Получаем NFT владельца.
        */

        const url =
            "https://tonapi.io/v2/accounts/" +
            encodeURIComponent(
                walletRaw
            ) +
            "/nfts?limit=1000";


        console.log(
            "NFT API:",
            url
        );


        const response =
            await fetch(
                url,
                {
                    method: "GET",

                    headers: {
                        "Accept":
                            "application/json"
                    }
                }
            );


        console.log(
            "TONAPI STATUS:",
            response.status
        );


        const responseText =
            await response.text();


        if (!response.ok) {

            console.error(
                "TONAPI ERROR:",
                responseText
            );


            return {

                success: false,

                message:
                    "Ошибка TonAPI: HTTP " +
                    response.status

            };
        }


        let data;


        try {

            data =
                JSON.parse(
                    responseText
                );

        } catch {

            return {

                success: false,

                message:
                    "TonAPI вернул некорректный JSON"

            };
        }


        const nfts =
            Array.isArray(
                data.nft_items
            )
                ? data.nft_items
                : [];


        console.log(
            "NFT COUNT:",
            nfts.length
        );


        if (nfts.length === 0) {

            return {

                success: false,

                message:
                    "NFT у этого кошелька не найдены"

            };
        }


        /*
            Проверяем каждый NFT.
        */

        for (
            const nft of nfts
        ) {

            console.log(
                "NFT:",
                nft
            );


            let collectionAddress = "";


            /*
                Вариант TonAPI:
                nft.collection.address
            */

            if (
                nft.collection &&
                nft.collection.address
            ) {

                collectionAddress =
                    nft.collection.address;

            }


            /*
                Альтернативное поле.
            */

            if (
                !collectionAddress &&
                nft.collection_address
            ) {

                collectionAddress =
                    nft.collection_address;

            }


            if (!collectionAddress) {

                continue;

            }


            const nftCollectionRaw =
                normalizeAddress(
                    collectionAddress
                );


            console.log(
                "NFT COLLECTION:",
                collectionAddress
            );


            console.log(
                "NFT COLLECTION RAW:",
                nftCollectionRaw
            );


            /*
                СРАВНЕНИЕ
            */

            if (
                nftCollectionRaw ===
                collectionRaw
            ) {

                console.log(
                    "================================"
                );

                console.log(
                    "REQUIRED NFT FOUND"
                );

                console.log(
                    "WALLET:",
                    walletRaw
                );

                console.log(
                    "COLLECTION:",
                    nftCollectionRaw
                );

                console.log(
                    "================================"
                );


                return {

                    success: true,

                    message:
                        "NFT найден"

                };
            }

        }


        /*
            NFT есть, но другой коллекции.
        */

        return {

            success: false,

            message:
                "NFT найдены, но NFT из нужной коллекции не найден"

        };


    } catch (error) {

        console.error(
            "NFT CHECK ERROR:",
            error
        );


        return {

            success: false,

            message:
                "Ошибка проверки NFT: " +
                error.message

        };

    }

}


/* ============================================================
   HOME
============================================================ */

document
    .getElementById(
        "generationButton"
    )
    .addEventListener(
        "click",
        () => {

            if (!accessGranted) {

                generationStatus.textContent =
                    "Нет доступа";

                return;
            }


            generationCode.value =
                "";


            generationStatus.textContent =
                "Введите 5 цифр";


            updateSendButton();


            showScreen(
                generationScreen
            );

        }
    );


document
    .getElementById(
        "galleryButton"
    )
    .addEventListener(
        "click",
        () => {

            if (!accessGranted) {
                return;
            }


            loadGallery();


            showScreen(
                galleryScreen
            );

        }
    );


/* ============================================================
   BACK
============================================================ */

document
    .getElementById(
        "generationBack"
    )
    .addEventListener(
        "click",
        () => {

            showScreen(
                homeScreen
            );

        }
    );


document
    .getElementById(
        "galleryBack"
    )
    .addEventListener(
        "click",
        () => {

            showScreen(
                homeScreen
            );

        }
    );


/* ============================================================
   INPUT
============================================================ */

generationCode.addEventListener(
    "input",
    () => {

        generationCode.value =
            generationCode.value
                .replace(
                    /\D/g,
                    ""
                )
                .substring(
                    0,
                    5
                );


        updateSendButton();

    }
);


/* ============================================================
   SEND BUTTON
============================================================ */

function updateSendButton() {

    const validCode =
        /^\d{5}$/.test(
            generationCode.value
        );


    generationSubmit.disabled =
        !validCode ||
        !currentWallet ||
        !accessGranted;
}


/* ============================================================
   SEND TO YOUR PC
============================================================ */

generationSubmit.addEventListener(
    "click",
    async () => {

        const code =
            generationCode.value.trim();


        if (
            !/^\d{5}$/.test(
                code
            )
        ) {

            generationStatus.textContent =
                "Введите 5 цифр";

            return;
        }


        if (!currentWallet) {

            generationStatus.textContent =
                "Кошелёк не подключён";

            return;
        }


        const payload = {

            code:
                code,

            wallet:
                currentWallet

        };


        console.log(
            "SEND:",
            payload
        );


        generationSubmit.disabled =
            true;


        generationStatus.textContent =
            "Отправка...";


        try {

            const response =
                await fetch(
                    API_URL,
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(
                                payload
                            )

                    }
                );


            const text =
                await response.text();


            console.log(
                "SERVER:",
                text
            );


            let data;


            try {

                data =
                    JSON.parse(
                        text
                    );

            } catch {

                throw new Error(
                    "Сервер вернул не JSON"
                );

            }


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "HTTP " +
                    response.status
                );

            }


            if (
                data.success !== true
            ) {

                throw new Error(
                    data.error ||
                    "Сервер отклонил запрос"
                );

            }


            generationStatus.textContent =
                "Данные отправлены";


            generationCode.value =
                "";


        } catch (error) {

            console.error(
                "SEND ERROR:",
                error
            );


            generationStatus.textContent =
                "Ошибка: " +
                error.message;

        }


        updateSendButton();

    }
);


/* ============================================================
   GALLERY
============================================================ */

function loadGallery() {

    gallery.innerHTML = "";


    for (
        let i = 1;
        i <= 12;
        i++
    ) {

        const item =
            document.createElement(
                "div"
            );


        item.className =
            "galleryItem";


        item.textContent =
            String(i);


        gallery.appendChild(
            item
        );

    }
}


/* ============================================================
   INIT
============================================================ */

updateSendButton();


</script>

</body>
</html>
