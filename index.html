<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;

            background: #000;
            color: #fff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        body {
            -webkit-font-smoothing: antialiased;
            overscroll-behavior: none;
        }

        #viewerScreen {
            touch-action: none;
            overflow: hidden;
            background: #000;
        }

        #viewerCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
        }

        #viewerCanvas canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .viewerHint {
            position: absolute;
            left: 50%;
            bottom: 92px;
            transform: translateX(-50%);
            width: min(92vw, 560px);
            padding: 10px 14px;
            background: rgba(0,0,0,.72);
            border: 1px solid #242424;
            color: #aaa;
            text-align: center;
            font-size: 11px;
            line-height: 1.4;
            pointer-events: none;
            z-index: 20;
            transition: opacity .4s ease;
        }

        .viewerControls {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 18px;
            pointer-events: none;
            z-index: 25;
        }

        .joystickZone,
        .lookZone {
            width: 112px;
            height: 112px;
            position: relative;
            pointer-events: auto;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .joystickBase {
            position: absolute;
            inset: 12px;
            border: 1px solid #444;
            background: rgba(8,8,8,.68);
            border-radius: 50%;
        }

        .joystickKnob {
            position: absolute;
            width: 44px;
            height: 44px;
            left: 50%;
            top: 50%;
            margin-left: -22px;
            margin-top: -22px;
            border: 1px solid #777;
            background: rgba(255,255,255,.12);
            border-radius: 50%;
            transform: translate3d(0,0,0);
        }

        .lookZone {
            border: 1px solid rgba(255,255,255,.12);
            background: rgba(8,8,8,.28);
            border-radius: 12px;
        }

        .lookLabel {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 10px;
            letter-spacing: .5px;
            pointer-events: none;
        }

        .viewerReset {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 40px;
            height: 40px;
            background: rgba(8,8,8,.82);
            color: #fff;
            border: 1px solid #242424;
            font-size: 20px;
            z-index: 30;
            pointer-events: auto;
        }

        .viewerStatus {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: min(88vw, 520px);
            padding: 14px 16px;
            background: rgba(0,0,0,.86);
            border: 1px solid #242424;
            color: #bbb;
            text-align: center;
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-line;
            z-index: 28;
            pointer-events: none;

            .viewerControls {
                bottom: 14px;
                padding: 0 10px;

            .joystickZone,
            .lookZone {

                height: 100px;

                font-size: 10px;

const TON_MANIFEST =

const REQUIRED_COLLECTION =
    "EQD9mm3hx-QvHyNG18gDaaJtSTTQTVVYVjJ6zhonXocj2eyI";


const REQUIRED_COLLECTION_RAW =
    "0:fd9a6de1c7e42f1d8346d7c80369a26d4934d04d5558563eb38689d7a1c8f6";


const GENERATION_API =
    "https://api.araicameragame.party/api/generation";

/* =============================================================
   SCREEN
============================================================= */

function showScreen(screen) {

    document
        .querySelectorAll(".screen")
        .forEach(element => {
            element.classList.remove("active");
        });

    screen.classList.add("active");
}


/* =============================================================
   TON CONNECT
============================================================= */

if (!window.TON_CONNECT_UI) {

    authStatus.textContent =
        "TON Connect не загрузился";

    throw new Error(
        "TON_CONNECT_UI not loaded"
    );
}


const tonConnectUI =
    new TON_CONNECT_UI.TonConnectUI({

        manifestUrl:
            TON_MANIFEST,

        buttonRootId:
            null,

        restoreConnection:
            true

    });


/*
    Важно:

    uiOptions является setter.
    Поэтому присваиваем объект целиком.
*/

tonConnectUI.uiOptions = {

    language: "ru",

    uiPreferences: {
        theme:
            "DARK",

        borderRadius:
            "none"
    }

};


/*
    Наша кнопка открывает
    официальное TON Connect окно.

    Именно внутри этого окна
    TON Connect показывает QR-код
    на desktop.
*/

connectWallet.addEventListener(
    "click",
    async () => {

        try {

            await tonConnectUI.openModal();

        } catch (error) {

            console.error(
                "TON Connect:",
                error
            );

            authStatus.textContent =
                "Ошибка открытия TON Connect";

        }

    }
);


/* =============================================================
   TON ADDRESS
============================================================= */

function base64UrlToBytes(value) {

    let normalized =
        String(value)
            .replace(/-/g, "+")
            .replace(/_/g, "/");


    while (
        normalized.length % 4 !== 0
    ) {

        normalized += "=";

    }


    const binary =
        atob(normalized);


    const bytes =
        new Uint8Array(
            binary.length
        );


    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(i);

    }


    return bytes;

}


function normalizeTonAddress(address) {

    if (!address) {
        return "";
    }


    address =
        String(address).trim();


    /*
        Уже raw:
        0:64hex
    */

    if (
        /^-?\d+:[0-9a-fA-F]{64}$/
            .test(address)
    ) {

        const parts =
            address.split(":");


        return (
            parts[0] +
            ":" +
            parts[1].toLowerCase()
        );

    }


    /*
        Friendly:
        EQ...
        UQ...
    */

    try {

        const bytes =
            base64UrlToBytes(
                address
            );


        if (
            bytes.length !== 36
        ) {

            return address.toLowerCase();

        }


        let workchain =
            bytes[1];


        if (
            workchain === 255
        ) {

            workchain = -1;

        }


        let hash = "";


        for (
            let i = 2;
            i < 34;
            i++
        ) {

            hash +=
                bytes[i]
                    .toString(16)
                    .padStart(2, "0");

        }


        return (
            workchain +
            ":" +
            hash.toLowerCase()
        );

    } catch {

        return address.toLowerCase();

    }

}

/* =============================================================
   NFT CHECK
============================================================= */

async function checkCollectionNFT(
    walletAddress
) {

    const url =
        "https://tonapi.io/v2/accounts/" +
        encodeURIComponent(
            walletAddress
        ) +
        "/nfts?limit=1000";


    const response =
        await fetch(url, {

            method: "GET",

            headers: {
                "Accept":
                    "application/json"
            }

        });


    if (!response.ok) {

        throw new Error(
            "TonAPI HTTP " +
            response.status
        );

    }


    const data =
        await response.json();


    const nftItems =
        Array.isArray(
            data.nft_items
        )
            ? data.nft_items
            : [];


    for (
        const nft of nftItems
    ) {

        const collectionAddress =
            nft.collection?.address ||
            nft.collection_address ||
            "";


        if (!collectionAddress) {
            continue;
        }


        const normalized =
            normalizeTonAddress(
                collectionAddress
            );


        if (
            normalized ===
                normalizedRequiredCollection
            ||
            normalized ===
                REQUIRED_COLLECTION_RAW
        ) {

            return true;

        }

    }


    return false;

}

   WALLET
============================================================= */

let currentWallet =
    null;

let accessGranted =
    false;

let checkingNFT =
    false;


async function processWallet(
    wallet
) {

    if (!wallet) {

        currentWallet =
            null;

        accessGranted =
            false;

        userWalletAddress.textContent =
            "";

        userStatus.textContent =
            "";

        authStatus.textContent =
            "Подключите TON-кошелёк";

        showScreen(
            authScreen
        );

        return;

    }


    if (
        checkingNFT
    ) {

        return;

    }


    if (
        !wallet.account ||
        !wallet.account.address
    ) {

        return;

    }


    currentWallet =
        wallet.account.address;


    accessGranted =
        false;

    checkingNFT =
        true;


    authStatus.textContent =
        "Проверка NFT...";


    loading.classList.add(
        "active"
    );


    try {

        const hasNFT =
            await checkCollectionNFT(
                currentWallet
            );


        if (!hasNFT) {

            accessGranted =
                false;


            authStatus.textContent =
                "NFT нужной коллекции не найден";


            showScreen(
                authScreen
            );


            return;

        }


        accessGranted =
            true;


        userWalletAddress.textContent =
            currentWallet;


        authStatus.textContent =
            "Доступ разрешён";


        showScreen(
            homeScreen
        );


    } catch (error) {

        console.error(
            "NFT CHECK ERROR:",
            error
        );


        accessGranted =
            false;


        authStatus.textContent =
            "Ошибка проверки NFT";


        showScreen(
            authScreen
        );


    } finally {

        checkingNFT =
            false;


        loading.classList.remove(
            "active"
        );

    }

}

/*
    СЦЕНА 7 x 7 x 7

    Центр сцены:
        X = 0
        Y = 0
        Z = 0

    Полный размер:
        X = 7
        Y = 7
        Z = 7

    Периметр:
        -3.5 ... +3.5 по каждой оси.

    Камере оставляется небольшой запас от стен,
    чтобы её положение никогда не выходило за границы.
*/
const SCENE_SIZE = 7.0;
const SCENE_HALF = SCENE_SIZE / 2;
const CAMERA_MARGIN = 0.20;

const SCENE_MIN_X = -SCENE_HALF + CAMERA_MARGIN;
const SCENE_MAX_X =  SCENE_HALF - CAMERA_MARGIN;
const SCENE_MIN_Y = -SCENE_HALF + CAMERA_MARGIN;
const SCENE_MAX_Y =  SCENE_HALF - CAMERA_MARGIN;
const SCENE_MIN_Z = -SCENE_HALF + CAMERA_MARGIN;
const SCENE_MAX_Z =  SCENE_HALF - CAMERA_MARGIN;

/*
    Начальная позиция камеры внутри сцены.
    Камера не находится снаружи и не вращается вокруг модели.
*/
const CAMERA_SPAWN = {
    x: 0,
    y: 1.15,
    z: 2.40
};

const viewerState = {
    yaw: Math.PI,
    pitch: -0.08,

    eyeHeight: 1.15,

    moveSpeed: 2.2,
    turnSpeed: 0.012,
    pitchSpeed: 0.009,

    moveX: 0,
    moveZ: 0,

    loadedSize: 2.0,
    modelRadius: 1.0
};

const joystickState = {
    pointerId: null,
    x: 0,
    y: 0,
    max: 38
};

const lookState = {
    pointerId: null,
    lastX: 0,
    lastY: 0
};

const mouseState = {
    down: false,
    lastX: 0,
    lastY: 0
};

const keyboardState = new Set();
let lastFrameTime = performance.now();

function isMobileDevice() {
    return window.matchMedia("(pointer: coarse)").matches ||
        /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
}

function setViewerStatus(text, visible = true) {
    viewerStatus.textContent = text || "";
    viewerStatus.style.display = visible ? "block" : "none";
}

function updateJoystickVisual() {
    joystickKnob.style.transform =
        `translate3d(${joystickState.x}px, ${joystickState.y}px, 0)`;
}

function resetJoystick() {
    joystickState.x = 0;
    joystickState.y = 0;
    joystickState.pointerId = null;

    viewerState.moveX = 0;
    viewerState.moveZ = 0;

    updateJoystickVisual();
}

function updateJoystickFromPointer(clientX, clientY) {
    const rect = moveJoystick.getBoundingClientRect();

    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    let dx = clientX - cx;
    let dy = clientY - cy;

    const length = Math.hypot(dx, dy);

    if (length > joystickState.max) {
        dx = dx / length * joystickState.max;
        dy = dy / length * joystickState.max;
    }

    joystickState.x = dx;
    joystickState.y = dy;

    viewerState.moveX = dx / joystickState.max;
    viewerState.moveZ = dy / joystickState.max;

    updateJoystickVisual();
}

/*
    Возвращает камеру строго внутрь куба 7x7x7.
    Ограничиваются сразу все три координаты:
        X
        Y
        Z
*/
function clampCameraToScene() {
    if (!camera) return;

    camera.position.x = clamp(
        camera.position.x,
        SCENE_MIN_X,
        SCENE_MAX_X
    );

    camera.position.y = clamp(
        camera.position.y,
        SCENE_MIN_Y,
        SCENE_MAX_Y
    );

    camera.position.z = clamp(
        camera.position.z,
        SCENE_MIN_Z,
        SCENE_MAX_Z
    );
}

/*
    Направление взгляда камеры.
    Камера остаётся на своей позиции и только меняет направление.
*/
function updateCameraLook() {
    if (!camera) return;

    const direction = new THREE.Vector3();

    direction.x =
        -Math.sin(viewerState.yaw) *
        Math.cos(viewerState.pitch);

    direction.y =
        Math.sin(viewerState.pitch);

    direction.z =
        -Math.cos(viewerState.yaw) *
        Math.cos(viewerState.pitch);

    const lookTarget =
        camera.position.clone().add(direction);

    camera.lookAt(lookTarget);
}

/*
    Начальное положение:
    пользователь появляется ВНУТРИ сцены 7x7x7.
*/
function resetViewerCamera() {
    if (!camera) return;

    viewerState.yaw = Math.PI;
    viewerState.pitch = -0.08;

    viewerState.moveX = 0;
    viewerState.moveZ = 0;

    resetJoystick();

    camera.position.set(
        CAMERA_SPAWN.x,
        CAMERA_SPAWN.y,
        CAMERA_SPAWN.z
    );

    clampCameraToScene();
    updateCameraLook();
}

/*
    Движение камеры внутри ограниченного пространства.

    WASD / стрелки на ПК.
    Джойстик на телефоне.

    Камера НЕ может:
        X < -3.3
        X >  3.3
        Y < -3.3
        Y >  3.3
        Z < -3.3
        Z >  3.3
*/
function moveViewer(dt) {
    if (!camera || !viewerReady) return;

    let strafe = viewerState.moveX;
    let forward = -viewerState.moveZ;

    if (
        keyboardState.has("KeyW") ||
        keyboardState.has("ArrowUp")
    ) {
        forward += 1;
    }

    if (
        keyboardState.has("KeyS") ||
        keyboardState.has("ArrowDown")
    ) {
        forward -= 1;
    }

    if (
        keyboardState.has("KeyA") ||
        keyboardState.has("ArrowLeft")
    ) {
        strafe -= 1;
    }

    if (
        keyboardState.has("KeyD") ||
        keyboardState.has("ArrowRight")
    ) {
        strafe += 1;
    }

    const length = Math.hypot(strafe, forward);

    if (length > 1) {
        strafe /= length;
        forward /= length;
    }

    if (
        Math.abs(strafe) < 0.001 &&
        Math.abs(forward) < 0.001
    ) {
        clampCameraToScene();
        updateCameraLook();
        return;
    }

    const speed =
        viewerState.moveSpeed * dt;

    /*
        Направление вперёд относительно yaw.
    */
    const forwardX = -Math.sin(viewerState.yaw);
    const forwardZ = -Math.cos(viewerState.yaw);

    /*
        Направление вправо относительно yaw.
    */
    const rightX = Math.cos(viewerState.yaw);
    const rightZ = -Math.sin(viewerState.yaw);

    let x =
        camera.position.x +
        (forwardX * forward + rightX * strafe) * speed;

    let z =
        camera.position.z +
        (forwardZ * forward + rightZ * strafe) * speed;

    /*
        По высоте камера остаётся на уровне глаз.
        Это обычное перемещение по полу сцены.
    */
    let y = viewerState.eyeHeight;

    /*
        Жёсткое ограничение 7x7x7.
    */
    x = clamp(
        x,
        SCENE_MIN_X,
        SCENE_MAX_X
    );

    z = clamp(
        z,
        SCENE_MIN_Z,
        SCENE_MAX_Z
    );

    y = clamp(
        y,
        SCENE_MIN_Y,
        SCENE_MAX_Y
    );

    camera.position.set(x, y, z);

    clampCameraToScene();
    updateCameraLook();
}

function disposeMaterial(material) {
    if (!material) return;

    const materials =
        Array.isArray(material)
            ? material
            : [material];

    for (const mat of materials) {
        if (!mat) continue;

        const textureKeys = [
            "map",
            "normalMap",
            "roughnessMap",
            "metalnessMap",
            "emissiveMap",
            "aoMap",
            "alphaMap",
            "bumpMap",
            "displacementMap",
            "clearcoatMap",
            "clearcoatNormalMap",
            "clearcoatRoughnessMap",
            "iridescenceThicknessMap",
            "sheenColorMap",
            "sheenRoughnessMap",
            "specularColorMap",
            "specularIntensityMap",
            "transmissionMap",
            "thicknessMap"
        ];

        for (const key of textureKeys) {
            if (
                mat[key] &&
                mat[key].isTexture
            ) {
                mat[key].dispose();
            }
        }

        mat.dispose();
    }
}

function disposeModel() {
    if (!model || !scene) return;

    scene.remove(model);

    model.traverse(object => {
        if (object.geometry) {
            object.geometry.dispose();
        }

        if (object.material) {
            disposeMaterial(object.material);
        }
    });

    model = null;
    viewerReady = false;
}

function prepareModel(loadedModel) {
    const box =
        new THREE.Box3().setFromObject(loadedModel);

    const center =
        box.getCenter(new THREE.Vector3());

    const size =
        box.getSize(new THREE.Vector3());

    const maxSize =
        Math.max(
            size.x,
            size.y,
            size.z
        );

    if (
        !Number.isFinite(maxSize) ||
        maxSize <= 0
    ) {
        throw new Error(
            "GLB не содержит корректной геометрии"
        );
    }

    loadedModel.position.sub(center);

    /*
        Модель остаётся прежнего нормализованного размера.
        Меняется только управление камерой.
    */
    loadedModel.scale.setScalar(
        2 / maxSize
    );

    loadedModel.updateMatrixWorld(true);

    const normalizedBox =
        new THREE.Box3().setFromObject(
            loadedModel
        );

    const normalizedSize =
        normalizedBox.getSize(
            new THREE.Vector3()
        );

    const normalizedCenter =
        normalizedBox.getCenter(
            new THREE.Vector3()
        );

    const sphere =
        new THREE.Sphere();

    normalizedBox.getBoundingSphere(sphere);

    loadedModel.position.y -=
        normalizedCenter.y;

    loadedModel.updateMatrixWorld(true);

    viewerState.loadedSize =
        Math.max(
            normalizedSize.x,
            normalizedSize.y,
            normalizedSize.z
        );

    viewerState.modelRadius =
        Math.max(
            0.65,
            sphere.radius
        );

    viewerState.eyeHeight =
        clamp(
            normalizedSize.y * 0.35,
            0.65,
            1.15
        );

    /*
        Высота появления пользователя.
    */
    CAMERA_SPAWN.y =
        viewerState.eyeHeight;

    loadedModel.traverse(object => {
        if (!object.isMesh) return;

        object.castShadow = false;
        object.receiveShadow = false;

        if (object.material) {
            const mats =
                Array.isArray(object.material)
                    ? object.material
                    : [object.material];

            for (const mat of mats) {
                if (!mat) continue;

                if ("envMapIntensity" in mat) {
                    mat.envMapIntensity = 0.7;
                }
            }
        }
    });

    return loadedModel;
}

function createSceneBoundary() {
    /*
        Видимая граница 7x7x7.
        Она не влияет на загрузку GLB и не мешает камере.
        Прозрачная линия показывает пользователю предел сцены.
    */

    if (!scene) return;

    const geometry =
        new THREE.BoxGeometry(
            SCENE_SIZE,
            SCENE_SIZE,
            SCENE_SIZE
        );

    const edges =
        new THREE.EdgesGeometry(
            geometry
        );

    const material =
        new THREE.LineBasicMaterial({
            color: 0x303030,
            transparent: true,
            opacity: 0.35
        });

    const boundary =
        new THREE.LineSegments(
            edges,
            material
        );

    boundary.name =
        "SCENE_BOUNDARY_7x7x7";

    scene.add(boundary);

    geometry.dispose();
}

function initViewer() {
    if (renderer) return;

    scene = new THREE.Scene();

    scene.background =
        new THREE.Color(0x000000);

    camera =
        new THREE.PerspectiveCamera(
            55,
            1,
            0.03,
            200
        );

    renderer =
        new THREE.WebGLRenderer({
            antialias: !isMobileDevice(),
            alpha: false,
            powerPreference: "high-performance",
            precision:
                isMobileDevice()
                    ? "mediump"
                    : "highp"
        });

    const pixelRatio =
        isMobileDevice()
            ? Math.min(
                window.devicePixelRatio || 1,
                1.35
            )
            : Math.min(
                window.devicePixelRatio || 1,
                1.75
            );

    renderer.setPixelRatio(
        pixelRatio
    );

    renderer.setSize(
        viewerCanvas.clientWidth ||
            window.innerWidth,
        viewerCanvas.clientHeight ||
            window.innerHeight,
        false
    );

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;

    renderer.toneMapping =
        THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure =
        1.0;

    renderer.domElement.setAttribute(
        "aria-label",
        "3D сцена"
    );

    viewerCanvas.appendChild(
        renderer.domElement
    );

    const ambient =
        new THREE.HemisphereLight(
            0xffffff,
            0x222222,
            2.2
        );

    scene.add(ambient);

    const key =
        new THREE.DirectionalLight(
            0xffffff,
            2.2
        );

    key.position.set(
        4,
        7,
        5
    );

    scene.add(key);

    const fill =
        new THREE.DirectionalLight(
            0xffffff,
            0.8
        );

    fill.position.set(
        -4,
        3,
        -4
    );

    scene.add(fill);

    /*
        Создаём ограничивающий куб 7x7x7.
    */
    createSceneBoundary();

    window.addEventListener(
        "resize",
        resizeViewer,
        { passive: true }
    );

    /*
        ПК: мышь вращает камеру.
        Позиция камеры при этом не меняется.
    */
    renderer.domElement.addEventListener(
        "pointerdown",
        event => {
            if (event.pointerType !== "mouse") {
                return;
            }

            mouseState.down = true;

            mouseState.lastX =
                event.clientX;

            mouseState.lastY =
                event.clientY;

            renderer.domElement.setPointerCapture?.(
                event.pointerId
            );
        }
    );

    renderer.domElement.addEventListener(
        "pointermove",
        event => {
            if (
                !mouseState.down ||
                event.pointerType !== "mouse"
            ) {
                return;
            }

            const dx =
                event.clientX -
                mouseState.lastX;

            const dy =
                event.clientY -
                mouseState.lastY;

            mouseState.lastX =
                event.clientX;

            mouseState.lastY =
                event.clientY;

            viewerState.yaw +=
                dx * 0.008;

            viewerState.pitch =
                clamp(
                    viewerState.pitch -
                        dy * 0.006,
                    -0.95,
                    0.55
                );

            updateCameraLook();
        }
    );

    renderer.domElement.addEventListener(
        "pointerup",
        () => {
            mouseState.down = false;
        }
    );

    renderer.domElement.addEventListener(
        "pointercancel",
        () => {
            mouseState.down = false;
        }
    );

    /*
        Колесо мыши больше не выносит камеру
        на другой радиус.
        Оно не нужно для FPS-камеры.
    */
    renderer.domElement.addEventListener(
        "wheel",
        event => {
            event.preventDefault();
        },
        { passive: false }
    );

    /*
        ТЕЛЕФОН:
        левый круг — движение.
    */
    moveJoystick.addEventListener(
        "pointerdown",
        event => {
            event.preventDefault();

            joystickState.pointerId =
                event.pointerId;

            moveJoystick.setPointerCapture?.(
                event.pointerId
            );

            updateJoystickFromPointer(
                event.clientX,
                event.clientY
            );
        }
    );

    moveJoystick.addEventListener(
        "pointermove",
        event => {
            if (
                event.pointerId !==
                joystickState.pointerId
            ) {
                return;
            }

            event.preventDefault();

            updateJoystickFromPointer(
                event.clientX,
                event.clientY
            );
        }
    );

    moveJoystick.addEventListener(
        "pointerup",
        event => {
            if (
                event.pointerId ===
                joystickState.pointerId
            ) {
                resetJoystick();
            }
        }
    );

    moveJoystick.addEventListener(
        "pointercancel",
        event => {
            if (
                event.pointerId ===
                joystickState.pointerId
            ) {
                resetJoystick();
            }
        }
    );

    /*
        ТЕЛЕФОН:
        правое поле — обзор.
    */
    lookZone.addEventListener(
        "pointerdown",
        event => {
            event.preventDefault();

            lookState.pointerId =
                event.pointerId;

            lookState.lastX =
                event.clientX;

            lookState.lastY =
                event.clientY;

            lookZone.setPointerCapture?.(
                event.pointerId
            );
        }
    );

    lookZone.addEventListener(
        "pointermove",
        event => {
            if (
                event.pointerId !==
                lookState.pointerId
            ) {
                return;
            }

            event.preventDefault();

            const dx =
                event.clientX -
                lookState.lastX;

            const dy =
                event.clientY -
                lookState.lastY;

            lookState.lastX =
                event.clientX;

            lookState.lastY =
                event.clientY;

            viewerState.yaw +=
                dx * viewerState.turnSpeed;

            viewerState.pitch =
                clamp(
                    viewerState.pitch -
                        dy * viewerState.pitchSpeed,
                    -0.95,
                    0.55
                );

            updateCameraLook();
        }
    );

    const releaseLook =
        event => {
            if (
                event.pointerId ===
                lookState.pointerId
            ) {
                lookState.pointerId =
                    null;
            }
        };

    lookZone.addEventListener(
        "pointerup",
        releaseLook
    );

    lookZone.addEventListener(
        "pointercancel",
        releaseLook
    );

    viewerReset.addEventListener(
        "click",
        resetViewerCamera
    );

    /*
        КЛАВИАТУРА ПК.
    */
    window.addEventListener(
        "keydown",
        event => {
            if (
                [
                    "KeyW",
                    "KeyA",
                    "KeyS",
                    "KeyD",
                    "ArrowUp",
                    "ArrowDown",
                    "ArrowLeft",
                    "ArrowRight"
                ].includes(event.code)
            ) {
                keyboardState.add(
                    event.code
                );

                event.preventDefault();
            }
        },
        { passive: false }
    );

    window.addEventListener(
        "keyup",
        event => {
            keyboardState.delete(
                event.code
            );
        }
    );

    window.addEventListener(
        "blur",
        () => {
            keyboardState.clear();

            mouseState.down = false;

            resetJoystick();
        }
    );

    setViewerStatus(
        "Готово",
        false
    );

    resizeViewer();

    resetViewerCamera();

    animateViewer();
}

function resizeViewer() {
    if (!camera || !renderer) {
        return;
    }

    const width =
        Math.max(
            1,
            viewerCanvas.clientWidth ||
                window.innerWidth
        );

    const height =
        Math.max(
            1,
            viewerCanvas.clientHeight ||
                window.innerHeight
        );

    camera.aspect =
        width / height;

    camera.updateProjectionMatrix();

    renderer.setSize(
        width,
        height,
        false
    );

    /*
        Дополнительная страховка
        после изменения окна.
    */
    clampCameraToScene();
    updateCameraLook();
}

function animateViewer(
    now = performance.now()
) {
    requestAnimationFrame(
        animateViewer
    );

    const dt =
        Math.min(
            0.05,
            Math.max(
                0,
                (now - lastFrameTime) /
                    1000
            )
        );

    lastFrameTime = now;

    moveViewer(dt);

    if (
        renderer &&
        scene &&
        camera
    ) {
        renderer.render(
            scene,
            camera
        );
    }
}

async function loadModelDirect(
    url,
    token,
    label
) {
    return new Promise(
        (resolve, reject) => {
            const finalUrl =
                url +
                (url.includes("?")
                    ? "&"
                    : "?") +
                "v=" +
                Date.now();

            setViewerStatus(
                `Загрузка ${label}...`,
                true
            );

            loader.load(
                finalUrl,
                gltf => {
                    if (
                        token !==
                        viewerLoadToken
                    ) {
                        resolve(false);
                        return;
                    }

                    try {
                        disposeModel();

                        model =
                            prepareModel(
                                gltf.scene
                            );

                        scene.add(model);

                        viewerReady =
                            true;

                        resetViewerCamera();

                        setViewerStatus(
                            "",
                            false
                        );

                        resolve(true);
                    } catch (error) {
                        reject(error);
                    }
                },
                xhr => {
                    if (!xhr) return;

                    if (xhr.total > 0) {
                        const percent =
                            Math.round(
                                xhr.loaded /
                                    xhr.total *
                                    100
                            );

                        setViewerStatus(
                            `Загрузка ${label}: ${percent}%`,
                            true
                        );
                    } else if (
                        xhr.loaded > 0
                    ) {
                        const mb =
                            (
                                xhr.loaded /
                                1024 /
                                1024
                            ).toFixed(1);

                        setViewerStatus(
                            `Загрузка ${label}: ${mb} MB`,
                            true
                        );
                    }
                },
                error => {
                    reject(
                        error ||
                        new Error(
                            "GLTFLoader не смог загрузить GLB"
                        )
                    );
                }
            );
        }
    );
}

async function loadModelFallback(
    url,
    token,
    label
) {
    /*
        Fallback is used only after the
        normal GLTFLoader request fails.
    */
    const response =
        await fetch(
            url +
            (url.includes("?")
                ? "&"
                : "?") +
            "retry=" +
            Date.now(),
            {
                method: "GET",
                mode: "cors",
                cache: "no-store",
                credentials: "omit",
                headers: {
                    "Accept":
                        "model/gltf-binary,application/octet-stream,*/*"
                }
            }
        );

    if (!response.ok) {
        throw new Error(
            `HTTP ${response.status}`
        );
    }

    const contentType =
        (
            response.headers.get(
                "content-type"
            ) || ""
        ).toLowerCase();

    if (
        contentType.includes(
            "text/html"
        ) ||
        contentType.includes(
            "application/json"
        )
    ) {
        throw new Error(
            `Сервер вернул ${contentType}, а не GLB`
        );
    }

    const buffer =
        await response.arrayBuffer();

    if (
        buffer.byteLength < 20
    ) {
        throw new Error(
            "Файл GLB слишком маленький или пустой"
        );
    }

    const magic =
        new DataView(buffer)
            .getUint32(0, true);

    if (
        magic !== 0x46546c67
    ) {
        throw new Error(
            "Ответ сервера не является GLB (нет magic glTF)"
        );
    }

    if (
        token !== viewerLoadToken
    ) {
        return false;
    }

    setViewerStatus(
        `Распаковка ${label}...`,
        true
    );

    const gltf =
        await loader.parseAsync(
            buffer,
            new URL(url)
                .href
                .replace(
                    /[^/]*$/,
                    ""
                )
        );

    if (
        token !== viewerLoadToken
    ) {
        return false;
    }

    disposeModel();

    model =
        prepareModel(
            gltf.scene
        );

    scene.add(model);

    viewerReady = true;

    resetViewerCamera();

    setViewerStatus(
        "",
        false
    );

    return true;
}

async function loadModelIntoViewer(
    url,
    label
) {
    if (!url) {
        setViewerStatus(
            "У модели отсутствует URL.",
            true
        );

        return;
    }

    const token =
        ++viewerLoadToken;

    viewerReady = false;

    disposeModel();

    setViewerStatus(
        `Подготовка ${label}...`,
        true
    );

    try {
        await loadModelDirect(
            url,
            token,
            label
        );

        return;
    } catch (firstError) {
        console.error(
            "GLB direct load failed:",
            firstError
        );

        try {
            await loadModelFallback(
                url,
                token,
                label
            );

            return;
        } catch (secondError) {
            console.error(
                "GLB fallback load failed:",
                secondError
            );

            if (
                token !== viewerLoadToken
            ) {
                return;
            }

            const message =
                secondError?.message ||
                firstError?.message ||
                "Неизвестная ошибка";

            setViewerStatus(
                `Не удалось загрузить GLB.\n${message}\n\nПроверьте CORS, доступность файла и память телефона.`,
                true
            );
        }
    }
}

function resolveArchiveUrl(item) {
    if (!item) return "";

    if (
        typeof item.url === "string" &&
        item.url.startsWith("http")
    ) {
        return item.url;
    }

    if (
        typeof item.download_url === "string" &&
        item.download_url.startsWith("http")
    ) {
        return item.download_url;
    }

    if (
        typeof item.file_url === "string" &&
        item.file_url.startsWith("http")
    ) {
        return item.file_url;
    }

    if (
        item.id !== undefined &&
        item.id !== null
    ) {
        return `${ARCHIVE_API}/file/${encodeURIComponent(item.id)}`;
    }

    return "";
}

function openViewer(index) {
    viewerOpenedFromArchive = false;

    if (!requireAccess()) return;

    const item =
        galleryItems[index];

    if (!item) return;

    viewerNumber.textContent =
        item.number;

    showScreen(viewerScreen);

    initViewer();

    const url =
        MODEL_BASE +
        encodeURIComponent(
            item.filename
        );

    loadModelIntoViewer(
        url,
        item.filename
    );
}

function openArchiveViewer(index) {
    viewerOpenedFromArchive = true;

    if (!requireAccess()) return;

    const item =
        archiveModels[index];

    if (!item) return;

    viewerNumber.textContent =
        item.filename ||
        "3D";

    showScreen(viewerScreen);

    initViewer();

    const url =
        resolveArchiveUrl(item);

    if (!url) {
        setViewerStatus(
            "У модели нет доступного URL.",
            true
        );

        return;
    }

    loadModelIntoViewer(
        url,
        item.filename ||
            "3D модель"
    );
}
