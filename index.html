 <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>AR Camera</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="startScreen">

    <div class="start-content">

        <h1>AR SPACE</h1>

        <p>
            Дополненная реальность
        </p>

        <button id="startAR">
            ЗАПУСК КАМЕРЫ
        </button>

        <div id="status">
            Проверка устройства...
        </div>

    </div>

</div>

<div id="arInterface">

    <button id="exitAR">
        ×
    </button>

    <div id="instruction">
        Наведите камеру на поверхность
    </div>

    <button id="placeObject">
        РАЗМЕСТИТЬ ОБЪЕКТ
    </button>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
