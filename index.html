<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 maximum-scale=1,
                 user-scalable=no,
                 viewport-fit=cover"
    >

    <title>AR Gallery</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;

            overflow: hidden;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #000;
            color: white;
        }

        body {
            touch-action: none;
        }

        button {
            border: none;
            outline: none;
            font: inherit;
        }

        /* --------------------------------
           ОБЩИЙ ЭКРАН
        -------------------------------- */

        .screen {
            position: fixed;

            inset: 0;

            display: none;

            width: 100%;
            height: 100%;

            background: #000;
        }

        .screen.active {
            display: flex;
        }

        /* --------------------------------
           ГЛАВНЫЙ ЭКРАН
        -------------------------------- */

        #homeScreen {
            align-items: center;
            justify-content: center;

            padding:
                max(20px, env(safe-area-inset-top))
                20px
                max(20px, env(safe-area-inset-bottom))
                20px;
        }

        .homeContent {
            width: min(500px, 100%);

            display: flex;
            flex-direction: column;

            align-items: center;

            gap: 30px;
        }

        .logo {
            width: 110px;
            height: 110px;

            border: 1px solid #333;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 42px;

            background:
                radial-gradient(
                    circle,
                    #252525,
                    #050505
                );
        }

        .title {
            font-size: clamp(28px, 8vw, 48px);
            font-weight: 600;

            letter-spacing: -1px;

            text-align: center;
        }

        .subtitle {
            color: #888;

            text-align: center;

            font-size: 15px;

            max-width: 300px;

            line-height: 1.5;
        }

        .mainButton {
            width: 100%;
            max-width: 320px;

            min-height: 58px;

            border-radius: 18px;

            background: white;

            color: black;

            font-weight: 600;

            font-size: 17px;

            cursor: pointer;

            transition:
                transform .15s,
                opacity .15s;
        }

        .mainButton:active {
            transform: scale(.97);
            opacity: .8;
        }

        /* --------------------------------
           ГАЛЕРЕЯ
        -------------------------------- */

        #galleryScreen {
            flex-direction: column;

            padding:
                max(20px, env(safe-area-inset-top))
                20px
                max(20px, env(safe-area-inset-bottom))
                20px;
        }

        .galleryHeader {
            display: flex;
            align-items: center;

            width: 100%;

            height: 60px;
        }

        .backButton {
            width: 44px;
            height: 44px;

            border-radius: 14px;

            background: #181818;

            color: white;

            font-size: 23px;

            cursor: pointer;
        }

        .galleryTitle {
            flex: 1;

            text-align: center;

            font-size: 21px;

            font-weight: 600;
        }

        .galleryGrid {
            flex: 1;

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(100px, 1fr)
                );

            gap: 14px;

            width: 100%;

            max-width: 600px;

            margin: auto;

            align-content: center;
        }

        .numberButton {
            aspect-ratio: 1;

            border-radius: 24px;

            background: #151515;

            border: 1px solid #2a2a2a;

            color: white;

            font-size: clamp(28px, 9vw, 52px);

            font-weight: 500;

            cursor: pointer;

            transition:
                transform .15s,
                background .15s;
        }

        .numberButton:active {
            transform: scale(.94);
            background: #292929;
        }

        /* --------------------------------
           3D ЭКРАН
        -------------------------------- */

        #viewerScreen {
            background: #000;
        }

        #canvasContainer {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;

            width: 100%;
            height: 100%;
        }

        /* --------------------------------
           UI 3D
        -------------------------------- */

        .viewerTop {
            position: absolute;

            z-index: 10;

            top:
                max(12px, env(safe-area-inset-top));

            left: 12px;
            right: 12px;

            display: flex;

            align-items: center;

            pointer-events: none;
        }

        .viewerBack {
            pointer-events: auto;

            width: 44px;
            height: 44px;

            border-radius: 14px;

            background: rgba(20,20,20,.75);

            color: white;

            backdrop-filter: blur(10px);

            font-size: 22px;
        }

        .viewerName {
            margin-left: 12px;

            padding: 10px 15px;

            border-radius: 14px;

            background: rgba(20,20,20,.7);

            backdrop-filter: blur(10px);

            font-size: 14px;
        }

        .sensorButton {
            position: absolute;

            z-index: 10;

            left: 50%;

            transform: translateX(-50%);

            bottom:
                max(25px, env(safe-area-inset-bottom));

            width: calc(100% - 40px);

            max-width: 350px;

            min-height: 54px;

            border-radius: 18px;

            background: rgba(255,255,255,.94);

            color: black;

            font-weight: 600;

            font-size: 16px;

            backdrop-filter: blur(12px);
        }

        .sensorStatus {
            position: absolute;

            z-index: 10;

            top: 70px;

            left: 50%;

            transform: translateX(-50%);

            padding: 8px 13px;

            border-radius: 12px;

            background: rgba(0,0,0,.65);

            color: #aaa;

            font-size: 12px;

            white-space: nowrap;

            pointer-events: none;
        }

        .hint {
            position: absolute;

            z-index: 5;

            left: 50%;

            bottom: 95px;

            transform: translateX(-50%);

            color: rgba(255,255,255,.55);

            font-size: 12px;

            text-align: center;

            pointer-events: none;
        }

        .loader {
            position: absolute;

            z-index: 20;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #000;
        }

        .loader.hidden {
            display: none;
        }

        .loaderText {
            color: #aaa;
            font-size: 14px;
        }

        /* --------------------------------
           АДАПТАЦИЯ
        -------------------------------- */

        @media (orientation: landscape) {

            .galleryGrid {
                grid-template-columns:
                    repeat(3, minmax(100px, 160px));

                justify-content: center;
            }

            .homeContent {
                max-width: 420px;
            }
        }
    </style>
</head>

<body>

<!-- =====================================
     ГЛАВНЫЙ ЭКРАН
====================================== -->

<section
    id="homeScreen"
    class="screen active"
>

    <div class="homeContent">

        <div class="logo">
            ◇
        </div>

        <div class="title">
            AR Gallery
        </div>

        <div class="subtitle">
            Галерея цифровых существ
            в интерактивном 3D-пространстве
        </div>

        <button
            id="openGallery"
            class="mainButton"
        >
            Открытие галереи
        </button>

    </div>

</section>


<!-- =====================================
     ГАЛЕРЕЯ
====================================== -->

<section
    id="galleryScreen"
    class="screen"
>

    <div class="galleryHeader">

        <button
            id="galleryBack"
            class="backButton"
        >
            ‹
        </button>

        <div class="galleryTitle">
            Галерея
        </div>

    </div>


    <div class="galleryGrid">

        <button
            class="numberButton"
            data-model="creature.glb"
        >
            1
        </button>

        <button
            class="numberButton"
            data-model="creature.glb"

        </button>

        <button
            class="numberButton"
            data-model="creature.glb"

        </button>

</section>


<!-- =====================================
     3D ПРОСМОТР
====================================== -->

<section
    id="viewerScreen"
    class="screen"
>

    <div id="canvasContainer"></div>

    <div class="viewerTop">

        <button
            id="viewerBack"
            class="viewerBack"
        >
            ‹
        </button>

        <div
            id="viewerName"
            class="viewerName"
        >
            Creature
        </div>

    </div>


    <div
        id="sensorStatus"
        class="sensorStatus"
    >
        Сенсоры выключены
    </div>


    <div class="hint">
        Поворачивайте телефон,
        чтобы осмотреть объект
    </div>


    <button
        id="sensorButton"
        class="sensorButton"
    >
        Включить движение телефона
    </button>


    <div
        id="loader"
        class="loader hidden"
    >
        <div class="loaderText">
            Загрузка 3D модели...
        </div>
    </div>

</section>


<script type="module">

import * as THREE from "three";

import { GLTFLoader }
    from "three/addons/loaders/GLTFLoader.js";

import { OrbitControls }
    from "three/addons/controls/OrbitControls.js";


/* =========================================================
   TELEGRAM
========================================================= */

const tg = window.Telegram?.WebApp;

if (tg) {

    tg.ready();

    tg.expand();

    /*
       Просим Telegram использовать
       максимальную площадь Mini App.
    */

    if (tg.setHeaderColor) {
        tg.setHeaderColor("#000000");
    }

    if (tg.setBackgroundColor) {
        tg.setBackgroundColor("#000000");
    }
}


/* =========================================================
   ЭКРАНЫ
========================================================= */

const homeScreen =
    document.getElementById("homeScreen");

const galleryScreen =
    document.getElementById("galleryScreen");

const viewerScreen =
    document.getElementById("viewerScreen");


function showScreen(screen) {

    document
        .querySelectorAll(".screen")
        .forEach(el => {
            el.classList.remove("active");
        });

    screen.classList.add("active");
}


/* =========================================================
   ГЛАВНЫЙ ЭКРАН
========================================================= */

document
    .getElementById("openGallery")
    .addEventListener("click", () => {

        showScreen(galleryScreen);

    });


/* =========================================================
   НАЗАД
========================================================= */

document
    .getElementById("galleryBack")
    .addEventListener("click", () => {

        showScreen(homeScreen);

    });


document
    .getElementById("viewerBack")
    .addEventListener("click", () => {

        stopSensor();

        showScreen(galleryScreen);

    });


/* =========================================================
   THREE.JS
========================================================= */

const container =
    document.getElementById("canvasContainer");

let scene;
let camera;
let renderer;

let model = null;

let controls;

let animationId;


/*
   Отдельный pivot.

   Модель находится внутри него.

   ВАЖНО:

   модель сама НЕ вращается.

   Вращается камера вокруг центра.

   Поэтому модель физически остается
   закрепленной в центре координат.
*/

const cameraRig =
    new THREE.Object3D();

let targetCameraQuaternion =
    new THREE.Quaternion();

let currentCameraQuaternion =
    new THREE.Quaternion();


function initThree() {

    scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(0x000000);


    /* -----------------------------
       КАМЕРА
    ----------------------------- */

    camera =
        new THREE.PerspectiveCamera(
            45,
            window.innerWidth /
            window.innerHeight,
            0.01,
            1000
        );


    camera.position.set(
        0,
        0.5,
        3
    );


    /* -----------------------------
       RIG
    ----------------------------- */

    cameraRig.add(camera);

    scene.add(cameraRig);


    /* -----------------------------
       СВЕТ
    ----------------------------- */

    const ambient =
        new THREE.HemisphereLight(
            0xffffff,
            0x222222,
            2.2
        );

    scene.add(ambient);


    const keyLight =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );

    keyLight.position.set(
        3,
        5,
        4
    );

    scene.add(keyLight);


    const fillLight =
        new THREE.DirectionalLight(
            0x888888,
            1.2
        );

    fillLight.position.set(
        -4,
        2,
        -4
    );

    scene.add(fillLight);


    /* -----------------------------
       RENDERER
    ----------------------------- */

    renderer =
        new THREE.WebGLRenderer({
            antialias: true,
            alpha: false,
            powerPreference: "high-performance"
        });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;

    container.appendChild(
        renderer.domElement
    );


    /* -----------------------------
       TOUCH / MOUSE
       резервное управление
    ----------------------------- */

    controls =
        new OrbitControls(
            camera,
            renderer.domElement
        );

    controls.enableDamping = true;

    controls.dampingFactor = 0.08;

    controls.enablePan = false;

    controls.minDistance = 1;

    controls.maxDistance = 8;

    controls.target.set(
        0,
        0,
        0
    );


    /*
       По умолчанию разрешаем ручное
       вращение пальцем.

       После включения сенсора
       его можно использовать как
       основной способ управления.
    */

    controls.enabled = true;


    window.addEventListener(
        "resize",
        resize
    );


    animate();
}


/* =========================================================
   ЗАГРУЗКА МОДЕЛИ
========================================================= */

const loader =
    new GLTFLoader();


/*
   GitHub raw URL.

   Файл:
   models/creature.glb

   Репозиторий:
   Roman22022000/ArGameCam
*/

const MODEL_BASE =
    "https://raw.githubusercontent.com/" +
    "Roman22022000/ArGameCam/main/models/";


function loadModel(filename) {

    const loading =
        document.getElementById("loader");

    loading.classList.remove("hidden");


    if (model) {

        scene.remove(model);

        model.traverse(object => {

            if (object.isMesh) {

                object.geometry?.dispose();

                if (Array.isArray(object.material)) {

                    object.material.forEach(
                        material => material.dispose()
                    );

                } else {

                    object.material?.dispose();

                }

            }

        });

        model = null;
    }


    const url =
        MODEL_BASE + filename;


    loader.load(

        url,

        gltf => {

            model = gltf.scene;


            /*
               ------------------------------------------------
               ЦЕНТР КООРДИНАТ
               ------------------------------------------------

               Сначала вычисляем BoundingBox.
            */

            const box =
                new THREE.Box3()
                    .setFromObject(model);


            const center =
                box.getCenter(
                    new THREE.Vector3()
                );


            /*
               Перемещаем модель так,
               чтобы ее геометрический центр
               совпал с:

                    X = 0
                    Y = 0
                    Z = 0
            */

            model.position.sub(center);


            /*
               ------------------------------------------------
               НОРМАЛИЗАЦИЯ РАЗМЕРА
               ------------------------------------------------
            */

            const size =
                box.getSize(
                    new THREE.Vector3()
                );


            const maxSize =
                Math.max(
                    size.x,
                    size.y,
                    size.z
                );


            if (maxSize > 0) {

                const desiredSize = 2;

                const scale =
                    desiredSize / maxSize;

                model.scale.setScalar(scale);

            }


            /*
               Модель добавляется непосредственно
               в мировые координаты.

               Она не зависит от телефона.
            */

            scene.add(model);


            /*
               Камера снова смотрит в центр.
            */

            controls.target.set(
                0,
                0,
                0
            );

            controls.update();


            loading.classList.add(
                "hidden"
            );

        },

        xhr => {

            if (xhr.total) {

                const progress =
                    Math.round(
                        xhr.loaded /
                        xhr.total *
                        100
                    );

                document
                    .querySelector(".loaderText")
                    .textContent =
                    `Загрузка ${progress}%`;

            }

        },

        error => {

            console.error(
                "Ошибка загрузки модели:",
                error
            );

            document
                .querySelector(".loaderText")
                .textContent =
                "Ошибка загрузки модели";

        }
    );
}


/* =========================================================
   ВЫБОР МОДЕЛИ
========================================================= */

document
    .querySelectorAll(".numberButton")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                const filename =
                    button.dataset.model;


                document
                    .getElementById("viewerName")
                    .textContent =
                    "Creature " +
                    button.textContent;


                showScreen(viewerScreen);


                /*
                   Инициализируем Three.js только
                   при первом открытии.
                */

                if (!renderer) {

                    initThree();

                }


                loadModel(filename);

            }
        );

    });


/* =========================================================
   TELEGRAM DEVICE ORIENTATION
========================================================= */

let sensorEnabled = false;


/*
   Начальная ориентация телефона.

   Она используется как нулевая точка.

   Это важно:

   пользователь открывает модель,
   нажимает "Включить движение",
   текущая ориентация телефона становится
   стартовой.

   После этого дальнейшее вращение
   телефона используется для обзора.
*/

let startAlpha = null;
let startBeta = null;
let startGamma = null;


/*
   Плавность движения камеры.
*/

const sensorSmooth =
    0.12;


/*
   Углы, которые используются
   для управления камерой.
*/

let sensorYaw = 0;
let sensorPitch = 0;


/* =========================================================
   ЗАПУСК СЕНСОРА
========================================================= */

async function startSensor() {

    const status =
        document.getElementById(
            "sensorStatus"
        );

    const button =
        document.getElementById(
            "sensorButton"
        );


    /*
       -----------------------------------------------------
       НОВЫЙ TELEGRAM API
       -----------------------------------------------------

       Telegram Mini Apps имеют
       DeviceOrientation API.

       Используем его первым.
    */

    if (
        tg &&
        tg.DeviceOrientation &&
        typeof tg.DeviceOrientation.start === "function"
    ) {

        try {

            tg.DeviceOrientation.start({
                refresh_rate: 20,
                need_absolute: true
            });


            /*
               Telegram присылает событие:

               device_orientation_changed
            */

            if (
                typeof tg.onEvent === "function"
            ) {

                tg.onEvent(
                    "deviceOrientationChanged",
                    handleTelegramOrientation
                );

            }


            sensorEnabled = true;

            button.textContent =
                "Движение телефона включено";

            status.textContent =
                "Сенсоры Telegram активны";


            /*
               Отключаем OrbitControls,
               чтобы два управления
               не конфликтовали.
            */

            controls.enabled = false;


            return;

        } catch (error) {

            console.warn(
                "Telegram DeviceOrientation:",
                error
            );

        }

    }


    /*
       -----------------------------------------------------
       FALLBACK
       -----------------------------------------------------

       Используется если Mini App открыт
       не в клиенте Telegram,
       например напрямую в Safari/Chrome.
    */

    if (
        typeof DeviceOrientationEvent !==
        "undefined" &&
        typeof DeviceOrientationEvent.requestPermission ===
        "function"
    ) {

        try {

            const permission =
                await DeviceOrientationEvent
                    .requestPermission(true);


            if (permission !== "granted") {

                status.textContent =
                    "Доступ к сенсорам запрещен";

                return;

            }

        } catch (error) {

            console.error(error);

            status.textContent =
                "Не удалось получить доступ";

            return;

        }

    }


    window.addEventListener(
        "deviceorientation",
        handleBrowserOrientation,
        true
    );


    sensorEnabled = true;

    controls.enabled = false;

    button.textContent =
        "Движение телефона включено";

    status.textContent =
        "Сенсоры устройства активны";
}


/* =========================================================
   TELEGRAM ORIENTATION
========================================================= */

function handleTelegramOrientation(data) {

    if (!sensorEnabled) {
        return;
    }


    /*
       Telegram передает:

       alpha
       beta
       gamma

       В РАДИАНАХ.

       Поэтому здесь не используем
       THREE.MathUtils.degToRad().
    */

    let alpha =
        data.alpha || 0;

    let beta =
        data.beta || 0;

    let gamma =
        data.gamma || 0;


    /*
       Если это первое значение,
       запоминаем начальное положение.
    */

    if (startAlpha === null) {

        startAlpha = alpha;
        startBeta = beta;
        startGamma = gamma;

    }


    /*
       Относительное вращение.
    */

    let yaw =
        alpha - startAlpha;

    let pitch =
        beta - startBeta;

    let roll =
        gamma - startGamma;


    /*
       Ограничиваем наклон,
       чтобы камера не переворачивалась.
    */

    pitch =
        THREE.MathUtils.clamp(
            pitch,
            -1.25,
            1.25
        );


    /*
       Инверсия yaw может понадобиться
       в зависимости от ориентации телефона.
    */

    sensorYaw =
        yaw;

    sensorPitch =
        pitch;


    updateCameraFromSensor();
}


/* =========================================================
   BROWSER ORIENTATION FALLBACK
========================================================= */

function handleBrowserOrientation(event) {

    if (!sensorEnabled) {
        return;
    }


    if (
        event.alpha === null ||
        event.beta === null ||
        event.gamma === null
    ) {

        return;

    }


    const alpha =
        THREE.MathUtils.degToRad(
            event.alpha
        );

    const beta =
        THREE.MathUtils.degToRad(
            event.beta
        );

    const gamma =
        THREE.MathUtils.degToRad(
            event.gamma
        );


    if (startAlpha === null) {

        startAlpha = alpha;
        startBeta = beta;
        startGamma = gamma;

    }


    sensorYaw =
        alpha - startAlpha;


    sensorPitch =
        beta - startBeta;


    sensorPitch =
        THREE.MathUtils.clamp(
            sensorPitch,
            -1.25,
            1.25
        );


    updateCameraFromSensor();
}


/* =========================================================
   КАМЕРА ПО СЕНСОРАМ
========================================================= */

function updateCameraFromSensor() {

    if (!camera) {
        return;
    }


    /*
       Радиус обзора.

       Модель остается в:

           0, 0, 0

       а камера находится вокруг нее.
    */

    const radius = 3;


    /*
       Начальная вертикальная высота.
    */

    const vertical =
        Math.sin(sensorPitch)
        * radius;


    const horizontalRadius =
        Math.cos(sensorPitch)
        * radius;


    /*
       Камера движется по сфере
       вокруг центра модели.
    */

    const x =
        Math.sin(sensorYaw)
        * horizontalRadius;


    const z =
        Math.cos(sensorYaw)
        * horizontalRadius;


    const y =
        0.5 + vertical;


    const targetPosition =
        new THREE.Vector3(
            x,
            y,
            z
        );


    /*
       Плавное движение.
    */

    camera.position.lerp(
        targetPosition,
        sensorSmooth
    );


    /*
       Камера постоянно смотрит
       на центр координат.
    */

    camera.lookAt(
        0,
        0,
        0
    );

}


/* =========================================================
   КНОПКА СЕНСОРОВ
========================================================= */

document
    .getElementById("sensorButton")
    .addEventListener(
        "click",
        async () => {

            if (!sensorEnabled) {

                /*
                   Сбрасываем начальную точку.
                */

                startAlpha = null;
                startBeta = null;
                startGamma = null;


                await startSensor();

            }

        }
    );


/* =========================================================
   ОСТАНОВКА СЕНСОРА
========================================================= */

function stopSensor() {

    sensorEnabled = false;


    /*
       Telegram
    */

    if (
        tg &&
        tg.DeviceOrientation &&
        typeof tg.DeviceOrientation.stop ===
        "function"
    ) {

        try {

            tg.DeviceOrientation.stop();

        } catch (error) {

            console.warn(error);

        }

    }


    /*
       Browser fallback
    */

    window.removeEventListener(
        "deviceorientation",
        handleBrowserOrientation,
        true
    );


    /*
       Возвращаем обычное управление
       пальцем.
    */

    if (controls) {

        controls.enabled = true;

    }


    const button =
        document.getElementById(
            "sensorButton"
        );

    const status =
        document.getElementById(
            "sensorStatus"
        );


    button.textContent =
        "Включить движение телефона";

    status.textContent =
        "Сенсоры выключены";


    startAlpha = null;
    startBeta = null;
    startGamma = null;
}


/* =========================================================
   RESIZE
========================================================= */

function resize() {

    if (!camera || !renderer) {
        return;
    }


    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}


/* =========================================================
   ANIMATION
========================================================= */

function animate() {

    animationId =
        requestAnimationFrame(
            animate
        );


    if (controls?.enabled) {

        controls.update();

    }


    if (renderer && scene && camera) {

        renderer.render(
            scene,
            camera
        );

    }

}

</script>
