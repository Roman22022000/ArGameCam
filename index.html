/* =============================================================
   TON ADDRESS
============================================================= */

function base64UrlToBytes(value) {

    let normalized =
        String(value)
            .replace(/-/g, "+")
            .replace(/_/g, "/");


    while (
        normalized.length % 4 !== 0
    ) {

        normalized += "=";

    }


    const binary =
        atob(normalized);


    const bytes =
        new Uint8Array(
            binary.length
        );


    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(i);

    }


    return bytes;

}


function normalizeTonAddress(address) {

    if (!address) {
        return "";
    }


    address =
        String(address).trim();


    /*
        Уже raw:
        0:64hex
    */

    if (
        /^-?\d+:[0-9a-fA-F]{64}$/
            .test(address)
    ) {

        const parts =
            address.split(":");


        return (
            parts[0] +
            ":" +
            parts[1].toLowerCase()
        );

    }


    /*
        Friendly:
        EQ...
        UQ...
    */

    try {

        const bytes =
            base64UrlToBytes(
                address
            );


        if (
            bytes.length !== 36
        ) {

            return address.toLowerCase();

        }


        let workchain =
            bytes[1];


        if (
            workchain === 255
        ) {

            workchain = -1;

        }


        let hash = "";


        for (
            let i = 2;
            i < 34;
            i++
        ) {

            hash +=
                bytes[i]
                    .toString(16)
                    .padStart(2, "0");

        }


        return (
            workchain +
            ":" +
            hash.toLowerCase()
        );

    } catch {

        return address.toLowerCase();

    }

}


const normalizedRequiredCollection =
    normalizeTonAddress(
        REQUIRED_COLLECTION
    );


/* =============================================================
   NFT CHECK
============================================================= */

async function checkCollectionNFT(
    walletAddress
) {

    const url =
        "https://tonapi.io/v2/accounts/" +
        encodeURIComponent(
            walletAddress
        ) +
        "/nfts?limit=1000";


    const response =
        await fetch(url, {

            method: "GET",

            headers: {
                "Accept":
                    "application/json"
            }

        });


    if (!response.ok) {

        throw new Error(
            "TonAPI HTTP " +
            response.status
        );

    }


    const data =
        await response.json();


    const nftItems =
        Array.isArray(
            data.nft_items
        )
            ? data.nft_items
            : [];


    for (
        const nft of nftItems
    ) {

        const collectionAddress =
            nft.collection?.address ||
            nft.collection_address ||
            "";


        if (!collectionAddress) {
            continue;
        }


        const normalized =
            normalizeTonAddress(
                collectionAddress
            );


        if (
            normalized ===
                normalizedRequiredCollection
            ||
            normalized ===
                REQUIRED_COLLECTION_RAW
        ) {

            return true;

        }

    }


    return false;

}


/* =============================================================
   WALLET
============================================================= */

let currentWallet =
    null;

let accessGranted =
    false;

let checkingNFT =
    false;


async function processWallet(
    wallet
) {

    if (!wallet) {

        currentWallet =
            null;

        accessGranted =
            false;

        userWalletAddress.textContent =
            "";

        userStatus.textContent =
            "";

        authStatus.textContent =
            "Подключите TON-кошелёк";

        showScreen(
            authScreen
        );

        return;

    }


    if (
        checkingNFT
    ) {

        return;

    }


    if (
        !wallet.account ||
        !wallet.account.address
    ) {

        return;

    }


    currentWallet =
        wallet.account.address;


    accessGranted =
        false;

    checkingNFT =
        true;


    authStatus.textContent =
        "Проверка NFT...";


    loading.classList.add(
        "active"
    );


    try {

        const hasNFT =
            await checkCollectionNFT(
                currentWallet
            );


        if (!hasNFT) {

            accessGranted =
                false;


            authStatus.textContent =
                "NFT нужной коллекции не найден";


            showScreen(
                authScreen
            );


            return;

        }


        accessGranted =
            true;


        userWalletAddress.textContent =
            currentWallet;


        authStatus.textContent =
            "Доступ разрешён";


        showScreen(
            homeScreen
        );


    } catch (error) {

        console.error(
            "NFT CHECK ERROR:",
            error
        );


        accessGranted =
            false;


        authStatus.textContent =
            "Ошибка проверки NFT";


        showScreen(
            authScreen
        );


    } finally {

        checkingNFT =
            false;


        loading.classList.remove(
            "active"
        );

    }

/* =============================================================
   ARCHIVE 3D MODELS
   Только загрузка и отображение 3D-модели.
   Текстуры, MTL и изображения НЕ загружаются.
============================================================= */

let archiveModels = [];

const EMPTY_TEXTURE =
    "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=";


function getArchiveModelUrl(item) {

    if (!item) {
        return "";
    }

    if (item.id !== undefined && item.id !== null) {
        return ARCHIVE_API +
            "/file/" +
            encodeURIComponent(item.id);
    }

    if (item.url) {
        return new URL(
            item.url,
            ARCHIVE_API + "/"
        ).href;
    }

    return "";
}


function getArchiveExtension(item) {

    let extension =
        String(item?.extension || "")
            .toLowerCase()
            .replace(".", "");

    if (!extension && item?.filename) {
        const parts =
            String(item.filename).split(".");

        extension =
            parts.length > 1
                ? parts.pop().toLowerCase()
                : "";
    }

    return extension;
}


function createArchiveLoadingManager(item, modelUrl) {

    const manager =
        new THREE.LoadingManager();

    manager.setURLModifier(
        originalUrl => {

            const url =
                String(originalUrl || "");

            // Сам файл модели не изменяем.
            if (url === modelUrl) {
                return url;
            }

            // Изображения и текстуры полностью блокируем.
            if (/\.(png|jpe?g|webp|gif|bmp|tga|dds|ktx2?|avif|svg)(\?.*)?$/i.test(url)) {
                return EMPTY_TEXTURE;
            }

            // Для .gltf/.glb разрешаем только служебные бинарные файлы.
            // Они нужны для самой геометрии модели.
            const clean =
                url.split("?")[0].split("#")[0];

            const filename =
                clean.substring(
                    clean.lastIndexOf("/") + 1
                );

            if (/\.(bin)(\?.*)?$/i.test(filename)) {

                return ARCHIVE_API +
                    "/resource/" +
                    encodeURIComponent(item.id) +
                    "/" +
                    encodeURIComponent(filename);
            }

            // Любые остальные внешние ресурсы пробуем получить
            // только из папки модели/разрешённых папок сервера.
            return ARCHIVE_API +
                "/resource/" +
                encodeURIComponent(item.id) +
                "/" +
                encodeURIComponent(filename);
        }
    );

    return manager;
}


function removeArchiveTextures(object) {

    if (!object) {
        return;
    }

    object.traverse(
        child => {

            if (!child.isMesh) {
                return;
            }

            child.castShadow = true;
            child.receiveShadow = true;

            const materials =
                Array.isArray(child.material)
                    ? child.material
                    : [child.material];

            materials.forEach(
                material => {

                    if (!material) {
                        return;
                    }

                    // Удаляем все карты текстур.
                    const textureKeys = [
                        "map",
                        "alphaMap",
                        "aoMap",
                        "bumpMap",
                        "displacementMap",
                        "emissiveMap",
                        "metalnessMap",
                        "normalMap",
                        "roughnessMap",
                        "specularMap",
                        "clearcoatMap",
                        "clearcoatNormalMap",
                        "clearcoatRoughnessMap",
                        "iridescenceMap",
                        "iridescenceThicknessMap",
                        "sheenColorMap",
                        "sheenRoughnessMap",
                        "transmissionMap",
                        "thicknessMap"
                    ];

                    textureKeys.forEach(
                        key => {
                            if (material[key]) {
                                material[key] = null;
                            }
                        }
                    );

                    material.needsUpdate = true;
                }
            );
        }
    );
}


function clearArchiveModel() {

    if (!model || !scene) {
        return;
    }

    scene.remove(model);

    model.traverse(
        object => {

            if (object.geometry) {
                object.geometry.dispose();
            }

            if (object.material) {

                const materials =
                    Array.isArray(object.material)
                        ? object.material
                        : [object.material];

                materials.forEach(
                    material => {

                        if (!material) {
                            return;
                        }

                        Object.keys(material).forEach(
                            key => {

                                const value =
                                    material[key];

                                if (
                                    value &&
                                    value.isTexture
                                ) {
                                    value.dispose();
                                }
                            }
                        );

                        material.dispose();
                    }
                );
            }
        }
    );

    model = null;
}


function prepareArchiveModel(object) {

    if (!object) {
        throw new Error("Пустая 3D модель");
    }

    removeArchiveTextures(object);

    const box =
        new THREE.Box3()
            .setFromObject(object);

    if (box.isEmpty()) {
        throw new Error("В модели нет геометрии");
    }

    const center =
        box.getCenter(
            new THREE.Vector3()
        );

    const size =
        box.getSize(
            new THREE.Vector3()
        );

    object.position.sub(center);

    const maxSize =
        Math.max(
            size.x,
            size.y,
            size.z
        );

    if (
        Number.isFinite(maxSize) &&
        maxSize > 0
    ) {
        object.scale.setScalar(
            2 / maxSize
        );
    }

    return object;
}


function loadArchiveModel(item) {

    return new Promise(
        (resolve, reject) => {

            const extension =
                getArchiveExtension(item);

            const modelUrl =
                getArchiveModelUrl(item);

            if (!modelUrl) {
                reject(
                    new Error("Нет URL модели")
                );
                return;
            }

            const manager =
                createArchiveLoadingManager(
                    item,
                    modelUrl
                );

            let archiveLoader = null;

            if (
                extension === "glb" ||
                extension === "gltf"
            ) {

                archiveLoader =
                    new GLTFLoader(manager);

                archiveLoader.load(
                    modelUrl,
                    result => {
                        resolve(result.scene);
                    },
                    undefined,
                    reject
                );

                return;
            }

            if (extension === "fbx") {

                archiveLoader =
                    new FBXLoader(manager);

                archiveLoader.load(
                    modelUrl,
                    result => {
                        resolve(result);
                    },
                    undefined,
                    reject
                );

                return;
            }

            if (extension === "obj") {

                // OBJ загружается БЕЗ MTL.
                // Поэтому никаких материалов/текстур из архива
                // для OBJ не требуется.
                archiveLoader =
                    new OBJLoader(manager);

                archiveLoader.load(
                    modelUrl,
                    result => {
                        resolve(result);
                    },
                    undefined,
                    reject
                );

                return;
            }

            if (extension === "stl") {

                archiveLoader =
                    new STLLoader(manager);

                archiveLoader.load(
                    modelUrl,
                    geometry => {

                        const material =
                            new THREE.MeshStandardMaterial({
                                color: 0xffffff,
                                roughness: 0.72,
                                metalness: 0.08,
                                side: THREE.DoubleSide
                            });

                        const mesh =
                            new THREE.Mesh(
                                geometry,
                                material
                            );

                        resolve(mesh);
                    },
                    undefined,
                    reject
                );

                return;
            }

            reject(
                new Error(
                    "Формат не поддерживается: " +
                    (extension || "unknown")
                )
            );
        }
    );
}


async function loadArchiveModels() {

    archiveStatus.textContent =
        "Загрузка списка моделей...";

    archiveGrid.innerHTML =
        "";

    try {

        const response =
            await fetch(
                ARCHIVE_API,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const data =
            await response.json();

        archiveModels =
            Array.isArray(data.items)
                ? data.items
                : [];

        if (!archiveModels.length) {

            archiveStatus.textContent =
                "В архиве пока нет 3D моделей.";

            return;
        }

        archiveStatus.textContent =
            "Моделей: " +
            archiveModels.length;

        archiveModels.forEach(
            (item, index) => {

                const button =
                    document.createElement("button");

                button.type =
                    "button";

                button.className =
                    "archiveItem";

                const preview =
                    document.createElement("div");

                preview.className =
                    "archivePlaceholder";

                preview.textContent =
                    String(
                        item.extension ||
                        "3D"
                    ).replace(".", "").toUpperCase();

                button.appendChild(
                    preview
                );

                const info =
                    document.createElement("div");

                info.className =
                    "archiveInfo";

                const name =
                    document.createElement("div");

                name.className =
                    "archiveName";

                name.textContent =
                    item.filename || "model";

                const folder =
                    document.createElement("div");

                folder.className =
                    "archiveFolder";

                folder.textContent =
                    (
                        item.folder || ""
                    ).toUpperCase();

                info.appendChild(name);
                info.appendChild(folder);
                button.appendChild(info);

                button.addEventListener(
                    "click",
                    () => {
                        openArchiveViewer(index);
                    }
                );

                archiveGrid.appendChild(
                    button
                );
            }
        );

    } catch (error) {

        console.error(
            "ARCHIVE ERROR:",
            error
        );

        archiveStatus.textContent =
            "Не удалось получить архив: " +
            error.message;
    }
}


async function openArchiveViewer(index) {

    viewerOpenedFromArchive =
        true;

    if (!requireAccess()) {
        return;
    }

    const item =
        archiveModels[index];

    if (!item) {
        return;
    }

    viewerNumber.textContent =
        item.filename || "3D";

    showScreen(
        viewerScreen
    );

    initViewer();

    clearArchiveModel();

    archiveStatus.textContent =
        "Загрузка модели: " +
        (item.filename || "3D");

    try {

        const loadedObject =
            await loadArchiveModel(item);

        model =
            prepareArchiveModel(
                loadedObject
            );

        scene.add(model);

        controls.target.set(
            0,
            0,
            0
        );

        controls.update();

        // Автоматически подбираем камеру под размер модели.
        const box =
            new THREE.Box3()
                .setFromObject(model);

        const size =
            box.getSize(
                new THREE.Vector3()
            );

        const maxSize =
            Math.max(
                size.x,
                size.y,
                size.z
            );

        const distance =
            Math.max(
                3,
                maxSize * 2.8
            );

        camera.position.set(
            distance,
            distance * 0.55,
            distance
        );

        camera.near =
            Math.max(
                0.001,
                distance / 1000
            );

        camera.far =
            Math.max(
                1000,
                distance * 100
            );

        camera.updateProjectionMatrix();

        controls.target.set(
            0,
            0,
            0
        );

        controls.update();

        archiveStatus.textContent =
            "Модель загружена: " +
            (item.filename || "3D");

    } catch (error) {

        console.error(
            "ARCHIVE MODEL ERROR:",
            error
        );

        clearArchiveModel();

        archiveStatus.textContent =
            "Ошибка загрузки модели: " +
            (error?.message || error);
    }
}

/* =============================================================
   THREE.JS VIEWER
============================================================= */

let scene =
    null;

let camera =
    null;

let renderer =
    null;

let controls =
    null;

let model =
    null;

let viewerOpenedFromArchive =
    false;


const loader =
    new GLTFLoader();


function initViewer() {

    if (renderer) {
        return;
    }


    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0x000000
        );


    camera =
        new THREE.PerspectiveCamera(
            45,
            window.innerWidth /
                window.innerHeight,
            0.01,
            1000
        );


    camera.position.set(
        0,
        0.3,
        3
    );


    renderer =
        new THREE.WebGLRenderer({

            antialias:
                true,

            alpha:
                false

        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    viewerCanvas.appendChild(
        renderer.domElement
    );


    controls =
        new OrbitControls(
            camera,
            renderer.domElement
        );


    controls.enableDamping =
        true;

    controls.enablePan =
        true;

    controls.minDistance =
        0.5;

    controls.maxDistance =
        20;


    const ambient =
        new THREE.AmbientLight(
            0xffffff,
            2
        );


    scene.add(
        ambient
    );


    const light =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );


    light.position.set(
        4,
        5,
        4
    );


    scene.add(
        light
    );


    window.addEventListener(
        "resize",
        resizeViewer
    );


    animateViewer();

}


function resizeViewer() {

    if (
        !camera ||
        !renderer
    ) {

        return;

    }


    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}


function animateViewer() {

    requestAnimationFrame(
        animateViewer
    );


    if (controls) {
        controls.update();
    }


    if (
        renderer &&
        scene &&
        camera
    ) {

        renderer.render(
            scene,
            camera
        );

    }

}


/* =============================================================
   OPEN MODEL
============================================================= */

function openViewer(index) {

    viewerOpenedFromArchive =
        false;

    if (
        !requireAccess()
    ) {
        return;
    }


    const item =
        galleryItems[index];


    if (!item) {
        return;
    }


    viewerNumber.textContent =
        item.number;


    showScreen(
        viewerScreen
    );


    initViewer();


    if (model) {

        scene.remove(
            model
        );


        model.traverse(
            object => {

                if (
                    object.geometry
                ) {

                    object.geometry.dispose();

                }


                if (
                    object.material
                ) {

                    if (
                        Array.isArray(
                            object.material
                        )
                    ) {

                        object.material
                            .forEach(
                                material => {

                                    material.dispose();

                                }
                            );

                    } else {

                        object.material.dispose();

                    }

                }

            }
        );


        model =
            null;

    }


    const url =
        MODEL_BASE +
        encodeURIComponent(
            item.filename
        );


    loader.load(

        url,

        gltf => {

            model =
                gltf.scene;


            const box =
                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            const center =
                box.getCenter(
                    new THREE.Vector3()
                );


            const size =
                box.getSize(
                    new THREE.Vector3()
                );


            model.position.sub(
                center
            );


            const maxSize =
                Math.max(
                    size.x,
                    size.y,
                    size.z
                );


            if (
                maxSize > 0
            ) {

                model.scale.setScalar(
                    2 / maxSize
                );

            }


            scene.add(
                model
            );


            controls.target.set(
                0,
                0,
                0
            );


            controls.update();

        },

        undefined,

        error => {

            console.error(
                "MODEL ERROR:",
                error
            );

        }

    );

}
