/* =============================================================
   TON ADDRESS
============================================================= */

function base64UrlToBytes(value) {

    let normalized =
        String(value)
            .replace(/-/g, "+")
            .replace(/_/g, "/");


    while (
        normalized.length % 4 !== 0
    ) {

        normalized += "=";

    }


    const binary =
        atob(normalized);


    const bytes =
        new Uint8Array(
            binary.length
        );


    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(i);

    }


    return bytes;

}


function normalizeTonAddress(address) {

    if (!address) {
        return "";
    }


    address =
        String(address).trim();


    /*
        Уже raw:
        0:64hex
    */

    if (
        /^-?\d+:[0-9a-fA-F]{64}$/
            .test(address)
    ) {

        const parts =
            address.split(":");


        return (
            parts[0] +
            ":" +
            parts[1].toLowerCase()
        );

    }


    /*
        Friendly:
        EQ...
        UQ...
    */

    try {

        const bytes =
            base64UrlToBytes(
                address
            );


        if (
            bytes.length !== 36
        ) {

            return address.toLowerCase();

        }


        let workchain =
            bytes[1];


        if (
            workchain === 255
        ) {

            workchain = -1;

        }


        let hash = "";


        for (
            let i = 2;
            i < 34;
            i++
        ) {

            hash +=
                bytes[i]
                    .toString(16)
                    .padStart(2, "0");

        }


        return (
            workchain +
            ":" +
            hash.toLowerCase()
        );

    } catch {

        return address.toLowerCase();

    }

}


const normalizedRequiredCollections =
    new Set(
        REQUIRED_COLLECTION_ALIASES
            .map(normalizeTonAddress)
            .filter(Boolean)
    );


/* =============================================================
   NFT CHECK
============================================================= */

async function checkCollectionNFT(
    walletAddress
) {

    const rawWalletAddress =
        normalizeTonAddress(walletAddress);

    const url =
        "https://tonapi.io/v2/accounts/" +
        encodeURIComponent(
            rawWalletAddress || walletAddress
        ) +
        "/nfts?limit=1000";


    const response =
        await fetch(url, {

            method: "GET",

            headers: {
                "Accept":
                    "application/json"
            }

        });


    if (!response.ok) {

        throw new Error(
            "TonAPI HTTP " +
            response.status
        );

    }


    const data =
        await response.json();


    const nftItems =
        Array.isArray(
            data.nft_items
        )
            ? data.nft_items
            : [];


    for (
        const nft of nftItems
    ) {

        const collectionAddress =
            nft.collection?.address ||
            nft.collection_address ||
            "";


        if (!collectionAddress) {
            continue;
        }


        const normalized =
            normalizeTonAddress(
                collectionAddress
            );


        if (
            normalizedRequiredCollections.has(
                normalized
            )
        ) {

            return true;

        }

    }


    return false;

}


/* =============================================================
   WALLET
============================================================= */

let currentWallet =
    null;

let accessGranted =
    false;

let checkingNFT =
    false;


async function processWallet(
    wallet
) {

    if (!wallet) {

        currentWallet =
            null;

        accessGranted =
            false;

        userWalletAddress.textContent =
            "";

        userStatus.textContent =
            "";

        authStatus.textContent =
            "Подключите TON-кошелёк";

        showScreen(
            authScreen
        );

        return;

    }


    if (
        checkingNFT
    ) {

        return;

    }


    if (
        !wallet.account ||
        !wallet.account.address
    ) {

        return;

    }


    currentWallet =
        wallet.account.address;


    accessGranted =
        false;

    checkingNFT =
        true;


    authStatus.textContent =
        "Проверка NFT...";


    loading.classList.add(
        "active"
    );


    try {

        const hasNFT =
            await checkCollectionNFT(
                currentWallet
            );


        if (!hasNFT) {

            accessGranted =
                false;


            authStatus.textContent =
                "NFT нужной коллекции не найден";


            showScreen(
                authScreen
            );


            return;

        }


        accessGranted =
            true;


        userWalletAddress.textContent =
            currentWallet;


        authStatus.textContent =
            "Доступ разрешён";


        showScreen(
            homeScreen
        );


    } catch (error) {

        console.error(
            "NFT CHECK ERROR:",
            error
        );


        accessGranted =
            false;


        authStatus.textContent =
            "Ошибка проверки NFT";


        showScreen(
            authScreen
        );


    } finally {

        checkingNFT =
            false;


        loading.classList.remove(
            "active"
        );

    }

}

let archiveModels = [];

async function loadArchiveModels() {

    archiveStatus.textContent =
        "Загрузка 3D моделей...";

    archiveGrid.innerHTML =
        "";

    try {

        const response =
            await fetch(
                ARCHIVE_API,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const data =
            await response.json();

        archiveModels =
            Array.isArray(data.items)
                ? data.items
                : [];

        if (!archiveModels.length) {

            archiveStatus.textContent =
                "В архиве пока нет 3D моделей.";

            return;
        }

        archiveStatus.textContent =
            "Моделей: " +
            archiveModels.length;

        archiveModels.forEach(
            (item, index) => {

                const button =
                    document.createElement(
                        "button"
                    );

                button.type =
                    "button";

                button.className =
                    "archiveItem";

                const preview =
                    document.createElement(
                        "div"
                    );

                preview.className =
                    "archivePlaceholder";

                preview.textContent =
                    "3D";

                button.appendChild(
                    preview
                );

                const info =
                    document.createElement(
                        "div"
                    );

                info.className =
                    "archiveInfo";

                const name =
                    document.createElement(
                        "div"
                    );

                name.className =
                    "archiveName";

                name.textContent =
                    item.filename || "model";

                const folder =
                    document.createElement(
                        "div"
                    );

                folder.className =
                    "archiveFolder";

                folder.textContent =
                    (
                        item.folder || ""
                    ).toUpperCase();

                info.appendChild(
                    name
                );

                info.appendChild(
                    folder
                );

                button.appendChild(
                    info
                );

                button.addEventListener(
                    "click",
                    () => {
                        openArchiveViewer(
                            index
                        );
                    }
                );

                archiveGrid.appendChild(
                    button
                );

            }
        );

    } catch (error) {

        console.error(
            "ARCHIVE ERROR:",
            error
        );

        archiveStatus.textContent =
            "Не удалось получить архив.";

    }

}


/* =============================================================
   THREE.JS VIEWER
============================================================= */

let scene = null;
let camera = null;
let renderer = null;
let model = null;

let viewerOpenedFromArchive = false;

const loader = new GLTFLoader();

const viewerState = {
    yaw: 0,
    pitch: 0.18,
    distance: 3,
    target: new THREE.Vector3(0, 0, 0),
    moveX: 0,
    moveZ: 0
};

const touchState = {
    active: false,
    mode: null,
    startX: 0,
    startY: 0,
    lastX: 0,
    lastY: 0,
    startDistance: 0,
    lastDistance: 0,
    startCenterX: 0,
    startCenterY: 0,
    lastCenterX: 0,
    lastCenterY: 0
};

function initViewer() {

    if (renderer) {
        return;
    }

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.01,
        1000
    );

    renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false,
        powerPreference: "high-performance"
    });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio || 1, 2)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.outputColorSpace = THREE.SRGBColorSpace;

    viewerCanvas.appendChild(renderer.domElement);

    const ambient = new THREE.AmbientLight(
        0xffffff,
        2.2
    );

    scene.add(ambient);

    const light = new THREE.DirectionalLight(
        0xffffff,
        3
    );

    light.position.set(4, 5, 4);
    scene.add(light);

    const fill = new THREE.DirectionalLight(
        0xffffff,
        1.5
    );

    fill.position.set(-4, 2, -4);
    scene.add(fill);

    setupViewerTouchControls();

    window.addEventListener(
        "resize",
        resizeViewer
    );

    animateViewer();
}

function resetViewerCamera() {

    viewerState.yaw = 0;
    viewerState.pitch = 0.18;
    viewerState.distance = 3;
    viewerState.moveX = 0;
    viewerState.moveZ = 0;

    viewerState.target.set(0, 0, 0);

    updateViewerCamera();
}

function updateViewerCamera() {

    if (!camera) {
        return;
    }

    const pitchLimit = Math.PI / 2 - 0.08;

    viewerState.pitch = THREE.MathUtils.clamp(
        viewerState.pitch,
        -pitchLimit,
        pitchLimit
    );

    viewerState.distance = THREE.MathUtils.clamp(
        viewerState.distance,
        0.35,
        30
    );

    const cosPitch = Math.cos(
        viewerState.pitch
    );

    const x =
        viewerState.target.x +
        Math.sin(viewerState.yaw) *
        cosPitch *
        viewerState.distance;

    const y =
        viewerState.target.y +
        Math.sin(viewerState.pitch) *
        viewerState.distance;

    const z =
        viewerState.target.z +
        Math.cos(viewerState.yaw) *
        cosPitch *
        viewerState.distance;

    camera.position.set(x, y, z);

    camera.lookAt(
        viewerState.target
    );
}

function resizeViewer() {

    if (!camera || !renderer) {
        return;
    }

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}

function getTouchDistance(t1, t2) {

    const dx = t2.clientX - t1.clientX;
    const dy = t2.clientY - t1.clientY;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );
}

function getTouchCenter(t1, t2) {

    return {
        x: (t1.clientX + t2.clientX) / 2,
        y: (t1.clientY + t2.clientY) / 2
    };
}

function setupViewerTouchControls() {

    const canvas = renderer.domElement;

    canvas.addEventListener(
        "contextmenu",
        event => event.preventDefault()
    );

    canvas.addEventListener(
        "touchstart",
        event => {

            event.preventDefault();

            if (event.touches.length === 1) {

                const touch =
                    event.touches[0];

                touchState.active = true;
                touchState.mode = "rotate";

                touchState.startX =
                    touch.clientX;

                touchState.startY =
                    touch.clientY;

                touchState.lastX =
                    touch.clientX;

                touchState.lastY =
                    touch.clientY;

            } else if (event.touches.length >= 2) {

                const t1 =
                    event.touches[0];

                const t2 =
                    event.touches[1];

                const center =
                    getTouchCenter(t1, t2);

                touchState.active = true;
                touchState.mode = "move";

                touchState.startDistance =
                    getTouchDistance(t1, t2);

                touchState.lastDistance =
                    touchState.startDistance;

                touchState.startCenterX =
                    center.x;

                touchState.startCenterY =
                    center.y;

                touchState.lastCenterX =
                    center.x;

                touchState.lastCenterY =
                    center.y;
            }

        },
        { passive: false }
    );

    canvas.addEventListener(
        "touchmove",
        event => {

            event.preventDefault();

            if (
                !touchState.active ||
                !camera
            ) {
                return;
            }

            if (
                event.touches.length === 1 &&
                touchState.mode === "rotate"
            ) {

                const touch =
                    event.touches[0];

                const dx =
                    touch.clientX -
                    touchState.lastX;

                const dy =
                    touch.clientY -
                    touchState.lastY;

                touchState.lastX =
                    touch.clientX;

                touchState.lastY =
                    touch.clientY;

                viewerState.yaw -=
                    dx * 0.008;

                viewerState.pitch -=
                    dy * 0.006;

                updateViewerCamera();

            } else if (
                event.touches.length >= 2
            ) {

                const t1 =
                    event.touches[0];

                const t2 =
                    event.touches[1];

                const distance =
                    getTouchDistance(t1, t2);

                const center =
                    getTouchCenter(t1, t2);

                const distanceDelta =
                    distance -
                    touchState.lastDistance;

                viewerState.distance -=
                    distanceDelta * 0.008;

                viewerState.distance =
                    THREE.MathUtils.clamp(
                        viewerState.distance,
                        0.35,
                        30
                    );

                const centerDX =
                    center.x -
                    touchState.lastCenterX;

                const centerDY =
                    center.y -
                    touchState.lastCenterY;

                const moveScale =
                    Math.max(
                        viewerState.distance * 0.0025,
                        0.002
                    );

                const right =
                    new THREE.Vector3(
                        camera.matrix.elements[0],
                        camera.matrix.elements[1],
                        camera.matrix.elements[2]
                    ).normalize();

                const up =
                    new THREE.Vector3(
                        camera.matrix.elements[4],
                        camera.matrix.elements[5],
                        camera.matrix.elements[6]
                    ).normalize();

                viewerState.target
                    .addScaledVector(
                        right,
                        -centerDX * moveScale
                    );

                viewerState.target
                    .addScaledVector(
                        up,
                        centerDY * moveScale
                    );

                touchState.lastDistance =
                    distance;

                touchState.lastCenterX =
                    center.x;

                touchState.lastCenterY =
                    center.y;

                updateViewerCamera();
            }

        },
        { passive: false }
    );

    canvas.addEventListener(
        "touchend",
        event => {

            event.preventDefault();

            if (event.touches.length === 0) {

                touchState.active = false;
                touchState.mode = null;

            } else if (event.touches.length === 1) {

                const touch =
                    event.touches[0];

                touchState.mode = "rotate";

                touchState.lastX =
                    touch.clientX;

                touchState.lastY =
                    touch.clientY;
            }

        },
        { passive: false }
    );

    canvas.addEventListener(
        "touchcancel",
        () => {
            touchState.active = false;
            touchState.mode = null;
        },
        { passive: false }
    );

    canvas.addEventListener(
        "wheel",
        event => {

            event.preventDefault();

            viewerState.distance +=
                event.deltaY * 0.002;

            viewerState.distance =
                THREE.MathUtils.clamp(
                    viewerState.distance,
                    0.35,
                    30
                );

            updateViewerCamera();

        },
        { passive: false }
    );
}

function moveViewerForward(amount) {

    const direction =
        new THREE.Vector3();

    camera.getWorldDirection(
        direction
    );

    direction.y = 0;

    if (direction.lengthSq() > 0) {
        direction.normalize();

        viewerState.target.addScaledVector(
            direction,
            amount
        );

        updateViewerCamera();
    }
}

function moveViewerBackward(amount) {
    moveViewerForward(-amount);
}

function animateViewer() {

    requestAnimationFrame(
        animateViewer
    );

    if (
        renderer &&
        scene &&
        camera
    ) {

        renderer.render(
            scene,
            camera
        );
    }
}

function disposeCurrentModel() {

    if (!model || !scene) {
        return;
    }

    scene.remove(model);

    model.traverse(
        object => {

            if (object.geometry) {
                object.geometry.dispose();
            }

            if (object.material) {

                const materials =
                    Array.isArray(object.material)
                        ? object.material
                        : [object.material];

                materials.forEach(
                    material => {

                        if (
                            material.map
                        ) {
                            material.map.dispose();
                        }

                        if (
                            material.normalMap
                        ) {
                            material.normalMap.dispose();
                        }

                        if (
                            material.roughnessMap
                        ) {
                            material.roughnessMap.dispose();
                        }

                        if (
                            material.metalnessMap
                        ) {
                            material.metalnessMap.dispose();
                        }

                        if (
                            material.emissiveMap
                        ) {
                            material.emissiveMap.dispose();
                        }

                        material.dispose();
                    }
                );
            }
        }
    );

    model = null;
}

function prepareLoadedModel(gltf) {

    model = gltf.scene;

    const box =
        new THREE.Box3()
            .setFromObject(model);

    const center =
        box.getCenter(
            new THREE.Vector3()
        );

    const size =
        box.getSize(
            new THREE.Vector3()
        );

    model.position.sub(center);

    const maxSize =
        Math.max(
            size.x,
            size.y,
            size.z
        );

    if (maxSize > 0) {

        model.scale.setScalar(
            2 / maxSize
        );
    }

    model.traverse(
        object => {

            if (object.isMesh) {

                object.castShadow = true;
                object.receiveShadow = true;

                if (
                    object.material
                ) {

                    const materials =
                        Array.isArray(
                            object.material
                        )
                            ? object.material
                            : [object.material];

                    materials.forEach(
                        material => {

                            material.side =
                                THREE.FrontSide;

                            material.needsUpdate =
                                true;
                        }
                    );
                }
            }
        }
    );

    scene.add(model);

    resetViewerCamera();
}

function showViewerError(message) {

    console.error(message);

    viewerNumber.textContent =
        "ОШИБКА";

    const status =
        document.createElement("div");

    status.id =
        "viewerError";

    status.style.position =
        "absolute";

    status.style.zIndex =
        "20";

    status.style.left =
        "50%";

    status.style.top =
        "50%";

    status.style.transform =
        "translate(-50%, -50%)";

    status.style.color =
        "#777";

    status.style.fontSize =
        "12px";

    status.style.textAlign =
        "center";

    status.style.padding =
        "20px";

    status.textContent =
        message;

    const old =
        document.getElementById(
            "viewerError"
        );

    if (old) {
        old.remove();
    }

    viewerScreen.appendChild(status);
}

function loadModelIntoViewer(url) {

    disposeCurrentModel();

    const oldError =
        document.getElementById(
            "viewerError"
        );

    if (oldError) {
        oldError.remove();
    }

    viewerNumber.textContent =
        "Загрузка...";

    loader.load(
        url,

        gltf => {

            prepareLoadedModel(gltf);

            viewerNumber.textContent =
                viewerNumber.dataset.filename ||
                "3D";

        },

        xhr => {

            if (
                xhr.total > 0
            ) {

                const percent =
                    Math.round(
                        xhr.loaded /
                        xhr.total *
                        100
                    );

                viewerNumber.textContent =
                    percent + "%";
            }
        },

        error => {

            showViewerError(
                "Не удалось загрузить GLB"
            );
        }
    );
}

/* =============================================================
   ARCHIVE MODEL
============================================================= */

function openArchiveViewer(index) {

    viewerOpenedFromArchive = true;

    if (!requireAccess()) {
        return;
    }

    const item =
        archiveModels[index];

    if (!item) {
        return;
    }

    showScreen(viewerScreen);

    initViewer();

    const filename =
        item.filename ||
        "3D";

    viewerNumber.dataset.filename =
        filename;

    viewerNumber.textContent =
        filename;

    let url =
        item.url ||
        item.download_url ||
        item.file_url ||
        "";

    if (!url && item.id !== undefined) {

        url =
            ARCHIVE_API +
            "/file/" +
            encodeURIComponent(
                item.id
            );
    }

    if (!url && item.filename) {

        url =
            ARCHIVE_API +
            "/file/" +
            encodeURIComponent(
                item.filename
            );
    }

    if (!url) {

        showViewerError(
            "API не передал URL модели"
        );

        return;
    }

    loadModelIntoViewer(url);

    const hint =
        document.getElementById(
            "viewerHint"
        );

    if (hint) {

        hint.style.opacity = "1";

        setTimeout(
            () => {
                hint.style.opacity = "0";
            },
            3500
        );
    }
}

============================================================= */

const galleryItems = [
    {
        number: 1,
        filename: "creature.glb"

/* =============================================================
   GALLERY
============================================================= */

function buildGallery() {

    galleryGrid.innerHTML = "";

    galleryItems.forEach(
        (item, index) => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "galleryItem";

            button.type =
                "button";

            button.textContent =
                item.number;

            button.addEventListener(
                "click",
                () => {
                    openViewer(index);
                }
            );

            galleryGrid.appendChild(
                button
            );
        }
    );
}

buildGallery();

/* =============================================================
   OPEN LOCAL/GITHUB GALLERY MODEL
============================================================= */

function openViewer(index) {

    viewerOpenedFromArchive = false;

    if (!requireAccess()) {
        return;
    }

    const item =
        galleryItems[index];

    if (!item) {
        return;
    }

    viewerNumber.dataset.filename =
        item.filename;

    viewerNumber.textContent =
        item.filename;

    showScreen(
        viewerScreen
    );

    initViewer();

    const url =
        MODEL_BASE +
        encodeURIComponent(
            item.filename
        );

    loadModelIntoViewer(url);
}
