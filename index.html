<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta
    http-equiv="Permissions-Policy"
    content="camera=(self), xr-spatial-tracking=(self)"
>

<title>AR Game Cam</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    font-family: Arial, sans-serif;

    touch-action: none;
}

#app {

    position: relative;

    width: 100%;
    height: 100dvh;

    overflow: hidden;

    background: #000;
}


/* =====================================================
   CAMERA FALLBACK
===================================================== */

#camera {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    background: #000;

    z-index: 1;

    display: none;
}


/* =====================================================
   THREE
===================================================== */

#threeCanvas {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 2;

    display: none;

    pointer-events: none;

    background: transparent;
}


/* =====================================================
   START
===================================================== */

#start {

    position: absolute;

    inset: 0;

    z-index: 100;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    padding: 25px;

    background:
        radial-gradient(
            circle at center,
            #26343d,
            #090c0f
        );

    color: white;

    text-align: center;
}

#start h1 {

    font-size: 40px;

    margin-bottom: 15px;
}

#start p {

    max-width: 370px;

    line-height: 1.5;

    opacity: .7;

    margin-bottom: 25px;
}


.mainButton {

    min-width: 250px;

    min-height: 55px;

    border: 0;

    border-radius: 16px;

    background: white;

    color: #111;

    font-size: 17px;

    font-weight: 700;
}


/* =====================================================
   TOP
===================================================== */

#topBar {

    position: absolute;

    top:
        calc(
            12px +
            env(safe-area-inset-top)
        );

    left: 12px;

    right: 12px;

    z-index: 40;

    display: none;

    justify-content:
        space-between;

    pointer-events: none;
}


.badge {

    padding: 9px 13px;

    border-radius: 13px;

    background:
        rgba(0,0,0,.65);

    color: white;

    backdrop-filter:
        blur(12px);

    font-size: 13px;
}


/* =====================================================
   STATUS
===================================================== */

#status {

    position: absolute;

    top: 65px;

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 45;

    width:
        calc(100% - 40px);

    max-width: 430px;

    padding: 10px 14px;

    border-radius: 13px;

    background:
        rgba(0,0,0,.68);

    color: white;

    text-align: center;

    font-size: 12px;

    backdrop-filter:
        blur(10px);
}


/* =====================================================
   CLOSE
===================================================== */

#close {

    position: absolute;

    top:
        calc(
            12px +
            env(safe-area-inset-top)
        );

    right: 12px;

    z-index: 60;

    display: none;

    width: 42px;

    height: 42px;

    border: 0;

    border-radius: 13px;

    background:
        rgba(0,0,0,.70);

    color: white;

    font-size: 22px;
}


/* =====================================================
   AR BUTTONS
===================================================== */

#arControls {

    position: absolute;

    top: 120px;

    right: 12px;

    z-index: 50;

    display: none;

    flex-direction: column;

    gap: 8px;
}


.control {

    min-width: 52px;

    min-height: 46px;

    padding: 7px;

    border: 0;

    border-radius: 13px;

    background:
        rgba(0,0,0,.70);

    color: white;

    font-size: 17px;

    backdrop-filter:
        blur(10px);
}


#placeButton {

    min-width: 130px;

    font-size: 13px;

    font-weight: 700;
}


/* =====================================================
   SCENE PANEL
===================================================== */

#scenePanel {

    position: absolute;

    left: 0;

    right: 0;

    bottom: 0;

    z-index: 50;

    display: none;

    padding:

        12px

        12px

        calc(
            12px +
            env(safe-area-inset-bottom)
        );

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.96),
            rgba(0,0,0,.76)
        );

    backdrop-filter:
        blur(18px);

    color: white;
}


#sceneHeader {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    margin-bottom: 9px;
}


#sceneTitle {

    font-size: 14px;

    font-weight: 700;
}


#sceneHint {

    font-size: 11px;

    opacity: .55;
}


#sceneList {

    display: flex;

    gap: 9px;

    overflow-x: auto;

    scrollbar-width: none;
}


#sceneList::-webkit-scrollbar {

    display: none;
}


/* =====================================================
   SCENE CARD
===================================================== */

.sceneCard {

    flex: 0 0 82px;

    width: 82px;

    height: 92px;

    padding: 0;

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius: 14px;

    overflow: hidden;

    background:
        rgba(255,255,255,.08);

    color: white;
}


.sceneCard.active {

    border:
        2px solid white;

    background:
        rgba(255,255,255,.18);
}


.scenePreview {

    height: 62px;

    display: flex;

    justify-content: center;

    align-items: center;

    background:
        linear-gradient(
            135deg,
            #27353d,
            #11161a
        );

    font-size: 28px;
}


.sceneName {

    height: 30px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 10px;
}


/* =====================================================
   DEBUG
===================================================== */

#debug {

    position: absolute;

    left: 10px;

    bottom: 160px;

    z-index: 40;

    display: none;

    padding: 9px;

    border-radius: 9px;

    background:
        rgba(0,0,0,.70);

    color: white;

    font-family: monospace;

    font-size: 10px;

    line-height: 1.45;

    pointer-events: none;
}


/* =====================================================
   XR CROSSHAIR
===================================================== */

#reticle {

    position: absolute;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 35;

    display: none;

    width: 42px;

    height: 42px;

    border:
        2px solid white;

    border-radius: 50%;

    opacity: .9;
}


#reticle::before {

    content: "";

    position: absolute;

    left: 50%;

    top: 50%;

    width: 12px;

    height: 2px;

    transform:
        translate(-50%, -50%);

    background: white;
}


#reticle::after {

    content: "";

    position: absolute;

    left: 50%;

    top: 50%;

    width: 2px;

    height: 12px;

    transform:
        translate(-50%, -50%);

    background: white;
}


/* =====================================================
   XR NOT SUPPORTED
===================================================== */

#browserMessage {

    display: none;

    margin-top: 15px;

    max-width: 360px;

    padding: 12px;

    border-radius: 12px;

    background:
        rgba(255,255,255,.08);

    color: white;

    font-size: 12px;

    line-height: 1.45;
}

</style>

<script type="importmap">

{
    "imports": {

        "three":
            "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

<script type="module">

import * as THREE
    from "three";

import {
    GLTFLoader
}
from "three/addons/loaders/GLTFLoader.js";


/* =====================================================
   TELEGRAM
===================================================== */

const tg =
    window.Telegram?.WebApp;

if (tg) {

    tg.ready();

    tg.expand();

}


/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById(
        "camera"
    );

const canvas =
    document.getElementById(
        "threeCanvas"
    );

const startScreen =
    document.getElementById(
        "start"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const status =
    document.getElementById(
        "status"
    );

const trackingBadge =
    document.getElementById(
        "trackingBadge"
    );

const topBar =
    document.getElementById(
        "topBar"
    );

const closeButton =
    document.getElementById(
        "close"
    );

const arControls =
    document.getElementById(
        "arControls"
    );

const placeButton =
    document.getElementById(
        "placeButton"
    );

const scenePanel =
    document.getElementById(
        "scenePanel"
    );

const sceneList =
    document.getElementById(
        "sceneList"
    );

const reticle =
    document.getElementById(
        "reticle"
    );

const debug =
    document.getElementById(
        "debug"
    );

const browserMessage =
    document.getElementById(
        "browserMessage"
    );


/* =====================================================
   THREE
===================================================== */

let renderer = null;

let scene = null;

let camera3D = null;

let model = null;


/* =====================================================
   GLB
===================================================== */

let modelScale = 1;

let currentModelName =
    "Creature";


/* =====================================================
   WEBXR
===================================================== */

let xrSession = null;

let xrReferenceSpace = null;

let viewerSpace = null;

let hitTestSource = null;

let hitTestAvailable = false;

let xrRunning = false;

let xrPlaced = false;


/*
 * Точка, куда будет поставлена
 * модель.
 */

let xrPlacementMatrix =
    new THREE.Matrix4();


/* =====================================================
   FALLBACK MOTION
===================================================== */

let fallbackMotion =
    false;

let fallbackOrientation =
    false;


/*
 * Виртуальная позиция
 * телефона для fallback.
 */

const fallbackPosition =
    new THREE.Vector3(
        0,
        0,
        0
    );


const fallbackVelocity =
    new THREE.Vector3(
        0,
        0,
        0
    );


let lastMotionTime =
    null;


/*
 * Начальная ориентация.
 */

let initialOrientation =
    new THREE.Quaternion();


let orientationInitialized =
    false;


/* =====================================================
   SETTINGS
===================================================== */

const FALLBACK_DAMPING =
    0.86;

const FALLBACK_SCALE =
    0.8;

const FALLBACK_THRESHOLD =
    0.35;


/* =====================================================
   STATUS
===================================================== */

function setStatus(
    text
) {

    status.textContent =
        text;

}


/* =====================================================
   THREE INITIALIZATION
===================================================== */

function initThree() {


    scene =
        new THREE.Scene();


    camera3D =
        new THREE.PerspectiveCamera(

            60,

            window.innerWidth /
            window.innerHeight,

            0.01,

            1000

        );


    camera3D.position.set(
        0,
        0,
        0
    );


    renderer =
        new THREE.WebGLRenderer({

            canvas,

            alpha: true,

            antialias: true,

            preserveDrawingBuffer:
                false

        });


    renderer.setPixelRatio(

        Math.min(
            window.devicePixelRatio,
            2
        )

    );


    renderer.setSize(

        window.innerWidth,
        window.innerHeight

    );


    renderer.setClearColor(
        0x000000,
        0
    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    /*
     * Очень важно:
     * включаем XR для WebXR.
     */

    renderer.xr.enabled =
        true;


    /*
     * В обычном fallback
     * запускаем свой render loop.
     */

    renderer.setAnimationLoop(
        renderLoop
    );


    /* =================================================
       LIGHT
    ================================================= */

    const hemisphere =
        new THREE.HemisphereLight(

            0xffffff,

            0x555555,

            2

        );


    scene.add(
        hemisphere
    );


    const directional =
        new THREE.DirectionalLight(

            0xffffff,

            2

        );


    directional.position.set(
        2,
        4,
        2
    );


    scene.add(
        directional
    );

}


/* =====================================================
   RENDER LOOP
===================================================== */

function renderLoop(
    time,
    frame
) {

    /*
     * Если это настоящий XR-сеанс,
     * Three.js сам получает XR camera.
     */

    if (
        xrRunning &&
        frame
    ) {

        processXRFrame(
            frame
        );

    }


    /*
     * Обычный режим.
     */

    if (
        renderer &&
        scene &&
        camera3D
    ) {

        renderer.render(
            scene,
            camera3D
        );

    }

}


/* =====================================================
   LOAD MODEL
===================================================== */

function loadModel(
    filename,
    name
) {

    currentModelName =
        name;


    setStatus(
        "Загрузка " +
        name +
        "..."
    );


    /*
     * Удаляем старую модель.
     */

    if (
        model
    ) {

        scene.remove(
            model
        );


        model.traverse(
            object => {

                if (
                    object.geometry
                ) {

                    object.geometry.dispose();

                }


                if (
                    object.material
                ) {

                    if (
                        Array.isArray(
                            object.material
                        )
                    ) {

                        object.material
                            .forEach(
                                material => {

                                    if (
                                        material.map
                                    ) {

                                        material.map
                                            .dispose();

                                    }


                                    material.dispose();

                                }
                            );

                    }
                    else {

                        if (
                            object.material.map
                        ) {

                            object.material.map
                                .dispose();

                        }


                        object.material.dispose();

                    }

                }

            }
        );


        model =
            null;

    }


    const loader =
        new GLTFLoader();


    loader.load(

        "./models/" +
        filename,


        gltf => {

            model =
                gltf.scene;


            model.scale.set(
                modelScale,
                modelScale,
                modelScale
            );


            /*
             * В обычном fallback
             * модель находится
             * перед виртуальной камерой.
             */

            if (
                !xrRunning
            ) {

                model.position.set(
                    0,
                    -0.5,
                    -3
                );

            }


            scene.add(
                model
            );


            setStatus(
                name +
                " загружен"
            );


            console.log(
                "GLB loaded:",
                filename
            );

        },


        progress => {

            if (
                progress.total > 0
            ) {

                const percent =
                    Math.round(

                        progress.loaded /
                        progress.total *
                        100

                    );


                setStatus(
                    "Загрузка " +
                    name +
                    ": " +
                    percent +
                    "%"
                );

            }

        },


        error => {

            console.error(
                "GLB ERROR:",
                error
            );


            setStatus(
                "Ошибка: " +
                filename
            );

        }

    );

}


/* =====================================================
   CHECK WEBXR
===================================================== */

async function checkWebXR() {


    if (
        !navigator.xr
    ) {

        trackingBadge.textContent =
            "NO WEBXR";


        browserMessage.style.display =
            "block";


        browserMessage.innerHTML =

            "Этот WebView не предоставляет " +
            "WebXR immersive-ar. " +
            "Будет использован резервный " +
            "режим камеры + датчики.";


        return false;

    }


    try {

        const supported =
            await navigator.xr
                .isSessionSupported(
                    "immersive-ar"
                );


        console.log(
            "immersive-ar:",
            supported
        );


        if (
            supported
        ) {

            trackingBadge.textContent =
                "AR READY";


            browserMessage.style.display =
                "block";


            browserMessage.textContent =
                "WebXR AR доступен. " +
                "Будет использовано настоящее " +
                "пространственное отслеживание.";


            return true;

        }


        trackingBadge.textContent =
            "NO AR";


        browserMessage.style.display =
            "block";


        browserMessage.textContent =
            "immersive-ar недоступен. " +
            "Используется резервный режим.";


        return false;

    }
    catch (
        error
    ) {

        console.error(
            "WEBXR CHECK ERROR:",
            error
        );


        trackingBadge.textContent =
            "XR ERROR";


        return false;

    }

}


/* =====================================================
   START CAMERA FALLBACK
===================================================== */

async function startFallbackCamera() {


    setStatus(
        "Запрашиваем камеру..."
    );


    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        throw new Error(
            "getUserMedia недоступен"
        );

    }


    const stream =
        await navigator
            .mediaDevices
            .getUserMedia({

                video: {

                    facingMode: {
                        ideal:
                            "environment"
                    },

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    }

                },

                audio: false

            });


    video.srcObject =
        stream;


    await video.play();


    video.style.display =
        "block";


    canvas.style.display =
        "block";


    topBar.style.display =
        "flex";


    arControls.style.display =
        "flex";


    scenePanel.style.display =
        "block";


    closeButton.style.display =
        "block";


    debug.style.display =
        "block";


    reticle.style.display =
        "none";


    initThree();


    loadModel(
        "creature.glb",
        "Creature"
    );


    await startFallbackSensors();


    trackingBadge.textContent =
        "MOTION";


    setStatus(
        "Камера включена. " +
        "Выберите сцену."
    );

}


/* =====================================================
   FALLBACK SENSORS
===================================================== */

async function startFallbackSensors() {


    /*
     * iOS orientation permission.
     */

    if (

        typeof DeviceOrientationEvent !==
        "undefined" &&

        typeof DeviceOrientationEvent
            .requestPermission ===
        "function"

    ) {

        const result =
            await DeviceOrientationEvent
                .requestPermission();


        if (
            result !==
            "granted"
        ) {

            throw new Error(
                "Ориентация запрещена"
            );

        }

    }


    /*
     * iOS motion permission.
     */

    if (

        typeof DeviceMotionEvent !==
        "undefined" &&

        typeof DeviceMotionEvent
            .requestPermission ===
        "function"

    ) {

        const result =
            await DeviceMotionEvent
                .requestPermission();


        if (
            result !==
            "granted"
        ) {

            throw new Error(
                "Движение запрещено"
            );

        }

    }


    window.addEventListener(

        "deviceorientation",

        handleFallbackOrientation,

        true

    );


    window.addEventListener(

        "devicemotion",

        handleFallbackMotion,

        true

    );


    fallbackOrientation =
        true;


    fallbackMotion =
        true;

}


/* =====================================================
   FALLBACK ORIENTATION
===================================================== */

function handleFallbackOrientation(
    event
) {

    if (
        !camera3D ||
        xrRunning
    ) {

        return;

    }


    const alpha =
        THREE.MathUtils.degToRad(
            event.alpha || 0
        );


    const beta =
        THREE.MathUtils.degToRad(
            event.beta || 0
        );


    const gamma =
        THREE.MathUtils.degToRad(
            event.gamma || 0
        );


    const euler =
        new THREE.Euler(

            beta,

            alpha,

            -gamma,

            "YXZ"

        );


    const currentQuaternion =
        new THREE.Quaternion();


    currentQuaternion.setFromEuler(
        euler
    );


    /*
     * Первое положение —
     * начало отсчёта.
     */

    if (
        !orientationInitialized
    ) {

        initialOrientation.copy(
            currentQuaternion
        );


        orientationInitialized =
            true;

    }


    /*
     * Относительная ориентация.
     */

    const relative =
        new THREE.Quaternion();


    relative.copy(
        initialOrientation
    );


    relative.invert();


    relative.multiply(
        currentQuaternion
    );


    camera3D.quaternion.slerp(
        relative,
        0.15
    );


    updateDebug();

}


/* =====================================================
   FALLBACK MOTION
===================================================== */

function handleFallbackMotion(
    event
) {

    if (
        !camera3D ||
        xrRunning
    ) {

        return;

    }


    /*
     * acceleration без gravity
     * предпочтительнее.
     */

    const a =
        event.acceleration;


    if (
        !a
    ) {

        return;

    }


    const ax =
        a.x || 0;

    const ay =
        a.y || 0;

    const az =
        a.z || 0;


    const magnitude =
        Math.sqrt(

            ax * ax +
            ay * ay +
            az * az

        );


    if (
        magnitude <
        FALLBACK_THRESHOLD
    ) {

        fallbackVelocity
            .multiplyScalar(
                FALLBACK_DAMPING
            );


        return;

    }


    const now =
        performance.now();


    if (
        lastMotionTime ===
        null
    ) {

        lastMotionTime =
            now;

        return;

    }


    let dt =
        (now -
            lastMotionTime) /
        1000;


    lastMotionTime =
        now;


    dt =
        Math.min(
            dt,
            0.05
        );


    const movement =
        new THREE.Vector3(
            ax,
            ay,
            az
        );


    /*
     * Преобразуем направление
     * относительно ориентации камеры.
     */

    movement.applyQuaternion(
        camera3D.quaternion
    );


    fallbackVelocity
        .addScaledVector(

            movement,

            FALLBACK_SCALE *
            dt

        );


    /*
     * Ограничение.
     */

    if (
        fallbackVelocity.length() >
        1.5
    ) {

        fallbackVelocity.setLength(
            1.5
        );

    }


    fallbackPosition
        .addScaledVector(

            fallbackVelocity,

            dt

        );


    fallbackVelocity
        .multiplyScalar(
            FALLBACK_DAMPING
        );


    camera3D.position.copy(
        fallbackPosition
    );


    updateDebug();

}


/* =====================================================
   WEBXR START
===================================================== */

async function startXR() {


    if (
        !navigator.xr
    ) {

        return false;

    }


    try {

        setStatus(
            "Запускаем WebXR AR..."
        );


        /*
         * Настройки WebXR.
         *
         * local = пространственная
         * система координат.
         *
         * hit-test = поиск поверхностей.
         */

        xrSession =
            await navigator.xr
                .requestSession(

                    "immersive-ar",

                    {

                        requiredFeatures: [
                            "local",
                            "hit-test"
                        ],

                        optionalFeatures: [
                            "local-floor",
                            "dom-overlay",
                            "anchors"
                        ],

                        domOverlay: {
                            root: document.body
                        }

                    }

                );


        /*
         * WebGLRenderer подключается
         * к XRSession.
         */

        await renderer.xr
            .setSession(
                xrSession
            );


        xrRunning =
            true;


        trackingBadge.textContent =
            "6DoF AR";


        /*
         * Получаем reference space.
         */

        xrReferenceSpace =
            await xrSession
                .requestReferenceSpace(
                    "local"
                );


        /*
         * Viewer space нужен
         * для hit-test.
         */

        viewerSpace =
            await xrSession
                .requestReferenceSpace(
                    "viewer"
                );


        /*
         * Создаём источник
         * hit-test.
         */

        hitTestSource =
            await xrSession
                .requestHitTestSource({

                    space:
                        viewerSpace

                });


        hitTestAvailable =
            true;


        /*
         * Интерфейс.
         */

        startScreen.style.display =
            "none";


        topBar.style.display =
            "flex";


        arControls.style.display =
            "flex";


        scenePanel.style.display =
            "block";


        closeButton.style.display =
            "block";


        reticle.style.display =
            "block";


        debug.style.display =
            "block";


        /*
         * Загружаем первую сцену.
         */

        loadModel(
            "creature.glb",
            "Creature"
        );


        /*
         * Событие завершения XR.
         */

        xrSession.addEventListener(

            "end",

            handleXREnd

        );


        setStatus(
            "AR готов. Наведите телефон на поверхность."
        );


        return true;

    }
    catch (
        error
    ) {

        console.error(
            "XR START ERROR:",
            error
        );


        xrRunning =
            false;


        if (
            xrSession
        ) {

            try {

                await xrSession.end();

            }
            catch {}

        }


        xrSession =
            null;


        return false;

    }

}


/* =====================================================
   XR FRAME
===================================================== */

function processXRFrame(
    frame
) {

    if (
        !xrSession ||
        !xrReferenceSpace
    ) {

        return;

    }


    /*
     * Получаем текущую позу
     * телефона.
     */

    const pose =
        frame.getViewerPose(
            xrReferenceSpace
        );


    if (
        !pose
    ) {

        return;

    }


    /*
     * Именно здесь WebXR
     * предоставляет реальные
     * пространственные координаты
     * и ориентацию viewer.
     */

    const viewer =
        pose.transform;


    const position =
        viewer.position;


    const orientation =
        viewer.orientation;


    /*
     * Диагностика.
     */

    debug.innerHTML =

        "MODE: WebXR 6DoF<br>" +

        "X: " +
        position.x.toFixed(3) +
        "<br>" +

        "Y: " +
        position.y.toFixed(3) +
        "<br>" +

        "Z: " +
        position.z.toFixed(3) +
        "<br>" +

        "ROT X: " +
        orientation.x.toFixed(3) +
        "<br>" +

        "ROT Y: " +
        orientation.y.toFixed(3) +
        "<br>" +

        "ROT Z: " +
        orientation.z.toFixed(3);


    /*
     * Hit-test.
     */

    if (
        hitTestSource &&
        hitTestAvailable
    ) {

        const results =
            frame.getHitTestResults(
                hitTestSource
            );


        if (
            results.length > 0
        ) {

            const hit =
                results[0];


            const hitPose =
                hit.getPose(
                    xrReferenceSpace
                );


            if (
                hitPose
            ) {

                /*
                 * Запоминаем
                 * положение поверхности.
                 */

                xrPlacementMatrix
                    .fromArray(
                        hitPose.transform
                            .matrix
                    );


                /*
                 * Если объект ещё
                 * не установлен —
                 * показываем reticle.
                 */

                if (
                    !xrPlaced
                ) {

                    reticle.style.display =
                        "block";


                    reticle.style.opacity =
                        "1";

                }

            }

        }

    }

}


/* =====================================================
   PLACE OBJECT
===================================================== */

function placeObject() {


    if (
        !xrRunning
    ) {

        /*
         * Fallback.
         */

        if (
            model
        ) {

            model.position.set(
                0,
                -0.5,
                -3
            );

        }


        setStatus(
            "Объект установлен в fallback режиме."
        );


        return;

    }


    if (
        !hitTestAvailable
    ) {

        setStatus(
            "Hit-test недоступен."
        );


        return;

    }


    /*
     * Получаем текущий
     * transform поверхности.
     */

    const position =
        new THREE.Vector3();


    const quaternion =
        new THREE.Quaternion();


    const scale =
        new THREE.Vector3();


    xrPlacementMatrix.decompose(

        position,

        quaternion,

        scale

    );


    if (
        model
    ) {

        model.position.copy(
            position
        );


        /*
         * Для объекта на полу
         * обычно оставляем
         * вертикальную ориентацию.
         *
         * Если нужна ориентация
         * самой поверхности —
         * можно использовать
         * quaternion полностью.
         */

        model.quaternion.identity();


        model.scale.set(
            modelScale,
            modelScale,
            modelScale
        );

    }


    xrPlaced =
        true;


    reticle.style.display =
        "none";


    setStatus(
        currentModelName +
        " установлен в пространстве. " +
        "Теперь можно обходить объект."
    );

}


/* =====================================================
   XR END
===================================================== */

function handleXREnd() {

    xrRunning =
        false;

    xrSession =
        null;

    xrReferenceSpace =
        null;

    viewerSpace =
        null;

    hitTestSource =
        null;

    hitTestAvailable =
        false;

    xrPlaced =
        false;


    reticle.style.display =
        "none";


    trackingBadge.textContent =
        "AR END";


    setStatus(
        "AR-сеанс завершён."
    );

}


/* =====================================================
   START
===================================================== */

async function startApplication() {


    startButton.disabled =
        true;


    try {

        /*
         * Сначала создаём Three.
         */

        initThree();


        /*
         * Проверяем WebXR.
         */

        const webXR =
            await checkWebXR();


        /*
         * Если WebXR доступен,
         * используем настоящий AR.
         */

        if (
            webXR
        ) {

            const started =
                await startXR();


            if (
                started
            ) {

                return;

            }

        }


        /*
         * WebXR не работает —
         * используем старый
         * рабочий режим камеры.
         */

        setStatus(
            "WebXR AR недоступен. " +
            "Запускаем обычную камеру."
        );


        await startFallbackCamera();

    }
    catch (
        error
    ) {

        console.error(
            error
        );


        setStatus(

            "Ошибка: " +
            error.name +
            " — " +
            error.message

        );


        startButton.disabled =
            false;

    }

}


/* =====================================================
   START BUTTON
===================================================== */

startButton.addEventListener(

    "click",

    startApplication

);


/* =====================================================
   PLACE BUTTON
===================================================== */

placeButton.addEventListener(

    "click",

    placeObject

);


/* =====================================================
   SCENE SELECT
===================================================== */

sceneList
    .querySelectorAll(
        ".sceneCard"
    )
    .forEach(

        card => {

            card.addEventListener(

                "click",

                () => {

                    sceneList
                        .querySelectorAll(
                            ".sceneCard"
                        )
                        .forEach(
                            item =>
                                item.classList
                                    .remove(
                                        "active"
                                    )
                        );


                    card.classList.add(
                        "active"
                    );


                    modelScale =
                        1;


                    xrPlaced =
                        false;


                    if (
                        xrRunning
                    ) {

                        reticle.style.display =
                            "block";

                    }


                    loadModel(

                        card.dataset.model,

                        card.dataset.name

                    );

                }

            );

        }

    );


/* =====================================================
   SCALE -
===================================================== */

document
    .getElementById(
        "minus"
    )
    .addEventListener(

        "click",

        () => {

            modelScale =
                Math.max(
                    0.1,
                    modelScale - 0.1
                );


            if (
                model
            ) {

                model.scale.set(
                    modelScale,
                    modelScale,
                    modelScale
                );

            }

        }

    );


/* =====================================================
   SCALE +
===================================================== */

document
    .getElementById(
        "plus"
    )
    .addEventListener(

        "click",

        () => {

            modelScale =
                Math.min(
                    5,
                    modelScale + 0.1
                );


            if (
                model
            ) {

                model.scale.set(
                    modelScale,
                    modelScale,
                    modelScale
                );

            }

        }

    );


/* =====================================================
   RESET
===================================================== */

document
    .getElementById(
        "reset"
    )
    .addEventListener(

        "click",

        () => {

            modelScale =
                1;


            xrPlaced =
                false;


            /*
             * WebXR:
             * снова ждём поверхность.
             */

            if (
                xrRunning
            ) {

                reticle.style.display =
                    "block";


                setStatus(
                    "Наведите камеру на поверхность."
                );


                return;

            }


            /*
             * Fallback.
             */

            fallbackPosition.set(
                0,
                0,
                0
            );


            fallbackVelocity.set(
                0,
                0,
                0
            );


            camera3D.position.set(
                0,
                0,
                0
            );


            camera3D.quaternion.identity();


            orientationInitialized =
                false;


            if (
                model
            ) {

                model.position.set(
                    0,
                    -0.5,
                    -3
                );


                model.rotation.set(
                    0,
                    0,
                    0
                );

            }


            setStatus(
                "Положение сброшено"
            );

        }

    );


/* =====================================================
   CLOSE
===================================================== */

closeButton.addEventListener(

    "click",

    async () => {

        /*
         * WebXR.
         */

        if (
            xrSession
        ) {

            try {

                await xrSession.end();

            }
            catch (
                error
            ) {

                console.error(
                    error
                );

            }

        }


        /*
         * Camera fallback.
         */

        const stream =
            video.srcObject;


        if (
            stream
        ) {

            stream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }


        video.srcObject =
            null;


        video.style.display =
            "none";


        canvas.style.display =
            "none";


        scenePanel.style.display =
            "none";


        arControls.style.display =
            "none";


        topBar.style.display =
            "none";


        closeButton.style.display =
            "none";


        debug.style.display =
            "none";


        reticle.style.display =
            "none";


        startScreen.style.display =
            "flex";


        xrRunning =
            false;


        xrPlaced =
            false;


        startButton.disabled =
            false;


        trackingBadge.textContent =
            "CHECKING";


        setStatus(
            "Готово"
        );

    }

);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(

    "resize",

    () => {

        if (
            !renderer ||
            !camera3D
        ) {

            return;

        }


        renderer.setSize(

            window.innerWidth,
            window.innerHeight

        );


        camera3D.aspect =

            window.innerWidth /
            window.innerHeight;


        camera3D.updateProjectionMatrix();

    }

);


/* =====================================================
   DEBUG
===================================================== */

function updateDebug() {

    if (
        !debug
    ) {

        return;

    }


    debug.innerHTML =

        "MODE: " +
        (
            xrRunning
                ? "WebXR 6DoF"
                : "Motion"
        ) +

        "<br>" +

        "X: " +
        camera3D.position.x
            .toFixed(3) +

        "<br>" +

        "Y: " +
        camera3D.position.y
            .toFixed(3) +

        "<br>" +

        "Z: " +
        camera3D.position.z
            .toFixed(3);

}

</script>
