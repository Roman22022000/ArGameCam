<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>AR Game</title>


    <!-- Telegram Mini App -->

    <script src="https://telegram.org/js/telegram-web-app.js"></script>


    <!-- Model Viewer -->

    <script
        type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;

            font-family: Arial, sans-serif;
        }


        #app {

            width: 100%;
            height: 100dvh;

            position: relative;
        }


        /* -------------------------
           START SCREEN
        ------------------------- */

        #startScreen {

            position: absolute;

            inset: 0;

            z-index: 20;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            padding: 25px;

            background: #111;

            color: white;

            text-align: center;
        }


        #startScreen h1 {

            font-size: 42px;

            margin-bottom: 15px;
        }


        #startScreen p {

            max-width: 350px;

            margin-bottom: 30px;

            opacity: .7;

            line-height: 1.5;
        }


        #cameraButton {

            border: none;

            border-radius: 16px;

            padding: 17px 30px;

            font-size: 18px;

            font-weight: bold;

            background: white;

            color: black;

            cursor: pointer;
        }


        /* -------------------------
           3D MODEL
        ------------------------- */

        model-viewer {

            width: 100%;

            height: 100%;

            background: transparent;
        }


        /* -------------------------
           TOP UI
        ------------------------- */

        #topUI {

            position: absolute;

            top: 15px;

            left: 15px;

            right: 15px;

            z-index: 10;

            display: none;

            justify-content: space-between;
        }


        .panel {

            padding: 10px 14px;

            border-radius: 12px;

            background: rgba(0,0,0,.65);

            color: white;

            backdrop-filter: blur(10px);
        }


        /* -------------------------
           AR BUTTON
        ------------------------- */

        #arButton {

            position: absolute;

            bottom: 30px;

            left: 50%;

            transform: translateX(-50%);

            z-index: 15;

            border: none;

            border-radius: 16px;

            padding: 16px 28px;

            background: white;

            color: black;

            font-size: 17px;

            font-weight: bold;

            display: none;
        }


        /* -------------------------
           STATUS
        ------------------------- */

        #status {

            position: absolute;

            bottom: 100px;

            left: 50%;

            transform: translateX(-50%);

            width: calc(100% - 40px);

            padding: 12px;

            border-radius: 12px;

            background: rgba(0,0,0,.75);

            color: white;

            text-align: center;

            display: none;

            z-index: 30;
        }

    </style>

</head>


<body>


<div id="app">


    <!-- START -->

    <div id="startScreen">

        <h1>AR GAME</h1>

        <p>
            Разместите 3D-объект
            в реальном пространстве.
        </p>

        <button id="cameraButton">
            Включить AR
        </button>

    </div>


    <!-- TOP -->

    <div id="topUI">

        <div class="panel">
            AR MODE
        </div>

        <div
            class="panel"
            id="userName">

            Player

        </div>

    </div>


    <!-- MODEL -->

    <model-viewer

        id="model"

        src="./models/creature.glb"

        ar

        ar-modes="scene-viewer webxr quick-look"

        camera-controls

        shadow-intensity="1"

        exposure="1"

        alt="AR Creature">


        <!-- AR BUTTON -->

        <button
            id="arButton"
            slot="ar-button">

            Разместить объект

        </button>


    </model-viewer>


    <!-- STATUS -->

    <div id="status"></div>


</div>


<script>


    /* ==========================
       TELEGRAM
    ========================== */

    const tg =
        window.Telegram.WebApp;


    tg.ready();

    tg.expand();


    /* ==========================
       USER
    ========================== */

    const user =
        tg.initDataUnsafe?.user;


    if (user) {

        document.getElementById(
            "userName"
        ).textContent =
            user.first_name ||
            user.username ||
            "Player";

    }


    /* ==========================
       ELEMENTS
    ========================== */

    const startScreen =
        document.getElementById(
            "startScreen"
        );


    const cameraButton =
        document.getElementById(
            "cameraButton"
        );


    const arButton =
        document.getElementById(
            "arButton"
        );


    const topUI =
        document.getElementById(
            "topUI"
        );


    const model =
        document.getElementById(
            "model"
        );


    const status =
        document.getElementById(
            "status"
        );


    /* ==========================
       STATUS MESSAGE
    ========================== */

    function showStatus(text) {

        status.textContent = text;

        status.style.display = "block";

    }


    /* ==========================
       MODEL LOADED
    ========================== */

    model.addEventListener(
        "load",
        () => {

            console.log(
                "3D модель загружена"
            );

        }
    );


    /* ==========================
       START AR
    ========================== */

    cameraButton.addEventListener(
        "click",
        async () => {

            console.log(
                "Кнопка AR нажата"
            );


            startScreen.style.display =
                "none";


            topUI.style.display =
                "flex";


            /*
             * Показываем кнопку
             * размещения объекта
             */

            arButton.style.display =
                "block";


            showStatus(
                "Подготовка AR..."
            );


            try {

                await model.updateComplete;


                console.log(
                    "canActivateAR:",
                    model.canActivateAR
                );


                /*
                 * Не блокируем запуск
                 * только из-за проверки
                 */

                if (model.canActivateAR) {

                    showStatus(
                        "Нажмите «Разместить объект»"
                    );

                }
                else {

                    showStatus(
                        "AR может быть недоступен в этом WebView"
                    );

                }


            }
            catch (error) {

                console.error(
                    error
                );

                showStatus(
                    "Ошибка подготовки AR"
                );

            }

        }
    );


    /* ==========================
       AR STATUS
    ========================== */

    model.addEventListener(
        "ar-status",
        event => {

            console.log(
                "AR STATUS:",
                event.detail.status
            );


            switch (
                event.detail.status
            ) {

                case "session-started":

                    showStatus(
                        "Наведите камеру на пол"
                    );

                    break;


                case "object-placed":

                    showStatus(
                        "Объект размещён"
                    );

                    break;


                case "not-presenting":

                    showStatus(
                        "AR завершён"
                    );

                    break;

            }

        }
    );


    /* ==========================
       ERROR
    ========================== */

    model.addEventListener(
        "error",
        event => {

            console.error(
                "MODEL ERROR:",
                event
            );

            showStatus(
                "Ошибка AR или 3D модели"
            );

        }
    );


</script>


</body>

</html>
