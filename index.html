<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<meta name="theme-color" content="#000000">

<title>AR Creature</title>

<!-- Telegram Mini App -->
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>

<!-- THREE IMPORT MAP -->
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
    touch-action: none;
}

#app {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #000;
}


/* START */

#startScreen {
    position: fixed;
    inset: 0;
    z-index: 100;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #000;
    padding: 24px;
}

.startBox {
    width: 100%;
    max-width: 360px;
    text-align: center;
}

.startBox h1 {
    margin: 0 0 12px;
    color: #fff;
    font-size: 44px;
    letter-spacing: 8px;
}

.startBox p {
    margin: 0 0 32px;
    color: #777;
}

#startButton {
    width: 100%;
    height: 58px;

    border: 0;
    border-radius: 14px;

    background: #fff;
    color: #000;

    font-size: 15px;
    font-weight: 700;
}

#startButton:disabled {
    opacity: .5;
}

#startMessage {
    margin-top: 14px;
    min-height: 20px;
    color: #777;
    font-size: 12px;
}


/* NORMAL CAMERA */

#camera {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: none;

    z-index: 1;
}


/* WEBXR CANVAS */

#xrCanvas {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    display: none;

    z-index: 2;

    pointer-events: none;
}


/* UI */

#arUI {
    position: fixed;
    inset: 0;

    z-index: 20;

    display: none;

    pointer-events: none;
}


/* STATUS */

#status {
    position: absolute;

    top: calc(
        15px +
        env(safe-area-inset-top)
    );

    left: 50%;

    transform: translateX(-50%);

    padding: 9px 14px;

    border-radius: 20px;

    background: rgba(0,0,0,.65);

    color: #fff;

    font-size: 12px;

    white-space: nowrap;
}


/* CLOSE */

#closeButton {
    position: absolute;

    top: calc(
        12px +
        env(safe-area-inset-top)
    );

    right: 12px;

    width: 44px;
    height: 44px;

    border: 0;
    border-radius: 50%;

    background: rgba(0,0,0,.7);

    color: #fff;

    font-size: 26px;

    pointer-events: auto;
}


/* RETICLE */

#reticle {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 48px;
    height: 48px;

    transform:
        translate(-50%, -50%);

    border:
        2px solid
        rgba(255,255,255,.5);

    border-radius: 50%;

    display: none;
}

#reticle::after {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 6px;
    height: 6px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: #fff;
}

#reticle.found {
    border-color: #fff;

    box-shadow:
        0 0 15px
        rgba(255,255,255,.6);
}


/* BUTTON */

#bottom {
    position: absolute;

    left: 20px;
    right: 20px;

    bottom: calc(
        20px +
        env(safe-area-inset-bottom)
    );

    display: flex;

    justify-content: center;
}

#placeButton {
    width: 100%;
    max-width: 380px;

    height: 58px;

    border: 1px solid #fff;
    border-radius: 14px;

    background: rgba(0,0,0,.8);

    color: #fff;

    font-size: 14px;
    font-weight: 700;

    display: none;

    pointer-events: auto;
}

#placeButton:disabled {
    opacity: .4;
}

</style>
</head>


<body>

<div id="app">


    <!-- START -->

    <div id="startScreen">

        <div class="startBox">

            <h1>AR</h1>

            <p>
                Creature AR
            </p>

            <button id="startButton">
                ЗАПУСК
            </button>

            <div id="startMessage">
                Готово
            </div>

        </div>

    </div>


    <!-- FALLBACK CAMERA -->

    <video
        id="camera"
        autoplay
        muted
        playsinline>
    </video>


    <!-- WEBXR -->

    <canvas id="xrCanvas"></canvas>


    <!-- AR UI -->

    <div id="arUI">

        <div id="status">
            AR
        </div>

        <button id="closeButton">
            ×
        </button>


        <div id="reticle"></div>


        <div id="bottom">

            <button id="placeButton">
                ДОБАВИТЬ 3D СЦЕНУ
            </button>

        </div>

    </div>


</div>


<script type="module">

/* ======================================================
   IMPORT
====================================================== */

import * as THREE from "three";

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";


/* ======================================================
   TELEGRAM
====================================================== */

const tg =
    window.Telegram?.WebApp || null;


/* ======================================================
   DOM
====================================================== */

const startScreen =
    document.getElementById(
        "startScreen"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const startMessage =
    document.getElementById(
        "startMessage"
    );

const cameraVideo =
    document.getElementById(
        "camera"
    );

const xrCanvas =
    document.getElementById(
        "xrCanvas"
    );

const arUI =
    document.getElementById(
        "arUI"
    );

const status =
    document.getElementById(
        "status"
    );

const reticle =
    document.getElementById(
        "reticle"
    );

const placeButton =
    document.getElementById(
        "placeButton"
    );

const closeButton =
    document.getElementById(
        "closeButton"
    );


/* ======================================================
   THREE
====================================================== */

let renderer = null;

let scene = null;

let camera3D = null;


/* ======================================================
   XR
====================================================== */

let xrSession = null;

let referenceSpace = null;

let viewerSpace = null;

let hitTestSource = null;

let currentHit = null;

let modelAnchor = null;


/* ======================================================
   MODEL
====================================================== */

let creature = null;

let modelLoaded = false;

let modelPlaced = false;


/* ======================================================
   NORMAL CAMERA
====================================================== */

let cameraStream = null;


/* ======================================================
   TELEGRAM INIT
====================================================== */

function initTelegram() {

    if (!tg) {
        return;
    }

    tg.ready();

    tg.expand();

    try {

        tg.requestFullscreen();

    } catch (_) {}

    try {

        tg.disableVerticalSwipes();

    } catch (_) {}

    try {

        tg.setHeaderColor(
            "#000000"
        );

        tg.setBackgroundColor(
            "#000000"
        );

    } catch (_) {}

}

initTelegram();


/* ======================================================
   THREE
====================================================== */

function initThree() {

    if (renderer) {
        return;
    }


    scene =
        new THREE.Scene();


    camera3D =
        new THREE.PerspectiveCamera(

            70,

            window.innerWidth /
            window.innerHeight,

            0.01,

            100

        );


    renderer =
        new THREE.WebGLRenderer({

            canvas: xrCanvas,

            alpha: true,

            antialias: true,

            powerPreference:
                "high-performance"

        });


    renderer.setPixelRatio(

        Math.min(
            window.devicePixelRatio,
            2
        )

    );


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    renderer.xr.enabled =
        true;


    /*
     * Lighting
     */

    const hemi =
        new THREE.HemisphereLight(

            0xffffff,

            0x444444,

            2.5

        );


    scene.add(
        hemi
    );


    const light =
        new THREE.DirectionalLight(

            0xffffff,

            2

        );


    light.position.set(
        2,
        4,
        2
    );


    scene.add(
        light
    );

}


/* ======================================================
   LOAD CREATURE
====================================================== */

function loadCreature() {

    if (
        modelLoaded ||
        creature
    ) {
        return;
    }


    const loader =
        new GLTFLoader();


    loader.load(

        "./models/creature.glb",


        /* LOADED */

        function(gltf) {

            creature =
                gltf.scene;


            /*
             * Сначала скрываем.
             */

            creature.visible =
                false;


            /*
             * ВАЖНО:
             * автоматически центрируем модель.
             */

            const box =
                new THREE.Box3()
                    .setFromObject(
                        creature
                    );


            const size =
                new THREE.Vector3();


            box.getSize(
                size
            );


            /*
             * Приводим модель примерно
             * к высоте 1 метр.
             */

            if (
                size.y > 0
            ) {

                const scale =
                    1 / size.y;


                creature.scale.setScalar(
                    scale
                );

            }


            /*
             * После масштабирования
             * снова вычисляем bounding box.
             */

            const scaledBox =
                new THREE.Box3()
                    .setFromObject(
                        creature
                    );


            const center =
                new THREE.Vector3();


            scaledBox.getCenter(
                center
            );


            /*
             * Центрируем X/Z.
             */

            creature.position.x -=
                center.x;

            creature.position.z -=
                center.z;


            /*
             * Нижняя точка модели
             * становится Y = 0.
             */

            creature.position.y -=
                scaledBox.min.y;


            scene.add(
                creature
            );


            modelLoaded =
                true;


            console.log(
                "creature.glb loaded"
            );


            if (
                xrSession &&
                !modelPlaced
            ) {

                status.textContent =
                    "НАВЕДИТЕ НА ПОЛ";

            }

        },


        /* PROGRESS */

        function(xhr) {

            if (
                xhr.lengthComputable
            ) {

                const percent =
                    Math.round(

                        xhr.loaded /
                        xhr.total *
                        100

                    );


                console.log(
                    "MODEL:",
                    percent + "%"
                );

            }

        },


        /* ERROR */

        function(error) {

            console.error(
                "MODEL ERROR:",
                error
            );


            status.textContent =
                "ОШИБКА МОДЕЛИ";

        }

    );

}


/* ======================================================
   START
====================================================== */

startButton.addEventListener(

    "click",

    startApplication

);


async function startApplication() {

    startButton.disabled =
        true;


    startMessage.textContent =
        "Запуск...";


    initThree();


    /*
     * Загружаем модель сразу.
     */

    loadCreature();


    /*
     * Запускаем Telegram sensors.
     */

    startTelegramSensors();


    /*
     * Сначала пытаемся
     * запустить настоящий AR.
     */

    try {

        await startXR();


        startScreen.style.display =
            "none";


        arUI.style.display =
            "block";


        xrCanvas.style.display =
            "block";


        return;

    }

    catch (error) {

        console.warn(
            "WebXR AR unavailable:",
            error
        );

    }


    /*
     * Если настоящий AR
     * недоступен —
     * запускаем обычную камеру.
     */

    try {

        await startNormalCamera();


        startScreen.style.display =
            "none";


        arUI.style.display =
            "block";


        status.textContent =
            "КАМЕРА — AR НЕДОСТУПЕН";


        /*
         * Не показываем кнопку,
         * потому что без world tracking
         * закрепить модель невозможно.
         */

        placeButton.style.display =
            "none";


    }

    catch (error) {

        console.error(
            error
        );


        startButton.disabled =
            false;


        startMessage.textContent =
            "Ошибка камеры";

    }

}


/* ======================================================
   WEBXR
====================================================== */

async function startXR() {

    if (
        !navigator.xr
    ) {

        throw new Error(
            "WebXR отсутствует"
        );

    }


    /*
     * Настоящий AR session.
     */

    xrSession =
        await navigator.xr
            .requestSession(

                "immersive-ar",

                {

                    requiredFeatures: [

                        "hit-test"

                    ],

                    optionalFeatures: [

                        "local-floor",

                        "anchors"

                    ]

                }

            );


    /*
     * Three.js XR session.
     */

    await renderer.xr
        .setSession(
            xrSession
        );


    /*
     * Пытаемся получить
     * local-floor.
     */

    try {

        referenceSpace =
            await xrSession
                .requestReferenceSpace(

                    "local-floor"

                );

    }

    catch (_) {

        /*
         * Fallback на local.
         */

        referenceSpace =
            await xrSession
                .requestReferenceSpace(

                    "local"

                );

    }


    /*
     * Viewer.
     */

    viewerSpace =
        await xrSession
            .requestReferenceSpace(

                "viewer"

            );


    /*
     * Hit Test.
     */

    hitTestSource =
        await xrSession
            .requestHitTestSource({

                space:
                    viewerSpace

            });


    /*
     * UI
     */

    status.textContent =
        "ИЩЕМ ПОЛ";


    reticle.style.display =
        "block";


    placeButton.style.display =
        "block";


    placeButton.disabled =
        true;


    /*
     * XR loop.
     */

    renderer.setAnimationLoop(
        renderXR
    );


    /*
     * End event.
     */

    xrSession.addEventListener(

        "end",

        function() {

            cleanupXR();

        }

    );

}


/* ======================================================
   XR RENDER LOOP
====================================================== */

function renderXR(
    time,
    frame
) {

    if (
        !frame ||
        !referenceSpace
    ) {

        return;

    }


    /*
     * ==================================================
     * SEARCH FLOOR / SURFACE
     * ==================================================
     */

    if (
        hitTestSource &&
        !modelPlaced
    ) {

        const results =
            frame.getHitTestResults(

                hitTestSource

            );


        if (
            results.length > 0
        ) {

            currentHit =
                results[0];


            reticle.classList.add(
                "found"
            );


            placeButton.disabled =
                false;


            if (
                modelLoaded
            ) {

                status.textContent =
                    "ПОВЕРХНОСТЬ НАЙДЕНА";

            }

            else {

                status.textContent =
                    "ЗАГРУЗКА 3D МОДЕЛИ";

            }

        }

        else {

            currentHit =
                null;


            reticle.classList.remove(
                "found"
            );


            placeButton.disabled =
                true;


            status.textContent =
                "ИЩЕМ ПОЛ";

        }

    }


    /*
     * ==================================================
     * ANCHOR TRACKING
     * ==================================================
     */

    if (
        modelAnchor &&
        creature
    ) {

        const anchorPose =
            frame.getPose(

                modelAnchor.anchorSpace,

                referenceSpace

            );


        if (
            anchorPose
        ) {

            applyPoseToModel(
                anchorPose
            );

        }

    }


    /*
     * Render.
     */

    renderer.render(

        scene,

        camera3D

    );

}


/* ======================================================
   PLACE MODEL
====================================================== */

placeButton.addEventListener(

    "click",

    placeModel

);


async function placeModel() {

    /*
     * GLB должен быть загружен.
     */

    if (
        !modelLoaded ||
        !creature
    ) {

        status.textContent =
            "МОДЕЛЬ ЗАГРУЖАЕТСЯ";

        return;

    }


    /*
     * Должна быть найдена
     * поверхность.
     */

    if (
        !currentHit ||
        !referenceSpace
    ) {

        status.textContent =
            "НАВЕДИТЕ НА ПОЛ";

        return;

    }


    placeButton.disabled =
        true;


    /*
     * Получаем pose поверхности.
     */

    const hitPose =
        currentHit.getPose(

            referenceSpace

        );


    if (
        !hitPose
    ) {

        status.textContent =
            "ТОЧКА ПОТЕРЯНА";


        placeButton.disabled =
            false;


        return;

    }


    /*
     * Сначала устанавливаем
     * модель непосредственно
     * по hit-test.
     */

    applyPoseToModel(
        hitPose
    );


    creature.visible =
        true;


    /*
     * ==================================================
     * CREATE REAL XR ANCHOR
     * ==================================================
     */

    if (
        typeof currentHit.createAnchor ===
        "function"
    ) {

        try {

            modelAnchor =
                await currentHit
                    .createAnchor();


            console.log(
                "XRAnchor created"
            );

        }

        catch (error) {

            console.warn(
                "Anchor unavailable:",
                error
            );


            modelAnchor =
                null;

        }

    }


    /*
     * Теперь модель считается
     * установленной.
     */

    modelPlaced =
        true;


    /*
     * Hit-test больше не нужен.
     */

    if (
        hitTestSource
    ) {

        try {

            hitTestSource.cancel();

        }

        catch (_) {}


        hitTestSource =
            null;

    }


    currentHit =
        null;


    /*
     * UI
     */

    reticle.style.display =
        "none";


    placeButton.style.display =
        "none";


    status.textContent =

        modelAnchor
            ? "3D СЦЕНА ЗАКРЕПЛЕНА"
            : "3D СЦЕНА РАЗМЕЩЕНА";

}


/* ======================================================
   APPLY XR POSE
====================================================== */

function applyPoseToModel(
    pose
) {

    /*
     * Матрица hit-test / anchor.
     */

    const matrix =
        new THREE.Matrix4()
            .fromArray(

                pose.transform.matrix

            );


    /*
     * Получаем позицию,
     * вращение и масштаб.
     */

    const position =
        new THREE.Vector3();


    const quaternion =
        new THREE.Quaternion();


    const scale =
        new THREE.Vector3();


    matrix.decompose(

        position,

        quaternion,

        scale

    );


    /*
     * Устанавливаем позицию.
     */

    creature.position.copy(
        position
    );


    /*
     * Оставляем ориентацию
     * поверхности.
     */

    creature.quaternion.copy(
        quaternion
    );

}


/* ======================================================
   TELEGRAM SENSORS
====================================================== */

function startTelegramSensors() {

    if (!tg) {
        return;
    }


    /*
     * Orientation
     */

    try {

        tg.DeviceOrientation?.start(

            {

                refresh_rate:
                    50,

                need_absolute:
                    false

            }

        );

    }

    catch (_) {}


    /*
     * Gyroscope
     */

    try {

        tg.Gyroscope?.start(

            {

                refresh_rate:
                    50

            }

        );

    }

    catch (_) {}


    /*
     * Accelerometer
     */

    try {

        tg.Accelerometer?.start(

            {

                refresh_rate:
                    50

            }

        );

    }

    catch (_) {}

}


/* ======================================================
   NORMAL CAMERA FALLBACK
====================================================== */

async function startNormalCamera() {

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        throw new Error(
            "Camera API unavailable"
        );

    }


    cameraStream =
        await navigator.mediaDevices
            .getUserMedia({

                video: {

                    facingMode: {

                        ideal:
                            "environment"

                    }

                },

                audio:
                    false

            });


    cameraVideo.srcObject =
        cameraStream;


    await cameraVideo.play();


    cameraVideo.style.display =
        "block";

}


/* ======================================================
   CLOSE
====================================================== */

closeButton.addEventListener(

    "click",

    stopApplication

);


async function stopApplication() {

    /*
     * Anchor
     */

    if (
        modelAnchor
    ) {

        try {

            modelAnchor.delete();

        }

        catch (_) {}


        modelAnchor =
            null;

    }


    /*
     * XR
     */

    if (
        xrSession
    ) {

        try {

            await xrSession.end();

        }

        catch (_) {}

    }


    /*
     * Camera
     */

    if (
        cameraStream
    ) {

        cameraStream
            .getTracks()
            .forEach(

                track =>
                    track.stop()

            );


        cameraStream =
            null;

    }


    cameraVideo.srcObject =
        null;


    /*
     * Telegram sensors
     */

    if (tg) {

        try {

            tg.DeviceOrientation?.stop();

        }

        catch (_) {}


        try {

            tg.Gyroscope?.stop();

        }

        catch (_) {}


        try {

            tg.Accelerometer?.stop();

        }

        catch (_) {}

    }


    /*
     * Reset model.
     */

    if (
        creature
    ) {

        creature.visible =
            false;

    }


    modelPlaced =
        false;


    cleanupXR();


    /*
     * UI
     */

    cameraVideo.style.display =
        "none";


    xrCanvas.style.display =
        "none";


    arUI.style.display =
        "none";


    startScreen.style.display =
        "flex";


    startButton.disabled =
        false;


    startMessage.textContent =
        "Готово";


    reticle.style.display =
        "none";


    reticle.classList.remove(
        "found"
    );


    placeButton.style.display =
        "none";

}


/* ======================================================
   CLEAN XR
====================================================== */

function cleanupXR() {

    if (
        hitTestSource
    ) {

        try {

            hitTestSource.cancel();

        }

        catch (_) {}

    }


    hitTestSource =
        null;

    currentHit =
        null;

    viewerSpace =
        null;

    referenceSpace =
        null;

    xrSession =
        null;


    if (
        renderer
    ) {

        renderer.setAnimationLoop(
            null
        );

    }

}


/* ======================================================
   RESIZE
====================================================== */

window.addEventListener(

    "resize",

    function() {

        if (
            !renderer ||
            !camera3D
        ) {

            return;

        }


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );


        camera3D.aspect =

            window.innerWidth /
            window.innerHeight;


        camera3D
            .updateProjectionMatrix();

    }

);

</script>
