<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 maximum-scale=1,
                 user-scalable=no,
                 viewport-fit=cover"
    >

    <title>AR Gallery</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
            color: white;
        }

        body {
            touch-action: manipulation;
        }

        /* -----------------------------
           ЭКРАНЫ
        ----------------------------- */

        .screen {
            position: fixed;
            inset: 0;

            display: none;

            width: 100%;
            height: 100%;

            background: #000;
        }

        .screen.active {
            display: flex;
        }

        /* -----------------------------
           ГЛАВНЫЙ ЭКРАН
        ----------------------------- */

        #homeScreen {
            align-items: center;
            justify-content: center;
            flex-direction: column;

            padding:
                calc(20px + env(safe-area-inset-top))
                20px
                calc(20px + env(safe-area-inset-bottom))
                20px;
        }

        .title {
            font-size: clamp(28px, 8vw, 52px);
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 35px;
            text-align: center;
        }

        .main-button {
            width: min(80vw, 320px);
            min-height: 58px;

            border: none;
            border-radius: 18px;

            background: white;
            color: black;

            font-size: 18px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                opacity 0.15s ease;
        }

        .main-button:active {
            transform: scale(0.96);
        }

        /* -----------------------------
           ГАЛЕРЕЯ
        ----------------------------- */

        #galleryScreen {
            flex-direction: column;

            padding:
                calc(20px + env(safe-area-inset-top))
                20px
                calc(20px + env(safe-area-inset-bottom))
                20px;
        }

        .gallery-header {
            display: flex;
            align-items: center;

            width: 100%;
            height: 60px;
            flex-shrink: 0;
        }

        .back-button {
            border: none;
            background: rgba(255,255,255,0.12);

            color: white;

            width: 48px;
            height: 48px;

            border-radius: 14px;

            font-size: 22px;

            cursor: pointer;
        }

        .gallery-title {
            margin-left: 15px;

            font-size: 24px;
            font-weight: 700;
        }

        .gallery-grid {
            width: 100%;
            max-width: 600px;

            margin: auto;

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 12px;
        }

        .model-button {
            aspect-ratio: 1 / 1;

            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px;

            background: #111;

            color: white;

            font-size: clamp(28px, 9vw, 48px);
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }

        .model-button:active {
            transform: scale(0.94);
            background: #222;
        }

        /* -----------------------------
           3D SCREEN
        ----------------------------- */

        #viewerScreen {
            position: fixed;
            inset: 0;

            background: #000;

            display: none;
        }

        #viewerScreen.active {
            display: block;
        }

        #canvas-container {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;

            width: 100%;
            height: 100%;
        }

        /* -----------------------------
           UI В 3D
        ----------------------------- */

        .viewer-ui {
            position: absolute;

            top: calc(12px + env(safe-area-inset-top));
            left: 12px;
            right: 12px;

            display: flex;
            justify-content: space-between;

            pointer-events: none;

            z-index: 10;
        }

        .viewer-button {
            pointer-events: auto;

            border: 1px solid rgba(255,255,255,0.15);

            background: rgba(0,0,0,0.55);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            color: white;

            border-radius: 14px;

            min-width: 48px;
            height: 48px;

            font-size: 20px;

            cursor: pointer;
        }

        .viewer-info {
            position: absolute;

            left: 50%;
            bottom: calc(20px + env(safe-area-inset-bottom));

            transform: translateX(-50%);

            padding: 10px 16px;

            border-radius: 20px;

            background: rgba(0,0,0,0.5);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            font-size: 13px;

            white-space: nowrap;

            opacity: 0.85;

            pointer-events: none;
        }

        /* -----------------------------
           SENSOR STATUS
        ----------------------------- */

        #sensorStatus {
            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            padding: 18px 22px;

            max-width: 85%;

            border-radius: 18px;

            background: rgba(0,0,0,0.78);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            text-align: center;

            font-size: 15px;

            line-height: 1.4;

            z-index: 20;
        }

        #sensorStatus.hidden {
            display: none;
        }

        /* -----------------------------
           LOADING
        ----------------------------- */

        #loading {
            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #000;

            z-index: 30;

            font-size: 16px;
        }

        #loading.hidden {
            display: none;
        }

        /* -----------------------------
           DESKTOP
        ----------------------------- */

        @media (min-width: 700px) {
            .gallery-grid {
                grid-template-columns:
                    repeat(4, minmax(100px, 150px));

                justify-content: center;
            }

            .model-button {
                font-size: 42px;
            }
        }

    </style>
</head>

<body>

<!-- =========================================

========================================= -->

<section

    <div class="viewer-ui">

    </div>

    <div

    </div>

    <div class="viewer-info">

    </div>

<!-- =========================================
     THREE.JS
========================================= -->

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>


<script type="module">

import * as THREE from "three";

import { GLTFLoader }
    from "three/addons/loaders/GLTFLoader.js";



/* =====================================================
   TELEGRAM
===================================================== */

const tg = window.Telegram?.WebApp || null;

if (tg) {

    tg.ready();

    tg.expand();

    if (tg.setHeaderColor) {
        tg.setHeaderColor("#000000");
    }

    if (tg.setBackgroundColor) {
        tg.setBackgroundColor("#000000");
    }

    /*
       Отключаем блокировку ориентации,
       чтобы телефон мог нормально вращаться.
    */

    try {

        if (tg.unlockOrientation) {
            tg.unlockOrientation();
        }

    } catch (error) {

        console.log(
            "unlockOrientation:",
            error
        );

    }

}



/* =====================================================
   ЭКРАНЫ
===================================================== */

const homeScreen =
    document.getElementById("homeScreen");

const galleryScreen =
    document.getElementById("galleryScreen");

const viewerScreen =
    document.getElementById("viewerScreen");

const loading =
    document.getElementById("loading");

const sensorStatus =
    document.getElementById("sensorStatus");



function showScreen(screen) {

    homeScreen.classList.remove("active");

    galleryScreen.classList.remove("active");

    viewerScreen.classList.remove("active");

    screen.classList.add("active");

}



/* =====================================================
   КНОПКИ
===================================================== */

document
    .getElementById("openGalleryButton")
    .addEventListener(
        "click",
        () => {

            showScreen(galleryScreen);

        }
    );


document
    .getElementById("galleryBackButton")
    .addEventListener(
        "click",
        () => {

            showScreen(homeScreen);

        }
    );


document
    .getElementById("viewerBackButton")
    .addEventListener(
        "click",
        () => {

            stopSensors();

            showScreen(galleryScreen);

        }
    );



/* =====================================================
   THREE.JS
===================================================== */

let scene;
let camera;
let renderer;

let model = null;

let animationFrame;



const modelRoot =
    new THREE.Group();



function initThree() {

    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(0x000000);


    /*
       КАМЕРА

       Она НЕ является частью модели.

       Модель находится строго в:
       X = 0
       Y = 0
       Z = 0
    */

    camera =
        new THREE.PerspectiveCamera(
            60,
            window.innerWidth /
            window.innerHeight,
            0.01,
            100
        );


    /*
       Камера находится на фиксированном
       расстоянии от центра.

       Поэтому физическое перемещение
       телефона не перемещает модель.
    */

    camera.position.set(
        0,
        0,
        3
    );


    scene.add(camera);


    /*
       Группа модели находится
       строго в мировом центре.
    */

    scene.add(modelRoot);


    /*
       ОСВЕЩЕНИЕ
    */

    const ambient =
        new THREE.HemisphereLight(
            0xffffff,
            0x222222,
            2.2
        );

    scene.add(ambient);


    const directional =
        new THREE.DirectionalLight(
            0xffffff,
            2.5
        );

    directional.position.set(
        3,
        5,
        4
    );

    scene.add(directional);


    const directional2 =
        new THREE.DirectionalLight(
            0xffffff,
            1.2
        );

    directional2.position.set(
        -4,
        2,
        -3
    );

    scene.add(directional2);


    /*
       RENDERER
    */

    renderer =
        new THREE.WebGLRenderer({
            antialias: true,
            alpha: false,
            powerPreference: "high-performance"
        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    renderer.toneMapping =
        THREE.ACESFilmicToneMapping;


    renderer.toneMappingExposure =
        1.2;


    document
        .getElementById("canvas-container")
        .appendChild(
            renderer.domElement
        );


    window.addEventListener(
        "resize",
        onResize
    );


    animate();

}



initThree();



/* =====================================================
   ЗАГРУЗЧИК GLB
===================================================== */

const loader =
    new GLTFLoader();



async function loadModel(url) {

    loading.classList.remove("hidden");


    /*
       Удаляем предыдущую модель.
    */

    while (
        modelRoot.children.length > 0
    ) {

        const object =
            modelRoot.children[0];

        modelRoot.remove(object);


        object.traverse(
            child => {

                if (child.geometry) {

                    child.geometry.dispose();

                }


                if (child.material) {

                    if (
                        Array.isArray(
                            child.material
                        )
                    ) {

                        child.material.forEach(
                            material => {

                                material.dispose();

                            }
                        );

                    } else {

                        child.material.dispose();

                    }

                }

            }
        );

    }


    model = null;


    try {

        const gltf =
            await loader.loadAsync(url);


        model =
            gltf.scene;


        /*
           =================================================
           ЦЕНТРИРОВАНИЕ МОДЕЛИ
           =================================================

           Сам Group находится в мировом центре.

           Но сама геометрия GLB может иметь
           внутреннее смещение.

           Поэтому вычисляем BoundingBox
           и переносим модель так,
           чтобы её геометрический центр
           совпал с:

               0, 0, 0
        */

        const box =
            new THREE.Box3()
                .setFromObject(model);


        const center =
            new THREE.Vector3();


        box.getCenter(center);


        model.position.sub(center);


        /*
           Масштабирование.

           Делаем модель подходящего размера
           относительно камеры.
        */

        const size =
            new THREE.Vector3();


        box.getSize(size);


        const maxSize =
            Math.max(
                size.x,
                size.y,
                size.z
            );


        if (maxSize > 0) {

            const targetSize = 2.0;

            const scale =
                targetSize /
                maxSize;

            model.scale.setScalar(
                scale
            );

        }


        /*
           После центрирования модель
           добавляется непосредственно
           в центральную группу.
        */

        modelRoot.add(model);


        /*
           Небольшая коррекция высоты.

           Если нужна абсолютная точка 0,0,0,
           эту часть можно убрать.
        */

        model.position.y = 0;


        /*
           Запоминаем исходный масштаб.
        */

        modelRoot.rotation.set(
            0,
            0,
            0
        );


        loading.classList.add(
            "hidden"
        );


        console.log(
            "GLB загружен:",
            url
        );


    } catch (error) {

        console.error(
            "Ошибка загрузки GLB:",
            error
        );


        loading.innerHTML =
            "Ошибка загрузки 3D модели";


        setTimeout(
            () => {

                loading.classList.add(
                    "hidden"
                );

            },
            2000
        );

    }

}



/* =====================================================
   КНОПКИ ГАЛЕРЕИ
===================================================== */

document
    .querySelectorAll(".model-button")
    .forEach(
        button => {

            button.addEventListener(
                "click",
                async () => {

                    const modelPath =
                        button.dataset.model;


                    showScreen(
                        viewerScreen
                    );


                    await loadModel(
                        modelPath
                    );


                    /*
                       После открытия модели
                       запускаем сенсоры.
                    */

                    startSensors();

                }
            );

        }
    );



/* =====================================================
   СИСТЕМА ОРИЕНТАЦИИ
===================================================== */

/*
   ВАЖНО:

   Telegram DeviceOrientation:

   alpha = вращение вокруг Z
   beta  = наклон вокруг X
   gamma = наклон вокруг Y

   Все значения Telegram предоставляет
   в РАДИАНАХ.

   Это отличается от стандартного
   browser DeviceOrientationEvent,
   где значения обычно в градусах.
*/



let sensorActive = false;


/*
   Начальная ориентация.

   Она нужна для того, чтобы при запуске
   модели телефон не делал резкий скачок.
*/

let initialOrientation = null;


/*
   Quaternion телефона.
*/

const deviceQuaternion =
    new THREE.Quaternion();


/*
   Quaternion начальной ориентации.
*/

const initialQuaternion =
    new THREE.Quaternion();


/*
   Для плавности движения.
*/

const targetCameraQuaternion =
    new THREE.Quaternion();


const smoothCameraQuaternion =
    new THREE.Quaternion();


/*
   Фиксированное расстояние
   камеры от модели.
*/

const CAMERA_DISTANCE = 3;



/* =====================================================
   TELEGRAM DEVICE ORIENTATION
===================================================== */

function startTelegramOrientation() {

    if (
        !tg ||
        !tg.DeviceOrientation
    ) {

        return false;

    }


    try {

        /*
           Слушаем изменения.

           Telegram не передаёт данные
           непосредственно в callback.

           Значения читаются из:

           tg.DeviceOrientation.alpha
           tg.DeviceOrientation.beta
           tg.DeviceOrientation.gamma
        */

        tg.onEvent(
            "deviceOrientationChanged",
            onTelegramOrientation
        );


        tg.onEvent(
            "deviceOrientationFailed",
            event => {

                console.error(
                    "Telegram orientation failed:",
                    event
                );


                showSensorError(
                    "Telegram не смог запустить датчики"
                );

            }
        );


        /*
           Запуск сенсора.

           20 мс ≈ 50 обновлений/сек.
        */

        tg.DeviceOrientation.start(
            {
                refresh_rate: 20,
                need_absolute: false
            },
            started => {

                if (started) {

                    sensorActive = true;

                    hideSensorStatus();

                    console.log(
                        "Telegram DeviceOrientation запущен"
                    );

                } else {

                    showSensorError(
                        "Не удалось запустить датчик ориентации"
                    );

                }

            }
        );


        return true;

    } catch (error) {

        console.error(
            error
        );

        return false;

    }

}



/* =====================================================
   TELEGRAM ORIENTATION EVENT
===================================================== */

function onTelegramOrientation() {

    if (
        !tg ||
        !tg.DeviceOrientation
    ) {

        return;

    }


    const alpha =
        tg.DeviceOrientation.alpha || 0;

    const beta =
        tg.DeviceOrientation.beta || 0;

    const gamma =
        tg.DeviceOrientation.gamma || 0;


    /*
       Telegram использует:

       alpha = Z
       beta  = X
       gamma = Y

       Three.js корректно работает
       с Euler YXZ для device orientation.
    */

    const euler =
        new THREE.Euler(
            beta,
            alpha,
            -gamma,
            "YXZ"
        );


    deviceQuaternion
        .setFromEuler(euler);


    /*
       Первое значение принимаем
       как исходное положение телефона.
    */

    if (!initialOrientation) {

        initialOrientation = true;

        initialQuaternion
            .copy(deviceQuaternion);

    }


    /*
       Относительное вращение:

       current × inverse(initial)
    */

    const relativeQuaternion =
        new THREE.Quaternion()
            .copy(initialQuaternion)
            .invert()
            .multiply(
                deviceQuaternion
            );


    targetCameraQuaternion
        .copy(relativeQuaternion);


    /*
       Ограничение логики:

       модель НЕ вращаем.

       вращаем только камеру.
    */

}



/* =====================================================
   BROWSER FALLBACK
===================================================== */

let browserOrientationActive = false;



function startBrowserOrientation() {

    if (
        !("DeviceOrientationEvent" in window)
    ) {

        return false;

    }


    /*
       iOS требует permission.
    */

    if (
        typeof DeviceOrientationEvent
            .requestPermission ===
        "function"
    ) {

        DeviceOrientationEvent
            .requestPermission()
            .then(
                permission => {

                    if (
                        permission === "granted"
                    ) {

                        window.addEventListener(
                            "deviceorientation",
                            onBrowserOrientation,
                            true
                        );


                        browserOrientationActive =
                            true;


                        sensorActive = true;


                        hideSensorStatus();

                    } else {

                        showSensorError(
                            "Доступ к датчикам запрещён"
                        );

                    }

                }
            )
            .catch(
                error => {

                    console.error(
                        error
                    );

                    showSensorError(
                        "Ошибка доступа к датчикам"
                    );

                }
            );

    } else {

        window.addEventListener(
            "deviceorientation",
            onBrowserOrientation,
            true
        );


        browserOrientationActive =
            true;


        sensorActive = true;


        hideSensorStatus();

    }


    return true;

}



/* =====================================================
   BROWSER ORIENTATION
===================================================== */

function onBrowserOrientation(event) {

    /*
       Browser:

       alpha / beta / gamma
       обычно в градусах.

       Переводим в радианы.
    */

    const alpha =
        THREE.MathUtils.degToRad(
            event.alpha || 0
        );


    const beta =
        THREE.MathUtils.degToRad(
            event.beta || 0
        );


    const gamma =
        THREE.MathUtils.degToRad(
            event.gamma || 0
        );


    const euler =
        new THREE.Euler(
            beta,
            alpha,
            -gamma,
            "YXZ"
        );


    deviceQuaternion
        .setFromEuler(euler);


    if (!initialOrientation) {

        initialOrientation = true;

        initialQuaternion
            .copy(deviceQuaternion);

    }


    targetCameraQuaternion
        .copy(initialQuaternion)
        .invert()
        .multiply(
            deviceQuaternion
        );

}



/* =====================================================
   ЗАПУСК СЕНСОРОВ
===================================================== */

function startSensors() {

    initialOrientation = null;


    sensorActive = false;


    /*
       Сначала Telegram API.

       Это главный вариант для Mini App.
    */

    if (
        startTelegramOrientation()
    ) {

        showSensorStatus(
            "Запуск ориентации телефона..."
        );

        return;

    }


    /*
       Если сайт открыт обычным браузером —
       используем browser API.
    */

    if (
        startBrowserOrientation()
    ) {

        showSensorStatus(
            "Запуск ориентации телефона..."
        );

        return;

    }


    showSensorError(
        "Устройство не поддерживает ориентацию"
    );

}



/* =====================================================
   ОСТАНОВКА СЕНСОРОВ
===================================================== */

function stopSensors() {

    sensorActive = false;


    initialOrientation = null;


    /*
       Telegram
    */

    if (
        tg &&
        tg.DeviceOrientation
    ) {

        try {

            tg.DeviceOrientation.stop();

        } catch (error) {

            console.log(
                error
            );

        }

    }


    /*
       Убираем Telegram event.
    */

    if (tg) {

        try {

            tg.offEvent(
                "deviceOrientationChanged",
                onTelegramOrientation
            );

        } catch (error) {

            console.log(
                error
            );

        }

    }


    /*
       Browser
    */

    if (
        browserOrientationActive
    ) {

        window.removeEventListener(
            "deviceorientation",
            onBrowserOrientation,
            true
        );

        browserOrientationActive =
            false;

    }

}



/* =====================================================
   SENSOR UI
===================================================== */

function showSensorStatus(text) {

    sensorStatus.textContent =
        text;

    sensorStatus.classList.remove(
        "hidden"
    );

}



function hideSensorStatus() {

    sensorStatus.classList.add(
        "hidden"
    );

}



function showSensorError(text) {

    sensorStatus.textContent =
        text;

    sensorStatus.classList.remove(
        "hidden"
    );

}



/* =====================================================
   КНОПКА СЕНСОРА
===================================================== */

document
    .getElementById("sensorButton")
    .addEventListener(
        "click",
        () => {

            startSensors();

        }
    );



/* =====================================================
   CAMERA
===================================================== */

function updateCameraFromDevice() {

    if (
        !sensorActive
    ) {

        return;

    }


    /*
       Плавно приближаем текущую
       ориентацию камеры к ориентации
       телефона.
    */

    smoothCameraQuaternion.slerp(
        targetCameraQuaternion,
        0.18
    );


    camera.quaternion.copy(
        smoothCameraQuaternion
    );


    /*
       Камера всегда находится
       на фиксированном расстоянии
       от центра.

       То есть:

             телефон вращается
                    ↓
             камера вращается
                    ↓
             модель остаётся
             в (0,0,0)
    */

    const direction =
        new THREE.Vector3(
            0,
            0,
            -1
        );


    direction.applyQuaternion(
        camera.quaternion
    );


    camera.position.copy(
        direction
            .multiplyScalar(
                -CAMERA_DISTANCE
            )
    );


    /*
       Камера смотрит на центр.
    */

    camera.lookAt(
        0,
        0,
        0
    );


    /*
       После lookAt повторно задаём
       ориентацию с учётом устройства.

       Это позволяет вращаться вокруг
       фиксированной модели.
    */

    camera.quaternion.copy(
        smoothCameraQuaternion
    );

}



/* =====================================================
   RENDER LOOP
===================================================== */

function animate() {

    animationFrame =
        requestAnimationFrame(
            animate
        );


    updateCameraFromDevice();


    if (
        renderer &&
        scene &&
        camera
    ) {

        renderer.render(
            scene,
            camera
        );

    }

}



/* =====================================================
   RESIZE
===================================================== */

function onResize() {

    if (!camera || !renderer) {
        return;
    }


    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}



/* =====================================================
   ОСТАНОВКА ПРИ СКРЫТИИ
===================================================== */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.hidden
        ) {

            stopSensors();

        }

    }
);



</script>
