<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Оставить номер телефона</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#101827;color:#edf4ff;font:16px system-ui}
main{width:min(100%,420px);padding:26px;border:1px solid #33445c;border-radius:18px;background:#192536}
input[type=tel],button{width:100%;padding:12px;margin:10px 0;border-radius:8px;font:inherit}button{border:0;background:#83c3ff;color:#0b1929;font-weight:bold}p{line-height:1.5}
</style>
<main>
<h1>Оставить номер</h1>
<form id="phone-form">
<label for="phone">Номер телефона</label>
<input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="+7 900 000-00-00" maxlength="40" required>
<label><input type="checkbox" name="consent" required> Разрешаю сохранить мой номер, чтобы со мной связались.</label>
<button type="submit">Отправить</button>
<p id="status" role="status"></p>
</form>
</main>
<script>
const form = document.querySelector('#phone-form');
const status = document.querySelector('#status');
const button = form.querySelector('button');

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  button.disabled = true;
  status.textContent = 'Отправляем…';
  try {
    // Страница и API работают на одном адресе через Cloudflare Tunnel.
    const response = await fetch(location.hostname === '127.0.0.1' || location.hostname === 'localhost'
      ? '/api/phone' : 'https://phone.araicameragame.party/api/phone', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({phone: form.elements.phone.value, consent: form.elements.consent.checked})
    });
    const reply = await response.json().catch(() => ({}));
    if (!response.ok || reply.ok !== true) throw new Error(reply.error || 'Ошибка HTTP ' + response.status);
    status.textContent = 'Номер записан. Спасибо!';
    form.reset();
  } catch (error) {
    status.textContent = 'Не удалось отправить номер. ' + error.message;
  } finally {
    button.disabled = false;
  }
});
</script>
</html>
