>

    name="theme-color"

{
    "imports": {

            "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

<style>

/* =====================================================
   RESET
====================================================== */

* {
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: #000;

    color: #fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    touch-action: none;

    -webkit-user-select: none;
    user-select: none;
}


/* =====================================================
   APP
====================================================== */

#app {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;
}


/* =====================================================
   START SCREEN
====================================================== */

#startScreen {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 24px;

    background: #000;
}

.startBox {

    width: 100%;

    max-width: 360px;

    text-align: center;
}

.startTitle {

    margin: 0 0 12px;

    font-size: 44px;

    line-height: 1;

    letter-spacing: 8px;
}

.startSubtitle {

    margin: 0 0 32px;

    color: #777;

    font-size: 14px;
}

#startButton {

    width: 100%;

    height: 58px;

    border: 0;

    border-radius: 14px;

    background: #fff;

    color: #000;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;

    -webkit-tap-highlight-color:
        transparent;
}

#startButton:active {

    transform: scale(.98);
}

#startButton:disabled {

    opacity: .5;
}

#startMessage {

    min-height: 18px;

    margin-top: 14px;

    color: #777;

    font-size: 12px;
}


/* =====================================================
   WEBXR CANVAS
====================================================== */

#xrCanvas {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    display: none;

    z-index: 1;

    pointer-events: none;
}


/* =====================================================
   NORMAL CAMERA FALLBACK
====================================================== */

#camera {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: none;

    z-index: 1;

    background: #000;
}


/* =====================================================
   AR UI
====================================================== */

#arUI {

    position: fixed;

    inset: 0;

    z-index: 10;

    display: none;

    pointer-events: none;
}


/* =====================================================
   TOP BAR
====================================================== */

#topBar {

    position: absolute;

    top:
        calc(
            12px +
            env(safe-area-inset-top)
        );

    left: 12px;

    right: 12px;

    display: flex;

    align-items: center;

    justify-content: space-between;
}

#status {

    max-width:
        calc(100% - 60px);

    padding:
        9px 14px;

    border-radius: 20px;

    background:
        rgba(0,0,0,.65);

    color: #fff;

    font-size: 12px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    backdrop-filter:
        blur(8px);
}

#closeButton {

    width: 44px;

    height: 44px;

    border: 0;

    border-radius: 50%;

    background:
        rgba(0,0,0,.7);

    color: #fff;

    font-size: 27px;

    pointer-events: auto;

    cursor: pointer;
}


/* =====================================================
   RETICLE
====================================================== */

#reticle {

    position: absolute;

    left: 50%;

    top: 50%;

    width: 44px;

    height: 44px;

    transform:
        translate(
            -50%,
            -50%
        );

    border:
        1px solid
        rgba(255,255,255,.8);

    border-radius: 50%;

    transition:
        .2s ease;
}

#reticle.ready {

    border:
        2px solid #fff;

    box-shadow:
        0 0 12px
        rgba(255,255,255,.4);
}


/* =====================================================
   BOTTOM
====================================================== */

#bottomBar {

    position: absolute;

    left: 20px;

    right: 20px;

    bottom:
        calc(
            20px +
            env(safe-area-inset-bottom)
        );

    display: flex;

    justify-content: center;
}

#placeButton {

    width: 100%;

    max-width: 360px;

    height: 56px;

    border:
        1px solid
        rgba(255,255,255,.85);

    border-radius: 14px;

    background:
        rgba(0,0,0,.78);

    color: #fff;

    font-size: 14px;

    font-weight: 700;

    pointer-events: auto;

    cursor: pointer;

    display: none;

    backdrop-filter:
        blur(8px);
}

#placeButton:active {

    transform: scale(.98);
}

#placeButton:disabled {

    opacity: .45;
}


/* =====================================================
   ERROR
====================================================== */

#errorScreen {

    position: fixed;

    inset: 0;

    z-index: 500;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 25px;

    background: #000;

    text-align: center;
}

#errorText {

    max-width: 380px;

    color: #fff;

    font-size: 14px;

    line-height: 1.5;
}

</style>

<body>


<div id="app">


<!-- =====================================================
     START
====================================================== -->

<div id="startScreen">

    <div class="startBox">

        <h1 class="startTitle">
            AR
        </h1>

        <p class="startSubtitle">
            Дополненная реальность
        </p>

        <button
            id="startButton"
            type="button"
        >
            ЗАПУСК
        </button>

        <div id="startMessage">
            Готово
        </div>

    </div>

</div>


<!-- =====================================================
     WEBXR CANVAS
====================================================== -->

<canvas
    id="xrCanvas"
></canvas>


<!-- =====================================================
     CAMERA FALLBACK
====================================================== -->

<video
    id="camera"
    autoplay
    muted
    playsinline
></video>


<!-- =====================================================
     AR INTERFACE
====================================================== -->

<div id="arUI">


    <div id="topBar">

        <div id="status">
            AR
        </div>

        <button
            id="closeButton"
            type="button"
        >
            ×
        </button>

    </div>


    <div id="reticle"></div>


    <div id="bottomBar">

        <button
            id="placeButton"
            type="button"
        >
            ДОБАВИТЬ 3D МОДЕЛЬ
        </button>

    </div>


</div>


<!-- =====================================================
     ERROR
====================================================== -->

<div id="errorScreen">

    <div id="errorText"></div>

</div>

<!-- =====================================================
     APPLICATION
====================================================== -->

<script type="module">

import * as THREE from "three";

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";


/* =====================================================
   TELEGRAM
====================================================== */

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;


/* =====================================================
   DOM
====================================================== */

const startScreen =
    document.getElementById(
        "startScreen"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const startMessage =
    document.getElementById(
        "startMessage"
    );

const xrCanvas =
    document.getElementById(
        "xrCanvas"
    );

const camera =
    document.getElementById(
        "camera"
    );

const arUI =
    document.getElementById(
        "arUI"
    );

const status =
    document.getElementById(
        "status"
    );

const reticle =
    document.getElementById(
        "reticle"
    );

const placeButton =
    document.getElementById(
        "placeButton"
    );

const closeButton =
    document.getElementById(
        "closeButton"
    );

const errorScreen =
    document.getElementById(
        "errorScreen"
    );

const errorText =
    document.getElementById(
        "errorText"
    );


/* =====================================================
   THREE
====================================================== */

let renderer = null;

let scene = null;

let xrCamera = null;


/* =====================================================
   XR
====================================================== */

let xrSession = null;

let referenceSpace = null;

let viewerSpace = null;

let hitTestSource = null;

let currentHit = null;

let anchor = null;


/* =====================================================
   MODEL
====================================================== */

let creature = null;

let creatureReady = false;

let creaturePlaced = false;


/* =====================================================
   FALLBACK CAMERA
====================================================== */

let cameraStream = null;


/* =====================================================
   INIT TELEGRAM
====================================================== */

function initTelegram() {

    if (!tg) {
        return;
    }


    tg.ready();

    tg.expand();


    try {

        tg.setHeaderColor(
            "#000000"
        );

        tg.setBackgroundColor(
            "#000000"
        );

        /*
         * AR uses swipe/gesture input,
         * so Telegram's vertical swipe
         * close gesture is disabled.
         */

        tg.disableVerticalSwipes();

    } catch (_) {}

}

initTelegram();


/* =====================================================
   START BUTTON
====================================================== */

startButton.addEventListener(
    "click",
    start
);


/* =====================================================
   START
====================================================== */

async function start() {

    startButton.disabled =
        true;

    startMessage.textContent =
        "Запуск AR...";


    try {

        /*
         * Initialize Three.
         */

        initializeThree();


        /*
         * Load model immediately.
         */

        loadCreature();


        /*
         * Request immersive AR.
         */

        await startXR();


        /*
         * Start Telegram motion
         * as additional sensor data.
         */

        startTelegramMotion();


        /*
         * Interface.
         */

        startScreen.style.display =
            "none";

        arUI.style.display =
            "block";

        xrCanvas.style.display =
            "block";


    } catch (error) {

        console.error(
            "AR start failed:",
            error
        );


        /*
         * If WebXR isn't available,
         * use normal camera only.
         *
         * This does NOT pretend
         * to be real AR tracking.
         */

        try {

            await startCamera();


            startTelegramMotion();


            startScreen.style.display =
                "none";

            arUI.style.display =
                "block";

            status.textContent =
                "КАМЕРА";


            startMessage.textContent =
                "Готово";


        } catch (cameraError) {

            console.error(
                cameraError
            );


            startButton.disabled =
                false;

            startMessage.textContent =
                "Готово";


            showError(
                cameraError.message ||
                "Не удалось открыть камеру."
            );

        }

    }

}


/* =====================================================
   THREE INITIALIZATION
====================================================== */

function initializeThree() {

    if (renderer) {
        return;
    }


    scene =
        new THREE.Scene();


    xrCamera =
        new THREE.PerspectiveCamera(

            70,

            window.innerWidth /
            window.innerHeight,

            0.01,

            100

        );


    renderer =
        new THREE.WebGLRenderer({

            canvas:
                xrCanvas,

            alpha:
                true,

            antialias:
                true,

            powerPreference:
                "high-performance"

        });


    renderer.setPixelRatio(

        Math.min(
            window.devicePixelRatio,
            2
        )

    );


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    renderer.xr.enabled =
        true;


    /*
     * Basic light.
     */

    const hemisphere =
        new THREE.HemisphereLight(

            0xffffff,

            0x444444,

            2

        );


    scene.add(
        hemisphere
    );


    const directional =
        new THREE.DirectionalLight(

            0xffffff,

            1.5

        );


    directional.position.set(

        2,
        4,
        2

    );


    scene.add(
        directional
    );

}


/* =====================================================
   LOAD GLB
====================================================== */

function loadCreature() {

    const loader =
        new GLTFLoader();


    /*
     * EXACT MODEL PATH
     */

    loader.load(

        "./models/creature.glb",


        function(gltf) {

            creature =
                gltf.scene;


            /*
             * Initial size.
             *
             * Change only this value
             * if the model is too large.
             */

            creature.scale.set(

                0.5,
                0.5,
                0.5

            );


            creature.visible =
                false;


            scene.add(
                creature
            );


            creatureReady =
                true;


            console.log(
                "creature.glb loaded"
            );


            /*
             * If placement was pressed
             * after the file loaded,
             * show it.
             */

            if (
                creaturePlaced
            ) {

                creature.visible =
                    true;

            }

        },


        function(progress) {

            if (
                progress.total
            ) {

                const percent =
                    Math.round(

                        (
                            progress.loaded /
                            progress.total
                        ) * 100

                    );


                status.textContent =
                    "МОДЕЛЬ " +
                    percent +
                    "%";

            }

        },


        function(error) {

            console.error(
                "GLB loading error:",
                error
            );


            status.textContent =
                "ОШИБКА МОДЕЛИ";

        }

    );

}


/* =====================================================
   START WEBXR
====================================================== */

async function startXR() {

    /*
     * No device check.
     *
     * We directly request AR.
     */

    if (
        !navigator.xr
    ) {

        throw new Error(
            "WebXR недоступен"
        );

    }


    /*
     * immersive-ar
     *
     * local-floor
     * hit-test
     *
     * anchors optional.
     */

    xrSession =
        await navigator.xr
            .requestSession(

                "immersive-ar",

                {

                    requiredFeatures: [

                        "local-floor",

                        "hit-test"

                    ],

                    optionalFeatures: [

                        "anchors"

                    ]

                }

            );


    /*
     * Give session to Three.
     */

    await renderer.xr
        .setSession(
            xrSession
        );


    /*
     * Local room coordinate system.
     */

    referenceSpace =
        await xrSession
            .requestReferenceSpace(

                "local-floor"

            );


    /*
     * Viewer space.
     */

    viewerSpace =
        await xrSession
            .requestReferenceSpace(

                "viewer"

            );


    /*
     * Hit-test source.
     */

    hitTestSource =
        await xrSession
            .requestHitTestSource({

                space:
                    viewerSpace

            });


    /*
     * UI.
     */

    placeButton.style.display =
        "block";

    status.textContent =
        "НАВЕДИТЕ КАМЕРУ НА ПОЛ";


    /*
     * XR frame loop.
     */

    renderer.setAnimationLoop(
        renderXR
    );


    /*
     * Session ended.
     */

    xrSession.addEventListener(

        "end",

        function() {

            cleanupXR();

        }

    );

}


/* =====================================================
   XR FRAME
====================================================== */

function renderXR(
    time,
    frame
) {

    if (
        !frame ||
        !referenceSpace
    ) {

        return;

    }


    /*
     * -----------------------------------------------
     * HIT TEST
     * -----------------------------------------------
     */

    if (
        hitTestSource &&
        !creaturePlaced
    ) {

        const results =
            frame.getHitTestResults(

                hitTestSource

            );


        if (
            results.length > 0
        ) {

            currentHit =
                results[0];


            reticle.classList.add(
                "ready"
            );


            status.textContent =
                "ПОВЕРХНОСТЬ НАЙДЕНА";


        } else {

            currentHit =
                null;


            reticle.classList.remove(
                "ready"
            );


            status.textContent =
                "ИЩЕМ ПОЛ";

        }

    }


    /*
     * -----------------------------------------------
     * ANCHOR UPDATE
     * -----------------------------------------------
     */

    if (
        anchor &&
        creature
    ) {

        const pose =
            frame.getPose(

                anchor.anchorSpace,

                referenceSpace

            );


        if (pose) {

            creature.matrix
                .fromArray(

                    pose.transform.matrix

                );


            creature.matrix
                .decompose(

                    creature.position,

                    creature.quaternion,

                    creature.scale

                );

        }

    }


    /*
     * -----------------------------------------------
     * RENDER
     * -----------------------------------------------
     */

    renderer.render(

        scene,

        xrCamera

    );

}


/* =====================================================
   PLACE BUTTON
====================================================== */

placeButton.addEventListener(

    "click",

    placeCreature

);


/* =====================================================
   PLACE CREATURE
====================================================== */

async function placeCreature() {

    /*
     * Model must be loaded.
     */

    if (
        !creatureReady ||
        !creature
    ) {

        status.textContent =
            "МОДЕЛЬ ЕЩЁ ЗАГРУЖАЕТСЯ";

        return;

    }


    /*
     * Surface must be found.
     */

    if (
        !currentHit
    ) {

        status.textContent =
            "НАВЕДИТЕ НА ПОЛ";

        return;

    }


    /*
     * Get pose in local-floor space.
     */

    const pose =
        currentHit.getPose(

            referenceSpace

        );


    if (!pose) {

        status.textContent =
            "ТОЧКА НЕ НАЙДЕНА";

        return;

    }


    /*
     * -----------------------------------------------
     * INITIAL POSITION
     * -----------------------------------------------
     */

    creature.matrix
        .fromArray(

            pose.transform.matrix

        );


    creature.matrix
        .decompose(

            creature.position,

            creature.quaternion,

            creature.scale

        );


    /*
     * -----------------------------------------------
     * CREATE ANCHOR
     * -----------------------------------------------
     */

    if (
        typeof currentHit.createAnchor ===
        "function"
    ) {

        try {

            anchor =
                await currentHit
                    .createAnchor();


            console.log(
                "Anchor created"
            );


        } catch (error) {

            /*
             * Anchor isn't required
             * to display the initial
             * object.
             */

            console.warn(
                "Anchor unavailable:",
                error
            );

            anchor =
                null;

        }

    }


    /*
     * -----------------------------------------------
     * SHOW MODEL
     * -----------------------------------------------
     */

    creature.visible =
        true;


    creaturePlaced =
        true;


    /*
     * Stop hit-test after placement.
     */

    if (
        hitTestSource
    ) {

        try {

            hitTestSource.cancel();

        } catch (_) {}

        hitTestSource =
            null;

    }


    currentHit =
        null;


    reticle.style.display =
        "none";


    placeButton.style.display =
        "none";


    status.textContent =

        anchor
            ? "ОБЪЕКТ ЗАКРЕПЛЁН"
            : "ОБЪЕКТ РАЗМЕЩЁН";

}


/* =====================================================
   TELEGRAM MOTION
====================================================== */

function startTelegramMotion() {

    if (!tg) {
        return;
    }


    /*
     * Device Orientation
     */

    if (
        tg.DeviceOrientation
    ) {

        try {

            tg.DeviceOrientation.start(

                {

                    refresh_rate:
                        50,

                    need_absolute:
                        false

                },

                function(ok) {

                    console.log(
                        "DeviceOrientation:",
                        ok
                    );

                }

            );

        } catch (error) {

            console.warn(
                "DeviceOrientation:",
                error
            );

        }

    }


    /*
     * Gyroscope
     */

    if (
        tg.Gyroscope
    ) {

        try {

            tg.Gyroscope.start(

                {

                    refresh_rate:
                        50

                },

                function(ok) {

                    console.log(
                        "Gyroscope:",
                        ok
                    );

                }

            );

        } catch (error) {

            console.warn(
                "Gyroscope:",
                error
            );

        }

    }


    /*
     * Accelerometer
     */

    if (
        tg.Accelerometer
    ) {

        try {

            tg.Accelerometer.start(

                {

                    refresh_rate:
                        50

                },

                function(ok) {

                    console.log(
                        "Accelerometer:",
                        ok
                    );

                }

            );

        } catch (error) {

            console.warn(
                "Accelerometer:",
                error
            );

        }

    }

}


/* =====================================================
   NORMAL CAMERA
====================================================== */

async function startCamera() {

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        throw new Error(
            "Camera API недоступен"
        );

    }


    cameraStream =
        await navigator
            .mediaDevices
            .getUserMedia({

                video: {

                    facingMode:
                        {
                            ideal:
                                "environment"
                        },

                    width:
                        {
                            ideal:
                                1920
                        },

                    height:
                        {
                            ideal:
                                1080
                        }

                },

                audio:
                    false

            });


    camera.srcObject =
        cameraStream;


    await camera.play();


    camera.style.display =
        "block";


    /*
     * This is only a camera
     * fallback.
     *
     * No fake AR positioning.
     */

    placeButton.style.display =
        "none";

    reticle.style.display =
        "none";

    status.textContent =
        "КАМЕРА";

}


/* =====================================================
   CLOSE
====================================================== */

closeButton.addEventListener(

    "click",

    stopApplication

);


/* =====================================================
   STOP
====================================================== */

async function stopApplication() {

    /*
     * Delete anchor.
     */

    if (
        anchor
    ) {

        try {

            anchor.delete();

        } catch (_) {}

        anchor =
            null;

    }


    /*
     * End XR.
     */

    if (
        xrSession
    ) {

        try {

            await xrSession.end();

        } catch (_) {}

    }


    /*
     * Stop normal camera.
     */

    if (
        cameraStream
    ) {

        cameraStream
            .getTracks()
            .forEach(

                function(track) {

                    track.stop();

                }

            );

        cameraStream =
            null;

    }


    camera.srcObject =
        null;


    /*
     * Stop Telegram motion.
     */

    if (tg) {

        try {

            tg.DeviceOrientation?.stop();

        } catch (_) {}


        try {

            tg.Gyroscope?.stop();

        } catch (_) {}


        try {

            tg.Accelerometer?.stop();

        } catch (_) {}

    }


    cleanupXR();


    /*
     * Reset UI.
     */

    arUI.style.display =
        "none";

    xrCanvas.style.display =
        "none";

    camera.style.display =
        "none";

    startScreen.style.display =
        "flex";


    startButton.disabled =
        false;


    startMessage.textContent =
        "Готово";


    creaturePlaced =
        false;


    currentHit =
        null;


    if (
        creature
    ) {

        creature.visible =
            false;

    }


    reticle.style.display =
        "block";

    reticle.classList.remove(
        "ready"
    );

}


/* =====================================================
   XR CLEANUP
====================================================== */

function cleanupXR() {

    if (
        hitTestSource
    ) {

        try {

            hitTestSource.cancel();

        } catch (_) {}

    }


    hitTestSource =
        null;

    currentHit =
        null;

    viewerSpace =
        null;

    referenceSpace =
        null;

    xrSession =
        null;


    if (
        renderer
    ) {

        renderer.setAnimationLoop(
            null
        );

    }

}


/* =====================================================
   ERROR
====================================================== */

function showError(
    message
) {

    errorText.textContent =
        message;

    errorScreen.style.display =
        "flex";

}


/* =====================================================
   RESIZE
====================================================== */

window.addEventListener(

    "resize",

    function() {

        if (
            renderer
        ) {

            renderer.setSize(

                window.innerWidth,

                window.innerHeight

            );

        }


        if (
            xrCamera
        ) {

            xrCamera.aspect =

                window.innerWidth /
                window.innerHeight;


            xrCamera.updateProjectionMatrix();

        }

    }

);

</script>

</body>
