/* =========================================================
   TON ADDRESS
========================================================= */

function base64UrlToBytes(
    value
) {

    let normalized =
        String(value)
            .replace(
                /-/g,
                "+"
            )
            .replace(
                /_/g,
                "/"
            );


    while (
        normalized.length % 4 !== 0
    ) {

        normalized += "=";

    }


    const binary =
        atob(
            normalized
        );


    const bytes =
        new Uint8Array(
            binary.length
        );


    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(
                i
            );

    }


    return bytes;

}


function normalizeTonAddress(
    address
) {

    if (!address) {

        return "";

    }


    address =
        String(
            address
        ).trim();


    if (
        /^-?\d+:[0-9a-fA-F]{64}$/
            .test(
                address
            )
    ) {

        const parts =
            address.split(
                ":"
            );


        return (

            parts[0] +
            ":" +
            parts[1].toLowerCase()

        );

    }


    try {

        const bytes =
            base64UrlToBytes(
                address
            );


        if (
            bytes.length !== 36
        ) {

            return address.toLowerCase();

        }


        let workchain =
            bytes[1];


        if (
            workchain === 255
        ) {

            workchain =
                -1;

        }


        let hash =
            "";


        for (
            let i = 2;
            i < 34;
            i++
        ) {

            hash +=

                bytes[i]
                    .toString(16)
                    .padStart(
                        2,
                        "0"
                    );

        }


        return (

            workchain +
            ":" +
            hash.toLowerCase()

        );

    }
    catch {

        return address.toLowerCase();

    }

}

                method:
                    "GET",

                headers: {

                    "Accept":
                        "application/json"

                }

            }
        );


    if (
        !response.ok
    ) {

        throw new Error(
            "TonAPI HTTP " +
            response.status
        );

    }


    const data =
        await response.json();


    const nftItems =

        Array.isArray(
            data.nft_items
        )

            ? data.nft_items

            : [];


    for (
        const nft of nftItems
    ) {

        const collectionAddress =

            nft.collection?.address ||

            nft.collection_address ||

            "";


        if (
            !collectionAddress
        ) {

            continue;

        }


        const normalized =
            normalizeTonAddress(
                collectionAddress
            );


        if (

            normalized ===
            normalizedRequiredCollection

            ||

            normalized ===
            REQUIRED_COLLECTION_RAW

        ) {

            return true;

        }

    }


    return false;

}


/* =========================================================
   WALLET
========================================================= */

let currentWallet =
    null;


let accessGranted =
    false;


let checkingNFT =
    false;


async function processWallet(
    wallet
) {

    if (!wallet) {

        currentWallet =
            null;

        accessGranted =
            false;

        userWalletAddress.textContent =
            "";

        userStatus.textContent =
            "";

        authStatus.textContent =
            "Подключите TON-кошелёк";

        showScreen(
            authScreen
        );

        return;

    }


    if (
        checkingNFT
    ) {

        return;

    }


    if (

        !wallet.account ||

        !wallet.account.address

    ) {

        return;

    }


    currentWallet =
        wallet.account.address;


    accessGranted =
        false;


    checkingNFT =
        true;


    authStatus.textContent =
        "Проверка NFT...";


    loading.classList.add(
        "active"
    );


    try {

        const hasNFT =
            await checkCollectionNFT(
                currentWallet
            );


        if (
            !hasNFT
        ) {

            accessGranted =
                false;


            authStatus.textContent =
                "NFT нужной коллекции не найден";


            showScreen(
                authScreen
            );


            return;

        }


        accessGranted =
            true;


        userWalletAddress.textContent =
            currentWallet;


        authStatus.textContent =
            "Доступ разрешён";


        showScreen(
            homeScreen
        );

    }
    catch (error) {

        console.error(
            "NFT CHECK ERROR:",
            error
        );


        accessGranted =
            false;


        authStatus.textContent =
            "Ошибка проверки NFT";


        showScreen(
            authScreen
        );

    }
    finally {

        checkingNFT =
            false;


        loading.classList.remove(
            "active"
        );

    }

}

let archiveModels =

async function loadArchiveModels() {

    archiveStatus.textContent =
        "Загрузка 3D моделей...";


    archiveGrid.innerHTML =
        "";


    try {

        const response =
            await fetch(
                ARCHIVE_API,
                {

                    method:
                        "GET",

                    cache:
                        "no-store"

                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        archiveModels =

            Array.isArray(
                data.items
            )

                ? data.items

                : [];


        if (
            !archiveModels.length
        ) {

            archiveStatus.textContent =
                "В архиве пока нет 3D моделей.";

            return;

        }


        archiveStatus.textContent =

            "Моделей: " +
            archiveModels.length;


        archiveModels.forEach(
            (item, index) => {

                const button =
                    document.createElement(
                        "button"
                    );


                button.type =
                    "button";


                button.className =
                    "archiveItem";


                const preview =
                    document.createElement(
                        "div"
                    );


                preview.className =
                    "archivePlaceholder";


                preview.textContent =
                    "3D";


                button.appendChild(
                    preview
                );


                const info =
                    document.createElement(
                        "div"
                    );


                info.className =
                    "archiveInfo";


                const name =
                    document.createElement(
                        "div"
                    );


                name.className =
                    "archiveName";


                name.textContent =

                    item.filename ||
                    "model";


                const folder =
                    document.createElement(
                        "div"
                    );


                folder.className =
                    "archiveFolder";


                folder.textContent =

                    (
                        item.folder ||
                        ""
                    ).toUpperCase();


                info.appendChild(
                    name
                );


                info.appendChild(
                    folder
                );


                button.appendChild(
                    info
                );


                /*
                    При нажатии открывается
                    ИМЕННО выбранная модель.
                */

                button.addEventListener(
                    "click",
                    () => {

                        openArchiveViewer(
                            index
                        );

                    }
                );


                archiveGrid.appendChild(
                    button
                );

            }
        );

    }
    catch (error) {

        console.error(
            "ARCHIVE ERROR:",
            error
        );


        archiveStatus.textContent =
            "Не удалось получить архив.";

    }

}


/* =========================================================
   ARCHIVE MODEL URL
========================================================= */

function getArchiveModelURL(
    item
) {

    /*
        В первую очередь используем
        URL, который прислал ваш сервер.
    */

    if (
        item &&
        item.url
    ) {

        return item.url;

    }


    /*
        Дополнительные варианты,
        если ваш API использует
        другое имя поля.
    */

    if (
        item &&
        item.model_url
    ) {

        return item.model_url;

    }


    if (
        item &&
        item.path
    ) {

        return item.path;

    }


    /*
        Если сервер прислал только
        filename, используем
        существующий адрес API.
    */

    if (
        item &&
        item.filename
    ) {

        try {

            const api =
                new URL(
                    ARCHIVE_API
                );


            return (

                api.origin +

                "/models/" +

                encodeURIComponent(
                    item.filename
                )

            );

        }
        catch {

            return "";

        }

    }


    return "";

}


/* =========================================================
   OPEN ARCHIVE VIEWER
========================================================= */

function openArchiveViewer(
    index
) {

    viewerOpenedFromArchive =
        true;


    if (
        !requireAccess()
    ) {

        return;

    }


    const item =
        archiveModels[index];


    if (
        !item
    ) {

        console.error(
            "Архивная модель не найдена"
        );

        return;

    }


    viewerNumber.textContent =

        item.filename ||
        "3D";


    showScreen(
        viewerScreen
    );


    /*
        Создаём Three.js
        только один раз.
    */

    initViewer();


    /*
        Удаляем предыдущую
        модель.
    */

    clearModel();


    /*
        Получаем URL модели
        именно с вашего API.
    */

    const url =
        getArchiveModelURL(
            item
        );


    if (
        !url
    ) {

        console.error(
            "URL 3D модели отсутствует:",
            item
        );

        return;

    }


    console.log(
        "ARCHIVE MODEL:",
        url
    );


    load3DModel(
        url
    );

}

/* =========================================================
   SCENE SIZE
========================================================= */

/*
    Точная виртуальная сцена:

    X = 4 м
    Z = 7 м
    Y = 4 м

    Центр:

    0, 0, 0
*/

const SCENE_WIDTH =
    4;


const SCENE_LENGTH =
    7;


const SCENE_HEIGHT =
    4;


/*
    Половины размеров.
*/

const HALF_WIDTH =
    SCENE_WIDTH / 2;


const HALF_LENGTH =
    SCENE_LENGTH / 2;


/*
    Безопасный отступ камеры
    от стен.
*/

const CAMERA_MARGIN =
    0.25;


/*
    Границы камеры.
*/

const CAMERA_MIN_X =
    -HALF_WIDTH +
    CAMERA_MARGIN;


const CAMERA_MAX_X =
    HALF_WIDTH -
    CAMERA_MARGIN;


const CAMERA_MIN_Z =
    -HALF_LENGTH +
    CAMERA_MARGIN;


const CAMERA_MAX_Z =
    HALF_LENGTH -
    CAMERA_MARGIN;


const CAMERA_MIN_Y =
    0.35;


const CAMERA_MAX_Y =
    SCENE_HEIGHT -
    0.35;


/* =========================================================
   CAMERA LIMIT
========================================================= */

function clampCamera() {

    if (
        !camera
    ) {

        return;

    }


    camera.position.x =

        THREE.MathUtils.clamp(

            camera.position.x,

            CAMERA_MIN_X,

            CAMERA_MAX_X

        );


    camera.position.z =

        THREE.MathUtils.clamp(

            camera.position.z,

            CAMERA_MIN_Z,

            CAMERA_MAX_Z

        );


    camera.position.y =

        THREE.MathUtils.clamp(

            camera.position.y,

            CAMERA_MIN_Y,

            CAMERA_MAX_Y

        );

}


/* =========================================================
   CREATE SCENE
========================================================= */

function createSceneRoom() {

    const room =
        new THREE.Group();


    room.position.set(
        0,
        0,
        0
    );


    /* =====================================================
       FLOOR
    ===================================================== */

    const floorGeometry =
        new THREE.PlaneGeometry(

            SCENE_WIDTH,

            SCENE_LENGTH

        );


    const floorMaterial =
        new THREE.MeshBasicMaterial({

            color:
                0x101010,

            side:
                THREE.DoubleSide

        });


    const floor =
        new THREE.Mesh(

            floorGeometry,

            floorMaterial

        );


    floor.rotation.x =
        -Math.PI / 2;


    floor.position.set(
        0,
        0,
        0
    );


    room.add(
        floor
    );


    /* =====================================================
       CEILING
    ===================================================== */

    const ceiling =
        new THREE.Mesh(

            floorGeometry.clone(),

            floorMaterial.clone()

        );


    ceiling.rotation.x =
        -Math.PI / 2;


    ceiling.position.set(

        0,

        SCENE_HEIGHT,

        0

    );


    room.add(
        ceiling
    );


    /* =====================================================
       WALLS
    ===================================================== */

    const wallMaterial =
        new THREE.MeshBasicMaterial({

            color:
                0x151515,

            side:
                THREE.DoubleSide

        });


    /* LEFT */

    const sideGeometry =
        new THREE.PlaneGeometry(

            SCENE_LENGTH,

            SCENE_HEIGHT

        );


    const leftWall =
        new THREE.Mesh(

            sideGeometry,

            wallMaterial.clone()

        );


    leftWall.rotation.y =
        Math.PI / 2;


    leftWall.position.set(

        -HALF_WIDTH,

        SCENE_HEIGHT / 2,

        0

    );


    room.add(
        leftWall
    );


    /* RIGHT */

    const rightWall =
        new THREE.Mesh(

            sideGeometry.clone(),

            wallMaterial.clone()

        );


    rightWall.rotation.y =
        Math.PI / 2;


    rightWall.position.set(

        HALF_WIDTH,

        SCENE_HEIGHT / 2,

        0

    );


    room.add(
        rightWall
    );


    /* FRONT */

    const frontGeometry =
        new THREE.PlaneGeometry(

            SCENE_WIDTH,

            SCENE_HEIGHT

        );


    const frontWall =
        new THREE.Mesh(

            frontGeometry,

            wallMaterial.clone()

        );


    frontWall.position.set(

        0,

        SCENE_HEIGHT / 2,

        -HALF_LENGTH

    );


    room.add(
        frontWall
    );


    /* BACK */

    const backWall =
        new THREE.Mesh(

            frontGeometry.clone(),

            wallMaterial.clone()

        );


    backWall.position.set(

        0,

        SCENE_HEIGHT / 2,

        HALF_LENGTH

    );


    room.add(
        backWall
    );


    scene.add(
        room
    );

}


/* =========================================================
   INIT VIEWER
========================================================= */

function initViewer() {

    /*
        Не создаём второй renderer.
    */

    if (
        renderer
    ) {

        return;

    }


    /* =====================================================
       SCENE
    ===================================================== */

    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0x000000
        );


    /* =====================================================
       CAMERA
    ===================================================== */

    camera =
        new THREE.PerspectiveCamera(

            70,

            window.innerWidth /
            window.innerHeight,

            0.01,

            100

        );


    /*
        Камера стартует
        внутри комнаты.
    */

    camera.position.set(

        0,

        1.7,

        2.5

    );


    camera.rotation.order =
        "YXZ";


    /*
        Смотрим к центру.
    */

    camera.lookAt(

        0,

        1.5,

        0

    );


    /* =====================================================
       RENDERER
    ===================================================== */

    renderer =
        new THREE.WebGLRenderer({

            antialias:
                true,

            alpha:
                false,

            powerPreference:
                "high-performance"

        });


    renderer.setPixelRatio(

        Math.min(

            window.devicePixelRatio || 1,

            2

        )

    );


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    renderer.domElement.style.width =
        "100%";


    renderer.domElement.style.height =
        "100%";


    renderer.domElement.style.display =
        "block";


    viewerCanvas.innerHTML =
        "";


    viewerCanvas.appendChild(
        renderer.domElement
    );


    /* =====================================================
       LIGHT
    ===================================================== */

    const ambient =
        new THREE.AmbientLight(

            0xffffff,

            2

        );


    scene.add(
        ambient
    );


    const light =
        new THREE.DirectionalLight(

            0xffffff,

            3

        );


    light.position.set(

        4,

        5,

        4

    );


    scene.add(
        light
    );


    /* =====================================================
       ROOM
    ===================================================== */

    createSceneRoom();


    /* =====================================================
       TOUCH
    ===================================================== */

    renderer.domElement.addEventListener(

        "touchstart",

        touchStart,

        {
            passive:
                false
        }

    );


    renderer.domElement.addEventListener(

        "touchmove",

        touchMove,

        {
            passive:
                false
        }

    );


    renderer.domElement.addEventListener(

        "touchend",

        touchEnd,

        {
            passive:
                false
        }

    );


    renderer.domElement.addEventListener(

        "touchcancel",

        touchEnd,

        {
            passive:
                false
        }

    );


    /* =====================================================
       RESIZE
    ===================================================== */

    window.addEventListener(

        "resize",

        resizeViewer

    );


    /* =====================================================
       ANIMATION
    ===================================================== */

    if (
        !animationStarted
    ) {

        animationStarted =
            true;


        animateViewer();

    }

}


/* =========================================================
   TOUCH
========================================================= */

const touchState = {

    active:
        false,

    lastX:
        0,

    lastY:
        0,

    twoFinger:
        false,

    distance:
        0

};


/* =========================================================
   TOUCH START
========================================================= */

function touchStart(
    event
) {

    event.preventDefault();


    if (
        event.touches.length === 1
    ) {

        const touch =
            event.touches[0];


        touchState.active =
            true;


        touchState.twoFinger =
            false;


        touchState.lastX =
            touch.clientX;


        touchState.lastY =
            touch.clientY;


        return;

    }


    if (
        event.touches.length >= 2
    ) {

        const a =
            event.touches[0];


        const b =
            event.touches[1];


        touchState.active =
            false;


        touchState.twoFinger =
            true;


        touchState.distance =

            Math.hypot(

                a.clientX -
                b.clientX,

                a.clientY -
                b.clientY

            );

    }

}


/* =========================================================
   TOUCH MOVE
========================================================= */

function touchMove(
    event
) {

    event.preventDefault();


    if (
        !camera
    ) {

        return;

    }


    /*
        Два пальца.

        Расстояние между пальцами
        двигает камеру вперёд/назад.
    */

    if (
        event.touches.length >= 2
    ) {

        const a =
            event.touches[0];


        const b =
            event.touches[1];


        const distance =

            Math.hypot(

                a.clientX -
                b.clientX,

                a.clientY -
                b.clientY

            );


        if (
            touchState.distance > 0
        ) {

            const delta =

                distance -
                touchState.distance;


            moveCameraForward(

                delta *
                0.012

            );

        }


        touchState.distance =
            distance;


        clampCamera();


        return;

    }


    /*
        Один палец.

        Перемещение по X/Z.
    */

    if (

        event.touches.length === 1 &&

        touchState.active

    ) {

        const touch =
            event.touches[0];


        const dx =

            touch.clientX -
            touchState.lastX;


        const dy =

            touch.clientY -
            touchState.lastY;


        const speed =
            0.009;


        /*
            X
        */

        camera.position.x +=

            dx *
            speed;


        /*
            Z
        */

        camera.position.z +=

            dy *
            speed;


        /*
            Жёсткое ограничение.
        */

        clampCamera();


        touchState.lastX =
            touch.clientX;


        touchState.lastY =
            touch.clientY;

    }

}


/* =========================================================
   TOUCH END
========================================================= */

function touchEnd(
    event
) {

    event.preventDefault();


    if (
        event.touches.length === 0
    ) {

        touchState.active =
            false;


        touchState.twoFinger =
            false;


        touchState.distance =
            0;

    }

}


/* =========================================================
   CAMERA FORWARD
========================================================= */

function moveCameraForward(
    amount
) {

    if (
        !camera
    ) {

        return;

    }


    const direction =
        new THREE.Vector3();


    camera.getWorldDirection(
        direction
    );


    /*
        Не меняем высоту.
    */

    direction.y =
        0;


    if (
        direction.lengthSq() === 0
    ) {

        return;

    }


    direction.normalize();


    camera.position.add(

        direction.multiplyScalar(
            amount
        )

    );


    clampCamera();

}


/* =========================================================
   RESIZE
========================================================= */

function resizeViewer() {

    if (

        !camera ||

        !renderer

    ) {

        return;

    }


    camera.aspect =

        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );

}


/* =========================================================
   ANIMATION
========================================================= */

function animateViewer() {

    requestAnimationFrame(
        animateViewer
    );


    /*
        Каждый кадр проверяем
        границы камеры.
    */

    clampCamera();


    if (

        renderer &&

        scene &&

        camera

    ) {

        renderer.render(

            scene,

            camera

        );

    }

}


/* =========================================================
   CLEAR MODEL
========================================================= */

function clearModel() {

    if (

        !model ||

        !scene

    ) {

        return;

    }


    scene.remove(
        model
    );


    model.traverse(
        object => {

            if (
                object.geometry
            ) {

                object.geometry.dispose();

            }


            if (
                object.material
            ) {

                if (
                    Array.isArray(
                        object.material
                    )
                ) {

                    object.material.forEach(
                        material => {

                            if (
                                material.map
                            ) {

                                material.map.dispose();

                            }


                            material.dispose();

                        }
                    );

                }
                else {

                    if (
                        object.material.map
                    ) {

                        object.material.map.dispose();

                    }


                    object.material.dispose();

                }

            }

        }
    );


    model =
        null;

}


/* =========================================================
   LOAD 3D MODEL
========================================================= */

const loader =
    new GLTFLoader();


function load3DModel(
    url
) {

    if (
        !url
    ) {

        console.error(
            "Пустой URL модели"
        );

        return;

    }


    console.log(
        "Загрузка модели:",
        url
    );


    loader.load(

        url,


        /* =================================================
           SUCCESS
        ================================================= */

        gltf => {

            console.log(
                "Модель загружена:",
                url
            );


            model =
                gltf.scene;


            /*
                Получаем исходные размеры.
            */

            const box =
                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            const center =
                box.getCenter(
                    new THREE.Vector3()
                );


            const size =
                box.getSize(
                    new THREE.Vector3()
                );


            /*
                Ставим origin модели
                в мировой центр.
            */

            model.position.sub(
                center
            );


            /*
                Максимальный размер.
            */

            const maxSize =

                Math.max(

                    size.x,

                    size.y,

                    size.z

                );


            /*
                Модель максимум
                2.2 метра.
            */

            if (
                maxSize > 0
            ) {

                model.scale.setScalar(

                    2.2 /
                    maxSize

                );

            }


            /*
                После масштабирования
                определяем нижнюю точку.
            */

            const scaledBox =

                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            /*
                Ставим модель
                на пол.

                X/Z остаются
                по центру.
            */

            if (
                scaledBox.min.y < 0
            ) {

                model.position.y +=

                    -scaledBox.min.y;

            }


            /*
                Материалы и текстуры
                не удаляем.
            */

            model.traverse(
                object => {

                    if (
                        object.isMesh
                    ) {

                        object.castShadow =
                            true;


                        object.receiveShadow =
                            true;


                        if (
                            object.material
                        ) {

                            object.material
                                .needsUpdate =
                                true;

                        }

                    }

                }
            );


            /*
                Добавляем модель
                в сцену.
            */

            scene.add(
                model
            );


            /*
                Камера гарантированно
                остаётся внутри.
            */

            clampCamera();


        },


        /* =================================================
           PROGRESS
        ================================================= */

        undefined,


        /* =================================================
           ERROR
        ================================================= */

        error => {

            console.error(
                "3D MODEL ERROR:",
                error
            );


            console.error(
                "URL:",
                url
            );

        }

    );

}


/* =========================================================
   OPEN GALLERY MODEL
========================================================= */

function openViewer(
    index
) {

    viewerOpenedFromArchive =
        false;


    if (
        !requireAccess()
    ) {

        return;

    }


    const item =
        galleryItems[index];


    if (
        !item
    ) {

        return;

    }


    viewerNumber.textContent =
        item.number;


    showScreen(
        viewerScreen
    );


    initViewer();


    clearModel();


    const url =

        MODEL_BASE +

        encodeURIComponent(
            item.filename
        );


    load3DModel(
        url
    );

}
