<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <!--
        Настройки отображения страницы на мобильных устройствах.
        Запрещается масштабирование интерфейса пользователем.
    -->
    <meta
        name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    >

    <title>AR Gallery</title>

    <!--
        TON Connect UI.
        Используется для подключения TON-кошелька пользователя.
    -->
    <script src="https://unpkg.com/@tonconnect/ui@3.0.0/dist/tonconnect-ui.min.js"></script>

    <style>

        /* ============================================================
           GLOBAL STYLES
           Базовые настройки всего интерфейса.
           ============================================================ */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
            border: 0;
        }

        /*
            .screen — отдельный экран приложения.
            По умолчанию скрыт.
        */
        .screen {
            position: fixed;
            inset: 0;
            display: none;
            background: #000;
        }

        /*
            Активный экран становится видимым.
        */
        .screen.active {
            display: flex;
        }

        /*
            Центрирование содержимого экрана.
        */
        .center {
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /*
            Основная ширина панели интерфейса.
        */
        .panel {
            width: 320px;
            max-width: 100%;
        }

        /*
            Заголовок экрана.
        */
        .title {
            text-align: center;
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 30px;
        }

        /*
            Основная кнопка интерфейса.
        */
        .button {
            width: 100%;
            height: 52px;
            margin-bottom: 8px;
            background: #080808;
            color: #fff;
            border: 1px solid #242424;
            text-align: left;
            padding: 0 16px;
            font-size: 13px;
        }

        .button:hover {
            background: #111;
        }

        /*
            Основная белая кнопка.
        */
        .primary {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        /*
            Текст статуса.
        */
        .status {
            text-align: center;
            color: #666;
            font-size: 12px;
            line-height: 1.45;
            min-height: 20px;
            margin-top: 14px;
            white-space: pre-line;
        }

        /*
            Экран со списком комнат.
        */
        .page {
            flex-direction: column;
            padding: 14px 18px 18px;
        }

        /*
            Верхняя панель страницы.
        */
        .header {
            position: relative;
            width: 100%;
            height: 48px;
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        /*
            Кнопка возврата назад.
        */
        .back {
            width: 40px;
            height: 40px;
            background: #080808;
            color: #fff;
            border: 1px solid #242424;
            font-size: 22px;
        }

        /*
            Заголовок страницы по центру.
        */
        .pageTitle {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
        }

        /*
            Сетка комнат.
        */
        .grid {
            width: 100%;
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
            overflow: auto;
            padding-bottom: 10px;
        }

        /*
            Отдельная кнопка комнаты.
        */
        .roomItem {
            min-height: 110px;
            background: #080808;
            color: #fff;
            border: 1px solid #202020;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 8px;
            font-size: 22px;
        }

        .roomItem small {
            color: #666;
            font-size: 9px;
            letter-spacing: 1px;
        }

        /*
            Экран просмотра 3D-комнаты.
        */
        #roomViewerScreen {
            overflow: hidden;
            touch-action: none;
        }

        /*
            Контейнер WebGL-сцены.
        */
        #roomCanvas {
            position: absolute;
            inset: 0;
        }

        /*
            Canvas Three.js занимает весь экран.
        */
        #roomCanvas canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /*
            Заголовок 3D-комнаты.
        */
        .roomHeader {
            position: absolute;
            z-index: 20;
            top: 14px;
            left: 14px;
            right: 14px;
            height: 40px;
            display: flex;
            align-items: center;
        }

        .roomTitle {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
        }

        /*
            Информационное сообщение поверх 3D-сцены.
        */
        .roomStatus {
            position: absolute;
            z-index: 25;
            left: 50%;
            top: 76px;
            transform: translateX(-50%);
            width: min(88vw, 560px);
            padding: 12px 14px;
            background: rgba(0, 0, 0, .78);
            border: 1px solid rgba(255, 255, 255, .14);
            color: #bbb;
            text-align: center;
            font-size: 11px;
            line-height: 1.45;
            white-space: pre-line;
            pointer-events: none;
        }

        /*
            Нижняя панель управления комнатой.
        */
        .roomControls {
            position: absolute;
            z-index: 30;
            left: 0;
            right: 0;
            bottom: 16px;
            height: 128px;
            padding: 0 12px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            pointer-events: none;
        }

        /*
            Джойстик перемещения.
        */
        .movePad {
            width: 112px;
            height: 112px;
            border: 1px solid rgba(255, 255, 255, .2);
            border-radius: 50%;
            background: rgba(8, 8, 8, .45);
            position: relative;
            pointer-events: auto;
            touch-action: none;
        }

        /*
            Внутренний круг джойстика.
        */
        .movePad:before {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 68px;
            height: 68px;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 50%;
        }

        /*
            Подвижная ручка джойстика.
        */
        .moveKnob {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 46px;
            height: 46px;
            margin: -23px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, .55);
            background: rgba(255, 255, 255, .14);
            transform: translate3d(0, 0, 0);
        }

        /*
            Панель управления направлением взгляда.
        */
        .lookPad {
            width: min(42vw, 300px);
            height: 112px;
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 12px;
            background: rgba(8, 8, 8, .22);
            position: relative;
            pointer-events: auto;
            touch-action: none;
        }

        .lookLabel {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, .28);
            font-size: 9px;
            letter-spacing: 1px;
            pointer-events: none;
        }

        /*
            Вертикальное управление высотой камеры.
        */
        .vertical {
            position: absolute;
            left: 50%;
            bottom: 28px;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: auto;
        }

        .vbtn,
        .roll,
        .reset {
            width: 42px;
            height: 42px;
            background: rgba(8, 8, 8, .72);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, .24);
            font-size: 17px;
            touch-action: none;
        }

        /*
            Кнопки вращения камеры вокруг оси.
        */
        .rolls {
            position: absolute;
            left: 50%;
            top: 58px;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            pointer-events: auto;
        }

        .roll {
            width: 38px;
            height: 34px;
            font-size: 14px;
        }

        /*
            Сброс положения камеры.
        */
        .reset {
            position: absolute;
            right: 12px;
            top: -50px;
            width: 40px;
            height: 40px;
        }

        /*
            Подпись вертикальной оси.
        */
        .axis {
            position: absolute;
            left: 50%;
            top: 30px;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, .34);
            font-size: 8px;
        }

        /*
            Экран генерации.
        */
        #generationScreen {
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /*
            Поле пятизначного кода.
        */
        .code {
            width: 100%;
            height: 58px;
            background: #050505;
            color: #fff;
            border: 1px solid #292929;
            outline: 0;
            padding: 0 16px;
            font-size: 24px;
            letter-spacing: 8px;
            text-align: center;
        }

        /*
            Кнопка отправки кода.
        */
        .send {
            width: 100%;
            height: 52px;
            margin-top: 8px;
            background: #fff;
            color: #000;
            border: 1px solid #fff;
            font-size: 13px;
        }

        /*
            Неактивная кнопка отправки.
        */
        .send:disabled {
            opacity: .25;
        }

        /*
            Блок информации о пользователе.
        */
        .userBlock {
            padding: 18px;
            background: #080808;
            border: 1px solid #242424;
        }

        .userLabel {
            margin-bottom: 10px;
            color: #666;
            font-size: 11px;
        }

        .userAddress {
            font-size: 12px;
            line-height: 1.5;
            word-break: break-all;
        }

        /*
            Полноэкранный индикатор проверки NFT.
        */
        #loading {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #777;
            font-size: 11px;
        }

        #loading.active {
            display: flex;
        }

        /*
            Адаптация интерфейса для мобильных экранов.
        */
        @media (max-width: 500px) {

            .title {
                font-size: 24px;
            }

            .grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .movePad {
                width: 100px;
                height: 100px;
            }

            .lookPad {
                width: 43vw;
                height: 100px;
            }

            .roomControls {
                height: 112px;
                bottom: calc(10px + env(safe-area-inset-bottom));
                padding: 0 8px;
            }

            .vertical {
                bottom: 20px;
            }

            .reset {
                right: 8px;
            }
        }

    </style>
</head>

<body>

    <!-- ============================================================
         AUTH SCREEN
         Экран подключения TON-кошелька.
         ============================================================ -->

    <section id="authScreen" class="screen active center">

        <div class="panel">

            <div class="title">
                AR Gallery
            </div>

            <button
                id="connectWallet"
                class="button primary"
            >
                ПОДКЛЮЧИТЬ КОШЕЛЁК
            </button>

            <div id="authStatus" class="status">
                Подключите TON-кошелёк
            </div>

        </div>

    </section>


    <!-- ============================================================
         HOME SCREEN
         Главное меню приложения.
         ============================================================ -->

    <section id="homeScreen" class="screen center">

        <div class="panel">

            <div class="title">
                AR Gallery
            </div>

            <button id="openRoom" class="button">
                ROOM
            </button>

            <button id="openGeneration" class="button">
                ГЕНЕРАЦИЯ
            </button>

            <button id="openUser" class="button">
                ПОЛЬЗОВАТЕЛЬ
            </button>

        </div>

    </section>


    <!-- ============================================================
         ROOM LIST SCREEN
         Список доступных комнат.
         ============================================================ -->

    <section id="roomScreen" class="screen page">

        <div class="header">

            <button id="roomBack" class="back">
                ←
            </button>

            <div class="pageTitle">
                ROOM
            </div>

        </div>

        <div id="roomStatusList" class="status">
            Загрузка комнат...
        </div>

        <div id="roomGrid" class="grid"></div>

    </section>


    <!-- ============================================================
         ROOM VIEWER SCREEN
         3D-просмотр комнаты.
         ============================================================ -->

    <section id="roomViewerScreen" class="screen">

        <!-- Контейнер для Three.js Canvas -->
        <div id="roomCanvas"></div>

        <div class="roomHeader">

            <button id="roomViewerBack" class="back">
                ←
            </button>

            <div id="roomViewerTitle" class="roomTitle">
                ROOM
            </div>

        </div>

        <!-- Информация о процессе загрузки комнаты -->
        <div id="roomViewerStatus" class="roomStatus">
            Загрузка комнаты...
        </div>

        <!-- Панель управления 3D-камерой -->
        <div class="roomControls">

            <!-- Джойстик перемещения -->
            <div id="roomMovePad" class="movePad">
                <div id="roomMoveKnob" class="moveKnob"></div>
            </div>

            <!-- Управление поворотом и наклоном -->
            <div id="roomLookPad" class="lookPad">
                <div class="lookLabel">
                    ПОВОРОТ / НАКЛОН
                </div>
            </div>

            <!-- Управление высотой -->
            <div class="vertical">

                <div class="axis">
                    ВЫСОТА
                </div>

                <button id="roomMoveUp" class="vbtn">
                    ↑
                </button>

                <button id="roomMoveDown" class="vbtn">
                    ↓
                </button>

            </div>

            <!-- Управление креном -->
            <div class="rolls">

                <button id="roomRollLeft" class="roll">
                    ↶
                </button>

                <button id="roomRollRight" class="roll">
                    ↷
                </button>

            </div>

            <!-- Сброс положения камеры -->
            <button id="roomReset" class="reset">
                ⟳
            </button>

        </div>

    </section>


    <!-- ============================================================
         GENERATION SCREEN
         Отправка пятизначного кода на API генерации.
         ============================================================ -->

    <section id="generationScreen" class="screen center">

        <div class="panel">

            <div
                class="title"
                style="font-size:20px"
            >
                ГЕНЕРАЦИЯ
            </div>

            <input
                id="generationCode"
                class="code"
                inputmode="numeric"
                autocomplete="off"
                maxlength="5"
                placeholder="00000"
            >

            <button
                id="generationSubmit"
                class="send"
                disabled
            >
                ОТПРАВИТЬ
            </button>

            <div
                id="generationStatus"
                class="status"
            ></div>

        </div>

        <button
            id="generationBack"
            class="back"
            style="position:fixed;top:14px;left:14px"
        >
            ←
        </button>

    </section>


    <!-- ============================================================
         USER SCREEN
         Информация о подключённом TON-кошельке.
         ============================================================ -->

    <section id="userScreen" class="screen page">

        <div class="header">

            <button id="userBack" class="back">
                ←
            </button>

            <div class="pageTitle">
                ПОЛЬЗОВАТЕЛЬ
            </div>

        </div>

        <div
            class="panel"
            style="margin:auto"
        >

            <div class="userBlock">

                <div class="userLabel">
                    TON-КОШЕЛЁК
                </div>

                <div
                    id="userWalletAddress"
                    class="userAddress"
                ></div>

            </div>

            <button
                id="disconnectWallet"
                class="button"
            >
                ВЫЙТИ ИЗ КОШЕЛЬКА
            </button>

            <div
                id="userStatus"
                class="status"
            ></div>

        </div>

    </section>


    <!-- ============================================================
         GLOBAL LOADING SCREEN
         Показывается во время проверки NFT.
         ============================================================ -->

    <div id="loading">
        <div>
            ПРОВЕРКА NFT
        </div>
    </div>


    <!-- ============================================================
         IMPORT MAP
         Определяет адреса библиотек Three.js.
         ============================================================ -->

    <script type="importmap">

        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
            }
        }

    </script>


    <script type="module">

        /*
         * ============================================================
         * THREE.JS IMPORTS
         * ============================================================
         *
         * THREE:
         * Основная библиотека Three.js.
         *
         * GLTFLoader:
         * Загрузчик 3D-моделей форматов GLB/GLTF.
         */

        import * as THREE from "three";
        import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";


        /* ============================================================
           CONFIG
           Основные настройки приложения.
           ============================================================ */

        /*
         * TON Connect manifest.
         * Используется при подключении TON-кошелька.
         */
        const TON_MANIFEST =
            "https://roman22022000.github.io/Ton_site/tonconnect-manifest.json";


        /*
         * Адрес обязательной NFT-коллекции.
         * Пользователь получает доступ только при наличии NFT
         * из этой коллекции.
         */
        const REQUIRED_COLLECTION =
            "EQD9mm3hx-QvHyNG18gDaaJtSTTQTVVYVjJ6zhonXocj2eyI";


        /*
         * Raw-адрес той же NFT-коллекции.
         * Используется как дополнительный вариант сравнения.
         */
        const REQUIRED_COLLECTION_RAW =
            "0:fd9a6de1c7e42f1d8346d7c80369a26d4934d04d5558563eb38689d7a1c8f6";


        /*
         * API генерации.
         */
        const GENERATION_API =
            "https://api.araicameragame.party/api/generation";


        /*
         * API комнат.
         */
        const ROOMS_API =
            "https://api.araicameragame.party/api/rooms";


        /*
         * Размер комнаты:
         *
         * Длина: 7
         * Ширина: 6
         * Высота: 4
         */
        const ROOM_LENGTH = 7;
        const ROOM_WIDTH = 6;
        const ROOM_HEIGHT = 4;


        /*
         * Параметры камеры:
         *
         * ROOM_EYE_HEIGHT:
         * начальная высота камеры.
         *
         * ROOM_SPEED:
         * скорость перемещения.
         *
         * ROOM_LOOK_SPEED:
         * скорость вращения взгляда.
         *
         * ROOM_CAMERA_RADIUS:
         * минимальное расстояние камеры от стен.
         */
        const ROOM_EYE_HEIGHT = 1.65;
        const ROOM_SPEED = 2.7;
        const ROOM_LOOK_SPEED = .006;
        const ROOM_CAMERA_RADIUS = .18;


        /* ============================================================
           DOM
           Получение ссылок на HTML-элементы.
           ============================================================ */

        /*
         * Функция $:
         *
         * INPUT:
         * id — идентификатор HTML-элемента.
         *
         * OUTPUT:
         * найденный DOM-элемент.
         */
        const $ = id => document.getElementById(id);


        /*
         * Основные экраны приложения.
         */
        const authScreen = $("authScreen");
        const homeScreen = $("homeScreen");
        const roomScreen = $("roomScreen");
        const roomViewerScreen = $("roomViewerScreen");
        const generationScreen = $("generationScreen");
        const userScreen = $("userScreen");


        /*
         * Элементы статуса и пользователя.
         */
        const authStatus = $("authStatus");
        const loading = $("loading");
        const userWalletAddress = $("userWalletAddress");
        const userStatus = $("userStatus");


        /*
         * Элементы ROOM.
         */
        const roomGrid = $("roomGrid");
        const roomStatusList = $("roomStatusList");
        const roomViewerStatus = $("roomViewerStatus");
        const roomViewerTitle = $("roomViewerTitle");


        /*
         * Элементы управления 3D-комнатой.
         */
        const roomCanvas = $("roomCanvas");
        const roomMovePad = $("roomMovePad");
        const roomMoveKnob = $("roomMoveKnob");
        const roomLookPad = $("roomLookPad");

        const roomMoveUp = $("roomMoveUp");
        const roomMoveDown = $("roomMoveDown");
        const roomRollLeft = $("roomRollLeft");
        const roomRollRight = $("roomRollRight");
        const roomReset = $("roomReset");


        /*
         * Элементы генерации.
         */
        const generationCode = $("generationCode");
        const generationSubmit = $("generationSubmit");
        const generationStatus = $("generationStatus");


        /* ============================================================
           NAVIGATION HELPERS
           ============================================================ */

        /*
         * FUNCTION: show
         *
         * Назначение:
         * Переключает активный экран приложения.
         *
         * INPUT:
         * screen — DOM-элемент экрана, который нужно показать.
         *
         * Логика:
         * 1. Все экраны скрываются.
         * 2. Переданный экран получает класс active.
         */
        function show(screen) {

            document
                .querySelectorAll(".screen")
                .forEach(s => s.classList.remove("active"));

            screen.classList.add("active");
        }


        /*
         * FUNCTION: roomStatus
         *
         * Назначение:
         * Изменяет информационное сообщение поверх 3D-комнаты.
         *
         * INPUT:
         * text — отображаемый текст.
         * on — показать или скрыть сообщение.
         */
        function roomStatus(text, on = true) {

            roomViewerStatus.textContent = text || "";

            roomViewerStatus.style.display =
                on ? "block" : "none";
        }


        /* ============================================================
           TON / NFT
           ============================================================ */

        /*
         * FUNCTION: b64Bytes
         *
         * Назначение:
         * Преобразует Base64/Base64URL строку в Uint8Array.
         *
         * INPUT:
         * v — Base64 или Base64URL строка.
         *
         * OUTPUT:
         * Uint8Array с байтами исходной строки.
         */
        function b64Bytes(v) {

            let s = String(v)
                .replace(/-/g, "+")
                .replace(/_/g, "/");

            while (s.length % 4) {
                s += "=";
            }

            const b = atob(s);
            const a = new Uint8Array(b.length);

            for (let i = 0; i < b.length; i++) {
                a[i] = b.charCodeAt(i);
            }

            return a;
        }


        /*
         * FUNCTION: normalizeTonAddress
         *
         * Назначение:
         * Приводит TON-адрес к единому raw-формату.
         *
         * INPUT:
         * address — TON-адрес.
         *
         * OUTPUT:
         * Нормализованный TON-адрес.
         */
        function normalizeTonAddress(address) {

            if (!address) {
                return "";
            }

            address = String(address).trim();


            /*
             * Если адрес уже находится в raw-формате,
             * приводим hex-часть к нижнему регистру.
             */
            if (/^-?\d+:[0-9a-fA-F]{64}$/.test(address)) {

                const p = address.split(":");

                return p[0] + ":" + p[1].toLowerCase();
            }


            /*
             * Если адрес user-friendly,
             * декодируем его из Base64.
             */
            try {

                const b = b64Bytes(address);

                if (b.length !== 36) {
                    return address.toLowerCase();
                }

                let wc = b[1];

                if (wc === 255) {
                    wc = -1;
                }


                /*
                 * Получаем 32-байтный hash адреса.
                 */
                let h = "";

                for (let i = 2; i < 34; i++) {
                    h += b[i]
                        .toString(16)
                        .padStart(2, "0");
                }


                return wc + ":" + h.toLowerCase();

            } catch {

                /*
                 * Если декодирование не удалось,
                 * возвращаем исходную строку в нижнем регистре.
                 */
                return address.toLowerCase();
            }
        }


        /*
         * Нормализованный адрес обязательной коллекции.
         */
        const requiredCollection =
            normalizeTonAddress(REQUIRED_COLLECTION);


        /*
         * FUNCTION: checkCollectionNFT
         *
         * Назначение:
         * Проверяет наличие у кошелька NFT из обязательной коллекции.
         *
         * INPUT:
         * wallet — TON-адрес кошелька.
         *
         * OUTPUT:
         * true  — NFT нужной коллекции существует.
         * false — NFT нужной коллекции отсутствует.
         *
         * API:
         * TonAPI.
         */
        async function checkCollectionNFT(wallet) {

            const r = await fetch(
                "https://tonapi.io/v2/accounts/" +
                encodeURIComponent(wallet) +
                "/nfts?limit=1000",
                {
                    headers: {
                        Accept: "application/json"
                    }
                }
            );


            /*
             * Проверяем HTTP-статус.
             */
            if (!r.ok) {
                throw new Error(
                    "TonAPI HTTP " + r.status
                );
            }


            /*
             * Получаем JSON-ответ.
             */
            const d = await r.json();

            const items =
                Array.isArray(d.nft_items)
                    ? d.nft_items
                    : [];


            /*
             * Ищем NFT нужной коллекции.
             */
            return items.some(n => {

                const a =
                    n.collection?.address ||
                    n.collection_address ||
                    "";

                const x =
                    normalizeTonAddress(a);

                return (
                    x === requiredCollection ||
                    x === REQUIRED_COLLECTION_RAW
                );
            });
        }


        /*
         * Состояние авторизации.
         */
        let currentWallet = null;
        let accessGranted = false;
        let checkingNFT = false;


        /*
         * FUNCTION: processWallet
         *
         * Назначение:
         * Обрабатывает подключение TON-кошелька и проверяет NFT.
         *
         * INPUT:
         * wallet — объект подключённого TON-кошелька.
         *
         * Результат:
         * При наличии NFT пользователь получает доступ
         * к основному меню приложения.
         */
        async function processWallet(wallet) {

            /*
             * Если кошелёк отключён.
             */
            if (!wallet) {

                currentWallet = null;
                accessGranted = false;
                userWalletAddress.textContent = "";

                authStatus.textContent =
                    "Подключите TON-кошелёк";

                show(authScreen);

                return;
            }


            /*
             * Не запускаем повторную проверку,
             * если проверка уже выполняется.
             */
            if (
                checkingNFT ||
                !wallet.account?.address
            ) {
                return;
            }


            /*
             * Сохраняем адрес кошелька.
             */
            currentWallet =
                wallet.account.address;

            accessGranted = false;
            checkingNFT = true;


            authStatus.textContent =
                "Проверка NFT...";

            loading.classList.add("active");


            try {

                /*
                 * Проверяем NFT обязательной коллекции.
                 */
                if (!await checkCollectionNFT(currentWallet)) {

                    authStatus.textContent =
                        "NFT нужной коллекции не найден";

                    show(authScreen);

                    return;
                }


                /*
                 * NFT найден.
                 * Доступ к приложению разрешён.
                 */
                accessGranted = true;

                userWalletAddress.textContent =
                    currentWallet;

                authStatus.textContent =
                    "Доступ разрешён";

                show(homeScreen);

            } catch (e) {

                console.error(
                    "NFT CHECK ERROR:",
                    e
                );

                authStatus.textContent =
                    "Ошибка проверки NFT";

                show(authScreen);

            } finally {

                checkingNFT = false;

                loading.classList.remove("active");
            }
        }


        /*
         * FUNCTION: requireAccess
         *
         * Назначение:
         * Проверяет, имеет ли пользователь право использовать
         * защищённые разделы приложения.
         *
         * OUTPUT:
         * true  — доступ разрешён.
         * false — доступ запрещён.
         */
        function requireAccess() {

            if (
                !accessGranted ||
                !currentWallet
            ) {

                authStatus.textContent =
                    "Доступ закрыт";

                show(authScreen);

                return false;
            }

            return true;
        }


        /* ============================================================
           TON CONNECT
           ============================================================ */

        /*
         * Проверяем наличие библиотеки TON Connect UI.
         */
        if (!window.TON_CONNECT_UI) {
            throw new Error(
                "TON Connect UI не загрузился"
            );
        }


        /*
         * Создаём объект TON Connect UI.
         */
        const tonConnectUI =
            new TON_CONNECT_UI.TonConnectUI({
                manifestUrl: TON_MANIFEST,
                buttonRootId: null,
                restoreConnection: true
            });


        /*
         * Настройки интерфейса TON Connect.
         */
        tonConnectUI.uiOptions = {
            language: "ru",
            uiPreferences: {
                theme: "DARK",
                borderRadius: "none"
            }
        };


        /*
         * Открывает окно подключения кошелька.
         */
        $("connectWallet").onclick =
            async () => {

                try {

                    await tonConnectUI.openModal();

                } catch (e) {

                    console.error(e);

                    authStatus.textContent =
                        "Ошибка открытия TON Connect";
                }
            };


        /*
         * Отслеживает изменение состояния подключения кошелька.
         */
        tonConnectUI.onStatusChange(
            wallet => processWallet(wallet),
            e => console.error(
                "TON Connect:",
                e
            )
        );


        /*
         * Обрабатывает восстановление ранее существовавшего подключения.
         */
        tonConnectUI.connectionRestored.catch(
            e => console.error(
                "TON RESTORE:",
                e
            )
        );


        /* ============================================================
           GENERATION
           ============================================================ */

        /*
         * FUNCTION: generationCode.oninput
         *
         * Назначение:
         * Контролирует поле кода генерации.
         *
         * Разрешаются только цифры.
         * Максимальная длина — 5 цифр.
         */
        generationCode.oninput = () => {

            generationCode.value =
                generationCode.value
                    .replace(/\D/g, "")
                    .slice(0, 5);

            generationSubmit.disabled =
                generationCode.value.length !== 5;
        };


        /*
         * FUNCTION: generationSubmit.onclick
         *
         * Назначение:
         * Отправляет введённый пятизначный код
         * и адрес TON-кошелька на API генерации.
         */
        generationSubmit.onclick =
            async () => {

                /*
                 * Проверяем доступ пользователя.
                 */
                if (!requireAccess()) {
                    return;
                }


                /*
                 * Получаем код.
                 */
                const code =
                    generationCode.value.trim();


                /*
                 * Проверяем формат кода.
                 */
                if (!/^\d{5}$/.test(code)) {

                    generationStatus.textContent =
                        "Введите 5 цифр";

                    return;
                }


                generationSubmit.disabled = true;

                generationStatus.textContent =
                    "Отправка...";


                try {

                    /*
                     * POST-запрос на API генерации.
                     */
                    const r = await fetch(
                        GENERATION_API,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            /*
                             * Передаём:
                             * code   — код генерации.
                             * wallet — адрес кошелька.
                             */
                            body: JSON.stringify({
                                code,
                                wallet: currentWallet
                            })
                        }
                    );


                    /*
                     * Получаем JSON-ответ сервера.
                     */
                    const d = await r.json();


                    /*
                     * Проверяем успешность операции.
                     */
                    if (
                        !r.ok ||
                        d.success !== true
                    ) {

                        throw new Error(
                            d.error ||
                            "Ошибка сервера"
                        );
                    }


                    /*
                     * Успешная отправка.
                     */
                    generationStatus.textContent =
                        "Данные отправлены";

                    generationCode.value = "";

                } catch (e) {

                    console.error(e);

                    generationStatus.textContent =
                        "Ошибка отправки";
                }
            };


        /* ============================================================
           ROOM DATA
           ============================================================ */

        /*
         * Массив доступных комнат.
         */
        let rooms = [];


        /*
         * Текущая открытая комната.
         */
        let currentRoom = null;


        /*
         * FUNCTION: roomNumber
         *
         * Назначение:
         * Определяет номер комнаты.
         *
         * Приоритет:
         * 1. item.number
         * 2. цифры из item.name
         * 3. порядковый номер.
         */
        function roomNumber(item, i) {

            return (
                item?.number ??
                (
                    item?.name
                        ? String(item.name)
                            .replace(/\D/g, "") ||
                            i + 1
                        : i + 1
                )
            );
        }


        /*
         * FUNCTION: roomName
         *
         * Назначение:
         * Определяет отображаемое имя комнаты.
         *
         * Приоритет:
         * name → folder → title → room_N.
         */
        function roomName(item, i) {

            return String(
                item?.name ||
                item?.folder ||
                item?.title ||
                "room_" +
                roomNumber(item, i)
            );
        }


        /*
         * FUNCTION: fileUrl
         *
         * Назначение:
         * Формирует URL файла комнаты.
         *
         * Если передан полный HTTP/data URL,
         * он возвращается без изменений.
         *
         * Иначе URL формируется через API комнат.
         */
        function fileUrl(folder, file) {

            if (!file) {
                return "";
            }


            if (
                /^https?:\/\//i.test(String(file)) ||
                String(file).startsWith("data:")
            ) {

                return String(file);
            }


            return (
                `${ROOMS_API}/file/` +
                `${encodeURIComponent(folder)}/` +
                `${encodeURIComponent(file)}`
            );
        }


        /*
         * FUNCTION: resolveTextures
         *
         * Назначение:
         * Формирует адреса шести текстур комнаты:
         *
         * back
         * left
         * right
         * front
         * ceiling
         * floor
         *
         * Также учитывает текстуры,
         * которые сервер может вернуть в manifest.
         */
        function resolveTextures(item) {

            const folder =
                String(
                    item?.folder ||
                    item?.name ||
                    ""
                ).trim();


            /*
             * Стандартные имена файлов текстур.
             */
            const names = {

                back: "01_BACKGROUND.png",
                left: "02_LEFT.png",
                right: "03_RIGHT.png",
                front: "04_FRONT.png",
                ceiling: "05_SKY.png",
                floor: "06_GROUND.png"

            };


            const out = {};


            /*
             * Формируем стандартные URL.
             */
            for (
                const [k, n]
                of Object.entries(names)
            ) {

                out[k] =
                    fileUrl(folder, n);
            }


            /*
             * Если сервер передал собственный
             * объект textures, используем его значения.
             */
            const t = item?.textures;


            if (
                t &&
                typeof t === "object"
            ) {

                const map = {

                    back:
                        t.background ||
                        t.back ||
                        t.rear,

                    left:
                        t.left,

                    right:
                        t.right,

                    front:
                        t.front ||
                        t.forward,

                    ceiling:
                        t.sky ||
                        t.ceiling ||
                        t.top,

                    floor:
                        t.ground ||
                        t.floor ||
                        t.bottom
                };


                for (
                    const [k, v]
                    of Object.entries(map)
                ) {

                    const u =
                        typeof v === "string"
                            ? v
                            : v?.url ||
                              v?.file_url ||
                              v?.download_url;


                    if (u) {
                        out[k] =
                            fileUrl(folder, u);
                    }
                }
            }


            return out;
        }


        /*
         * FUNCTION: loadRooms
         *
         * Назначение:
         * Загружает список комнат с PC-сервера
         * и создаёт кнопки комнат в интерфейсе.
         */
        async function loadRooms() {

            roomStatusList.textContent =
                "Загрузка комнат с PC-сервера...";

            roomGrid.innerHTML = "";


            /*
             * AbortController используется,
             * чтобы ограничить время ожидания сервера.
             */
            const c = new AbortController();

            const t = setTimeout(
                () => c.abort(),
                12000
            );


            try {

                /*
                 * Получаем список комнат.
                 */
                const r = await fetch(
                    ROOMS_API,
                    {
                        cache: "no-store",
                        signal: c.signal
                    }
                );


                if (!r.ok) {
                    throw new Error(
                        "HTTP " + r.status
                    );
                }


                const d = await r.json();


                /*
                 * API может вернуть либо массив,
                 * либо объект с items/rooms.
                 */
                rooms =
                    Array.isArray(d)
                        ? d
                        : (
                            d.items ||
                            d.rooms ||
                            []
                        );


                if (!rooms.length) {

                    roomStatusList.textContent =
                        "Комнаты не найдены";

                    return;
                }


                roomStatusList.textContent =
                    `Получено комнат: ${rooms.length}`;


                /*
                 * Создаём кнопку для каждой комнаты.
                 */
                rooms.forEach((item, i) => {

                    const b =
                        document.createElement("button");

                    b.className = "roomItem";
                    b.type = "button";


                    /*
                     * Отображаем номер и название комнаты.
                     */
                    b.innerHTML =
                        `<div>${roomNumber(item, i)}</div>` +
                        `<small>${roomName(item, i)}</small>`;


                    /*
                     * При нажатии открывается выбранная комната.
                     */
                    b.onclick =
                        () => openRoom(i);


                    roomGrid.appendChild(b);
                });

            } catch (e) {

                roomStatusList.textContent =
                    e.name === "AbortError"
                        ? "Тайм-аут PC-сервера"
                        : `Ошибка ROOM: ${e.message}`;

            } finally {

                /*
                 * Удаляем таймер ожидания.
                 */
                clearTimeout(t);
            }
        }


        /* ============================================================
           ROOM REQUEST / TEXTURES
           ============================================================ */

        /*
         * FUNCTION: requestRoom
         *
         * Назначение:
         * Отправляет PC-серверу запрос на получение
         * данных выбранной комнаты.
         *
         * INPUT:
         * item — объект выбранной комнаты.
         *
         * OUTPUT:
         * Объект комнаты с manifest и дополнительными данными.
         */
        async function requestRoom(item) {

            const folder =
                String(
                    item?.folder ||
                    item?.name ||
                    ""
                ).trim();


            /*
             * Отправляем запрос серверу.
             */
            const r = await fetch(
                `${ROOMS_API}/request`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body: JSON.stringify({
                        room: folder,
                        wallet: currentWallet
                    })
                }
            );


            if (!r.ok) {
                throw new Error(
                    "ROOM HTTP " + r.status
                );
            }


            const d = await r.json();


            if (d.success === false) {

                throw new Error(
                    d.error ||
                    "PC-сервер отклонил запрос"
                );
            }


            if (!d.room) {

                throw new Error(
                    "PC-сервер не вернул manifest"
                );
            }


            /*
             * Объединяем исходные данные комнаты
             * с данными, полученными от сервера.
             */
            return {
                ...item,
                ...d.room,

                folder:
                    d.room.folder ||
                    folder,

                name:
                    d.room.name ||
                    folder
            };
        }


        /*
         * FUNCTION: loadTexture
         *
         * Назначение:
         * Загружает одну текстуру через Three.js TextureLoader.
         *
         * INPUT:
         * url   — URL текстуры.
         * label — название текстуры для сообщений об ошибках.
         *
         * OUTPUT:
         * Promise, возвращающий THREE.Texture.
         */
        function loadTexture(url, label) {

            return new Promise(
                (resolve, reject) => {

                    if (!url) {

                        return reject(
                            new Error(
                                label +
                                " не задана"
                            )
                        );
                    }


                    new THREE.TextureLoader().load(

                        url,

                        t => {

                            /*
                             * Текстура используется
                             * как sRGB-изображение.
                             */
                            t.colorSpace =
                                THREE.SRGBColorSpace;


                            /*
                             * Ограничиваем текстуру краями.
                             */
                            t.wrapS =
                                THREE.ClampToEdgeWrapping;

                            t.wrapT =
                                THREE.ClampToEdgeWrapping;


                            /*
                             * Используем анизотропную фильтрацию
                             * при наличии renderer.
                             */
                            if (roomRenderer) {

                                t.anisotropy =
                                    Math.min(
                                        roomRenderer
                                            .capabilities
                                            .getMaxAnisotropy(),
                                        4
                                    );
                            }


                            resolve(t);
                        },

                        undefined,

                        () =>
                            reject(
                                new Error(
                                    "Не удалось загрузить " +
                                    label
                                )
                            )
                    );
                }
            );
        }


        /*
         * FUNCTION: surface
         *
         * Назначение:
         * Создаёт плоскую поверхность комнаты.
         *
         * INPUT:
         * w     — ширина.
         * h     — высота.
         * pos   — положение.
         * rot   — вращение.
         * label — идентификатор поверхности.
         *
         * OUTPUT:
         * THREE.Mesh.
         */
        function surface(
            w,
            h,
            pos,
            rot,
            label
        ) {

            const m =
                new THREE.MeshBasicMaterial({
                    color: 0x222222,
                    side: THREE.DoubleSide
                });


            const x =
                new THREE.Mesh(
                    new THREE.PlaneGeometry(w, h),
                    m
                );


            x.position.copy(pos);

            x.rotation.set(
                rot.x,
                rot.y,
                rot.z
            );


            x.userData.roomSurface =
                label;


            return x;
        }


        /*
         * FUNCTION: clearRoom
         *
         * Назначение:
         * Удаляет текущие поверхности комнаты
         * и загруженную 3D-модель.
         *
         * Также освобождает ресурсы Three.js.
         */
        function clearRoom() {

            if (!roomScene) {
                return;
            }


            /*
             * Удаляем поверхности комнаты.
             */
            [
                ...roomScene.children
            ].forEach(o => {

                if (o.userData?.roomSurface) {

                    o.geometry?.dispose();

                    o.material?.map?.dispose();

                    o.material?.dispose();

                    roomScene.remove(o);
                }
            });


            /*
             * Удаляем 3D-модель.
             */
            if (roomModel) {

                roomScene.remove(roomModel);

                roomModel = null;
            }
        }


        /* ============================================================
           ROOM MODEL
           ============================================================ */

        /*
         * FUNCTION: loadRoomModel
         *
         * Назначение:
         * Загружает GLB/GLTF-модель комнаты.
         *
         * Дополнительно:
         * URLModifier перенаправляет относительные пути
         * файлов модели на PC-сервер.
         */
        async function loadRoomModel(info) {

            const url =
                String(
                    info?.url ||
                    ""
                ).trim();


            if (!url) {

                throw new Error(
                    "Сервер не вернул URL 3D модели"
                );
            }


            /*
             * LoadingManager позволяет изменить
             * URL внутренних ресурсов GLTF/GLB.
             */
            const manager =
                new THREE.LoadingManager();


            manager.setURLModifier(
                u => {

                    /*
                     * Полные URL и data URL
                     * не изменяются.
                     */
                    if (
                        !u ||
                        u.startsWith("data:") ||
                        /^https?:\/\//i.test(u)
                    ) {

                        return u;
                    }


                    /*
                     * Из относительного URL
                     * получаем имя файла.
                     */
                    const f =
                        u
                            .split("?")[0]
                            .split("/")
                            .pop();


                    /*
                     * Если известна папка комнаты,
                     * файл направляется через API.
                     */
                    return info?.room
                        ? `${ROOMS_API}/model-file/` +
                          `${encodeURIComponent(info.room)}/` +
                          `${encodeURIComponent(f)}`
                        : u;
                }
            );


            /*
             * Создаём GLTFLoader с нашим LoadingManager.
             */
            const loader =
                new GLTFLoader(manager);


            /*
             * Загружаем модель.
             */
            const gltf =
                await new Promise(
                    (res, rej) =>
                        loader.load(
                            url,
                            res,
                            undefined,
                            rej
                        )
                );


            const model =
                gltf.scene;


            /*
             * Получаем размеры модели.
             */
            const box =
                new THREE.Box3()
                    .setFromObject(model);

            const size =
                box.getSize(
                    new THREE.Vector3()
                );


            /*
             * Проверяем наличие геометрии.
             */
            if (
                Math.max(
                    size.x,
                    size.y,
                    size.z
                ) <= 0
            ) {

                throw new Error(
                    "3D модель не содержит геометрии"
                );
            }


            /*
             * Масштабируем модель до максимального
             * размера 3.2 единицы.
             */
            model.scale.setScalar(
                3.2 /
                Math.max(
                    size.x,
                    size.y,
                    size.z
                )
            );


            model.updateMatrixWorld(true);


            /*
             * Повторно вычисляем bounding box
             * после масштабирования.
             */
            const b =
                new THREE.Box3()
                    .setFromObject(model);


            const center =
                b.getCenter(
                    new THREE.Vector3()
                );


            /*
             * Центрируем модель по X/Z.
             */
            model.position.x -=
                center.x;

            model.position.z -=
                center.z;


            /*
             * Ставим нижнюю часть модели на Y=0.
             */
            model.position.y -=
                b.min.y;


            /*
             * Сохраняем модель
             * и добавляем её в сцену.
             */
            roomModel = model;

            roomScene.add(model);
        }


        /* ============================================================
           ROOM VIEWER
           ============================================================ */

        /*
         * Основные объекты Three.js.
         */
        let roomScene;
        let roomCamera;
        let roomRenderer;
        let roomClock;
        let roomModel;


        /*
         * Начальные углы камеры.
         */
        let roomYaw = Math.PI;
        let roomPitch = 0;
        let roomRoll = 0;


        /*
         * Состояние управления джойстиком.
         */
        let roomPadX = 0;
        let roomPadY = 0;
        let verticalInput = 0;


        /*
         * Идентификаторы активных touch/pointer событий.
         */
        let padId = null;
        let lookId = null;


        /*
         * Последняя позиция пальца
         * при управлении взглядом.
         */
        let lastLX = 0;
        let lastLY = 0;


        /*
         * Нажатые клавиши клавиатуры.
         */
        const keys = new Set();


        /*
         * FUNCTION: updateCamera
         *
         * Назначение:
         * Обновляет направление взгляда камеры
         * на основе yaw, pitch и roll.
         */
        function updateCamera() {

            if (!roomCamera) {
                return;
            }


            /*
             * Рассчитываем направление взгляда.
             */
            const d =
                new THREE.Vector3(
                    Math.sin(roomYaw) *
                        Math.cos(roomPitch),

                    Math.sin(roomPitch),

                    Math.cos(roomYaw) *
                        Math.cos(roomPitch)
                );


            /*
             * Направляем камеру в рассчитанную точку.
             */
            roomCamera.lookAt(
                roomCamera.position.x + d.x,
                roomCamera.position.y + d.y,
                roomCamera.position.z + d.z
            );


            /*
             * Добавляем крен камеры.
             */
            roomCamera.rotateZ(roomRoll);
        }


        /*
         * FUNCTION: clampCamera
         *
         * Назначение:
         * Ограничивает положение камеры
         * пределами комнаты.
         *
         * Камера не может выйти за стены,
         * потолок и пол.
         */
        function clampCamera() {

            if (!roomCamera) {
                return;
            }


            /*
             * Ограничение по X.
             */
            roomCamera.position.x =
                THREE.MathUtils.clamp(
                    roomCamera.position.x,
                    -ROOM_LENGTH / 2 +
                        ROOM_CAMERA_RADIUS,
                    ROOM_LENGTH / 2 -
                        ROOM_CAMERA_RADIUS
                );


            /*
             * Ограничение по Z.
             */
            roomCamera.position.z =
                THREE.MathUtils.clamp(
                    roomCamera.position.z,
                    -ROOM_WIDTH / 2 +
                        ROOM_CAMERA_RADIUS,
                    ROOM_WIDTH / 2 -
                        ROOM_CAMERA_RADIUS
                );


            /*
             * Ограничение по высоте.
             */
            roomCamera.position.y =
                THREE.MathUtils.clamp(
                    roomCamera.position.y,
                    .35,
                    ROOM_HEIGHT - .35
                );
        }


        /*
         * FUNCTION: initRoomViewer
         *
         * Назначение:
         * Один раз создаёт Three.js-сцену,
         * камеру, WebGLRenderer и обработчики управления.
         */
        function initRoomViewer() {

            /*
             * Если renderer уже существует,
             * повторно сцену не создаём.
             */
            if (roomRenderer) {
                return;
            }


            /*
             * Создаём сцену.
             */
            roomScene =
                new THREE.Scene();

            roomScene.background =
                new THREE.Color(0x000000);


            /*
             * Создаём перспективную камеру.
             */
            roomCamera =
                new THREE.PerspectiveCamera(
                    70,
                    1,
                    .03,
                    100
                );


            /*
             * Создаём WebGLRenderer.
             */
            roomRenderer =
                new THREE.WebGLRenderer({
                    antialias: true,
                    powerPreference:
                        "high-performance"
                });


            /*
             * Ограничиваем pixel ratio.
             */
            roomRenderer.setPixelRatio(
                Math.min(
                    devicePixelRatio || 1,
                    1.5
                )
            );


            /*
             * Устанавливаем размер renderer.
             */
            roomRenderer.setSize(
                innerWidth,
                innerHeight,
                false
            );


            /*
             * Используем цветовое пространство sRGB.
             */
            roomRenderer.outputColorSpace =
                THREE.SRGBColorSpace;


            /*
             * Добавляем Canvas в DOM.
             */
            roomCanvas.appendChild(
                roomRenderer.domElement
            );


            /*
             * Таймер кадров.
             */
            roomClock =
                new THREE.Clock();


            /* ========================================================
               POINTER EVENTS — ОСНОВНОЙ CANVAS
               ======================================================== */

            /*
             * Нажатие на Canvas.
             */
            roomRenderer.domElement.onpointerdown =
                e => {

                    /*
                     * Управление мышью на ПК.
                     */
                    if (e.pointerType === "mouse") {

                        roomRenderer.domElement._mouse =
                            true;

                        roomRenderer.domElement._mx =
                            e.clientX;

                        roomRenderer.domElement._my =
                            e.clientY;

                        return;
                    }


                    /*
                     * Левая часть экрана —
                     * управление перемещением.
                     */
                    if (
                        e.clientX <
                            innerWidth / 2 &&
                        padId === null
                    ) {

                        padId =
                            e.pointerId;

                    } else if (
                        lookId === null
                    ) {

                        /*
                         * Правая часть —
                         * управление взглядом.
                         */
                        lookId =
                            e.pointerId;

                        lastLX =
                            e.clientX;

                        lastLY =
                            e.clientY;
                    }


                    /*
                     * Захватываем pointer.
                     */
                    roomRenderer
                        .domElement
                        .setPointerCapture?.(
                            e.pointerId
                        );
                };


            /*
             * Движение мыши/пальца.
             */
            roomRenderer.domElement.onpointermove =
                e => {

                    /*
                     * Управление мышью.
                     */
                    if (
                        e.pointerType ===
                        "mouse"
                    ) {

                        if (
                            !roomRenderer
                                .domElement
                                ._mouse
                        ) {
                            return;
                        }


                        const dx =
                            e.clientX -
                            roomRenderer
                                .domElement
                                ._mx;

                        const dy =
                            e.clientY -
                            roomRenderer
                                .domElement
                                ._my;


                        roomRenderer
                            .domElement
                            ._mx =
                            e.clientX;

                        roomRenderer
                            .domElement
                            ._my =
                            e.clientY;


                        /*
                         * Изменяем yaw и pitch.
                         */
                        roomYaw -=
                            dx *
                            ROOM_LOOK_SPEED;

                        roomPitch =
                            THREE.MathUtils.clamp(
                                roomPitch -
                                    dy *
                                    ROOM_LOOK_SPEED,
                                -1.52,
                                1.52
                            );


                        updateCamera();

                        return;
                    }


                    /*
                     * Управление взглядом пальцем.
                     */
                    if (
                        e.pointerId ===
                        lookId
                    ) {

                        const dx =
                            e.clientX -
                            lastLX;

                        const dy =
                            e.clientY -
                            lastLY;


                        lastLX =
                            e.clientX;

                        lastLY =
                            e.clientY;


                        roomYaw -=
                            dx *
                            ROOM_LOOK_SPEED;

                        roomPitch =
                            THREE.MathUtils.clamp(
                                roomPitch -
                                    dy *
                                    ROOM_LOOK_SPEED,
                                -1.52,
                                1.52
                            );


                        updateCamera();
                    }


                    /*
                     * Управление перемещением
                     * через левую часть Canvas.
                     */
                    if (
                        e.pointerId ===
                        padId
                    ) {

                        roomPadX =
                            THREE.MathUtils.clamp(
                                (
                                    e.clientX -
                                    (
                                        roomMovePad
                                            .getBoundingClientRect()
                                            .left +
                                        50
                                    )
                                ) / 35,
                                -1,
                                1
                            );


                        roomPadY =
                            THREE.MathUtils.clamp(
                                (
                                    e.clientY -
                                    (
                                        roomMovePad
                                            .getBoundingClientRect()
                                            .top +
                                        50
                                    )
                                ) / 35,
                                -1,
                                1
                            );


                        roomMoveKnob.style.transform =
                            `translate3d(` +
                            `${roomPadX * 35}px,` +
                            `${roomPadY * 35}px,0)`;
                    }
                };


            /*
             * Завершение pointer-события.
             */
            roomRenderer.domElement.onpointerup =
                e => {

                    if (
                        e.pointerType ===
                        "mouse"
                    ) {

                        roomRenderer
                            .domElement
                            ._mouse = false;
                    }


                    if (
                        e.pointerId ===
                        padId
                    ) {

                        padId = null;

                        roomPadX =
                            roomPadY = 0;

                        roomMoveKnob.style.transform =
                            "translate3d(0,0,0)";
                    }


                    if (
                        e.pointerId ===
                        lookId
                    ) {

                        lookId = null;
                    }
                };


            /*
             * Отмена pointer-события
             * использует ту же логику, что и pointerup.
             */
            roomRenderer.domElement.onpointercancel =
                roomRenderer
                    .domElement
                    .onpointerup;


            /* ========================================================
               MOVE PAD
               ======================================================== */

            /*
             * Нажатие на джойстик.
             */
            roomMovePad.onpointerdown =
                e => {

                    e.preventDefault();

                    padId =
                        e.pointerId;

                    roomMovePad
                        .setPointerCapture?.(
                            e.pointerId
                        );
                };


            /*
             * Движение ручки джойстика.
             */
            roomMovePad.onpointermove =
                e => {

                    if (
                        e.pointerId !==
                        padId
                    ) {
                        return;
                    }


                    const r =
                        roomMovePad
                            .getBoundingClientRect();


                    const x =
                        (
                            e.clientX -
                            (
                                r.left +
                                r.width / 2
                            )
                        ) /
                        (r.width * .32);


                    const y =
                        (
                            e.clientY -
                            (
                                r.top +
                                r.height / 2
                            )
                        ) /
                        (r.height * .32);


                    roomPadX =
                        THREE.MathUtils.clamp(
                            x,
                            -1,
                            1
                        );

                    roomPadY =
                        THREE.MathUtils.clamp(
                            y,
                            -1,
                            1
                        );


                    roomMoveKnob.style.transform =
                        `translate3d(` +
                        `${roomPadX * r.width * .32}px,` +
                        `${roomPadY * r.height * .32}px,0)`;
                };


            /*
             * Отпускание джойстика.
             */
            roomMovePad.onpointerup =
                roomMovePad.onpointercancel =
                () => {

                    padId = null;

                    roomPadX =
                        roomPadY = 0;

                    roomMoveKnob.style.transform =
                        "translate3d(0,0,0)";
                };


            /* ========================================================
               LOOK PAD
               ======================================================== */

            /*
             * Нажатие на область управления взглядом.
             */
            roomLookPad.onpointerdown =
                e => {

                    e.preventDefault();

                    lookId =
                        e.pointerId;

                    lastLX =
                        e.clientX;

                    lastLY =
                        e.clientY;

                    roomLookPad
                        .setPointerCapture?.(
                            e.pointerId
                        );
                };


            /*
             * Движение пальца по lookPad.
             */
            roomLookPad.onpointermove =
                e => {

                    if (
                        e.pointerId !==
                        lookId
                    ) {
                        return;
                    }


                    const dx =
                        e.clientX -
                        lastLX;

                    const dy =
                        e.clientY -
                        lastLY;


                    lastLX =
                        e.clientX;

                    lastLY =
                        e.clientY;


                    roomYaw -=
                        dx *
                        ROOM_LOOK_SPEED;


                    roomPitch =
                        THREE.MathUtils.clamp(
                            roomPitch -
                                dy *
                                ROOM_LOOK_SPEED,
                            -1.52,
                            1.52
                        );


                    updateCamera();
                };


            /*
             * Завершение управления взглядом.
             */
            roomLookPad.onpointerup =
                roomLookPad.onpointercancel =
                () => lookId = null;


            /* ========================================================
               VERTICAL MOVEMENT
               ======================================================== */

            /*
             * Кнопки ↑ и ↓ изменяют вертикальное движение камеры.
             */
            for (
                const [el, v]
                of [
                    [roomMoveUp, 1],
                    [roomMoveDown, -1]
                ]
            ) {

                el.onpointerdown =
                    e => {

                        e.preventDefault();

                        verticalInput = v;
                    };


                el.onpointerup =
                    el.onpointercancel =
                    () => {

                        if (
                            verticalInput ===
                            v
                        ) {

                            verticalInput = 0;
                        }
                    };
            }


            /* ========================================================
               CAMERA ROLL
               ======================================================== */

            /*
             * Наклон камеры влево.
             */
            roomRollLeft.onclick =
                () => {

                    roomRoll =
                        THREE.MathUtils.clamp(
                            roomRoll + .12,
                            -Math.PI / 3,
                            Math.PI / 3
                        );

                    updateCamera();
                };


            /*
             * Наклон камеры вправо.
             */
            roomRollRight.onclick =
                () => {

                    roomRoll =
                        THREE.MathUtils.clamp(
                            roomRoll - .12,
                            -Math.PI / 3,
                            Math.PI / 3
                        );

                    updateCamera();
                };


            /*
             * FUNCTION: roomReset.onclick
             *
             * Назначение:
             * Возвращает камеру в начальное положение.
             */
            roomReset.onclick =
                () => {

                    roomYaw =
                        Math.PI;

                    roomPitch =
                        roomRoll = 0;

                    verticalInput = 0;


                    roomCamera.position.set(
                        0,
                        ROOM_EYE_HEIGHT,
                        1
                    );


                    clampCamera();

                    updateCamera();
                };


            /* ========================================================
               KEYBOARD
               ======================================================== */

            /*
             * Запоминаем нажатые клавиши.
             */
            addEventListener(
                "keydown",
                e => keys.add(e.code)
            );


            /*
             * Удаляем клавишу после отпускания.
             */
            addEventListener(
                "keyup",
                e => keys.delete(e.code)
