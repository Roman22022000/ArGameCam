<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 maximum-scale=1,
                 user-scalable=no,
                 viewport-fit=cover"
    >

    <title>AR Gallery</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;
            color: #fff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        body {
            touch-action: manipulation;
        }

        /* =========================================
           ЭКРАНЫ
        ========================================= */

        .screen {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            display: none;

            background: #000;
        }

        .screen.active {
            display: flex;
        }


        /* =========================================
           ГЛАВНЫЙ ЭКРАН
        ========================================= */

        #homeScreen {

            align-items: center;
            justify-content: center;

            flex-direction: column;

            padding:
                calc(20px + env(safe-area-inset-top))
                20px
                calc(20px + env(safe-area-inset-bottom))
                20px;
        }

        .title {

            font-size:
                clamp(30px, 9vw, 54px);

            font-weight: 700;

            margin-bottom: 35px;

            text-align: center;
        }

        .main-button {

            width: min(82vw, 330px);

            min-height: 60px;

            border: none;

            border-radius: 18px;

            background: #fff;
            color: #000;

            font-size: 18px;

            font-weight: 700;

            cursor: pointer;
        }

        .main-button:active {

            transform: scale(.96);

        }


        /* =========================================
           ГАЛЕРЕЯ
        ========================================= */

        #galleryScreen {

            flex-direction: column;

            padding:
                calc(15px + env(safe-area-inset-top))
                15px
                calc(20px + env(safe-area-inset-bottom))
                15px;
        }

        .gallery-header {

            width: 100%;

            height: 60px;

            flex-shrink: 0;

            display: flex;

            align-items: center;
        }

        .back-button {

            width: 48px;
            height: 48px;

            border: none;

            border-radius: 14px;

            background: #171717;

            color: white;

            font-size: 24px;

            cursor: pointer;
        }

        .gallery-title {

            margin-left: 15px;

            font-size: 24px;

            font-weight: 700;
        }


        .gallery-grid {

            width: 100%;

            max-width: 600px;

            margin: auto;

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;
        }


        .model-button {

            width: 100%;

            aspect-ratio: 1 / 1;

            border: 1px solid #2c2c2c;

            border-radius: 20px;

            background: #111;

            color: white;

            font-size:
                clamp(30px, 10vw, 50px);

            font-weight: 700;

            cursor: pointer;
        }

        .model-button:active {

            transform: scale(.94);

            background: #222;
        }


        /* =========================================
           3D VIEWER
        ========================================= */

        #viewerScreen {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            background: #000;
        }

        #canvas-container {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;
        }

        canvas {

            display: block;

            width: 100%;
            height: 100%;
        }


        /* =========================================
           КНОПКИ VIEWER
        ========================================= */

        .viewer-ui {

            position: absolute;

            top:
                calc(12px + env(safe-area-inset-top));

            left: 12px;
            right: 12px;

            z-index: 10;

            display: flex;

            justify-content: space-between;

            pointer-events: none;
        }

        .viewer-button {

            width: 50px;
            height: 50px;

            border: 1px solid #333;

            border-radius: 15px;

            background:
                rgba(0,0,0,.65);

            color: white;

            font-size: 22px;

            cursor: pointer;

            pointer-events: auto;
        }


        /* =========================================
           ПОДСКАЗКА
        ========================================= */

        .viewer-info {

            position: absolute;

            left: 50%;

            bottom:
                calc(20px + env(safe-area-inset-bottom));

            transform:
                translateX(-50%);

            z-index: 10;

            padding: 10px 16px;

            border-radius: 20px;

            background:
                rgba(0,0,0,.65);

            font-size: 13px;

            white-space: nowrap;

            pointer-events: none;
        }


        /* =========================================
           ЗАГРУЗКА
        ========================================= */

        #loading {

            position: absolute;

            inset: 0;

            z-index: 30;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #000;

            font-size: 16px;

            text-align: center;
        }

        #loading.hidden {

            display: none;
        }


        /* =========================================
           SENSOR STATUS
        ========================================= */

        #sensorStatus {

            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            z-index: 40;

            width: min(85%, 360px);

            padding: 20px;

            border-radius: 18px;

            background:
                rgba(0,0,0,.85);

            text-align: center;

            line-height: 1.45;

            font-size: 15px;
        }

        #sensorStatus.hidden {

            display: none;
        }


        @media (min-width: 700px) {

            .gallery-grid {

                grid-template-columns:
                    repeat(4, 130px);

                justify-content: center;
            }

        }

    </style>
</head>


<body>

<script type="importmap">

{
    "imports": {

        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

<script type="module">

import * as THREE
    from "three";

import { GLTFLoader }
    from "three/addons/loaders/GLTFLoader.js";



/* =================================================
   TELEGRAM
================================================= */

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;


if (tg) {

    tg.ready();

    tg.expand();

    try {

        if (tg.setBackgroundColor) {

            tg.setBackgroundColor(
                "#000000"
            );

        }

        if (tg.setHeaderColor) {

            tg.setHeaderColor(
                "#000000"
            );

        }

    } catch (e) {

        console.log(e);

    }

}



/* =================================================
   ЭЛЕМЕНТЫ
================================================= */

const homeScreen =
    document.getElementById(
        "homeScreen"
    );

const galleryScreen =
    document.getElementById(
        "galleryScreen"
    );

const viewerScreen =
    document.getElementById(
        "viewerScreen"
    );

const loading =
    document.getElementById(
        "loading"
    );

const sensorStatus =
    document.getElementById(
        "sensorStatus"
    );



/* =================================================
   ПЕРЕКЛЮЧЕНИЕ ЭКРАНОВ
================================================= */

function showScreen(screen) {

    homeScreen.classList.remove(
        "active"
    );

    galleryScreen.classList.remove(
        "active"
    );

    viewerScreen.classList.remove(
        "active"
    );

    screen.classList.add(
        "active"
    );

}



/* =================================================
   НАВИГАЦИЯ
================================================= */

document
    .getElementById(
        "openGallery"
    )
    .onclick = () => {

        showScreen(
            galleryScreen
        );

    };


document
    .getElementById(
        "galleryBack"
    )
    .onclick = () => {

        showScreen(
            homeScreen
        );

    };


document
    .getElementById(
        "viewerBack"
    )
    .onclick = () => {

        stopOrientation();

        showScreen(
            galleryScreen
        );

    };



/* =================================================
   THREE.JS SCENE
================================================= */

let scene;
let camera;
let renderer;

let model = null;


const modelRoot =
    new THREE.Group();


function initThree() {


    /* -----------------------------
       SCENE
    ----------------------------- */

    scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(
            0x000000
        );


    /* -----------------------------
       CAMERA
    ----------------------------- */

    camera =
        new THREE.PerspectiveCamera(

            60,

            window.innerWidth /
            window.innerHeight,

            0.01,

            100

        );


    /*
        Камера всегда находится
        на расстоянии 3 единицы
        от центра.
    */

    camera.position.set(
        0,
        0,
        3
    );


    scene.add(
        camera
    );


    /*
        Группа модели всегда:

        0,0,0
    */

    modelRoot.position.set(
        0,
        0,
        0
    );


    scene.add(
        modelRoot
    );


    /* -----------------------------
       LIGHT
    ----------------------------- */

    const ambient =
        new THREE.HemisphereLight(

            0xffffff,

            0x222222,

            2.5

        );

    scene.add(
        ambient
    );


    const light =
        new THREE.DirectionalLight(

            0xffffff,

            3

        );

    light.position.set(
        3,
        5,
        4
    );

    scene.add(
        light
    );


    const light2 =
        new THREE.DirectionalLight(

            0xffffff,

            1.5

        );

    light2.position.set(
        -3,
        2,
        -4
    );

    scene.add(
        light2
    );


    /* -----------------------------
       RENDERER
    ----------------------------- */

    renderer =
        new THREE.WebGLRenderer({

            antialias: true,

            alpha: false,

            powerPreference:
                "high-performance"

        });


    renderer.setPixelRatio(

        Math.min(
            window.devicePixelRatio,
            2
        )

    );


    renderer.setSize(

        window.innerWidth,
        window.innerHeight

    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    renderer.toneMapping =
        THREE.ACESFilmicToneMapping;


    renderer.toneMappingExposure =
        1.2;


    document
        .getElementById(
            "canvas-container"
        )
        .appendChild(
            renderer.domElement
        );


    window.addEventListener(
        "resize",
        resize
    );


    animate();

}


initThree();



/* =================================================
   GLB LOADER
================================================= */

const loader =
    new GLTFLoader();



async function loadModel(url) {


    loading.classList.remove(
        "hidden"
    );


    loading.textContent =
        "Загрузка 3D модели...";


    /*
        Удаляем предыдущую модель.
    */

    while (
        modelRoot.children.length
    ) {

        const old =
            modelRoot.children[0];


        modelRoot.remove(
            old
        );


        old.traverse(
            object => {

                if (
                    object.geometry
                ) {

                    object.geometry.dispose();

                }


                if (
                    object.material
                ) {

                    if (
                        Array.isArray(
                            object.material
                        )
                    ) {

                        object.material.forEach(
                            material => {

                                material.dispose();

                            }
                        );

                    } else {

                        object.material.dispose();

                    }

                }

            }
        );

    }


    model = null;


    console.log(
        "Начинаем загрузку:",
        url
    );


    try {


        const gltf =
            await new Promise(
                (resolve, reject) => {


                    loader.load(

                        url,


                        /* SUCCESS */

                        result => {

                            resolve(
                                result
                            );

                        },


                        /* PROGRESS */

                        progress => {

                            if (
                                progress.total
                            ) {

                                const percent =
                                    Math.round(

                                        progress.loaded /
                                        progress.total *
                                        100

                                    );


                                loading.textContent =
                                    "Загрузка 3D модели... " +
                                    percent +
                                    "%";

                            } else {

                                const mb =
                                    (
                                        progress.loaded /
                                        1024 /
                                        1024
                                    ).toFixed(1);


                                loading.textContent =
                                    "Загрузка 3D модели... " +
                                    mb +
                                    " MB";

                            }

                        },


                        /* ERROR */

                        error => {

                            console.error(
                                "Ошибка GLB:",
                                error
                            );

                            reject(
                                error
                            );

                        }

                    );

                }
            );


        /* =================================================
           МОДЕЛЬ ПОЛУЧЕНА
        ================================================= */

        model =
            gltf.scene;


        /*
            Находим размеры модели.
        */

        const box =
            new THREE.Box3()
                .setFromObject(
                    model
                );


        const center =
            new THREE.Vector3();


        const size =
            new THREE.Vector3();


        box.getCenter(
            center
        );


        box.getSize(
            size
        );


        /*
            Перемещаем геометрический
            центр модели в 0,0,0.
        */

        model.position.x =
            -center.x;

        model.position.y =
            -center.y;

        model.position.z =
            -center.z;


        /*
            Рассчитываем размер.
        */

        const maxSize =
            Math.max(

                size.x,
                size.y,
                size.z

            );


        if (
            maxSize > 0
        ) {

            const targetSize =
                2.0;


            const scale =
                targetSize /
                maxSize;


            model.scale.setScalar(
                scale
            );

        }


        /*
            Модель добавляется
            в центральную группу.
        */

        modelRoot.add(
            model
        );


        /*
            Группа остаётся:

            X = 0
            Y = 0
            Z = 0
        */

        modelRoot.position.set(
            0,
            0,
            0
        );


        /*
            Сбрасываем вращение.
        */

        modelRoot.rotation.set(
            0,
            0,
            0
        );


        /*
            Начальная камера.
        */

        camera.position.set(
            0,
            0,
            3
        );


        camera.lookAt(
            0,
            0,
            0
        );


        loading.classList.add(
            "hidden"
        );


        console.log(
            "creature.glb успешно загружен"
        );


    } catch (error) {


        console.error(
            error
        );


        loading.textContent =
            "Не удалось загрузить creature.glb";


        setTimeout(
            () => {

                loading.classList.add(
                    "hidden"
                );

            },
            4000
        );

    }

}



/* =================================================
   КНОПКИ МОДЕЛЕЙ
================================================= */

document
    .querySelectorAll(
        ".model-button"
    )
    .forEach(
        button => {


            button.addEventListener(
                "click",
                async () => {


                    const url =
                        button.dataset.model;


                    showScreen(
                        viewerScreen
                    );


                    await loadModel(
                        url
                    );


                    /*
                        После загрузки
                        запускаем ориентацию.
                    */

                    startOrientation();

                }
            );

        }
    );



/* =================================================
   ORIENTATION
================================================= */

let orientationActive =
    false;


/*
    Quaternion устройства.
*/

const deviceQuaternion =
    new THREE.Quaternion();


/*
    Начальная ориентация.

    Нужна, чтобы модель не прыгала
    в момент включения сенсора.
*/

let initialQuaternion = null;


/*
    Текущая ориентация камеры.
*/

const targetQuaternion =
    new THREE.Quaternion();


const smoothQuaternion =
    new THREE.Quaternion();



/* =================================================
   TELEGRAM DEVICE ORIENTATION
================================================= */

function startTelegramOrientation() {


    if (
        !tg ||
        !tg.DeviceOrientation
    ) {

        return false;

    }


    try {


        /*
            Подписываемся на изменения.
        */

        tg.onEvent(

            "deviceOrientationChanged",

            handleTelegramOrientation

        );


        tg.onEvent(

            "deviceOrientationFailed",

            () => {

                showSensor(
                    "Telegram не предоставил доступ к датчикам"
                );

            }

        );


        /*
            Включаем датчик.
        */

        tg.DeviceOrientation.start(

            {
                refresh_rate: 20,
                need_absolute: false
            },

            started => {


                if (
                    started
                ) {

                    orientationActive =
                        true;


                    hideSensor();


                    console.log(
                        "Telegram DeviceOrientation: ON"
                    );


                } else {

                    showSensor(
                        "Не удалось включить датчики"
                    );

                }

            }

        );


        return true;


    } catch (error) {


        console.error(
            error
        );


        return false;

    }

}



/* =================================================
   TELEGRAM ORIENTATION DATA
================================================= */

function handleTelegramOrientation() {


    if (
        !tg ||
        !tg.DeviceOrientation
    ) {

        return;

    }


    /*
        Telegram:

        alpha
        beta
        gamma

        в радианах.
    */

    const alpha =
        tg.DeviceOrientation.alpha || 0;


    const beta =
        tg.DeviceOrientation.beta || 0;


    const gamma =
        tg.DeviceOrientation.gamma || 0;


    /*
        Euler телефона.
    */

    const euler =
        new THREE.Euler(

            beta,

            alpha,

            -gamma,

            "YXZ"

        );


    deviceQuaternion
        .setFromEuler(
            euler
        );


    /*
        Первое положение телефона
        принимаем за нулевое.
    */

    if (
        initialQuaternion === null
    ) {

        initialQuaternion =
            deviceQuaternion.clone();

    }


    /*
        Получаем относительное вращение.
    */

    const inverseInitial =
        initialQuaternion
            .clone()
            .invert();


    targetQuaternion
        .copy(
            inverseInitial
        )
        .multiply(
            deviceQuaternion
        );

}



/* =================================================
   BROWSER FALLBACK
================================================= */

function startBrowserOrientation() {


    if (
        !window.DeviceOrientationEvent
    ) {

        return false;

    }


    /*
        iPhone/iPad требуют
        отдельного разрешения.
    */

    if (
        typeof DeviceOrientationEvent
            .requestPermission ===
        "function"
    ) {


        DeviceOrientationEvent
            .requestPermission()

            .then(
                permission => {


                    if (
                        permission ===
                        "granted"
                    ) {


                        window.addEventListener(

                            "deviceorientation",

                            handleBrowserOrientation,

                            true

                        );


                        orientationActive =
                            true;


                        hideSensor();


                    } else {


                        showSensor(
                            "Доступ к датчикам запрещён"
                        );

                    }

                }
            )

            .catch(
                error => {

                    console.error(
                        error
                    );

                    showSensor(
                        "Ошибка доступа к датчикам"
                    );

                }
            );


    } else {


        window.addEventListener(

            "deviceorientation",

            handleBrowserOrientation,

            true

        );


        orientationActive =
            true;


        hideSensor();

    }


    return true;

}



/* =================================================
   BROWSER ORIENTATION DATA
================================================= */

function handleBrowserOrientation(
    event
) {


    /*
        Browser API использует градусы.

        Переводим в радианы.
    */

    const alpha =
        THREE.MathUtils.degToRad(
            event.alpha || 0
        );


    const beta =
        THREE.MathUtils.degToRad(
            event.beta || 0
        );


    const gamma =
        THREE.MathUtils.degToRad(
            event.gamma || 0
        );


    const euler =
        new THREE.Euler(

            beta,

            alpha,

            -gamma,

            "YXZ"

        );


    deviceQuaternion
        .setFromEuler(
            euler
        );


    if (
        initialQuaternion === null
    ) {

        initialQuaternion =
            deviceQuaternion.clone();

    }


    targetQuaternion
        .copy(
            initialQuaternion
                .clone()
                .invert()
        )
        .multiply(
            deviceQuaternion
        );

}



/* =================================================
   START ORIENTATION
================================================= */

function startOrientation() {


    orientationActive =
        false;


    initialQuaternion =
        null;


    /*
        Сначала Telegram API.
    */

    if (
        startTelegramOrientation()
    ) {

        showSensor(
            "Подключение датчиков телефона..."
        );

        return;

    }


    /*
        Затем стандартный Browser API.
    */

    if (
        startBrowserOrientation()
    ) {

        showSensor(
            "Подключение датчиков телефона..."
        );

        return;

    }


    showSensor(
        "Устройство не поддерживает датчик ориентации"
    );

}



/* =================================================
   STOP ORIENTATION
================================================= */

function stopOrientation() {


    orientationActive =
        false;


    initialQuaternion =
        null;


    /*
        Telegram
    */

    if (
        tg
    ) {

        try {

            if (
                tg.DeviceOrientation
            ) {

                tg.DeviceOrientation.stop();

            }


            tg.offEvent(

                "deviceOrientationChanged",

                handleTelegramOrientation

            );

        } catch (error) {

            console.log(
                error
            );

        }

    }


    /*
        Browser
    */

    window.removeEventListener(

        "deviceorientation",

        handleBrowserOrientation,

        true

    );

}



/* =================================================
   SENSOR UI
================================================= */

function showSensor(
    text
) {

    sensorStatus.textContent =
        text;

    sensorStatus.classList.remove(
        "hidden"
    );

}


function hideSensor() {

    sensorStatus.classList.add(
        "hidden"
    );

}



/* =================================================
   SENSOR BUTTON
================================================= */

document
    .getElementById(
        "sensorButton"
    )
    .onclick = () => {

        startOrientation();

    };



/* =================================================
   КАМЕРА ВОКРУГ МОДЕЛИ
================================================= */

function updateCamera() {


    if (
        !orientationActive
    ) {

        return;

    }


    /*
        Плавное вращение.
    */

    smoothQuaternion.slerp(

        targetQuaternion,

        0.15

    );


    /*
        Направление камеры
        относительно центра.
    */

    const direction =
        new THREE.Vector3(
            0,
            0,
            1
        );


    direction.applyQuaternion(
        smoothQuaternion
    );


    /*
        Фиксированное расстояние
        от модели.
    */

    camera.position.copy(
        direction
            .multiplyScalar(
                3
            )
    );


    /*
        Камера смотрит строго
        в центр модели.
    */

    camera.lookAt(
        0,
        0,
        0
    );

}



/* =================================================
   RENDER LOOP
================================================= */

function animate() {


    requestAnimationFrame(
        animate
    );


    updateCamera();


    renderer.render(
        scene,
        camera
    );

}



/* =================================================
   RESIZE
================================================= */

function resize() {


    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );

}



/* =================================================
   VISIBILITY
================================================= */

document.addEventListener(

    "visibilitychange",

    () => {


        if (
            document.hidden
        ) {

            stopOrientation();

        }

    }

);

</script>
