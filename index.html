<html lang="ru">

    <meta charset="UTF-8">

        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>AR Gallery</title>

    <!-- TON CONNECT -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

    <style>

        }

            inset: 0;

            height: 100%;

            height: 60px;

        }

            width: 100%;

            color: #000;

            font-size: 16px;
            font-weight: 600;
        }

        .sendButton:disabled {
            opacity: .35;

        }

        .generationStatus {
            min-height: 20px;

            margin-top: 14px;

            font-size: 13px;

<script type="importmap">

<script type="module">

import * as THREE from "three";

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";

import {
    OrbitControls
} from "three/addons/controls/OrbitControls.js";


/* =============================================================
   CONFIGURATION
============================================================= */

const TON_MANIFEST =
    "https://roman22022000.github.io/Ton_site/tonconnect-manifest.json";

const REQUIRED_COLLECTION =
    "EQD9mm3hx-QvHYNG18gDaaJtSTTQTVVYVj6zhonXocj2eyI";

const REQUIRED_COLLECTION_RAW =
    "0:fd9a6de1c7e42f1d8346d7c80369a26d4934d04d5558563eb38689d7a1c8f6";

const GENERATION_API =
    "https://api.araicameragame.party/api/generation";

const MODEL_BASE =
    "https://raw.githubusercontent.com/" +
    "Roman22022000/ArGameCam/main/models/";


/* =============================================================
   TELEGRAM
============================================================= */

const tg =
    window.Telegram?.WebApp || null;

if (tg) {

    tg.ready();
    tg.expand();

    if (tg.setHeaderColor) {
        tg.setHeaderColor("#000000");
    }

    if (tg.setBackgroundColor) {
        tg.setBackgroundColor("#000000");
    }
}


/* =============================================================
   DOM
============================================================= */

const authScreen =
    document.getElementById("authScreen");

const homeScreen =
    document.getElementById("homeScreen");

const galleryScreen =
    document.getElementById("galleryScreen");

const viewerScreen =
    document.getElementById("viewerScreen");

const generationScreen =
    document.getElementById("generationScreen");

const authStatus =
    document.getElementById("authStatus");

const walletInfo =
    document.getElementById("walletInfo");

const galleryGrid =
    document.getElementById("galleryGrid");

const viewerCanvas =
    document.getElementById("viewerCanvas");

const viewerNumber =
    document.getElementById("viewerNumber");

const generationCode =
    document.getElementById("generationCode");

const generationSubmit =
    document.getElementById("generationSubmit");

const generationStatus =
    document.getElementById("generationStatus");

const loadingOverlay =
    document.getElementById("loadingOverlay");


/* =============================================================
   SCREEN SYSTEM
============================================================= */

function showScreen(screen) {

    document
        .querySelectorAll(".screen")
        .forEach(
            element => {
                element.classList.remove("active");
            }
        );

    screen.classList.add("active");
}


/* =============================================================
   TON CONNECT
============================================================= */

const tonConnectUI =
    new TON_CONNECT_UI.TonConnectUI({

        manifestUrl: TON_MANIFEST,

        buttonRootId: "ton-connect"

    });


/* =============================================================
   TON ADDRESS NORMALIZATION
============================================================= */

/*
    TON user-friendly address:

        EQ...
        UQ...

    API может вернуть:

        0:abcdef...

    Поэтому перед сравнением
    переводим адрес в raw-формат.
*/

function base64UrlToBytes(value) {

    let normalized =
        value
            .replace(/-/g, "+")
            .replace(/_/g, "/");

    while (normalized.length % 4 !== 0) {
        normalized += "=";
    }

    const binary =
        atob(normalized);

    const bytes =
        new Uint8Array(binary.length);

    for (
        let i = 0;
        i < binary.length;
        i++
    ) {
        bytes[i] =
            binary.charCodeAt(i);
    }

    return bytes;
}


function normalizeTonAddress(address) {

    if (!address) {
        return "";
    }

    address =
        String(address).trim();

    /*
        Уже raw TON address.
    */

    if (
        /^-?\d+:[0-9a-fA-F]{64}$/
            .test(address)
    ) {

        const parts =
            address.split(":");

        return (
            parts[0] +
            ":" +
            parts[1].toLowerCase()
        );
    }


    /*
        User-friendly TON address.
    */

    try {

        const bytes =
            base64UrlToBytes(address);

        if (bytes.length !== 36) {
            return address.toLowerCase();
        }

        let workchain =
            bytes[1];

        /*
            Workchain byte 0xff означает -1.
        */

        if (workchain === 255) {
            workchain = -1;
        }

        let hash = "";

        for (
            let i = 2;
            i < 34;
            i++
        ) {

            hash +=
                bytes[i]
                    .toString(16)
                    .padStart(2, "0");
        }

        return (
            workchain +
            ":" +
            hash.toLowerCase()
        );

    } catch {

        return address.toLowerCase();
    }
}


const normalizedCollection =
    normalizeTonAddress(
        REQUIRED_COLLECTION
    );


console.log(
    "Required collection:",
    REQUIRED_COLLECTION
);

console.log(
    "Normalized collection:",
    normalizedCollection
);


/* =============================================================
   NFT CHECK
============================================================= */

async function checkCollectionNFT(walletAddress) {

    const normalizedWallet =
        normalizeTonAddress(walletAddress);

    console.log(
        "Checking wallet:",
        walletAddress
    );

    console.log(
        "Normalized wallet:",
        normalizedWallet
    );

    /*
        Получаем NFT кошелька.

        Далее проверяем именно collection address.
        Никакого Getgems.
    */

    const url =
        "https://tonapi.io/v2/accounts/" +
        encodeURIComponent(walletAddress) +
        "/nfts?limit=1000";


    const response =
        await fetch(url);


    if (!response.ok) {

        throw new Error(
            "TON API: HTTP " +
            response.status
        );
    }


    const data =
        await response.json();


    const nftItems =
        Array.isArray(data.nft_items)
            ? data.nft_items
            : [];


    console.log(
        "Wallet NFT count:",
        nftItems.length
    );


    for (
        const nft of nftItems
    ) {

        const collectionAddress =
            nft.collection?.address ||
            nft.collection_address ||
            "";


        const normalizedNFTCollection =
            normalizeTonAddress(
                collectionAddress
            );


        console.log(
            "NFT collection:",
            collectionAddress
        );

        console.log(
            "Normalized:",
            normalizedNFTCollection
        );


        if (
            normalizedNFTCollection ===
            normalizedCollection
        ) {

            console.log(
                "NFT FROM REQUIRED COLLECTION FOUND"
            );

            return true;
        }
    }


    return false;
}


/* =============================================================
   AUTHENTICATION
============================================================= */

let currentWallet = null;

let accessGranted = false;


async function processWallet(wallet) {

    if (!wallet) {

        currentWallet = null;
        accessGranted = false;

        showScreen(authScreen);

        authStatus.textContent =
            "Подключите кошелёк";

        return;
    }


    currentWallet =
        wallet.account.address;


    authStatus.textContent =
        "Проверка NFT...";


    loadingOverlay.classList.add(
        "active"
    );


    try {

        const hasNFT =
            await checkCollectionNFT(
                currentWallet
            );


        if (!hasNFT) {

            accessGranted = false;

            showScreen(authScreen);

            authStatus.textContent =
                "NFT из нужной коллекции не найден";

            return;
        }


        /*
            NFT найден.
            Открываем основную панель.
        */

        accessGranted = true;


        walletInfo.textContent =
            "Доступ подтверждён · " +
            currentWallet;


        showScreen(homeScreen);


    } catch (error) {

        console.error(
            "NFT check error:",
            error
        );


        accessGranted = false;

        showScreen(authScreen);

        authStatus.textContent =
            "Не удалось проверить NFT";

    } finally {

        loadingOverlay.classList.remove(
            "active"
        );
    }
}


/*
    TON Connect вызывает этот обработчик
    после подключения, отключения и восстановления
    существующей сессии.
*/

tonConnectUI.onStatusChange(
    async wallet => {

        await processWallet(wallet);

    }
);


/* =============================================================
   ACCESS PROTECTION
============================================================= */

function requireAccess() {

    if (!accessGranted) {

        showScreen(authScreen);

        authStatus.textContent =
            "Сначала подключите кошелёк";

        return false;
    }

    return true;
}


/* =============================================================
   HOME
============================================================= */

document
    .getElementById("openGallery")
    .addEventListener(
        "click",
        () => {

            if (!requireAccess()) {
                return;
            }

            showScreen(
                galleryScreen
            );

        }
    );


document
    .getElementById("openGeneration")
    .addEventListener(
        "click",
        () => {

            if (!requireAccess()) {
                return;
            }

            generationCode.value = "";

            generationStatus.textContent = "";

            generationSubmit.disabled =
                true;

            showScreen(
                generationScreen
            );

            setTimeout(
                () => {
                    generationCode.focus();
                },
                100
            );

        }
    );


/* =============================================================
   GENERATION INPUT
============================================================= */

generationCode.addEventListener(
    "input",
    () => {

        generationCode.value =
            generationCode.value
                .replace(/\D/g, "")
                .slice(0, 5);


        generationSubmit.disabled =
            generationCode.value.length !== 5;

    }
);


/* =============================================================
   SEND GENERATION DATA
============================================================= */

generationSubmit.addEventListener(
    "click",
    async () => {

        if (!requireAccess()) {
            return;
        }


        const code =
            generationCode.value.trim();


        if (!/^\d{5}$/.test(code)) {

            generationStatus.textContent =
                "Введите 5 цифр";

            return;
        }


        if (!currentWallet) {

            generationStatus.textContent =
                "Кошелёк не подключён";

            return;
        }


        generationSubmit.disabled =
            true;


        generationStatus.textContent =
            "Отправка...";


        try {

            /*
                Именно эти данные отправляются
                на твой API:

                    code
                    wallet
            */

            const response =
                await fetch(
                    GENERATION_API,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                code: code,

                                wallet:
                                    currentWallet

                            })
                    }
                );


            let data = null;

            try {

                data =
                    await response.json();

            } catch {

                data = null;
            }


            if (
                !response.ok ||
                !data?.success
            ) {

                throw new Error(
                    data?.error ||
                    "Ошибка сервера"
                );
            }


            generationStatus.textContent =
                "Данные отправлены";


            generationCode.value = "";


        } catch (error) {

            console.error(
                "Generation error:",
                error
            );


            generationStatus.textContent =
                "Не удалось отправить данные";

        } finally {

            generationSubmit.disabled =
                true;
        }

    }
);

/* =============================================================
   THREE.JS VIEWER
============================================================= */

let scene = null;

let camera = null;

let renderer = null;

let controls = null;

let model = null;

let animationFrame = null;


const loader =
    new GLTFLoader();


function initViewer() {

    if (renderer) {
        return;
    }


    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(0x000000);


    camera =
        new THREE.PerspectiveCamera(
            45,
            window.innerWidth /
            window.innerHeight,
            0.01,
            1000
        );


    camera.position.set(
        0,
        0.35,
        3
    );


    renderer =
        new THREE.WebGLRenderer({
            antialias: true,
            alpha: false
        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    viewerCanvas.appendChild(
        renderer.domElement
    );


    controls =
        new OrbitControls(
            camera,
            renderer.domElement
        );


    controls.enableDamping =
        true;


    controls.enablePan =
        true;


    controls.minDistance =
        0.5;


    controls.maxDistance =
        20;


    const ambient =
        new THREE.AmbientLight(
            0xffffff,
            2.2
        );


    scene.add(
        ambient
    );


    const keyLight =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );


    keyLight.position.set(
        4,
        5,
        4
    );


    scene.add(
        keyLight
    );


    const fillLight =
        new THREE.DirectionalLight(
            0xffffff,
            1.5
        );


    fillLight.position.set(
        -4,
        2,
        -3
    );


    scene.add(
        fillLight
    );


    window.addEventListener(
        "resize",
        resizeViewer
    );


    animateViewer();
}


function resizeViewer() {

    if (
        !camera ||
        !renderer
    ) {
        return;
    }


    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}


function animateViewer() {

    animationFrame =
        requestAnimationFrame(
            animateViewer
        );


    if (controls) {
        controls.update();
    }


    if (
        renderer &&
        scene &&
        camera
    ) {

        renderer.render(
            scene,
            camera
        );

    }
}


/* =============================================================
   OPEN MODEL
============================================================= */

function openViewer(index) {

    if (!requireAccess()) {
        return;
    }


    const item =
        galleryItems[index];


    if (!item) {
        return;
    }


    viewerNumber.textContent =
        item.number;


    showScreen(
        viewerScreen
    );


    initViewer();


    if (model) {

        scene.remove(
            model
        );

        model.traverse(
            object => {

                if (object.geometry) {

                    object.geometry.dispose();

                }


                if (
                    object.material
                ) {

                    if (
                        Array.isArray(
                            object.material
                        )
                    ) {

                        object.material
                            .forEach(
                                material =>
                                    material.dispose()
                            );

                    } else {

                        object.material.dispose();

                    }

                }

            }
        );

        model = null;
    }


    const url =
        MODEL_BASE +
        encodeURIComponent(
            item.filename
        );


    loader.load(

        url,

        gltf => {

            model =
                gltf.scene;


            /*
                Автоматически помещаем
                модель в центр.
            */

            const box =
                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            const center =
                box.getCenter(
                    new THREE.Vector3()
                );


            const size =
                box.getSize(
                    new THREE.Vector3()
                );


            model.position.sub(
                center
            );


            const maxSize =
                Math.max(
                    size.x,
                    size.y,
                    size.z
                );


            if (maxSize > 0) {

                const scale =
                    2 / maxSize;

                model.scale.setScalar(
                    scale
                );

            }


            scene.add(
                model
            );


            controls.target.set(
                0,
                0,
                0
            );


            controls.update();

        },

        undefined,

        error => {

            console.error(
                "Model loading error:",
                error
            );

        }

    );
}
