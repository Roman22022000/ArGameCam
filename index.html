<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 maximum-scale=1,
                 user-scalable=no,
                 viewport-fit=cover"
    >

    <meta name="theme-color" content="#000000">

    <title>AR Space</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- START SCREEN -->

    <main id="startScreen">

        <section class="startBox">

            <div class="logo">
                AR
            </div>

            <h1>AR SPACE</h1>

            <p>
                Дополненная реальность
            </p>

            <button id="startButton">
                ЗАПУСК КАМЕРЫ
            </button>

            <div id="status">
                Готово к запуску
            </div>

        </section>

    </main>


    <!-- AR UI -->

    <div id="arUI">

        <button
            id="exitButton"
            class="exitButton"
        >
            ×
        </button>


        <div
            id="message"
            class="message"
        >
            Наведите камеру на поверхность
        </div>


        <button
            id="placeButton"
            class="placeButton"
        >
            РАЗМЕСТИТЬ ОБЪЕКТ
        </button>

    </div>


    <!-- ERROR -->

    <div
        id="errorScreen"
        class="hidden"
    >

        <div class="errorBox">

            <h2>AR недоступен</h2>

            <p id="errorText"></p>

            <button id="backButton">
                НАЗАД
            </button>

        </div>

    </div>


    <script type="module" src="./app.js"></script>

</body>
</html>
