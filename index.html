<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1,
            maximum-scale=1,
            user-scalable=no,
            viewport-fit=cover
        "
    >

    <meta name="theme-color" content="#000000">

    <title>AR Space</title>

    <link rel="stylesheet" href="./style.css">

</head>

<body>

    <!-- START -->

    <div id="startScreen">

        <div class="start">

            <div class="logo">AR</div>

            <h1>AR SPACE</h1>

            <p>
                Дополненная реальность
            </p>

            <button id="startAR">
                ЗАПУСК КАМЕРЫ
            </button>

            <div id="status">
                Нажмите кнопку для запуска
            </div>

        </div>

    </div>


    <!-- AR -->

    <div id="arUI">

        <button id="exitAR">
            ×
        </button>

        <div id="message">
            Наведите камеру на поверхность
        </div>

        <button id="placeAR">
            РАЗМЕСТИТЬ ОБЪЕКТ
        </button>

    </div>


    <!-- SENSOR DEBUG -->

    <div id="sensorPanel">

        <div>
            ORIENTATION
        </div>

        <div id="orientation">
            α: 0<br>
            β: 0<br>
            γ: 0
        </div>

        <div>
            GYROSCOPE
        </div>

        <div id="gyro">
            X: 0<br>
            Y: 0<br>
            Z: 0
        </div>

        <div>
            ACCELEROMETER
        </div>

        <div id="accel">
            X: 0<br>
            Y: 0<br>
            Z: 0
        </div>

        <div>
            GPS
        </div>

        <div id="gps">
            unavailable
        </div>

    </div>


    <script
        src="https://telegram.org/js/telegram-web-app.js">
    </script>

    <script type="module" src="./app.js"></script>

</body>

</html>
