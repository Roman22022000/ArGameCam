<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>AR Camera Test</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    font-family: Arial, sans-serif;
}

#app {

    width: 100%;
    height: 100%;

    position: relative;

    background: #111;
}


/* CAMERA */

#camera {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    background: #000;

    display: none;
}


/* START */

#start {

    position: absolute;

    inset: 0;

    z-index: 10;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    padding: 25px;

    background: #111820;

    color: white;

    text-align: center;
}

#start h1 {

    font-size: 40px;

    margin-bottom: 15px;
}

#start p {

    max-width: 350px;

    line-height: 1.5;

    opacity: .7;

    margin-bottom: 30px;
}


#cameraButton {

    width: 240px;

    height: 55px;

    border: 0;

    border-radius: 16px;

    background: white;

    color: black;

    font-size: 18px;

    font-weight: bold;
}


/* STATUS */

#status {

    position: absolute;

    left: 50%;

    bottom: 30px;

    transform: translateX(-50%);

    width: calc(100% - 40px);

    padding: 14px;

    border-radius: 14px;

    background: rgba(0,0,0,.75);

    color: white;

    text-align: center;

    z-index: 20;

}


/* CLOSE */

#close {

    position: absolute;

    top: 20px;

    right: 20px;

    z-index: 30;

    display: none;

    padding: 12px 16px;

    border: 0;

    border-radius: 12px;

    background: rgba(0,0,0,.7);

    color: white;
}

</style>

</head>


<body>


<div id="app">


    <video
        id="camera"
        autoplay
        playsinline
        muted>
    </video>


    <section id="start">

        <h1>AR CAMERA</h1>

        <p>

            Камера должна открыться
            непосредственно внутри
            Telegram Mini App.

        </p>


        <button
            id="cameraButton">

            Включить камеру

        </button>

    </section>


    <button id="close">

        Закрыть камеру

    </button>


    <div id="status">

        Нажмите «Включить камеру»

    </div>


</div>


<script>


/* =====================================
   TELEGRAM
===================================== */

const tg =
    window.Telegram?.WebApp;


if (tg) {

    tg.ready();

    tg.expand();

}


/* =====================================
   ELEMENTS
===================================== */

const button =
    document.getElementById(
        "cameraButton"
    );


const video =
    document.getElementById(
        "camera"
    );


const start =
    document.getElementById(
        "start"
    );


const status =
    document.getElementById(
        "status"
    );


const closeButton =
    document.getElementById(
        "close"
    );


/* =====================================
   STATUS
===================================== */

function setStatus(text) {

    status.textContent =
        text;

}


/* =====================================
   CAMERA
===================================== */

async function openCamera() {

    setStatus(
        "Запрашиваем доступ к камере..."
    );


    console.log(
        "Telegram:",
        !!tg
    );


    console.log(
        "Platform:",
        tg?.platform
    );


    console.log(
        "MediaDevices:",
        !!navigator.mediaDevices
    );


    console.log(
        "getUserMedia:",
        !!navigator.mediaDevices
            ?.getUserMedia
    );


    try {

        if (
            !navigator.mediaDevices
        ) {

            throw new Error(
                "navigator.mediaDevices отсутствует"
            );

        }


        if (
            !navigator.mediaDevices
                .getUserMedia
        ) {

            throw new Error(
                "getUserMedia отсутствует"
            );

        }


        /*
         * Запрашиваем только камеру.
         *
         * Никакого microphone.
         */

        const stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal:
                                "environment"
                        },

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        }

                    },

                    audio: false

                });


        console.log(
            "STREAM:",
            stream
        );


        video.srcObject =
            stream;


        await video.play();


        /*
         * Показываем камеру
         */

        video.style.display =
            "block";


        start.style.display =
            "none";


        closeButton.style.display =
            "block";


        setStatus(
            "КАМЕРА РАБОТАЕТ"
        );


    }
    catch (error) {

        console.error(
            "CAMERA ERROR:",
            error
        );


        setStatus(
            "Ошибка: " +
            error.name +
            " — " +
            error.message
        );

    }

}


/* =====================================
   BUTTON
===================================== */

button.addEventListener(
    "click",
    openCamera
);


/* =====================================
   CLOSE
===================================== */

closeButton.addEventListener(
    "click",
    () => {

        const stream =
            video.srcObject;


        if (stream) {

            stream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }


        video.srcObject =
            null;


        video.style.display =
            "none";


        closeButton.style.display =
            "none";


        start.style.display =
            "flex";


        setStatus(
            "Нажмите «Включить камеру»"
        );

    }
);

</script>


</body>

</html>
