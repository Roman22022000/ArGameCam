        /*
         * FUNCTION: roomNumber
         *
         * Получает номер комнаты.
         */
        function roomNumber(
            item,
            i
        ) {

            return (
                item?.number ??
                (
                    item?.name
                        ? String(item.name)
                            .replace(/\D/g, "") ||
                            i + 1
                        : i + 1
                )
            );
        }


        /*
         * FUNCTION: roomName
         *
         * Получает имя комнаты.
         */
        function roomName(
            item,
            i
        ) {

            return String(
                item?.name ||
                item?.folder ||
                item?.title ||
                "room_" +
                roomNumber(item, i)
            );
        }


        /*
         * FUNCTION: fileUrl
         *
         * Создаёт URL файла комнаты.
         */
        function fileUrl(
            folder,
            file
        ) {

            if (!file) {
                return "";
            }


            if (
                /^https?:\/\//i.test(
                    String(file)
                ) ||
                String(file)
                    .startsWith("data:")
            ) {

                return String(file);
            }


            return (
                `${ROOMS_API}/file/` +
                `${encodeURIComponent(folder)}/` +
                `${encodeURIComponent(file)}`
            );
        }


        /*
         * FUNCTION: resolveTextures
         *
         * Определяет URL шести текстур комнаты.
         */
        function resolveTextures(
            item
        ) {

            const folder =
                String(
                    item?.folder ||
                    item?.name ||
                    ""
                ).trim();


            const names = {

                back:
                    "01_BACKGROUND.png",

                left:
                    "02_LEFT.png",

                right:
                    "03_RIGHT.png",

                front:
                    "04_FRONT.png",

                ceiling:
                    "05_SKY.png",

                floor:
                    "06_GROUND.png"
            };


            const out = {};


            for (
                const [k, n]
                of Object.entries(names)
            ) {

                out[k] =
                    fileUrl(
                        folder,
                        n
                    );
            }


            const t =
                item?.textures;


            if (
                t &&
                typeof t === "object"
            ) {

                const map = {

                    back:
                        t.background ||
                        t.back ||
                        t.rear,

                    left:
                        t.left,

                    right:
                        t.right,

                    front:
                        t.front ||
                        t.forward,

                    ceiling:
                        t.sky ||
                        t.ceiling ||
                        t.top,

                    floor:
                        t.ground ||
                        t.floor ||
                        t.bottom
                };


                for (
                    const [k, v]
                    of Object.entries(map)
                ) {

                    const u =
                        typeof v === "string"
                            ? v
                            : v?.url ||
                              v?.file_url ||
                              v?.download_url;


                    if (u) {

                        out[k] =
                            fileUrl(
                                folder,
                                u
                            );
                    }
                }
            }


            return out;
        }


        /* ============================================================
           ROOM RESPONSE PARSER
           ============================================================ */

        /*
         * FUNCTION: findRoomArray
         *
         * Назначение:
         * Ищет массив комнат внутри ответа API.
         *
         * Поддерживаемые варианты:
         *
         * [
         *     {...},
         *     {...}
         * ]
         *
         * {
         *     rooms: [...]
         * }
         *
         * {
         *     items: [...]
         * }
         *
         * {
         *     data: [...]
         * }
         *
         * {
         *     folders: [...]
         * }
         *
         * и вложенные варианты.
         *
         * Это основное исправление проблемы,
         * когда API работает, но возвращает не прямой массив.
         */
        function findRoomArray(
            value,
            depth = 0
        ) {

            /*
             * Защита от слишком глубокой рекурсии.
             */
            if (depth > 6) {
                return null;
            }


            /*
             * Если сам ответ уже массив,
             * считаем его списком комнат.
             */
            if (Array.isArray(value)) {

                return value;
            }


            /*
             * Если ответ не объект,
             * массив внутри него найти нельзя.
             */
            if (
                !value ||
                typeof value !== "object"
            ) {

                return null;
            }


            /*
             * Наиболее вероятные названия полей.
             */
            const preferredKeys = [

                "rooms",
                "items",
                "data",
                "folders",
                "directories",
                "directories_list",
                "room_list",
                "roomList",
                "results",
                "entries"
            ];


            /*
             * Сначала проверяем наиболее вероятные поля.
             */
            for (
                const key
                of preferredKeys
            ) {

                if (
                    Object.prototype
                        .hasOwnProperty
                        .call(value, key)
                ) {

                    const candidate =
                        value[key];


                    if (
                        Array.isArray(candidate)
                    ) {

                        return candidate;
                    }


                    const nested =
                        findRoomArray(
                            candidate,
                            depth + 1
                        );


                    if (nested) {
                        return nested;
                    }
                }
            }


            /*
             * Если стандартные поля не нашли,
             * просматриваем остальные поля объекта.
             */
            for (
                const [key, candidate]
                of Object.entries(value)
            ) {

                if (
                    preferredKeys.includes(key)
                ) {

                    continue;
                }


                if (
                    Array.isArray(candidate)
                ) {

                    /*
                     * Массив объектов считаем
                     * потенциальным списком комнат.
                     */
                    if (
                        candidate.length === 0 ||
                        candidate.every(
                            item =>
                                item &&
                                typeof item === "object"
                        )
                    ) {

                        return candidate;
                    }
                }


                if (
                    candidate &&
                    typeof candidate === "object"
                ) {

                    const nested =
                        findRoomArray(
                            candidate,
                            depth + 1
                        );


                    if (nested) {
                        return nested;
                    }
                }
            }


            return null;
        }


        /*
         * FUNCTION: normalizeRoomItem
         *
         * Назначение:
         * Приводит разные форматы ответа сервера
         * к единому объекту комнаты.
         */
        function normalizeRoomItem(
            item,
            index
        ) {

            /*
             * Если сервер вернул строку,
             * считаем её названием папки.
             */
            if (
                typeof item === "string"
            ) {

                return {

                    number:
                        index + 1,

                    name:
                        item,

                    folder:
                        item
                };
            }


            /*
             * Если сервер вернул объект,
             * сохраняем все исходные поля.
             */
            if (
                item &&
                typeof item === "object"
            ) {

                const result = {
                    ...item
                };


                /*
                 * Если есть folder,
                 * но отсутствует name,
                 * используем folder как имя.
                 */
                if (
                    !result.name &&
                    result.folder
                ) {

                    result.name =
                        result.folder;
                }


                /*
                 * Если есть path,
                 * но отсутствует folder,
                 * пытаемся использовать path.
                 */
                if (
                    !result.folder &&
                    result.path
                ) {

                    result.folder =
                        result.path;
                }


                /*
                 * Если есть directory,
                 * используем его как папку.
                 */
                if (
                    !result.folder &&
                    result.directory
                ) {

                    result.folder =
                        result.directory;
                }


                /*
                 * Если сервер использует id
                 * вместо number, сохраняем id,
                 * но номер интерфейса остаётся индексом,
                 * если number отсутствует.
                 */
                if (
                    result.number == null
                ) {

                    if (
                        result.roomNumber != null
                    ) {

                        result.number =
                            result.roomNumber;

                    } else {

                        result.number =
                            index + 1;
                    }
                }


                /*
                 * Если name отсутствует полностью,
                 * создаём имя из номера.
                 */
                if (!result.name) {

                    result.name =
                        "room_" +
                        result.number;
                }


                /*
                 * Если folder отсутствует,
                 * используем name.
                 */
                if (!result.folder) {

                    result.folder =
                        result.name;
                }


                return result;
            }


            return {

                number:
                    index + 1,

                name:
                    "room_" +
                    (index + 1),

                folder:
                    "room_" +
                    (index + 1)
            };
        }


        /*
         * FUNCTION: formatApiPreview
         *
         * Назначение:
         * Создаёт компактный текст ответа сервера,
         * чтобы при проблеме формата было видно,
         * что именно реально вернул API.
         */
        function formatApiPreview(
            data
        ) {

            try {

                const text =
                    JSON.stringify(
                        data,
                        null,
                        2
                    );


                if (
                    text.length > 1200
                ) {

                    return (
                        text.slice(
                            0,
                            1200
                        ) +
                        "\n..."
                    );
                }


                return text;

            } catch {

                return String(data);
            }
        }


        /*
         * FUNCTION: loadRooms
         *
         * НОВАЯ УСИЛЕННАЯ ВЕРСИЯ.
         *
         * Получает список комнат с PC-сервера.
         *
         * Исправления:
         *
         * 1. Не ограничивается только массивом.
         * 2. Поддерживает rooms/items/data/folders.
         * 3. Ищет массив глубже внутри JSON.
         * 4. Поддерживает строки-папки.
         * 5. Показывает реальный ответ API.
         * 6. Показывает HTTP-код.
         * 7. Показывает CORS/network ошибку.
         * 8. Использует AbortController.
         * 9. Не маскирует неизвестный формат ответом
         *    «Комнаты не найдены».
         */
        async function loadRooms() {

            roomStatusList.textContent =
                "Загрузка комнат с PC-сервера...";


            roomGrid.innerHTML =
                "";


            /*
             * Контроллер тайм-аута.
             */
            const controller =
                new AbortController();


            const timeout =
                setTimeout(
                    () => controller.abort(),
                    15000
                );


            try {

                /*
                 * Формируем URL отдельно,
                 * чтобы его было легко контролировать.
                 */
                const url =
                    `${ROOMS_API}?_=${Date.now()}`;


                console.log(
                    "[ROOM] GET:",
                    url
                );


                /*
                 * GET-запрос к PC-серверу.
                 */
                const response =
                    await fetch(
                        url,
                        {
                            method:
                                "GET",

                            cache:
                                "no-store",

                            signal:
                                controller.signal,

                            headers: {
                                Accept:
                                    "application/json"
                            },

                            /*
                             * Разрешаем cookies,
                             * если сервер работает через прокси.
                             */
                            credentials:
                                "include"
                        }
                    );


                console.log(
                    "[ROOM] HTTP:",
                    response.status,
                    response.statusText
                );


                /*
                 * Получаем текст сначала,
                 * а не сразу response.json().
                 *
                 * Это важно:
                 * если сервер вернул HTML,
                 * текст ошибки или другой формат,
                 * мы увидим его.
                 */
                const raw =
                    await response.text();


                console.log(
                    "[ROOM] RAW RESPONSE:",
                    raw
                );


                /*
                 * HTTP-ошибка.
                 */
                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}: ` +
                        `${raw.slice(0, 500)}`
                    );
                }


                /*
                 * Пустой ответ.
                 */
                if (
                    !raw.trim()
                ) {

                    roomStatusList.textContent =
                        "PC-сервер ответил пустым ответом";


                    console.warn(
                        "[ROOM] Empty response"
                    );


                    return;
                }


                /*
                 * Преобразуем JSON.
                 */
                let data;


                try {

                    data =
                        JSON.parse(raw);

                } catch (parseError) {

                    /*
                     * Сервер ответил не JSON.
                     */
                    roomStatusList.textContent =
                        "PC-сервер вернул не JSON";


                    console.error(
                        "[ROOM] JSON PARSE ERROR:",
                        parseError
                    );


                    console.error(
                        "[ROOM] SERVER RESPONSE:",
                        raw
                    );


                    return;
                }


                console.log(
                    "[ROOM] JSON:",
                    data
                );


                /*
                 * Ищем массив комнат.
                 */
                let list =
                    findRoomArray(data);


                /*
                 * Отдельный случай:
                 *
                 * API может вернуть одну комнату
                 * напрямую как объект.
                 *
                 * Например:
                 *
                 * {
                 *     "name": "room_1",
                 *     "folder": "room_1"
                 * }
                 */
                if (
                    !list &&
                    data &&
                    typeof data === "object" &&
                    !Array.isArray(data)
                ) {

                    const looksLikeRoom =
                        Boolean(
                            data.name ||
                            data.folder ||
                            data.room ||
                            data.path ||
                            data.directory
                        );


                    if (
                        looksLikeRoom
                    ) {

                        list =
                            [data];
                    }
                }


                /*
                 * Если массив не найден,
                 * НЕ показываем ложное
                 * «Комнаты не найдены».
                 *
                 * Показываем структуру ответа.
                 */
                if (!list) {

                    roomStatusList.textContent =
                        "Сервер доступен, " +
                        "но формат списка комнат " +
                        "не распознан.\n" +
                        "Ответ выведен в Console.";


                    console.error(
                        "[ROOM] UNKNOWN API FORMAT:\n" +
                        formatApiPreview(data)
                    );


                    return;
                }


                /*
                 * Нормализуем комнаты.
                 */
                rooms =
                    list
                        .map(
                            (item, index) =>
                                normalizeRoomItem(
                                    item,
                                    index
                                )
                        )
                        .filter(
                            item =>
                                item &&
                                (
                                    item.name ||
                                    item.folder
                                )
                        );


                /*
                 * Реально массив пустой.
                 */
                if (
                    rooms.length === 0
                ) {

                    roomStatusList.textContent =
                        "PC-сервер ответил успешно, " +
                        "но список комнат пуст.\n" +
                        "Проверьте папки комнат на PC-сервере.";


                    console.warn(
                        "[ROOM] Server returned empty room list:",
                        data
                    );


                    return;
                }


                /*
                 * Показываем количество.
                 */
                roomStatusList.textContent =
                    `Получено комнат: ${rooms.length}`;


                console.log(
                    "[ROOM] NORMALIZED ROOMS:",
                    rooms
                );


                /*
                 * Создаём интерфейс каждой комнаты.
                 */
                rooms.forEach(
                    (item, i) => {

                        const button =
                            document.createElement(
                                "button"
                            );


                        button.className =
                            "roomItem";


                        button.type =
                            "button";


                        /*
                         * Номер комнаты.
                         */
                        const number =
                            roomNumber(
                                item,
                                i
                            );


                        /*
                         * Имя комнаты.
                         */
                        const name =
                            roomName(
                                item,
                                i
                            );


                        button.innerHTML =
                            `
                                <div>
                                    ${number}
                                </div>

                                <small>
                                    ${name}
                                </small>
                            `;


                        /*
                         * Открытие комнаты
                         * по нажатию.
                         */
                        button.onclick =
                            () =>
                                openRoom(i);


                        roomGrid.appendChild(
                            button
                        );
                    }
                );

            } catch (e) {

                console.error(
                    "[ROOM] LOAD ERROR:",
                    e
                );


                /*
                 * Тайм-аут.
                 */
                if (
                    e.name ===
                    "AbortError"
                ) {

                    roomStatusList.textContent =
                        "Тайм-аут PC-сервера.\n" +
                        "Сервер не ответил за 15 секунд.";


                    return;
                }


                /*
                 * Ошибка сети/CORS/DNS.
                 */
                if (
                    e instanceof TypeError
                ) {

                    roomStatusList.textContent =
                        "Ошибка подключения к PC-серверу.\n" +
                        "Возможна проблема CORS, HTTPS, " +
                        "Cloudflare Tunnel или доступности API.";


                    return;
                }


                /*
                 * Остальные ошибки.
                 */
                roomStatusList.textContent =
                    "Ошибка ROOM:\n" +
                    e.message;

            } finally {

                clearTimeout(
                    timeout
                );
            }
        }


        /* ============================================================
           ROOM REQUEST / TEXTURES
           ============================================================ */

        /*
         * FUNCTION: requestRoom
         *
         * Запрашивает конкретную комнату у PC-сервера.
         */
        async function requestRoom(
            item
        ) {

            const folder =
                String(
                    item?.folder ||
                    item?.name ||
                    ""
                ).trim();


            if (!folder) {

                throw new Error(
                    "У комнаты отсутствует folder/name"
                );
            }


            console.log(
                "[ROOM] REQUEST:",
                folder
            );


            const r =
                await fetch(
                    `${ROOMS_API}/request`,
                    {
                        method:
                            "POST",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"
                        },

                        credentials:
                            "include",

                        body:
                            JSON.stringify({
                                room:
                                    folder,

                                wallet:
                                    currentWallet
                            })
                    }
                );


            const raw =
                await r.text();


            console.log(
                "[ROOM] REQUEST RESPONSE:",
                r.status,
                raw
            );


            if (!r.ok) {

                throw new Error(
                    "ROOM HTTP " +
                    r.status +
                    ": " +
                    raw.slice(0, 500)
                );
            }


            let d;


            try {

                d =
                    JSON.parse(raw);

            } catch {

                throw new Error(
                    "PC-сервер /request " +
                    "вернул не JSON"
                );
            }


            if (
                d.success === false
            ) {

                throw new Error(
                    d.error ||
                    "PC-сервер отклонил запрос"
                );
            }


            if (!d.room) {

                throw new Error(
                    "PC-сервер не вернул manifest"
                );
            }


            return {

                ...item,

                ...d.room,

                folder:
                    d.room.folder ||
                    folder,

                name:
                    d.room.name ||
                    folder
            };
        }


        /*
         * FUNCTION: loadTexture
         *
         * Загружает одну текстуру.
         */
        function loadTexture(
            url,
            label
        ) {

            return new Promise(
                (
                    resolve,
                    reject
                ) => {

                    if (!url) {

                        return reject(
                            new Error(
                                label +
                                " не задана"
                            )
                        );
                    }


                    new THREE.TextureLoader()
                        .load(

                            url,

                            texture => {

                                texture.colorSpace =
                                    THREE.SRGBColorSpace;


                                texture.wrapS =
                                    THREE.ClampToEdgeWrapping;


                                texture.wrapT =
                                    THREE.ClampToEdgeWrapping;


                                if (
                                    roomRenderer
                                ) {

                                    texture.anisotropy =
                                        Math.min(
                                            roomRenderer
                                                .capabilities
                                                .getMaxAnisotropy(),
                                            4
                                        );
                                }


                                resolve(
                                    texture
                                );
                            },

                            undefined,

                            () => {

                                reject(
                                    new Error(
                                        "Не удалось загрузить " +
                                        label
                                    )
                                );
                            }
                        );
                }
            );
        }


        /*
         * FUNCTION: surface
         *
         * Создаёт плоскость стены,
         * потолка или пола.
         */
        function surface(
            w,
            h,
            pos,
            rot,
            label
        ) {

            const material =
                new THREE.MeshBasicMaterial({
                    color:
                        0x222222,

                    side:
                        THREE.DoubleSide
                });


            const mesh =
                new THREE.Mesh(
                    new THREE.PlaneGeometry(
                        w,
                        h
                    ),
                    material
                );


            mesh.position.copy(
                pos
            );


            mesh.rotation.set(
                rot.x,
                rot.y,
                rot.z
            );


            mesh.userData.roomSurface =
                label;


            return mesh;
        }


        /*
         * FUNCTION: clearRoom
         *
         * Полностью очищает предыдущую комнату.
         */
        function clearRoom() {

            if (!roomScene) {
                return;
            }


            [
                ...roomScene.children
            ].forEach(
                object => {

                    if (
                        object
                            .userData
                            ?.roomSurface
                    ) {

                        object
                            .geometry
                            ?.dispose();


                        object
                            .material
                            ?.map
                            ?.dispose();


                        object
                            .material
                            ?.dispose();


                        roomScene.remove(
                            object
                        );
                    }
                }
            );


            if (roomModel) {

                roomScene.remove(
                    roomModel
                );

                roomModel =
                    null;
            }
        }


        /* ============================================================
           ROOM MODEL
           ============================================================ */

        /*
         * FUNCTION: loadRoomModel
         *
         * Загружает GLTF/GLB модель.
         *
         * Важная часть:
         *
         * Если GLTF содержит относительные ссылки
         * на дополнительные файлы, например:
         *
         * texture.jpg
         * model.bin
         *
         * LoadingManager перенаправляет их
         * на PC-сервер комнаты.
         */
        async function loadRoomModel(
            info
        ) {

            const url =
                String(
                    info?.url ||
                    ""
                ).trim();


            if (!url) {

                throw new Error(
                    "Сервер не вернул URL 3D модели"
                );
            }


            const manager =
                new THREE.LoadingManager();


            manager.setURLModifier(
                originalUrl => {

                    /*
                     * Data URL и абсолютные HTTP/HTTPS
                     * URL не изменяем.
                     */
                    if (
                        !originalUrl ||
                        originalUrl.startsWith(
                            "data:"
                        ) ||
                        /^https?:\/\//i.test(
                            originalUrl
                        )
                    ) {

                        return originalUrl;
                    }


                    /*
                     * Извлекаем имя файла.
                     */
                    const filename =
                        originalUrl
                            .split("?")[0]
                            .split("/")
                            .pop();


                    /*
                     * Если известна папка комнаты,
                     * направляем внутренний ресурс
                     * через PC API.
                     */
                    if (
                        info?.room
                    ) {

                        return (
                            `${ROOMS_API}/model-file/` +
                            `${encodeURIComponent(
                                info.room
                            )}/` +
                            `${encodeURIComponent(
                                filename
                            )}`
                        );
                    }


                    return originalUrl;
                }
            );


            const loader =
                new GLTFLoader(
                    manager
                );


            const gltf =
                await new Promise(
                    (
                        resolve,
                        reject
                    ) => {

                        loader.load(
                            url,
                            resolve,
                            undefined,
                            reject
                        );
                    }
                );


            const model =
                gltf.scene;


            const box =
                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            const size =
                box.getSize(
                    new THREE.Vector3()
                );


            if (
                Math.max(
                    size.x,
                    size.y,
                    size.z
                ) <= 0
            ) {

                throw new Error(
                    "3D модель не содержит геометрии"
                );
            }


            /*
             * Масштабирование модели.
             */
            model.scale.setScalar(
                3.2 /
                Math.max(
                    size.x,
                    size.y,
                    size.z
                )
            );


            model.updateMatrixWorld(
                true
            );


            /*
             * Получаем новый bounding box.
             */
            const b =
                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            const center =
                b.getCenter(
                    new THREE.Vector3()
                );


            /*
             * Центрируем модель.
             */
            model.position.x -=
                center.x;

            model.position.z -=
                center.z;


            /*
             * Нижняя точка модели
             * ставится на уровень пола.
             */
            model.position.y -=
                b.min.y;


            roomModel =
                model;


            roomScene.add(
                model
            );
        }


        /* ============================================================
           ROOM VIEWER
           ============================================================ */

        let roomScene;
        let roomCamera;
        let roomRenderer;
        let roomClock;
        let roomModel;


        let roomYaw =
            Math.PI;

        let roomPitch =
            0;

        let roomRoll =
            0;


        let roomPadX =
            0;

        let roomPadY =
            0;

        let verticalInput =
            0;

        let padId =
            null;

        let lookId =
            null;

        let lastLX =
            0;

        let lastLY =
            0;


        const keys =
            new Set();


        /*
         * FUNCTION: updateCamera
         *
         * Обновляет направление камеры.
         */
        function updateCamera() {

            if (!roomCamera) {
                return;
            }


            const direction =
                new THREE.Vector3(

                    Math.sin(
                        roomYaw
                    ) *
                    Math.cos(
                        roomPitch
                    ),

                    Math.sin(
                        roomPitch
                    ),

                    Math.cos(
                        roomYaw
                    ) *
                    Math.cos(
                        roomPitch
                    )
                );


            roomCamera.lookAt(

                roomCamera.position.x +
                    direction.x,

                roomCamera.position.y +
                    direction.y,

                roomCamera.position.z +
                    direction.z
            );


            roomCamera.rotateZ(
                roomRoll
            );
        }


        /*
         * FUNCTION: clampCamera
         *
         * Не позволяет камере выйти
         * за границы комнаты.
         */
        function clampCamera() {

            if (!roomCamera) {
                return;
            }


            roomCamera.position.x =
                THREE.MathUtils.clamp(

                    roomCamera.position.x,

                    -ROOM_LENGTH / 2 +
                        ROOM_CAMERA_RADIUS,

                    ROOM_LENGTH / 2 -
                        ROOM_CAMERA_RADIUS
                );


            roomCamera.position.z =
                THREE.MathUtils.clamp(

                    roomCamera.position.z,

                    -ROOM_WIDTH / 2 +
                        ROOM_CAMERA_RADIUS,

                    ROOM_WIDTH / 2 -
                        ROOM_CAMERA_RADIUS
                );


            roomCamera.position.y =
                THREE.MathUtils.clamp(

                    roomCamera.position.y,

                    .35,

                    ROOM_HEIGHT -
                        .35
                );
        }


        /*
         * FUNCTION: initRoomViewer
         *
         * Создаёт Three.js-сцену и
         * все элементы управления.
         */
        function initRoomViewer() {

            if (roomRenderer) {
                return;
            }


            roomScene =
                new THREE.Scene();


            roomScene.background =
                new THREE.Color(
                    0x000000
                );


            roomCamera =
                new THREE.PerspectiveCamera(
                    70,
                    1,
                    .03,
                    100
                );


            roomRenderer =
                new THREE.WebGLRenderer({
                    antialias:
                        true,

                    powerPreference:
                        "high-performance"
                });


            roomRenderer.setPixelRatio(
                Math.min(
                    devicePixelRatio || 1,
                    1.5
                )
            );


            roomRenderer.setSize(
                innerWidth,
                innerHeight,
                false
            );


            roomRenderer.outputColorSpace =
                THREE.SRGBColorSpace;


            roomCanvas.appendChild(
                roomRenderer.domElement
            );


            roomClock =
                new THREE.Clock();


            /* ========================================================
               MAIN CANVAS POINTER
               ======================================================== */

            roomRenderer
                .domElement
                .onpointerdown =
                e => {

                    if (
                        e.pointerType ===
                        "mouse"
                    ) {

                        roomRenderer
                            .domElement
                            ._mouse =
                            true;


                        roomRenderer
                            .domElement
                            ._mx =
                            e.clientX;


                        roomRenderer
                            .domElement
                            ._my =
                            e.clientY;


                        return;
                    }


                    if (
                        e.clientX <
                            innerWidth / 2 &&
                        padId === null
                    ) {

                        padId =
                            e.pointerId;

                    } else if (
                        lookId === null
                    ) {

                        lookId =
                            e.pointerId;


                        lastLX =
                            e.clientX;


                        lastLY =
                            e.clientY;
                    }


                    roomRenderer
                        .domElement
                        .setPointerCapture?.(
                            e.pointerId
                        );
                };


            roomRenderer
                .domElement
                .onpointermove =
                e => {

                    if (
                        e.pointerType ===
                        "mouse"
                    ) {

                        if (
                            !roomRenderer
                                .domElement
                                ._mouse
                        ) {

                            return;
                        }


                        const dx =
                            e.clientX -
                            roomRenderer
                                .domElement
                                ._mx;


                        const dy =
                            e.clientY -
                            roomRenderer
                                .domElement
                                ._my;


                        roomRenderer
                            .domElement
                            ._mx =
                            e.clientX;


                        roomRenderer
                            .domElement
                            ._my =
                            e.clientY;


                        roomYaw -=
                            dx *
                            ROOM_LOOK_SPEED;


                        roomPitch =
                            THREE.MathUtils.clamp(

                                roomPitch -
                                    dy *
                                    ROOM_LOOK_SPEED,

                                -1.52,

                                1.52
                            );


                        updateCamera();

                        return;
                    }


                    if (
                        e.pointerId ===
                        lookId
                    ) {

                        const dx =
                            e.clientX -
                            lastLX;


                        const dy =
                            e.clientY -
                            lastLY;


                        lastLX =
                            e.clientX;


                        lastLY =
                            e.clientY;


                        roomYaw -=
                            dx *
                            ROOM_LOOK_SPEED;


                        roomPitch =
                            THREE.MathUtils.clamp(

                                roomPitch -
                                    dy *
                                    ROOM_LOOK_SPEED,

                                -1.52,

                                1.52
                            );


                        updateCamera();
                    }


                    if (
                        e.pointerId ===
                        padId
                    ) {

                        const rect =
                            roomMovePad
                                .getBoundingClientRect();


                        roomPadX =
                            THREE.MathUtils.clamp(

                                (
                                    e.clientX -
                                    (
                                        rect.left +
                                        50
                                    )
                                ) /
                                35,

                                -1,

                                1
                            );


                        roomPadY =
                            THREE.MathUtils.clamp(

                                (
                                    e.clientY -
                                    (
                                        rect.top +
                                        50
                                    )
                                ) /
                                35,

                                -1,

                                1
                            );


                        roomMoveKnob
                            .style
                            .transform =
                            `translate3d(` +
                            `${roomPadX * 35}px,` +
                            `${roomPadY * 35}px,0)`;
                    }
                };


            roomRenderer
                .domElement
                .onpointerup =
                e => {

                    if (
                        e.pointerType ===
                        "mouse"
                    ) {

                        roomRenderer
                            .domElement
                            ._mouse =
                            false;
                    }


                    if (
                        e.pointerId ===
                        padId
                    ) {

                        padId =
                            null;

                        roomPadX =
                            roomPadY =
                                0;


                        roomMoveKnob
                            .style
                            .transform =
                            "translate3d(0,0,0)";
                    }


                    if (
                        e.pointerId ===
                        lookId
                    ) {

                        lookId =
                            null;
                    }
                };


            roomRenderer
                .domElement
                .onpointercancel =
                roomRenderer
                    .domElement
                    .onpointerup;


            /* ========================================================
               MOVE PAD
               ======================================================== */

            roomMovePad.onpointerdown =
                e => {

                    e.preventDefault();

                    padId =
                        e.pointerId;


                    roomMovePad
                        .setPointerCapture?.(
                            e.pointerId
                        );
                };


            roomMovePad.onpointermove =
                e => {

                    if (
                        e.pointerId !==
                        padId
                    ) {

                        return;
                    }


                    const r =
                        roomMovePad
                            .getBoundingClientRect();


                    const x =
                        (
                            e.clientX -
                            (
                                r.left +
                                r.width / 2
                            )
                        ) /
                        (
                            r.width *
                            .32
                        );


                    const y =
                        (
                            e.clientY -
                            (
                                r.top +
                                r.height / 2
                            )
                        ) /
                        (
                            r.height *
                            .32
                        );


                    roomPadX =
                        THREE.MathUtils.clamp(
                            x,
                            -1,
                            1
                        );


                    roomPadY =
                        THREE.MathUtils.clamp(
                            y,
                            -1,
                            1
                        );


                    roomMoveKnob
                        .style
                        .transform =
                        `translate3d(` +
                        `${roomPadX * r.width * .32}px,` +
                        `${roomPadY * r.height * .32}px,0)`;
                };


            roomMovePad.onpointerup =
                roomMovePad.onpointercancel =
                () => {

                    padId =
                        null;

                    roomPadX =
                        roomPadY =
                            0;


                    roomMoveKnob
                        .style
                        .transform =
                        "translate3d(0,0,0)";
                };


            /* ========================================================
               LOOK PAD
               ======================================================== */

            roomLookPad.onpointerdown =
                e => {

                    e.preventDefault();

                    lookId =
                        e.pointerId;

                    lastLX =
                        e.clientX;

                    lastLY =
                        e.clientY;


                    roomLookPad
                        .setPointerCapture?.(
                            e.pointerId
                        );
                };


            roomLookPad.onpointermove =
                e => {

                    if (
                        e.pointerId !==
                        lookId
                    ) {

                        return;
                    }


                    const dx =
                        e.clientX -
                        lastLX;


                    const dy =
                        e.clientY -
                        lastLY;


                    lastLX =
                        e.clientX;


                    lastLY =
                        e.clientY;


                    roomYaw -=
                        dx *
                        ROOM_LOOK_SPEED;


                    roomPitch =
                        THREE.MathUtils.clamp(

                            roomPitch -
                                dy *
                                ROOM_LOOK_SPEED,

                            -1.52,

                            1.52
                        );


                    updateCamera();
                };


            roomLookPad.onpointerup =
                roomLookPad.onpointercancel =
                () =>
                    lookId =
                        null;


            /* ========================================================
               VERTICAL
               ======================================================== */

            for (
                const [
                    element,
                    value
                ]
                of [
                    [
                        roomMoveUp,
                        1
                    ],
                    [
                        roomMoveDown,
                        -1
                    ]
                ]
            ) {

                element.onpointerdown =
                    e => {

                        e.preventDefault();

                        verticalInput =
                            value;
                    };


                element.onpointerup =
                    element.onpointercancel =
                    () => {

                        if (
                            verticalInput ===
                            value
                        ) {

                            verticalInput =
                                0;
                        }
                    };
            }


            /* ========================================================
               ROLL
               ======================================================== */

            roomRollLeft.onclick =
                () => {

                    roomRoll =
                        THREE.MathUtils.clamp(

                            roomRoll +
                                .12,

                            -Math.PI / 3,

                            Math.PI / 3
                        );


                    updateCamera();
                };


            roomRollRight.onclick =
                () => {

                    roomRoll =
                        THREE.MathUtils.clamp(

                            roomRoll -
                                .12,

                            -Math.PI / 3,

                            Math.PI / 3
                        );


                    updateCamera();
                };


            /* ========================================================
               RESET
               ======================================================== */

            roomReset.onclick =
                () => {

                    roomYaw =
                        Math.PI;


                    roomPitch =
                        0;


                    roomRoll =
                        0;


                    verticalInput =
                        0;


                    roomCamera.position.set(
                        0,
                        ROOM_EYE_HEIGHT,
                        1
                    );


                    clampCamera();

                    updateCamera();
                };


            /* ========================================================
               KEYBOARD
               ======================================================== */

            addEventListener(
                "keydown",
                e =>
                    keys.add(
                        e.code
                    )
            );


            addEventListener(
                "keyup",
                e =>
                    keys.delete(
                        e.code
                    )
            );


            addEventListener(
                "blur",
                () =>
                    keys.clear()
            );


            addEventListener(
                "resize",
                resizeRoom
            );


            requestAnimationFrame(
                roomLoop
            );
        }


        /*
         * FUNCTION: resizeRoom
         *
         * Обновляет пропорции камеры
         * и размер WebGL Canvas.
         */
        function resizeRoom() {

            if (
                !roomRenderer ||
                !roomCamera
            ) {

                return;
            }


            roomCamera.aspect =
                innerWidth /
                innerHeight;


            roomCamera.updateProjectionMatrix();


            roomRenderer.setSize(
                innerWidth,
                innerHeight,
                false
            );
        }


        /*
         * FUNCTION: roomLoop
         *
         * Главный цикл 3D-комнаты.
         */
        function roomLoop() {

            requestAnimationFrame(
                roomLoop
            );


            if (
                !roomRenderer ||
                !roomViewerScreen
                    .classList
                    .contains(
                        "active"
                    )
            ) {

                return;
            }


            const dt =
                Math.min(
                    roomClock.getDelta(),
                    .05
                );


            let f =
                (
                    keys.has("KeyW") ||
                    keys.has("ArrowUp")
                        ? 1
                        : 0
                ) -
                (
                    keys.has("KeyS") ||
                    keys.has("ArrowDown")
                        ? 1
                        : 0
                ) -
                roomPadY;


            let s =
                (
                    keys.has("KeyD") ||
                    keys.has("ArrowRight")
                        ? 1
                        : 0
                ) -
                (
                    keys.has("KeyA") ||
                    keys.has("ArrowLeft")
                        ? 1
                        : 0
                ) +
                roomPadX;


            const len =
                Math.hypot(
                    f,
                    s
                );


            if (
                len > 1
            ) {

                f /=
                    len;

                s /=
                    len;
            }


            const sp =
                ROOM_SPEED *
                dt;


            const fx =
                Math.sin(
                    roomYaw
                );


            const fz =
                Math.cos(
                    roomYaw
                );


            const rx =
                Math.cos(
                    roomYaw
                );


            const rz =
                -Math.sin(
                    roomYaw
                );


            roomCamera.position.x +=
                (
                    fx * f +
                    rx * s
                ) *
                sp;


            roomCamera.position.z +=
                (
                    fz * f +
                    rz * s
                ) *
                sp;


            const vert =
                (
                    keys.has("KeyR")
                        ? 1
                        : 0
                ) -
                (
                    keys.has("KeyF")
                        ? 1
                        : 0
                ) ||
                verticalInput;


            roomCamera.position.y +=
                vert *
                sp;


            clampCamera();

            updateCamera();


            roomRenderer.render(
                roomScene,
                roomCamera
            );
        }


        /* ============================================================
           BUILD ROOM
           ============================================================ */

        /*
         * FUNCTION: buildRoom
         *
         * Полностью собирает выбранную комнату:
         *
         * 1. Очищает предыдущую.
         * 2. Запрашивает manifest.
         * 3. Создаёт поверхности.
         * 4. Загружает текстуры.
         * 5. Получает 3D-модель.
         * 6. Загружает 3D-модель.
         */
        async function buildRoom(
            item
        ) {

            clearRoom();


            const folder =
                String(
                    item?.folder ||
                    item?.name ||
                    ""
                ).trim();


            roomStatus(
                `Запрос ROOM ${folder}...`
            );


            /*
             * Получаем manifest комнаты.
             */
            const data =
                await requestRoom(
                    item
                );


            /*
             * Определяем текстуры.
             */
            const textures =
                resolveTextures(
                    data
                );


            /*
             * Создаём шесть поверхностей.
             */
            const surfaces = [

                surface(
                    ROOM_LENGTH,
                    ROOM_HEIGHT,
                    new THREE.Vector3(
                        0,
                        2,
                        3
                    ),
                    new THREE.Euler(
                        0,
                        Math.PI,
                        0
                    ),
                    "01_BACKGROUND"
                ),

                surface(
                    ROOM_WIDTH,
                    ROOM_HEIGHT,
                    new THREE.Vector3(
                        -3.5,
                        2,
                        0
                    ),
                    new THREE.Euler(
                        0,
                        Math.PI / 2,
                        0
                    ),
                    "02_LEFT"
                ),

                surface(
                    ROOM_WIDTH,
                    ROOM_HEIGHT,
                    new THREE.Vector3(
                        3.5,
                        2,
                        0
                    ),
                    new THREE.Euler(
                        0,
                        -Math.PI / 2,
                        0
                    ),
                    "03_RIGHT"
                ),

                surface(
                    ROOM_LENGTH,
                    ROOM_HEIGHT,
                    new THREE.Vector3(
                        0,
                        2,
                        -3
                    ),
                    new THREE.Euler(
                        0,
                        0,
                        0
                    ),
                    "04_FRONT"
                ),

                surface(
                    ROOM_LENGTH,
                    ROOM_WIDTH,
                    new THREE.Vector3(
                        0,
                        4,
                        0
                    ),
                    new THREE.Euler(
                        Math.PI / 2,
                        0,
                        0
                    ),
                    "05_SKY"
                ),

                surface(
                    ROOM_LENGTH,
                    ROOM_WIDTH,
                    new THREE.Vector3(
                        0,
                        0,
                        0
                    ),
                    new THREE.Euler(
                        -Math.PI / 2,
                        0,
                        0
                    ),
                    "06_GROUND"
                )
            ];


            surfaces.forEach(
                surfaceObject =>
                    roomScene.add(
                        surfaceObject
                    )
            );


            /*
             * Начальное положение камеры.
             */
            roomCamera.position.set(
                0,
                ROOM_EYE_HEIGHT,
                1
            );


            roomYaw =
                Math.PI;

            roomPitch =
                0;

            roomRoll =
                0;


            clampCamera();

            updateCamera();


            /*
             * Количество загруженных текстур.
             */
            let loadedTextures =
                0;


            /*
             * Последовательно загружаем 6 текстур.
             */
            for (
                const [
                    key,
                    label
                ]
                of [
                    [
                        "back",
                        "01_BACKGROUND"
                    ],
                    [
                        "left",
                        "02_LEFT"
                    ],
                    [
                        "right",
                        "03_RIGHT"
                    ],
                    [
                        "front",
                        "04_FRONT"
                    ],
                    [
                        "ceiling",
                        "05_SKY"
                    ],
                    [
                        "floor",
                        "06_GROUND"
                    ]
                ]
            ) {

                try {

                    roomStatus(
                        `ROOM ${folder}: ` +
                        `загрузка ${label}.png ` +
                        `(${loadedTextures}/6)`
                    );


                    const texture =
                        await loadTexture(
                            textures[key],
                            label
                        );


                    const materialMesh =
                        surfaces.find(
                            object =>
                                object
                                    .userData
                                    .roomSurface ===
                                label
                        );


                    if (!materialMesh) {

                        throw new Error(
                            "Поверхность " +
                            label +
                            " не найдена"
                        );
                    }


                    materialMesh
                        .material
                        .map =
                        texture;


                    materialMesh
                        .material
                        .color
                        .set(
                            0xffffff
                        );


                    materialMesh
                        .material
                        .needsUpdate =
                        true;


                    loadedTextures++;

                } catch (e) {

                    console.warn(
                        "[TEXTURE]",
                        label,
                        e
                    );
                }
            }


            roomStatus(
                `ROOM ${folder}: ` +
                `текстуры ${loadedTextures}/6.\n` +
                `Загрузка 3D модели...`
            );


            /*
             * Информация о модели.
             */
            let modelInfo =
                data.model;


            /*
             * Если URL отсутствует,
             * пробуем отдельный endpoint.
             */
            if (
                !modelInfo?.url
            ) {

                const id =
                    Number(
                        data.id ||
                        0
                    );


                if (id) {

                    const modelResponse =
                        await fetch(
                            `${ROOMS_API}/` +
                            `${encodeURIComponent(
                                folder
                            )}/model` +
                            `?request_id=${id}`,
                            {
                                cache:
                                    "no-store",

                                headers: {
                                    Accept:
                                        "application/json"
                                }
                            }
                        );


                    if (
                        modelResponse.ok
                    ) {

                        modelInfo =
                            await modelResponse.json();
                    }
                }
            }


            /*
             * Модель ещё генерируется.
             */
            if (
                modelInfo?.ready === false &&
                modelInfo.url == null
            ) {

                roomStatus(
                    `ROOM ${folder}: ` +
                    `модель ожидается от PC-сервера`
                );


                return;
            }


            /*
             * Загружаем модель.
             */
            if (
                modelInfo?.url
            ) {

                modelInfo.room =
                    folder;


                await loadRoomModel(
                    modelInfo
                );
            }


            roomStatus(
                `ROOM ${folder} готов.\n` +
                `Текстуры: ${loadedTextures}/6.\n` +
                `3D модель: ` +
                (
                    modelInfo?.url
                        ? "загружена"
                        : "не получена"
                )
            );


            setTimeout(
                () => {

                    if (
                        roomViewerScreen
                            .classList
                            .contains(
                                "active"
                            )
                    ) {

                        roomStatus(
                            "",
                            false
                        );
                    }

                },
                2200
            );
        }


        /* ============================================================
           NAVIGATION
           ============================================================ */

        /*
         * Открывает список ROOM.
         */
        $("openRoom").onclick =
            async () => {

                if (
                    !requireAccess()
                ) {

                    return;
                }


                show(
                    roomScreen
                );


                await loadRooms();
            };


        /*
         * Назад из списка комнат.
         */
        $("roomBack").onclick =
            () =>
                show(
                    homeScreen
                );


        /*
         * Назад из 3D-комнаты.
         */
        $("roomViewerBack").onclick =
            () => {

                currentRoom =
                    null;


                clearRoom();


                show(
                    roomScreen
                );
            };


        /*
         * FUNCTION: openRoom
         *
         * Открывает выбранную комнату.
         */
        function openRoom(
            index
        ) {

            if (
                !requireAccess()
            ) {

                return;
            }


            currentRoom =
                rooms[index];


            const number =
                roomNumber(
                    currentRoom,
                    index
                );


            roomViewerTitle.textContent =
                `ROOM ${number}`;


            show(
                roomViewerScreen
            );


            initRoomViewer();

            resizeRoom();


            buildRoom(
                currentRoom
            )
                .catch(
                    error => {

                        console.error(
                            "[ROOM] BUILD ERROR:",
                            error
                        );


                        roomStatus(
                            "Ошибка ROOM: " +
                            error.message
                        );
                    }
                );
        }


        /*
         * Открытие генерации.
         */
        $("openGeneration").onclick =
            () => {

                if (
                    !requireAccess()
                ) {

                    return;
                }


                generationCode.value =
                    "";


                generationStatus.textContent =
                    "";


                generationSubmit.disabled =
                    true;


                show(
                    generationScreen
                );
            };


        /*
         * Назад из генерации.
         */
        $("generationBack").onclick =
            () =>
                show(
                    homeScreen
                );


        /*
         * Открытие профиля.
         */
        $("openUser").onclick =
            () => {

                if (
                    !requireAccess()
                ) {

                    return;
                }


                userWalletAddress.textContent =
                    currentWallet ||
                    "";


                show(
                    userScreen
                );
            };


        /*
         * Назад из профиля.
         */
        $("userBack").onclick =
            () =>
                show(
                    homeScreen
                );


        /*
         * Отключение TON-кошелька.
         */
        $("disconnectWallet").onclick =
            async () => {

                try {

                    await tonConnectUI
                        .disconnect();

                } finally {

                    currentWallet =
                        null;

                    accessGranted =
                        false;


                    show(
                        authScreen
                    );
                }
            };

    </script>

</body>

</html>
