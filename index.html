<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>AR Game</title>


    <!-- Telegram Mini App -->

    <script src="https://telegram.org/js/telegram-web-app.js"></script>


    <!-- Three.js -->

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;

            font-family: Arial, sans-serif;

            touch-action: none;
        }


        #app {

            position: relative;

            width: 100%;
            height: 100dvh;

            overflow: hidden;
        }


        /* ==========================
           START SCREEN
        ========================== */

        #startScreen {

            position: absolute;

            inset: 0;

            z-index: 20;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            padding: 25px;

            text-align: center;

            background: #101820;

            color: white;
        }


        #startScreen h1 {

            font-size: 42px;

            margin-bottom: 15px;
        }


        #startScreen p {

            max-width: 350px;

            line-height: 1.5;

            opacity: .7;

            margin-bottom: 30px;
        }


        #startAR {

            border: 0;

            border-radius: 18px;

            padding: 18px 30px;

            background: white;

            color: #111;

            font-size: 18px;

            font-weight: bold;
        }


        #startAR:disabled {

            opacity: .4;
        }


        /* ==========================
           THREE.JS CANVAS
        ========================== */

        #threeCanvas {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            display: none;
        }


        /* ==========================
           TOP UI
        ========================== */

        #topUI {

            position: absolute;

            top: 15px;

            left: 15px;

            right: 15px;

            z-index: 10;

            display: none;

            justify-content: space-between;

            pointer-events: none;
        }


        .panel {

            padding: 10px 14px;

            border-radius: 14px;

            background: rgba(0,0,0,.65);

            color: white;

            backdrop-filter: blur(10px);
        }


        /* ==========================
           RETICLE
        ========================== */

        #reticle {

            position: absolute;

            left: 50%;

            top: 50%;

            width: 45px;

            height: 45px;

            transform: translate(-50%, -50%);

            border: 2px solid white;

            border-radius: 50%;

            z-index: 8;

            display: none;

            pointer-events: none;
        }


        #reticle::before,
        #reticle::after {

            content: "";

            position: absolute;

            background: white;
        }


        #reticle::before {

            width: 15px;

            height: 2px;

            left: 13px;

            top: 20px;
        }


        #reticle::after {

            width: 2px;

            height: 15px;

            left: 20px;

            top: 13px;
        }


        /* ==========================
           STATUS
        ========================== */

        #status {

            position: absolute;

            left: 50%;

            bottom: 80px;

            transform: translateX(-50%);

            z-index: 15;

            width: calc(100% - 40px);

            max-width: 400px;

            padding: 13px 16px;

            border-radius: 14px;

            background: rgba(0,0,0,.75);

            color: white;

            text-align: center;

            line-height: 1.4;

            pointer-events: none;
        }


        /* ==========================
           PLACE BUTTON
        ========================== */

        #placeButton {

            position: absolute;

            left: 50%;

            bottom: 25px;

            transform: translateX(-50%);

            z-index: 15;

            border: none;

            border-radius: 16px;

            padding: 15px 25px;

            background: white;

            color: black;

            font-size: 17px;

            font-weight: bold;

            display: none;
        }


        /* ==========================
           EXIT
        ========================== */

        #exitButton {

            position: absolute;

            right: 15px;

            bottom: 25px;

            z-index: 15;

            border: none;

            border-radius: 14px;

            padding: 12px 16px;

            background: rgba(0,0,0,.7);

            color: white;

            display: none;
        }


    </style>

</head>


<body>


<div id="app">


    <!-- ==========================
         START
    ========================== -->

    <section id="startScreen">

        <h1>AR GAME</h1>

        <p id="description">

            Камера будет использоваться
            для AR-навигации.

            Наведи телефон на пол,
            найди поверхность и размести
            3D-объект.

        </p>


        <button
            id="startAR"
            disabled>

            Проверка AR...

        </button>

    </section>


    <!-- ==========================
         THREE.JS
    ========================== -->

    <canvas id="threeCanvas"></canvas>


    <!-- ==========================
         TOP UI
    ========================== -->

    <div id="topUI">

        <div class="panel">

            AR MODE

        </div>


        <div
            class="panel"
            id="userName">

            Player

        </div>

    </div>


    <!-- ==========================
         RETICLE
    ========================== -->

    <div id="reticle"></div>


    <!-- ==========================
         STATUS
    ========================== -->

    <div id="status">

        Проверка устройства...

    </div>


    <!-- ==========================
         PLACE
    ========================== -->

    <button id="placeButton">

        Поставить объект

    </button>


    <!-- ==========================
         EXIT
    ========================== -->

    <button id="exitButton">

        Выйти

    </button>


</div>


<script type="module">

    import * as THREE from "three";

    import { GLTFLoader }
        from "three/addons/loaders/GLTFLoader.js";


    /* =================================
       TELEGRAM
    ================================= */

    const tg =
        window.Telegram?.WebApp;


    if (tg) {

        tg.ready();

        tg.expand();

    }


    /* =================================
       USER
    ================================= */

    if (tg?.initDataUnsafe?.user) {

        const user =
            tg.initDataUnsafe.user;


        document.getElementById(
            "userName"
        ).textContent =
            user.first_name ||
            user.username ||
            "Player";
    }


    /* =================================
       ELEMENTS
    ================================= */

    const startScreen =
        document.getElementById(
            "startScreen"
        );


    const startButton =
        document.getElementById(
            "startAR"
        );


    const canvas =
        document.getElementById(
            "threeCanvas"
        );


    const topUI =
        document.getElementById(
            "topUI"
        );


    const reticle =
        document.getElementById(
            "reticle"
        );


    const status =
        document.getElementById(
            "status"
        );


    const placeButton =
        document.getElementById(
            "placeButton"
        );


    const exitButton =
        document.getElementById(
            "exitButton"
        );


    /* =================================
       VARIABLES
    ================================= */

    let renderer;

    let scene;

    let camera;

    let xrSession = null;

    let viewerSpace = null;

    let hitTestSource = null;

    let hitTestSourceRequested = false;

    let hitPose = null;

    let model = null;

    let modelPlaced = false;


    /* =================================
       STATUS
    ================================= */

    function setStatus(text) {

        status.textContent = text;

    }


    /* =================================
       THREE.JS
    ================================= */

    function initThree() {

        scene =
            new THREE.Scene();


        /*
         * AR camera
         */

        camera =
            new THREE.PerspectiveCamera(
                70,
                window.innerWidth /
                window.innerHeight,
                0.01,
                100
            );


        /*
         * Renderer
         */

        renderer =
            new THREE.WebGLRenderer({
                canvas: canvas,
                alpha: true,
                antialias: true,
                preserveDrawingBuffer: false
            });


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio,
                2
            )
        );


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        renderer.xr.enabled = true;


        /*
         * Цветовая обработка
         */

        renderer.outputColorSpace =
            THREE.SRGBColorSpace;


        /*
         * Свет
         */

        const hemiLight =
            new THREE.HemisphereLight(
                0xffffff,
                0x777777,
                2
            );


        scene.add(
            hemiLight
        );


        const directionalLight =
            new THREE.DirectionalLight(
                0xffffff,
                2
            );


        directionalLight.position.set(
            2,
            4,
            2
        );


        scene.add(
            directionalLight
        );


        /*
         * Загружаем модель
         */

        const loader =
            new GLTFLoader();


        loader.load(

            "./models/creature.glb",

            gltf => {

                model =
                    gltf.scene;


                /*
                 * Масштаб.
                 *
                 * Если твоя модель огромная
                 * или слишком маленькая,
                 * здесь изменим размер.
                 */

                model.scale.set(
                    1,
                    1,
                    1
                );


                /*
                 * Сначала скрываем
                 */

                model.visible =
                    false;


                scene.add(
                    model
                );


                console.log(
                    "GLB loaded"
                );


                setStatus(
                    "Модель загружена. AR готов."
                );

            },


            undefined,

            error => {

                console.error(
                    "GLB ERROR:",
                    error
                );


                setStatus(
                    "Ошибка загрузки creature.glb"
                );

            }

        );


        /*
         * Resize
         */

        window.addEventListener(
            "resize",
            onResize
        );


        /*
         * XR frame
         */

        renderer.setAnimationLoop(
            renderXR
        );

    }


    /* =================================
       RESIZE
    ================================= */

    function onResize() {

        if (!renderer) {
            return;
        }


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();

    }


    /* =================================
       CHECK WEBXR
    ================================= */

    async function checkAR() {

        /*
         * WebXR вообще существует?
         */

        if (!navigator.xr) {

            setStatus(
                "WebXR не доступен в этом Telegram WebView."
            );


            startButton.disabled =
                true;


            startButton.textContent =
                "AR недоступен";


            return false;

        }


        /*
         * Проверяем именно immersive-ar
         */

        try {

            const supported =
                await navigator.xr
                    .isSessionSupported(
                        "immersive-ar"
                    );


            if (!supported) {

                setStatus(
                    "Этот Telegram WebView не поддерживает immersive AR."
                );


                startButton.disabled =
                    true;


                startButton.textContent =
                    "AR не поддерживается";


                return false;

            }


            startButton.disabled =
                false;


            startButton.textContent =
                "Включить камеру";


            setStatus(
                "AR поддерживается."
            );


            return true;

        }
        catch (error) {

            console.error(
                error
            );


            startButton.disabled =
                true;


            startButton.textContent =
                "Ошибка проверки AR";


            setStatus(
                "Не удалось проверить WebXR."
            );


            return false;

        }

    }


    /* =================================
       START AR
    ================================= */

    startButton.addEventListener(
        "click",
        startAR
    );


    async function startAR() {

        try {

            if (!navigator.xr) {

                throw new Error(
                    "WebXR unavailable"
                );

            }


            /*
             * Создаём AR session
             *
             * Никакого Scene Viewer.
             * Никакого intent://
             */

            xrSession =
                await navigator.xr.requestSession(
                    "immersive-ar",
                    {

                        requiredFeatures: [
                            "hit-test"
                        ],

                        optionalFeatures: [
                            "local-floor",
                            "dom-overlay"
                        ],

                        domOverlay: {
                            root: document.body
                        }

                    }
                );


            /*
             * Передаём session
             * Three.js
             */

            await renderer.xr.setSession(
                xrSession
            );


            /*
             * Получаем reference space
             */

            viewerSpace =
                await xrSession.requestReferenceSpace(
                    "viewer"
                );


            /*
             * Сбрасываем состояние
             */

            hitTestSource =
                null;

            hitTestSourceRequested =
                false;

            modelPlaced =
                false;

            hitPose =
                null;


            /*
             * UI
             */

            startScreen.style.display =
                "none";


            canvas.style.display =
                "block";


            topUI.style.display =
                "flex";


            reticle.style.display =
                "block";


            placeButton.style.display =
                "block";


            exitButton.style.display =
                "block";


            setStatus(
                "Наведите камеру на пол"
            );


            /*
             * Когда AR завершится
             */

            xrSession.addEventListener(
                "end",
                onSessionEnd
            );


        }
        catch (error) {

            console.error(
                "AR START ERROR:",
                error
            );


            setStatus(
                "Не удалось запустить AR: " +
                error.message
            );

        }

    }


    /* =================================
       HIT TEST
    ================================= */

    async function requestHitTestSource(
        frame
    ) {

        if (
            hitTestSourceRequested
        ) {

            return;

        }


        hitTestSourceRequested =
            true;


        try {

            hitTestSource =
                await xrSession
                    .requestHitTestSource({
                        space:
                            viewerSpace
                    });


            xrSession.addEventListener(
                "end",
                () => {

                    hitTestSource =
                        null;

                    hitTestSourceRequested =
                        false;

                }
            );

        }
        catch (error) {

            console.error(
                "HIT TEST ERROR:",
                error
            );


            setStatus(
                "Hit-test не поддерживается."
            );

        }

    }


    /* =================================
       XR FRAME
    ================================= */

    function renderXR(
        time,
        frame
    ) {

        if (
            !frame ||
            !xrSession
        ) {

            renderer.render(
                scene,
                camera
            );

            return;

        }


        /*
         * Получаем viewer pose.
         *
         * Это положение и ориентация
         * телефона в пространстве.
         */

        const referenceSpace =
            renderer.xr
                .getReferenceSpace();


        const pose =
            frame.getViewerPose(
                referenceSpace
            );


        /*
         * Создаём hit-test source
         */

        requestHitTestSource(
            frame
        );


        /*
         * Ищем поверхность
         */

        if (
            hitTestSource
        ) {

            const results =
                frame.getHitTestResults(
                    hitTestSource
                );


            if (
                results.length > 0
            ) {

                const hit =
                    results[0];


                const hitPoseResult =
                    hit.getPose(
                        referenceSpace
                    );


                if (
                    hitPoseResult
                ) {

                    hitPose =
                        hitPoseResult;


                    /*
                     * Показываем reticle
                     */

                    reticle.style.display =
                        "block";


                    setStatus(
                        modelPlaced
                            ? "Объект размещён"
                            : "Поверхность найдена — нажмите «Поставить объект»"
                    );

                }

            }
            else {

                hitPose =
                    null;


                if (
                    !modelPlaced
                ) {

                    setStatus(
                        "Ищем поверхность..."
                    );

                }

            }

        }


        /*
         * Рендер Three.js
         */

        renderer.render(
            scene,
            camera
        );

    }


    /* =================================
       PLACE OBJECT
    ================================= */

    placeButton.addEventListener(
        "click",
        placeObject
    );


    function placeObject() {

        if (!model) {

            setStatus(
                "Модель ещё загружается..."
            );

            return;

        }


        if (!hitPose) {

            setStatus(
                "Сначала наведите камеру на пол."
            );

            return;

        }


        /*
         * Позиция поверхности
         */

        const position =
            hitPose.transform.position;


        /*
         * Поворот поверхности
         */

        const orientation =
            hitPose.transform.orientation;


        /*
         * Устанавливаем объект
         */

        model.position.set(
            position.x,
            position.y,
            position.z
        );


        model.quaternion.set(
            orientation.x,
            orientation.y,
            orientation.z,
            orientation.w
        );


        /*
         * Показываем
         */

        model.visible =
            true;


        modelPlaced =
            true;


        setStatus(
            "Объект размещён. Двигайтесь вокруг него."
        );


        /*
         * Reticle можно убрать
         */

        reticle.style.display =
            "none";

    }


    /* =================================
       EXIT AR
    ================================= */

    exitButton.addEventListener(
        "click",
        async () => {

            if (xrSession) {

                await xrSession.end();

            }

        }
    );


    /* =================================
       SESSION END
    ================================= */

    function onSessionEnd() {

        xrSession =
            null;


        hitTestSource =
            null;


        hitTestSourceRequested =
            false;


        hitPose =
            null;


        modelPlaced =
            false;


        if (model) {

            model.visible =
                false;

        }


        startScreen.style.display =
            "flex";


        canvas.style.display =
            "none";


        topUI.style.display =
            "none";


        reticle.style.display =
            "none";


        placeButton.style.display =
            "none";


        exitButton.style.display =
            "none";


        startButton.disabled =
            false;


        startButton.textContent =
            "Включить камеру";


        setStatus(
            "AR завершён."
        );

    }


    /* =================================
       INITIALIZATION
    ================================= */

    initThree();


    /*
     * Сначала проверяем WebXR.
     */

    checkAR();

</script>


</body>

</html>
