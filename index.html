<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="
        width=device-width,
        initial-scale=1,
        maximum-scale=1,
        user-scalable=no,
        viewport-fit=cover
    "
>

<meta
    name="theme-color"
    content="#000000"
>

<title>AR Creature</title>


<!-- Telegram Mini App -->

<script src="https://telegram.org/js/telegram-web-app.js?63"></script>


<style>

/* ==================================================
   BASE
================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    touch-action: none;

    -webkit-user-select: none;
    user-select: none;
}

body {
    position: fixed;
    inset: 0;
}


/* ==================================================
   APP
================================================== */

#app {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;
}


/* ==================================================
   START SCREEN
================================================== */

#startScreen {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    align-items: center;

    justify-content: center;

    padding:
        calc(
            20px +
            var(--tg-safe-top, 0px)
        )
        20px
        calc(
            20px +
            var(--tg-safe-bottom, 0px)
        );

    background:
        radial-gradient(
            circle at center,
            #252525 0%,
            #080808 60%,
            #000 100%
        );
}

.startContent {

    width: min(
        100%,
        430px
    );

    text-align: center;
}

.logo {

    width: 78px;

    height: 78px;

    margin:
        0 auto
        25px;

    display: flex;

    align-items: center;

    justify-content: center;

    border:
        1px solid
        rgba(255,255,255,.8);

    border-radius: 20px;

    font-size: 28px;

    font-weight: 700;
}

h1 {

    font-size:
        clamp(
            32px,
            10vw,
            58px
        );

    letter-spacing: 7px;

    margin-bottom: 12px;
}

.subtitle {

    color: #888;

    font-size: 14px;

    margin-bottom: 38px;
}

#startButton {

    width: 100%;

    min-height: 60px;

    border: 0;

    border-radius: 15px;

    background: #fff;

    color: #000;

    font-size: 15px;

    font-weight: 700;

    letter-spacing: .7px;

    -webkit-tap-highlight-color:
        transparent;
}

#startButton:active {

    transform: scale(.98);
}

#startStatus {

    min-height: 18px;

    margin-top: 17px;

    color: #777;

    font-size: 12px;
}


/* ==================================================
   CAMERA
================================================== */

#camera {

    position: fixed;

    inset: 0;

    z-index: 1;

    width: 100%;
    height: 100%;

    object-fit: cover;

    background: #000;

    display: none;
}


/* ==================================================
   THREE
================================================== */

#threeCanvas {

    position: fixed;

    inset: 0;

    z-index: 2;

    width: 100%;
    height: 100%;

    pointer-events: none;
}


/* ==================================================
   AR UI
================================================== */

#arUI {

    position: fixed;

    inset: 0;

    z-index: 20;

    display: none;

    pointer-events: none;
}


/* ==================================================
   TOP
================================================== */

.topBar {

    position: absolute;

    left: 12px;

    right: 12px;

    top:
        calc(
            12px +
            var(--tg-safe-top, 0px)
        );

    display: flex;

    align-items: center;

    justify-content:
        space-between;
}

.status {

    padding:
        9px
        14px;

    border-radius: 20px;

    background:
        rgba(0,0,0,.62);

    backdrop-filter:
        blur(10px);

    font-size: 12px;
}

.closeButton {

    width: 45px;

    height: 45px;

    border: 0;

    border-radius: 50%;

    background:
        rgba(0,0,0,.7);

    color: #fff;

    font-size: 29px;

    pointer-events: auto;
}


/* ==================================================
   CENTER
================================================== */

#centerMarker {

    position: absolute;

    left: 50%;

    top: 50%;

    width: 38px;

    height: 38px;

    transform:
        translate(
            -50%,
            -50%
        );

    border:
        1px solid
        rgba(255,255,255,.8);

    border-radius: 50%;

    opacity: .7;
}


/* ==================================================
   SENSOR DATA
================================================== */

#sensorPanel {

    position: absolute;

    left: 10px;

    top:
        calc(
            70px +
            var(--tg-safe-top, 0px)
        );

    width: 180px;

    padding: 10px;

    border-radius: 10px;

    background:
        rgba(0,0,0,.62);

    backdrop-filter:
        blur(10px);

    font-family:
        monospace;

    font-size: 9px;

    line-height: 1.5;

    color: #bbb;

    display: none;

    pointer-events: none;
}

.sensorTitle {

    color: #fff;

    font-weight: 700;

    margin-bottom: 2px;
}


/* ==================================================
   BOTTOM
================================================== */

.bottomBar {

    position: absolute;

    left: 18px;

    right: 18px;

    bottom:
        calc(
            18px +
            var(--tg-safe-bottom, 0px)
        );

    display: flex;

    flex-direction: column;

    gap: 9px;

    align-items: center;
}

.actionButton {

    width:
        min(
            100%,
            360px
        );

    min-height: 56px;

    border:
        1px solid
        rgba(255,255,255,.75);

    border-radius: 15px;

    background:
        rgba(0,0,0,.72);

    color: #fff;

    font-size: 14px;

    font-weight: 700;

    pointer-events: auto;
}

#placeButton {

    display: none;
}

#sendButton {

    font-size: 12px;

    min-height: 48px;
}


/* ==================================================
   ERROR
================================================== */

#errorScreen {

    position: fixed;

    inset: 0;

    z-index: 500;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 25px;

    background: #000;
}

.errorContent {

    width:
        min(
            100%,
            420px
        );

    text-align: center;
}

.errorContent h2 {

    margin-bottom: 15px;
}

#errorText {

    color: #999;

    line-height: 1.5;

    margin-bottom: 25px;
}

#errorBack {

    width: 100%;

    height: 55px;

    border:
        1px solid
        #fff;

    border-radius: 13px;

    background:
        transparent;

    color: #fff;
}

</style>

</head>


<body>


<div id="app">


<!-- ==================================================
     START
================================================== -->

<section id="startScreen">

    <div class="startContent">

        <div class="logo">
            AR
        </div>

        <h1>
            AR SPACE
        </h1>

        <div class="subtitle">
            Telegram AR
        </div>

        <button
            id="startButton"
            type="button"
        >
            ЗАПУСК КАМЕРЫ
        </button>

        <div id="startStatus">
            Готово
        </div>

    </div>

</section>


<!-- ==================================================
     CAMERA
================================================== -->

<video
    id="camera"
    autoplay
    muted
    playsinline
></video>


<!-- ==================================================
     THREE CANVAS
================================================== -->

<canvas id="threeCanvas"></canvas>


<!-- ==================================================
     AR UI
================================================== -->

<section id="arUI">


    <div class="topBar">

        <div
            id="status"
            class="status"
        >
            Камера
        </div>

        <button
            id="closeButton"
            class="closeButton"
            type="button"
        >
            ×
        </button>

    </div>


    <div id="centerMarker"></div>


    <!-- SENSOR DATA -->

    <div id="sensorPanel">


        <div class="sensorTitle">
            ORIENTATION
        </div>

        <div id="orientationData">
            α: 0<br>
            β: 0<br>
            γ: 0
        </div>


        <br>


        <div class="sensorTitle">
            GYROSCOPE
        </div>

        <div id="gyroData">
            X: 0<br>
            Y: 0<br>
            Z: 0
        </div>


        <br>


        <div class="sensorTitle">
            ACCELEROMETER
        </div>

        <div id="accelData">
            X: 0<br>
            Y: 0<br>
            Z: 0
        </div>


        <br>


        <div class="sensorTitle">
            GPS
        </div>

        <div id="gpsData">
            —
        </div>

    </div>


    <div class="bottomBar">

        <button
            id="placeButton"
            class="actionButton"
            type="button"
        >
            РАЗМЕСТИТЬ CREATURE
        </button>


        <button
            id="sendButton"
            class="actionButton"
            type="button"
        >
            ОТПРАВИТЬ ДАННЫЕ В TELEGRAM
        </button>

    </div>

</section>


<!-- ==================================================
     ERROR
================================================== -->

<section id="errorScreen">

    <div class="errorContent">

        <h2>
            Ошибка
        </h2>

        <p id="errorText"></p>

        <button
            id="errorBack"
            type="button"
        >
            НАЗАД
        </button>

    </div>

</section>


</div>


<script type="module">


/* ==================================================
   THREE.JS
================================================== */

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import { GLTFLoader } from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


/* ==================================================
   TELEGRAM
================================================== */

const tg =
    window.Telegram?.WebApp;


/* ==================================================
   ELEMENTS
================================================== */

const startScreen =
    document.getElementById(
        "startScreen"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const startStatus =
    document.getElementById(
        "startStatus"
    );

const cameraVideo =
    document.getElementById(
        "camera"
    );

const arUI =
    document.getElementById(
        "arUI"
    );

const statusUI =
    document.getElementById(
        "status"
    );

const closeButton =
    document.getElementById(
        "closeButton"
    );

const placeButton =
    document.getElementById(
        "placeButton"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const sensorPanel =
    document.getElementById(
        "sensorPanel"
    );

const errorScreen =
    document.getElementById(
        "errorScreen"
    );

const errorText =
    document.getElementById(
        "errorText"
    );

const errorBack =
    document.getElementById(
        "errorBack"
    );


/* ==================================================
   SENSOR UI
================================================== */

const orientationUI =
    document.getElementById(
        "orientationData"
    );

const gyroUI =
    document.getElementById(
        "gyroData"
    );

const accelUI =
    document.getElementById(
        "accelData"
    );

const gpsUI =
    document.getElementById(
        "gpsData"
    );


/* ==================================================
   STATE
================================================== */

let cameraStream = null;

let xrSession = null;

let xrReferenceSpace = null;

let hitTestSource = null;

let viewerSpace = null;

let hitTestReady = false;

let currentHit = null;

let model = null;

let modelAnchor = null;

let arStarted = false;


/* ==================================================
   DATA
================================================== */

const data = {

    orientation: {

        alpha: 0,

        beta: 0,

        gamma: 0,

        absolute: false

    },

    gyro: {

        x: 0,

        y: 0,

        z: 0

    },

    accelerometer: {

        x: 0,

        y: 0,

        z: 0

    },

    gps: {

        latitude: null,

        longitude: null,

        altitude: null,

        accuracy: null

    }

};


/* ==================================================
   TELEGRAM INIT
================================================== */

function initTelegram() {

    if (!tg) {

        startStatus.textContent =
            "Откройте страницу внутри Telegram";

        return;
    }


    tg.ready();


    /*
     * Fullscreen.
     */

    try {

        tg.requestFullscreen?.();

    } catch (_) {}


    /*
     * AR использует жесты,
     * поэтому вертикальный swipe
     * Telegram отключаем.
     */

    try {

        tg.disableVerticalSwipes?.();

    } catch (_) {}


    tg.setHeaderColor?.(
        "#000000"
    );

    tg.setBackgroundColor?.(
        "#000000"
    );


    updateSafeArea();


    tg.onEvent?.(
        "safeAreaChanged",
        updateSafeArea
    );


    tg.onEvent?.(
        "contentSafeAreaChanged",
        updateSafeArea
    );


    tg.onEvent?.(
        "viewportChanged",
        updateSafeArea
    );


    startStatus.textContent =
        "Telegram готов";
}


/* ==================================================
   SAFE AREA
================================================== */

function updateSafeArea() {

    if (!tg) {
        return;
    }


    const safe =
        tg.safeAreaInset || {};


    document.documentElement
        .style
        .setProperty(
            "--tg-safe-top",
            `${safe.top || 0}px`
        );


    document.documentElement
        .style
        .setProperty(
            "--tg-safe-bottom",
            `${safe.bottom || 0}px`
        );
}


/* ==================================================
   LOAD CREATURE
================================================== */

function loadCreature() {

    const loader =
        new GLTFLoader();


    loader.load(

        "./models/creature.glb",

        gltf => {

            model =
                gltf.scene;


            /*
             * Пока объект скрыт.
             */

            model.visible =
                false;


            /*
             * Добавляем сцену
             * в Three.js.
             */

            scene.add(
                model
            );


            console.log(
                "creature.glb loaded"
            );

        },

        progress => {

            if (
                progress.total
            ) {

                const percent =
                    Math.round(
                        progress.loaded /
                        progress.total *
                        100
                    );


                console.log(
                    "Creature:",
                    percent + "%"
                );
            }

        },

        error => {

            console.error(
                "creature.glb:",
                error
            );

            statusUI.textContent =
                "Ошибка creature.glb";
        }
    );
}


/* ==================================================
   THREE
================================================== */

let scene;

let threeCamera;

let renderer;


function initThree() {

    scene =
        new THREE.Scene();


    threeCamera =
        new THREE.PerspectiveCamera(
            60,
            innerWidth /
            innerHeight,
            0.01,
            1000
        );


    renderer =
        new THREE.WebGLRenderer({

            canvas:
                document.getElementById(
                    "threeCanvas"
                ),

            alpha: true,

            antialias: true,

            powerPreference:
                "high-performance"

        });


    renderer.setPixelRatio(
        Math.min(
            devicePixelRatio,
            2
        )
    );


    renderer.setSize(
        innerWidth,
        innerHeight
    );


    /*
     * XR включается,
     * только если Telegram/WebView
     * реально предоставляет WebXR.
     */

    renderer.xr.enabled =
        true;


    /* ==============================================
       LIGHT
    ============================================== */

    const hemisphere =
        new THREE.HemisphereLight(
            0xffffff,
            0x444444,
            2
        );


    scene.add(
        hemisphere
    );


    const directional =
        new THREE.DirectionalLight(
            0xffffff,
            2
        );


    directional.position.set(
        2,
        4,
        2
    );


    scene.add(
        directional
    );


    loadCreature();
}


/* ==================================================
   START CAMERA
================================================== */

async function startCamera() {

    if (arStarted) {
        return;
    }


    startButton.disabled =
        true;


    startStatus.textContent =
        "Запуск камеры...";


    try {

        /*
         * ВАЖНО:
         *
         * Камера запрашивается
         * непосредственно после
         * нажатия пользователя.
         */

        cameraStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal:
                                "environment"
                        },

                        width: {
                            ideal: 1920
                        },

                        height: {
                            ideal: 1080
                        },

                        frameRate: {
                            ideal: 30
                        }

                    },

                    audio: false

                });


        cameraVideo.srcObject =
            cameraStream;


        await cameraVideo.play();


        /*
         * Telegram Motion
         */

        startMotion();


        /*
         * Orientation lock
         */

        try {

            tg?.lockOrientation?.();

        } catch (_) {}


        /*
         * UI
         */

        startScreen.style.display =
            "none";


        cameraVideo.style.display =
            "block";


        arUI.style.display =
            "block";


        sensorPanel.style.display =
            "block";


        arStarted =
            true;


        statusUI.textContent =
            "КАМЕРА";


        /*
         * Пытаемся включить
         * настоящий WebXR AR.
         *
         * Никакой проверки
         * заранее нет.
         */

        await startWebXR();


    } catch (error) {

        console.error(
            "Camera:",
            error
        );


        startButton.disabled =
            false;


        showError(
            cameraError(error)
        );
    }
}


/* ==================================================
   CAMERA ERROR
================================================== */

function cameraError(error) {

    if (
        error?.name ===
        "NotAllowedError"
    ) {

        return (
            "Доступ к камере запрещён. " +
            "Разрешите использование камеры для Telegram."
        );
    }


    if (
        error?.name ===
        "NotFoundError"
    ) {

        return (
            "Камера не найдена."
        );
    }


    if (
        error?.name ===
        "SecurityError"
    ) {

        return (
            "Среда Telegram заблокировала доступ к камере."
        );
    }


    return (
        "Камера не запустилась: " +
        (
            error?.message ||
            "неизвестная ошибка"
        )
    );
}


/* ==================================================
   TELEGRAM MOTION
================================================== */

function startMotion() {

    if (!tg) {
        return;
    }


    /*
     * DEVICE ORIENTATION
     */

    if (
        tg.DeviceOrientation
    ) {

        tg.DeviceOrientation.start(

            {

                refresh_rate: 20,

                need_absolute: true

            },

            success => {

                console.log(
                    "Orientation started:",
                    success
                );

            }
        );


        tg.onEvent?.(
            "deviceOrientationChanged",
            updateOrientation
        );


        tg.onEvent?.(
            "deviceOrientationFailed",
            error => {

                console.log(
                    "Orientation failed:",
                    error
                );
            }
        );
    }


    /*
     * GYROSCOPE
     */

    if (
        tg.Gyroscope
    ) {

        tg.Gyroscope.start(

            {

                refresh_rate: 20

            },

            success => {

                console.log(
                    "Gyroscope started:",
                    success
                );

            }
        );


        tg.onEvent?.(
            "gyroscopeChanged",
            updateGyroscope
        );


        tg.onEvent?.(
            "gyroscopeFailed",
            error => {

                console.log(
                    "Gyroscope failed:",
                    error
                );
            }
        );
    }


    /*
     * ACCELEROMETER
     */

    if (
        tg.Accelerometer
    ) {

        tg.Accelerometer.start(

            {

                refresh_rate: 20

            },

            success => {

                console.log(
                    "Accelerometer started:",
                    success
                );

            }
        );


        tg.onEvent?.(
            "accelerometerChanged",
            updateAccelerometer
        );


        tg.onEvent?.(
            "accelerometerFailed",
            error => {

                console.log(
                    "Accelerometer failed:",
                    error
                );
            }
        );
    }


    /*
     * LOCATION
     */

    if (
        tg.LocationManager
    ) {

        tg.LocationManager.init(
            success => {

                console.log(
                    "Location:",
                    success
                );


                tg.LocationManager
                    .getLocation(
                        location => {

                            if (
                                !location
                            ) {
                                return;
                            }


                            data.gps = {

                                latitude:
                                    location.latitude,

                                longitude:
                                    location.longitude,

                                altitude:
                                    location.altitude,

                                accuracy:
                                    location.accuracy

                            };


                            updateGPS();
                        }
                    );
            }
        );
    }
}


/* ==================================================
   ORIENTATION
================================================== */

function updateOrientation() {

    const o =
        tg?.DeviceOrientation;


    if (!o) {
        return;
    }


    data.orientation = {

        alpha:
            Number(o.alpha) || 0,

        beta:
            Number(o.beta) || 0,

        gamma:
            Number(o.gamma) || 0,

        absolute:
            Boolean(o.absolute)

    };


    orientationUI.innerHTML =

        "α: " +
        data.orientation.alpha.toFixed(3) +

        "<br>" +

        "β: " +
        data.orientation.beta.toFixed(3) +

        "<br>" +

        "γ: " +
        data.orientation.gamma.toFixed(3);
}


/* ==================================================
   GYRO
================================================== */

function updateGyroscope() {

    const g =
        tg?.Gyroscope;


    if (!g) {
        return;
    }


    data.gyro = {

        x:
            Number(g.x) || 0,

        y:
            Number(g.y) || 0,

        z:
            Number(g.z) || 0

    };


    gyroUI.innerHTML =

        "X: " +
        data.gyro.x.toFixed(3) +

        "<br>" +

        "Y: " +
        data.gyro.y.toFixed(3) +

        "<br>" +

        "Z: " +
        data.gyro.z.toFixed(3);
}


/* ==================================================
   ACCELEROMETER
================================================== */

function updateAccelerometer() {

    const a =
        tg?.Accelerometer;


    if (!a) {
        return;
    }


    data.accelerometer = {

        x:
            Number(a.x) || 0,

        y:
            Number(a.y) || 0,

        z:
            Number(a.z) || 0

    };


    accelUI.innerHTML =

        "X: " +
        data.accelerometer.x.toFixed(3) +

        "<br>" +

        "Y: " +
        data.accelerometer.y.toFixed(3) +

        "<br>" +

        "Z: " +
        data.accelerometer.z.toFixed(3);
}


/* ==================================================
   GPS
================================================== */

function updateGPS() {

    const g =
        data.gps;


    if (
        g.latitude === null
    ) {

        gpsUI.textContent =
            "—";

        return;
    }


    gpsUI.innerHTML =

        "LAT: " +
        Number(
            g.latitude
        ).toFixed(6) +

        "<br>" +

        "LON: " +
        Number(
            g.longitude
        ).toFixed(6) +

        "<br>" +

        "ACC: " +
        Number(
            g.accuracy || 0
        ).toFixed(1) +
        " m";
}


/* ==================================================
   WEBXR
================================================== */

async function startWebXR() {

    /*
     * Не проверяем устройство.
     *
     * Просто пытаемся.
     */

    if (
        !navigator.xr
    ) {

        statusUI.textContent =
            "КАМЕРА + MOTION";

        return;
    }


    try {

        xrSession =
            await navigator.xr
                .requestSession(
                    "immersive-ar",
                    {

                        requiredFeatures: [
                            "local-floor",
                            "hit-test"
                        ],

                        optionalFeatures: [
                            "anchors",
                            "dom-overlay"
                        ],

                        domOverlay: {
                            root:
                                document.body
                        }

                    }
                );


        /*
         * После успешного WebXR
         * стандартный getUserMedia
         * больше не нужен.
         */

        if (
            cameraStream
        ) {

            cameraStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

            cameraStream =
                null;
        }


        cameraVideo.style.display =
            "none";


        renderer.xr.setReferenceSpaceType(
            "local-floor"
        );


        await renderer.xr.setSession(
            xrSession
        );


        statusUI.textContent =
            "AR TRACKING";


        /*
         * Reference space
         */

        xrReferenceSpace =
            renderer.xr.getReferenceSpace();


        /*
         * Hit test source
         */

        viewerSpace =
            await xrSession
                .requestReferenceSpace(
                    "viewer"
                );


        hitTestSource =
            await xrSession
                .requestHitTestSource({

                    space:
                        viewerSpace

                });


        hitTestReady =
            true;


        xrSession.addEventListener(
            "end",
            onXREnd
        );


        /*
         * Render loop
         */

        renderer.setAnimationLoop(
            renderXR
        );


    } catch (error) {

        /*
         * WebXR недоступен.
         *
         * Это НЕ ошибка камеры.
         *
         * Оставляем обычную
         * камеру + Telegram sensors.
         */

        console.log(
            "WebXR unavailable:",
            error
        );


        statusUI.textContent =
            "КАМЕРА + MOTION";
    }
}


/* ==================================================
   XR RENDER
================================================== */

function renderXR(
    time,
    frame
) {

    if (
        !frame ||
        !xrReferenceSpace
    ) {

        return;
    }


    /*
     * HIT TEST
     */

    if (
        hitTestSource &&
        !modelAnchor
    ) {

        const results =
            frame.getHitTestResults(
                hitTestSource
            );


        currentHit =
            results.length
                ? results[0]
                : null;


        if (
            currentHit
        ) {

            document
                .getElementById(
                    "centerMarker"
                )
                .style.borderColor =
                "#ffffff";


            statusUI.textContent =
                "ПОВЕРХНОСТЬ НАЙДЕНА";

        } else {

            statusUI.textContent =
                "ИЩЕМ ПОВЕРХНОСТЬ";
        }
    }


    /*
     * ANCHOR
     */

    if (
        modelAnchor
    ) {

        const pose =
            frame.getPose(
                modelAnchor.anchorSpace,
                xrReferenceSpace
            );


        if (
            pose &&
            model
        ) {

            model.matrix
                .fromArray(
                    pose.transform.matrix
                );


            model.matrix.decompose(

                model.position,

                model.quaternion,

                model.scale

            );
        }
    }


    renderer.render(
        scene,
        threeCamera
    );
}


/* ==================================================
   PLACE CREATURE
================================================== */

async function placeCreature() {

    if (!model) {

        statusUI.textContent =
            "creature.glb ещё загружается";

        return;
    }


    /*
     * Настоящий WebXR
     */

    if (
        xrSession &&
        currentHit
    ) {

        try {

            /*
             * Создаём настоящий
             * XR Anchor из найденной
             * поверхности.
             */

            if (
                typeof currentHit
                    .createAnchor ===
                "function"
            ) {

                modelAnchor =
                    await currentHit
                        .createAnchor();


                model.visible =
                    true;


                /*
                 * Первоначальная позиция
                 */

                const pose =
                    currentHit.getPose(
                        xrReferenceSpace
                    );


                if (pose) {

                    model.matrix
                        .fromArray(
                            pose.transform.matrix
                        );


                    model.matrix.decompose(

                        model.position,

                        model.quaternion,

                        model.scale

                    );
                }


                objectPlaced =
                    true;


                placeButton.style.display =
                    "none";


                statusUI.textContent =
                    "CREATURE ЗАКРЕПЛЁН";


                return;
            }


            /*
             * Fallback:
             * anchor API нет,
             * но hit-test есть.
             */

            const pose =
                currentHit.getPose(
                    xrReferenceSpace
                );


            if (pose) {

                model.position.setFromMatrixPosition(
                    new THREE.Matrix4()
                        .fromArray(
                            pose.transform.matrix
                        )
                );


                model.visible =
                    true;


                objectPlaced =
                    true;


                placeButton.style.display =
                    "none";


                statusUI.textContent =
                    "CREATURE РАЗМЕЩЁН";
            }


        } catch (error) {

            console.error(
                "Anchor:",
                error
            );
        }


        return;
    }


    /*
     * Если WebXR недоступен.
     *
     * Можно показать модель
     * в локальной сцене,
     * но это НЕ настоящий
     * world tracking.
     */

    if (
        !xrSession
    ) {

        model.visible =
            true;


        model.position.set(
            0,
            0,
            -2
        );


        objectPlaced =
            true;


        placeButton.style.display =
            "none";


        statusUI.textContent =
            "LOCAL AR";


        return;
    }
}


/* ==================================================
   SEND DATA TO TELEGRAM
================================================== */

function sendDataToTelegram() {

    if (!tg) {

        return;
    }


    const payload = {

        type:
            "ar_creature",

        timestamp:
            Date.now(),

        orientation:
            data.orientation,

        gyroscope:
            data.gyro,

        accelerometer:
            data.accelerometer,

        gps:
            data.gps,

        object:
            "creature.glb",

        placed:
            objectPlaced,

        ar:
            Boolean(xrSession)

    };


    const json =
        JSON.stringify(
            payload
        );


    /*
     * Telegram Mini App
     * → Bot
     */

    try {

        tg.sendData(
            json
        );

    } catch (error) {

        console.error(
            "sendData:",
            error
        );
    }
}


/* ==================================================
   XR END
================================================== */

function onXREnd() {

    xrSession =
        null;


    hitTestSource =
        null;


    viewerSpace =
        null;


    xrReferenceSpace =
        null;


    hitTestReady =
        false;


    modelAnchor =
        null;


    renderer.setAnimationLoop(
        null
    );


    statusUI.textContent =
        "AR завершён";
}


/* ==================================================
   CLOSE
================================================== */

async function closeAR() {

    /*
     * XR
     */

    if (
        xrSession
    ) {

        try {

            await xrSession.end();

        } catch (_) {}

    }


    /*
     * Camera
     */

    if (
        cameraStream
    ) {

        cameraStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        cameraStream =
            null;
    }


    cameraVideo.srcObject =
        null;


    /*
     * Telegram sensors
     */

    try {

        tg?.DeviceOrientation
            ?.stop?.();

        tg?.Gyroscope
            ?.stop?.();

        tg?.Accelerometer
            ?.stop?.();

    } catch (_) {}


    try {

        tg?.unlockOrientation?.();

        tg?.exitFullscreen?.();

    } catch (_) {}


    arStarted =
        false;


    objectPlaced =
        false;


    modelAnchor =
        null;


    if (model) {

        model.visible =
            false;
    }


    cameraVideo.style.display =
        "none";


    arUI.style.display =
        "none";


    sensorPanel.style.display =
        "none";


    startScreen.style.display =
        "flex";


    startButton.disabled =
        false;


    startStatus.textContent =
        "Готово";
}


/* ==================================================
   ERROR
================================================== */

function showError(text) {

    errorText.textContent =
        text;


    errorScreen.style.display =
        "flex";
}


errorBack.addEventListener(
    "click",
    () => {

        errorScreen.style.display =
            "none";

        startButton.disabled =
            false;

    }
);


/* ==================================================
   EVENTS
================================================== */

startButton.addEventListener(
    "click",
    startCamera
);


placeButton.addEventListener(
    "click",
    placeCreature
);


sendButton.addEventListener(
    "click",
    sendDataToTelegram
);


closeButton.addEventListener(
    "click",
    closeAR
);


/* ==================================================
   RESIZE
================================================== */

window.addEventListener(
    "resize",
    () => {

        if (!renderer) {
            return;
        }


        renderer.setSize(
            innerWidth,
            innerHeight
        );


        threeCamera.aspect =
            innerWidth /
            innerHeight;


        threeCamera.updateProjectionMatrix();
    }
);


/* ==================================================
   INIT
================================================== */

initTelegram();

initThree();

</script>
