<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Arai Camera Game — 3D Rooms</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808;color:#eee;font-family:Arial,sans-serif}
#app{width:100%;height:100%;position:relative}
#scene{position:absolute;inset:0}
#ui{position:absolute;left:16px;top:16px;width:min(380px,calc(100% - 32px));
background:rgba(10,10,10,.88);border:1px solid #333;border-radius:12px;padding:14px;z-index:5;
backdrop-filter:blur(10px)}
h1{font-size:16px;margin:0 0 12px}
.row{display:flex;gap:8px;margin-bottom:8px}
select,button{height:38px;border:1px solid #444;border-radius:7px;background:#171717;color:#fff;padding:0 10px}
select{flex:1;min-width:0}
button{cursor:pointer}
button:hover{background:#242424}
#status{font-size:12px;color:#aaa;line-height:1.45;white-space:pre-wrap}
#files{margin-top:10px;border-top:1px solid #333;padding-top:10px;font-size:12px}
.file{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid #222}
.badge{color:#aaa}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
background:rgba(0,0,0,.65);z-index:10;font-size:14px}
.hidden{display:none!important}
#error{color:#ff7777;margin-top:8px}
</style>
</head>
<body>
<div id="app">
  <div id="scene"></div>

  <div id="ui">
    <h1>ARAI CAMERA GAME / 3D ROOMS</h1>
    <div class="row">
      <select id="roomSelect"><option>Загрузка комнат...</option></select>
      <button id="reload">Обновить</button>
    </div>
    <div class="row">
      <button id="load" style="width:100%">Загрузить 3D модель</button>
    </div>
    <div id="status">Подключение к серверу...</div>
    <div id="error"></div>
    <div id="files"></div>
  </div>

  <div id="loading" class="hidden">Загрузка 3D модели и текстур...</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const API = "https://api.araicameragame.party";

const roomSelect = document.getElementById("roomSelect");
const statusEl = document.getElementById("status");
const errorEl = document.getElementById("error");
const filesEl = document.getElementById("files");
const loadingEl = document.getElementById("loading");

let rooms = [];
let currentModel = null;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x090909);

const camera = new THREE.PerspectiveCamera(
  60, window.innerWidth / window.innerHeight, 0.01, 1000
);
camera.position.set(0, 1.6, 4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById("scene").appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.enableDamping = true;

const loader = new GLTFLoader();

function setStatus(text) {
  statusEl.textContent = text;
}

function setError(text) {
  errorEl.textContent = text || "";
}

function showLoading(value) {
  loadingEl.classList.toggle("hidden", !value);
}

function selectedRoom() {
  return rooms.find(r => r.name === roomSelect.value) || null;
}

async function getJSON(url) {
  const response = await fetch(url, { cache: "no-store" });
  if (!response.ok) {
    throw new Error(`HTTP ${response.status}: ${url}`);
  }
  return response.json();
}

async function loadRooms() {
  setError("");
  setStatus("Получение /api/rooms ...");

  try {
    const data = await getJSON(`${API}/api/rooms`);

    if (!data.success || !Array.isArray(data.rooms)) {
      throw new Error("Сервер не вернул список rooms.");
    }

    rooms = data.rooms;
    roomSelect.innerHTML = "";

    if (!rooms.length) {
      roomSelect.innerHTML = "<option>Нет комнат</option>";
      setStatus("Сервер доступен, но комнаты не найдены.");
      filesEl.innerHTML = "";
      return;
    }

    for (const room of rooms) {
      const option = document.createElement("option");
      option.value = room.name;
      option.textContent = room.name;
      roomSelect.appendChild(option);
    }

    updateRoomInfo();
    setStatus(`Комнат найдено: ${rooms.length}`);
  } catch (error) {
    setError(`Ошибка получения комнат: ${error.message}`);
    setStatus("Не удалось получить данные сервера.");
  }
}

function updateRoomInfo() {
  const room = selectedRoom();
  if (!room) {
    filesEl.innerHTML = "";
    return;
  }

  const model = room.model || {};
  const textures = Array.isArray(model.textures) ? model.textures : [];

  let html = `
    <div><b>Комната:</b> ${escapeHtml(room.name || "")}</div>
    <div><b>Модель:</b> ${escapeHtml(model.filename || "не найдена")}</div>
    <div><b>Формат:</b> ${escapeHtml(model.extension || "—")}</div>
    <div><b>Текстур модели:</b> ${textures.length}</div>
    <div style="margin-top:8px">
  `;

  for (const texture of textures) {
    html += `
      <div class="file">
        <span>${escapeHtml(texture.filename || "")}</span>
        <span class="badge">${formatBytes(texture.size)}</span>
      </div>
    `;
  }

  html += "</div>";
  filesEl.innerHTML = html;
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function formatBytes(value) {
  const n = Number(value || 0);
  if (!n) return "—";
  if (n < 1024) return `${n} B`;
  if (n < 1024 ** 2) return `${(n/1024).toFixed(1)} KB`;
  if (n < 1024 ** 3) return `${(n/1024**2).toFixed(1)} MB`;
  return `${(n/1024**3).toFixed(1)} GB`;
}

/*
 * Основной путь:
 * сервер уже отдаёт model.url и список model.textures.
 * GLTFLoader получает GLB по model.url.
 *
 * Для внешних текстур сервер имеет /api/rooms/model-resource/...
 * и manifest содержит resource_base_url / texture URL.
 */
function prepareModelUrl(room) {
  const model = room?.model;
  if (!model) return null;

  if (model.url) {
    return new URL(model.url, API).href;
  }

  return null;
}

function resolveResourceUrl(url, room, model) {
  if (!url) return null;

  if (/^data:/i.test(url) || /^https?:\/\//i.test(url) || /^blob:/i.test(url)) {
    return url;
  }

  if (model?.resource_base_url) {
    return new URL(url, new URL(model.resource_base_url, API)).href;
  }

  return new URL(url, API).href;
}

function configureLoaderForRoom(room) {
  const model = room?.model || {};

  /*
   * GLTFLoader автоматически запрашивает URI текстур,
   * записанные внутри GLB.
   *
   * Серверный API имеет отдельный endpoint model-resource,
   * поэтому устанавливаем resourcePath на resource_base_url.
   */
  if (model.resource_base_url) {
    loader.setResourcePath(new URL(model.resource_base_url, API).href);
  } else {
    loader.setResourcePath("");
  }
}

function removeCurrentModel() {
  if (!currentModel) return;

  scene.remove(currentModel);

  currentModel.traverse(object => {
    if (object.isMesh) {
      object.geometry?.dispose();

      if (Array.isArray(object.material)) {
        object.material.forEach(disposeMaterial);
      } else {
        disposeMaterial(object.material);
      }
    }
  });

  currentModel = null;
}

function disposeMaterial(material) {
  if (!material) return;

  for (const key of [
    "map", "normalMap", "roughnessMap", "metalnessMap",
    "aoMap", "emissiveMap", "alphaMap", "bumpMap",
    "displacementMap"
  ]) {
    const texture = material[key];
    if (texture) texture.dispose();
  }

  material.dispose?.();
}

async function loadSelectedRoomModel() {
  const room = selectedRoom();

  if (!room) {
    setError("Комната не выбрана.");
    return;
  }

  const model = room.model;

  if (!model || !model.url) {
    setError("У выбранной комнаты нет 3D модели.");
    return;
  }

  setError("");
  showLoading(true);
  setStatus(`Загрузка модели: ${model.filename || "model.glb"}`);

  try {
    removeCurrentModel();
    configureLoaderForRoom(room);

    const modelUrl = prepareModelUrl(room);

    const gltf = await loader.loadAsync(modelUrl);
    currentModel = gltf.scene;

    /*
     * Не добавляем искусственный свет:
     * если модель содержит свои материалы/эмиссию, они остаются.
     * Для корректного отображения PBR добавляем только ambient
     * непосредственно в Three.js сцену без изменения файлов модели.
     */
    const ambient = new THREE.AmbientLight(0xffffff, 1.4);
    ambient.name = "__viewer_ambient__";
    scene.add(ambient);

    currentModel.traverse(object => {
      if (object.isMesh) {
        object.castShadow = false;
        object.receiveShadow = false;

        if (object.material) {
          const materials = Array.isArray(object.material)
            ? object.material
            : [object.material];

          materials.forEach(material => {
            material.needsUpdate = true;

            if (material.map) {
              material.map.colorSpace = THREE.SRGBColorSpace;
            }

            if (material.emissiveMap) {
              material.emissiveMap.colorSpace = THREE.SRGBColorSpace;
            }
          });
        }
      }
    });

    scene.add(currentModel);

    centerModel(currentModel);

    setStatus(
      `Модель загружена.\n` +
      `Файл: ${model.filename}\n` +
      `Текстур в manifest: ${(model.textures || []).length}\n` +
      `URL модели: ${modelUrl}`
    );
  } catch (error) {
    console.error(error);
    setError(`Ошибка загрузки 3D модели/текстур: ${error.message}`);
    setStatus("Загрузка завершилась ошибкой.");
  } finally {
    showLoading(false);
  }
}

function centerModel(model) {
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());

  model.position.sub(center);

  const maxSize = Math.max(size.x, size.y, size.z);
  if (maxSize > 0) {
    const scale = 2.5 / maxSize;
    model.scale.setScalar(scale);
  }

  controls.target.set(0, 0, 0);
  camera.position.set(0, 1.5, 4);
  controls.update();
}

roomSelect.addEventListener("change", updateRoomInfo);

document.getElementById("reload").addEventListener("click", loadRooms);
document.getElementById("load").addEventListener("click", loadSelectedRoomModel);

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

animate();
loadRooms();
</script>
</body>
</html>
