<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AR Gallery</title>

<script src="https://unpkg.com/@tonconnect/ui@3.0.0/dist/tonconnect-ui.min.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
button,input{font:inherit}
button{cursor:pointer;border:0}
.screen{position:fixed;inset:0;display:none;background:#000}
.screen.active{display:flex}
.center{align-items:center;justify-content:center;padding:20px}
.panel{width:320px;max-width:100%}
.title{text-align:center;font-size:28px;font-weight:400;margin-bottom:30px}
.button{width:100%;height:52px;margin-bottom:8px;background:#080808;color:#fff;border:1px solid #242424;text-align:left;padding:0 16px;font-size:13px}
.button:hover{background:#111}
.primary{background:#fff;color:#000;border-color:#fff}
.telegramInfo{min-height:16px;margin:-2px 0 8px}.status{text-align:center;color:#666;font-size:12px;line-height:1.45;min-height:20px;margin-top:14px;white-space:pre-line}
.page{flex-direction:column;padding:14px 18px 18px}
.header{position:relative;width:100%;height:48px;display:flex;align-items:center;flex-shrink:0}
.back{width:40px;height:40px;background:#080808;color:#fff;border:1px solid #242424;font-size:22px}
.pageTitle{position:absolute;left:50%;transform:translateX(-50%);font-size:14px}
.grid{width:100%;max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;overflow:auto;padding-bottom:10px}
.roomItem{min-height:110px;background:#080808;color:#fff;border:1px solid #202020;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;font-size:22px}
.roomItem small{color:#666;font-size:9px;letter-spacing:1px}
#roomViewerScreen{overflow:hidden;touch-action:none}
#roomCanvas{position:absolute;inset:0}
#roomCanvas canvas{display:block;width:100%;height:100%;touch-action:none}
.roomHeader{position:absolute;z-index:20;top:14px;left:14px;right:14px;height:40px;display:flex;align-items:center}
.roomTitle{position:absolute;left:50%;transform:translateX(-50%);font-size:14px}
.roomStatus{position:absolute;z-index:25;left:50%;top:76px;transform:translateX(-50%);width:min(88vw,560px);padding:12px 14px;background:rgba(0,0,0,.78);border:1px solid rgba(255,255,255,.14);color:#bbb;text-align:center;font-size:11px;line-height:1.45;white-space:pre-line;pointer-events:none}
.roomControls{position:absolute;z-index:30;left:0;right:0;bottom:16px;height:128px;padding:0 12px;display:flex;align-items:flex-end;justify-content:space-between;pointer-events:none}
.movePad{width:112px;height:112px;border:1px solid rgba(255,255,255,.2);border-radius:50%;background:rgba(8,8,8,.45);position:relative;pointer-events:auto;touch-action:none}
.movePad:before{content:"";position:absolute;left:50%;top:50%;width:68px;height:68px;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.1);border-radius:50%}
.moveKnob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.14);transform:translate3d(0,0,0)}
.lookPad{width:min(42vw,300px);height:112px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:rgba(8,8,8,.22);position:relative;pointer-events:auto;touch-action:none}
.lookLabel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.28);font-size:9px;letter-spacing:1px;pointer-events:none}
.vertical{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;pointer-events:auto}
.vbtn,.roll,.reset{width:42px;height:42px;background:rgba(8,8,8,.72);color:#fff;border:1px solid rgba(255,255,255,.24);font-size:17px;touch-action:none}
.rolls{position:absolute;left:50%;top:58px;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto}
.roll{width:38px;height:34px;font-size:14px}
.reset{position:absolute;right:12px;top:-50px;width:40px;height:40px}
.axis{position:absolute;left:50%;top:30px;transform:translateX(-50%);color:rgba(255,255,255,.34);font-size:8px}
#generationScreen{align-items:center;justify-content:center;padding:20px}
.code{width:100%;height:58px;background:#050505;color:#fff;border:1px solid #292929;outline:0;padding:0 16px;font-size:24px;letter-spacing:8px;text-align:center}
.send{width:100%;height:52px;margin-top:8px;background:#fff;color:#000;border:1px solid #fff;font-size:13px}
.send:disabled{opacity:.25}
.userBlock{padding:18px;background:#080808;border:1px solid #242424}
.userLabel{margin-bottom:10px;color:#666;font-size:11px}
.userAddress{font-size:12px;line-height:1.5;word-break:break-all}
#loading{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;background:#000;color:#777;font-size:11px}
#loading.active{display:flex}
@media(max-width:500px){
 .title{font-size:24px}.grid{grid-template-columns:repeat(2,1fr)}
 .movePad{width:100px;height:100px}.lookPad{width:43vw;height:100px}
 .roomControls{height:112px;bottom:calc(10px + env(safe-area-inset-bottom));padding:0 8px}
 .vertical{bottom:20px}.reset{right:8px}
}
</style>
</head>

<body>

<section id="authScreen" class="screen active center">
 <div class="panel">
  <div class="title">AR Gallery</div>
  <button id="connectWallet" class="button primary">ПОДКЛЮЧИТЬ КОШЕЛЁК</button>
  <div id="authStatus" class="status">Подключите TON-кошелёк</div>
 </div>
</section>

<section id="homeScreen" class="screen center">
 <div class="panel">
  <div class="title">AR Gallery</div>
  <button id="openRoom" class="button">ROOM</button>
  <button id="openGeneration" class="button">ГЕНЕРАЦИЯ</button>
  <button id="openUser" class="button">ПОЛЬЗОВАТЕЛЬ</button>
 </div>
</section>

<section id="roomScreen" class="screen page">
 <div class="header">
  <button id="roomBack" class="back">←</button><div class="pageTitle">ROOM</div>
 </div>
 <div id="roomStatusList" class="status">Загрузка комнат...</div>
 <div id="roomGrid" class="grid"></div>
</section>

<section id="roomViewerScreen" class="screen">
 <div id="roomCanvas"></div>
 <div class="roomHeader">
  <button id="roomViewerBack" class="back">←</button>
  <div id="roomViewerTitle" class="roomTitle">ROOM</div>
 </div>
 <div id="roomViewerStatus" class="roomStatus">Загрузка комнаты...</div>
 <div class="roomControls">
  <div id="roomMovePad" class="movePad"><div id="roomMoveKnob" class="moveKnob"></div></div>
  <div id="roomLookPad" class="lookPad"><div class="lookLabel">ПОВОРОТ / НАКЛОН</div></div>
  <div class="vertical">
   <div class="axis">ВЫСОТА</div>
   <button id="roomMoveUp" class="vbtn">↑</button>
   <button id="roomMoveDown" class="vbtn">↓</button>
  </div>
  <div class="rolls">
   <button id="roomRollLeft" class="roll">↶</button>
   <button id="roomRollRight" class="roll">↷</button>
  </div>
  <button id="roomReset" class="reset">⟳</button>
 </div>
</section>

<section id="generationScreen" class="screen center">
 <div class="panel">
  <div class="title" style="font-size:20px">ГЕНЕРАЦИЯ</div>
  <input id="generationCode" class="code" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="00000">
  <button id="generationSubmit" class="send" disabled>ОТПРАВИТЬ</button>
  <div id="generationStatus" class="status"></div>
 </div>
 <button id="generationBack" class="back" style="position:fixed;top:14px;left:14px">←</button>
</section>

<section id="userScreen" class="screen page">
 <div class="header">
  <button id="userBack" class="back">←</button><div class="pageTitle">ПОЛЬЗОВАТЕЛЬ</div>
 </div>
 <div class="panel" style="margin:auto">
  <div class="userBlock">
   <div class="userLabel">TON-КОШЕЛЁК</div>
   <div id="userWalletAddress" class="userAddress"></div>
  </div>
  <button id="disconnectWallet" class="button">ВЫЙТИ ИЗ КОШЕЛЬКА</button>
  <div id="userStatus" class="status"></div>
 </div>
</section>

<div id="loading"><div>ПРОВЕРКА NFT</div></div>

<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";

/* ================= CONFIG ================= */
const TON_MANIFEST="https://roman22022000.github.io/Ton_site/tonconnect-manifest.json";
const REQUIRED_COLLECTION="EQD9mm3hx-QvHyNG18gDaaJtSTTQTVVYVjJ6zhonXocj2eyI";
const REQUIRED_COLLECTION_RAW="0:fd9a6de1c7e42f1d8346d7c80369a26d4934d04d5558563eb38689d7a1c8f6";
const GENERATION_API="https://api.araicameragame.party/api/generation";
const ROOMS_API="https://api.araicameragame.party/api/rooms";

const ROOM_LENGTH=7,ROOM_WIDTH=6,ROOM_HEIGHT=4;
const ROOM_EYE_HEIGHT=1.65,ROOM_SPEED=2.7,ROOM_LOOK_SPEED=.006,ROOM_CAMERA_RADIUS=.18;

/* ================= DOM ================= */
const $=id=>document.getElementById(id);
const authScreen=$("authScreen"),homeScreen=$("homeScreen"),roomScreen=$("roomScreen");
const roomViewerScreen=$("roomViewerScreen"),generationScreen=$("generationScreen"),userScreen=$("userScreen");
const authStatus=$("authStatus"),loading=$("loading"),userWalletAddress=$("userWalletAddress"),userStatus=$("userStatus");
const roomGrid=$("roomGrid"),roomStatusList=$("roomStatusList"),roomViewerStatus=$("roomViewerStatus"),roomViewerTitle=$("roomViewerTitle");
const roomCanvas=$("roomCanvas"),roomMovePad=$("roomMovePad"),roomMoveKnob=$("roomMoveKnob"),roomLookPad=$("roomLookPad");
const roomMoveUp=$("roomMoveUp"),roomMoveDown=$("roomMoveDown"),roomRollLeft=$("roomRollLeft"),roomRollRight=$("roomRollRight"),roomReset=$("roomReset");
const generationCode=$("generationCode"),generationSubmit=$("generationSubmit"),generationStatus=$("generationStatus");
const telegramLogin=$("telegramLogin"),telegramInfo=$("telegramInfo");
const telegramWebApp=window.Telegram?.WebApp||null;
let telegramUser=null;

function show(screen){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));screen.classList.add("active")}
function roomStatus(text,on=true){roomViewerStatus.textContent=text||"";roomViewerStatus.style.display=on?"block":"none"}

/* ================= TELEGRAM LOGIN ================= */
function applyTelegramUser(user){
 if(!user||!user.id)return;
 telegramUser={
  id:Number(user.id),
  first_name:String(user.first_name||""),
  last_name:String(user.last_name||""),
  username:String(user.username||""),
  language_code:String(user.language_code||"")
 };
 try{sessionStorage.setItem("ar_gallery_telegram_user",JSON.stringify(telegramUser))}catch{}
 const name=[telegramUser.first_name,telegramUser.last_name].filter(Boolean).join(" ");
 telegramInfo.textContent=telegramUser.username?`Telegram: @${telegramUser.username}`:`Telegram: ${name||telegramUser.id}`;
}
try{
 const saved=sessionStorage.getItem("ar_gallery_telegram_user");
 if(saved)applyTelegramUser(JSON.parse(saved));
}catch{}
if(telegramWebApp){
 try{
  telegramWebApp.ready();telegramWebApp.expand();
  telegramWebApp.disableVerticalSwipes?.();
  if(telegramWebApp.initDataUnsafe?.user)applyTelegramUser(telegramWebApp.initDataUnsafe.user);
 }catch(e){console.warn("Telegram WebApp:",e)}
}
telegramLogin.onclick=()=>{
 if(telegramWebApp?.initDataUnsafe?.user){
  applyTelegramUser(telegramWebApp.initDataUnsafe.user);
  return;
 }
 telegramInfo.textContent="Откройте сайт внутри Telegram WebApp";
};

/* ================= TON / NFT ================= */
function b64Bytes(v){
 let s=String(v).replace(/-/g,"+").replace(/_/g,"/");
 while(s.length%4)s+="=";
 const b=atob(s),a=new Uint8Array(b.length);
 for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);
 return a;
}
function normalizeTonAddress(address){
 if(!address)return "";
 address=String(address).trim();
 if(/^-?\d+:[0-9a-fA-F]{64}$/.test(address)){
  const p=address.split(":");return p[0]+":"+p[1].toLowerCase();
 }
 try{
  const b=b64Bytes(address);if(b.length!==36)return address.toLowerCase();
  let wc=b[1];if(wc===255)wc=-1;
  let h="";for(let i=2;i<34;i++)h+=b[i].toString(16).padStart(2,"0");
  return wc+":"+h.toLowerCase();
 }catch{return address.toLowerCase()}
}
const requiredCollection=normalizeTonAddress(REQUIRED_COLLECTION);

async function checkCollectionNFT(wallet){
 const r=await fetch("https://tonapi.io/v2/accounts/"+encodeURIComponent(wallet)+"/nfts?limit=1000",{headers:{Accept:"application/json"}});
 if(!r.ok)throw new Error("TonAPI HTTP "+r.status);
 const d=await r.json(),items=Array.isArray(d.nft_items)?d.nft_items:[];
 return items.some(n=>{
  const a=n.collection?.address||n.collection_address||"";
  const x=normalizeTonAddress(a);
  return x===requiredCollection||x===REQUIRED_COLLECTION_RAW;
 });
}

let currentWallet=null,accessGranted=false,checkingNFT=false;
async function processWallet(wallet){
 if(!wallet){
  currentWallet=null;accessGranted=false;userWalletAddress.textContent="";
  authStatus.textContent="Подключите TON-кошелёк";show(authScreen);return;
 }
 if(checkingNFT||!wallet.account?.address)return;
 currentWallet=wallet.account.address;accessGranted=false;checkingNFT=true;
 authStatus.textContent="Проверка NFT...";loading.classList.add("active");
 try{
  if(!await checkCollectionNFT(currentWallet)){
   authStatus.textContent="NFT нужной коллекции не найден";show(authScreen);return;
  }
  accessGranted=true;userWalletAddress.textContent=currentWallet;
  authStatus.textContent="Доступ разрешён";show(homeScreen);
 }catch(e){
  console.error("NFT CHECK ERROR:",e);authStatus.textContent="Ошибка проверки NFT";show(authScreen);
 }finally{checkingNFT=false;loading.classList.remove("active")}
}
function requireAccess(){
 if(!accessGranted||!currentWallet){authStatus.textContent="Доступ закрыт";show(authScreen);return false}
 return true;
}

if(!window.TON_CONNECT_UI)throw new Error("TON Connect UI не загрузился");
const tonConnectUI=new TON_CONNECT_UI.TonConnectUI({manifestUrl:TON_MANIFEST,buttonRootId:null,restoreConnection:true});
tonConnectUI.uiOptions={language:"ru",uiPreferences:{theme:"DARK",borderRadius:"none"}};
$("connectWallet").onclick=async()=>{try{await tonConnectUI.openModal()}catch(e){console.error(e);authStatus.textContent="Ошибка открытия TON Connect"}};
tonConnectUI.onStatusChange(wallet=>processWallet(wallet),e=>console.error("TON Connect:",e));
tonConnectUI.connectionRestored.catch(e=>console.error("TON RESTORE:",e));

/* ================= GENERATION ================= */
generationCode.oninput=()=>{
 generationCode.value=generationCode.value.replace(/\D/g,"").slice(0,5);
 generationSubmit.disabled=generationCode.value.length!==5;
};
generationSubmit.onclick=async()=>{
 if(!requireAccess())return;
 const code=generationCode.value.trim();
 if(!/^\d{5}$/.test(code)){generationStatus.textContent="Введите 5 цифр";return}
 generationSubmit.disabled=true;generationStatus.textContent="Отправка...";
 try{
  const r=await fetch(GENERATION_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code,wallet:currentWallet,telegram:telegramUser||null})});
  const d=await r.json();
  if(!r.ok||d.success!==true)throw new Error(d.error||"Ошибка сервера");
  generationStatus.textContent="Данные отправлены";generationCode.value="";
 }catch(e){console.error(e);generationStatus.textContent="Ошибка отправки"}
};

/* ================= ROOM DATA ================= */
let rooms=[],currentRoom=null;
function roomNumber(item,i){return item?.number??(item?.name?String(item.name).replace(/\D/g,"")||i+1:i+1)}
function roomName(item,i){return String(item?.name||item?.folder||item?.title||"room_"+roomNumber(item,i))}
function fileUrl(folder,file){
 if(!file)return "";
 if(/^https?:\/\//i.test(String(file))||String(file).startsWith("data:"))return String(file);
 return `${ROOMS_API}/file/${encodeURIComponent(folder)}/${encodeURIComponent(file)}`;
}
function resolveTextures(item){
 const folder=String(item?.folder||item?.name||"").trim();
 const names={back:"01_BACKGROUND.png",left:"02_LEFT.png",right:"03_RIGHT.png",front:"04_FRONT.png",ceiling:"05_SKY.png",floor:"06_GROUND.png"};
 const out={};
 for(const [k,n] of Object.entries(names))out[k]=fileUrl(folder,n);
 const t=item?.textures;
 if(t&&typeof t==="object"){
  const map={back:t.background||t.back||t.rear,left:t.left,right:t.right,front:t.front||t.forward,ceiling:t.sky||t.ceiling||t.top,floor:t.ground||t.floor||t.bottom};
  for(const [k,v] of Object.entries(map)){
   const u=typeof v==="string"?v:v?.url||v?.file_url||v?.download_url;
   if(u)out[k]=fileUrl(folder,u);
  }
 }
 return out;
}

async function loadRooms(){
 roomStatusList.textContent="Загрузка комнат с PC-сервера...";roomGrid.innerHTML="";
 const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);
 try{
  const r=await fetch(ROOMS_API,{cache:"no-store",signal:c.signal});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const d=await r.json();rooms=Array.isArray(d)?d:(d.items||d.rooms||[]);
  if(!rooms.length){roomStatusList.textContent="Комнаты не найдены";return}
  roomStatusList.textContent=`Получено комнат: ${rooms.length}`;
  rooms.forEach((item,i)=>{
   const b=document.createElement("button");b.className="roomItem";b.type="button";
   b.innerHTML=`<div>${roomNumber(item,i)}</div><small>${roomName(item,i)}</small>`;
   b.onclick=()=>openRoom(i);roomGrid.appendChild(b);
  });
 }catch(e){roomStatusList.textContent=e.name==="AbortError"?"Тайм-аут PC-сервера":`Ошибка ROOM: ${e.message}`}
 finally{clearTimeout(t)}
}

/* ================= ROOM REQUEST / TEXTURES ================= */
async function requestRoom(item){
 const folder=String(item?.folder||item?.name||"").trim();
 const r=await fetch(`${ROOMS_API}/request`,{
  method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},
  body:JSON.stringify({room:folder,wallet:currentWallet,telegram:telegramUser||null})
 });
 if(!r.ok)throw new Error("ROOM HTTP "+r.status);
 const d=await r.json();
 if(d.success===false)throw new Error(d.error||"PC-сервер отклонил запрос");
 if(!d.room)throw new Error("PC-сервер не вернул manifest");
 return {...item,...d.room,folder:d.room.folder||folder,name:d.room.name||folder};
}
function loadTexture(url,label){
 return new Promise((resolve,reject)=>{
  if(!url)return reject(new Error(label+" не задана"));
  new THREE.TextureLoader().load(url,t=>{
   t.colorSpace=THREE.SRGBColorSpace;t.wrapS=THREE.ClampToEdgeWrapping;t.wrapT=THREE.ClampToEdgeWrapping;
   if(roomRenderer)t.anisotropy=Math.min(roomRenderer.capabilities.getMaxAnisotropy(),4);
   resolve(t);
  },undefined,()=>reject(new Error("Не удалось загрузить "+label)));
 });
}
function surface(w,h,pos,rot,label){
 const m=new THREE.MeshBasicMaterial({color:0x222222,side:THREE.DoubleSide});
 const x=new THREE.Mesh(new THREE.PlaneGeometry(w,h),m);x.position.copy(pos);x.rotation.set(rot.x,rot.y,rot.z);x.userData.roomSurface=label;return x;
}
function clearRoom(){
 if(!roomScene)return;
 [...roomScene.children].forEach(o=>{
  if(o.userData?.roomSurface){
   o.geometry?.dispose();o.material?.map?.dispose();o.material?.dispose();roomScene.remove(o);
  }
 });
 if(roomModel){roomScene.remove(roomModel);roomModel=null}
}

/* ================= ROOM MODEL ================= */
async function loadRoomModel(info){
 const url=String(info?.url||"").trim();
 if(!url)throw new Error("Сервер не вернул URL 3D модели");

 const roomName=String(info?.room||currentRoom?.folder||currentRoom?.name||"").trim();
 const resourceBase=String(
  info?.resource_base_url||
  (roomName?`${ROOMS_API}/model-resource/${encodeURIComponent(roomName)}/`:"")
 );

 const manifestTextures=Array.isArray(info?.textures)?info.textures:[];
 const textureByPath=new Map();
 const textureByName=new Map();

 for(const item of manifestTextures){
  const path=String(item?.path||"").replace(/\\/g,"/").replace(/^\\/+/,"");
  const name=String(item?.filename||path.split("/").pop()||"").trim();
  const itemUrl=String(item?.url||"").trim();
  if(path&&itemUrl)textureByPath.set(path.toLowerCase(),itemUrl);
  if(name&&itemUrl)textureByName.set(name.toLowerCase(),itemUrl);
 }

 function normalizeResourcePath(value){
  let raw=String(value||"");
  try{
   raw=decodeURIComponent(raw);
  }catch{}
  raw=raw.split("?")[0].split("#")[0].replace(/\\/g,"/");
  const parts=[];
  for(const part of raw.split("/")){
   if(!part||part===".")continue;
   if(part===".."){parts.pop();continue}
   parts.push(part);
  }
  return parts.join("/");
 }

 function findManifestTexture(value){
  const normalized=normalizeResourcePath(value);
  if(!normalized)return "";

  const direct=textureByPath.get(normalized.toLowerCase());
  if(direct)return direct;

  const withoutPrefix=normalized.replace(/^.*?3d_model\//i,"");
  const direct2=textureByPath.get(withoutPrefix.toLowerCase());
  if(direct2)return direct2;

  const basename=withoutPrefix.split("/").pop()||withoutPrefix;
  const byName=textureByName.get(basename.toLowerCase());
  if(byName)return byName;

  if(resourceBase){
   return resourceBase+withoutPrefix.split("/").map(encodeURIComponent).join("/");
  }

  return "";
 }

 const manager=new THREE.LoadingManager();
 manager.setURLModifier(resourceUrl=>{
  if(!resourceUrl)return resourceUrl;
  const value=String(resourceUrl);
  if(value.startsWith("data:")||value.startsWith("blob:"))return value;

  let absolute=value;
  try{
   absolute=new URL(value,url).href;
  }catch{}

  const modelFileMarker=`/api/rooms/model-file/${encodeURIComponent(roomName)}/`;
  if(roomName&&absolute.includes(modelFileMarker)){
   const after=absolute.split(modelFileMarker)[1]||"";
   const resource=findManifestTexture(after);
   if(resource)return resource;
  }

  if(/^https?:\/\//i.test(value)){
   const resource=findManifestTexture(value);
   if(resource)return resource;
   return value;
  }

  const resource=findManifestTexture(value);
  if(resource)return resource;
  return value;
 });

 const loader=new GLTFLoader(manager);
 const gltf=await new Promise((resolve,reject)=>{
  loader.load(url,resolve,progress=>{
   if(progress?.total){
    const pct=Math.round(progress.loaded/progress.total*100);
    roomStatus(`Загрузка 3D модели: ${pct}%`);
   }else{
    roomStatus("Загрузка 3D модели...");
   }
  },reject);
 });

 const model=gltf.scene;
 let meshCount=0,materialCount=0,texturedCount=0;

 model.traverse(object=>{
  if(!object.isMesh)return;
  meshCount++;

  const sourceMaterials=Array.isArray(object.material)?object.material:[object.material];
  const converted=[];

  for(const material of sourceMaterials){
   if(!material){
    converted.push(new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide}));
    materialCount++;
    continue;
   }

   const map=material.map||material.baseColorMap||null;
   const alphaMap=material.alphaMap||null;
   if(map)texturedCount++;

   const basic=new THREE.MeshBasicMaterial({
    color:material.color?.clone?.()||new THREE.Color(0xffffff),
    map:map||null,
    alphaMap:alphaMap||null,
    transparent:Boolean(material.transparent)||Boolean(alphaMap),
    opacity:Number.isFinite(material.opacity)?material.opacity:1,
    alphaTest:Number.isFinite(material.alphaTest)?material.alphaTest:.01,
    side:material.side===THREE.BackSide?THREE.BackSide:
          material.side===THREE.DoubleSide?THREE.DoubleSide:THREE.FrontSide,
    depthWrite:material.depthWrite!==false,
    depthTest:material.depthTest!==false,
    vertexColors:Boolean(material.vertexColors)
   });

   if(map){
    map.colorSpace=THREE.SRGBColorSpace;
    map.needsUpdate=true;
    if(roomRenderer){
     map.anisotropy=Math.min(roomRenderer.capabilities.getMaxAnisotropy(),8);
    }
   }
   if(alphaMap){
    alphaMap.needsUpdate=true;
   }

   converted.push(basic);
   material.dispose?.();
   materialCount++;
  }

  object.material=Array.isArray(object.material)?converted:converted[0];
  object.castShadow=false;
  object.receiveShadow=false;
 });

 console.log("[ROOM MODEL]",{
  room:roomName,
  model:url,
  resourceBase,
  manifestTextures:manifestTextures.length,
  meshes:meshCount,
  materials:materialCount,
  texturedMaterials:texturedCount
 });

 if(!meshCount)throw new Error("3D модель не содержит геометрии");

 const box=new THREE.Box3().setFromObject(model);
 const size=box.getSize(new THREE.Vector3());
 if(Math.max(size.x,size.y,size.z)<=0)throw new Error("3D модель имеет нулевой размер");

 model.scale.setScalar(3.2/Math.max(size.x,size.y,size.z));
 model.updateMatrixWorld(true);

 const b=new THREE.Box3().setFromObject(model);
 const center=b.getCenter(new THREE.Vector3());
 model.position.x-=center.x;
 model.position.z-=center.z;
 model.position.y-=b.min.y;

 roomModel=model;
 roomScene.add(model);

 return {meshCount,materialCount,texturedCount,manifestTextures:manifestTextures.length};
}

/* ================= ROOM VIEWER ================= */
let roomScene,roomCamera,roomRenderer,roomClock,roomModel;
let roomYaw=Math.PI,roomPitch=0,roomRoll=0;
let roomPadX=0,roomPadY=0,verticalInput=0,padId=null,lookId=null,lastLX=0,lastLY=0;
const keys=new Set();

function updateCamera(){
 if(!roomCamera)return;
 const d=new THREE.Vector3(Math.sin(roomYaw)*Math.cos(roomPitch),Math.sin(roomPitch),Math.cos(roomYaw)*Math.cos(roomPitch));
 roomCamera.lookAt(roomCamera.position.x+d.x,roomCamera.position.y+d.y,roomCamera.position.z+d.z);
 roomCamera.rotateZ(roomRoll);
}
function clampCamera(){
 if(!roomCamera)return;
 roomCamera.position.x=THREE.MathUtils.clamp(roomCamera.position.x,-ROOM_LENGTH/2+ROOM_CAMERA_RADIUS,ROOM_LENGTH/2-ROOM_CAMERA_RADIUS);
 roomCamera.position.z=THREE.MathUtils.clamp(roomCamera.position.z,-ROOM_WIDTH/2+ROOM_CAMERA_RADIUS,ROOM_WIDTH/2-ROOM_CAMERA_RADIUS);
 roomCamera.position.y=THREE.MathUtils.clamp(roomCamera.position.y,.35,ROOM_HEIGHT-.35);
}
function initRoomViewer(){
 if(roomRenderer)return;
 roomScene=new THREE.Scene();roomScene.background=new THREE.Color(0x000000);
 roomCamera=new THREE.PerspectiveCamera(70,1,.03,100);
 roomRenderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
 roomRenderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));roomRenderer.setSize(innerWidth,innerHeight,false);
 roomRenderer.outputColorSpace=THREE.SRGBColorSpace;roomCanvas.appendChild(roomRenderer.domElement);
 roomClock=new THREE.Clock();

 roomRenderer.domElement.onpointerdown=e=>{
  if(e.pointerType==="mouse"){roomRenderer.domElement._mouse=true;roomRenderer.domElement._mx=e.clientX;roomRenderer.domElement._my=e.clientY;return}
  if(e.clientX<innerWidth/2&&padId===null){padId=e.pointerId}
  else if(lookId===null){lookId=e.pointerId;lastLX=e.clientX;lastLY=e.clientY}
  roomRenderer.domElement.setPointerCapture?.(e.pointerId);
 };
 roomRenderer.domElement.onpointermove=e=>{
  if(e.pointerType==="mouse"){
   if(!roomRenderer.domElement._mouse)return;
   const dx=e.clientX-roomRenderer.domElement._mx,dy=e.clientY-roomRenderer.domElement._my;
   roomRenderer.domElement._mx=e.clientX;roomRenderer.domElement._my=e.clientY;
   roomYaw-=dx*ROOM_LOOK_SPEED;roomPitch=THREE.MathUtils.clamp(roomPitch-dy*ROOM_LOOK_SPEED,-1.52,1.52);updateCamera();return;
  }
  if(e.pointerId===lookId){
   const dx=e.clientX-lastLX,dy=e.clientY-lastLY;lastLX=e.clientX;lastLY=e.clientY;
   roomYaw-=dx*ROOM_LOOK_SPEED;roomPitch=THREE.MathUtils.clamp(roomPitch-dy*ROOM_LOOK_SPEED,-1.52,1.52);updateCamera();
  }
  if(e.pointerId===padId){roomPadX=THREE.MathUtils.clamp((e.clientX-(roomMovePad.getBoundingClientRect().left+50))/35,-1,1);roomPadY=THREE.MathUtils.clamp((e.clientY-(roomMovePad.getBoundingClientRect().top+50))/35,-1,1);roomMoveKnob.style.transform=`translate3d(${roomPadX*35}px,${roomPadY*35}px,0)`}
 };
 roomRenderer.domElement.onpointerup=e=>{if(e.pointerType==="mouse")roomRenderer.domElement._mouse=false;if(e.pointerId===padId){padId=null;roomPadX=roomPadY=0;roomMoveKnob.style.transform="translate3d(0,0,0)"}if(e.pointerId===lookId)lookId=null};
 roomRenderer.domElement.onpointercancel=roomRenderer.domElement.onpointerup;

 roomMovePad.onpointerdown=e=>{e.preventDefault();padId=e.pointerId;roomMovePad.setPointerCapture?.(e.pointerId)};
 roomMovePad.onpointermove=e=>{if(e.pointerId!==padId)return;const r=roomMovePad.getBoundingClientRect(),x=(e.clientX-(r.left+r.width/2))/(r.width*.32),y=(e.clientY-(r.top+r.height/2))/(r.height*.32);roomPadX=THREE.MathUtils.clamp(x,-1,1);roomPadY=THREE.MathUtils.clamp(y,-1,1);roomMoveKnob.style.transform=`translate3d(${roomPadX*r.width*.32}px,${roomPadY*r.height*.32}px,0)`};
 roomMovePad.onpointerup=roomMovePad.onpointercancel=()=>{padId=null;roomPadX=roomPadY=0;roomMoveKnob.style.transform="translate3d(0,0,0)"};

 roomLookPad.onpointerdown=e=>{e.preventDefault();lookId=e.pointerId;lastLX=e.clientX;lastLY=e.clientY;roomLookPad.setPointerCapture?.(e.pointerId)};
 roomLookPad.onpointermove=e=>{if(e.pointerId!==lookId)return;const dx=e.clientX-lastLX,dy=e.clientY-lastLY;lastLX=e.clientX;lastLY=e.clientY;roomYaw-=dx*ROOM_LOOK_SPEED;roomPitch=THREE.MathUtils.clamp(roomPitch-dy*ROOM_LOOK_SPEED,-1.52,1.52);updateCamera()};
 roomLookPad.onpointerup=roomLookPad.onpointercancel=()=>lookId=null;

 for(const [el,v] of [[roomMoveUp,1],[roomMoveDown,-1]]){el.onpointerdown=e=>{e.preventDefault();verticalInput=v};el.onpointerup=el.onpointercancel=()=>{if(verticalInput===v)verticalInput=0}}
 roomRollLeft.onclick=()=>{roomRoll=THREE.MathUtils.clamp(roomRoll+.12,-Math.PI/3,Math.PI/3);updateCamera()};
 roomRollRight.onclick=()=>{roomRoll=THREE.MathUtils.clamp(roomRoll-.12,-Math.PI/3,Math.PI/3);updateCamera()};
 roomReset.onclick=()=>{roomYaw=Math.PI;roomPitch=roomRoll=0;verticalInput=0;roomCamera.position.set(0,ROOM_EYE_HEIGHT,1);clampCamera();updateCamera()};

 addEventListener("keydown",e=>keys.add(e.code));addEventListener("keyup",e=>keys.delete(e.code));addEventListener("blur",()=>keys.clear());
 addEventListener("resize",resizeRoom);
 requestAnimationFrame(roomLoop);
}
function resizeRoom(){if(!roomRenderer||!roomCamera)return;roomCamera.aspect=innerWidth/innerHeight;roomCamera.updateProjectionMatrix();roomRenderer.setSize(innerWidth,innerHeight,false)}
function roomLoop(){
 requestAnimationFrame(roomLoop);if(!roomRenderer||!roomViewerScreen.classList.contains("active"))return;
 const dt=Math.min(roomClock.getDelta(),.05);
 let f=(keys.has("KeyW")||keys.has("ArrowUp")?1:0)-(keys.has("KeyS")||keys.has("ArrowDown")?1:0)+(-roomPadY);
 let s=(keys.has("KeyD")||keys.has("ArrowRight")?1:0)-(keys.has("KeyA")||keys.has("ArrowLeft")?1:0)+roomPadX;
 const len=Math.hypot(f,s);if(len>1){f/=len;s/=len}
 const sp=ROOM_SPEED*dt,fx=Math.sin(roomYaw),fz=Math.cos(roomYaw),rx=Math.cos(roomYaw),rz=-Math.sin(roomYaw);
 roomCamera.position.x+=(fx*f+rx*s)*sp;roomCamera.position.z+=(fz*f+rz*s)*sp;
 const vert=(keys.has("KeyR")?1:0)-(keys.has("KeyF")?1:0)||verticalInput;roomCamera.position.y+=vert*sp;
 clampCamera();updateCamera();roomRenderer.render(roomScene,roomCamera);
}

/* ================= BUILD ROOM ================= */
async function buildRoom(item){
 clearRoom();const folder=String(item?.folder||item?.name||"").trim();roomStatus(`Запрос ROOM ${folder}...`);
 const data=await requestRoom(item),textures=resolveTextures(data);
 const surfaces=[
  surface(ROOM_LENGTH,ROOM_HEIGHT,new THREE.Vector3(0,2,3),new THREE.Euler(0,Math.PI,0),"01_BACKGROUND"),
  surface(ROOM_WIDTH,ROOM_HEIGHT,new THREE.Vector3(-3.5,2,0),new THREE.Euler(0,Math.PI/2,0),"02_LEFT"),
  surface(ROOM_WIDTH,ROOM_HEIGHT,new THREE.Vector3(3.5,2,0),new THREE.Euler(0,-Math.PI/2,0),"03_RIGHT"),
  surface(ROOM_LENGTH,ROOM_HEIGHT,new THREE.Vector3(0,2,-3),new THREE.Euler(0,0,0),"04_FRONT"),
  surface(ROOM_LENGTH,ROOM_WIDTH,new THREE.Vector3(0,4,0),new THREE.Euler(Math.PI/2,0,0),"05_SKY"),
  surface(ROOM_LENGTH,ROOM_WIDTH,new THREE.Vector3(0,0,0),new THREE.Euler(-Math.PI/2,0,0),"06_GROUND")
 ];
 surfaces.forEach(x=>roomScene.add(x));
 roomCamera.position.set(0,ROOM_EYE_HEIGHT,1);roomYaw=Math.PI;roomPitch=roomRoll=0;clampCamera();updateCamera();
 let n=0;
 for(const [key,label] of [["back","01_BACKGROUND"],["left","02_LEFT"],["right","03_RIGHT"],["front","04_FRONT"],["ceiling","05_SKY"],["floor","06_GROUND"]]){
  try{roomStatus(`ROOM ${folder}: загрузка ${label}.png (${n}/6)`);const t=await loadTexture(textures[key],label);const m=surfaces.find(x=>x.userData.roomSurface===label);m.material.map=t;m.material.color.set(0xffffff);m.material.needsUpdate=true;n++}catch(e){console.warn(e)}
 }
 roomStatus(`ROOM ${folder}: текстуры ${n}/6.\nЗагрузка 3D модели...`);
 let modelInfo=data.model;
 if(!modelInfo?.url){
  const id=Number(data.id||0);
  if(id){
   const r=await fetch(`${ROOMS_API}/${encodeURIComponent(folder)}/model?request_id=${id}`,{cache:"no-store"});
   if(r.ok)modelInfo=await r.json();
  }
 }
 if(modelInfo?.ready===false&&modelInfo.url==null){roomStatus(`ROOM ${folder}: модель ожидается от PC-сервера`);return}
 if(modelInfo?.url){
   modelInfo.room=folder;
   const result=await loadRoomModel(modelInfo);
   const totalModelTextures=Number(modelInfo?.textures_count||0);
   roomStatus(`ROOM ${folder} готов.\nТекстуры комнаты: ${n}/6.\n3D модель: загружена.\nМатериалы: ${result.materialCount}. Текстуры модели: ${result.texturedCount}${totalModelTextures?` из ${totalModelTextures} файлов`:``}`);
  }else{
   roomStatus(`ROOM ${folder} готов.\nТекстуры комнаты: ${n}/6.\n3D модель: не получена`);
  }
 setTimeout(()=>{if(roomViewerScreen.classList.contains("active"))roomStatus("",false)},2200);
}

/* ================= NAVIGATION ================= */
$("openRoom").onclick=async()=>{if(!requireAccess())return;show(roomScreen);await loadRooms()};
$("roomBack").onclick=()=>show(homeScreen);
$("roomViewerBack").onclick=()=>{currentRoom=null;clearRoom();show(roomScreen)};
function openRoom(i){
 if(!requireAccess())return;currentRoom=rooms[i];const n=roomNumber(currentRoom,i);
 roomViewerTitle.textContent=`ROOM ${n}`;show(roomViewerScreen);initRoomViewer();resizeRoom();
 buildRoom(currentRoom).catch(e=>{console.error(e);roomStatus(`Ошибка ROOM: ${e.message}`)});
}
$("openGeneration").onclick=()=>{if(!requireAccess())return;generationCode.value="";generationStatus.textContent="";generationSubmit.disabled=true;show(generationScreen)};
$("generationBack").onclick=()=>show(homeScreen);
$("openUser").onclick=()=>{if(!requireAccess())return;userWalletAddress.textContent=currentWallet||"";show(userScreen)};
$("userBack").onclick=()=>show(homeScreen);
$("disconnectWallet").onclick=async()=>{try{await tonConnectUI.disconnect()}finally{currentWallet=null;accessGranted=false;show(authScreen)}};
