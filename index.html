<script type="module">


import * as THREE
from "three";

    GLTFLoader
}
from
"three/addons/loaders/GLTFLoader.js";



/* =====================================================
   TELEGRAM
===================================================== */

const tg =
    window.Telegram?.WebApp || null;


if (tg) {

    tg.ready();

    tg.expand();

    if (
        typeof tg.disableVerticalSwipes ===
        "function"
    ) {

        tg.disableVerticalSwipes();

    }

}



/* =====================================================
   DOM
===================================================== */

const startScreen =
    document.getElementById(
        "startScreen"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const statusElement =
    document.getElementById(
        "status"
    );


const debugElement =
    document.getElementById(
        "debug"
    );


const fallbackCamera =
    document.getElementById(
        "fallbackCamera"
    );


const fallbackCanvas =
    document.getElementById(
        "fallbackCanvas"
    );


const topBar =
    document.getElementById(
        "topBar"
    );


const modeBadge =
    document.getElementById(
        "modeBadge"
    );


const trackingBadge =
    document.getElementById(
        "trackingBadge"
    );


const controls =
    document.getElementById(
        "controls"
    );


const placeButton =
    document.getElementById(
        "placeButton"
    );


const resetButton =
    document.getElementById(
        "resetButton"
    );


const plusButton =
    document.getElementById(
        "plusButton"
    );


const minusButton =
    document.getElementById(
        "minusButton"
    );


const gpsButton =
    document.getElementById(
        "gpsButton"
    );


const closeButton =
    document.getElementById(
        "closeButton"
    );


const scenePanel =
    document.getElementById(
        "scenePanel"
    );



/* =====================================================
   APPLICATION STATE
===================================================== */

let renderer = null;

let scene = null;

let model = null;

let xrSession = null;

let xrReferenceSpace = null;

let xrViewerSpace = null;

let xrHitTestSource = null;

let fallbackStream = null;


/*
 * true:
 *
 * настоящий WebXR AR.
 */

let webXRMode = false;


/*
 * true:
 *
 * обычная камера Telegram/browser.
 */

let fallbackMode = false;


/*
 * Модель закреплена.
 */

let objectLocked = false;


/*
 * Есть найденная поверхность.
 */

let hitAvailable = false;



/* =====================================================
   MODEL STATE
===================================================== */

let currentModel =
    "creature.glb";


let currentModelName =
    "Creature";


let modelScale =
    1;



/* =====================================================
   WORLD POSITION
===================================================== */

/*
 * Это НЕ позиция камеры.
 *
 * Это мировая координата объекта.
 */

const objectWorldPosition =
    new THREE.Vector3();


const objectWorldQuaternion =
    new THREE.Quaternion();



/* =====================================================
   HIT TEST POSITION
===================================================== */

const hitPosition =
    new THREE.Vector3();


const hitQuaternion =
    new THREE.Quaternion();



/* =====================================================
   TELEGRAM SENSOR DATA
===================================================== */

let orientation = {

    alpha: 0,

    beta: 0,

    gamma: 0,

    absolute: false

};


let gyro = {

    x: 0,

    y: 0,

    z: 0

};


let accel = {

    x: 0,

    y: 0,

    z: 0

};


let gps = {

    latitude: null,

    longitude: null,

    altitude: null,

    accuracy: null

};



/* =====================================================
   HELPERS
===================================================== */

function setStatus(
    text
) {

    statusElement.textContent =
        text;

}


function showARUI(
    mode
) {

    startScreen.style.display =
        "none";


    topBar.style.display =
        "flex";


    controls.style.display =
        "flex";


    scenePanel.style.display =
        "block";


    closeButton.style.display =
        "block";


    modeBadge.textContent =
        mode;

}



/* =====================================================
   TELEGRAM DEVICE ORIENTATION
===================================================== */

function startTelegramSensors() {

    if (
        !tg
    ) {

        return;

    }


    /*
     * DEVICE ORIENTATION
     */

    try {

        if (
            tg.DeviceOrientation
        ) {

            tg.DeviceOrientation.start(

                {

                    refresh_rate:
                        50,

                    need_absolute:
                        false

                },

                function (
                    success
                ) {

                    console.log(

                        "DeviceOrientation:",
                        success

                    );

                }

            );


            tg.onEvent(

                "deviceOrientationChanged",

                function () {

                    const d =
                        tg.DeviceOrientation;


                    orientation.alpha =
                        d.alpha || 0;


                    orientation.beta =
                        d.beta || 0;


                    orientation.gamma =
                        d.gamma || 0;


                    orientation.absolute =
                        !!d.absolute;

                }

            );

        }

    }
    catch (
        error
    ) {

        console.error(
            "Orientation error:",
            error
        );

    }


    /*
     * GYROSCOPE
     */

    try {

        if (
            tg.Gyroscope
        ) {

            tg.Gyroscope.start(

                {

                    refresh_rate:
                        50

                },

                function (
                    success
                ) {

                    console.log(

                        "Gyroscope:",
                        success

                    );

                }

            );


            tg.onEvent(

                "gyroscopeChanged",

                function () {

                    const g =
                        tg.Gyroscope;


                    gyro.x =
                        g.x || 0;


                    gyro.y =
                        g.y || 0;


                    gyro.z =
                        g.z || 0;

                }

            );

        }

    }
    catch (
        error
    ) {

        console.error(
            "Gyroscope error:",
            error
        );

    }


    /*
     * ACCELEROMETER
     */

    try {

        if (
            tg.Accelerometer
        ) {

            tg.Accelerometer.start(

                {

                    refresh_rate:
                        50

                },

                function (
                    success
                ) {

                    console.log(

                        "Accelerometer:",
                        success

                    );

                }

            );


            tg.onEvent(

                "accelerometerChanged",

                function () {

                    const a =
                        tg.Accelerometer;


                    accel.x =
                        a.x || 0;


                    accel.y =
                        a.y || 0;


                    accel.z =
                        a.z || 0;

                }

            );

        }

    }
    catch (
        error
    ) {

        console.error(
            "Accelerometer error:",
            error
        );

    }

}



/* =====================================================
   TELEGRAM GPS
===================================================== */

function requestTelegramLocation() {

    if (
        !tg ||
        !tg.LocationManager
    ) {

        setStatus(
            "LocationManager Telegram недоступен"
        );

        return;

    }


    try {

        tg.LocationManager.init(

            function () {

                tg.LocationManager
                    .getLocation(

                        function (
                            location
                        ) {

                            if (
                                !location
                            ) {

                                setStatus(
                                    "GPS разрешение не предоставлено"
                                );

                                return;

                            }


                            gps.latitude =
                                location.latitude;


                            gps.longitude =
                                location.longitude;


                            gps.altitude =
                                location.altitude;


                            gps.accuracy =
                                location.horizontal_accuracy;


                            setStatus(

                                "GPS: " +

                                gps.latitude
                                    .toFixed(6) +

                                ", " +

                                gps.longitude
                                    .toFixed(6)

                            );

                        }

                    );

            }

        );

    }
    catch (
        error
    ) {

        console.error(
            "GPS error:",
            error
        );

    }

}



/* =====================================================
   INIT THREE
===================================================== */

function initThree() {

    if (
        renderer
    ) {

        return;

    }


    scene =
        new THREE.Scene();


    renderer =
        new THREE.WebGLRenderer({

            antialias:
                true,

            alpha:
                true

        });


    renderer.setPixelRatio(

        Math.min(

            window.devicePixelRatio,

            2

        )

    );


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    /*
     * Включаем WebXR.
     */

    renderer.xr.enabled =
        true;


    const canvas =
        renderer.domElement;


    canvas.style.position =
        "absolute";


    canvas.style.left =
        "0";


    canvas.style.top =
        "0";


    canvas.style.width =
        "100%";


    canvas.style.height =
        "100%";


    canvas.style.zIndex =
        "2";


    document
        .getElementById("app")
        .appendChild(
            canvas
        );


    /*
     * Освещение.
     */

    const hemisphere =
        new THREE.HemisphereLight(

            0xffffff,

            0x444444,

            3

        );


    scene.add(
        hemisphere
    );


    const directional =
        new THREE.DirectionalLight(

            0xffffff,

            3

        );


    directional.position.set(

        5,
        10,
        5

    );


    scene.add(
        directional
    );

}



/* =====================================================
   LOAD GLB
===================================================== */

function loadModel() {

    initThree();


    if (
        model
    ) {

        scene.remove(
            model
        );

        model =
            null;

    }


    const loader =
        new GLTFLoader();


    const url =
        "./models/" +
        currentModel;


    setStatus(

        "Загрузка 3D: " +
        currentModelName

    );


    debugElement.innerHTML =

        "MODEL LOADING<br>" +
        url;


    loader.load(

        url,


        function (
            gltf
        ) {

            model =
                gltf.scene;


            /*
             * Bounding Box.
             */

            const box =
                new THREE.Box3();


            box.setFromObject(
                model
            );


            const size =
                box.getSize(

                    new THREE.Vector3()

                );


            const center =
                box.getCenter(

                    new THREE.Vector3()

                );


            /*
             * Центр модели.
             */

            model.position.sub(
                center
            );


            /*
             * Нормальный AR размер.
             */

            const maxSize =
                Math.max(

                    size.x,
                    size.y,
                    size.z

                );


            if (
                maxSize > 0
            ) {

                const factor =
                    1.5 /
                    maxSize;


                model.scale.setScalar(
                    factor
                );

            }


            /*
             * Добавляем.
             */

            scene.add(
                model
            );


            /*
             * В WebXR preview
             * будет перемещаться hit-test.
             */

            setStatus(

                "3D загружен. " +
                "Наведите камеру на поверхность."

            );


            debugElement.innerHTML =

                "MODEL: OK<br>" +
                currentModel;

        },


        function (
            progress
        ) {

            if (
                progress.total
            ) {

                const percent =

                    progress.loaded /
                    progress.total *
                    100;


                setStatus(

                    "3D: " +
                    percent.toFixed(0) +
                    "%"

                );

            }

        },


        function (
            error
        ) {

            console.error(
                "GLB ERROR:",
                error
            );


            setStatus(
                "Ошибка загрузки 3D"
            );


            debugElement.innerHTML =

                "GLB ERROR<br><br>" +

                url +
                "<br><br>" +

                String(error);

        }

    );

}



/* =====================================================
   START REAL WEBXR AR
===================================================== */

async function startWebXR() {

    if (
        !window.isSecureContext
    ) {

        throw new Error(
            "AR требует HTTPS"
        );

    }


    if (
        !navigator.xr
    ) {

        throw new Error(
            "navigator.xr отсутствует"
        );

    }


    /*
     * Проверяем поддержку.
     */

    const supported =

        await navigator.xr
            .isSessionSupported(
                "immersive-ar"
            );


    if (
        !supported
    ) {

        throw new Error(

            "immersive-ar не поддерживается"

        );

    }


    /*
     * Создаём XR session.
     *
     * hit-test обязателен.
     */

    xrSession =

        await navigator.xr
            .requestSession(

                "immersive-ar",

                {

                    requiredFeatures: [

                        "hit-test"

                    ],

                    optionalFeatures: [

                        "local",

                        "local-floor",

                        "anchors"

                    ]

                }

            );


    /*
     * Reference Space.
     */

    try {

        xrReferenceSpace =

            await xrSession
                .requestReferenceSpace(
                    "local-floor"
                );

    }
    catch {

        xrReferenceSpace =

            await xrSession
                .requestReferenceSpace(
                    "local"
                );

    }


    /*
     * Viewer space.
     */

    xrViewerSpace =

        await xrSession
            .requestReferenceSpace(
                "viewer"
            );


    /*
     * Hit test.
     */

    xrHitTestSource =

        await xrSession
            .requestHitTestSource({

                space:
                    xrViewerSpace

            });


    /*
     * Передаём XR session Three.js.
     */

    await renderer.xr.setSession(
        xrSession
    );


    webXRMode =
        true;


    fallbackMode =
        false;


    showARUI(
        "WEBXR 6DoF"
    );


    trackingBadge.textContent =
        "6DoF TRACKING";


    setStatus(

        "AR запущен. " +
        "Наведите телефон на пол."

    );


    loadModel();


    /*
     * Render loop.
     */

    renderer.setAnimationLoop(
        renderXR
    );


    /*
     * Session end.
     */

    xrSession.addEventListener(

        "end",

        function () {

            finishXR();

        }

    );

}



/* =====================================================
   XR RENDER LOOP
===================================================== */

function renderXR(
    time,
    frame
) {

    if (
        !xrSession ||
        !frame
    ) {

        return;

    }


    /*
     * =================================================
     * ПОЛУЧАЕМ РЕАЛЬНУЮ ПОЗУ ТЕЛЕФОНА
     * =================================================
     */

    const viewerPose =

        frame.getViewerPose(

            xrReferenceSpace

        );


    if (
        viewerPose
    ) {

        const position =
            viewerPose
                .transform
                .position;


        const rotation =
            viewerPose
                .transform
                .orientation;


        /*
         * ВАЖНО:
         *
         * Это не GPS.
         *
         * Это локальная AR-позиция
         * телефона в XR пространстве.
         */

        debugElement.innerHTML =

            "WEBXR 6DoF<br><br>" +

            "PHONE POSITION<br>" +

            "X: " +
            position.x.toFixed(3) +

            "<br>" +

            "Y: " +
            position.y.toFixed(3) +

            "<br>" +

            "Z: " +
            position.z.toFixed(3) +

            "<br><br>" +

            "OBJECT<br>" +

            "X: " +
            objectWorldPosition
                .x.toFixed(3) +

            "<br>" +

            "Y: " +
            objectWorldPosition
                .y.toFixed(3) +

            "<br>" +

            "Z: " +
            objectWorldPosition
                .z.toFixed(3) +

            "<br><br>" +

            "LOCK: " +

            (
                objectLocked
                    ? "YES"
                    : "NO"
            );

    }


    /*
     * =================================================
     * HIT TEST
     * =================================================
     */

    if (
        xrHitTestSource &&
        !objectLocked
    ) {

        const results =

            frame.getHitTestResults(

                xrHitTestSource

            );


        if (
            results.length > 0
        ) {

            const hit =
                results[0];


            const pose =

                hit.getPose(

                    xrReferenceSpace

                );


            if (
                pose
            ) {

                const p =
                    pose
                        .transform
                        .position;


                const q =
                    pose
                        .transform
                        .orientation;


                hitPosition.set(

                    p.x,
                    p.y,
                    p.z

                );


                hitQuaternion.set(

                    q.x,
                    q.y,
                    q.z,
                    q.w

                );


                hitAvailable =
                    true;


                /*
                 * Preview.
                 */

                if (
                    model
                ) {

                    model.position.copy(

                        hitPosition

                    );


                    model.quaternion.copy(

                        hitQuaternion

                    );

                }


                setStatus(

                    "Поверхность найдена. " +
                    "Нажмите «Закрепить»."

                );

            }

        }

    }


    /*
     * =================================================
     * ВАЖНО
     * =================================================
     *
     * Если объект закреплён,
     * его position НЕ меняется.
     *
     * Движется viewer.
     *
     * Поэтому пользователь может
     * физически ходить вокруг объекта.
     */

    renderer.render(

        scene,

        renderer.xr.getCamera()

    );

}



/* =====================================================
   PLACE OBJECT
===================================================== */

function placeObject() {

    if (
        !model
    ) {

        setStatus(
            "Модель ещё загружается."
        );

        return;

    }


    if (
        !webXRMode
    ) {

        setStatus(

            "Для настоящего закрепления " +
            "нужен WebXR 6DoF."

        );

        return;

    }


    if (
        !hitAvailable
    ) {

        setStatus(

            "Наведите телефон на поверхность."

        );

        return;

    }


    /*
     * =================================================
     * СОХРАНЯЕМ WORLD POSITION
     * =================================================
     */

    objectWorldPosition.copy(

        hitPosition

    );


    objectWorldQuaternion.copy(

        hitQuaternion

    );


    /*
     * Устанавливаем один раз.
     */

    model.position.copy(

        objectWorldPosition

    );


    model.quaternion.copy(

        objectWorldQuaternion

    );


    /*
     * =================================================
     * LOCK
     * =================================================
     */

    objectLocked =
        true;


    setStatus(

        "ОБЪЕКТ ЗАКРЕПЛЁН. " +
        "ХОДИТЕ ВОКРУГ НЕГО."

    );


    trackingBadge.textContent =
        "OBJECT LOCKED";

}



/* =====================================================
   RESET OBJECT
===================================================== */

function resetObject() {

    objectLocked =
        false;


    hitAvailable =
        false;


    trackingBadge.textContent =
        "6DoF TRACKING";


    setStatus(

        "Наведите камеру на новую поверхность."

    );

}



/* =====================================================
   SCALE UP
===================================================== */

function scaleUp() {

    if (
        !model
    ) {

        return;

    }


    model.scale.multiplyScalar(
        1.15
    );

}



/* =====================================================
   SCALE DOWN
===================================================== */

function scaleDown() {

    if (
        !model
    ) {

        return;

    }


    model.scale.multiplyScalar(
        0.87
    );

}



/* =====================================================
   FALLBACK CAMERA
===================================================== */

async function startFallbackCamera() {

    /*
     * Это НЕ настоящий AR 6DoF.
     *
     * Этот режим нужен для:
     *
     * 1. проверки камеры;
     * 2. Telegram sensors;
     * 3. устройств без WebXR.
     *
     * Он не обещает координаты X/Y/Z
     * физического перемещения телефона.
     */

    try {

        fallbackStream =

            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal:
                                "environment"
                        },

                        width: {
                            ideal:
                                1280
                        },

                        height: {
                            ideal:
                                720
                        }

                    },

                    audio:
                        false

                });


        fallbackCamera.srcObject =
            fallbackStream;


        await fallbackCamera.play();


        fallbackCamera.style.display =
            "block";


        fallbackMode =
            true;


        webXRMode =
            false;


        showARUI(
            "CAMERA MODE"
        );


        trackingBadge.textContent =
            "SENSORS";


        setStatus(

            "Камера работает. " +
            "WebXR 6DoF недоступен."

        );


        startTelegramSensors();


        loadModel();


        renderFallback();

    }
    catch (
        error
    ) {

        console.error(
            error
        );


        throw error;

    }

}



/* =====================================================
   FALLBACK RENDER
===================================================== */

function renderFallback() {

    if (
        !fallbackMode
    ) {

        return;

    }


    requestAnimationFrame(
        renderFallback
    );


    /*
     * Здесь специально НЕ делаем
     * fake X/Y/Z из акселерометра.
     *
     * Иначе объект будет "плавать".
     */

    debugElement.innerHTML =

        "CAMERA FALLBACK<br><br>" +

        "ORIENTATION<br>" +

        "A: " +
        orientation.alpha.toFixed(2) +

        "<br>" +

        "B: " +
        orientation.beta.toFixed(2) +

        "<br>" +

        "G: " +
        orientation.gamma.toFixed(2) +

        "<br><br>" +

        "GYRO<br>" +

        "X: " +
        gyro.x.toFixed(2) +

        "<br>" +

        "Y: " +
        gyro.y.toFixed(2) +

        "<br>" +

        "Z: " +
        gyro.z.toFixed(2) +

        "<br><br>" +

        "ACCEL<br>" +

        "X: " +
        accel.x.toFixed(2) +

        "<br>" +

        "Y: " +
        accel.y.toFixed(2) +

        "<br>" +

        "Z: " +
        accel.z.toFixed(2) +

        "<br><br>" +

        "GPS<br>" +

        (
            gps.latitude !== null
                ? gps.latitude.toFixed(6)
                : "NO"
        );

}



/* =====================================================
   START APPLICATION
===================================================== */

async function startApplication() {

    setStatus(
        "Запуск..."
    );


    startTelegramSensors();


    /*
     * Сначала пробуем WebXR.
     */

    if (
        window.isSecureContext &&
        navigator.xr
    ) {

        try {

            const supported =

                await navigator.xr
                    .isSessionSupported(
                        "immersive-ar"
                    );


            if (
                supported
            ) {

                await startWebXR();

                return;

            }

        }
        catch (
            error
        ) {

            console.warn(

                "WebXR failed:",
                error

            );

            debugElement.innerHTML =

                "WEBXR FAILED<br>" +

                error.name +
                "<br>" +

                error.message;

        }

    }


    /*
     * Если WebXR отсутствует,
     * запускаем обычную камеру.
     */

    try {

        await startFallbackCamera();

    }
    catch (
        error
    ) {

        setStatus(

            "Не удалось включить камеру: " +
            error.name

        );


        debugElement.innerHTML =

            "CAMERA ERROR<br>" +

            error.name +
            "<br>" +

            error.message;

    }

}

/* =====================================================
   CLOSE
===================================================== */

closeButton.addEventListener(

    "click",

    async function () {

        /*
         * WebXR.
         */

        if (
            xrSession
        ) {

            try {

                await xrSession.end();

            }
            catch {}

        }


        /*
         * Camera.
         */

        if (
            fallbackStream
        ) {

            fallbackStream
                .getTracks()
                .forEach(

                    function (
                        track
                    ) {

                        track.stop();

                    }

                );

        }


        fallbackCamera.srcObject =
            null;


        fallbackCamera.style.display =
            "none";


        fallbackMode =
            false;


        webXRMode =
            false;


        objectLocked =
            false;


        startScreen.style.display =
            "flex";


        topBar.style.display =
            "none";


        controls.style.display =
            "none";


        scenePanel.style.display =
            "none";


        closeButton.style.display =
            "none";


        setStatus(
            "Готово"
        );

    }

);



/* =====================================================
   SCENE SELECTION
===================================================== */

document
    .querySelectorAll(
        ".sceneButton"
    )
    .forEach(

        function (
            button
        ) {

            button.addEventListener(

                "click",

                function () {

                    document
                        .querySelectorAll(
                            ".sceneButton"
                        )
                        .forEach(

                            function (
                                item
                            ) {

                                item.classList
                                    .remove(
                                        "active"
                                    );

                            }

                        );


                    button.classList.add(
                        "active"
                    );


                    currentModel =
                        button.dataset.model;


                    currentModelName =
                        button.dataset.name;


                    objectLocked =
                        false;


                    hitAvailable =
                        false;


                    loadModel();

                }

            );

        }

    );



/* =====================================================
   FINISH XR
===================================================== */

function finishXR() {

    renderer.setAnimationLoop(
        null
    );


    xrSession =
        null;


    xrReferenceSpace =
        null;


    xrViewerSpace =
        null;


    xrHitTestSource =
        null;


    webXRMode =
        false;


    objectLocked =
        false;


    hitAvailable =
        false;


    startScreen.style.display =
        "flex";


    topBar.style.display =
        "none";


    controls.style.display =
        "none";


    scenePanel.style.display =
        "none";


    closeButton.style.display =
        "none";


    setStatus(
        "AR завершён"
    );

}

/* =====================================================
   INITIAL CHECK
===================================================== */

async function initialCheck() {

    if (
        !window.isSecureContext
    ) {

        setStatus(

            "Сайт должен открываться через HTTPS."

        );


        debugElement.innerHTML =
            "HTTPS: NO";

        return;

    }


    if (
        !navigator.xr
    ) {

        setStatus(

            "WebXR API не найден. " +
            "Можно проверить камеру."

        );


        debugElement.innerHTML =

            "HTTPS: YES<br>" +

            "WebXR: NO";

        return;

    }


    try {

        const supported =

            await navigator.xr
                .isSessionSupported(
                    "immersive-ar"
                );


        if (
            supported
        ) {

            setStatus(

                "WebXR AR готов. " +
                "Нажмите «Запустить AR»."

            );


            debugElement.innerHTML =

                "HTTPS: YES<br>" +

                "WebXR: YES<br>" +

                "immersive-ar: YES";

        }
        else {

            setStatus(

                "WebXR найден, но " +
                "immersive-ar недоступен."

            );


            debugElement.innerHTML =

                "HTTPS: YES<br>" +

                "WebXR: YES<br>" +

                "immersive-ar: NO";

        }

    }
    catch (
        error
    ) {

        setStatus(

            "Ошибка проверки WebXR."

        );


        debugElement.innerHTML =

            error.name +
            "<br>" +
            error.message;

    }

}


initialCheck();
