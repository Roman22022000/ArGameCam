<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>AR Camera + 3D</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    font-family: Arial, sans-serif;
}

#app {

    width: 100%;
    height: 100%;

    position: relative;

    overflow: hidden;

    background: #000;
}


/* =========================================
   КАМЕРА
========================================= */

#camera {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    background: #000;

    display: none;

    z-index: 1;
}


/* =========================================
   THREE.JS CANVAS
========================================= */

#threeCanvas {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: none;

    z-index: 2;

    pointer-events: none;

    background: transparent;
}


/* =========================================
   СТАРТОВЫЙ ЭКРАН
========================================= */

#start {

    position: absolute;

    inset: 0;

    z-index: 10;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    padding: 25px;

    background: #111820;

    color: white;

    text-align: center;
}


#start h1 {

    font-size: 40px;

    margin-bottom: 15px;
}


#start p {

    max-width: 350px;

    line-height: 1.5;

    opacity: .7;

    margin-bottom: 30px;
}


#cameraButton {

    width: 240px;

    height: 55px;

    border: 0;

    border-radius: 16px;

    background: white;

    color: black;

    font-size: 18px;

    font-weight: bold;
}


/* =========================================
   STATUS
========================================= */

#status {

    position: absolute;

    left: 50%;

    bottom: 30px;

    transform: translateX(-50%);

    width: calc(100% - 40px);

    padding: 14px;

    border-radius: 14px;

    background: rgba(0,0,0,.75);

    color: white;

    text-align: center;

    z-index: 20;
}


/* =========================================
   CLOSE
========================================= */

#close {

    position: absolute;

    top: 20px;

    right: 20px;

    z-index: 30;

    display: none;

    padding: 12px 16px;

    border: 0;

    border-radius: 12px;

    background: rgba(0,0,0,.7);

    color: white;
}


/* =========================================
   3D CONTROL
========================================= */

#controls {

    position: absolute;

    left: 50%;

    bottom: 85px;

    transform: translateX(-50%);

    z-index: 25;

    display: none;

    gap: 8px;
}


#controls button {

    min-width: 55px;

    min-height: 45px;

    border: 0;

    border-radius: 12px;

    background: rgba(0,0,0,.75);

    color: white;

    font-size: 18px;
}


#reset {

    min-width: 100px !important;

    font-size: 14px !important;
}

</style>

</head>


<body>


<div id="app">


    <!-- =================================
         КАМЕРА
    ================================= -->

    <video
        id="camera"
        autoplay
        playsinline
        muted>
    </video>


    <!-- =================================
         THREE.JS
    ================================= -->

    <canvas
        id="threeCanvas">
    </canvas>


    <!-- =================================
         START
    ================================= -->

    <section id="start">

        <h1>
            AR CAMERA
        </h1>

        <p>

            Камера работает внутри
            Telegram Mini App.

            <br><br>

            После включения камеры
            будет загружен 3D-объект.

        </p>


        <button
            id="cameraButton">

            Включить камеру

        </button>

    </section>


    <!-- =================================
         CLOSE
    ================================= -->

    <button id="close">

        Закрыть

    </button>


    <!-- =================================
         CONTROLS
    ================================= -->

    <div id="controls">

        <button id="minus">
            −
        </button>

        <button id="reset">
            Центр
        </button>

        <button id="plus">
            +
        </button>

    </div>


    <!-- =================================
         STATUS
    ================================= -->

    <div id="status">

        Нажмите «Включить камеру»

    </div>


</div>


<!-- =====================================
     THREE.JS
===================================== -->

<script type="importmap">

{
    "imports": {

        "three":
            "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/":
            "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

    }
}

</script>


<script type="module">

import * as THREE
    from "three";


import {
    GLTFLoader
}
from "three/addons/loaders/GLTFLoader.js";


/* =========================================
   TELEGRAM
========================================= */

const tg =
    window.Telegram?.WebApp;


if (tg) {

    tg.ready();

    tg.expand();

}


/* =========================================
   ELEMENTS
========================================= */

const button =
    document.getElementById(
        "cameraButton"
    );


const video =
    document.getElementById(
        "camera"
    );


const canvas =
    document.getElementById(
        "threeCanvas"
    );


const start =
    document.getElementById(
        "start"
    );


const status =
    document.getElementById(
        "status"
    );


const closeButton =
    document.getElementById(
        "close"
    );


const controls =
    document.getElementById(
        "controls"
    );


/* =========================================
   THREE VARIABLES
========================================= */

let renderer;

let scene;

let camera3D;

let model;


/* =========================================
   MODEL SETTINGS
========================================= */

let modelScale = 1;


/*
 * Положение модели
 *
 * Z = расстояние перед камерой.
 *
 * -2 = примерно 2 метра.
 */

const modelPosition =
    new THREE.Vector3(
        0,
        -0.4,
        -2
    );


/* =========================================
   STATUS
========================================= */

function setStatus(text) {

    status.textContent =
        text;

}


/* =========================================
   THREE INITIALIZATION
========================================= */

function initThree() {


    /* -------------------------------------
       SCENE
    ------------------------------------- */

    scene =
        new THREE.Scene();


    /* -------------------------------------
       CAMERA
    ------------------------------------- */

    camera3D =
        new THREE.PerspectiveCamera(

            60,

            window.innerWidth /
            window.innerHeight,

            0.01,

            100

        );


    /*
     * Камера находится
     * в центре пространства.
     */

    camera3D.position.set(
        0,
        0,
        0
    );


    /* -------------------------------------
       RENDERER
    ------------------------------------- */

    renderer =
        new THREE.WebGLRenderer({

            canvas: canvas,

            alpha: true,

            antialias: true

        });


    renderer.setPixelRatio(

        Math.min(
            window.devicePixelRatio,
            2
        )

    );


    renderer.setSize(

        window.innerWidth,
        window.innerHeight

    );


    /*
     * Прозрачный фон.
     *
     * Поэтому под canvas
     * будет видна камера.
     */

    renderer.setClearColor(
        0x000000,
        0
    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    /* -------------------------------------
       LIGHT
    ------------------------------------- */

    const hemisphere =
        new THREE.HemisphereLight(

            0xffffff,

            0x555555,

            2

        );


    scene.add(
        hemisphere
    );


    const directional =
        new THREE.DirectionalLight(

            0xffffff,

            2

        );


    directional.position.set(
        2,
        4,
        2
    );


    scene.add(
        directional
    );


    /* -------------------------------------
       LOAD GLB
    ------------------------------------- */

    setStatus(
        "Загрузка 3D-модели..."
    );


    const loader =
        new GLTFLoader();


    loader.load(

        "./models/creature.glb",


        function(gltf) {

            model =
                gltf.scene;


            /*
             * Начальный масштаб.
             */

            model.scale.set(
                modelScale,
                modelScale,
                modelScale
            );


            /*
             * Положение.
             */

            model.position.copy(
                modelPosition
            );


            /*
             * Модель видима.
             */

            model.visible =
                true;


            scene.add(
                model
            );


            console.log(
                "3D MODEL LOADED",
                model
            );


            setStatus(
                "3D-объект загружен"
            );

        },


        function(progress) {

            if (
                progress.total > 0
            ) {

                const percent =
                    Math.round(

                        progress.loaded /
                        progress.total *
                        100

                    );


                setStatus(
                    "Загрузка 3D: " +
                    percent +
                    "%"
                );

            }

        },


        function(error) {

            console.error(
                "GLB LOAD ERROR:",
                error
            );


            setStatus(
                "Ошибка загрузки models/creature.glb"
            );

        }

    );


    /* -------------------------------------
       START RENDER
    ------------------------------------- */

    animate();

}


/* =========================================
   RENDER LOOP
========================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    if (
        model
    ) {

        model.scale.set(
            modelScale,
            modelScale,
            modelScale
        );

    }


    if (
        renderer &&
        scene &&
        camera3D
    ) {

        renderer.render(
            scene,
            camera3D
        );

    }

}


/* =========================================
   CAMERA
========================================= */

async function openCamera() {


    setStatus(
        "Запрашиваем доступ к камере..."
    );


    try {


        /* ---------------------------------
           CHECK
        --------------------------------- */

        if (
            !navigator.mediaDevices
        ) {

            throw new Error(
                "mediaDevices недоступен"
            );

        }


        if (
            !navigator.mediaDevices
                .getUserMedia
        ) {

            throw new Error(
                "getUserMedia недоступен"
            );

        }


        /* ---------------------------------
           CAMERA
        --------------------------------- */

        const stream =

            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal:
                                "environment"
                        },

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        }

                    },

                    audio: false

                });


        console.log(
            "CAMERA STREAM",
            stream
        );


        /* ---------------------------------
           VIDEO
        --------------------------------- */

        video.srcObject =
            stream;


        await video.play();


        /* ---------------------------------
           SHOW
        --------------------------------- */

        video.style.display =
            "block";


        canvas.style.display =
            "block";


        start.style.display =
            "none";


        closeButton.style.display =
            "block";


        controls.style.display =
            "flex";


        setStatus(
            "Камера включена. Загружаем 3D..."
        );


        /*
         * Запускаем Three.js
         */

        initThree();


    }
    catch (error) {


        console.error(
            "CAMERA ERROR:",
            error
        );


        setStatus(

            "Ошибка камеры: " +

            error.name +

            " — " +

            error.message

        );

    }

}


/* =========================================
   CAMERA BUTTON
========================================= */

button.addEventListener(

    "click",

    openCamera

);


/* =========================================
   CLOSE
========================================= */

closeButton.addEventListener(

    "click",

    function() {


        const stream =
            video.srcObject;


        if (
            stream
        ) {

            stream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }


        video.srcObject =
            null;


        video.style.display =
            "none";


        canvas.style.display =
            "none";


        closeButton.style.display =
            "none";


        controls.style.display =
            "none";


        start.style.display =
            "flex";


        setStatus(
            "Нажмите «Включить камеру»"
        );

    }

);


/* =========================================
   SCALE DOWN
========================================= */

document
    .getElementById(
        "minus"
    )
    .addEventListener(

        "click",

        function() {

            modelScale =
                Math.max(
                    0.1,
                    modelScale - 0.1
                );

        }

    );


/* =========================================
   SCALE UP
========================================= */

document
    .getElementById(
        "plus"
    )
    .addEventListener(

        "click",

        function() {

            modelScale =
                Math.min(
                    5,
                    modelScale + 0.1
                );

        }

    );


/* =========================================
   RESET
========================================= */

document
    .getElementById(
        "reset"
    )
    .addEventListener(

        "click",

        function() {

            if (
                model
            ) {

                model.position.set(
                    0,
                    -0.4,
                    -2
                );

                model.rotation.set(
                    0,
                    0,
                    0
                );

            }


            modelScale =
                1;


            setStatus(
                "3D-объект сброшен"
            );

        }

    );


/* =========================================
   RESIZE
========================================= */

window.addEventListener(

    "resize",

    function() {


        if (
            !renderer ||
            !camera3D
        ) {

            return;

        }


        renderer.setSize(

            window.innerWidth,
            window.innerHeight

        );


        camera3D.aspect =

            window.innerWidth /
            window.innerHeight;


        camera3D.updateProjectionMatrix();

    }

);

</script>


</body>

</html>
