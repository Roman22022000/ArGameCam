<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta

    name="theme-color"

<title>AR Game Cam</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

/* =====================================================
   RESET
===================================================== */

* {

    box-sizing: border-box;

    margin: 0;

    padding: 0;

}


html,
body {

    width: 100%;

    height: 100%;

    overflow: hidden;

    background: #000;

    font-family:
        Arial,
        sans-serif;

    touch-action: none;

    user-select: none;

    -webkit-user-select: none;

}


/* =====================================================
   APP
===================================================== */

#app {

    position: relative;

    width: 100%;

    height: 100dvh;

    overflow: hidden;

    background: #111820;

}


/* =====================================================
   CAMERA
===================================================== */

#camera {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: none;

    z-index: 1;

    background: #000;

}


/* =====================================================
   THREE CANVAS
===================================================== */

#threeCanvas {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    display: none;

    z-index: 2;

    pointer-events: none;

}


/* =====================================================
   START SCREEN
===================================================== */

#start {

    position: absolute;

    inset: 0;

    z-index: 100;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    padding: 25px;

    background:
        radial-gradient(
            circle at center,
            #263640 0%,
            #10161b 60%,
            #080b0e 100%
        );

    color: white;

    text-align: center;

}


#start h1 {

    font-size: 40px;

    margin-bottom: 15px;

}


#start p {

    max-width: 380px;

    line-height: 1.5;

    opacity: .72;

    margin-bottom: 25px;

}


/* =====================================================
   BUTTON
===================================================== */

.mainButton {

    width: 280px;

    min-height: 55px;

    margin-top: 10px;

    border: 0;

    border-radius: 16px;

    background: white;

    color: #111;

    font-size: 17px;

    font-weight: 700;

}


.mainButton:active {

    transform: scale(.97);

}


/* =====================================================
   STATUS
===================================================== */

#status {

    position: absolute;

    top: 64px;

    left: 50%;

    transform:
        translateX(-50%);

    width:
        calc(100% - 40px);

    max-width: 450px;

    z-index: 50;

    padding: 10px 14px;

    border-radius: 13px;

    background:
        rgba(0,0,0,.68);

    color: white;

    text-align: center;

    font-size: 12px;

    backdrop-filter:
        blur(10px);

    pointer-events: none;

}


/* =====================================================
   TOP BAR
===================================================== */

#topBar {

    position: absolute;

    top:
        calc(
            12px +
            env(safe-area-inset-top)
        );

    left: 12px;

    right: 12px;

    z-index: 40;

    display: none;

    justify-content:
        space-between;

    pointer-events: none;

}


.badge {

    padding: 9px 13px;

    border-radius: 13px;

    background:
        rgba(0,0,0,.68);

    color: white;

    font-size: 12px;

    backdrop-filter:
        blur(10px);

}


/* =====================================================
   CLOSE
===================================================== */

#close {

    position: absolute;

    top:
        calc(
            12px +
            env(safe-area-inset-top)
        );

    right: 12px;

    z-index: 70;

    display: none;

    width: 43px;

    height: 43px;

    border: 0;

    border-radius: 13px;

    background:
        rgba(0,0,0,.70);

    color: white;

    font-size: 22px;

}


/* =====================================================
   CONTROLS
===================================================== */

#controls {

    position: absolute;

    right: 12px;

    top: 125px;

    z-index: 50;

    display: none;

    flex-direction: column;

    gap: 8px;

}


.control {

    min-width: 55px;

    min-height: 45px;

    padding: 7px;

    border: 0;

    border-radius: 13px;

    background:
        rgba(0,0,0,.70);

    color: white;

    font-size: 15px;

    backdrop-filter:
        blur(10px);

}


#place {

    display: none;

    font-weight: bold;

}


/* =====================================================
   DEBUG
===================================================== */

#debug {

    position: absolute;

    left: 10px;

    bottom: 160px;

    z-index: 45;

    display: none;

    min-width: 145px;

    padding: 10px;

    border-radius: 10px;

    background:
        rgba(0,0,0,.72);

    color: white;

    font-family:
        monospace;

    font-size: 10px;

    line-height: 1.55;

    pointer-events: none;

}


/* =====================================================
   SCENE PANEL
===================================================== */

#scenePanel {

    position: absolute;

    left: 0;

    right: 0;

    bottom: 0;

    z-index: 60;

    display: none;

    padding:

        12px

        12px

        calc(
            12px +
            env(safe-area-inset-bottom)
        );

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.97),
            rgba(0,0,0,.70)
        );

    backdrop-filter:
        blur(18px);

    color: white;

}


#sceneHeader {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    margin-bottom: 9px;

}


#sceneTitle {

    font-size: 14px;

    font-weight: 700;

}


#sceneHint {

    font-size: 11px;

    opacity: .55;

}


#sceneList {

    display: flex;

    gap: 9px;

    overflow-x: auto;

    scrollbar-width: none;

}


#sceneList::-webkit-scrollbar {

    display: none;

}


/* =====================================================
   SCENE CARD
===================================================== */

.sceneCard {

    flex:
        0 0 82px;

    width: 82px;

    height: 92px;

    padding: 0;

    border:
        1px solid
        rgba(255,255,255,.16);

    border-radius: 14px;

    overflow: hidden;

    background:
        rgba(255,255,255,.08);

    color: white;

}


.sceneCard.active {

    border:
        2px solid white;

    background:
        rgba(255,255,255,.18);

}


.scenePreview {

    height: 62px;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #26353e,
            #11171b
        );

    font-size: 28px;

}


.sceneName {

    height: 30px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 10px;

}


/* =====================================================
   RETICLE
===================================================== */

#reticle {

    position: absolute;

    left: 50%;

    top: 50%;

    transform:
        translate(
            -50%,
            -50%
        );

    width: 46px;

    height: 46px;

    z-index: 35;

    display: none;

    border:
        2px solid white;

    border-radius: 50%;

    box-shadow:
        0 0 10px
        rgba(255,255,255,.5);

}


#reticle::before {

    content: "";

    position: absolute;

    left: 50%;

    top: 50%;

    width: 14px;

    height: 2px;

    transform:
        translate(
            -50%,
            -50%
        );

    background: white;

}


#reticle::after {

    content: "";

    position: absolute;

    left: 50%;

    top: 50%;

    width: 2px;

    height: 14px;

    transform:
        translate(
            -50%,
            -50%
        );

    background: white;

}


/* =====================================================
   BROWSER AR
===================================================== */

#browserAR {

    position: absolute;

    inset: 0;

    z-index: 90;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 25px;

    background: #111820;

    color: white;

    text-align: center;

}


#browserAR h2 {

    margin-bottom: 15px;

}


#browserAR p {

    max-width: 370px;

    line-height: 1.5;

    opacity: .7;

    margin-bottom: 20px;

}

</style>

<script type="importmap">

<script type="module">


import * as THREE
from "three";


import {
    GLTFLoader
}
from
"three/addons/loaders/GLTFLoader.js";



/* =====================================================
   TELEGRAM
===================================================== */

const tg =
    window.Telegram?.WebApp;


const isTelegram =
    !!tg;



/* =====================================================
   TELEGRAM INIT
===================================================== */

if (tg) {

    tg.ready();

    tg.expand();


    if (
        tg.disableVerticalSwipes
    ) {

        tg.disableVerticalSwipes();

    }


    if (
        tg.requestFullscreen
    ) {

        try {

            tg.requestFullscreen();

        }
        catch (
            error
        ) {

            console.log(
                "Fullscreen unavailable",
                error
            );

        }

    }

}



/* =====================================================
   ELEMENTS
===================================================== */

const start =
    document.getElementById(
        "start"
    );


const cameraButton =
    document.getElementById(
        "cameraButton"
    );


const chromeButton =
    document.getElementById(
        "chromeButton"
    );


const browserAR =
    document.getElementById(
        "browserAR"
    );


const browserARButton =
    document.getElementById(
        "browserARButton"
    );


const video =
    document.getElementById(
        "camera"
    );


const canvas =
    document.getElementById(
        "threeCanvas"
    );


const status =
    document.getElementById(
        "status"
    );


const topBar =
    document.getElementById(
        "topBar"
    );


const trackingBadge =
    document.getElementById(
        "trackingBadge"
    );


const controls =
    document.getElementById(
        "controls"
    );


const placeButton =
    document.getElementById(
        "place"
    );


const closeButton =
    document.getElementById(
        "close"
    );


const resetButton =
    document.getElementById(
        "reset"
    );


const minusButton =
    document.getElementById(
        "minus"
    );


const plusButton =
    document.getElementById(
        "plus"
    );


const openChrome =
    document.getElementById(
        "openChrome"
    );


const scenePanel =
    document.getElementById(
        "scenePanel"
    );


const debug =
    document.getElementById(
        "debug"
    );


const reticle =
    document.getElementById(
        "reticle"
    );



/* =====================================================
   THREE
===================================================== */

let renderer =
    null;


let scene =
    null;


let camera3D =
    null;


let model =
    null;



/* =====================================================
   MODEL
===================================================== */

let modelScale =
    1;


let currentModel =
    "creature.glb";


let currentName =
    "Creature";



/* =====================================================
   WORLD OBJECT POSITION
===================================================== */

/*
 * Это ГЛАВНАЯ переменная.
 *
 * Здесь находится сцена
 * в мировой системе координат.
 *
 * После установки объекта
 * мы больше НЕ изменяем
 * эту координату при движении
 * телефона.
 */

const worldObjectPosition =
    new THREE.Vector3(
        0,
        -0.5,
        -3
    );


/*
 * Поворот объекта
 * тоже мировой.
 */

const worldObjectQuaternion =
    new THREE.Quaternion();



/* =====================================================
   CAMERA WORLD POSITION
===================================================== */

const cameraWorldPosition =
    new THREE.Vector3(
        0,
        0,
        0
    );


/*
 * Скорость камеры.
 */

const cameraVelocity =
    new THREE.Vector3(
        0,
        0,
        0
    );


/*
 * Ускорение.
 */

const filteredAcceleration =
    new THREE.Vector3(
        0,
        0,
        0
    );


/*
 * Ускорение после удаления
 * гравитации.
 */

const linearAcceleration =
    new THREE.Vector3(
        0,
        0,
        0
    );



/* =====================================================
   TELEGRAM SENSORS
===================================================== */

let alpha =
    0;


let beta =
    0;


let gamma =
    0;


let gyroX =
    0;


let gyroY =
    0;


let gyroZ =
    0;


let accX =
    0;


let accY =
    0;


let accZ =
    0;



/* =====================================================
   SENSOR STATE
===================================================== */

let orientationAvailable =
    false;


let gyroAvailable =
    false;


let accelerometerAvailable =
    false;


let orientationStarted =
    false;


let gyroStarted =
    false;


let accelerometerStarted =
    false;



/* =====================================================
   INITIAL ORIENTATION
===================================================== */

let initialDeviceQuaternion =
    new THREE.Quaternion();


let currentDeviceQuaternion =
    new THREE.Quaternion();


let cameraWorldQuaternion =
    new THREE.Quaternion();


let orientationInitialized =
    false;



/* =====================================================
   GRAVITY
===================================================== */

let gravityWorld =
    new THREE.Vector3(
        0,
        -9.81,
        0
    );


let gravityInitialized =
    false;


let gravitySamples =
    0;


const gravitySampleTarget =
    30;


const gravityAccumulator =
    new THREE.Vector3();



/* =====================================================
   ACCELERATION BIAS
===================================================== */

const accelerationBias =
    new THREE.Vector3(
        0,
        0,
        0
    );


let biasSamples =
    0;


const biasSampleTarget =
    60;



/* =====================================================
   TIMING
===================================================== */

let lastFrameTime =
    performance.now();


let lastGyroTime =
    performance.now();



/* =====================================================
   MOVEMENT PARAMETERS
===================================================== */

const ACCELERATION_DEAD_ZONE =
    0.12;


const VELOCITY_DEAD_ZONE =
    0.015;


const VELOCITY_DAMPING =
    0.88;


const MAX_VELOCITY =
    1.8;


/*
 * Коэффициент перемещения.
 *
 * Можно увеличить до 1.5,
 * если движение слишком маленькое.
 */

const POSITION_GAIN =
    0.85;



/* =====================================================
   GYRO QUATERNION
===================================================== */

let gyroQuaternion =
    new THREE.Quaternion();


let gyroInitialized =
    false;



/* =====================================================
   HELPERS
===================================================== */

function setStatus(
    text
) {

    status.textContent =
        text;

}



/* =====================================================
   THREE INIT
===================================================== */

function initThree() {

    if (
        renderer
    ) {

        return;

    }


    scene =
        new THREE.Scene();


    camera3D =
        new THREE.PerspectiveCamera(

            60,

            window.innerWidth /
            window.innerHeight,

            0.01,

            1000

        );


    camera3D.position.set(
        0,
        0,
        0
    );


    renderer =
        new THREE.WebGLRenderer({

            canvas:

                canvas,

            alpha:
                true,

            antialias:
                true

        });


    renderer.setPixelRatio(

        Math.min(

            window.devicePixelRatio,

            2

        )

    );


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    renderer.setClearColor(

        0x000000,

        0

    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    /*
     * Свет.
     */

    const hemisphere =
        new THREE.HemisphereLight(

            0xffffff,

            0x444444,

            2

        );


    scene.add(
        hemisphere
    );


    const directional =
        new THREE.DirectionalLight(

            0xffffff,

            2

        );


    directional.position.set(

        3,

        5,

        3

    );


    scene.add(
        directional
    );


    /*
     * Мировая сетка.
     *
     * По умолчанию выключена.
     * Можно включить для отладки.
     */

    const grid =
        new THREE.GridHelper(

            10,

            20

        );


    grid.visible =
        false;


    scene.add(
        grid
    );


    renderer.setAnimationLoop(
        render
    );

}



/* =====================================================
   LOAD MODEL
===================================================== */

function loadModel(
    filename,
    name
) {

    if (
        !scene
    ) {

        initThree();

    }


    currentModel =
        filename;


    currentName =
        name;


    setStatus(

        "Загрузка " +
        name +
        "..."

    );


    /*
     * Удаляем старую модель.
     */

    if (
        model
    ) {

        scene.remove(
            model
        );


        model.traverse(

            object => {

                if (
                    object.geometry
                ) {

                    object.geometry.dispose();

                }


                if (
                    object.material
                ) {

                    if (
                        Array.isArray(
                            object.material
                        )
                    ) {

                        object.material.forEach(

                            material => {

                                if (
                                    material.map
                                ) {

                                    material.map.dispose();

                                }


                                material.dispose();

                            }

                        );

                    }
                    else {

                        if (
                            object.material.map
                        ) {

                            object.material.map.dispose();

                        }


                        object.material.dispose();

                    }

                }

            }

        );


        model =
            null;

    }


    const loader =
        new GLTFLoader();


    loader.load(

        "./models/" +
        filename,


        gltf => {

            model =
                gltf.scene;


            /*
             * Масштаб.
             */

            model.scale.set(

                modelScale,

                modelScale,

                modelScale

            );


            /*
             * =================================================
             * ВАЖНО
             *
             * Модель помещается
             * в WORLD SPACE.
             *
             * Она НЕ привязывается
             * к camera3D.
             * =================================================
             */

            model.position.copy(

                worldObjectPosition

            );


            model.quaternion.copy(

                worldObjectQuaternion

            );


            scene.add(
                model
            );


            setStatus(

                name +
                " установлен в мировом пространстве"

            );

        },


        undefined,


        error => {

            console.error(
                error
            );


            setStatus(

                "Не удалось загрузить " +
                filename

            );

        }

    );

}



/* =====================================================
   GET DEVICE QUATERNION
===================================================== */

function getDeviceQuaternion() {

    /*
     * Telegram:
     *
     * alpha = Z
     * beta  = X
     * gamma = Y
     *
     * Значения Telegram
     * уже находятся в радианах.
     */

    const euler =
        new THREE.Euler(

            beta,

            alpha,

            -gamma,

            "YXZ"

        );


    const q =
        new THREE.Quaternion();


    q.setFromEuler(
        euler
    );


    /*
     * Учитываем ориентацию экрана.
     */

    const orientation =
        window.screen
            ?.orientation
            ?.angle || 0;


    const screenQuaternion =
        new THREE.Quaternion();


    screenQuaternion.setFromAxisAngle(

        new THREE.Vector3(
            0,
            0,
            1
        ),

        THREE.MathUtils.degToRad(
            -orientation
        )

    );


    q.multiply(
        screenQuaternion
    );


    return q;

}



/* =====================================================
   UPDATE CAMERA ROTATION
===================================================== */

function updateCameraRotation() {

    if (
        !camera3D
    ) {

        return;

    }


    currentDeviceQuaternion.copy(

        getDeviceQuaternion()

    );


    /*
     * Первое положение.
     */

    if (
        !orientationInitialized
    ) {

        initialDeviceQuaternion.copy(

            currentDeviceQuaternion

        );


        cameraWorldQuaternion.identity();


        gyroQuaternion.identity();


        orientationInitialized =
            true;


        gyroInitialized =
            true;

    }


    /*
     * Относительная ориентация:
     *
     * initial^-1 * current
     */

    const inverseInitial =
        initialDeviceQuaternion
            .clone()
            .invert();


    const relativeQuaternion =
        inverseInitial
            .multiply(
                currentDeviceQuaternion
            );


    /*
     * Камера получает вращение.
     *
     * НЕ MODEL.
     */

    cameraWorldQuaternion.copy(

        relativeQuaternion

    );


    /*
     * Небольшое сглаживание.
     */

    camera3D.quaternion.slerp(

        cameraWorldQuaternion,

        0.22

    );

}



/* =====================================================
   GRAVITY CALIBRATION
===================================================== */

function calibrateGravity() {

    if (
        !accelerometerAvailable
    ) {

        return;

    }


    const raw =
        new THREE.Vector3(

            accX,

            accY,

            accZ

        );


    /*
     * Переводим ускорение
     * в начальную мировую систему.
     */

    const worldAcceleration =
        raw.clone()
            .applyQuaternion(
                currentDeviceQuaternion
            );


    gravityAccumulator.add(
        worldAcceleration
    );


    gravitySamples++;


    if (
        gravitySamples >=
        gravitySampleTarget
    ) {

        gravityWorld.copy(

            gravityAccumulator
                .clone()
                .multiplyScalar(

                    1 /
                    gravitySamples

                )

        );


        gravityInitialized =
            true;


        setStatus(

            "Датчики откалиброваны"

        );

    }

}



/* =====================================================
   LINEAR ACCELERATION
===================================================== */

function calculateLinearAcceleration() {

    const raw =
        new THREE.Vector3(

            accX,

            accY,

            accZ

        );


    /*
     * Переводим из системы
     * координат телефона
     * в мировую систему.
     */

    const worldAcceleration =
        raw.clone()
            .applyQuaternion(

                currentDeviceQuaternion

            );


    /*
     * Если гравитация
     * откалибрована —
     * вычитаем её.
     */

    if (
        gravityInitialized
    ) {

        linearAcceleration.copy(

            worldAcceleration

        );


        linearAcceleration.sub(

            gravityWorld

        );

    }
    else {

        linearAcceleration.copy(

            worldAcceleration

        );

    }


    /*
     * Убираем bias.
     */

    linearAcceleration.sub(

        accelerationBias

    );


    /*
     * Dead zone.
     */

    if (
        Math.abs(
            linearAcceleration.x
        )
        <
        ACCELERATION_DEAD_ZONE
    ) {

        linearAcceleration.x =
            0;

    }


    if (
        Math.abs(
            linearAcceleration.y
        )
        <
        ACCELERATION_DEAD_ZONE
    ) {

        linearAcceleration.y =
            0;

    }


    if (
        Math.abs(
            linearAcceleration.z
        )
        <
        ACCELERATION_DEAD_ZONE
    ) {

        linearAcceleration.z =
            0;

    }


    /*
     * Фильтр.
     */

    filteredAcceleration.lerp(

        linearAcceleration,

        0.15

    );

}



/* =====================================================
   ACCELERATION BIAS
===================================================== */

function updateAccelerationBias() {

    /*
     * Если телефон почти неподвижен,
     * можно медленно оценивать
     * остаточную ошибку.
     */

    const accelerationMagnitude =
        filteredAcceleration.length();


    const gyroMagnitude =
        Math.sqrt(

            gyroX * gyroX +

            gyroY * gyroY +

            gyroZ * gyroZ

        );


    if (

        accelerationMagnitude
        <
        0.18

        &&

        gyroMagnitude
        <
        0.12

    ) {

        accelerationBias.lerp(

            linearAcceleration,

            0.01

        );

    }

}



/* =====================================================
   UPDATE CAMERA POSITION
===================================================== */

function updateCameraPosition(
    dt
) {

    calculateLinearAcceleration();


    updateAccelerationBias();


    /*
     * Ускорение -> скорость.
     */

    cameraVelocity.addScaledVector(

        filteredAcceleration,

        dt

    );


    /*
     * Затухание.
     */

    cameraVelocity.multiplyScalar(

        Math.pow(
            VELOCITY_DAMPING,
            dt * 60
        )

    );


    /*
     * Убираем микродвижение.
     */

    if (
        cameraVelocity.length()
        <
        VELOCITY_DEAD_ZONE
    ) {

        cameraVelocity.set(
            0,
            0,
            0
        );

    }


    /*
     * Ограничение скорости.
     */

    if (
        cameraVelocity.length()
        >
        MAX_VELOCITY
    ) {

        cameraVelocity.setLength(

            MAX_VELOCITY

        );

    }


    /*
     * Скорость -> позиция.
     */

    cameraWorldPosition.addScaledVector(

        cameraVelocity,

        dt *
        POSITION_GAIN

    );


    /*
     * Небольшое подавление
     * вертикального дрейфа.
     */

    cameraWorldPosition.y *=
        0.995;


    /*
     * ВАЖНО:
     *
     * Двигается камера.
     *
     * Не model.
     */

    camera3D.position.copy(

        cameraWorldPosition

    );

}



/* =====================================================
   SENSOR FUSION
===================================================== */

function updateTracking() {

    const now =
        performance.now();


    let dt =
        (
            now -
            lastFrameTime
        )
        /
        1000;


    lastFrameTime =
        now;


    /*
     * Ограничиваем
     * временной интервал.
     */

    dt =
        Math.min(
            dt,
            0.05
        );


    /*
     * Ориентация.
     */

    updateCameraRotation();


    /*
     * Первые секунды —
     * калибровка.
     */

    if (
        !gravityInitialized &&
        accelerometerAvailable
    ) {

        calibrateGravity();

    }


    /*
     * После калибровки
     * разрешаем перемещение.
     */

    if (
        gravityInitialized
    ) {

        updateCameraPosition(
            dt
        );

    }


    updateDebug();

}

/* =====================================================
   BROWSER SENSOR FALLBACK
===================================================== */

function startBrowserSensors() {

    /*
     * Этот fallback используется,
     * если Telegram sensors
     * недоступны.
     */

    window.addEventListener(

        "deviceorientation",

        event => {

            if (
                orientationAvailable
            ) {

                return;

            }


            alpha =
                THREE.MathUtils
                    .degToRad(
                        event.alpha || 0
                    );


            beta =
                THREE.MathUtils
                    .degToRad(
                        event.beta || 0
                    );


            gamma =
                THREE.MathUtils
                    .degToRad(
                        event.gamma || 0
                    );


            orientationAvailable =
                true;

        },

        true

    );


    window.addEventListener(

        "devicemotion",

        event => {

            if (
                accelerometerAvailable
            ) {

                return;

            }


            const acceleration =
                event.acceleration;


            if (
                acceleration
            ) {

                accX =
                    acceleration.x || 0;


                accY =
                    acceleration.y || 0;


                accZ =
                    acceleration.z || 0;


                accelerometerAvailable =
                    true;

            }


            const rotation =
                event.rotationRate;


            if (
                rotation
            ) {

                gyroX =
                    THREE.MathUtils
                        .degToRad(
                            rotation.alpha || 0
                        );


                gyroY =
                    THREE.MathUtils
                        .degToRad(
                            rotation.beta || 0
                        );


                gyroZ =
                    THREE.MathUtils
                        .degToRad(
                            rotation.gamma || 0
                        );


                gyroAvailable =
                    true;

            }

        },

        true

    );

}



/* =====================================================
   START ALL SENSORS
===================================================== */

function startAllSensors() {

    startBrowserSensors();


    if (
        tg
    ) {

        startTelegramOrientation();

        startTelegramGyroscope();

        startTelegramAccelerometer();

    }


    /*
     * Через небольшой интервал
     * проверяем результат.
     */

    setTimeout(

        () => {

            const sensors = [];


            if (
                orientationStarted ||
                orientationAvailable
            ) {

                sensors.push(
                    "ORIENTATION"
                );

            }


            if (
                gyroStarted ||
                gyroAvailable
            ) {

                sensors.push(
                    "GYRO"
                );

            }


            if (
                accelerometerStarted ||
                accelerometerAvailable
            ) {

                sensors.push(
                    "ACC"
                );

            }


            trackingBadge.textContent =

                sensors.length > 0

                    ? sensors.join(
                        " + "
                    )

                    : "NO SENSOR";


        },

        1000

    );

}



/* =====================================================
   START TELEGRAM CAMERA
===================================================== */

async function startTelegramCamera() {

    try {

        setStatus(

            "Запрашиваем камеру..."

        );


        if (
            !navigator.mediaDevices
        ) {

            throw new Error(

                "navigator.mediaDevices недоступен"

            );

        }


        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {

                            ideal:
                                "environment"

                        },

                        width: {

                            ideal:
                                1280

                        },

                        height: {

                            ideal:
                                720

                        }

                    },

                    audio:
                        false

                });


        video.srcObject =
            stream;


        await video.play();


        /*
         * UI.
         */

        video.style.display =
            "block";


        canvas.style.display =
            "block";


        start.style.display =
            "none";


        topBar.style.display =
            "flex";


        controls.style.display =
            "flex";


        scenePanel.style.display =
            "block";


        closeButton.style.display =
            "block";


        debug.style.display =
            "block";


        /*
         * Three.
         */

        initThree();


        /*
         * Сенсоры.
         */

        startAllSensors();


        /*
         * Сброс виртуальной камеры.
         */

        resetCameraOnly();


        /*
         * Загружаем сцену.
         */

        loadModel(

            currentModel,

            currentName

        );


        setStatus(

            "Держите телефон неподвижно 1–2 секунды"

        );


    }
    catch (
        error
    ) {

        console.error(
            error
        );


        setStatus(

            "Ошибка камеры: " +

            error.name +

            " — " +

            error.message

        );

    }

}

/* =====================================================
   PLACE OBJECT
===================================================== */

function placeObjectInFront() {

    if (
        !model ||
        !camera3D
    ) {

        return;

    }


    /*
     * Получаем направление
     * взгляда камеры.
     */

    const direction =
        new THREE.Vector3(

            0,
            0,
            -1

        );


    direction.applyQuaternion(

        camera3D.quaternion

    );


    /*
     * Объект находится
     * на расстоянии 3 метров
     * от камеры.
     */

    const distance =
        3;


    worldObjectPosition.copy(

        cameraWorldPosition

    );


    worldObjectPosition.addScaledVector(

        direction,

        distance

    );


    /*
     * Немного опускаем
     * объект относительно камеры.
     */

    worldObjectPosition.y -=
        0.5;


    /*
     * Позиция модели
     * записывается один раз.
     */

    model.position.copy(

        worldObjectPosition

    );


    model.quaternion.copy(

        worldObjectQuaternion

    );


    setStatus(

        "Сцена закреплена в World Space"

    );

}

/* =====================================================
   BROWSER WEBXR
===================================================== */

async function startBrowserAR() {

    if (
        !navigator.xr
    ) {

        setStatus(

            "WebXR отсутствует. " +
            "Нужен Chrome Android."

        );

        return;

    }


    try {

        const supported =

            await navigator.xr
                .isSessionSupported(
                    "immersive-ar"
                );


        if (
            !supported
        ) {

            setStatus(

                "immersive-ar недоступен. " +
                "Проверьте Chrome + ARCore."

            );

            return;

        }


        setStatus(

            "WebXR AR доступен"

        );


        /*
         * В настоящем WebXR
         * позиция камеры
         * определяется самой
         * AR-системой.
         */

        await startXR();

    }
    catch (
        error
    ) {

        console.error(
            error
        );


        setStatus(

            "WebXR ошибка: " +
            error.message

        );

    }

}



/* =====================================================
   XR
===================================================== */

let xrSession =
    null;


let xrReferenceSpace =
    null;


let hitTestSource =
    null;


let xrMode =
    false;


let objectPlaced =
    false;



/* =====================================================
   START XR
===================================================== */

async function startXR() {

    xrSession =

        await navigator.xr
            .requestSession(

                "immersive-ar",

                {

                    requiredFeatures: [

                        "local",

                        "hit-test"

                    ],

                    optionalFeatures: [

                        "local-floor",

                        "dom-overlay"

                    ],

                    domOverlay: {

                        root:
                            document.body

                    }

                }

            );


    initThree();


    renderer.xr.enabled =
        true;


    await renderer.xr
        .setSession(
            xrSession
        );


    xrMode =
        true;


    objectPlaced =
        false;


    xrReferenceSpace =

        await xrSession
            .requestReferenceSpace(
                "local"
            );


    const viewerSpace =

        await xrSession
            .requestReferenceSpace(
                "viewer"
            );


    hitTestSource =

        await xrSession
            .requestHitTestSource({

                space:
                    viewerSpace

            });


    start.style.display =
        "none";


    browserAR.style.display =
        "none";


    scenePanel.style.display =
        "block";


    controls.style.display =
        "flex";


    closeButton.style.display =
        "block";


    reticle.style.display =
        "block";


    debug.style.display =
        "block";


    placeButton.style.display =
        "block";


    trackingBadge.textContent =
        "TRUE 6DoF";


    setStatus(

        "Наведите телефон на поверхность"

    );


    xrSession.addEventListener(

        "select",

        () => {

            placeXRObject();

        }

    );


    xrSession.addEventListener(

        "end",

        () => {

            xrSession =
                null;

            xrMode =
                false;

            objectPlaced =
                false;

            hitTestSource =
                null;

            xrReferenceSpace =
                null;

            reticle.style.display =
                "none";

        }

    );

}



/* =====================================================
   XR FRAME
===================================================== */

function processXRFrame(
    frame
) {

    if (
        !xrSession ||
        !xrReferenceSpace
    ) {

        return;

    }


    const pose =

        frame.getViewerPose(
            xrReferenceSpace
        );


    if (
        !pose
    ) {

        return;

    }


    const position =

        pose.transform.position;


    debug.innerHTML =

        "TRUE WEBXR 6DoF<br><br>" +

        "CAMERA POSITION<br>" +

        "X: " +
        position.x.toFixed(3) +

        "<br>" +

        "Y: " +
        position.y.toFixed(3) +

        "<br>" +

        "Z: " +
        position.z.toFixed(3);


    /*
     * Hit test.
     */

    if (
        hitTestSource
    ) {

        const results =

            frame.getHitTestResults(

                hitTestSource

            );


        if (
            results.length > 0
        ) {

            const hit =
                results[0];


            const hitPose =

                hit.getPose(

                    xrReferenceSpace

                );


            if (
                hitPose &&
                !objectPlaced
            ) {

                reticle.style.display =
                    "block";

            }

        }

    }

}



/* =====================================================
   XR OBJECT PLACEMENT
===================================================== */

function placeXRObject() {

    if (
        !model ||
        !hitTestSource ||
        !xrReferenceSpace
    ) {

        return;

    }


    /*
     * Фактическая установка
     * выполняется в следующем
     * XR frame.
     */

    objectPlaced =
        true;


    reticle.style.display =
        "none";


    setStatus(

        currentName +
        " закреплён в AR-пространстве"

    );

}



/* =====================================================
   XR ANIMATION LOOP OVERRIDE
===================================================== */

renderer?.setAnimationLoop;



/*
 * Перехватываем frame,
 * если WebXR активен.
 */

const originalRender =
    render;



/* =====================================================
   MAIN ANIMATION
===================================================== */

function animationLoop(
    time,
    frame
) {

    if (
        xrMode &&
        frame
    ) {

        processXRFrame(
            frame
        );

    }
    else {

        originalRender();

    }

}



/* =====================================================
   BROWSER MODE
===================================================== */

const params =
    new URLSearchParams(

        window.location.search

    );


const browserMode =
    params.get(
        "mode"
    ) ===
    "ar";


if (
    browserMode
) {

    start.style.display =
        "none";


    browserAR.style.display =
        "flex";


    setTimeout(

        async () => {

            if (
                !navigator.xr
            ) {

                setStatus(

                    "Откройте страницу " +
                    "в Chrome Android."

                );

                return;

            }


            try {

                const supported =

                    await navigator.xr
                        .isSessionSupported(
                            "immersive-ar"
                        );


                if (
                    supported
                ) {

                    setStatus(

                        "WebXR AR доступен"

                    );

                }
                else {

                    setStatus(

                        "WebXR AR недоступен"

                    );

                }

            }
            catch (
                error
            ) {

                setStatus(

                    error.message

                );

            }

        },

        500

    );

}



/* =====================================================
   XR LOOP
===================================================== */

function setupXRLoop() {

    if (
        renderer
    ) {

        renderer.setAnimationLoop(

            (
                time,
                frame
            ) => {

                if (
                    xrMode &&
                    frame
                ) {

                    processXRFrame(
                        frame
                    );

                }


                if (
                    !xrMode
                ) {

                    updateTracking();

                }


                renderer.render(

                    scene,

                    camera3D

                );

            }

        );

    }

}



/* =====================================================
   INITIALIZE
===================================================== */

cameraButton.disabled =
    false;


setStatus(
    "Готово"
);


/*
 * Three запускается
 * после нажатия камеры.
 */

</script>
