<script type="module">

    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";


/* =============================================================
   CONFIG
============================================================= */

const TON_MANIFEST =
    "https://roman22022000.github.io/Ton_site/tonconnect-manifest.json";


const REQUIRED_COLLECTION =
    "EQD9mm3hx-QvHyNG18gDaaJtSTTQTVVYVjJ6zhonXocj2eyI";


const REQUIRED_COLLECTION_RAW =
    "0:fd9a6de1c7e42f1d8346d7c80369a26d4934d04d5558563eb38689d7a1c8f6";


const GENERATION_API =
    "https://api.araicameragame.party/api/generation";

const ARCHIVE_API =
    "https://api.araicameragame.party/api/models";


const MODEL_BASE =
    "https://raw.githubusercontent.com/Roman22022000/ArGameCam/main/models/";


/* =============================================================
   DOM
============================================================= */

const authScreen =
    document.getElementById("authScreen");

const homeScreen =
    document.getElementById("homeScreen");

const galleryScreen =
    document.getElementById("galleryScreen");

const viewerScreen =
    document.getElementById("viewerScreen");

const generationScreen =
    document.getElementById("generationScreen");

const userScreen =
    document.getElementById("userScreen");


const connectWallet =
    document.getElementById("connectWallet");

const authStatus =
    document.getElementById("authStatus");

const userWalletAddress =
    document.getElementById("userWalletAddress");

const disconnectWallet =
    document.getElementById("disconnectWallet");

const userStatus =
    document.getElementById("userStatus");


const galleryGrid =
    document.getElementById("galleryGrid");

const archiveScreen =
    document.getElementById("archiveScreen");

const archiveGrid =
    document.getElementById("archiveGrid");

const archiveStatus =
    document.getElementById("archiveStatus");


const viewerCanvas =
    document.getElementById("viewerCanvas");

const viewerNumber =
    document.getElementById("viewerNumber");


const generationCode =
    document.getElementById("generationCode");

const generationSubmit =
    document.getElementById("generationSubmit");

    document.getElementById("generationStatus");


const loading =

/* =============================================================
   SCREEN
============================================================= */

function showScreen(screen) {

    document
        .querySelectorAll(".screen")
        .forEach(element => {
            element.classList.remove("active");
        });

    screen.classList.add("active");
}


/* =============================================================
   TON CONNECT
============================================================= */

if (!window.TON_CONNECT_UI) {

    authStatus.textContent =
        "TON Connect не загрузился";

    throw new Error(
        "TON_CONNECT_UI not loaded"
    );
}


const tonConnectUI =
    new TON_CONNECT_UI.TonConnectUI({

        manifestUrl:
            TON_MANIFEST,

        buttonRootId:
            null,

        restoreConnection:
            true

    });


/*
    Важно:

    uiOptions является setter.
    Поэтому присваиваем объект целиком.
*/

tonConnectUI.uiOptions = {

    language: "ru",

    uiPreferences: {
        theme:
            "DARK",

        borderRadius:
            "none"
    }

};


/*
    Наша кнопка открывает
    официальное TON Connect окно.

    Именно внутри этого окна
    TON Connect показывает QR-код
    на desktop.
*/

connectWallet.addEventListener(
    "click",
    async () => {

        try {

            await tonConnectUI.openModal();

        } catch (error) {

            console.error(
                "TON Connect:",
                error
            );

            authStatus.textContent =
                "Ошибка открытия TON Connect";

        }

    }
);


/* =============================================================
   TON ADDRESS
============================================================= */

function base64UrlToBytes(value) {

    let normalized =
        String(value)
            .replace(/-/g, "+")
            .replace(/_/g, "/");


    while (
        normalized.length % 4 !== 0
    ) {

        normalized += "=";

    }


    const binary =
        atob(normalized);


    const bytes =
        new Uint8Array(
            binary.length
        );


    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(i);

    }


    return bytes;

}


function normalizeTonAddress(address) {

    if (!address) {
        return "";
    }


    address =
        String(address).trim();


    /*
        Уже raw:
        0:64hex
    */

    if (
        /^-?\d+:[0-9a-fA-F]{64}$/
            .test(address)
    ) {

        const parts =
            address.split(":");


        return (
            parts[0] +
            ":" +
            parts[1].toLowerCase()
        );

    }


    /*
        Friendly:
        EQ...
        UQ...
    */

    try {

        const bytes =
            base64UrlToBytes(
                address
            );


        if (
            bytes.length !== 36
        ) {

            return address.toLowerCase();

        }


        let workchain =
            bytes[1];


        if (
            workchain === 255
        ) {

            workchain = -1;

        }


        let hash = "";


        for (
            let i = 2;
            i < 34;
            i++
        ) {

            hash +=
                bytes[i]
                    .toString(16)
                    .padStart(2, "0");

        }


        return (
            workchain +
            ":" +
            hash.toLowerCase()
        );

    } catch {

        return address.toLowerCase();

    }

}


const normalizedRequiredCollection =
    normalizeTonAddress(
        REQUIRED_COLLECTION
    );


/* =============================================================
   NFT CHECK
============================================================= */

async function checkCollectionNFT(
    walletAddress
) {

    const url =
        "https://tonapi.io/v2/accounts/" +
        encodeURIComponent(
            walletAddress
        ) +
        "/nfts?limit=1000";


    const response =
        await fetch(url, {

            method: "GET",

            headers: {
                "Accept":
                    "application/json"
            }

        });


    if (!response.ok) {

        throw new Error(
            "TonAPI HTTP " +
            response.status
        );

    }


    const data =
        await response.json();


    const nftItems =
        Array.isArray(
            data.nft_items
        )
            ? data.nft_items
            : [];


    for (
        const nft of nftItems
    ) {

        const collectionAddress =
            nft.collection?.address ||
            nft.collection_address ||
            "";


        if (!collectionAddress) {
            continue;
        }


        const normalized =
            normalizeTonAddress(
                collectionAddress
            );


        if (
            normalized ===
                normalizedRequiredCollection
            ||
            normalized ===
                REQUIRED_COLLECTION_RAW
        ) {

            return true;

        }

    }


    return false;

}


/* =============================================================
   WALLET
============================================================= */

let currentWallet =
    null;

let accessGranted =
    false;

let checkingNFT =
    false;


async function processWallet(
    wallet
) {

    if (!wallet) {

        currentWallet =
            null;

        accessGranted =
            false;

        userWalletAddress.textContent =
            "";

        userStatus.textContent =
            "";

        authStatus.textContent =
            "Подключите TON-кошелёк";

        showScreen(
            authScreen
        );

        return;

    }


    if (
        checkingNFT
    ) {

        return;

    }


    if (
        !wallet.account ||
        !wallet.account.address
    ) {

        return;

    }


    currentWallet =
        wallet.account.address;


    accessGranted =
        false;

    checkingNFT =
        true;


    authStatus.textContent =
        "Проверка NFT...";


    loading.classList.add(
        "active"
    );


    try {

        const hasNFT =
            await checkCollectionNFT(
                currentWallet
            );


        if (!hasNFT) {

            accessGranted =
                false;


            authStatus.textContent =
                "NFT нужной коллекции не найден";


            showScreen(
                authScreen
            );


            return;

        }


        accessGranted =
            true;


        userWalletAddress.textContent =
            currentWallet;


        authStatus.textContent =
            "Доступ разрешён";


        showScreen(
            homeScreen
        );


    } catch (error) {

        console.error(
            "NFT CHECK ERROR:",
            error
        );


        accessGranted =
            false;


        authStatus.textContent =
            "Ошибка проверки NFT";


        showScreen(
            authScreen
        );


    } finally {

        checkingNFT =
            false;


        loading.classList.remove(
            "active"
        );

    }

}


/*
    Срабатывает после:

    - подключения
    - отключения
    - восстановления сессии
*/

tonConnectUI.onStatusChange(
    async wallet => {

        await processWallet(
            wallet
        );

    },
    error => {

        console.error(
            "TON Connect error:",
            error

let archiveModels = [];

async function loadArchiveModels() {

    archiveStatus.textContent =
        "Загрузка 3D моделей...";

    archiveGrid.innerHTML =
        "";

    try {

        const response =
            await fetch(
                ARCHIVE_API,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const data =
            await response.json();

        archiveModels =
            Array.isArray(data.items)
                ? data.items
                : [];

        if (!archiveModels.length) {

            archiveStatus.textContent =
                "В архиве пока нет 3D моделей.";

            return;
        }

        archiveStatus.textContent =
            "Моделей: " +
            archiveModels.length;

        archiveModels.forEach(
            (item, index) => {

                const button =
                    document.createElement(
                        "button"
                    );

                button.type =
                    "button";

                button.className =
                    "archiveItem";

                const preview =
                    document.createElement(
                        "div"
                    );

                preview.className =
                    "archivePlaceholder";

                preview.textContent =
                    "3D";

                button.appendChild(
                    preview
                );

                const info =
                    document.createElement(
                        "div"
                    );

                info.className =
                    "archiveInfo";

                const name =
                    document.createElement(
                        "div"
                    );

                name.className =
                    "archiveName";

                name.textContent =
                    item.filename || "model";

                const folder =
                    document.createElement(
                        "div"
                    );

                folder.className =
                    "archiveFolder";

                folder.textContent =
                    (
                        item.folder || ""
                    ).toUpperCase();

                info.appendChild(
                    name
                );

                info.appendChild(
                    folder
                );

                button.appendChild(
                    info
                );

                button.addEventListener(
                    "click",
                    () => {
                        openArchiveViewer(
                            index
                        );
                    }
                );

                archiveGrid.appendChild(
                    button
                );

            }
        );

    } catch (error) {

        console.error(
            "ARCHIVE ERROR:",
            error
        );

        archiveStatus.textContent =
            "Не удалось получить архив.";

    }

}


function openArchiveViewer(index) {

    viewerOpenedFromArchive =
        true;

    if (!requireAccess()) {
        return;
    }

    const item =
        archiveModels[index];

    if (!item) {
        return;
    }

    viewerNumber.textContent =
        item.filename || "3D";

    showScreen(
        viewerScreen
    );

    initViewer();

    if (model) {

        scene.remove(
            model
        );

        model.traverse(
            object => {

                if (
                    object.geometry
                ) {
                    object.geometry.dispose();
                }

                if (
                    object.material
                ) {

                    if (
                        Array.isArray(
                            object.material
                        )
                    ) {

                        object.material.forEach(
                            material => {
                                material.dispose();
                            }
                        );

                    } else {

                        object.material.dispose();

                    }

                }

            }
        );

        model = null;

    }

    loader.load(

        item.url,

        gltf => {

            model =
                gltf.scene;

            const box =
                new THREE.Box3()
                    .setFromObject(
                        model
                    );

            const center =
                box.getCenter(
                    new THREE.Vector3()
                );

            const size =
                box.getSize(
                    new THREE.Vector3()
                );

            model.position.sub(
                center
            );

            const maxSize =
                Math.max(
                    size.x,
                    size.y,
                    size.z
                );

            if (
                maxSize > 0
            ) {

                model.scale.setScalar(
                    2 / maxSize
                );

            }

            model.traverse(
                object => {

                    if (
                        object.isMesh
                    ) {

                        object.castShadow =
                            true;

                        object.receiveShadow =
                            true;

                    }

                }
            );

            scene.add(
                model
            );

            controls.target.set(
                0,
                0,
                0
            );

            controls.update();

        },

        undefined,

        error => {

            console.error(
                "ARCHIVE MODEL ERROR:",
                error
            );

        }

    );

}

/* =============================================================
   THREE.JS VIEWER
   Доработка:
   - размеры определяются по реальной модели;
   - камера не выходит за рассчитанные границы;
   - камера не входит внутрь модели;
   - 1 палец = вращение вокруг модели;
   - 2 пальца = приближение / отдаление;
   - архив загружает item.url вместе с ресурсами GLTF/GLB.
============================================================= */

let scene = null;
let camera = null;
let renderer = null;
let model = null;
let viewerOpenedFromArchive = false;

const loader = new GLTFLoader();

let modelBounds = null;
let modelCenter = new THREE.Vector3(0, 0, 0);
let modelRadius = 1;

/* Без фиксированного размера сцены. */
const CAMERA_MARGIN = 0.20;
const MODEL_COLLISION_MARGIN = 0.30;
const MIN_CAMERA_HEIGHT = 0.08;
const MAX_CAMERA_HEIGHT_FACTOR = 1.50;

/* Поворот пальцем. */
let touchActive = false;
let touchLastX = 0;
let touchLastY = 0;
let yaw = 0;
let pitch = 0;

/* Два пальца. */
let pinchLastDistance = 0;

/* Направление взгляда. */
const tempVector = new THREE.Vector3();
const tempCenter = new THREE.Vector3();


/* =============================================================
   INIT VIEWER
============================================================= */

function initViewer() {

    if (renderer) {
        return;
    }

    scene = new THREE.Scene();

    scene.background = new THREE.Color(0x000000);

    camera = new THREE.PerspectiveCamera(
        55,
        window.innerWidth / window.innerHeight,
        0.01,
        2000
    );

    camera.position.set(0, 1.5, 3);

    renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false,
        powerPreference: "high-performance"
    });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio || 1, 2)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    viewerCanvas.innerHTML = "";

    viewerCanvas.appendChild(
        renderer.domElement
    );

    renderer.domElement.style.touchAction = "none";
    renderer.domElement.style.userSelect = "none";
    renderer.domElement.style.webkitUserSelect = "none";

    const ambient = new THREE.AmbientLight(
        0xffffff,
        2
    );

    scene.add(ambient);

    const light = new THREE.DirectionalLight(
        0xffffff,
        3
    );

    light.position.set(5, 8, 5);

    scene.add(light);

    renderer.domElement.addEventListener(
        "touchstart",
        onTouchStart,
        { passive: false }
    );

    renderer.domElement.addEventListener(
        "touchmove",
        onTouchMove,
        { passive: false }
    );

    renderer.domElement.addEventListener(
        "touchend",
        onTouchEnd,
        { passive: false }
    );

    renderer.domElement.addEventListener(
        "touchcancel",
        onTouchEnd,
        { passive: false }
    );

    window.addEventListener(
        "resize",
        resizeViewer
    );

    animateViewer();
}


/* =============================================================
   CLEAR MODEL
============================================================= */

function clearModel() {

    if (!model || !scene) {
        return;
    }

    scene.remove(model);

    model.traverse(object => {

        if (object.geometry) {
            object.geometry.dispose();
        }

        if (object.material) {

            const materials = Array.isArray(object.material)
                ? object.material
                : [object.material];

            materials.forEach(material => {

                if (material.map) {
                    material.map.dispose();
                }

                if (material.normalMap) {
                    material.normalMap.dispose();
                }

                if (material.roughnessMap) {
                    material.roughnessMap.dispose();
                }

                if (material.metalnessMap) {
                    material.metalnessMap.dispose();
                }

                if (material.emissiveMap) {
                    material.emissiveMap.dispose();
                }

                material.dispose();
            });
        }
    });

    model = null;
    modelBounds = null;
    modelCenter.set(0, 0, 0);
    modelRadius = 1;
}


/* =============================================================
   CALCULATE REAL MODEL BOUNDS
============================================================= */

function calculateModelBounds() {

    if (!model) {
        return;
    }

    model.updateMatrixWorld(true);

    const box = new THREE.Box3()
        .setFromObject(model);

    if (box.isEmpty()) {
        return;
    }

    modelBounds = box.clone();

    box.getCenter(modelCenter);

    const sphere = box.getBoundingSphere(
        new THREE.Sphere()
    );

    modelRadius = Math.max(
        sphere.radius,
        0.1
    );

    const size = box.getSize(
        new THREE.Vector3()
    );

    console.log("MODEL REAL BOUNDS:", {
        min: box.min.clone(),
        max: box.max.clone(),
        size: size,
        center: modelCenter.clone(),
        radius: modelRadius
    });

    /*
       Начальный ракурс располагаем перед моделью.
       Расстояние зависит от реального размера модели.
    */

    const startDistance = Math.max(
        modelRadius * 2.5,
        1.0
    );

    camera.position.set(
        modelCenter.x,
        modelCenter.y,
        modelCenter.z + startDistance
    );

    yaw = 0;
    pitch = 0;

    clampCameraToModelBounds();

    camera.lookAt(modelCenter);
}


/* =============================================================
   CAMERA BOUNDS

   Границы строятся из реального bounding box модели.
   Камера получает небольшой безопасный отступ.
============================================================= */

function clampCameraToModelBounds() {

    if (!camera || !modelBounds) {
        return;
    }

    const minX =
        modelBounds.min.x - CAMERA_MARGIN;

    const maxX =
        modelBounds.max.x + CAMERA_MARGIN;

    const minZ =
        modelBounds.min.z - CAMERA_MARGIN;

    const maxZ =
        modelBounds.max.z + CAMERA_MARGIN;

    const minY =
        Math.max(
            MIN_CAMERA_HEIGHT,
            modelBounds.min.y - CAMERA_MARGIN
        );

    const maxY =
        modelBounds.max.y +
        Math.max(
            CAMERA_MARGIN,
            modelRadius * MAX_CAMERA_HEIGHT_FACTOR
        );

    camera.position.x = Math.max(
        minX,
        Math.min(maxX, camera.position.x)
    );

    camera.position.y = Math.max(
        minY,
        Math.min(maxY, camera.position.y)
    );

    camera.position.z = Math.max(
        minZ,
        Math.min(maxZ, camera.position.z)
    );

    keepCameraOutsideModel();
}


/* =============================================================
   KEEP CAMERA OUTSIDE MODEL

   Bounding sphere + bounding box используются вместе.
   Это не позволяет камере проваливаться внутрь модели.
============================================================= */

function keepCameraOutsideModel() {

    if (!camera || !modelBounds) {
        return;
    }

    const direction = camera.position
        .clone()
        .sub(modelCenter);

    const distance = direction.length();

    const safeDistance = Math.max(
        MODEL_COLLISION_MARGIN,
        modelRadius * 0.18
    );

    if (distance >= safeDistance) {
        return;
    }

    if (distance < 0.0001) {
        direction.set(0, 0, 1);
    } else {
        direction.normalize();
    }

    camera.position.copy(
        modelCenter
            .clone()
            .add(
                direction.multiplyScalar(
                    safeDistance
                )
            )
    );

    /* После выталкивания ещё раз проверяем реальные края. */
    clampCameraPositionOnly();
}


/* =============================================================
   POSITION CLAMP ONLY
============================================================= */

function clampCameraPositionOnly() {

    if (!camera || !modelBounds) {
        return;
    }

    const minX = modelBounds.min.x - CAMERA_MARGIN;
    const maxX = modelBounds.max.x + CAMERA_MARGIN;

    const minZ = modelBounds.min.z - CAMERA_MARGIN;
    const maxZ = modelBounds.max.z + CAMERA_MARGIN;

    const minY = Math.max(
        MIN_CAMERA_HEIGHT,
        modelBounds.min.y - CAMERA_MARGIN
    );

    const maxY =
        modelBounds.max.y +
        Math.max(
            CAMERA_MARGIN,
            modelRadius * MAX_CAMERA_HEIGHT_FACTOR
        );

    camera.position.x = Math.max(
        minX,
        Math.min(maxX, camera.position.x)
    );

    camera.position.y = Math.max(
        minY,
        Math.min(maxY, camera.position.y)
    );

    camera.position.z = Math.max(
        minZ,
        Math.min(maxZ, camera.position.z)
    );
}


/* =============================================================
   CAMERA ROTATION
============================================================= */

function rotateCamera(deltaX, deltaY) {

    if (!camera || !modelBounds) {
        return;
    }

    const offset = camera.position
        .clone()
        .sub(modelCenter);

    let radius = offset.length();

    radius = Math.max(
        radius,
        modelRadius * 0.25
    );

    const spherical = new THREE.Spherical()
        .setFromVector3(offset);

    spherical.theta -= deltaX;
    spherical.phi += deltaY;

    spherical.phi = Math.max(
        0.05,
        Math.min(
            Math.PI - 0.05,
            spherical.phi
        )
    );

    spherical.radius = radius;

    camera.position
        .setFromSpherical(spherical)
        .add(modelCenter);

    clampCameraToModelBounds();

    camera.lookAt(modelCenter);
}


/* =============================================================
   PINCH / CAMERA DISTANCE
============================================================= */

function moveCameraByPinch(delta) {

    if (!camera || !modelBounds) {
        return;
    }

    const direction = camera.position
        .clone()
        .sub(modelCenter)
        .normalize();

    /*
       Положительный delta = пальцы раздвигаются,
       камера приближается.
    */

    const movement = delta * 0.012;

    camera.position.sub(
        direction.multiplyScalar(movement)
    );

    clampCameraToModelBounds();

    camera.lookAt(modelCenter);
}


/* =============================================================
   TOUCH START
============================================================= */

function onTouchStart(event) {

    event.preventDefault();

    if (event.touches.length === 1) {

        const touch = event.touches[0];

        touchLastX = touch.clientX;
        touchLastY = touch.clientY;

        touchActive = true;

        pinchLastDistance = 0;
    }

    if (event.touches.length === 2) {

        touchActive = false;

        pinchLastDistance =
            getTouchDistance(event.touches);
    }
}


/* =============================================================
   TOUCH MOVE
============================================================= */

function onTouchMove(event) {

    event.preventDefault();

    if (event.touches.length === 1 && touchActive) {

        const touch = event.touches[0];

        const dx =
            touch.clientX - touchLastX;

        const dy =
            touch.clientY - touchLastY;

        touchLastX = touch.clientX;
        touchLastY = touch.clientY;

        /* Один палец вращает сцену. */
        rotateCamera(
            dx * 0.008,
            dy * 0.008
        );
    }

    if (event.touches.length === 2) {

        const distance =
            getTouchDistance(event.touches);

        if (pinchLastDistance > 0) {

            const delta =
                distance - pinchLastDistance;

            moveCameraByPinch(delta);
        }

        pinchLastDistance = distance;
    }
}


/* =============================================================
   TOUCH END
============================================================= */

function onTouchEnd(event) {

    event.preventDefault();

    if (event.touches.length === 0) {

        touchActive = false;
        pinchLastDistance = 0;
        return;
    }

    if (event.touches.length === 1) {

        const touch = event.touches[0];

        touchLastX = touch.clientX;
        touchLastY = touch.clientY;

        touchActive = true;
        pinchLastDistance = 0;
    }
}


/* =============================================================
   TOUCH DISTANCE
============================================================= */

function getTouchDistance(touches) {

    const dx =
        touches[0].clientX -
        touches[1].clientX;

    const dy =
        touches[0].clientY -
        touches[1].clientY;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );
}


/* =============================================================
   RESIZE
============================================================= */

function resizeViewer() {

    if (!camera || !renderer) {
        return;
    }

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}


/* =============================================================
   ANIMATE
============================================================= */

function animateViewer() {

    requestAnimationFrame(
        animateViewer
    );

    /* Жёсткая проверка каждый кадр. */
    if (camera && modelBounds) {
        clampCameraToModelBounds();
        camera.lookAt(modelCenter);
    }

    if (
        renderer &&
        scene &&
        camera
    ) {

        renderer.render(
            scene,
            camera
        );
    }
}


/* =============================================================
   LOAD ARCHIVE MODEL + TEXTURES
============================================================= */

function loadArchiveModel(item) {

    if (!item) {
        return;
    }

    let url = item.url;

    if (!url) {

        console.error(
            "ARCHIVE MODEL URL отсутствует:",
            item
        );

        viewerNumber.textContent =
            "URL МОДЕЛИ НЕ НАЙДЕН";

        return;
    }

    /*
       API может вернуть абсолютный URL
       или относительный путь.
    */

    try {
        url = new URL(
            url,
            ARCHIVE_API
        ).href;
    } catch (error) {

        console.error(
            "ARCHIVE URL ERROR:",
            error
        );

        return;
    }

    console.log(
        "ARCHIVE MODEL URL:",
        url
    );

    loader.load(

        url,

        gltf => {

            model = gltf.scene;

            /*
               GLTFLoader сам загружает ресурсы,
               которые указаны внутри GLB/GLTF:
               PNG/JPG текстуры, normal map,
               roughness map и т.д.
            */

            model.traverse(object => {

                if (object.isMesh) {

                    object.castShadow = true;
                    object.receiveShadow = true;

                    if (object.material) {

                        const materials =
                            Array.isArray(object.material)
                                ? object.material
                                : [object.material];

                        materials.forEach(material => {
                            material.needsUpdate = true;
                        });
                    }
                }
            });

            scene.add(model);

            /*
               Реальные края и углы модели.
               Никаких 4x7x4.
            */

            calculateModelBounds();

            viewerNumber.textContent =
                item.filename || "3D";

        },

        progress => {

            if (progress.total > 0) {

                const percent = Math.round(
                    progress.loaded /
                    progress.total *
                    100
                );

                console.log(
                    "MODEL LOAD:",
                    percent + "%"
                );
            }
        },

        error => {

            console.error(
                "ARCHIVE MODEL ERROR:",
                error
            );

            viewerNumber.textContent =
                "ОШИБКА ЗАГРУЗКИ";
        }
    );
}


/* =============================================================
   OPEN ARCHIVE VIEWER
============================================================= */

function openArchiveViewer(index) {

    viewerOpenedFromArchive = true;

    if (!requireAccess()) {
        return;
    }

    const item = archiveModels[index];

    if (!item) {
        return;
    }

    viewerNumber.textContent =
        item.filename || "3D";

    showScreen(viewerScreen);

    initViewer();

    clearModel();

    loadArchiveModel(item);
}


/* =============================================================
   OPEN GALLERY MODEL
============================================================= */

function openViewer(index) {

    viewerOpenedFromArchive = false;

    if (!requireAccess()) {
        return;
    }

    const item = galleryItems[index];

    if (!item) {
        return;
    }

    viewerNumber.textContent =
        item.number;

    showScreen(viewerScreen);

    initViewer();

    clearModel();

    const url =
        MODEL_BASE +
        encodeURIComponent(
            item.filename
        );

    loader.load(

        url,

        gltf => {

            model = gltf.scene;

            model.traverse(object => {

                if (object.isMesh) {

                    object.castShadow = true;
                    object.receiveShadow = true;
                }
            });

            scene.add(model);

            calculateModelBounds();
        },

        undefined,

        error => {

            console.error(
                "MODEL ERROR:",
                error
            );

            viewerNumber.textContent =
                "ОШИБКА ЗАГРУЗКИ";
        }
    );
}
