/* =========================================================
   RESET
========================================================= */

* {

    padding: 0;

}


html,

    font-family:

        Helvetica,
        sans-serif;

/* =========================================================
   APP
========================================================= */

    position: fixed;

    inset: 0;

    overflow: hidden;

    background: #000;

}

   CAMERA
========================================================= */

#camera {

    position: absolute;

    inset: 0;

    height: 100%;

    background: #000;

    z-index: 1;

    display: none;

}


/* =========================================================
   THREE
========================================================= */

#threeCanvas {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    z-index: 2;

    display: none;

    pointer-events: none;

}


/* =========================================================
   START
========================================================= */

#start {

    position: absolute;

    inset: 0;

    z-index: 100;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    padding: 25px;

    text-align: center;

    color: white;

    background:

        radial-gradient(

            #263842 0%,

            #11191e 55%,

}


#start h1 {

    margin-bottom: 14px;

}


#start p {

}


/* =========================================================
   BUTTON
========================================================= */

.mainButton {

    border: none;

}


.mainButton:active {

}


/* =========================================================
   STATUS
========================================================= */

#status {

    position: absolute;

        calc(

            58px +

            env(safe-area-inset-top)

        translateX(-50%);

        calc(100% - 30px);

    max-width: 500px;

    padding: 10px 14px;

    border-radius: 12px;

        rgba(0,0,0,.68);

    text-align: center;

    font-size: 12px;

    backdrop-filter:
        blur(12px);

}


/* =========================================================
   TOP
========================================================= */

#topBar {

    position: absolute;

    left: 12px;

    right: 12px;

    top:

        calc(

            10px +

}


.badge {

/* =========================================================

#close {

<script type="module">


import * as THREE
from "three";


import {
    GLTFLoader
}
from
"three/addons/loaders/GLTFLoader.js";



/* =========================================================
   TELEGRAM
========================================================= */

const tg =
    window.Telegram?.WebApp ||
    null;



if (tg) {

    tg.ready();

    tg.expand();


    if (
        tg.disableVerticalSwipes
    ) {

        tg.disableVerticalSwipes();

    }

}



/* =========================================================
   DOM
========================================================= */

const start =
    document.getElementById(
        "start"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const xrButton =
    document.getElementById(
        "xrButton"
    );


const webxrButton =
    document.getElementById(
        "webxr"
    );


const camera =
    document.getElementById(
        "camera"
    );


const canvas =
    document.getElementById(
        "threeCanvas"
    );


const status =
    document.getElementById(
        "status"
    );


const topBar =
    document.getElementById(
        "topBar"
    );


const trackingBadge =
    document.getElementById(
        "trackingBadge"
    );


const debug =
    document.getElementById(
        "debug"
    );


const controls =
    document.getElementById(
        "controls"
    );


const closeButton =
    document.getElementById(
        "close"
    );


const placeButton =
    document.getElementById(
        "place"
    );


const resetButton =
    document.getElementById(
        "reset"
    );


const minusButton =
    document.getElementById(
        "minus"
    );


const plusButton =
    document.getElementById(
        "plus"
    );


const scenePanel =
    document.getElementById(
        "scenePanel"
    );



/* =========================================================
   THREE
========================================================= */

let renderer =
    null;


let scene =
    null;


let camera3D =
    null;


let model =
    null;



/* =========================================================
   MODEL
========================================================= */

let modelScale =
    1;


let currentModel =
    "creature.glb";


let currentName =
    "Creature";


/*
 * Мировая позиция объекта.
 *
 * Она изменяется только
 * при первоначальной установке.
 */

const objectWorldPosition =
    new THREE.Vector3(
        0,
        -0.5,
        -3
    );


const objectWorldQuaternion =
    new THREE.Quaternion();


let objectPlaced =
    false;



/* =========================================================
   CAMERA WORLD POSE
========================================================= */

const cameraWorldPosition =
    new THREE.Vector3(
        0,
        0,
        0
    );


const cameraVelocity =
    new THREE.Vector3(
        0,
        0,
        0
    );


const cameraAcceleration =
    new THREE.Vector3(
        0,
        0,
        0
    );


const gravity =
    new THREE.Vector3(
        0,
        0,
        0
    );


const accelerationBias =
    new THREE.Vector3(
        0,
        0,
        0
    );



/* =========================================================
   ORIENTATION
========================================================= */

let alpha =
    0;


let beta =
    0;


let gamma =
    0;


let initialQuaternion =
    new THREE.Quaternion();


let currentQuaternion =
    new THREE.Quaternion();


let cameraQuaternion =
    new THREE.Quaternion();


let orientationReady =
    false;



/* =========================================================
   GYROSCOPE
========================================================= */

let gyroX =
    0;


let gyroY =
    0;


let gyroZ =
    0;



/* =========================================================
   ACCELEROMETER
========================================================= */

let accX =
    0;


let accY =
    0;


let accZ =
    0;



/* =========================================================
   SENSOR FLAGS
========================================================= */

let orientationOK =
    false;


let gyroOK =
    false;


let accelerometerOK =
    false;



/* =========================================================
   CALIBRATION
========================================================= */

let gravitySamples =
    0;


let gravityAccumulator =
    new THREE.Vector3();


const GRAVITY_SAMPLES =
    40;


let calibrated =
    false;



/* =========================================================
   TIMING
========================================================= */

let lastTime =
    performance.now();



/* =========================================================
   MOVEMENT PARAMETERS
========================================================= */

const ACCEL_DEAD_ZONE =
    0.15;


const VELOCITY_DAMPING =
    0.90;


const MAX_SPEED =
    1.5;


const MOVEMENT_GAIN =
    0.75;



/* =========================================================
   XR
========================================================= */

let xrSession =
    null;


let xrReferenceSpace =
    null;


let xrViewerSpace =
    null;


let xrHitTestSource =
    null;


let xrActive =
    false;


let xrPlaced =
    false;



/* =========================================================
   STATUS
========================================================= */

function setStatus(
    text
) {

    status.textContent =
        text;

}



/* =========================================================
   THREE INIT
========================================================= */

function initThree() {

    if (
        renderer
    ) {

        return;

    }


    scene =
        new THREE.Scene();


    camera3D =
        new THREE.PerspectiveCamera(

            60,

            window.innerWidth /
            window.innerHeight,

            0.01,

            1000

        );


    camera3D.position.set(

        0,
        0,
        0

    );


    renderer =
        new THREE.WebGLRenderer({

            canvas:
                canvas,

            alpha:
                true,

            antialias:
                true

        });


    renderer.setPixelRatio(

        Math.min(

            window.devicePixelRatio,

            2

        )

    );


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    renderer.setClearColor(

        0x000000,

        0

    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    /*
     * Свет.
     */

    const hemisphere =
        new THREE.HemisphereLight(

            0xffffff,

            0x444444,

            2

        );


    scene.add(
        hemisphere
    );


    const directional =
        new THREE.DirectionalLight(

            0xffffff,

            2

        );


    directional.position.set(

        3,
        5,
        3

    );


    scene.add(
        directional
    );


    renderer.setAnimationLoop(

        render

    );

}



/* =========================================================
   MODEL LOAD
========================================================= */

function loadModel(
    filename,
    name
) {

    initThree();


    currentModel =
        filename;


    currentName =
        name;


    setStatus(

        "Загрузка " +
        name +
        "..."

    );


    if (
        model
    ) {

        scene.remove(
            model
        );


        model.traverse(

            object => {

                if (
                    object.geometry
                ) {

                    object.geometry.dispose();

                }


                if (
                    object.material
                ) {

                    if (
                        Array.isArray(
                            object.material
                        )
                    ) {

                        object.material.forEach(

                            material => {

                                if (
                                    material.map
                                ) {

                                    material.map.dispose();

                                }


                                material.dispose();

                            }

                        );

                    }
                    else {

                        if (
                            object.material.map
                        ) {

                            object.material.map.dispose();

                        }


                        object.material.dispose();

                    }

                }

            }

        );


        model =
            null;

    }


    const loader =
        new GLTFLoader();


    loader.load(

        "./models/" +
        filename,


        gltf => {

            model =
                gltf.scene;


            model.scale.set(

                modelScale,
                modelScale,
                modelScale

            );


            /*
             * =================================================
             * WORLD SPACE
             *
             * Модель не является дочерним
             * объектом камеры.
             *
             * Поэтому она не вращается
             * вместе с телефоном.
             * =================================================
             */

            model.position.copy(

                objectWorldPosition

            );


            model.quaternion.copy(

                objectWorldQuaternion

            );


            scene.add(
                model
            );


            objectPlaced =
                true;


            setStatus(

                name +
                " находится в World Space"

            );

        },


        undefined,


        error => {

            console.error(
                error
            );


            setStatus(

                "Ошибка загрузки " +
                filename

            );

        }

    );

}



/* =========================================================
   DEVICE ORIENTATION -> QUATERNION
========================================================= */

function getDeviceQuaternion() {

    /*
     * Telegram:
     *
     * alpha = Z
     * beta  = X
     * gamma = Y
     *
     * Все значения Telegram
     * находятся в радианах.
     */

    const euler =
        new THREE.Euler(

            beta,

            alpha,

            -gamma,

            "YXZ"

        );


    const q =
        new THREE.Quaternion();


    q.setFromEuler(
        euler
    );


    /*
     * Ориентация экрана.
     */

    const screenAngle =

        window
            .screen
            ?.orientation
            ?.angle || 0;


    const screenQuaternion =
        new THREE.Quaternion();


    screenQuaternion.setFromAxisAngle(

        new THREE.Vector3(
            0,
            0,
            1
        ),

        THREE.MathUtils.degToRad(

            -screenAngle

        )

    );


    q.multiply(
        screenQuaternion
    );


    return q;

}



/* =========================================================
   ORIENTATION UPDATE
========================================================= */

function updateOrientation() {

    if (
        !camera3D
    ) {

        return;

    }


    currentQuaternion.copy(

        getDeviceQuaternion()

    );


    /*
     * Первая ориентация
     * становится нулевой.
     */

    if (
        !orientationReady
    ) {

        initialQuaternion.copy(

            currentQuaternion

        );


        orientationReady =
            true;

    }


    const inverse =
        initialQuaternion
            .clone()
            .invert();


    const relative =
        inverse.multiply(

            currentQuaternion

        );


    cameraQuaternion.copy(

        relative

    );


    /*
     * Плавное вращение камеры.
     */

    camera3D.quaternion.slerp(

        cameraQuaternion,

        0.30

    );

}



/* =========================================================
   ACCELERATION -> WORLD
========================================================= */

function calculateWorldAcceleration() {

    const raw =
        new THREE.Vector3(

            accX,

            accY,

            accZ

        );


    /*
     * Переводим ускорение
     * из координат телефона
     * в мировую систему.
     */

    raw.applyQuaternion(

        currentQuaternion

    );


    /*
     * Первые измерения:
     * определяем gravity.
     */

    if (
        !calibrated
    ) {

        gravityAccumulator.add(
            raw
        );


        gravitySamples++;


        if (
            gravitySamples >=
            GRAVITY_SAMPLES
        ) {

            gravity.copy(

                gravityAccumulator
                    .clone()
                    .multiplyScalar(

                        1 /
                        gravitySamples

                    )

            );


            calibrated =
                true;


            setStatus(

                "Калибровка завершена. " +
                "Можно двигаться."

            );

        }


        return;

    }


    /*
     * Убираем gravity.
     */

    cameraAcceleration.copy(
        raw
    );


    cameraAcceleration.sub(
        gravity
    );


    /*
     * Убираем маленький шум.
     */

    if (
        Math.abs(
            cameraAcceleration.x
        )
        <
        ACCEL_DEAD_ZONE
    ) {

        cameraAcceleration.x =
            0;

    }


    if (
        Math.abs(
            cameraAcceleration.y
        )
        <
        ACCEL_DEAD_ZONE
    ) {

        cameraAcceleration.y =
            0;

    }


    if (
        Math.abs(
            cameraAcceleration.z
        )
        <
        ACCEL_DEAD_ZONE
    ) {

        cameraAcceleration.z =
            0;

    }

}



/* =========================================================
   POSITION ESTIMATION
========================================================= */

function updateEstimatedPosition(
    dt
) {

    calculateWorldAcceleration();


    if (
        !calibrated
    ) {

        return;

    }


    /*
     * Acceleration -> velocity.
     */

    cameraVelocity.addScaledVector(

        cameraAcceleration,

        dt

    );


    /*
     * Damping.
     */

    cameraVelocity.multiplyScalar(

        Math.pow(

            VELOCITY_DAMPING,

            dt * 60

        )

    );


    /*
     * Ограничение.
     */

    if (
        cameraVelocity.length()
        >
        MAX_SPEED
    ) {

        cameraVelocity.setLength(

            MAX_SPEED

        );

    }


    /*
     * Velocity -> position.
     */

    cameraWorldPosition.addScaledVector(

        cameraVelocity,

        dt *
        MOVEMENT_GAIN

    );


    /*
     * Очень маленькие
     * перемещения убираем.
     */

    if (
        cameraVelocity.length()
        <
        0.015
    ) {

        cameraVelocity.set(

            0,
            0,
            0

        );

    }


    /*
     * =================================================
     * ВАЖНО
     *
     * Мы НЕ меняем:
     *
     * model.position
     *
     * =================================================
     *
     * Меняется только:
     *
     * camera3D.position
     * =================================================
     */

    camera3D.position.copy(

        cameraWorldPosition

    );

}

/* =========================================================

========================================================= */

function startBrowserSensors() {

    /*
     * DeviceOrientation fallback.
     */

    window.addEventListener(

        "deviceorientation",

        event => {

            /*
             * Если Telegram уже
             * даёт данные —
             * браузерный источник
             * не нужен.
             */

            if (
                orientationOK
            ) {

                return;

            }


            alpha =
                THREE.MathUtils
                    .degToRad(

                        event.alpha || 0

                    );


            beta =
                THREE.MathUtils
                    .degToRad(

                        event.beta || 0

                    );


            gamma =
                THREE.MathUtils
                    .degToRad(

                        event.gamma || 0

                    );


            orientationOK =
                true;

        },

        true

    );


    /*
     * DeviceMotion fallback.
     */

    window.addEventListener(

        "devicemotion",

        event => {

            if (
                event.acceleration
            ) {

                if (
                    !accelerometerOK
                ) {

                    accX =
                        event.acceleration.x || 0;


                    accY =
                        event.acceleration.y || 0;


                    accZ =
                        event.acceleration.z || 0;

                }

            }


            if (
                event.rotationRate
            ) {

                if (
                    !gyroOK
                ) {

                    gyroX =
                        THREE.MathUtils
                            .degToRad(

                                event.rotationRate
                                    .alpha || 0

                            );


                    gyroY =
                        THREE.MathUtils
                            .degToRad(

                                event.rotationRate
                                    .beta || 0

                            );


                    gyroZ =
                        THREE.MathUtils
                            .degToRad(

                                event.rotationRate
                                    .gamma || 0

                            );

                }

            }

        },

        true

    );

}

/* =========================================================
   PLACE MODEL
========================================================= */

function placeModel() {

    if (
        !model ||
        !camera3D
    ) {

        return;

    }


    /*
     * Направление камеры.
     */

    const forward =
        new THREE.Vector3(

            0,
            0,
            -1

        );


    forward.applyQuaternion(

        camera3D.quaternion

    );


    /*
     * Мировая позиция.
     */

    objectWorldPosition.copy(

        cameraWorldPosition

    );


    objectWorldPosition
        .addScaledVector(

            forward,

            3

        );


    objectWorldPosition.y -=
        0.5;


    /*
     * =================================================
     * ВАЖНО:
     *
     * Записываем позицию модели.
     *
     * После этого движение камеры
     * НЕ меняет её.
     * =================================================
     */

    model.position.copy(

        objectWorldPosition

    );


    model.quaternion.copy(

        objectWorldQuaternion

    );


    objectPlaced =
        true;


    setStatus(

        "3D-сцена закреплена. " +
        "Двигайтесь вокруг неё."

    );

}

function render() {

    if (
        !renderer ||
        !scene ||
        !camera3D
    ) {

        return;

    }


    const now =
        performance.now();


    let dt =

        (
            now -
            lastTime
        )
        /
        1000;


    lastTime =
        now;


    dt =
        Math.min(

            dt,

            0.05

        );


    /*
     * WebXR имеет собственное
     * spatial tracking.
     */

    if (
        !xrActive
    ) {

        updateOrientation();

        updateEstimatedPosition(
            dt
        );

    }


    updateDebug();


    renderer.render(

        scene,

        camera3D

    );

}

/* =========================================================
   START WEBXR
========================================================= */

async function startWebXR() {

    if (
        !navigator.xr
    ) {

        setStatus(
            "WebXR отсутствует."
        );

        return;

    }


    try {

        const supported =

            await navigator.xr
                .isSessionSupported(

                    "immersive-ar"

                );


        if (
            !supported
        ) {

            setStatus(

                "Настоящий 6DoF AR " +
                "не поддерживается."

            );

            return;

        }


        initThree();


        /*
         * Настоящая AR-сессия.
         */

        xrSession =

            await navigator.xr
                .requestSession(

                    "immersive-ar",

                    {

                        requiredFeatures: [

                            "local",

                            "hit-test"

                        ],

                        optionalFeatures: [

                            "local-floor",

                            "dom-overlay"

                        ],

                        domOverlay: {

                            root:
                                document.body

                        }

                    }

                );


        renderer.xr.enabled =
            true;


        await renderer.xr
            .setSession(

                xrSession

            );


        xrActive =
            true;


        xrPlaced =
            false;


        trackingBadge.textContent =
            "TRUE 6DoF";


        start.style.display =
            "none";


        camera.style.display =
            "none";


        canvas.style.display =
            "block";


        topBar.style.display =
            "flex";


        controls.style.display =
            "flex";


        scenePanel.style.display =
            "block";


        closeButton.style.display =
            "block";


        placeButton.style.display =
            "block";


        debug.style.display =
            "block";


        /*
         * Reference space.
         */

        xrReferenceSpace =

            await xrSession
                .requestReferenceSpace(

                    "local"

                );


        xrViewerSpace =

            await xrSession
                .requestReferenceSpace(

                    "viewer"

                );


        /*
         * Hit test.
         */

        xrHitTestSource =

            await xrSession
                .requestHitTestSource({

                    space:
                        xrViewerSpace

                });


        /*
         * Загружаем модель.
         */

        loadModel(

            currentModel,

            currentName

        );


        setStatus(

            "Настоящий 6DoF AR. " +
            "Наведите камеру на поверхность."

        );


        xrSession.addEventListener(

            "select",

            () => {

                placeXRObject();

            }

        );


        xrSession.addEventListener(

            "end",

            () => {

                xrActive =
                    false;


                xrPlaced =
                    false;


                xrSession =
                    null;


                xrReferenceSpace =
                    null;


                xrViewerSpace =
                    null;


                xrHitTestSource =
                    null;


                placeButton.style.display =
                    "none";


                setStatus(

                    "AR завершён."

                );

            }

        );

    }
    catch (
        error
    ) {

        console.error(
            error
        );


        setStatus(

            "WebXR: " +
            error.message

        );

    }

}



/* =========================================================
   XR OBJECT
========================================================= */

function placeXRObject() {

    if (
        !xrSession ||
        !xrReferenceSpace ||
        !xrHitTestSource ||
        !model
    ) {

        return;

    }


    /*
     * Установка выполняется
     * в следующем XR frame.
     */

    xrPlaced =
        true;


    setStatus(

        "Объект закреплён " +
        "в реальном пространстве."

    );

}



/* =========================================================
   XR FRAME
========================================================= */

function processXRFrame(
    time,
    frame
) {

    if (
        !xrSession ||
        !xrReferenceSpace ||
        !frame
    ) {

        return;

    }


    /*
     * Позиция телефона
     * в мировой XR системе.
     */

    const pose =

        frame.getViewerPose(

            xrReferenceSpace

        );


    if (
        !pose
    ) {

        return;

    }


    const position =

        pose.transform.position;


    const orientation =

        pose.transform.orientation;


    /*
     * =================================================
     * НАСТОЯЩИЕ КООРДИНАТЫ
     * =================================================
     */

    cameraWorldPosition.set(

        position.x,

        position.y,

        position.z

    );


    camera3D.position.copy(

        cameraWorldPosition

    );


    camera3D.quaternion.set(

        orientation.x,

        orientation.y,

        orientation.z,

        orientation.w

    );


    /*
     * Hit test.
     */

    if (
        xrHitTestSource &&
        !xrPlaced
    ) {

        const hits =

            frame.getHitTestResults(

                xrHitTestSource

            );


        if (
            hits.length > 0
        ) {

            const hit =
                hits[0];


            const hitPose =

                hit.getPose(

                    xrReferenceSpace

                );


            if (
                hitPose
            ) {

                const p =
                    hitPose
                        .transform
                        .position;


                /*
                 * Preview позиции.
                 */

                model?.position.set(

                    p.x,

                    p.y,

                    p.z

                );

            }

        }

    }


    /*
     * После установки
     * модель остаётся здесь.
     */

    if (
        xrPlaced &&
        model
    ) {

        model.position.copy(

            objectWorldPosition

        );

    }


    debug.innerHTML =

        "TRUE WEBXR 6DoF<br><br>" +

        "PHONE XYZ<br>" +

        "X: " +
        position.x.toFixed(3) +

        "<br>" +

        "Y: " +
        position.y.toFixed(3) +

        "<br>" +

        "Z: " +
        position.z.toFixed(3) +

        "<br><br>" +

        "OBJECT XYZ<br>" +

        "X: " +
        objectWorldPosition.x
            .toFixed(3) +

        "<br>" +

        "Y: " +
        objectWorldPosition.y
            .toFixed(3) +

        "<br>" +

        "Z: " +
        objectWorldPosition.z
            .toFixed(3);

}



/* =========================================================
   XR ANIMATION
========================================================= */

function xrRenderLoop(
    time,
    frame
) {

    if (
        xrActive &&
        frame
    ) {

        processXRFrame(

            time,

            frame

        );

    }


    if (
        renderer &&
        scene &&
        camera3D
    ) {

        renderer.render(

            scene,

            camera3D

        );

    }

}

closeButton.addEventListener(

    "click",

    async () => {

        /*
         * WebXR.
         */

        if (
            xrSession
        ) {

            try {

                await xrSession.end();

            }
            catch {}

        }


        /*
         * Camera.
         */

        const stream =
            camera.srcObject;


        if (
            stream
        ) {

            stream
                .getTracks()
                .forEach(

                    track => {

                        track.stop();

                    }

                );

        }


        camera.srcObject =
            null;


        /*
         * Telegram sensors.
         */

        if (
            tg
        ) {

            try {

                tg.DeviceOrientation
                    ?.stop();

            }
            catch {}


            try {

                tg.Gyroscope
                    ?.stop();

            }
            catch {}


            try {

                tg.Accelerometer
                    ?.stop();

            }
            catch {}

        }


        /*
         * UI.
         */

        camera.style.display =
            "none";


        canvas.style.display =
            "none";


        topBar.style.display =
            "none";


        controls.style.display =
            "none";


        scenePanel.style.display =
            "none";


        debug.style.display =
            "none";


        closeButton.style.display =
            "none";


        placeButton.style.display =
            "none";


        start.style.display =
            "flex";


        xrActive =
            false;


        setStatus(
            "Готово"
        );

    }

);
