<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="
        width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no
    "
>

<title>AR Game Cam</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    font-family: Arial, sans-serif;

    touch-action: none;
}

#app {

    position: relative;

    width: 100%;
    height: 100dvh;

    overflow: hidden;

    background: #111820;
}


/* =====================================================
CAMERA
===================================================== */

#camera {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: none;

    z-index: 1;

    background: #000;
}


/* =====================================================
THREE
===================================================== */

#canvas3d {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 2;

    pointer-events: none;

    display: none;
}


/* =====================================================
START
===================================================== */

#start {

    position: absolute;

    inset: 0;

    z-index: 100;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    padding: 25px;

    color: white;

    text-align: center;

    background:
        radial-gradient(
            circle,
            #263640,
            #090d11
        );
}

#start h1 {

    font-size: 40px;

    margin-bottom: 20px;
}

#start p {

    max-width: 370px;

    line-height: 1.5;

    opacity: .7;

    margin-bottom: 25px;
}

button {

    border: 0;

    cursor: pointer;

    -webkit-tap-highlight-color:
        transparent;
}

.mainButton {

    width: 270px;

    height: 55px;

    margin: 7px;

    border-radius: 16px;

    background: white;

    color: black;

    font-size: 17px;

    font-weight: bold;
}


/* =====================================================
TOP
===================================================== */

#top {

    position: absolute;

    top:
        calc(
            10px +
            env(safe-area-inset-top)
        );

    left: 10px;

    right: 10px;

    z-index: 30;

    display: none;

    justify-content:
        space-between;
}

.badge {

    padding: 9px 12px;

    border-radius: 12px;

    background:
        rgba(0,0,0,.7);

    color: white;

    font-size: 12px;

    backdrop-filter:
        blur(10px);
}


/* =====================================================
STATUS
===================================================== */

#status {

    position: absolute;

    top: 62px;

    left: 50%;

    transform:
        translateX(-50%);

    width:
        calc(100% - 40px);

    max-width: 440px;

    z-index: 40;

    padding: 10px;

    border-radius: 12px;

    background:
        rgba(0,0,0,.7);

    color: white;

    text-align: center;

    font-size: 12px;
}


/* =====================================================
CLOSE
===================================================== */

#close {

    position: absolute;

    right: 12px;

    top:
        calc(
            10px +
            env(safe-area-inset-top)
        );

    z-index: 70;

    display: none;

    width: 43px;

    height: 43px;

    border-radius: 13px;

    background:
        rgba(0,0,0,.75);

    color: white;

    font-size: 24px;
}


/* =====================================================
DEBUG
===================================================== */

#debug {

    position: absolute;

    left: 10px;

    bottom: 160px;

    z-index: 40;

    display: none;

    padding: 10px;

    border-radius: 10px;

    background:
        rgba(0,0,0,.75);

    color: #fff;

    font-family: monospace;

    font-size: 10px;

    line-height: 1.55;

    pointer-events: none;
}


/* =====================================================
CONTROLS
===================================================== */

#controls {

    position: absolute;

    top: 125px;

    right: 10px;

    z-index: 50;

    display: none;

    flex-direction: column;

    gap: 7px;
}

.control {

    min-width: 55px;

    min-height: 44px;

    border-radius: 12px;

    background:
        rgba(0,0,0,.7);

    color: white;

    font-size: 15px;

    backdrop-filter:
        blur(10px);
}


/* =====================================================
SCENE PANEL
===================================================== */

#scenePanel {

    position: absolute;

    left: 0;

    right: 0;

    bottom: 0;

    z-index: 60;

    display: none;

    padding:
        12px
        12px
        calc(
            12px +
            env(safe-area-inset-bottom)
        );

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.98),
            rgba(0,0,0,.72)
        );

    color: white;
}

#sceneHeader {

    display: flex;

    justify-content:
        space-between;

    margin-bottom: 9px;
}

#sceneTitle {

    font-size: 14px;

    font-weight: bold;
}

#sceneHint {

    opacity: .5;

    font-size: 11px;
}

#sceneList {

    display: flex;

    gap: 9px;

    overflow-x: auto;
}

.scene {

    flex:
        0 0 82px;

    height: 92px;

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius: 14px;

    overflow: hidden;

    background:
        rgba(255,255,255,.08);

    color: white;
}

.scene.active {

    border:
        2px solid white;
}

.sceneIcon {

    height: 62px;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 28px;
}

.sceneName {

    height: 30px;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 10px;
}

</style>

</head>


<body>

<div id="app">


<video
    id="camera"
    autoplay
    playsinline
    muted>
</video>


<canvas
    id="canvas3d">
</canvas>


<section id="start">

    <h1>
        AR GAME
    </h1>

    <p>

        Камера + ориентация +
        гироскоп + акселерометр.

        <br><br>

        Перемещение телефона
        будет рассчитываться
        через sensor fusion.

    </p>


    <button
        id="startButton"
        class="mainButton">

        Включить AR

    </button>

</section>


<div id="top">

    <div class="badge">
        AR 3D
    </div>

    <div
        id="tracking"
        class="badge">

        SENSOR OFF

    </div>

</div>


<div id="status">

    Готово

</div>


<button id="close">
    ×
</button>


<div id="controls">

    <button
        id="minus"
        class="control">

        −

    </button>


    <button
        id="reset"
        class="control">

        CENTER

    </button>


    <button
        id="plus"
        class="control">

        +

    </button>

</div>


<div id="debug">

    SENSOR

</div>


<div id="scenePanel">

    <div id="sceneHeader">

        <div id="sceneTitle">
            3D СЦЕНЫ
        </div>

        <div id="sceneHint">
            Выберите объект
        </div>

    </div>


    <div id="sceneList">


        <button
            class="scene active"
            data-model="creature.glb"

            <div class="sceneIcon">

            </div>

            <div class="sceneName">
                Creature
            </div>

        </button>


        <button
            class="scene"
            data-model="skeleton.glb"
            data-name="Skeleton">

            <div class="sceneIcon">
                🦴
            </div>

            <div class="sceneName">
                Skeleton
            </div>

        </button>


        <button
            class="scene"
            data-model="museum.glb"
            data-name="Museum">

            <div class="sceneIcon">
                🏛️
            </div>

            <div class="sceneName">
                Museum
            </div>

        </button>


        <button
            class="scene"
            data-model="tree.glb"
            data-name="Tree">

            <div class="sceneIcon">
                🌳
            </div>

            <div class="sceneName">
                Tree
            </div>

        </button>


    </div>

</div>

</div>


<script type="importmap">

{
    "imports": {

        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

    }
}

</script>


<script type="module">

import * as THREE
from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import {
    GLTFLoader
}
from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


/* =====================================================
TELEGRAM
===================================================== */

const tg =
    window.Telegram?.WebApp;


/* =====================================================
ELEMENTS
===================================================== */

const video =
    document.getElementById(
        "camera"
    );

const canvas =
    document.getElementById(
        "canvas3d"
    );

const start =
    document.getElementById(
        "start"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const closeButton =
    document.getElementById(
        "close"
    );

const status =
    document.getElementById(
        "status"
    );

const top =
    document.getElementById(
        "top"
    );

const tracking =
    document.getElementById(
        "tracking"
    );

const debug =
    document.getElementById(
        "debug"
    );

const controls =
    document.getElementById(
        "controls"
    );

const scenePanel =
    document.getElementById(
        "scenePanel"
    );


/* =====================================================
THREE
===================================================== */

let renderer;

let scene;

let camera;

let model;


/* =====================================================
MODEL
===================================================== */

let modelScale = 1;

let currentModel =
    "creature.glb";


/* =====================================================
SENSOR STATE
===================================================== */

/*
 * Ориентация
 */

let alpha = 0;

let beta = 0;

let gamma = 0;


/*
 * Ускорение
 */

let accX = 0;

let accY = 0;

let accZ = 0;


/*
 * Гироскоп
 */

let gyroX = 0;

let gyroY = 0;

let gyroZ = 0;


/*
 * Виртуальная позиция
 */

const position =
    new THREE.Vector3(
        0,
        0,
        0
    );


/*
 * Виртуальная скорость
 */

const velocity =
    new THREE.Vector3(
        0,
        0,
        0
    );


/*
 * Начальная ориентация
 */

let referenceQuaternion =
    new THREE.Quaternion();


let initialized =
    false;


/*
 * Время
 */

let lastTime =
    performance.now();


/*
 * Фильтр
 */

let filteredAcc =
    new THREE.Vector3();


/*
 * Последнее движение
 */

let lastMovement =
    new THREE.Vector3();


/* =====================================================
TELEGRAM INIT
===================================================== */

if (tg) {

    tg.ready();

    tg.expand();

}


/* =====================================================
STATUS
===================================================== */

function setStatus(
    text
) {

    status.textContent =
        text;

}


/* =====================================================
THREE INIT
===================================================== */

function initThree() {


    scene =
        new THREE.Scene();


    camera =
        new THREE.PerspectiveCamera(

            60,

            window.innerWidth /
            window.innerHeight,

            .01,

            1000

        );


    renderer =
        new THREE.WebGLRenderer({

            canvas,

            alpha: true,

            antialias: true

        });


    renderer.setPixelRatio(

        Math.min(
            window.devicePixelRatio,
            2
        )

    );


    renderer.setSize(

        window.innerWidth,
        window.innerHeight

    );


    renderer.setClearColor(
        0x000000,
        0
    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    /* LIGHT */

    const hemi =
        new THREE.HemisphereLight(

            0xffffff,

            0x444444,

            2

        );


    scene.add(
        hemi
    );


    const light =
        new THREE.DirectionalLight(

            0xffffff,

            2

        );


    light.position.set(
        2,
        4,
        2
    );


    scene.add(
        light
    );


    renderer.setAnimationLoop(
        render
    );

}


/* =====================================================
LOAD GLB
===================================================== */

function loadModel(
    filename
) {

    const loader =
        new GLTFLoader();


    loader.load(

        "./models/" +
        filename,

        gltf => {

            if (
                model
            ) {

                scene.remove(
                    model
                );

            }


            model =
                gltf.scene;


            model.scale.set(

                modelScale,
                modelScale,
                modelScale

            );


            /*
             * Объект перед камерой.
             */

            model.position.set(
                0,
                -0.5,
                -3
            );


            scene.add(
                model
            );


            setStatus(
                "Модель загружена"
            );

        },

        undefined,

        error => {

            console.error(
                error
            );

            setStatus(
                "Ошибка GLB"
            );

        }

    );

}


/* =====================================================
START CAMERA
===================================================== */

async function startCamera() {


    setStatus(
        "Запрашиваем камеру..."
    );


    const stream =
        await navigator
            .mediaDevices
            .getUserMedia({

                video: {

                    facingMode: {
                        ideal:
                            "environment"
                    },

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    }

                },

                audio: false

            });


    video.srcObject =
        stream;


    await video.play();


    video.style.display =
        "block";


    canvas.style.display =
        "block";


    start.style.display =
        "none";


    top.style.display =
        "flex";


    controls.style.display =
        "flex";


    scenePanel.style.display =
        "block";


    closeButton.style.display =
        "block";


    debug.style.display =
        "block";


    initThree();


    loadModel(
        currentModel
    );


    await startSensors();


    tracking.textContent =
        "SENSORS ON";


    setStatus(
        "Камера + датчики работают"
    );

}


/* =====================================================
START TELEGRAM SENSORS
===================================================== */

async function startSensors() {


    /*
     * ================================================
     * DEVICE ORIENTATION
     * ================================================
     */

    if (
        tg &&
        tg.DeviceOrientation
    ) {

        tg.DeviceOrientation.start(

            {

                refresh_rate:
                    20,

                need_absolute:
                    false

            },

            success => {

                console.log(
                    "Orientation started:",
                    success
                );

            }

        );


        tg.onEvent(

            "deviceOrientationChanged",

            () => {

                alpha =
                    tg.DeviceOrientation.alpha || 0;

                beta =
                    tg.DeviceOrientation.beta || 0;

                gamma =
                    tg.DeviceOrientation.gamma || 0;

            }

        );

    }


    /*
     * ================================================
     * GYROSCOPE
     * ================================================
     */

    if (
        tg &&
        tg.Gyroscope
    ) {

        tg.Gyroscope.start(

            {

                refresh_rate:
                    20

            },

            success => {

                console.log(
                    "Gyroscope started:",
                    success
                );

            }

        );


        tg.onEvent(

            "gyroscopeChanged",

            () => {

                gyroX =
                    tg.Gyroscope.x || 0;

                gyroY =
                    tg.Gyroscope.y || 0;

                gyroZ =
                    tg.Gyroscope.z || 0;

            }

        );

    }


    /*
     * ================================================
     * ACCELEROMETER
     * ================================================
     */

    if (
        tg &&
        tg.Accelerometer
    ) {

        tg.Accelerometer.start(

            {

                refresh_rate:
                    20

            },

            success => {

                console.log(
                    "Accelerometer started:",
                    success
                );

            }

        );


        tg.onEvent(

            "accelerometerChanged",

            () => {

                accX =
                    tg.Accelerometer.x || 0;

                accY =
                    tg.Accelerometer.y || 0;

                accZ =
                    tg.Accelerometer.z || 0;

            }

        );

    }


    /*
     * Браузерный fallback
     */

    if (
        !tg ||
        !tg.Accelerometer
    ) {

        window.addEventListener(

            "devicemotion",

            event => {

                const a =
                    event.acceleration;


                if (
                    a
                ) {

                    accX =
                        a.x || 0;

                    accY =
                        a.y || 0;

                    accZ =
                        a.z || 0;

                }


                const r =
                    event.rotationRate;


                if (
                    r
                ) {

                    gyroX =
                        THREE.MathUtils
                            .degToRad(
                                r.alpha || 0
                            );

                    gyroY =
                        THREE.MathUtils
                            .degToRad(
                                r.beta || 0
                            );

                    gyroZ =
                        THREE.MathUtils
                            .degToRad(
                                r.gamma || 0
                            );

                }

            },

            true

        );

    }

}


/* =====================================================
CALCULATE ORIENTATION
===================================================== */

function getOrientationQuaternion() {


    const euler =
        new THREE.Euler(

            THREE.MathUtils.degToRad(
                beta
            ),

            THREE.MathUtils.degToRad(
                alpha
            ),

            THREE.MathUtils.degToRad(
                -gamma
            ),

            "YXZ"

        );


    const q =
        new THREE.Quaternion();


    q.setFromEuler(
        euler
    );


    return q;

}


/* =====================================================
SENSOR FUSION
===================================================== */

function updatePosition() {


    const now =
        performance.now();


    let dt =
        (now - lastTime) /
        1000;


    lastTime =
        now;


    /*
     * Защита от огромного
     * скачка времени.
     */

    dt =
        Math.min(
            dt,
            .05
        );


    /*
     * Текущая ориентация.
     */

    const q =
        getOrientationQuaternion();


    /*
     * Первое положение
     * является нулём.
     */

    if (
        !initialized
    ) {

        referenceQuaternion.copy(
            q
        );


        initialized =
            true;

    }


    /*
     * Относительная ориентация.
     */

    const relative =
        new THREE.Quaternion();


    relative.copy(
        referenceQuaternion
    );


    relative.invert();


    relative.multiply(
        q
    );


    /*
     * Показываем вращение.
     */

    camera.quaternion.slerp(
        relative,
        .20
    );


    /*
     * ================================================
     * ACCELERATION
     * ================================================
     */

    const localAcceleration =
        new THREE.Vector3(

            accX,
            accY,
            accZ

        );


    /*
     * Убираем мелкий шум.
     */

    const deadZone =
        .12;


    if (
        Math.abs(
            localAcceleration.x
        ) < deadZone
    ) {

        localAcceleration.x =
            0;

    }


    if (
        Math.abs(
            localAcceleration.y
        ) < deadZone
    ) {

        localAcceleration.y =
            0;

    }


    if (
        Math.abs(
            localAcceleration.z
        ) < deadZone
    ) {

        localAcceleration.z =
            0;

    }


    /*
     * Фильтр низких частот.
     */

    filteredAcc.lerp(

        localAcceleration,

        .18

    );


    /*
     * ================================================
     * ПЕРЕВОД DEVICE -> WORLD
     * ================================================
     */

    const worldAcceleration =
        filteredAcc.clone();


    worldAcceleration.applyQuaternion(
        q
    );


    /*
     * ================================================
     * ИНТЕГРИРОВАНИЕ
     * ================================================
     */

    velocity.addScaledVector(

        worldAcceleration,

        dt

    );


    /*
     * Сильное затухание.
     */

    velocity.multiplyScalar(
        .86
    );


    /*
     * Убираем микроскопическую
     * скорость.
     */

    if (
        velocity.length() <
        .008
    ) {

        velocity.set(
            0,
            0,
            0
        );

    }


    /*
     * Ограничиваем скорость.
     */

    if (
        velocity.length() >
        1.2
    ) {

        velocity.setLength(
            1.2
        );

    }


    /*
     * ================================================
     * POSITION
     * ================================================
     */

    position.addScaledVector(

        velocity,

        dt

    );


    /*
     * Ограничиваем вертикальный
     * дрейф.
     */

    position.y *=
        .97;


    /*
     * ================================================
     * CAMERA
     * ================================================
     */

    camera.position.copy(
        position
    );


    /*
     * ================================================
     * ДВИЖЕНИЕ МОДЕЛИ
     * ================================================
     */

    if (
        model
    ) {

        /*
         * Модель находится
         * в мировом пространстве.
         *
         * Поэтому при движении
         * камеры она визуально
         * остаётся в мире.
         */

        model.position.set(
            0,
            -0.5,
            -3
        );

    }


    lastMovement.copy(
        position
    );


    updateDebug();

}


/* =====================================================
DEBUG
===================================================== */

function updateDebug() {


    debug.innerHTML =

        "SENSOR FUSION<br>" +

        "X: " +
        position.x.toFixed(3) +
        "<br>" +

        "Y: " +
        position.y.toFixed(3) +
        "<br>" +

        "Z: " +
        position.z.toFixed(3) +
        "<br><br>" +

        "ACC<br>" +

        "X: " +
        accX.toFixed(2) +
        "<br>" +

        "Y: " +
        accY.toFixed(2) +
        "<br>" +

        "Z: " +
        accZ.toFixed(2) +
        "<br><br>" +

        "GYRO<br>" +

        "X: " +
        gyroX.toFixed(2) +
        "<br>" +

        "Y: " +
        gyroY.toFixed(2) +
        "<br>" +

        "Z: " +
        gyroZ.toFixed(2) +
        "<br><br>" +

        "ROT<br>" +

        "α: " +
        alpha.toFixed(1) +
        "<br>" +

        "β: " +
        beta.toFixed(1) +
        "<br>" +

        "γ: " +
        gamma.toFixed(1);

}


/* =====================================================
RENDER
===================================================== */

function render() {


    if (
        renderer
    ) {

        updatePosition();


        renderer.render(
            scene,
            camera
        );

    }

}


/* =====================================================
START
===================================================== */

startButton.addEventListener(

    "click",

    async () => {

        startButton.disabled =
            true;

        try {

            await startCamera();

        }
        catch (
            error
        ) {

            console.error(
                error
            );


            setStatus(

                "Ошибка: " +
                error.name +
                " — " +
                error.message

            );


            startButton.disabled =
                false;

        }

    }

);


/* =====================================================
SCALE -
===================================================== */

document
    .getElementById(
        "minus"
    )
    .addEventListener(

        "click",

        () => {

            modelScale =
                Math.max(
                    .1,
                    modelScale - .1
                );


            if (
                model
            ) {

                model.scale.set(

                    modelScale,
                    modelScale,
                    modelScale

                );

            }

        }

    );


/* =====================================================
SCALE +
===================================================== */

document
    .getElementById(
        "plus"
    )
    .addEventListener(

        "click",

        () => {

            modelScale =
                Math.min(
                    5,
                    modelScale + .1
                );


            if (
                model
            ) {

                model.scale.set(

                    modelScale,
                    modelScale,
                    modelScale

                );

            }

        }

    );


/* =====================================================
RESET
===================================================== */

document
    .getElementById(
        "reset"
    )
    .addEventListener(

        "click",

        () => {

            position.set(
                0,
                0,
                0
            );


            velocity.set(
                0,
                0,
                0
            );


            filteredAcc.set(
                0,
                0,
                0
            );


            referenceQuaternion =
                getOrientationQuaternion();


            initialized =
                true;


            if (
                camera
            ) {

                camera.position.set(
                    0,
                    0,
                    0
                );

            }


            setStatus(
                "Сенсорное положение сброшено"
            );

        }

    );


/* =====================================================
SCENES
===================================================== */

document
    .querySelectorAll(
        ".scene"
    )
    .forEach(

        button => {

            button.addEventListener(

                "click",

                () => {

                    document
                        .querySelectorAll(
                            ".scene"
                        )
                        .forEach(
                            b =>
                                b.classList
                                    .remove(
                                        "active"
                                    )
                        );


                    button.classList.add(
                        "active"
                    );


                    currentModel =
                        button.dataset.model;


                    loadModel(
                        currentModel
                    );

                }

            );

        }

    );


/* =====================================================
CLOSE
===================================================== */

closeButton.addEventListener(

    "click",

    () => {

        const stream =
            video.srcObject;


        if (
            stream
        ) {

            stream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }


        if (
            tg
        ) {

            try {

                tg.DeviceOrientation?.stop();

            }
            catch {}

            try {

                tg.Gyroscope?.stop();

            }
            catch {}

            try {

                tg.Accelerometer?.stop();

            }
            catch {}

        }


        video.srcObject =
            null;


        video.style.display =
            "none";


        canvas.style.display =
            "none";


        start.style.display =
            "flex";


        top.style.display =
            "none";


        controls.style.display =
            "none";


        scenePanel.style.display =
            "none";


        closeButton.style.display =
            "none";


        debug.style.display =
            "none";


        tracking.textContent =
            "SENSOR OFF";


        position.set(
            0,
            0,
            0
        );


        velocity.set(
            0,
            0,
            0
        );


        initialized =
            false;


        startButton.disabled =
            false;

    }

);


/* =====================================================
RESIZE
===================================================== */

window.addEventListener(

    "resize",

    () => {

        if (
            !camera ||
            !renderer
        ) {

            return;

        }


        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,
            window.innerHeight

        );

    }

);

</script>

</body>

</html>
