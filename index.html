<title>AR Camera 3D Tracking</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    font-family: Arial, sans-serif;

    touch-action: none;
}

#app {

    position: relative;

    width: 100%;
    height: 100dvh;

    overflow: hidden;

    background: #000;
}


/* =========================================
   CAMERA
========================================= */

#camera {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    background: #000;

    display: none;

    z-index: 1;
}


/* =========================================
   THREE
========================================= */

#threeCanvas {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: none;

    z-index: 2;

    pointer-events: none;

    background: transparent;
}


/* =========================================
   START
========================================= */

#start {

    position: absolute;

    inset: 0;

    z-index: 50;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    padding: 25px;

    background: #111820;

    color: white;

    text-align: center;
}

#start h1 {

    font-size: 38px;

    margin-bottom: 15px;
}

#start p {

    max-width: 360px;

    line-height: 1.5;

    opacity: .7;

    margin-bottom: 30px;
}

#cameraButton {

    width: 240px;

    height: 55px;

    border: 0;

    border-radius: 16px;

    background: white;

    color: black;

    font-size: 18px;

    font-weight: bold;
}


/* =========================================
   TOP
========================================= */

#topBar {

    position: absolute;

    top: 15px;

    left: 15px;

    right: 15px;

    z-index: 20;

    display: none;

    justify-content: space-between;

    pointer-events: none;
}

.badge {

    padding: 9px 13px;

    border-radius: 12px;

    background: rgba(0,0,0,.65);

    color: white;

    backdrop-filter: blur(10px);

    font-size: 13px;
}


/* =========================================
   STATUS
========================================= */

#status {

    position: absolute;

    top: 65px;

    left: 50%;

    transform: translateX(-50%);

    z-index: 25;

    width: calc(100% - 40px);

    max-width: 420px;

    padding: 10px 13px;

    border-radius: 12px;

    background: rgba(0,0,0,.65);

    color: white;

    font-size: 12px;

    text-align: center;
}


/* =========================================
   CLOSE
========================================= */

#close {

    position: absolute;

    top: 15px;

    right: 15px;

    z-index: 40;

    display: none;

    border: 0;

    border-radius: 12px;

    padding: 10px 14px;

    background: rgba(0,0,0,.7);

    color: white;

    font-size: 18px;
}


/* =========================================
   CONTROLS
========================================= */

#controls {

    position: absolute;

    right: 15px;

    top: 120px;

    z-index: 30;

    display: none;

    flex-direction: column;

    gap: 8px;
}

.control {

    min-width: 52px;

    min-height: 46px;

    border: 0;

    border-radius: 13px;

    background: rgba(0,0,0,.7);

    color: white;

    font-size: 18px;
}

#motion {

    font-size: 11px;

    padding: 5px;
}


/* =========================================
   BOTTOM PANEL
========================================= */

#scenePanel {

    position: absolute;

    left: 0;

    right: 0;

    bottom: 0;

    z-index: 30;

    display: none;

    padding: 12px 12px
        calc(12px + env(safe-area-inset-bottom));

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.95),
            rgba(0,0,0,.72)
        );

    backdrop-filter: blur(18px);

    color: white;
}

#sceneHeader {

    display: flex;

    justify-content: space-between;

    margin-bottom: 9px;
}

#sceneTitle {

    font-size: 14px;

    font-weight: bold;
}

#sceneHint {

    font-size: 11px;

    opacity: .55;
}

#sceneList {

    display: flex;

    gap: 9px;

    overflow-x: auto;

    scrollbar-width: none;
}

#sceneList::-webkit-scrollbar {

    display: none;
}

.sceneCard {

    flex: 0 0 80px;

    width: 80px;

    height: 90px;

    padding: 0;

    border: 1px solid
        rgba(255,255,255,.15);

    border-radius: 13px;

    overflow: hidden;

    background:
        rgba(255,255,255,.08);

    color: white;
}

.sceneCard.active {

    border: 2px solid white;

    background:
        rgba(255,255,255,.18);
}

.scenePreview {

    height: 61px;

    display: flex;

    justify-content: center;

    align-items: center;

    background:
        linear-gradient(
            135deg,
            #26333b,
            #101518
        );

    font-size: 28px;
}

.sceneName {

    height: 29px;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 10px;
}


/* =========================================
   SENSOR DEBUG
========================================= */

#debug {

    position: absolute;

    left: 10px;

    bottom: 150px;

    z-index: 20;

    display: none;

    padding: 8px;

    border-radius: 8px;

    background: rgba(0,0,0,.65);

    color: white;

    font-family: monospace;

    font-size: 10px;

    line-height: 1.4;
}

<!-- =====================================
     THREE IMPORT MAP
===================================== -->

<script type="importmap">

{
    "imports": {

        "three":
            "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/":
            "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

    }
}

</script>


<script type="module">

import * as THREE
    from "three";

import {
    GLTFLoader
}
from "three/addons/loaders/GLTFLoader.js";


/* =========================================
   TELEGRAM
========================================= */

const tg =
    window.Telegram?.WebApp;

if (tg) {

    tg.ready();

    tg.expand();

}


/* =========================================
   ELEMENTS
========================================= */

const video =
    document.getElementById("camera");

const canvas =
    document.getElementById("threeCanvas");

const start =
    document.getElementById("start");

const cameraButton =
    document.getElementById("cameraButton");

const status =
    document.getElementById("status");

const closeButton =
    document.getElementById("close");

const controls =
    document.getElementById("controls");

const scenePanel =
    document.getElementById("scenePanel");

const tracking =
    document.getElementById("tracking");

const debug =
    document.getElementById("debug");

const motionButton =
    document.getElementById("motion");


/* =========================================
   THREE
========================================= */

let renderer = null;

let scene = null;

let camera3D = null;

let model = null;


/* =========================================
   MODEL
========================================= */

let modelScale = 1;

const MODEL_START =
    new THREE.Vector3(
        0,
        -0.5,
        -3
    );


/* =========================================
   VIRTUAL CAMERA POSITION
========================================= */

/*
 * Позиция телефона
 * относительно стартовой точки.
 */

const phonePosition =
    new THREE.Vector3(
        0,
        0,
        0
    );


/*
 * Скорость.
 */

const velocity =
    new THREE.Vector3(
        0,
        0,
        0
    );


/* =========================================
   SENSOR STATE
========================================= */

let orientationEnabled =
    false;

let motionEnabled =
    false;


/*
 * Последние данные ориентации.
 */

let alpha = 0;

let beta = 0;

let gamma = 0;


/*
 * Начальная ориентация.
 */

let initialQuaternion =
    new THREE.Quaternion();


let orientationInitialized =
    false;


/*
 * Время motion.
 */

let lastMotionTime =
    null;


/*
 * Motion filter.
 */

let filteredAcceleration =
    new THREE.Vector3(
        0,
        0,
        0
    );


/*
 * Настройки движения.
 */

const ACCELERATION_THRESHOLD =
    0.35;

const MOVEMENT_SCALE =
    0.9;

const DAMPING =
    0.86;

const MAX_SPEED =
    2.0;


/* =========================================
   STATUS
========================================= */

function setStatus(text) {

    status.textContent =
        text;

}


/* =========================================
   THREE INIT
========================================= */

function initThree() {

    scene =
        new THREE.Scene();


    camera3D =
        new THREE.PerspectiveCamera(

            60,

            window.innerWidth /
            window.innerHeight,

            0.01,

            100

        );


    camera3D.position.set(
        0,
        0,
        0
    );


    renderer =
        new THREE.WebGLRenderer({

            canvas: canvas,

            alpha: true,

            antialias: true

        });


    renderer.setPixelRatio(

        Math.min(
            window.devicePixelRatio,
            2
        )

    );


    renderer.setSize(

        window.innerWidth,
        window.innerHeight

    );


    renderer.setClearColor(
        0x000000,
        0
    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    /* =====================================
       LIGHT
    ===================================== */

    const hemisphere =
        new THREE.HemisphereLight(

            0xffffff,
            0x555555,
            2

        );

    scene.add(
        hemisphere
    );


    const directional =
        new THREE.DirectionalLight(

            0xffffff,
            2

        );

    directional.position.set(
        2,
        4,
        2
    );

    scene.add(
        directional
    );


    animate();

}


/* =========================================
   LOAD MODEL
========================================= */

function loadModel(
    filename,
    name
) {

    setStatus(
        "Загрузка " +
        name +
        "..."
    );


    if (model) {

        scene.remove(
            model
        );


        model.traverse(
            object => {

                if (
                    object.geometry
                ) {

                    object.geometry.dispose();

                }

                if (
                    object.material
                ) {

                    if (
                        Array.isArray(
                            object.material
                        )
                    ) {

                        object.material
                            .forEach(
                                material =>
                                    material.dispose()
                            );

                    }
                    else {

                        object.material.dispose();

                    }

                }

            }
        );


        model = null;

    }


    const loader =
        new GLTFLoader();


    loader.load(

        "./models/" +
        filename,


        gltf => {

            model =
                gltf.scene;


            model.position.copy(
                MODEL_START
            );


            model.scale.set(
                modelScale,
                modelScale,
                modelScale
            );


            scene.add(
                model
            );


            setStatus(
                name +
                " загружен"
            );

        },


        undefined,


        error => {

            console.error(
                error
            );


            setStatus(
                "Ошибка загрузки " +
                filename
            );

        }

    );

}


/* =========================================
   RENDER
========================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    if (model) {

        model.scale.set(
            modelScale,
            modelScale,
            modelScale
        );

    }


    if (
        renderer &&
        scene &&
        camera3D
    ) {

        renderer.render(
            scene,
            camera3D
        );

    }

}


/* =========================================
   CAMERA
========================================= */

async function openCamera() {

    try {

        setStatus(
            "Запрашиваем камеру..."
        );


        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            throw new Error(
                "getUserMedia недоступен"
            );

        }


        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal:
                                "environment"
                        },

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        }

                    },

                    audio: false

                });


        video.srcObject =
            stream;


        await video.play();


        video.style.display =
            "block";


        canvas.style.display =
            "block";


        start.style.display =
            "none";


        topBar.style.display =
            "flex";


        controls.style.display =
            "flex";


        scenePanel.style.display =
            "block";


        closeButton.style.display =
            "block";


        debug.style.display =
            "block";


        initThree();


        loadModel(
            "creature.glb",
            "Creature"
        );


        /*
         * Пытаемся включить
         * сенсоры сразу.
         */

        await enableSensors();


        setStatus(
            "Выберите сцену и двигайтесь вокруг неё"
        );

    }
    catch (error) {

        console.error(
            "CAMERA ERROR:",
            error
        );


        setStatus(
            "Ошибка: " +
            error.name +
            " — " +
            error.message
        );

    }

}


/* =========================================
   ENABLE SENSORS
========================================= */

async function enableSensors() {

    /*
     * iOS permission.
     */

    if (

        typeof DeviceOrientationEvent !==
        "undefined" &&

        typeof DeviceOrientationEvent
            .requestPermission ===
        "function"

    ) {

        const orientationPermission =
            await DeviceOrientationEvent
                .requestPermission();


        if (
            orientationPermission !==
            "granted"
        ) {

            setStatus(
                "Нет разрешения на ориентацию"
            );

            return;

        }

    }


    /*
     * iOS motion permission.
     */

    if (

        typeof DeviceMotionEvent !==
        "undefined" &&

        typeof DeviceMotionEvent
            .requestPermission ===
        "function"

    ) {

        const motionPermission =
            await DeviceMotionEvent
                .requestPermission();


        if (
            motionPermission !==
            "granted"
        ) {

            setStatus(
                "Нет разрешения на движение"
            );

            return;

        }

    }


    window.addEventListener(

        "deviceorientation",

        handleOrientation,

        true

    );


    window.addEventListener(

        "devicemotion",

        handleMotion,

        true

    );


    orientationEnabled =
        true;

    motionEnabled =
        true;


    motionButton.textContent =
        "ON";


    tracking.textContent =
        "TRACKING ON";


    setStatus(
        "Гироскоп и акселерометр включены"
    );

}


/* =========================================
   ORIENTATION
========================================= */

function handleOrientation(
    event
) {

    alpha =
        event.alpha || 0;

    beta =
        event.beta || 0;

    gamma =
        event.gamma || 0;


    /*
     * Телефонная ориентация.
     */

    const euler =
        new THREE.Euler(

            THREE.MathUtils.degToRad(
                beta
            ),

            THREE.MathUtils.degToRad(
                alpha
            ),

            THREE.MathUtils.degToRad(
                -gamma
            ),

            "YXZ"

        );


    const currentQuaternion =
        new THREE.Quaternion();


    currentQuaternion.setFromEuler(
        euler
    );


    /*
     * Первое положение телефона
     * становится начальной
     * точкой.
     */

    if (
        !orientationInitialized
    ) {

        initialQuaternion.copy(
            currentQuaternion
        );


        orientationInitialized =
            true;

    }


    /*
     * Получаем изменение
     * относительно стартовой
     * ориентации.
     */

    const relativeQuaternion =
        new THREE.Quaternion();


    relativeQuaternion
        .copy(
            initialQuaternion
        )
        .invert();


    relativeQuaternion
        .multiply(
            currentQuaternion
        );


    /*
     * Плавно вращаем
     * виртуальную камеру.
     */

    camera3D.quaternion.slerp(

        relativeQuaternion,

        0.15

    );


    debug.innerHTML =

        "orientation: ON<br>" +

        "motion: " +
        (motionEnabled
            ? "ON"
            : "OFF") +
        "<br>" +

        "α: " +
        alpha.toFixed(1) +
        "<br>" +

        "β: " +
        beta.toFixed(1) +
        "<br>" +

        "γ: " +
        gamma.toFixed(1) +
        "<br>" +

        "X: " +
        phonePosition.x.toFixed(2) +
        "<br>" +

        "Y: " +
        phonePosition.y.toFixed(2) +
        "<br>" +

        "Z: " +
        phonePosition.z.toFixed(2);

}


/* =========================================
   MOTION
========================================= */

function handleMotion(
    event
) {

    if (
        !camera3D
    ) {

        return;

    }


    const acceleration =
        event.acceleration;


    /*
     * Используем acceleration
     * без gravity, если браузер
     * его предоставляет.
     */

    if (
        !acceleration
    ) {

        return;

    }


    let ax =
        acceleration.x || 0;

    let ay =
        acceleration.y || 0;

    let az =
        acceleration.z || 0;


    /*
     * Фильтр шума.
     */

    filteredAcceleration.lerp(

        new THREE.Vector3(
            ax,
            ay,
            az
        ),

        0.2

    );


    ax =
        filteredAcceleration.x;

    ay =
        filteredAcceleration.y;

    az =
        filteredAcceleration.z;


    const magnitude =
        Math.sqrt(

            ax * ax +
            ay * ay +
            az * az

        );


    /*
     * Если движение очень маленькое,
     * постепенно останавливаемся.
     */

    if (
        magnitude <
        ACCELERATION_THRESHOLD
    ) {

        velocity.multiplyScalar(
            0.82
        );

        return;

    }


    const now =
        performance.now();


    if (
        lastMotionTime ===
        null
    ) {

        lastMotionTime =
            now;

        return;

    }


    let dt =
        (now -
            lastMotionTime) /
        1000;


    lastMotionTime =
        now;


    /*
     * Защита от скачка времени.
     */

    dt =
        Math.min(
            dt,
            0.05
        );


    /*
     * Вектор ускорения.
     */

    const accelerationVector =
        new THREE.Vector3(
            ax,
            ay,
            az
        );


    /*
     * Переводим движение
     * из системы координат
     * телефона в мировую.
     */

    accelerationVector
        .applyQuaternion(
            camera3D.quaternion
        );


    /*
     * Ускоряем виртуальную
     * камеру.
     */

    velocity.addScaledVector(

        accelerationVector,

        MOVEMENT_SCALE *
        dt

    );


    /*
     * Ограничиваем скорость.
     */

    if (
        velocity.length() >
        MAX_SPEED
    ) {

        velocity.setLength(
            MAX_SPEED
        );

    }


    /*
     * Перемещение камеры.
     */

    phonePosition
        .addScaledVector(

            velocity,

            dt

        );


    /*
     * Плавное торможение.
     */

    velocity.multiplyScalar(
        DAMPING
    );


    /*
     * Применяем позицию.
     */

    camera3D.position.copy(
        phonePosition
    );

}


/* =========================================
   SENSOR BUTTON
========================================= */

motionButton.addEventListener(

    "click",

    async () => {

        if (
            motionEnabled
        ) {

            setStatus(
                "Tracking уже включен"
            );

            return;

        }


        await enableSensors();

    }

);


/* =========================================
   SCENE SELECTION
========================================= */

document
    .querySelectorAll(
        ".sceneCard"
    )
    .forEach(

        card => {

            card.addEventListener(

                "click",

                () => {

                    document
                        .querySelectorAll(
                            ".sceneCard"
                        )
                        .forEach(
                            item =>
                                item.classList
                                    .remove(
                                        "active"
                                    )
                        );


                    card.classList.add(
                        "active"
                    );


                    modelScale =
                        1;


                    loadModel(

                        card.dataset.model,

                        card.dataset.name

                    );

                }

            );

        }

    );


/* =========================================
   SCALE -
========================================= */

document
    .getElementById("minus")
    .addEventListener(

        "click",

        () => {

            modelScale =
                Math.max(
                    0.1,
                    modelScale - 0.1
                );

        }

    );


/* =========================================
   SCALE +
========================================= */

document
    .getElementById("plus")
    .addEventListener(

        "click",

        () => {

            modelScale =
                Math.min(
                    5,
                    modelScale + 0.1
                );

        }

    );


/* =========================================
   RESET
========================================= */

document
    .getElementById("reset")
    .addEventListener(

        "click",

        () => {

            /*
             * Возвращаем телефон
             * в стартовую позицию.
             */

            phonePosition.set(
                0,
                0,
                0
            );


            velocity.set(
                0,
                0,
                0
            );


            camera3D.position.set(
                0,
                0,
                0
            );


            camera3D.quaternion.identity();


            /*
             * Новая стартовая
             * ориентация.
             */

            orientationInitialized =
                false;


            /*
             * Сбрасываем размер.
             */

            modelScale =
                1;


            setStatus(
                "Положение камеры сброшено"
            );

        }

    );


/* =========================================
   CLOSE
========================================= */

closeButton.addEventListener(

    "click",

    () => {

        const stream =
            video.srcObject;


        if (
            stream
        ) {

            stream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }


        video.srcObject =
            null;


        video.style.display =
            "none";


        canvas.style.display =
            "none";


        scenePanel.style.display =
            "none";


        controls.style.display =
            "none";


        topBar.style.display =
            "none";


        closeButton.style.display =
            "none";


        debug.style.display =
            "none";


        start.style.display =
            "flex";


        motionEnabled =
            false;


        orientationEnabled =
            false;


        setStatus(
            "Камера выключена"
        );

    }

);


/* =========================================
   RESIZE
========================================= */

window.addEventListener(

    "resize",

    () => {

        if (
            !renderer ||
            !camera3D
        ) {

            return;

        }


        renderer.setSize(

            window.innerWidth,
            window.innerHeight

        );


        camera3D.aspect =

            window.innerWidth /
            window.innerHeight;


        camera3D.updateProjectionMatrix();

    }

);


/* =========================================
   START
========================================= */

cameraButton.addEventListener(

    "click",

    openCamera

);

</script>

</body>

</html>
