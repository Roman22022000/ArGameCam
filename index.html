<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>AR 3D Camera</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    font-family: Arial, sans-serif;

    touch-action: none;

}

#app {

    position: fixed;

    inset: 0;

    overflow: hidden;

    background: #000;

}


/* CAMERA */

#camera {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: 1;

    background: #000;

}


/* THREE */

#threeCanvas {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 2;

    pointer-events: none;

}


/* START */

#start {

    position: absolute;

    inset: 0;

    z-index: 100;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    padding: 25px;

    background:

        radial-gradient(

            circle,

            #27343b,

            #080b0d

        );

    color: white;

    text-align: center;

}

#start h1 {

    font-size: 34px;

    margin-bottom: 15px;

}

#start p {

    max-width: 390px;

    line-height: 1.5;

    opacity: .75;

    margin-bottom: 25px;

}

button {

    border: none;

    border-radius: 14px;

    padding: 15px 20px;

    font-size: 16px;

    font-weight: bold;

}

#startButton {

    width: 280px;

    background: white;

    color: black;

}

#xrButton {

    width: 280px;

    margin-top: 10px;

    background: #30383d;

    color: white;

}


/* STATUS */

#status {

    position: absolute;

    left: 50%;

    top: 20px;

    transform: translateX(-50%);

    z-index: 50;

    width: calc(100% - 30px);

    max-width: 500px;

    padding: 10px;

    border-radius: 12px;

    background: rgba(0,0,0,.75);

    color: white;

    text-align: center;

    font-size: 12px;

}


/* DEBUG */

#debug {

    position: absolute;

    left: 10px;

    top: 70px;

    z-index: 50;

    padding: 10px;

    border-radius: 10px;

    background: rgba(0,0,0,.7);

    color: white;

    font-family: monospace;

    font-size: 10px;

    line-height: 1.5;

}


/* CONTROLS */

#controls {

    position: absolute;

    right: 10px;

    top: 70px;

    z-index: 50;

    display: flex;

    flex-direction: column;

    gap: 8px;

}

.control {

    width: 90px;

    padding: 11px 5px;

    background: rgba(0,0,0,.75);

    color: white;

    font-size: 12px;

}


/* CLOSE */

#close {

    position: absolute;

    right: 10px;

    top: 10px;

    z-index: 80;

    width: 42px;

    height: 42px;

    padding: 0;

    border-radius: 12px;

    background: rgba(0,0,0,.75);

    color: white;

    font-size: 25px;

}


/* SCENES */

#scenePanel {

    position: absolute;

    left: 0;

    right: 0;

    bottom: 0;

    z-index: 60;

    padding: 10px;

    padding-bottom:

        calc(

            10px +

            env(safe-area-inset-bottom)

        );

    background:

        linear-gradient(

            to top,

            rgba(0,0,0,.95),

            rgba(0,0,0,.55)

        );

}

#sceneList {

    display: flex;

    gap: 8px;

    overflow-x: auto;

}

.scene {

    flex: 0 0 85px;

    height: 75px;

    background: rgba(255,255,255,.12);

    color: white;

    border: 1px solid rgba(255,255,255,.2);

    border-radius: 12px;

    padding: 5px;

}

.scene.active {

    border: 2px solid white;

}

.scenePreview {

    height: 40px;

    font-size: 24px;

}

.sceneName {

    font-size: 9px;

}

</style>

</head>


<body>


<div id="app">


<video

    autoplay
    muted
    playsinline>
</video>


<canvas
    id="threeCanvas">
</canvas>


<section id="start">

    <h1>
        AR WORLD
    </h1>

    <p>

        Включите камеру.
        3D-объект появится перед камерой.

        После этого его можно закрепить

    </p>

</section>


<div id="status">

</div>

    INIT

</div>


<div id="controls">

        class="control">

        ЗАКРЕПИТЬ

    </button>


    <button

        class="control">

        RESET

    </button>


    <button

        +

        <button

            <div class="scenePreview">
                🐾
            </div>

                Creature
            </div>

        </button>


        <button
            class="scene"
            data-model="skeleton.glb"
            data-name="Skeleton">

            <div class="scenePreview">
                🦴
            </div>

            <div class="sceneName">
                Skeleton
            </div>

        </button>


        <button
            class="scene"
            data-model="museum.glb"
            data-name="Museum">

            <div class="scenePreview">
                🏛️
            </div>

            <div class="sceneName">
                Museum
            </div>

        </button>


    </div>

</div>


</div>


<script type="importmap">

{
    "imports": {

        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

    }
}

</script>


<script type="module">

import * as THREE
from "three";


import {
    GLTFLoader
}
from
"three/addons/loaders/GLTFLoader.js";


/* =====================================================
   TELEGRAM
===================================================== */

const tg =
    window.Telegram?.WebApp;


if (tg) {

    tg.ready();

    tg.expand();

    if (
        tg.disableVerticalSwipes
    ) {

        tg.disableVerticalSwipes();

    }

}


/* =====================================================
   ELEMENTS
===================================================== */

const start =
    document.getElementById(
        "start"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const xrButton =
    document.getElementById(
        "xrButton"
    );


const video =
    document.getElementById(
        "camera"
    );


const canvas =
    document.getElementById(
        "threeCanvas"
    );


const status =
    document.getElementById(
        "status"
    );


const debug =
    document.getElementById(
        "debug"
    );


const controls =
    document.getElementById(
        "controls"
    );


const placeButton =
    document.getElementById(
        "placeButton"
    );


const resetButton =
    document.getElementById(
        "resetButton"
    );


const plusButton =
    document.getElementById(
        "plusButton"
    );


const minusButton =
    document.getElementById(
        "minusButton"
    );


const closeButton =
    document.getElementById(
        "close"
    );


const scenePanel =
    document.getElementById(
        "scenePanel"
    );


/* =====================================================
   THREE
===================================================== */

let renderer;

let scene;

let camera3D;

let model;


/* =====================================================
   MODEL
===================================================== */

let currentModel =
    "creature.glb";


let currentName =
    "Creature";


let modelScale =
    1;


/*
 * Модель закрепляется здесь.
 */

const fixedWorldPosition =
    new THREE.Vector3();


const fixedWorldQuaternion =
    new THREE.Quaternion();


let modelLocked =
    false;


/* =====================================================
   ORIENTATION
===================================================== */

let alpha = 0;

let beta = 0;

let gamma = 0;

let orientationStarted =
    false;


/* =====================================================
   CAMERA POSITION
===================================================== */

const cameraWorldPosition =
    new THREE.Vector3();


/* =====================================================
   XR
===================================================== */

let xrSession =
    null;

let xrReferenceSpace =
    null;

let xrViewerSpace =
    null;

let xrHitTestSource =
    null;

let xrActive =
    false;

let xrHit =
    false;


/* =====================================================
   XR HIT
===================================================== */

const hitPosition =
    new THREE.Vector3();


const hitQuaternion =
    new THREE.Quaternion();


/* =====================================================
   STATUS
===================================================== */

function setStatus(
    text
) {

    status.textContent =
        text;

}


/* =====================================================
   THREE INIT
===================================================== */

function initThree() {

    if (
        renderer
    ) {

        return;

    }


    scene =
        new THREE.Scene();


    camera3D =
        new THREE.PerspectiveCamera(

            60,

            window.innerWidth /
            window.innerHeight,

            0.01,

            1000

        );


    camera3D.position.set(

        0,
        0,
        0

    );


    renderer =
        new THREE.WebGLRenderer({

            canvas:
                canvas,

            alpha:
                true,

            antialias:
                true

        });


    renderer.setPixelRatio(

        Math.min(

            window.devicePixelRatio,

            2

        )

    );


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    /*
     * Свет.
     */

    scene.add(

        new THREE.HemisphereLight(

            0xffffff,

            0x555555,

            3

        )

    );


    const light =
        new THREE.DirectionalLight(

            0xffffff,

            3

        );


    light.position.set(

        5,
        10,
        5

    );


    scene.add(
        light
    );


    /*
     * DEBUG GRID.
     *
     * Она позволяет убедиться,
     * что Three.js действительно
     * работает.
     */

    const grid =
        new THREE.GridHelper(

            10,
            20

        );


    grid.visible =
        false;


    scene.add(
        grid
    );

}


/* =====================================================
   LOAD MODEL
===================================================== */

function loadModel(

    filename,
    name

) {

    initThree();


    setStatus(

        "Загрузка 3D: " +
        name

    );


    debug.textContent =
        "LOADING: " +
        filename;


    if (
        model
    ) {

        scene.remove(
            model
        );


        model.traverse(

            child => {

                if (
                    child.geometry
                ) {

                    child.geometry.dispose();

                }

                if (
                    child.material
                ) {

                    if (
                        Array.isArray(
                            child.material
                        )
                    ) {

                        child.material
                            .forEach(

                                material => {

                                    material.dispose();

                                }

                            );

                    }
                    else {

                        child.material.dispose();

                    }

                }

            }

        );


        model =
            null;

    }


    const loader =
        new GLTFLoader();


    const url =
        "./models/" +
        filename;


    console.log(
        "Loading:",
        url
    );


    loader.load(

        url,


        gltf => {

            console.log(
                "GLB LOADED:",
                gltf
            );


            model =
                gltf.scene;


            model.scale.set(

                modelScale,
                modelScale,
                modelScale

            );


            /*
             * Нормализуем размер.
             */

            normalizeModel(
                model
            );


            /*
             * Если уже закреплён —
             * возвращаем в старую
             * мировую координату.
             */

            if (
                modelLocked
            ) {

                model.position.copy(

                    fixedWorldPosition

                );


                model.quaternion.copy(

                    fixedWorldQuaternion

                );

            }
            else {

                /*
                 * ВАЖНО:
                 *
                 * Ставим модель
                 * прямо перед камерой.
                 */

                model.position.set(

                    0,
                    -0.7,
                    -3

                );


                model.rotation.set(

                    0,
                    0,
                    0

                );

            }


            scene.add(
                model
            );


            setStatus(

                "3D ОБЪЕКТ ЗАГРУЖЕН"

            );


            debug.innerHTML =

                "MODEL: " +
                name +
                "<br>" +
                "PATH: " +
                url +
                "<br>" +
                "VISIBLE: YES";


        },


        progress => {

            if (
                progress.total
            ) {

                const percent =

                    (
                        progress.loaded /
                        progress.total
                    )
                    *
                    100;


                setStatus(

                    "Загрузка 3D: " +
                    percent.toFixed(0) +
                    "%"

                );

            }

        },


        error => {

            console.error(
                "GLB ERROR:",
                error
            );


            setStatus(

                "ОШИБКА 3D: " +
                filename

            );


            debug.innerHTML =

                "MODEL ERROR<br><br>" +

                url +
                "<br><br>" +

                error;

        }

    );

}


/* =====================================================
   NORMALIZE MODEL
===================================================== */

function normalizeModel(
    object
) {

    const box =
        new THREE.Box3();


    box.setFromObject(
        object
    );


    const size =
        box.getSize(
            new THREE.Vector3()
        );


    const center =
        box.getCenter(
            new THREE.Vector3()
        );


    /*
     * Центрируем модель.
     */

    object.position.x -=
        center.x;


    object.position.y -=
        center.y;


    object.position.z -=
        center.z;


    /*
     * Нормальный размер:
     *
     * максимальный размер ≈ 1.5 м.
     */

    const maxSize =
        Math.max(

            size.x,
            size.y,
            size.z

        );


    if (
        maxSize > 0
    ) {

        const targetSize =
            1.5;


        const factor =
            targetSize /
            maxSize;


        object.scale.multiplyScalar(
            factor
        );

    }

}


/* =====================================================
   ORIENTATION
===================================================== */

function startOrientation() {

    if (
        orientationStarted
    ) {

        return;

    }


    orientationStarted =
        true;


    window.addEventListener(

        "deviceorientation",

        event => {

            alpha =

                THREE.MathUtils
                    .degToRad(

                        event.alpha ||
                        0

                    );


            beta =

                THREE.MathUtils
                    .degToRad(

                        event.beta ||
                        0

                    );


            gamma =

                THREE.MathUtils
                    .degToRad(

                        event.gamma ||
                        0

                    );

        },

        true

    );


    /*
     * Telegram DeviceOrientation
     * если доступен.
     */

    if (
        tg &&
        tg.DeviceOrientation
    ) {

        tg.DeviceOrientation.start(

            {

                refresh_rate:
                    30,

                need_absolute:
                    false

            },

            result => {

                console.log(

                    "Telegram orientation:",
                    result

                );

            }

        );


        tg.onEvent(

            "deviceOrientationChanged",

            () => {

                const d =
                    tg.DeviceOrientation;


                alpha =

                    THREE.MathUtils
                        .degToRad(

                            d.alpha ||
                            0

                        );


                beta =

                    THREE.MathUtils
                        .degToRad(

                            d.beta ||
                            0

                        );


                gamma =

                    THREE.MathUtils
                        .degToRad(

                            d.gamma ||
                            0

                        );

            }

        );

    }

}


/* =====================================================
   UPDATE CAMERA ROTATION
===================================================== */

function updateCameraRotation() {

    if (
        xrActive
    ) {

        return;

    }


    const euler =
        new THREE.Euler(

            beta,

            alpha,

            -gamma,

            "YXZ"

        );


    const q =
        new THREE.Quaternion();


    q.setFromEuler(
        euler
    );


    camera3D.quaternion.slerp(

        q,

        0.18

    );

}


/* =====================================================
   CAMERA START
===================================================== */

async function startCamera() {

    try {

        setStatus(
            "Запрашиваем камеру..."
        );


        const stream =

            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {

                            ideal:
                                "environment"

                        },

                        width: {

                            ideal:
                                1280

                        },

                        height: {

                            ideal:
                                720

                        }

                    },

                    audio:
                        false

                });


        video.srcObject =
            stream;


        await video.play();


        initThree();


        startOrientation();


        /*
         * UI.
         */

        start.style.display =
            "none";


        controls.style.display =
            "flex";


        scenePanel.style.display =
            "block";


        closeButton.style.display =
            "block";


        /*
         * Модель.
         */

        loadModel(

            currentModel,

            currentName

        );


        setStatus(

            "КАМЕРА РАБОТАЕТ"

        );


        animate();

    }
    catch (
        error
    ) {

        console.error(
            error
        );


        setStatus(

            "КАМЕРА: " +
            error.name +
            " " +
            error.message

        );

    }

}


/* =====================================================
   PLACE NORMAL
===================================================== */

function placeObject() {

    if (
        !model
    ) {

        setStatus(
            "Модель ещё загружается"
        );

        return;

    }


    /*
     * Модель становится
     * неподвижной в WORLD SPACE.
     *
     * В текущем sensor-режиме
     * абсолютный X/Y/Z телефона
     * недоступен.
     */

    fixedWorldPosition.copy(

        model.position

    );


    fixedWorldQuaternion.copy(

        model.quaternion

    );


    modelLocked =
        true;


    setStatus(

        "ОБЪЕКТ ЗАКРЕПЛЁН"

    );

}


/* =====================================================
   XR START
===================================================== */

async function startXR() {

    if (
        !navigator.xr
    ) {

        setStatus(
            "WebXR недоступен"
        );

        return;

    }


    try {

        const supported =

            await navigator.xr
                .isSessionSupported(

                    "immersive-ar"

                );


        if (
            !supported
        ) {

            setStatus(

                "Этот телефон/браузер " +
                "не поддерживает immersive AR"

            );

            return;

        }


        initThree();


        xrSession =

            await navigator.xr
                .requestSession(

                    "immersive-ar",

                    {

                        requiredFeatures: [

                            "local",

                            "hit-test"

                        ],

                        optionalFeatures: [

                            "local-floor"

                        ]

                    }

                );


        xrActive =
            true;


        xrReferenceSpace =

            await xrSession
                .requestReferenceSpace(

                    "local"

                );


        xrViewerSpace =

            await xrSession
                .requestReferenceSpace(

                    "viewer"

                );


        xrHitTestSource =

            await xrSession
                .requestHitTestSource({

                    space:
                        xrViewerSpace

                });


        renderer.xr.enabled =
            true;


        await renderer.xr.setSession(

            xrSession

        );


        /*
         * UI.
         */

        start.style.display =
            "none";


        controls.style.display =
            "flex";


        scenePanel.style.display =
            "block";


        closeButton.style.display =
            "block";


        /*
         * Загружаем модель.
         */

        loadModel(

            currentModel,

            currentName

        );


        setStatus(

            "Наведите камеру на пол"

        );


        renderer.setAnimationLoop(

            xrFrame

        );


    }
    catch (
        error
    ) {

        console.error(
            error
        );


        setStatus(

            "XR ERROR: " +
            error.message

        );

    }

}


/* =====================================================
   XR FRAME
===================================================== */

function xrFrame(

    time,
    frame

) {

    if (
        !xrSession
    ) {

        return;

    }


    const pose =

        frame.getViewerPose(

            xrReferenceSpace

        );


    if (
        pose
    ) {

        const p =
            pose.transform.position;


        const q =
            pose.transform.orientation;


        /*
         * НАСТОЯЩЕЕ ПОЛОЖЕНИЕ
         * ТЕЛЕФОНА.
         */

        camera3D.position.set(

            p.x,
            p.y,
            p.z

        );


        camera3D.quaternion.set(

            q.x,
            q.y,
            q.z,
            q.w

        );


        debug.innerHTML =

            "WEBXR 6DoF<br><br>" +

            "PHONE<br>" +

            "X: " +
            p.x.toFixed(3) +

            "<br>" +

            "Y: " +
            p.y.toFixed(3) +

            "<br>" +

            "Z: " +
            p.z.toFixed(3) +

            "<br><br>" +

            "MODEL<br>" +

            "X: " +
            fixedWorldPosition.x
                .toFixed(3) +

            "<br>" +

            "Y: " +
            fixedWorldPosition.y
                .toFixed(3) +

            "<br>" +

            "Z: " +
            fixedWorldPosition.z
                .toFixed(3);

    }


    /*
     * HIT TEST.
     */

    if (
        xrHitTestSource &&
        !modelLocked
    ) {

        const results =

            frame.getHitTestResults(

                xrHitTestSource

            );


        if (
            results.length
        ) {

            const hit =
                results[0];


            const hitPose =

                hit.getPose(

                    xrReferenceSpace

                );


            if (
                hitPose
            ) {

                const p =
                    hitPose
                        .transform
                        .position;


                const q =
                    hitPose
                        .transform
                        .orientation;


                /*
                 * Предпросмотр
                 * позиции модели.
                 */

                if (
                    model
                ) {

                    model.position.set(

                        p.x,
                        p.y,
                        p.z

                    );


                    model.quaternion.set(

                        q.x,
                        q.y,
                        q.z,
                        q.w

                    );

                }


                xrHit =
                    true;

            }

        }

    }


    renderer.render(

        scene,

        camera3D

    );

}


/* =====================================================
   XR PLACE
===================================================== */

function placeXRObject() {

    if (
        !model ||
        !xrHit
    ) {

        setStatus(

            "Наведите камеру на поверхность"

        );

        return;

    }


    /*
     * Фиксируем текущую
     * мировую позицию.
     */

    fixedWorldPosition.copy(

        model.position

    );


    fixedWorldQuaternion.copy(

        model.quaternion

    );


    model.position.copy(

        fixedWorldPosition

    );


    model.quaternion.copy(

        fixedWorldQuaternion

    );


    modelLocked =
        true;


    setStatus(

        "3D СЦЕНА ЗАКРЕПЛЕНА"

    );

}


/* =====================================================
   ANIMATION NORMAL
===================================================== */

function animate() {

    if (
        xrActive
    ) {

        return;

    }


    requestAnimationFrame(
        animate
    );


    updateCameraRotation();


    /*
     * Если модель закреплена,
     * НИКОГДА не изменяем
     * её position здесь.
     */

    if (
        modelLocked &&
        model
    ) {

        model.position.copy(

            fixedWorldPosition

        );


        model.quaternion.copy(

            fixedWorldQuaternion

        );

    }


    renderer.render(

        scene,

        camera3D

    );


    debug.innerHTML =

        "NORMAL MODE<br><br>" +

        "MODEL: " +
        (
            model
                ? "LOADED"
                : "NULL"
        ) +

        "<br>" +

        "LOCK: " +
        (
            modelLocked
                ? "YES"
                : "NO"
        ) +

        "<br><br>" +

        "CAMERA<br>" +

        "X: " +
        camera3D.position.x
            .toFixed(2) +

        "<br>" +

        "Y: " +
        camera3D.position.y
            .toFixed(2) +

        "<br>" +

        "Z: " +
        camera3D.position.z
            .toFixed(2);

}


/* =====================================================
   SCALE
===================================================== */

plusButton.addEventListener(

    "click",

    () => {

        if (
            !model
        ) {

            return;

        }


        modelScale *=
            1.15;


        model.scale.set(

            modelScale,
            modelScale,
            modelScale

        );

    }

);


minusButton.addEventListener(

    "click",

    () => {

        if (
            !model
        ) {

            return;

        }


        modelScale *=
            0.87;


        model.scale.set(

            modelScale,
            modelScale,
            modelScale

        );

    }

);


/* =====================================================
   PLACE
===================================================== */

placeButton.addEventListener(

    "click",

    () => {

        if (
            xrActive
        ) {

            placeXRObject();

        }
        else {

            placeObject();

        }

    }

);


/* =====================================================
   RESET
===================================================== */

resetButton.addEventListener(

    "click",

    () => {

        modelLocked =
            false;


        if (
            model
        ) {

            model.position.set(

                0,
                -0.7,
                -3

            );

        }


        setStatus(

            "Объект снова можно закрепить"

        );

    }

);


/* =====================================================
   SCENE SELECT
===================================================== */

document
    .querySelectorAll(
        ".scene"
    )
    .forEach(

        button => {

            button.addEventListener(

                "click",

                () => {

                    document
                        .querySelectorAll(
                            ".scene"
                        )
                        .forEach(

                            item => {

                                item.classList
                                    .remove(
                                        "active"
                                    );

                            }

                        );


                    button.classList.add(
                        "active"
                    );


                    currentModel =
                        button.dataset.model;


                    currentName =
                        button.dataset.name;


                    modelLocked =
                        false;


                    loadModel(

                        currentModel,

                        currentName

                    );

                }

            );

        }

    );


/* =====================================================
   START BUTTON
===================================================== */

startButton.addEventListener(

    "click",

    startCamera

);


/* =====================================================
   XR BUTTON
===================================================== */

xrButton.addEventListener(

    "click",

    startXR

);


/* =====================================================
   CLOSE
===================================================== */

closeButton.addEventListener(

    "click",

    async () => {

        if (
            xrSession
        ) {

            try {

                await xrSession.end();

            }
            catch {}

        }


        const stream =
            video.srcObject;


        if (
            stream
        ) {

            stream
                .getTracks()
                .forEach(

                    track =>
                        track.stop()

                );

        }


        video.srcObject =
            null;


        xrActive =
            false;


        xrSession =
            null;


        xrReferenceSpace =
            null;


        xrViewerSpace =
            null;


        xrHitTestSource =
            null;


        modelLocked =
            false;


        start.style.display =
            "flex";


        controls.style.display =
            "none";


        scenePanel.style.display =
            "none";


        closeButton.style.display =
            "none";


        setStatus(
            "Готово"
        );

    }


);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(

    "resize",

    () => {

        if (
            !camera3D ||
            !renderer
        ) {

            return;

        }


        camera3D.aspect =

            window.innerWidth /
            window.innerHeight;


        camera3D.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );

    }

);


/* =====================================================
   INIT
===================================================== */

if (
    !navigator.xr
) {

    xrButton.style.display =
        "none";

}


setStatus(
    "Готово"
);

</script>

</body>

</html>
