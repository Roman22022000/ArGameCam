<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>AR Game</title>


    <!-- Telegram Mini App -->

    <script src="https://telegram.org/js/telegram-web-app.js"></script>


    <!-- Model Viewer -->

    <script
        type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #101820;

            font-family: Arial, sans-serif;
        }


        body {
            color: white;
        }


        #app {

            width: 100%;
            height: 100dvh;

            position: relative;
        }


        /* =========================
           START SCREEN
        ========================= */

        #startScreen {

            position: absolute;

            inset: 0;

            z-index: 20;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            padding: 25px;

            text-align: center;

            background: #101820;
        }


        #startScreen h1 {

            font-size: clamp(34px, 10vw, 52px);

            margin-bottom: 15px;
        }


        #startScreen p {

            max-width: 350px;

            line-height: 1.5;

            opacity: .7;

            margin-bottom: 30px;
        }


        /* =========================
           MAIN BUTTON
        ========================= */

        .mainButton {

            width: min(90%, 340px);

            border: none;

            border-radius: 18px;

            padding: 18px 25px;

            background: white;

            color: #111;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;
        }


        .mainButton:active {

            transform: scale(.97);
        }


        /* =========================
           AR SCREEN
        ========================= */

        #arScreen {

            position: absolute;

            inset: 0;

            z-index: 5;

            display: none;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 25px;

            background: #101820;
        }


        #arScreen h2 {

            margin-bottom: 15px;
        }


        #arScreen p {

            max-width: 350px;

            opacity: .7;

            line-height: 1.5;

            margin-bottom: 25px;
        }


        /* =========================
           MODEL VIEWER
        ========================= */

        model-viewer {

            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

            display: none;

            background: transparent;
        }


        /* =========================
           TOP PANEL
        ========================= */

        #topUI {

            position: absolute;

            top: 15px;

            left: 15px;

            right: 15px;

            z-index: 10;

            display: none;

            justify-content: space-between;

            pointer-events: none;
        }


        .panel {

            padding: 10px 14px;

            border-radius: 14px;

            background: rgba(0, 0, 0, .6);

            backdrop-filter: blur(10px);

            font-size: 14px;
        }


        /* =========================
           STATUS
        ========================= */

        #status {

            position: absolute;

            left: 50%;

            bottom: 100px;

            transform: translateX(-50%);

            z-index: 30;

            width: calc(100% - 40px);

            max-width: 400px;

            padding: 13px 16px;

            border-radius: 14px;

            background: rgba(0, 0, 0, .75);

            text-align: center;

            display: none;
        }

    </style>

</head>


<body>


<div id="app">


    <!-- =================================
         TELEGRAM START SCREEN
    ================================== -->

    <section id="startScreen">

        <h1>AR GAME</h1>

        <p>

            Telegram не может напрямую
            передать AR-сцену Android
            из своего WebView.

            <br><br>

            Открой AR в Chrome,
            чтобы использовать камеру
            и разместить 3D-объект.

        </p>


        <button
            id="openChromeButton"
            class="mainButton">

            Открыть AR в Chrome

        </button>

    </section>


    <!-- =================================
         AR SCREEN
    ================================== -->

    <section id="arScreen">

        <h2>
            AR готов
        </h2>


        <p>

            Нажми кнопку ниже.
            Chrome откроет AR-камеру.

        </p>


        <button
            id="startARButton"
            class="mainButton">

            Запустить AR

        </button>

    </section>


    <!-- =================================
         TOP UI
    ================================== -->

    <div id="topUI">

        <div class="panel">
            AR GAME
        </div>


        <div
            class="panel"
            id="userName">

            Player

        </div>

    </div>


    <!-- =================================
         3D MODEL
    ================================== -->

    <model-viewer

        id="model"

        src="./models/creature.glb"

        ar

        ar-modes="scene-viewer webxr quick-look"

        ar-placement="floor"

        camera-controls

        shadow-intensity="1"

        exposure="1"

        alt="AR Creature">


        <!-- ВАЖНО:
             кнопка находится внутри model-viewer -->

        <button
            id="placeButton"
            slot="ar-button"
            class="mainButton">

            Разместить объект

        </button>


    </model-viewer>


    <!-- =================================
         STATUS
    ================================== -->

    <div id="status"></div>


</div>


<script>


    /* =================================
       TELEGRAM
    ================================== */

    const tg =
        window.Telegram?.WebApp;


    if (tg) {

        tg.ready();

        tg.expand();

    }


    /* =================================
       GITHUB PAGES URL
    ================================= */

    const AR_URL =
        "https://https://roman22022000.github.io/ArGameCam/";


    /* =================================
       ELEMENTS
    ================================= */

    const startScreen =
        document.getElementById(
            "startScreen"
        );


    const arScreen =
        document.getElementById(
            "arScreen"
        );


    const openChromeButton =
        document.getElementById(
            "openChromeButton"
        );


    const startARButton =
        document.getElementById(
            "startARButton"
        );


    const model =
        document.getElementById(
            "model"
        );


    const topUI =
        document.getElementById(
            "topUI"
        );


    const status =
        document.getElementById(
            "status"
        );


    /* =================================
       TELEGRAM USER
    ================================== */

    if (tg?.initDataUnsafe?.user) {

        const user =
            tg.initDataUnsafe.user;


        document.getElementById(
            "userName"
        ).textContent =
            user.first_name ||
            user.username ||
            "Player";
    }


    /* =================================
       STATUS
    ================================== */

    function showStatus(text) {

        status.textContent =
            text;

        status.style.display =
            "block";

    }


    /* =================================
       OPEN CHROME
    ================================== */

    openChromeButton.addEventListener(
        "click",
        () => {

            /*
             * Telegram официально
             * открывает HTTPS-ссылку
             * во внешнем браузере.
             */

            if (tg?.openLink) {

                tg.openLink(
                    AR_URL,
                    {
                        try_browser: "chrome"
                    }
                );

            }
            else {

                /*
                 * Если приложение открыто
                 * не из Telegram
                 */

                window.location.href =
                    AR_URL;

            }

        }
    );


    /* =================================
       DETECT AR MODE
    ================================= */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const isAR =
        params.get("ar") === "1";


    if (isAR) {

        startScreen.style.display =
            "none";


        arScreen.style.display =
            "flex";

    }


    /* =================================
       START AR
    ================================= */

    startARButton.addEventListener(
        "click",
        async () => {

            arScreen.style.display =
                "none";


            topUI.style.display =
                "flex";


            model.style.display =
                "block";


            showStatus(
                "Подготовка AR..."
            );


            try {

                await model.updateComplete;


                console.log(
                    "Model loaded"
                );


                console.log(
                    "AR supported:",
                    model.canActivateAR
                );


                /*
                 * Запрашиваем AR
                 */

                await model.activateAR();


            }
            catch (error) {

                console.error(
                    "AR ERROR:",
                    error
                );


                showStatus(
                    "Не удалось запустить AR. Проверьте поддержку ARCore."
                );

            }

        }
    );


    /* =================================
       AR STATUS
    ================================== */

    model.addEventListener(
        "ar-status",
        event => {

            console.log(
                "AR STATUS:",
                event.detail.status
            );


            if (
                event.detail.status ===
                "session-started"
            ) {

                showStatus(
                    "Наведите камеру на пол"
                );

            }


            if (
                event.detail.status ===
                "not-presenting"
            ) {

                showStatus(
                    "AR завершён"
                );

            }

        }
    );


    /* =================================
       MODEL LOADED
    ================================== */

    model.addEventListener(
        "load",
        () => {

            console.log(
                "3D модель загружена"
            );

        }
    );


    /* =================================
       MODEL ERROR
    ================================= */

    model.addEventListener(
        "error",
        event => {

            console.error(
                "MODEL ERROR:",
                event
            );


            showStatus(
                "Ошибка загрузки 3D-модели"
            );

        }
    );


</script>


</body>

</html>
