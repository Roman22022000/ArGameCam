            padding: 0;
        }

<script type="module">

import * as THREE from "three";

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";



/* =============================================================
   CONFIG
============================================================= */

const TON_MANIFEST =
    "https://roman22022000.github.io/Ton_site/tonconnect-manifest.json";


const REQUIRED_COLLECTION =
    "EQD9mm3hx-QvHyNG18gDaaJtSTTQTVVYVjJ6zhonXocj2eyI";


const REQUIRED_COLLECTION_RAW =
    "0:fd9a6de1c7e42f1d8346d7c80369a26d4934d04d5558563eb38689d7a1c8f6";


const GENERATION_API =
    "https://api.araicameragame.party/api/generation";

const ARCHIVE_API =
    "https://api.araicameragame.party/api/models";


const MODEL_BASE =
    "https://raw.githubusercontent.com/Roman22022000/ArGameCam/main/models/";


/* =============================================================
   DOM
============================================================= */

const authScreen =
    document.getElementById("authScreen");

const homeScreen =
    document.getElementById("homeScreen");

const galleryScreen =
    document.getElementById("galleryScreen");

const viewerScreen =
    document.getElementById("viewerScreen");

const generationScreen =
    document.getElementById("generationScreen");

const userScreen =
    document.getElementById("userScreen");


const connectWallet =
    document.getElementById("connectWallet");

const authStatus =
    document.getElementById("authStatus");

const userWalletAddress =
    document.getElementById("userWalletAddress");

const disconnectWallet =
    document.getElementById("disconnectWallet");

const userStatus =
    document.getElementById("userStatus");


const galleryGrid =
    document.getElementById("galleryGrid");

const archiveScreen =
    document.getElementById("archiveScreen");

const archiveGrid =
    document.getElementById("archiveGrid");

const archiveStatus =
    document.getElementById("archiveStatus");


const viewerCanvas =
    document.getElementById("viewerCanvas");

const viewerNumber =
    document.getElementById("viewerNumber");


const generationCode =
    document.getElementById("generationCode");

const generationSubmit =
    document.getElementById("generationSubmit");

    document.getElementById("generationStatus");


const loading =
    document.getElementById("loading");


/* =============================================================
   SCREEN
============================================================= */

function showScreen(screen) {

    document
        .querySelectorAll(".screen")
        .forEach(element => {
            element.classList.remove("active");
        });

    screen.classList.add("active");
}


/* =============================================================
   TON CONNECT + NFT ACCESS
============================================================= */

if (!window.TON_CONNECT_UI) {
    authStatus.textContent = "TON Connect не загрузился";
    throw new Error("TON_CONNECT_UI not loaded");
}

const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
    manifestUrl: TON_MANIFEST,
    buttonRootId: null,
    restoreConnection: true
});

tonConnectUI.uiOptions = {
    language: "ru",
    uiPreferences: {
        theme: "DARK",
        borderRadius: "none"
    }
};

connectWallet.addEventListener("click", async () => {
    try {
        authStatus.textContent = "Открытие TON Connect...";
        await tonConnectUI.openModal();
    } catch (error) {
        console.error("TON Connect:", error);
        authStatus.textContent = "Ошибка открытия TON Connect";
    }
});

function base64UrlToBytes(value) {
    let normalized = String(value).replace(/-/g, "+").replace(/_/g, "/");
    while (normalized.length % 4 !== 0) normalized += "=";
    const binary = atob(normalized);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
}

function normalizeTonAddress(address) {
    if (!address) return "";
    address = String(address).trim();

    if (/^-?\d+:[0-9a-fA-F]{64}$/.test(address)) {
        const parts = address.split(":");
        return parts[0] + ":" + parts[1].toLowerCase();
    }

    try {
        const bytes = base64UrlToBytes(address);
        if (bytes.length !== 36) return address.toLowerCase();

        let workchain = bytes[1];
        if (workchain === 255) workchain = -1;

        let hash = "";
        for (let i = 2; i < 34; i++) {
            hash += bytes[i].toString(16).padStart(2, "0");
        }

        return workchain + ":" + hash.toLowerCase();
    } catch {
        return address.toLowerCase();
    }
}

const normalizedRequiredCollection = normalizeTonAddress(REQUIRED_COLLECTION);
const normalizedRequiredCollectionRaw = normalizeTonAddress(REQUIRED_COLLECTION_RAW);

async function fetchWithTimeout(url, options = {}, timeoutMs = 15000) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
        return await fetch(url, { ...options, signal: controller.signal });
    } finally {
        clearTimeout(timer);
    }
}

async function checkCollectionNFT(walletAddress) {
    const normalizedWallet = normalizeTonAddress(walletAddress);
    if (!normalizedWallet) throw new Error("Некорректный адрес кошелька");

    const url = "https://tonapi.io/v2/accounts/" + encodeURIComponent(normalizedWallet) + "/nfts?limit=1000";
    const response = await fetchWithTimeout(url, {
        method: "GET",
        cache: "no-store",
        headers: { "Accept": "application/json" }
    }, 15000);

    if (!response.ok) {
        if (response.status === 429) throw new Error("TonAPI: слишком много запросов, повторите через несколько секунд");
        throw new Error("TonAPI HTTP " + response.status);
    }

    const data = await response.json();
    const nftItems = Array.isArray(data.nft_items) ? data.nft_items : [];

    for (const nft of nftItems) {
        const collectionAddress =
            nft.collection?.address ||
            nft.collection_address ||
            nft.collection?.raw_address ||
            "";

        const normalized = normalizeTonAddress(collectionAddress);
        if (
            normalized &&
            (normalized === normalizedRequiredCollection ||
             normalized === normalizedRequiredCollectionRaw)
        ) {
            return true;
        }
    }

    return false;
}

let currentWallet = null;
let accessGranted = false;
let checkingNFT = false;
let processedWallet = "";
let nftCache = new Map();

async function processWallet(wallet) {
    if (!wallet || !wallet.account || !wallet.account.address) {
        currentWallet = null;
        accessGranted = false;
        processedWallet = "";
        userWalletAddress.textContent = "";
        userStatus.textContent = "";
        authStatus.textContent = "Подключите TON-кошелёк";
        showScreen(authScreen);
        return;
    }

    const walletAddress = wallet.account.address;
    const normalizedWallet = normalizeTonAddress(walletAddress);
    currentWallet = walletAddress;

    if (checkingNFT) return;
    if (processedWallet === normalizedWallet && accessGranted) {
        showScreen(homeScreen);
        return;
    }

    checkingNFT = true;
    accessGranted = false;
    processedWallet = normalizedWallet;
    authStatus.textContent = "Проверка NFT...";
    loading.classList.add("active");

    try {
        const cached = nftCache.get(normalizedWallet);
        let hasNFT;

        if (cached && Date.now() - cached.time < 60000) {
            hasNFT = cached.hasNFT;
        } else {
            hasNFT = await checkCollectionNFT(walletAddress);
            nftCache.set(normalizedWallet, { hasNFT, time: Date.now() });
        }

        if (!hasNFT) {
            accessGranted = false;
            authStatus.textContent = "NFT нужной коллекции не найден";
            userStatus.textContent = "Нет NFT доступа";
            showScreen(authScreen);
            return;
        }

        accessGranted = true;
        userWalletAddress.textContent = walletAddress;
        userStatus.textContent = "NFT подтверждён";
        authStatus.textContent = "Доступ разрешён";
        showScreen(homeScreen);
    } catch (error) {
        console.error("NFT CHECK ERROR:", error);
        accessGranted = false;
        authStatus.textContent = error?.name === "AbortError"
            ? "TonAPI не ответил вовремя"
            : (error?.message || "Ошибка проверки NFT");
        userStatus.textContent = "Проверка не завершена";
        showScreen(authScreen);
    } finally {
        checkingNFT = false;
        loading.classList.remove("active");
    }
}

let archiveModels = [];

async function loadArchiveModels() {
    if (!requireAccess()) return;

    archiveStatus.textContent = "Загрузка 3D моделей...";
    archiveGrid.innerHTML = "";

    try {
        const response = await fetchWithTimeout(ARCHIVE_API, {
            method: "GET",
            cache: "no-store",
            headers: { "Accept": "application/json" }
        }, 15000);

        if (!response.ok) throw new Error("HTTP " + response.status);
        const data = await response.json();
        archiveModels = Array.isArray(data.items) ? data.items : [];

        if (!archiveModels.length) {
            archiveStatus.textContent = "В архиве пока нет 3D моделей.";
            return;
        }

        archiveStatus.textContent = "Моделей: " + archiveModels.length;

        archiveModels.forEach((item, index) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "archiveItem";

            const preview = document.createElement("div");
            preview.className = "archivePlaceholder";
            preview.textContent = "3D";
            button.appendChild(preview);

            const info = document.createElement("div");
            info.className = "archiveInfo";

            const name = document.createElement("div");
            name.className = "archiveName";
            name.textContent = item.filename || "model";

            const folder = document.createElement("div");
            folder.className = "archiveFolder";
            folder.textContent = (item.folder || "").toUpperCase();

            info.appendChild(name);
            info.appendChild(folder);
            button.appendChild(info);

            button.addEventListener("click", () => openArchiveViewer(index));
            archiveGrid.appendChild(button);
        });
    } catch (error) {
        console.error("ARCHIVE ERROR:", error);
        archiveStatus.textContent = "Не удалось получить архив.";
    }
}

function getArchiveModelUrl(item) {
    if (!item) return "";
    if (item.url) return item.url;
    if (item.download_url) return item.download_url;
    if (item.file_url) return item.file_url;
    if (item.id != null) return ARCHIVE_API + "/file/" + encodeURIComponent(item.id);
    return "";
}

function openArchiveViewer(index) {
    viewerOpenedFromArchive = true;
    if (!requireAccess()) return;

    const item = archiveModels[index];
    if (!item) return;

    viewerNumber.textContent = item.filename || "3D";
    showScreen(viewerScreen);
    initViewer();
    loadModelIntoViewer(getArchiveModelUrl(item));
}

/* =============================================================
   THREE.JS VIEWER — MOBILE SAFE
============================================================= */

let scene = null;
let camera = null;
let renderer = null;
let model = null;
let viewerOpenedFromArchive = false;
let viewerInitialized = false;
let viewerAnimationId = null;
let viewerLoadToken = 0;

const viewerState = {
    yaw: 0,
    pitch: 0.12,
    distance: 3.0,
    target: new THREE.Vector3(0, 0, 0),
    minDistance: 1.25,
    maxDistance: 4.5,
    spawnDistance: 3.0,
    moveStep: 0.28,
    maxPitch: 1.15,
    minPitch: -0.35
};

const touchState = {
    mode: "none",
    x: 0,
    y: 0,
    lastDistance: 0
};

const keyState = new Set();
const loader = new GLTFLoader();

const viewerForward = document.getElementById("viewerForward");
const viewerBackward = document.getElementById("viewerBackward");
const viewerReset = document.getElementById("viewerReset");
const viewerHint = document.getElementById("viewerHint");

function disposeMaterial(material) {
    if (!material) return;
    const materials = Array.isArray(material) ? material : [material];
    for (const mat of materials) {
        for (const key of [
            "map", "normalMap", "roughnessMap", "metalnessMap",
            "emissiveMap", "aoMap", "alphaMap", "bumpMap",
            "displacementMap", "clearcoatMap", "clearcoatNormalMap",
            "clearcoatRoughnessMap", "sheenColorMap", "sheenRoughnessMap"
        ]) {
            if (mat[key] && typeof mat[key].dispose === "function") mat[key].dispose();
        }
        if (typeof mat.dispose === "function") mat.dispose();
    }
}

function disposeModel() {
    if (!model || !scene) return;
    scene.remove(model);
    model.traverse(object => {
        if (object.geometry) object.geometry.dispose();
        if (object.material) disposeMaterial(object.material);
    });
    model = null;
}

function initViewer() {
    if (viewerInitialized) {
        resizeViewer();
        return;
    }

    viewerInitialized = true;
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    camera = new THREE.PerspectiveCamera(
        55,
        Math.max(window.innerWidth, 1) / Math.max(window.innerHeight, 1),
        0.01,
        100
    );

    renderer = new THREE.WebGLRenderer({
        antialias: window.devicePixelRatio <= 1.5,
        alpha: false,
        powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.domElement.setAttribute("aria-label", "3D scene");
    viewerCanvas.innerHTML = "";
    viewerCanvas.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x222222, 2.2));

    const key = new THREE.DirectionalLight(0xffffff, 3.0);
    key.position.set(4, 6, 5);
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xffffff, 1.5);
    fill.position.set(-4, 2, -4);
    scene.add(fill);

    renderer.domElement.addEventListener("touchstart", onViewerTouchStart, { passive: false });
    renderer.domElement.addEventListener("touchmove", onViewerTouchMove, { passive: false });
    renderer.domElement.addEventListener("touchend", onViewerTouchEnd, { passive: false });
    renderer.domElement.addEventListener("touchcancel", onViewerTouchEnd, { passive: false });
    renderer.domElement.addEventListener("wheel", onViewerWheel, { passive: false });

    window.addEventListener("resize", resizeViewer, { passive: true });
    window.addEventListener("keydown", onViewerKeyDown);
    window.addEventListener("keyup", onViewerKeyUp);

    viewerForward?.addEventListener("click", () => moveViewer(-1));
    viewerBackward?.addEventListener("click", () => moveViewer(1));
    viewerReset?.addEventListener("click", resetViewerCamera);

    resetViewerCamera();
    animateViewer();
}

function resetViewerCamera() {
    viewerState.yaw = 0;
    viewerState.pitch = 0.12;
    viewerState.distance = viewerState.spawnDistance;
    viewerState.target.set(0, 0, 0);
    updateViewerCamera();
}

function updateViewerCamera() {
    if (!camera) return;

    viewerState.distance = THREE.MathUtils.clamp(
        viewerState.distance,
        viewerState.minDistance,
        viewerState.maxDistance
    );

    viewerState.pitch = THREE.MathUtils.clamp(
        viewerState.pitch,
        viewerState.minPitch,
        viewerState.maxPitch
    );

    const horizontal = Math.cos(viewerState.pitch) * viewerState.distance;
    camera.position.set(
        viewerState.target.x + Math.sin(viewerState.yaw) * horizontal,
        viewerState.target.y + Math.sin(viewerState.pitch) * viewerState.distance,
        viewerState.target.z + Math.cos(viewerState.yaw) * horizontal
    );

    camera.lookAt(viewerState.target);
}

function resizeViewer() {
    if (!camera || !renderer) return;
    const width = Math.max(window.innerWidth, 1);
    const height = Math.max(window.innerHeight, 1);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    renderer.setSize(width, height, false);
}

function animateViewer() {
    viewerAnimationId = requestAnimationFrame(animateViewer);
    handleKeyboardMovement();
    updateViewerCamera();
    if (renderer && scene && camera) renderer.render(scene, camera);
}

function handleKeyboardMovement() {
    if (!viewerInitialized) return;
    if (keyState.has("w") || keyState.has("arrowup")) moveViewer(-0.06);
    if (keyState.has("s") || keyState.has("arrowdown")) moveViewer(0.06);
}

function onViewerKeyDown(event) {
    keyState.add(String(event.key).toLowerCase());
}

function onViewerKeyUp(event) {
    keyState.delete(String(event.key).toLowerCase());
}

function moveViewer(direction) {
    const step = viewerState.moveStep * direction;
    viewerState.distance = THREE.MathUtils.clamp(
        viewerState.distance + step,
        viewerState.minDistance,
        viewerState.maxDistance
    );
    updateViewerCamera();
}

function onViewerWheel(event) {
    event.preventDefault();
    const amount = event.deltaY > 0 ? 0.18 : -0.18;
    viewerState.distance = THREE.MathUtils.clamp(
        viewerState.distance + amount,
        viewerState.minDistance,
        viewerState.maxDistance
    );
    updateViewerCamera();
}

function getTouchDistance(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.hypot(dx, dy);
}

function onViewerTouchStart(event) {
    event.preventDefault();

    if (event.touches.length === 1) {
        touchState.mode = "rotate";
        touchState.x = event.touches[0].clientX;
        touchState.y = event.touches[0].clientY;
    } else if (event.touches.length >= 2) {
        touchState.mode = "pinch";
        touchState.lastDistance = getTouchDistance(event.touches);
    }
}

function onViewerTouchMove(event) {
    event.preventDefault();

    if (event.touches.length === 1 && touchState.mode === "rotate") {
        const touch = event.touches[0];
        const dx = touch.clientX - touchState.x;
        const dy = touch.clientY - touchState.y;

        viewerState.yaw -= dx * 0.008;
        viewerState.pitch -= dy * 0.006;
        viewerState.pitch = THREE.MathUtils.clamp(
            viewerState.pitch,
            viewerState.minPitch,
            viewerState.maxPitch
        );

        touchState.x = touch.clientX;
        touchState.y = touch.clientY;
        updateViewerCamera();
        return;
    }

    if (event.touches.length >= 2) {
        if (touchState.mode !== "pinch") {
            touchState.mode = "pinch";
            touchState.lastDistance = getTouchDistance(event.touches);
            return;
        }

        const distance = getTouchDistance(event.touches);
        const delta = touchState.lastDistance - distance;
        viewerState.distance = THREE.MathUtils.clamp(
            viewerState.distance + delta * 0.008,
            viewerState.minDistance,
            viewerState.maxDistance
        );
        touchState.lastDistance = distance;
        updateViewerCamera();
    }
}

function onViewerTouchEnd(event) {
    event.preventDefault();

    if (event.touches.length === 1) {
        touchState.mode = "rotate";
        touchState.x = event.touches[0].clientX;
        touchState.y = event.touches[0].clientY;
    } else {
        touchState.mode = "none";
        touchState.lastDistance = 0;
    }
}

function prepareLoadedModel(gltf) {
    const object = gltf.scene;
    if (!object) throw new Error("GLB не содержит scene");

    const box = new THREE.Box3().setFromObject(object);
    if (box.isEmpty()) throw new Error("GLB содержит пустую геометрию");

    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxSize = Math.max(size.x, size.y, size.z);

    object.position.sub(center);

    if (maxSize > 0 && Number.isFinite(maxSize)) {
        object.scale.setScalar(2.0 / maxSize);
    }

    object.traverse(node => {
        if (!node.isMesh) return;
        node.frustumCulled = true;
        node.castShadow = false;
        node.receiveShadow = false;

        if (node.material) {
            const mats = Array.isArray(node.material) ? node.material : [node.material];
            mats.forEach(mat => {
                if (mat.map) mat.map.colorSpace = THREE.SRGBColorSpace;
                if (mat.emissiveMap) mat.emissiveMap.colorSpace = THREE.SRGBColorSpace;
                mat.needsUpdate = true;
            });
        }
    });

    return object;
}

async function loadModelIntoViewer(url) {
    const token = ++viewerLoadToken;
    disposeModel();
    resetViewerCamera();

    if (!url) {
        viewerNumber.textContent = "Ошибка: URL GLB отсутствует";
        return;
    }

    viewerNumber.textContent = "Загрузка 3D...";

    try {
        const response = await fetchWithTimeout(url, {
            method: "GET",
            cache: "no-store",
            headers: { "Accept": "model/gltf-binary,application/octet-stream,*/*" }
        }, 30000);

        if (token !== viewerLoadToken) return;

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const contentType = (response.headers.get("content-type") || "").toLowerCase();
        const buffer = await response.arrayBuffer();

        if (token !== viewerLoadToken) return;
        if (buffer.byteLength < 20) throw new Error("Файл GLB слишком мал или пустой");

        // GLB magic must be ASCII 'glTF' = 0x46546c67 in little-endian.
        const magic = new DataView(buffer).getUint32(0, true);
        if (magic !== 0x46546c67) {
            if (contentType.includes("text/html")) throw new Error("Сервер вернул HTML вместо GLB");
            if (contentType.includes("application/json")) throw new Error("Сервер вернул JSON вместо GLB");
            throw new Error("Ответ не является корректным GLB");
        }

        let basePath = url.slice(0, url.lastIndexOf("/") + 1);
        const resourceMatch = url.match(/\/api\/models\/file\/(\d+)(?:\?.*)?$/);
        if (resourceMatch) {
            basePath = "https://api.araicameragame.party/api/models/resource/" + resourceMatch[1] + "/";
        }

        loader.parse(
            buffer,
            basePath,
            gltf => {
                if (token !== viewerLoadToken) return;
                try {
                    const loaded = prepareLoadedModel(gltf);
                    model = loaded;
                    scene.add(model);
                    resetViewerCamera();
                    viewerNumber.textContent = "3D";
                    if (viewerHint) {
                        viewerHint.style.opacity = "1";
                        setTimeout(() => { viewerHint.style.opacity = "0"; }, 4500);
                    }
                } catch (error) {
                    console.error("MODEL PREPARE ERROR:", error);
                    viewerNumber.textContent = "Ошибка модели";
                }
            },
            error => {
                console.error("GLB PARSE ERROR:", error);
                viewerNumber.textContent = "Ошибка декодирования GLB";
            }
        );
    } catch (error) {
        console.error("GLB LOAD ERROR:", error);
        viewerNumber.textContent = "Не удалось загрузить GLB";
    }
}

function openViewer(index) {
    viewerOpenedFromArchive = false;
    if (!requireAccess()) return;

    const item = galleryItems[index];
    if (!item) return;

    viewerNumber.textContent = item.number;
    showScreen(viewerScreen);
    initViewer();
    loadModelIntoViewer(MODEL_BASE + encodeURIComponent(item.filename));
}
