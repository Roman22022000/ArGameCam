========================================================= */

/* =========================================================

#help {

<script type="importmap">

<script type="module">


/* =========================================================
   IMPORT
========================================================= */

import * as THREE from "three";

import {
    GLTFLoader
}
from
"three/addons/loaders/GLTFLoader.js";



/* =========================================================
   TELEGRAM
========================================================= */

const tg =
    window.Telegram?.WebApp || null;


if (tg) {

    tg.ready();

    tg.expand();


    if (
        typeof tg.disableVerticalSwipes ===
        "function"
    ) {

        tg.disableVerticalSwipes();

    }

}



/* =========================================================
   MODEL
========================================================= */

const MODEL_URL =
    "./models/creature.glb";



/* =========================================================
   DOM
========================================================= */

const startScreen =
    document.getElementById(
        "startScreen"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const statusElement =
    document.getElementById(
        "status"
    );


const trackingBadge =
    document.getElementById(
        "trackingBadge"
    );


const topBar =
    document.getElementById(
        "topBar"
    );


const closeButton =
    document.getElementById(
        "closeButton"
    );


const reticle =
    document.getElementById(
        "reticle"
    );


const controls =
    document.getElementById(
        "controls"
    );


const lockButton =
    document.getElementById(
        "lockButton"
    );


const unlockButton =
    document.getElementById(
        "unlockButton"
    );


const resetButton =
    document.getElementById(
        "resetButton"
    );


const scaleUpButton =
    document.getElementById(
        "scaleUpButton"
    );


const scaleDownButton =
    document.getElementById(
        "scaleDownButton"
    );


const help =
    document.getElementById(
        "help"
    );


const bottomPanel =
    document.getElementById(
        "bottomPanel"
    );


const modelName =
    document.getElementById(
        "modelName"
    );



/* =========================================================
   THREE
========================================================= */

let renderer;

let scene;

let model;

let xrCamera;



/* =========================================================
   XR
========================================================= */

let xrSession = null;

let localReferenceSpace = null;

let viewerSpace = null;

let hitTestSource = null;

let xrActive = false;



/* =========================================================
   HIT TEST
========================================================= */

let currentHitPose = null;



/* =========================================================
   ANCHOR
========================================================= */

let xrAnchor = null;



/* =========================================================
   STATE
========================================================= */

let modelLoaded = false;

let modelLocked = false;



/* =========================================================
   GESTURE
========================================================= */

let touches = [];

let initialPinchDistance = 0;

let initialScale = 1;



/* =========================================================
   STATUS
========================================================= */

function setStatus(
    text
) {

    statusElement.textContent =
        text;

}



/* =========================================================
   THREE INIT
========================================================= */

function initThree() {

    scene =
        new THREE.Scene();


    renderer =
        new THREE.WebGLRenderer({

            alpha: true,

            antialias: true,

            powerPreference:
                "high-performance"

        });


    renderer.setPixelRatio(

        Math.min(
            window.devicePixelRatio,
            2
        )

    );


    renderer.setSize(

        window.innerWidth,
        window.innerHeight

    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    renderer.xr.enabled =
        true;


    renderer.domElement.style.position =
        "absolute";


    renderer.domElement.style.inset =
        "0";


    renderer.domElement.style.zIndex =
        "2";


    document
        .getElementById("app")
        .appendChild(
            renderer.domElement
        );


    /*
     * Освещение.
     */

    const hemisphere =
        new THREE.HemisphereLight(

            0xffffff,

            0x444444,

            3

        );


    scene.add(
        hemisphere
    );


    const directional =
        new THREE.DirectionalLight(

            0xffffff,

            3

        );


    directional.position.set(

        4,
        8,
        4

    );


    scene.add(
        directional
    );

}



/* =========================================================
   LOAD GLB
========================================================= */

function loadModel() {

    return new Promise(

        function (
            resolve,
            reject
        ) {

            setStatus(
                "Загрузка 3D-модели..."
            );


            const loader =
                new GLTFLoader();


            loader.load(

                MODEL_URL,


                function (
                    gltf
                ) {

                    model =
                        gltf.scene;


                    /*
                     * Получаем размеры.
                     */

                    const box =
                        new THREE.Box3();


                    box.setFromObject(
                        model
                    );


                    const size =
                        box.getSize(

                            new THREE.Vector3()

                        );


                    const center =
                        box.getCenter(

                            new THREE.Vector3()

                        );


                    /*
                     * Центрируем модель.
                     */

                    model.position.set(

                        -center.x,

                        -center.y,

                        -center.z

                    );


                    /*
                     * Приводим модель
                     * к удобному размеру.
                     */

                    const maxSize =
                        Math.max(

                            size.x,
                            size.y,
                            size.z

                        );


                    if (
                        maxSize > 0
                    ) {

                        const scale =
                            1.5 /
                            maxSize;


                        model.scale.setScalar(
                            scale
                        );

                    }


                    /*
                     * Mesh.
                     */

                    model.traverse(

                        function (
                            object
                        ) {

                            if (
                                object.isMesh
                            ) {

                                object.frustumCulled =
                                    false;

                                object.castShadow =
                                    true;

                                object.receiveShadow =
                                    true;

                            }

                        }

                    );


                    /*
                     * Пока не показываем.
                     */

                    model.visible =
                        false;


                    scene.add(
                        model
                    );


                    modelLoaded =
                        true;


                    modelName.textContent =
                        "3D MODEL";


                    setStatus(
                        "Модель загружена."
                    );


                    resolve();

                },


                undefined,


                function (
                    error
                ) {

                    console.error(
                        "GLB ERROR:",
                        error
                    );


                    setStatus(

                        "Не удалось загрузить 3D-модель."

                    );


                    reject(
                        error
                    );

                }

            );

        }

    );

}



/* =========================================================
   START WEBXR
========================================================= */

async function startAR() {

    /*
     * HTTPS
     */

    if (
        !window.isSecureContext
    ) {

        throw new Error(
            "Требуется HTTPS."
        );

    }


    /*
     * WebXR
     */

    if (
        !navigator.xr
    ) {

        throw new Error(

            "WebXR не поддерживается."

        );

    }


    /*
     * Проверяем immersive-ar.
     */

    const supported =
        await navigator.xr
            .isSessionSupported(
                "immersive-ar"
            );


    if (
        !supported
    ) {

        throw new Error(

            "Immersive AR не поддерживается."

        );

    }


    /*
     * =====================================================
     * ЗАПРАШИВАЕМ НАСТОЯЩИЙ AR
     * =====================================================
     *
     * local:
     * отслеживание движения телефона.
     *
     * hit-test:
     * поиск точки реального пространства.
     *
     * anchors:
     * закрепление объекта.
     *
     * dom-overlay:
     * элементы интерфейса поверх AR.
     */

    xrSession =
        await navigator.xr
            .requestSession(

                "immersive-ar",

                {

                    requiredFeatures: [

                        "local",

                        "hit-test"

                    ],

                    optionalFeatures: [

                        "anchors",

                        "dom-overlay",

                        "local-floor"

                    ],

                    domOverlay: {

                        root:
                            document.body

                    }

                }

            );


    /*
     * =====================================================
     * REFERENCE SPACE
     * =====================================================
     */

    localReferenceSpace =
        await xrSession
            .requestReferenceSpace(
                "local"
            );


    /*
     * Viewer space.
     *
     * Луч hit-test идёт из камеры.
     */

    viewerSpace =
        await xrSession
            .requestReferenceSpace(
                "viewer"
            );


    /*
     * =====================================================
     * HIT TEST SOURCE
     * =====================================================
     */

    hitTestSource =
        await xrSession
            .requestHitTestSource({

                space:
                    viewerSpace

            });


    /*
     * Передаём session Three.js.
     */

    await renderer.xr.setSession(
        xrSession
    );


    xrActive =
        true;


    /*
     * UI.
     */

    startScreen.style.display =
        "none";


    topBar.style.display =
        "flex";


    controls.style.display =
        "flex";


    help.style.display =
        "block";


    bottomPanel.style.display =
        "block";


    closeButton.style.display =
        "block";


    reticle.style.display =
        "block";


    trackingBadge.textContent =
        "6DoF";


    /*
     * Загружаем модель.
     */

    await loadModel();


    /*
     * Render loop.
     */

    renderer.setAnimationLoop(
        renderXR
    );


    /*
     * Session end.
     */

    xrSession.addEventListener(

        "end",

        function () {

            stopAR();

        }

    );


    setStatus(

        "Наведите центр камеры на место размещения."

    );

}



/* =========================================================
   XR RENDER LOOP
========================================================= */

function renderXR(
    time,
    frame
) {

    if (
        !xrSession ||
        !frame ||
        !localReferenceSpace
    ) {

        return;

    }


    /*
     * Получаем pose камеры.
     *
     * Это реальное положение
     * и ориентация телефона
     * в XR world.
     */

    const viewerPose =
        frame.getViewerPose(

            localReferenceSpace

        );


    /*
     * =====================================================
     * HIT TEST
     * =====================================================
     */

    const results =
        hitTestSource
            ? frame.getHitTestResults(
                hitTestSource
            )
            : [];


    currentHitPose =
        null;


    if (
        results.length > 0
    ) {

        const hit =
            results[0];


        const pose =
            hit.getPose(
                localReferenceSpace
            );


        if (
            pose
        ) {

            currentHitPose =
                pose;


            /*
             * Точка найдена.
             */

            reticle.style.display =
                "block";


            setStatus(

                modelLocked

                    ? "Сцена закреплена. Ходите вокруг неё."

                    : "Точка найдена. Нажмите «ЗАКРЕПИТЬ»."

            );

        }

    }
    else {

        /*
         * Реальная поверхность
         * пока не найдена.
         */

        if (
            !modelLocked
        ) {

            setStatus(

                "Наведите камеру на поверхность."

            );

        }

    }


    /*
     * =====================================================
     * ПОКАЗЫВАЕМ ПРЕДПРОСМОТР
     * =====================================================
     */

    if (
        model &&
        modelLoaded &&
        !modelLocked &&
        currentHitPose
    ) {

        const transform =
            currentHitPose.transform;


        /*
         * Поза точки hit-test.
         */

        model.position.set(

            transform.position.x,

            transform.position.y,

            transform.position.z

        );


        model.quaternion.set(

            transform.orientation.x,

            transform.orientation.y,

            transform.orientation.z,

            transform.orientation.w

        );


        model.visible =
            true;

    }


    /*
     * =====================================================
     * LOCKED MODEL
     * =====================================================
     *
     * ВАЖНО:
     *
     * Здесь НИКОГДА не устанавливаем
     * model.position из позиции камеры.
     *
     * Положение модели берётся
     * из XRAnchor.
     *
     * Поэтому телефон может
     * двигаться вокруг модели.
     */

    if (
        modelLocked &&
        xrAnchor
    ) {

        const anchorPose =
            frame.getPose(

                xrAnchor.anchorSpace,

                localReferenceSpace

            );


        if (
            anchorPose
        ) {

            const transform =
                anchorPose.transform;


            model.position.set(

                transform.position.x,

                transform.position.y,

                transform.position.z

            );


            model.quaternion.set(

                transform.orientation.x,

                transform.orientation.y,

                transform.orientation.z,

                transform.orientation.w

            );


            model.visible =
                true;

        }

    }


    /*
     * =====================================================
     * RENDER
     * =====================================================
     */

    renderer.render(

        scene,

        renderer.xr.getCamera()

    );

}



/* =========================================================
   CREATE ANCHOR
========================================================= */

async function createModelAnchor(
    frame
) {

    if (
        !currentHitPose
    ) {

        setStatus(

            "Сначала наведите камеру на поверхность."

        );

        return false;

    }


    /*
     * Проверяем поддержку anchors.
     */

    if (
        typeof frame.createAnchor !==
        "function"
    ) {

        /*
         * Fallback:
         *
         * даже без Anchor сохраняем
         * мировую XR-позу.
         */

        modelLocked =
            true;


        model.visible =
            true;


        reticle.style.display =
            "none";


        help.textContent =

            "СЦЕНА ЗАКРЕПЛЕНА. " +
            "Перемещайтесь вокруг неё.";

        setStatus(

            "Сцена закреплена."

        );


        return true;

    }


    try {

        /*
         * Создаём anchor именно
         * в точке hit-test.
         */

        xrAnchor =
            await frame.createAnchor(

                currentHitPose.transform,

                localReferenceSpace

            );


        /*
         * Теперь модель
         * принадлежит anchor.
         */

        modelLocked =
            true;


        model.visible =
            true;


        reticle.style.display =
            "none";


        trackingBadge.textContent =
            "LOCKED";


        help.textContent =

            "СЦЕНА ЗАКРЕПЛЕНА. " +
            "Ходите с телефоном вокруг неё.";

        setStatus(

            "Сцена закреплена в пространстве."

        );


        return true;

    }
    catch (
        error
    ) {

        console.error(
            "ANCHOR ERROR:",
            error
        );


        /*
         * Fallback.
         *
         * Используем текущую
         * мировую позу.
         */

        modelLocked =
            true;


        model.visible =
            true;


        reticle.style.display =
            "none";


        trackingBadge.textContent =
            "LOCKED";


        setStatus(

            "Сцена закреплена."

        );


        return true;

    }

}



/* =========================================================
   LOCK BUTTON
========================================================= */

lockButton.addEventListener(

    "click",

    async function () {

        if (
            modelLocked
        ) {

            return;

        }


        if (
            !model ||
            !modelLoaded
        ) {

            setStatus(

                "Модель ещё загружается."

            );

            return;

        }


        if (
            !currentHitPose
        ) {

            setStatus(

                "Наведите камеру на поверхность."

            );

            return;

        }


        /*
         * Получаем текущий XR frame
         * через requestAnimationFrame.
         */

        xrSession.requestAnimationFrame(

            async function (
                time,
                frame
            ) {

                await createModelAnchor(
                    frame
                );

            }

        );

    }

);

unlockButton.addEventListener(

/* =========================================================
   TWO FINGER GESTURE
========================================================= */

function getDistance(
    a,
    b
) {

    const dx =
        a.clientX -
        b.clientX;


    const dy =
        a.clientY -
        b.clientY;


    return Math.sqrt(

        dx * dx +
        dy * dy

    );

}



rendererDomTouchEvents();



function rendererDomTouchEvents() {

    /*
     * Обрабатываем pinch
     * непосредственно на canvas.
     */

    document.addEventListener(

        "touchstart",

        function (
            event
        ) {

            if (
                modelLocked
            ) {

                return;

            }


            touches =
                Array.from(
                    event.touches
                );


            if (
                touches.length === 2
            ) {

                initialPinchDistance =
                    getDistance(

                        touches[0],
                        touches[1]

                    );


                if (
                    model
                ) {

                    initialScale =
                        model.scale.x;

                }

            }

        },

        {
            passive: true
        }

    );


    document.addEventListener(

        "touchmove",

        function (
            event
        ) {

            if (
                modelLocked
            ) {

                return;

            }


            touches =
                Array.from(
                    event.touches
                );


            if (
                touches.length === 2 &&
                model &&
                initialPinchDistance > 0
            ) {

                const distance =
                    getDistance(

                        touches[0],
                        touches[1]

                    );


                const factor =
                    distance /
                    initialPinchDistance;


                const newScale =
                    THREE.MathUtils.clamp(

                        initialScale *
                        factor,

                        0.05,

                        20

                    );


                model.scale.setScalar(
                    newScale
                );

            }

        },

        {
            passive: true
        }

    );


    document.addEventListener(

        "touchend",

        function () {

            touches =
                [];

        },

        {
            passive: true
        }

    );

}



/* =========================================================
   CLOSE
========================================================= */

closeButton.addEventListener(

    "click",

    async function () {

        await stopAR();

    }

);



/* =========================================================
   STOP
========================================================= */

async function stopAR() {

    if (
        hitTestSource
    ) {

        try {

            hitTestSource.cancel();

        }
        catch {}

        hitTestSource =
            null;

    }


    if (
        xrAnchor
    ) {

        try {

            xrAnchor.delete();

        }
        catch {}

        xrAnchor =
            null;

    }


    if (
        xrSession
    ) {

        try {

            await xrSession.end();

        }
        catch {}

    }


    xrSession =
        null;


    xrActive =
        false;


    modelLocked =
        false;


    currentHitPose =
        null;


    if (
        renderer
    ) {

        renderer.setAnimationLoop(
            null
        );

    }


    startScreen.style.display =
        "flex";


    topBar.style.display =
        "none";


    controls.style.display =
        "none";


    help.style.display =
        "none";


    bottomPanel.style.display =
        "none";


    closeButton.style.display =
        "none";


    reticle.style.display =
        "none";


    setStatus(
        "Готово"
    );

}



/* =========================================================
   START BUTTON
========================================================= */

startButton.addEventListener(

    "click",

    async function () {

        startButton.disabled =
            true;


        setStatus(
            "Запуск AR..."
        );


        try {

            initThree();


            await startAR();

        }
        catch (
            error
        ) {

            console.error(
                error
            );


            setStatus(

                error.message ||
                "AR не поддерживается."

            );


            startButton.disabled =
                false;

        }

    }

);



/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(

    "resize",

    function () {

        if (
            renderer
        ) {

            renderer.setSize(

                window.innerWidth,
                window.innerHeight

            );

        }

    }

);
