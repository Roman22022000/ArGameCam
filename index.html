<script type="module">


/* =====================================================
   IMPORT
====================================================== */

import * as THREE
    from "three";


import {
    GLTFLoader
}
from "three/addons/loaders/GLTFLoader.js";


import {
    OrbitControls
}
from "three/addons/controls/OrbitControls.js";



/* =====================================================
   TELEGRAM
====================================================== */

const tg =
    window.Telegram?.WebApp || null;


if (tg) {

    tg.ready();

    tg.expand();

    if (tg.setHeaderColor) {

        tg.setHeaderColor("#000000");

    }

    if (tg.setBackgroundColor) {

        tg.setBackgroundColor("#000000");

    }

}



/* =====================================================
   SCREENS
====================================================== */

const homeScreen =
    document.getElementById(
        "homeScreen"
    );


const galleryScreen =
    document.getElementById(
        "galleryScreen"
    );


const viewerScreen =
    document.getElementById(
        "viewerScreen"
    );



function showScreen(screen) {

    document
        .querySelectorAll(".screen")
        .forEach(
            element => {

                element.classList.remove(
                    "active"
                );

            }
        );


    screen.classList.add(
        "active"
    );

}



/* =====================================================
   NAVIGATION
====================================================== */

document
    .getElementById("openGallery")
    .addEventListener(
        "click",
        () => {

            showScreen(
                galleryScreen
            );

        }
    );


document
    .getElementById("galleryBack")
    .addEventListener(
        "click",
        () => {

            showScreen(
                homeScreen
            );

        }
    );


document
    .getElementById("viewerBack")
    .addEventListener(
        "click",
        () => {

            stopMotion();

            showScreen(
                galleryScreen
            );

        }
    );



/* =====================================================
   THREE
====================================================== */

let scene = null;

let camera = null;

let renderer = null;

let controls = null;

let model = null;



/* =====================================================
   MODEL
====================================================== */

const MODEL_URL =
    "https://raw.githubusercontent.com/" +
    "Roman22022000/ArGameCam/main/models/";


const gltfLoader =
    new GLTFLoader();


const MODEL_CENTER =
    new THREE.Vector3(
        0,
        0,
        0
    );



/* =====================================================
   CAMERA
====================================================== */

const CAMERA_DISTANCE = 3;



/* =====================================================
   SENSOR
====================================================== */

let motionEnabled = false;


/*
    Реальная ориентация телефона.
*/

let alpha = 0;

let beta = 0;

let gamma = 0;


/*
    Начальная ориентация.
*/

let initialQuaternion =
    new THREE.Quaternion();


/*
    Текущая ориентация телефона.
*/

let deviceQuaternion =
    new THREE.Quaternion();


/*
    Камера должна вращаться относительно
    исходного положения телефона.
*/

let cameraQuaternion =
    new THREE.Quaternion();


/*
    Корректировка для камеры Three.js.

    Это стандартная коррекция
    DeviceOrientation → camera.
*/

const zee =
    new THREE.Vector3(
        0,
        0,
        1
    );


const euler =
    new THREE.Euler(
        0,
        0,
        0,
        "YXZ"
    );


const q0 =
    new THREE.Quaternion();


const q1 =
    new THREE.Quaternion(
        -Math.sqrt(0.5),
        0,
        0,
        Math.sqrt(0.5)
    );


/*
    Положение экрана.

    Если телефон перевернут горизонтально,
    учитываем это.
*/

let screenOrientation = 0;



/* =====================================================
   THREE INIT
====================================================== */

function initThree() {

    const container =
        document.getElementById(
            "canvasContainer"
        );


    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0x000000
        );


    /* -------------------------------------------------
       CAMERA
    -------------------------------------------------- */

    camera =
        new THREE.PerspectiveCamera(
            45,
            window.innerWidth /
            window.innerHeight,
            0.01,
            1000
        );


    camera.position.set(
        0,
        0.4,
        CAMERA_DISTANCE
    );


    camera.lookAt(
        MODEL_CENTER
    );


    /* -------------------------------------------------
       LIGHT
    -------------------------------------------------- */

    const hemisphere =
        new THREE.HemisphereLight(
            0xffffff,
            0x222222,
            2.2
        );


    scene.add(
        hemisphere
    );


    const light =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );


    light.position.set(
        3,
        5,
        4
    );


    scene.add(
        light
    );


    const fill =
        new THREE.DirectionalLight(
            0xffffff,
            1
        );


    fill.position.set(
        -4,
        2,
        -4
    );


    scene.add(
        fill
    );


    /* -------------------------------------------------
       RENDERER
    -------------------------------------------------- */

    renderer =
        new THREE.WebGLRenderer({
            antialias: true,
            powerPreference:
                "high-performance"
        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    container.appendChild(
        renderer.domElement
    );


    /* -------------------------------------------------
       TOUCH CONTROL
    -------------------------------------------------- */

    controls =
        new OrbitControls(
            camera,
            renderer.domElement
        );


    controls.enableDamping =
        true;


    controls.dampingFactor =
        0.08;


    controls.enablePan =
        false;


    controls.minDistance =
        1.2;


    controls.maxDistance =
        7;


    controls.target.copy(
        MODEL_CENTER
    );


    controls.update();


    window.addEventListener(
        "resize",
        resize
    );


    window.addEventListener(
        "orientationchange",
        updateScreenOrientation
    );


    updateScreenOrientation();


    animate();

}



/* =====================================================
   SCREEN ORIENTATION
====================================================== */

function updateScreenOrientation() {

    if (
        screen.orientation &&
        typeof screen.orientation.angle ===
        "number"
    ) {

        screenOrientation =
            THREE.MathUtils.degToRad(
                screen.orientation.angle
            );

        return;
    }


    if (
        typeof window.orientation ===
        "number"
    ) {

        screenOrientation =
            THREE.MathUtils.degToRad(
                window.orientation
            );

        return;
    }


    screenOrientation = 0;

}



/* =====================================================
   LOAD MODEL
====================================================== */

function loadModel(filename) {

    const loader =
        document.getElementById(
            "loader"
        );


    const loaderText =
        document.getElementById(
            "loaderText"
        );


    loader.classList.remove(
        "hidden"
    );


    if (model) {

        scene.remove(
            model
        );


        model.traverse(
            object => {

                if (
                    object.isMesh
                ) {

                    object.geometry?.dispose();


                    if (
                        Array.isArray(
                            object.material
                        )
                    ) {

                        object.material
                            .forEach(
                                material => {

                                    material.dispose();

                                }
                            );

                    }
                    else {

                        object.material?.dispose();

                    }

                }

            }
        );


        model = null;

    }


    gltfLoader.load(

        MODEL_URL + filename,


        gltf => {

            model =
                gltf.scene;


            /*
                Вычисляем центр.
            */

            const box =
                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            const center =
                box.getCenter(
                    new THREE.Vector3()
                );


            const size =
                box.getSize(
                    new THREE.Vector3()
                );


            /*
                Центр модели → 0,0,0
            */

            model.position.sub(
                center
            );


            /*
                Нормализация размера.
            */

            const maxSize =
                Math.max(
                    size.x,
                    size.y,
                    size.z
                );


            if (
                maxSize > 0
            ) {

                model.scale.setScalar(
                    2 / maxSize
                );

            }


            scene.add(
                model
            );


            resetCamera();


            loader.classList.add(
                "hidden"
            );

        },


        xhr => {

            if (xhr.total) {

                const progress =
                    Math.round(
                        xhr.loaded /
                        xhr.total *
                        100
                    );


                loaderText.textContent =
                    `Загрузка ${progress}%`;

            }

        },


        error => {

            console.error(
                error
            );


            loaderText.textContent =
                "Ошибка загрузки модели";

        }

    );

}



/* =====================================================
   RESET CAMERA
====================================================== */

function resetCamera() {

    camera.position.set(
        0,
        0.4,
        CAMERA_DISTANCE
    );


    camera.lookAt(
        MODEL_CENTER
    );


    if (controls) {

        controls.target.copy(
            MODEL_CENTER
        );

        controls.update();

    }

}



/* =====================================================
   GALLERY
====================================================== */

document
    .querySelectorAll(
        ".numberButton"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    const filename =
                        button.dataset.model;


                    document
                        .getElementById(
                            "viewerName"
                        )
                        .textContent =
                        "Creature " +
                        button.textContent;


                    showScreen(
                        viewerScreen
                    );


                    if (!renderer) {

                        initThree();

                    }


                    loadModel(
                        filename
                    );

                }
            );

        }
    );



/* =====================================================
   SENSOR BUTTON
====================================================== */

document
    .getElementById(
        "sensorButton"
    )
    .addEventListener(
        "click",
        startMotion
    );



/* =====================================================
   START MOTION
====================================================== */

async function startMotion() {

    if (motionEnabled) {
        return;
    }


    const status =
        document.getElementById(
            "sensorStatus"
        );


    const button =
        document.getElementById(
            "sensorButton"
        );


    /*
        -------------------------------------------------
        TELEGRAM
        -------------------------------------------------
    */

    if (
        tg &&
        tg.DeviceOrientation &&
        typeof tg.DeviceOrientation.start ===
        "function"
    ) {

        try {

            /*
                Сначала подписка.
            */

            tg.onEvent(
                "deviceOrientationChanged",
                onTelegramOrientation
            );


            tg.onEvent(
                "deviceOrientationStarted",
                onOrientationStarted
            );


            tg.onEvent(
                "deviceOrientationFailed",
                onOrientationFailed
            );


            /*
                Запуск Telegram sensor.
            */

            tg.DeviceOrientation.start({

                refresh_rate: 20,

                need_absolute: true

            });


            /*
                Временно считаем запусканным.
            */

            motionEnabled = true;


            if (controls) {

                controls.enabled = false;

            }


            status.textContent =
                "Ожидание данных телефона...";


            button.textContent =
                "Сенсор активен";


            return;

        }
        catch (error) {

            console.error(
                "Telegram orientation error:",
                error
            );

        }

    }


    /*
        -------------------------------------------------
        BROWSER FALLBACK
        -------------------------------------------------
    */

    if (
        typeof DeviceOrientationEvent !==
        "undefined"
    ) {

        try {

            if (
                typeof DeviceOrientationEvent
                    .requestPermission ===
                "function"
            ) {

                const permission =
                    await DeviceOrientationEvent
                        .requestPermission();


                if (
                    permission !==
                    "granted"
                ) {

                    status.textContent =
                        "Доступ запрещён";

                    return;

                }

            }


            window.addEventListener(
                "deviceorientation",
                onBrowserOrientation,
                true
            );


            motionEnabled = true;


            if (controls) {

                controls.enabled = false;

            }


            status.textContent =
                "Ожидание данных телефона...";


            button.textContent =
                "Сенсор активен";

        }
        catch (error) {

            console.error(
                error
            );


            status.textContent =
                "Ошибка сенсора";

        }

    }
    else {

        status.textContent =
            "Device Orientation не поддерживается";

    }

}



/* =====================================================
   TELEGRAM SENSOR STARTED
====================================================== */

function onOrientationStarted() {

    const status =
        document.getElementById(
            "sensorStatus"
        );


    status.textContent =
        "Сенсор Telegram запущен";

}



/* =====================================================
   TELEGRAM ORIENTATION FAILED
====================================================== */

function onOrientationFailed(data) {

    console.error(
        "Telegram orientation failed:",
        data
    );


    motionEnabled = false;


    const status =
        document.getElementById(
            "sensorStatus"
        );


    status.textContent =
        "Telegram: сенсор недоступен";


    if (controls) {

        controls.enabled = true;

    }

}



/* =====================================================
   TELEGRAM ORIENTATION
====================================================== */

function onTelegramOrientation(data) {

    if (!motionEnabled) {
        return;
    }


    if (!data) {
        return;
    }


    /*
        Telegram:

        alpha = Z
        beta  = X
        gamma = Y

        В РАДИАНАХ.
    */

    alpha =
        Number(data.alpha) || 0;


    beta =
        Number(data.beta) || 0;


    gamma =
        Number(data.gamma) || 0;


    /*
        Показываем реальные данные.
        Если числа меняются при движении телефона,
        приём данных работает.
    */

    showSensorData(
        alpha,
        beta,
        gamma
    );


    /*
        Преобразуем ориентацию телефона
        в quaternion.
    */

    updateDeviceQuaternion(
        alpha,
        beta,
        gamma
    );


    /*
        Первое положение телефона
        становится начальным.

        Важно: сохраняем ПОЛНЫЙ quaternion,
        а не три отдельных угла.
    */

    if (
        initialQuaternion.equals(
            new THREE.Quaternion()
        )
    ) {

        initialQuaternion.copy(
            deviceQuaternion
        );


        /*
            При первом получении данных
            камера остаётся на текущем месте.
        */

        return;

    }


    /*
        Относительное вращение:

            initial^-1 * current
    */

    const relative =
        initialQuaternion
            .clone()
            .invert()
            .multiply(
                deviceQuaternion
            );


    /*
        Получаем направление
        камеры из относительного
        вращения.
    */

    cameraQuaternion.copy(
        relative
    );

}



/* =====================================================
   BROWSER ORIENTATION
====================================================== */

function onBrowserOrientation(event) {

    if (!motionEnabled) {
        return;
    }


    if (
        event.alpha === null ||
        event.beta === null ||
        event.gamma === null
    ) {

        return;
    }


    /*
        Browser API:

        ГРАДУСЫ.

        Переводим в радианы.
    */

    alpha =
        THREE.MathUtils.degToRad(
            event.alpha
        );


    beta =
        THREE.MathUtils.degToRad(
            event.beta
        );


    gamma =
        THREE.MathUtils.degToRad(
            event.gamma
        );


    showSensorData(
        alpha,
        beta,
        gamma
    );


    updateDeviceQuaternion(
        alpha,
        beta,
        gamma
    );


    if (
        initialQuaternion.equals(
            new THREE.Quaternion()
        )
    ) {

        initialQuaternion.copy(
            deviceQuaternion
        );


        return;

    }


    const relative =
        initialQuaternion
            .clone()
            .invert()
            .multiply(
                deviceQuaternion
            );


    cameraQuaternion.copy(
        relative
    );

}



/* =====================================================
   DEVICE ORIENTATION → QUATERNION
====================================================== */

function updateDeviceQuaternion(
    alpha,
    beta,
    gamma
) {

    /*
        Стандартное преобразование
        DeviceOrientation.

        alpha:
        вращение вокруг Z

        beta:
        наклон вокруг X

        gamma:
        наклон вокруг Y
    */

    euler.set(
        beta,
        alpha,
        -gamma,
        "YXZ"
    );


    deviceQuaternion
        .setFromEuler(
            euler
        );


    /*
        Коррекция устройства
        для камеры Three.js.
    */

    deviceQuaternion
        .multiply(
            q1
        );


    /*
        Коррекция ориентации экрана.
    */

    q0.setFromAxisAngle(
        zee,
        -screenOrientation
    );


    deviceQuaternion
        .multiply(
            q0
        );

}



/* =====================================================
   APPLY SENSOR TO CAMERA
====================================================== */

function updateCameraFromSensor() {

    if (
        !motionEnabled ||
        !camera
    ) {

        return;

    }


    /*
        Получаем направление взгляда
        камеры.

        В локальном пространстве
        камера смотрит вдоль -Z.
    */

    const forward =
        new THREE.Vector3(
            0,
            0,
            -1
        );


    forward.applyQuaternion(
        cameraQuaternion
    );


    /*
        Камера находится на фиксированном
        расстоянии от модели.
    */

    const position =
        forward
            .clone()
            .multiplyScalar(
                -CAMERA_DISTANCE
            )
            .add(
                MODEL_CENTER
            );


    /*
        Плавность.
    */

    camera.position.lerp(
        position,
        0.18
    );


    /*
        Камера смотрит строго
        на центр модели.
    */

    camera.lookAt(
        MODEL_CENTER
    );

}



/* =====================================================
   SENSOR DEBUG
====================================================== */

function showSensorData(
    alpha,
    beta,
    gamma
) {

    const element =
        document.getElementById(
            "sensorData"
        );


    element.textContent =
        "α: " +
        alpha.toFixed(2) +
        " | β: " +
        beta.toFixed(2) +
        " | γ: " +
        gamma.toFixed(2);


    const status =
        document.getElementById(
            "sensorStatus"
        );


    status.textContent =
        "Данные телефона получены";

}



/* =====================================================
   STOP MOTION
====================================================== */

function stopMotion() {

    motionEnabled = false;


    /*
        Telegram.
    */

    if (
        tg &&
        tg.DeviceOrientation &&
        typeof tg.DeviceOrientation.stop ===
        "function"
    ) {

        try {

            tg.DeviceOrientation.stop();

        }
        catch (error) {

            console.warn(
                error
            );

        }

    }


    /*
        Удаляем события Telegram.
    */

    if (
        tg &&
        typeof tg.offEvent ===
        "function"
    ) {

        tg.offEvent(
            "deviceOrientationChanged",
            onTelegramOrientation
        );


        tg.offEvent(
            "deviceOrientationStarted",
            onOrientationStarted
        );


        tg.offEvent(
            "deviceOrientationFailed",
            onOrientationFailed
        );

    }


    /*
        Browser.
    */

    window.removeEventListener(
        "deviceorientation",
        onBrowserOrientation,
        true
    );


    /*
        Возвращаем управление пальцем.
    */

    if (controls) {

        controls.enabled = true;

    }


    /*
        Сбрасываем начальный quaternion.
    */

    initialQuaternion.identity();

    deviceQuaternion.identity();

    cameraQuaternion.identity();


    document
        .getElementById(
            "sensorStatus"
        )
        .textContent =
        "Сенсоры выключены";


    document
        .getElementById(
            "sensorButton"
        )
        .textContent =
        "Включить движение телефона";


    document
        .getElementById(
            "sensorData"
        )
        .textContent =
        "α: -- | β: -- | γ: --";

}



/* =====================================================
   RESIZE
====================================================== */

function resize() {

    if (
        !camera ||
        !renderer
    ) {

        return;
    }


    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}



/* =====================================================
   ANIMATION
====================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    /*
        Если сенсор выключен —
        работает управление пальцем.
    */

    if (
        controls &&
        controls.enabled
    ) {

        controls.update();

    }


    /*
        Если сенсор включен —
        камера управляется
        ориентацией телефона.
    */

    updateCameraFromSensor();


    if (
        renderer &&
        scene &&
        camera
    ) {

        renderer.render(
            scene,
            camera
        );

    }

}


</script>
