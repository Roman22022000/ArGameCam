<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1,
    maximum-scale=1,
    user-scalable=no,
    viewport-fit=cover"
>

<title>AR</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    color: #fff;

    font-family: Arial, sans-serif;

    touch-action: none;
}

#app {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;
}


/* START */

#start {

    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #000;

    z-index: 10;

    padding: 20px;
}

#startContent {

    width: 100%;

    max-width: 360px;

    text-align: center;
}

#start h1 {

    margin: 0 0 10px;

    font-size: 42px;

    letter-spacing: 6px;
}

#start p {

    margin: 0 0 35px;

    color: #888;
}

#startButton {

    width: 100%;

    height: 58px;

    border: 0;

    border-radius: 14px;

    background: #fff;

    color: #000;

    font-size: 15px;

    font-weight: bold;
}

#startStatus {

    margin-top: 15px;

    color: #777;

    font-size: 12px;
}


/* CAMERA */

#camera {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: none;

    z-index: 1;
}


/* AR */

#ar {

    position: absolute;

    inset: 0;

    display: none;

    z-index: 5;

    pointer-events: none;
}


/* TOP */

#top {

    position: absolute;

    top: 15px;

    left: 15px;

    right: 15px;

    display: flex;

    justify-content:
        space-between;

    align-items: center;
}

#arStatus {

    padding: 9px 14px;

    border-radius: 20px;

    background:
        rgba(0,0,0,.65);

    font-size: 12px;
}

#close {

    width: 44px;

    height: 44px;

    border: 0;

    border-radius: 50%;

    background:
        rgba(0,0,0,.7);

    color: #fff;

    font-size: 26px;

    pointer-events: auto;
}


/* RETICLE */

#reticle {

    position: absolute;

    left: 50%;

    top: 50%;

    width: 42px;

    height: 42px;

    transform:
        translate(-50%, -50%);

    border:
        1px solid
        rgba(255,255,255,.8);

    border-radius: 50%;
}


/* BUTTONS */

#bottom {

    position: absolute;

    left: 20px;

    right: 20px;

    bottom: 20px;

    display: flex;

    justify-content: center;

    pointer-events: auto;
}

#placeButton {

    width: 100%;

    max-width: 360px;

    height: 56px;

    border:
        1px solid
        rgba(255,255,255,.8);

    border-radius: 14px;

    background:
        rgba(0,0,0,.75);

    color: #fff;

    font-size: 14px;

    font-weight: bold;

    display: none;
}


/* DATA */

#data {

    position: absolute;

    left: 10px;

    bottom: 90px;

    padding: 9px;

    border-radius: 8px;

    background:
        rgba(0,0,0,.55);

    font-family: monospace;

    font-size: 9px;

    line-height: 1.5;
}

</style>

</head>


<body>


<div id="app">


<!-- START -->

<div id="start">

    <div id="startContent">

        <h1>AR</h1>

        <p>
            Telegram AR
        </p>

        <button
            id="startButton"
            type="button"
        >
            ЗАПУСК КАМЕРЫ
        </button>

        <div id="startStatus">
            Готово
        </div>

    </div>

</div>


<!-- CAMERA -->

<video
    id="camera"
    autoplay
    muted
    playsinline
></video>


<!-- AR -->

<div id="ar">


    <div id="top">

        <div id="arStatus">
            CAMERA
        </div>

        <button
            id="close"
            type="button"
        >
            ×
        </button>

    </div>


    <div id="reticle"></div>


    <div id="data">

        Orientation:
        <span id="orientation">
            0 / 0 / 0
        </span>

        <br>

        Gyro:
        <span id="gyro">
            0 / 0 / 0
        </span>

        <br>

        Accel:
        <span id="accel">
            0 / 0 / 0
        </span>

    </div>


    <div id="bottom">

        <button
            id="placeButton"
            type="button"
        >
            РАЗМЕСТИТЬ 3D МОДЕЛЬ
        </button>

    </div>

</div>


</div>


<script>

/*
==================================================
TELEGRAM
==================================================
*/

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;


/*
==================================================
ELEMENTS
==================================================
*/

const start =
    document.getElementById(
        "start"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const startStatus =
    document.getElementById(
        "startStatus"
    );

const camera =
    document.getElementById(
        "camera"
    );

const ar =
    document.getElementById(
        "ar"
    );

const arStatus =
    document.getElementById(
        "arStatus"
    );

const placeButton =
    document.getElementById(
        "placeButton"
    );

const closeButton =
    document.getElementById(
        "close"
    );


/*
==================================================
STATE
==================================================
*/

let cameraStream = null;

let xrSession = null;

let referenceSpace = null;

let viewerSpace = null;

let hitTestSource = null;

let currentHit = null;

let anchor = null;

let model = null;

let modelLoaded = false;

let modelPlaced = false;


/*
==================================================
THREE
==================================================
*/

let THREE = null;

let renderer = null;

let scene = null;

let xrCamera = null;


/*
==================================================
MOTION
==================================================
*/

const motion = {

    orientation: {
        alpha: 0,
        beta: 0,
        gamma: 0
    },

    gyro: {
        x: 0,
        y: 0,
        z: 0
    },

    accel: {
        x: 0,
        y: 0,
        z: 0
    }

};


/*
==================================================
TELEGRAM INIT
==================================================
*/

if (tg) {

    tg.ready();

    tg.expand();

    try {

        tg.setHeaderColor(
            "#000000"
        );

        tg.setBackgroundColor(
            "#000000"
        );

        tg.disableVerticalSwipes();

    } catch (_) {}

}


/*
==================================================
CAMERA
==================================================
*/

startButton.addEventListener(
    "click",
    startCamera
);


async function startCamera() {

    startButton.disabled =
        true;

    startStatus.textContent =
        "Запуск камеры...";


    try {

        cameraStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode:
                            {
                                ideal:
                                    "environment"
                            },

                        width:
                            {
                                ideal: 1920
                            },

                        height:
                            {
                                ideal: 1080
                            }

                    },

                    audio: false

                });


        camera.srcObject =
            cameraStream;


        await camera.play();


        start.style.display =
            "none";

        camera.style.display =
            "block";

        ar.style.display =
            "block";


        startMotion();


        /*
        * Загружаем Three.js
        * только после запуска
        * камеры.
        */

        await loadThree();


        /*
        * Пытаемся перейти
        * в настоящий AR.
        */

        await startAR();


    } catch (error) {

        console.error(
            error
        );


        startStatus.textContent =
            "Ошибка: " +
            error.message;

        startButton.disabled =
            false;

    }

}


/*
==================================================
TELEGRAM MOTION
==================================================
*/

function startMotion() {

    if (!tg) {
        return;
    }


    /*
    ORIENTATION
    */

    if (
        tg.DeviceOrientation
    ) {

        tg.DeviceOrientation.start(

            {
                refresh_rate: 50,
                need_absolute: true
            },

            function() {}

        );


        tg.onEvent(
            "deviceOrientationChanged",
            function() {

                const d =
                    tg.DeviceOrientation;


                motion.orientation.alpha =
                    d.alpha;

                motion.orientation.beta =
                    d.beta;

                motion.orientation.gamma =
                    d.gamma;


                document.getElementById(
                    "orientation"
                ).textContent =

                    Number(
                        d.alpha
                    ).toFixed(2)

                    + " / " +

                    Number(
                        d.beta
                    ).toFixed(2)

                    + " / " +

                    Number(
                        d.gamma
                    ).toFixed(2);

            }
        );

    }


    /*
    GYROSCOPE
    */

    if (
        tg.Gyroscope
    ) {

        tg.Gyroscope.start(

            {
                refresh_rate: 50
            },

            function() {}

        );


        tg.onEvent(
            "gyroscopeChanged",
            function() {

                const d =
                    tg.Gyroscope;


                motion.gyro.x =
                    d.x;

                motion.gyro.y =
                    d.y;

                motion.gyro.z =
                    d.z;


                document.getElementById(
                    "gyro"
                ).textContent =

                    Number(
                        d.x
                    ).toFixed(2)

                    + " / " +

                    Number(
                        d.y
                    ).toFixed(2)

                    + " / " +

                    Number(
                        d.z
                    ).toFixed(2);

            }
        );

    }


    /*
    ACCELEROMETER
    */

    if (
        tg.Accelerometer
    ) {

        tg.Accelerometer.start(

            {
                refresh_rate: 50
            },

            function() {}

        );


        tg.onEvent(
            "accelerometerChanged",
            function() {

                const d =
                    tg.Accelerometer;


                motion.accel.x =
                    d.x;

                motion.accel.y =
                    d.y;

                motion.accel.z =
                    d.z;


                document.getElementById(
                    "accel"
                ).textContent =

                    Number(
                        d.x
                    ).toFixed(2)

                    + " / " +

                    Number(
                        d.y
                    ).toFixed(2)

                    + " / " +

                    Number(
                        d.z
                    ).toFixed(2);

            }
        );

    }


    try {

        tg.lockOrientation();

    } catch (_) {}

}


/*
==================================================
LOAD THREE
==================================================
*/

async function loadThree() {

    if (THREE) {
        return;
    }


    const threeModule =
        await import(
            "https://cdn.jsdelivr.net/npm/three@0.180.0/+esm"
        );


    THREE =
        threeModule;


    const loaderModule =
        await import(
            "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js/+esm"
        );


    initThree(
        loaderModule.GLTFLoader
    );

}


/*
==================================================
THREE INIT
==================================================
*/

function initThree(
    GLTFLoader
) {

    scene =
        new THREE.Scene();


    renderer =
        new THREE.WebGLRenderer({

            alpha: true,

            antialias: true,

            canvas:
                document.createElement(
                    "canvas"
                )

        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.xr.enabled =
        true;


    document.body.appendChild(
        renderer.domElement
    );


    renderer.domElement.style.position =
        "absolute";

    renderer.domElement.style.inset =
        "0";

    renderer.domElement.style.zIndex =
        "2";

    renderer.domElement.style.pointerEvents =
        "none";


    /*
    LIGHT
    */

    const light =
        new THREE.HemisphereLight(
            0xffffff,
            0x444444,
            2
        );


    scene.add(
        light
    );


    /*
    CAMERA
    */

    xrCamera =
        new THREE.PerspectiveCamera(
            70,
            window.innerWidth /
            window.innerHeight,
            0.01,
            100
        );


    scene.add(
        xrCamera
    );


    /*
    LOAD CREATURE
    */

    const loader =
        new GLTFLoader();


    loader.load(

        "./models/creature.glb",

        function(gltf) {

            model =
                gltf.scene;


            /*
            Масштаб можно изменить
            после первой проверки.
            */

            model.scale.set(
                0.5,
                0.5,
                0.5
            );


            model.visible =
                false;


            scene.add(
                model
            );


            modelLoaded =
                true;


            arStatus.textContent =
                "CREATURE ГОТОВ";


            console.log(
                "creature.glb loaded"
            );

        },

        undefined,

        function(error) {

            console.error(
                "GLB:",
                error
            );


            arStatus.textContent =
                "ОШИБКА GLB";

        }

    );

}


/*
==================================================
START WEBXR
==================================================
*/

async function startAR() {

    if (
        !navigator.xr
    ) {

        arStatus.textContent =
            "AR НЕ ДОСТУПЕН";

        return;
    }


    try {

        /*
        Настоящий immersive AR
        */

        xrSession =
            await navigator.xr
                .requestSession(

                    "immersive-ar",

                    {

                        requiredFeatures: [
                            "local-floor",
                            "hit-test"
                        ],

                        optionalFeatures: [
                            "anchors",
                            "dom-overlay"
                        ],

                        domOverlay: {
                            root: ar
                        }

                    }

                );


        /*
        WebXR теперь управляет
        камерой и tracking.
        */

        await renderer.xr
            .setSession(
                xrSession
            );


        referenceSpace =
            await xrSession
                .requestReferenceSpace(
                    "local-floor"
                );


        viewerSpace =
            await xrSession
                .requestReferenceSpace(
                    "viewer"
                );


        hitTestSource =
            await xrSession
                .requestHitTestSource({

                    space:
                        viewerSpace

                });


        arStatus.textContent =
            "НАВЕДИТЕ НА ПОЛ";


        placeButton.style.display =
            "block";


        renderer.setAnimationLoop(
            renderAR
        );


        xrSession.addEventListener(
            "end",
            function() {

                xrSession =
                    null;

                hitTestSource =
                    null;

                referenceSpace =
                    null;

                viewerSpace =
                    null;

            }
        );


    } catch (error) {

        console.error(
            "WebXR:",
            error
        );


        arStatus.textContent =
            "AR НЕДОСТУПЕН";

    }

}


/*
==================================================
AR FRAME
==================================================
*/

function renderAR(
    time,
    frame
) {

    if (
        !frame ||
        !referenceSpace
    ) {
        return;
    }


    /*
    HIT TEST
    */

    if (
        hitTestSource &&
        !modelPlaced
    ) {

        const results =
            frame.getHitTestResults(
                hitTestSource
            );


        if (
            results.length > 0
        ) {

            currentHit =
                results[0];


            arStatus.textContent =
                "ПОВЕРХНОСТЬ НАЙДЕНА";

        } else {

            currentHit =
                null;


            arStatus.textContent =
                "НАВЕДИТЕ НА ПОЛ";

        }

    }


    /*
    ANCHORED MODEL
    */

    if (
        anchor &&
        model
    ) {

        const pose =
            frame.getPose(

                anchor.anchorSpace,

                referenceSpace

            );


        if (pose) {

            model.matrix
                .fromArray(
                    pose.transform.matrix
                );


            model.matrix
                .decompose(

                    model.position,

                    model.quaternion,

                    model.scale

                );

        }

    }


    renderer.render(
        scene,
        xrCamera
    );

}


/*
==================================================
PLACE MODEL
==================================================
*/

placeButton.addEventListener(
    "click",
    placeModel
);


async function placeModel() {

    if (
        !modelLoaded
    ) {

        arStatus.textContent =
            "МОДЕЛЬ ЕЩЁ ЗАГРУЖАЕТСЯ";

        return;
    }


    if (
        !currentHit
    ) {

        arStatus.textContent =
            "СНАЧАЛА НАЙДИТЕ ПОВЕРХНОСТЬ";

        return;
    }


    /*
    Получаем положение
    поверхности.
    */

    const pose =
        currentHit.getPose(
            referenceSpace
        );


    if (!pose) {
        return;
    }


    /*
    Создаём anchor.
    */

    if (
        typeof currentHit.createAnchor ===
        "function"
    ) {

        try {

            anchor =
                await currentHit
                    .createAnchor();

        } catch (error) {

            console.log(
                "Anchor unavailable:",
                error
            );

            anchor =
                null;

        }

    }


    /*
    Если anchor создан —
    объект будет следовать
    за этой мировой точкой.
    */

    if (anchor) {

        model.visible =
            true;


        modelPlaced =
            true;


        placeButton.style.display =
            "none";


        arStatus.textContent =
            "CREATURE ЗАКРЕПЛЁН";


        return;
    }


    /*
    Fallback без Anchor.
    */

    model.matrix
        .fromArray(
            pose.transform.matrix
        );


    model.matrix
        .decompose(

            model.position,

            model.quaternion,

            model.scale

        );


    model.visible =
        true;


    modelPlaced =
        true;


    placeButton.style.display =
        "none";


    arStatus.textContent =
        "CREATURE РАЗМЕЩЁН";

}


/*
==================================================
CLOSE
==================================================
*/

closeButton.addEventListener(
    "click",
    stopAR
);


async function stopAR() {

    if (
        anchor
    ) {

        try {

            anchor.delete();

        } catch (_) {}

        anchor =
            null;
    }


    if (
        xrSession
    ) {

        try {

            await xrSession.end();

        } catch (_) {}

    }


    if (
        cameraStream
    ) {

        cameraStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );


        cameraStream =
            null;
    }


    try {

        tg?.DeviceOrientation?.stop();

        tg?.Gyroscope?.stop();

        tg?.Accelerometer?.stop();

        tg?.unlockOrientation();

    } catch (_) {}


    renderer?.setAnimationLoop(
        null
    );


    camera.srcObject =
        null;


    camera.style.display =
        "none";


    ar.style.display =
        "none";


    start.style.display =
        "flex";


    startButton.disabled =
        false;


    startStatus.textContent =
        "Готово";


    modelPlaced =
        false;


    currentHit =
        null;


    if (model) {

        model.visible =
            false;
    }

}

</script>

</body>

</html>
