/* =============================================================
   CONFIG
============================================================= */

const TON_MANIFEST =
    "https://roman22022000.github.io/Ton_site/tonconnect-manifest.json";


const REQUIRED_COLLECTION =
    "EQD9mm3hx-QvHyNG18gDaaJtSTTQTVVYVj6zhonXocj2eyI";


const REQUIRED_COLLECTION_RAW =
    "0:fd9a6de1c7e42f1d8346d7c80369a26d4934d04d5558563eb38689d7a1c8f6";


const GENERATION_API =
    "https://api.araicameragame.party/api/generation";


const MODEL_BASE =
    "https://raw.githubusercontent.com/Roman22022000/ArGameCam/main/models/";


/* =============================================================
   DOM
============================================================= */

const authScreen =
    document.getElementById("authScreen");

const homeScreen =
    document.getElementById("homeScreen");

const galleryScreen =
    document.getElementById("galleryScreen");

const viewerScreen =
    document.getElementById("viewerScreen");

const generationScreen =
    document.getElementById("generationScreen");


const connectWallet =
    document.getElementById("connectWallet");

const authStatus =
    document.getElementById("authStatus");

const walletInfo =
    document.getElementById("walletInfo");


const galleryGrid =
    document.getElementById("galleryGrid");


const viewerCanvas =
    document.getElementById("viewerCanvas");

const viewerNumber =
    document.getElementById("viewerNumber");


const generationCode =
    document.getElementById("generationCode");

const generationSubmit =
    document.getElementById("generationSubmit");

const generationStatus =
    document.getElementById("generationStatus");


const loading =
    document.getElementById("loading");


/* =============================================================
   SCREEN
============================================================= */

function showScreen(screen) {

    document
        .querySelectorAll(".screen")
        .forEach(element => {
            element.classList.remove("active");
        });

    screen.classList.add("active");
}


/* =============================================================
   TON CONNECT
============================================================= */

if (!window.TON_CONNECT_UI) {

    authStatus.textContent =
        "TON Connect не загрузился";

    throw new Error(
        "TON_CONNECT_UI not loaded"
    );
}


const tonConnectUI =
    new TON_CONNECT_UI.TonConnectUI({

        manifestUrl:
            TON_MANIFEST,

        buttonRootId:
            null,

        restoreConnection:
            true

    });


/*
    Важно:

    uiOptions является setter.
    Поэтому присваиваем объект целиком.
*/

tonConnectUI.uiOptions = {

    language: "ru",

    uiPreferences: {
        theme:
            "DARK",

        borderRadius:
            "none"
    }

};


/*
    Наша кнопка открывает
    официальное TON Connect окно.

    Именно внутри этого окна
    TON Connect показывает QR-код
    на desktop.
*/

connectWallet.addEventListener(
    "click",
    async () => {

        try {

            await tonConnectUI.openModal();

        } catch (error) {

            console.error(
                "TON Connect:",
                error
            );

            authStatus.textContent =
                "Ошибка открытия TON Connect";

        }

    }
);


/* =============================================================
   TON ADDRESS
============================================================= */

function base64UrlToBytes(value) {

    let normalized =
        String(value)
            .replace(/-/g, "+")
            .replace(/_/g, "/");


    while (
        normalized.length % 4 !== 0
    ) {

        normalized += "=";

    }


    const binary =
        atob(normalized);


    const bytes =
        new Uint8Array(
            binary.length
        );


    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(i);

    }


    return bytes;

}


function normalizeTonAddress(address) {

    if (!address) {
        return "";
    }


    address =
        String(address).trim();


    /*
        Уже raw:
        0:64hex
    */

    if (
        /^-?\d+:[0-9a-fA-F]{64}$/
            .test(address)
    ) {

        const parts =
            address.split(":");


        return (
            parts[0] +
            ":" +
            parts[1].toLowerCase()
        );

    }


    /*
        Friendly:
        EQ...
        UQ...
    */

    try {

        const bytes =
            base64UrlToBytes(
                address
            );


        if (
            bytes.length !== 36
        ) {

            return address.toLowerCase();

        }


        let workchain =
            bytes[1];


        if (
            workchain === 255
        ) {

            workchain = -1;

        }


        let hash = "";


        for (
            let i = 2;
            i < 34;
            i++
        ) {

            hash +=
                bytes[i]
                    .toString(16)
                    .padStart(2, "0");

        }


        return (
            workchain +
            ":" +
            hash.toLowerCase()
        );

    } catch {

        return address.toLowerCase();

    }

}


const normalizedRequiredCollection =
    normalizeTonAddress(
        REQUIRED_COLLECTION
    );


/* =============================================================
   NFT CHECK
============================================================= */

async function checkCollectionNFT(
    walletAddress
) {

    const url =
        "https://tonapi.io/v2/accounts/" +
        encodeURIComponent(
            walletAddress
        ) +
        "/nfts?limit=1000";


    const response =
        await fetch(url, {

            method: "GET",

            headers: {
                "Accept":
                    "application/json"
            }

        });


    if (!response.ok) {

        throw new Error(
            "TonAPI HTTP " +
            response.status
        );

    }


    const data =
        await response.json();


    const nftItems =
        Array.isArray(
            data.nft_items
        )
            ? data.nft_items
            : [];


    for (
        const nft of nftItems
    ) {

        const collectionAddress =
            nft.collection?.address ||
            nft.collection_address ||
            "";


        if (!collectionAddress) {
            continue;
        }


        const normalized =
            normalizeTonAddress(
                collectionAddress
            );


        if (
            normalized ===
                normalizedRequiredCollection
            ||
            normalized ===
                REQUIRED_COLLECTION_RAW
        ) {

            return true;

        }

    }


    return false;

}


/* =============================================================
   WALLET
============================================================= */

let currentWallet =
    null;

let accessGranted =
    false;

let checkingNFT =
    false;


async function processWallet(
    wallet
) {

    if (!wallet) {

        currentWallet =
            null;

        accessGranted =
            false;

        walletInfo.textContent =
            "";

        authStatus.textContent =
            "Подключите TON-кошелёк";

        showScreen(
            authScreen
        );

        return;

    }


    if (
        checkingNFT
    ) {

        return;

    }


    if (
        !wallet.account ||
        !wallet.account.address
    ) {

        return;

    }


    currentWallet =
        wallet.account.address;


    accessGranted =
        false;

    checkingNFT =
        true;


    authStatus.textContent =
        "Проверка NFT...";


    loading.classList.add(
        "active"
    );


    try {

        const hasNFT =
            await checkCollectionNFT(
                currentWallet
            );


        if (!hasNFT) {

            accessGranted =
                false;


            authStatus.textContent =
                "NFT нужной коллекции не найден";


            showScreen(
                authScreen
            );


            return;

        }


        accessGranted =
            true;


        walletInfo.textContent =
            currentWallet;


        authStatus.textContent =
            "Доступ разрешён";


        showScreen(
            homeScreen
        );


    } catch (error) {

        console.error(
            "NFT CHECK ERROR:",
            error
        );


        accessGranted =
            false;


        authStatus.textContent =
            "Ошибка проверки NFT";


        showScreen(
            authScreen
        );


    } finally {

        checkingNFT =
            false;


        loading.classList.remove(
            "active"
        );

    }

}


/*
    Срабатывает после:

    - подключения
    - отключения
    - восстановления сессии
*/

tonConnectUI.onStatusChange(
    async wallet => {

        await processWallet(
            wallet
        );

    },
    error => {

        console.error(
            "TON Connect error:",
            error
        );

        authStatus.textContent =
            "Ошибка TON Connect";

    }
);


/* =============================================================
   ACCESS
============================================================= */

function requireAccess() {

    if (
        !accessGranted ||
        !currentWallet
    ) {

        showScreen(
            authScreen
        );

        authStatus.textContent =
            "Доступ закрыт";

        return false;

    }


    return true;

}


/* =============================================================
   MENU
============================================================= */

document
    .getElementById("openGallery")
    .addEventListener(
        "click",
        () => {

            if (
                !requireAccess()
            ) {
                return;
            }


            showScreen(
                galleryScreen
            );

        }
    );


document
    .getElementById("openGeneration")
    .addEventListener(
        "click",
        () => {

            if (
                !requireAccess()
            ) {
                return;
            }


            generationCode.value =
                "";

            generationStatus.textContent =
                "";

            generationSubmit.disabled =
                true;


            showScreen(
                generationScreen
            );


            setTimeout(
                () => {

                    generationCode.focus();

                },
                100
            );

        }
    );


/* =============================================================
   GENERATION INPUT
============================================================= */

generationCode.addEventListener(
    "input",
    () => {

        generationCode.value =
            generationCode.value
                .replace(/\D/g, "")
                .slice(0, 5);


        generationSubmit.disabled =
            generationCode.value.length !== 5;

    }
);


/* =============================================================
   GENERATION SEND
============================================================= */

generationSubmit.addEventListener(
    "click",
    async () => {

        if (
            !requireAccess()
        ) {
            return;
        }


        const code =
            generationCode.value.trim();


        if (
            !/^\d{5}$/.test(code)
        ) {

            generationStatus.textContent =
                "Введите 5 цифр";

            return;

        }


        if (!currentWallet) {

            generationStatus.textContent =
                "Кошелёк не подключён";

            return;

        }


        generationSubmit.disabled =
            true;


        generationStatus.textContent =
            "Отправка...";


        try {

            const response =
                await fetch(
                    GENERATION_API,
                    {

                        method:
                            "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                code:
                                    code,

                                wallet:
                                    currentWallet

                            })

                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                data.success !== true
            ) {

                throw new Error(
                    data.error ||
                    "Ошибка сервера"
                );

            }


            generationStatus.textContent =
                "Данные отправлены";


            generationCode.value =
                "";


        } catch (error) {

            console.error(
                "GENERATION ERROR:",
                error
            );


            generationStatus.textContent =
                "Ошибка отправки";


        } finally {

            generationSubmit.disabled =
                true;

        }

    }
);

   BACK
============================================================= */

document

document

generationBack.style.top =

generationBack.style.left =

    "40px";

generationBack.style.height =
    "40px";

generationBack.style.background =

generationBack.style.color =

generationBack.style.border =

generationBack.style.fontSize =

generationScreen.appendChild(

generationBack.addEventListener(

const galleryItems = [

    },

    {
        number: 2,
        filename: "creature.glb"
    },

    {
        number: 3,

    }

];


/* =============================================================
   GALLERY
============================================================= */

function buildGallery() {

    galleryGrid.innerHTML =
        "";


    galleryItems.forEach(
        (item, index) => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "galleryItem";


            button.type =
                "button";


            button.textContent =
                item.number;


            button.addEventListener(
                "click",
                () => {

                    openViewer(
                        index
                    );

                }
            );


            galleryGrid.appendChild(
                button
            );

        }
    );

}


buildGallery();


/* =============================================================
   THREE.JS VIEWER
============================================================= */

let scene =
    null;

let camera =
    null;

let renderer =
    null;

let controls =
    null;

let model =
    null;


const loader =
    new GLTFLoader();


function initViewer() {

    if (renderer) {
        return;
    }


    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0x000000
        );


    camera =
        new THREE.PerspectiveCamera(
            45,
            window.innerWidth /
                window.innerHeight,
            0.01,
            1000
        );


    camera.position.set(
        0,
        0.3,
        3
    );


    renderer =
        new THREE.WebGLRenderer({

            antialias:
                true,

            alpha:
                false

        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    viewerCanvas.appendChild(
        renderer.domElement
    );


    controls =
        new OrbitControls(
            camera,
            renderer.domElement
        );


    controls.enableDamping =
        true;

    controls.enablePan =
        true;

    controls.minDistance =
        0.5;

    controls.maxDistance =
        20;


    const ambient =
        new THREE.AmbientLight(
            0xffffff,
            2
        );


    scene.add(
        ambient
    );


    const light =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );


    light.position.set(
        4,
        5,
        4
    );


    scene.add(
        light
    );


    window.addEventListener(
        "resize",
        resizeViewer
    );


    animateViewer();

}


function resizeViewer() {

    if (
        !camera ||
        !renderer
    ) {

        return;

    }


    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}


function animateViewer() {

    requestAnimationFrame(
        animateViewer
    );


    if (controls) {
        controls.update();
    }


    if (
        renderer &&
        scene &&
        camera
    ) {

        renderer.render(
            scene,
            camera
        );

    }

}


/* =============================================================
   OPEN MODEL
============================================================= */

function openViewer(index) {

    if (
        !requireAccess()
    ) {
        return;
    }


    const item =
        galleryItems[index];


    if (!item) {
        return;
    }


    viewerNumber.textContent =
        item.number;


    showScreen(
        viewerScreen
    );


    initViewer();


    if (model) {

        scene.remove(
            model
        );


        model.traverse(
            object => {

                if (
                    object.geometry
                ) {

                    object.geometry.dispose();

                }


                if (
                    object.material
                ) {

                    if (
                        Array.isArray(
                            object.material
                        )
                    ) {

                        object.material
                            .forEach(
                                material => {

                                    material.dispose();

                                }
                            );

                    } else {

                        object.material.dispose();

                    }

                }

            }
        );


        model =
            null;

    }


    const url =
        MODEL_BASE +
        encodeURIComponent(
            item.filename
        );


    loader.load(

        url,

        gltf => {

            model =
                gltf.scene;


            const box =
                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            const center =
                box.getCenter(
                    new THREE.Vector3()
                );


            const size =
                box.getSize(
                    new THREE.Vector3()
                );


            model.position.sub(
                center
            );


            const maxSize =
                Math.max(
                    size.x,
                    size.y,
                    size.z
                );


            if (
                maxSize > 0
            ) {

                model.scale.setScalar(
                    2 / maxSize
                );

            }


            scene.add(
                model
            );


            controls.target.set(
                0,
                0,
                0
            );


            controls.update();

        },

        undefined,

        error => {

            console.error(
                "MODEL ERROR:",
                error
            );

        }

    );

}
