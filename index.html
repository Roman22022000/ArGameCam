button,

.screen.active {

/* AUTH */

}

}

.connectButton {

}

.connectButton:hover {

}

/* HOME */

#homeScreen {

}

.menu {

}

.archiveGrid {

<script type="module">

import * as THREE from "three";

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";


/* =========================================================
   CONFIG
========================================================= */

const TON_MANIFEST =
    "https://roman22022000.github.io/Ton_site/tonconnect-manifest.json";

const REQUIRED_COLLECTION =
    "EQD9mm3hx-QvHyNG18gDaaJtSTTQTVVYVjJ6zhonXocj2eyI";

const REQUIRED_COLLECTION_RAW =
    "0:fd9a6de1c7e42f1d8346d7c80369a26d4934d04d5558563eb38689d7a1c8f6";

const GENERATION_API =
    "https://api.araicameragame.party/api/generation";

const ARCHIVE_API =
    "https://api.araicameragame.party/api/models";

const MODEL_BASE =
    "https://raw.githubusercontent.com/Roman22022000/ArGameCam/main/models/";


/* =========================================================
   SCENE SIZE
========================================================= */

const SCENE_WIDTH  = 4;
const SCENE_LENGTH = 7;
const SCENE_HEIGHT = 4;

const HALF_WIDTH =
    SCENE_WIDTH / 2;

const HALF_LENGTH =
    SCENE_LENGTH / 2;


/*
    Отступ камеры от стен.
*/

const CAMERA_MARGIN = 0.25;


/*
    Ограничение движения камеры.
*/

const MIN_CAMERA_X =
    -HALF_WIDTH + CAMERA_MARGIN;

const MAX_CAMERA_X =
    HALF_WIDTH - CAMERA_MARGIN;

const MIN_CAMERA_Z =
    -HALF_LENGTH + CAMERA_MARGIN;

const MAX_CAMERA_Z =
    HALF_LENGTH - CAMERA_MARGIN;

const MIN_CAMERA_Y =
    0.35;

const MAX_CAMERA_Y =
    SCENE_HEIGHT - 0.35;


/* =========================================================
   DOM
========================================================= */

const authScreen =
    document.getElementById("authScreen");

const homeScreen =
    document.getElementById("homeScreen");

const galleryScreen =
    document.getElementById("galleryScreen");

const viewerScreen =
    document.getElementById("viewerScreen");

const generationScreen =
    document.getElementById("generationScreen");

const userScreen =
    document.getElementById("userScreen");

const archiveScreen =
    document.getElementById("archiveScreen");

const connectWallet =
    document.getElementById("connectWallet");

const authStatus =
    document.getElementById("authStatus");

const userWalletAddress =
    document.getElementById("userWalletAddress");

const disconnectWallet =
    document.getElementById("disconnectWallet");

const userStatus =
    document.getElementById("userStatus");

const galleryGrid =
    document.getElementById("galleryGrid");

const archiveGrid =
    document.getElementById("archiveGrid");

const archiveStatus =
    document.getElementById("archiveStatus");

const viewerCanvas =
    document.getElementById("viewerCanvas");

const viewerNumber =
    document.getElementById("viewerNumber");

const generationCode =
    document.getElementById("generationCode");

const generationSubmit =
    document.getElementById("generationSubmit");

const generationStatus =
    document.getElementById("generationStatus");

const loading =
    document.getElementById("loading");


/* =========================================================
   SCREEN
========================================================= */

function showScreen(screen) {

    document
        .querySelectorAll(".screen")
        .forEach(element => {
            element.classList.remove("active");
        });

    screen.classList.add("active");
}


/* =========================================================
   TON CONNECT
========================================================= */

if (!window.TON_CONNECT_UI) {

    authStatus.textContent =
        "TON Connect не загрузился";

    throw new Error(
        "TON_CONNECT_UI not loaded"
    );

}

const tonConnectUI =
    new TON_CONNECT_UI.TonConnectUI({

        manifestUrl:
            TON_MANIFEST,

        buttonRootId:
            null,

        restoreConnection:
            true

    });


tonConnectUI.uiOptions = {

    language:
        "ru",

    uiPreferences: {

        theme:
            "DARK",

        borderRadius:
            "none"

    }

};


connectWallet.addEventListener(
    "click",
    async () => {

        try {

            await tonConnectUI.openModal();

        } catch (error) {

            console.error(
                "TON Connect:",
                error
            );

            authStatus.textContent =
                "Ошибка открытия TON Connect";

        }

    }
);


/* =========================================================
   TON ADDRESS
========================================================= */

function base64UrlToBytes(value) {

    let normalized =
        String(value)
            .replace(/-/g, "+")
            .replace(/_/g, "/");

    while (
        normalized.length % 4 !== 0
    ) {
        normalized += "=";
    }

    const binary =
        atob(normalized);

    const bytes =
        new Uint8Array(
            binary.length
        );

    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(i);

    }

    return bytes;
}


function normalizeTonAddress(address) {

    if (!address) {
        return "";
    }

    address =
        String(address).trim();

    if (
        /^-?\d+:[0-9a-fA-F]{64}$/
            .test(address)
    ) {

        const parts =
            address.split(":");

        return (
            parts[0] +
            ":" +
            parts[1].toLowerCase()
        );

    }

    try {

        const bytes =
            base64UrlToBytes(
                address
            );

        if (
            bytes.length !== 36
        ) {

            return address.toLowerCase();

        }

        let workchain =
            bytes[1];

        if (
            workchain === 255
        ) {

            workchain = -1;

        }

        let hash = "";

        for (
            let i = 2;
            i < 34;
            i++
        ) {

            hash +=
                bytes[i]
                    .toString(16)
                    .padStart(2, "0");

        }

        return (
            workchain +
            ":" +
            hash.toLowerCase()
        );

    } catch {

        return address.toLowerCase();

    }

}


const normalizedRequiredCollection =
    normalizeTonAddress(
        REQUIRED_COLLECTION
    );


/* =========================================================
   NFT
========================================================= */

async function checkCollectionNFT(
    walletAddress
) {

    const url =
        "https://tonapi.io/v2/accounts/" +
        encodeURIComponent(
            walletAddress
        ) +
        "/nfts?limit=1000";

    const response =
        await fetch(url, {

            method:
                "GET",

            headers: {
                "Accept":
                    "application/json"
            }

        });

    if (!response.ok) {

        throw new Error(
            "TonAPI HTTP " +
            response.status
        );

    }

    const data =
        await response.json();

    const nftItems =
        Array.isArray(
            data.nft_items
        )
            ? data.nft_items
            : [];

    for (
        const nft of nftItems
    ) {

        const collectionAddress =
            nft.collection?.address ||
            nft.collection_address ||
            "";

        if (!collectionAddress) {
            continue;
        }

        const normalized =
            normalizeTonAddress(
                collectionAddress
            );

        if (
            normalized ===
            normalizedRequiredCollection
            ||
            normalized ===
            REQUIRED_COLLECTION_RAW
        ) {

            return true;

        }

    }

    return false;
}


/* =========================================================
   WALLET
========================================================= */

let currentWallet =
    null;

let accessGranted =
    false;

let checkingNFT =
    false;


async function processWallet(
    wallet
) {

    if (!wallet) {

        currentWallet =
            null;

        accessGranted =
            false;

        userWalletAddress.textContent =
            "";

        userStatus.textContent =
            "";

        authStatus.textContent =
            "Подключите TON-кошелёк";

        showScreen(
            authScreen
        );

        return;

    }

    if (checkingNFT) {
        return;
    }

    if (
        !wallet.account ||
        !wallet.account.address
    ) {
        return;
    }

    currentWallet =
        wallet.account.address;

    accessGranted =
        false;

    checkingNFT =
        true;

    authStatus.textContent =
        "Проверка NFT...";

    loading.classList.add(
        "active"
    );

    try {

        const hasNFT =
            await checkCollectionNFT(
                currentWallet
            );

        if (!hasNFT) {

            accessGranted =
                false;

            authStatus.textContent =
                "NFT нужной коллекции не найден";

            showScreen(
                authScreen
            );

            return;
        }

        accessGranted =
            true;

        userWalletAddress.textContent =
            currentWallet;

        authStatus.textContent =
            "Доступ разрешён";

        showScreen(
            homeScreen
        );

    } catch (error) {

        console.error(
            "NFT CHECK ERROR:",
            error
        );

        accessGranted =
            false;

        authStatus.textContent =
            "Ошибка проверки NFT";

        showScreen(
            authScreen
        );

    } finally {

        checkingNFT =
            false;

        loading.classList.remove(
            "active"
        );

    }

}


tonConnectUI.onStatusChange(
    async wallet => {

        await processWallet(
            wallet
        );

    },
    error => {

        console.error(
            "TON Connect error:",
            error
        );

        authStatus.textContent =
            "Ошибка TON Connect";

    }
);


/* =========================================================
   ACCESS
========================================================= */

function requireAccess() {

    if (
        !accessGranted ||
        !currentWallet
    ) {

        showScreen(
            authScreen
        );

        authStatus.textContent =
            "Доступ закрыт";

        return false;

    }

    return true;
}


/* =========================================================
   MENU
========================================================= */

document
    .getElementById("openGallery")
    .addEventListener(
        "click",
        () => {

            if (!requireAccess()) {
                return;
            }

            showScreen(
                galleryScreen
            );

        }
    );


document
    .getElementById("openArchive")
    .addEventListener(
        "click",
        async () => {

            if (!requireAccess()) {
                return;
            }

            showScreen(
                archiveScreen
            );

            await loadArchiveModels();

        }

document

   GENERATION
========================================================= */

generationCode.addEventListener(
    "input",
    () => {

        generationCode.value =
            generationCode.value
                .replace(/\D/g, "")
                .slice(0, 5);

        generationSubmit.disabled =
            generationCode.value.length !== 5;

    }
);


generationSubmit.addEventListener(
    "click",
    async () => {

        if (!requireAccess()) {
            return;
        }

        const code =
            generationCode.value.trim();

        if (
            !/^\d{5}$/.test(code)
        ) {

            generationStatus.textContent =
                "Введите 5 цифр";

            return;
        }

        if (!currentWallet) {

            generationStatus.textContent =
                "Кошелёк не подключён";

            return;
        }

        generationSubmit.disabled =
            true;

        generationStatus.textContent =
            "Отправка...";

        try {

            const response =
                await fetch(
                    GENERATION_API,
                    {

                        method:
                            "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                code:
                                    code,

                                wallet:
                                    currentWallet

                            })

                    }
                );

            const data =
                await response.json();

            if (
                !response.ok ||
                data.success !== true
            ) {

                throw new Error(
                    data.error ||
                    "Ошибка сервера"
                );

            }

            generationStatus.textContent =
                "Данные отправлены";

            generationCode.value =
                "";

        } catch (error) {

            console.error(
                "GENERATION ERROR:",
                error
            );

            generationStatus.textContent =
                "Ошибка отправки";

        } finally {

            generationSubmit.disabled =
                true;

        }

    }
);

   ARCHIVE

let archiveModels = [];


async function loadArchiveModels() {

    archiveStatus.textContent =
        "Загрузка 3D моделей...";

    archiveGrid.innerHTML =
        "";

    try {

        const response =
            await fetch(
                ARCHIVE_API,
                {
                    method:
                        "GET",

                    cache:
                        "no-store"
                }
            );

        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }

        const data =
            await response.json();

        archiveModels =
            Array.isArray(data.items)
                ? data.items
                : [];

        if (!archiveModels.length) {

            archiveStatus.textContent =
                "В архиве пока нет 3D моделей.";

            return;
        }

        archiveStatus.textContent =
            "Моделей: " +
            archiveModels.length;

        archiveModels.forEach(
            (item, index) => {

                const button =
                    document.createElement(
                        "button"
                    );

                button.type =
                    "button";

                button.className =
                    "archiveItem";

                const preview =
                    document.createElement(
                        "div"
                    );

                preview.className =
                    "archivePlaceholder";

                preview.textContent =
                    "3D";

                button.appendChild(
                    preview
                );

                const info =
                    document.createElement(
                        "div"
                    );

                info.className =
                    "archiveInfo";

                const name =
                    document.createElement(
                        "div"
                    );

                name.className =
                    "archiveName";

                name.textContent =
                    item.filename ||
                    "model";

                const folder =
                    document.createElement(
                        "div"
                    );

                folder.className =
                    "archiveFolder";

                folder.textContent =
                    (
                        item.folder ||
                        ""
                    ).toUpperCase();

                info.appendChild(
                    name
                );

                info.appendChild(
                    folder
                );

                button.appendChild(
                    info
                );

                /*
                    ГЛАВНОЕ:
                    любое нажатие открывает
                    именно выбранный файл.
                */

                button.addEventListener(
                    "click",
                    () => {

                        openArchiveViewer(
                            index
                        );

                    }
                );

                archiveGrid.appendChild(
                    button
                );

            }
        );

    } catch (error) {

        console.error(
            "ARCHIVE ERROR:",
            error
        );

        archiveStatus.textContent =
            "Не удалось получить архив.";

    }

}


/* =========================================================
   OPEN ARCHIVE MODEL
========================================================= */

function openArchiveViewer(index) {

    viewerOpenedFromArchive =
        true;

    if (!requireAccess()) {
        return;
    }

    const item =
        archiveModels[index];

    if (!item) {
        return;
    }

    viewerNumber.textContent =
        item.filename || "3D";

    showScreen(
        viewerScreen
    );

    initViewer();

    clearCurrentModel();

    /*
        API может отдавать полный URL.
        Если URL отсутствует —
        строим URL из имени файла.
    */

    let url =
        item.url ||
        item.model_url ||
        item.path ||
        "";

    if (!url) {

        url =
            MODEL_BASE +
            encodeURIComponent(
                item.filename
            );

    }

    loadModel(
        url
    );

}

/* =========================================================
   THREE.JS
========================================================= */

let scene =
    null;

let camera =
    null;

let renderer =
    null;

let model =
    null;

let viewerOpenedFromArchive =
    false;

let animationStarted =
    false;


/* =========================================================
   TOUCH CONTROL
========================================================= */

let touchState = {

    active:
        false,

    lastX:
        0,

    lastY:
        0,

    twoFinger:
        false,

    lastDistance:
        0

};


/*
    Скорость движения камеры.
*/

const TOUCH_MOVE_SPEED =
    0.008;


/*
    Ограничиваем высоту
    камеры внутри комнаты.
*/

function clampCamera() {

    if (!camera) {
        return;
    }

    camera.position.x =
        THREE.MathUtils.clamp(
            camera.position.x,
            MIN_CAMERA_X,
            MAX_CAMERA_X
        );

    camera.position.z =
        THREE.MathUtils.clamp(
            camera.position.z,
            MIN_CAMERA_Z,
            MAX_CAMERA_Z
        );

    camera.position.y =
        THREE.MathUtils.clamp(
            camera.position.y,
            MIN_CAMERA_Y,
            MAX_CAMERA_Y
        );

}


/* =========================================================
   ROOM
========================================================= */

function createRoom() {

    /*
        Пол
    */

    const floorGeometry =
        new THREE.PlaneGeometry(
            SCENE_WIDTH,
            SCENE_LENGTH
        );

    const floorMaterial =
        new THREE.MeshBasicMaterial({

            color:
                0x111111,

            side:
                THREE.DoubleSide

        });

    const floor =
        new THREE.Mesh(
            floorGeometry,
            floorMaterial
        );

    floor.rotation.x =
        -Math.PI / 2;

    floor.position.y =
        0;

    scene.add(
        floor
    );


    /*
        Потолок
    */

    const ceiling =
        floor.clone();

    ceiling.position.y =
        SCENE_HEIGHT;

    scene.add(
        ceiling
    );


    /*
        Материал стен.
    */

    const wallMaterial =
        new THREE.MeshBasicMaterial({

            color:
                0x181818,

            side:
                THREE.DoubleSide

        });


    /*
        Левая / правая стены.
    */

    const sideGeometry =
        new THREE.PlaneGeometry(
            SCENE_LENGTH,
            SCENE_HEIGHT
        );

    const leftWall =
        new THREE.Mesh(
            sideGeometry,
            wallMaterial
        );

    leftWall.rotation.y =
        Math.PI / 2;

    leftWall.position.set(
        -HALF_WIDTH,
        SCENE_HEIGHT / 2,
        0
    );

    scene.add(
        leftWall
    );


    const rightWall =
        leftWall.clone();

    rightWall.position.x =
        HALF_WIDTH;

    scene.add(
        rightWall
    );


    /*
        Передняя / задняя стены.
    */

    const frontGeometry =
        new THREE.PlaneGeometry(
            SCENE_WIDTH,
            SCENE_HEIGHT
        );

    const frontWall =
        new THREE.Mesh(
            frontGeometry,
            wallMaterial
        );

    frontWall.position.set(
        0,
        SCENE_HEIGHT / 2,
        -HALF_LENGTH
    );

    scene.add(
        frontWall
    );


    const backWall =
        frontWall.clone();

    backWall.position.z =
        HALF_LENGTH;

    scene.add(
        backWall
    );


    /*
        Контур помещения.
    */

    const edgesMaterial =
        new THREE.LineBasicMaterial({

            color:
                0x333333

        });


    const points = [

        new THREE.Vector3(
            -HALF_WIDTH,
            0,
            -HALF_LENGTH
        ),

        new THREE.Vector3(
            HALF_WIDTH,
            0,
            -HALF_LENGTH
        ),

        new THREE.Vector3(
            HALF_WIDTH,
            0,
            HALF_LENGTH
        ),

        new THREE.Vector3(
            -HALF_WIDTH,
            0,
            HALF_LENGTH
        ),

        new THREE.Vector3(
            -HALF_WIDTH,
            0,
            -HALF_LENGTH
        )

    ];

    const lineGeometry =
        new THREE.BufferGeometry()
            .setFromPoints(
                points
            );

    const line =
        new THREE.Line(
            lineGeometry,
            edgesMaterial
        );

    scene.add(
        line
    );

}


/* =========================================================
   VIEWER INIT
========================================================= */

function initViewer() {

    if (renderer) {
        return;
    }

    scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(
            0x000000
        );


    camera =
        new THREE.PerspectiveCamera(
            70,
            window.innerWidth /
            window.innerHeight,
            0.01,
            100
        );


    /*
        Начальная позиция камеры
        строго внутри 4 × 7 × 4.
    */

    camera.position.set(
        0,
        1.8,
        2.6
    );


    camera.rotation.set(
        0,
        0,
        0
    );


    renderer =
        new THREE.WebGLRenderer({

            antialias:
                true,

            alpha:
                false

        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    viewerCanvas.appendChild(
        renderer.domElement
    );


    /*
        Свет.
    */

    const ambient =
        new THREE.AmbientLight(
            0xffffff,
            2.5
        );

    scene.add(
        ambient
    );


    const light =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );

    light.position.set(
        2,
        4,
        2
    );

    scene.add(
        light
    );


    /*
        Создаём помещение.
    */

    createRoom();


    /*
        Touch.
    */

    renderer.domElement.addEventListener(
        "touchstart",
        onTouchStart,
        {
            passive: false
        }
    );

    renderer.domElement.addEventListener(
        "touchmove",
        onTouchMove,
        {
            passive: false
        }
    );

    renderer.domElement.addEventListener(
        "touchend",
        onTouchEnd,
        {
            passive: false
        }
    );


    window.addEventListener(
        "resize",
        resizeViewer
    );


    if (!animationStarted) {

        animationStarted =
            true;

        animateViewer();

    }

}


/* =========================================================
   TOUCH START
========================================================= */

function onTouchStart(event) {

    event.preventDefault();

    if (!camera) {
        return;
    }

    if (
        event.touches.length === 1
    ) {

        const touch =
            event.touches[0];

        touchState.active =
            true;

        touchState.twoFinger =
            false;

        touchState.lastX =
            touch.clientX;

        touchState.lastY =
            touch.clientY;

    }


    if (
        event.touches.length >= 2
    ) {

        touchState.active =
            false;

        touchState.twoFinger =
            true;

        const a =
            event.touches[0];

        const b =
            event.touches[1];

        touchState.lastDistance =
            Math.hypot(
                a.clientX - b.clientX,
                a.clientY - b.clientY
            );

    }

}


/* =========================================================
   TOUCH MOVE
========================================================= */

function onTouchMove(event) {

    event.preventDefault();

    if (!camera) {
        return;
    }


    /*
        Два пальца:
        zoom / движение вперёд-назад.
    */

    if (
        event.touches.length >= 2
    ) {

        const a =
            event.touches[0];

        const b =
            event.touches[1];

        const distance =
            Math.hypot(
                a.clientX - b.clientX,
                a.clientY - b.clientY
            );

        if (
            touchState.lastDistance > 0
        ) {

            const delta =
                distance -
                touchState.lastDistance;

            moveCameraForward(
                delta * 0.01
            );

        }

        touchState.lastDistance =
            distance;

        clampCamera();

        return;

    }


    /*
        Один палец:
        свободное перемещение
        по X/Z.
    */

    if (
        event.touches.length === 1 &&
        touchState.active
    ) {

        const touch =
            event.touches[0];

        const dx =
            touch.clientX -
            touchState.lastX;

        const dy =
            touch.clientY -
            touchState.lastY;


        /*
            Влево / вправо:
            движение по X.
        */

        camera.position.x -=
            dx * TOUCH_MOVE_SPEED;


        /*
            Вверх / вниз:
            движение по Z.
        */

        camera.position.z +=
            dy * TOUCH_MOVE_SPEED;


        clampCamera();


        touchState.lastX =
            touch.clientX;

        touchState.lastY =
            touch.clientY;

    }

}


/* =========================================================
   TOUCH END
========================================================= */

function onTouchEnd(event) {

    event.preventDefault();

    if (
        event.touches.length === 0
    ) {

        touchState.active =
            false;

        touchState.twoFinger =
            false;

        touchState.lastDistance =
            0;

    }

}


/* =========================================================
   CAMERA FORWARD
========================================================= */

function moveCameraForward(
    amount
) {

    if (!camera) {
        return;
    }


    /*
        Направление взгляда камеры.
    */

    const direction =
        new THREE.Vector3();

    camera.getWorldDirection(
        direction
    );


    /*
        Не позволяем уходить
        вверх/вниз через zoom.
    */

    direction.y =
        0;

    direction.normalize();


    camera.position.add(
        direction.multiplyScalar(
            amount
        )
    );


    clampCamera();

}


/* =========================================================
   RESIZE
========================================================= */

function resizeViewer() {

    if (
        !camera ||
        !renderer
    ) {
        return;
    }

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}


/* =========================================================
   ANIMATION
========================================================= */

function animateViewer() {

    requestAnimationFrame(
        animateViewer
    );

    if (
        renderer &&
        scene &&
        camera
    ) {

        clampCamera();

        renderer.render(
            scene,
            camera
        );

    }

}


/* =========================================================
   CLEAR MODEL
========================================================= */

function clearCurrentModel() {

    if (
        !model ||
        !scene
    ) {
        return;
    }


    scene.remove(
        model
    );


    model.traverse(
        object => {

            if (
                object.geometry
            ) {

                object.geometry.dispose();

            }


            if (
                object.material
            ) {

                if (
                    Array.isArray(
                        object.material
                    )
                ) {

                    object.material.forEach(
                        material => {

                            if (
                                material.map
                            ) {
                                material.map.dispose();
                            }

                            material.dispose();

                        }
                    );

                } else {

                    if (
                        object.material.map
                    ) {
                        object.material.map.dispose();
                    }

                    object.material.dispose();

                }

            }

        }
    );


    model =
        null;

}


/* =========================================================
   LOAD MODEL
========================================================= */

const loader =
    new GLTFLoader();


function loadModel(
    url
) {

    console.log(
        "Загрузка модели:",
        url
    );


    loader.load(

        url,

        gltf => {

            model =
                gltf.scene;


            /*
                Получаем размеры модели.
            */

            const box =
                new THREE.Box3()
                    .setFromObject(
                        model
                    );

            const center =
                box.getCenter(
                    new THREE.Vector3()
                );

            const size =
                box.getSize(
                    new THREE.Vector3()
                );


            /*
                Центрируем модель.
            */

            model.position.sub(
                center
            );


            /*
                Максимальный размер.
            */

            const maxSize =
                Math.max(
                    size.x,
                    size.y,
                    size.z
                );


            /*
                Модель занимает
                максимум 2.2 м.
            */

            if (
                maxSize > 0
            ) {

                model.scale.setScalar(
                    2.2 / maxSize
                );

            }


            /*
                Поднимаем модель
                немного над полом.
            */

            const modelBox =
                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            if (
                modelBox.min.y < 0
            ) {

                model.position.y +=
                    -modelBox.min.y;

            }


            /*
                Материалы / тени.
            */

            model.traverse(
                object => {

                    if (
                        object.isMesh
                    ) {

                        object.castShadow =
                            true;

                        object.receiveShadow =
                            true;

                    }

                }
            );


            scene.add(
                model
            );


            /*
                Камера всегда стартует
                внутри сцены.
            */

            camera.position.set(
                0,
                1.8,
                2.6
            );

            clampCamera();


            console.log(
                "3D модель открыта:",
                url
            );

        },

        undefined,

        error => {

            console.error(
                "MODEL ERROR:",
                error
            );

        }

    );

}


/* =========================================================
   OPEN GALLERY MODEL
========================================================= */

function openViewer(
    index
) {

    viewerOpenedFromArchive =
        false;

    if (!requireAccess()) {
        return;
    }

    const item =
        galleryItems[index];

    if (!item) {
        return;
    }

    viewerNumber.textContent =
        item.number;

    showScreen(
        viewerScreen
    );

    initViewer();

    clearCurrentModel();


    const url =
        MODEL_BASE +
        encodeURIComponent(
            item.filename
        );


    loadModel(
        url
    );

}
