<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <title>AR Gallery</title>

    <!-- TON CONNECT -->
    <script src="https://unpkg.com/@tonconnect/ui@3.0.0/dist/tonconnect-ui.min.js">
</script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;

            background: #000;
            color: #fff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        body {
            -webkit-font-smoothing: antialiased;
            overscroll-behavior: none;
        }

        #viewerScreen {
            touch-action: none;
            overflow: hidden;
            background: #000;
        }

        #viewerCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
        }

        #viewerCanvas canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .viewerHint {
            position: absolute;
            left: 50%;
            bottom: 92px;
            transform: translateX(-50%);
            width: min(92vw, 560px);
            padding: 10px 14px;
            background: rgba(0,0,0,.72);
            border: 1px solid #242424;
            color: #aaa;
            text-align: center;
            font-size: 11px;
            line-height: 1.4;
            pointer-events: none;
            z-index: 20;
            transition: opacity .4s ease;
        }

        .viewerControls {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 18px;
            pointer-events: none;
            z-index: 25;
        }

        .joystickZone,
        .lookZone {
            width: 112px;
            height: 112px;
            position: relative;
            pointer-events: auto;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .joystickBase {
            position: absolute;
            inset: 12px;
            border: 1px solid #444;
            background: rgba(8,8,8,.68);
            border-radius: 50%;
        }

        .joystickKnob {
            position: absolute;
            width: 44px;
            height: 44px;
            left: 50%;
            top: 50%;
            margin-left: -22px;
            margin-top: -22px;
            border: 1px solid #777;
            background: rgba(255,255,255,.12);
            border-radius: 50%;
            transform: translate3d(0,0,0);
        }

        .lookZone {
            border: 1px solid rgba(255,255,255,.12);
            background: rgba(8,8,8,.28);
            border-radius: 12px;
        }

        .lookLabel {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 10px;
            letter-spacing: .5px;
            pointer-events: none;
        }

        .viewerReset {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 40px;
            height: 40px;
            background: rgba(8,8,8,.82);
            color: #fff;
            border: 1px solid #242424;
            font-size: 20px;
            z-index: 30;
            pointer-events: auto;
        }

        .viewerStatus {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: min(88vw, 520px);
            padding: 14px 16px;
            background: rgba(0,0,0,.86);
            border: 1px solid #242424;
            color: #bbb;
            text-align: center;
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-line;
            z-index: 28;
            pointer-events: none;
        }

        @media (max-width: 700px) {
            .viewerControls {
                bottom: 14px;
                padding: 0 10px;
            }
            .joystickZone,
            .lookZone {
                width: 100px;
                height: 100px;
            }
            .viewerHint {
                bottom: 126px;
                font-size: 10px;
            }
        }

        @media (min-width: 701px) {
            .viewerControls {
                opacity: .55;
            }
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
            border: 0;
        }

        /* =========================================================
           SCREENS
        ========================================================= */

        .screen {
            position: fixed;
            inset: 0;

            display: none;

            width: 100%;
            height: 100%;

            background: #000;
        }

        .screen.active {
            display: flex;
        }


        /* =========================================================
           AUTH
        ========================================================= */

        #authScreen {
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .auth {
            width: 320px;
            max-width: 100%;

            text-align: center;
        }

        .authTitle {
            margin-bottom: 30px;

            font-size: 28px;
            font-weight: 500;
            letter-spacing: -0.5px;
        }

        /*
            Собственная кнопка.
            TON Connect modal открывается через openModal().
        */

        .connectButton {
            width: 100%;
            height: 52px;

            background: #fff;
            color: #000;

            border: 1px solid #fff;

            font-size: 14px;
            font-weight: 500;

            transition: opacity .15s ease;
        }

        .connectButton:hover {
            opacity: .85;
        }

        .connectButton:active {
            opacity: .65;
        }

        .ticketBlock {
            width: 100%;
            margin-top: 18px;
            text-align: center;
        }

        .ticketTitle {
            margin-bottom: 10px;
            color: #fff;
            font-size: 13px;
            font-weight: 400;
        }

        .ticketImageLink {
            display: block;
            width: 100%;
            cursor: pointer;
        }

        .ticketImageLink.disabled {
            cursor: default;
            pointer-events: none;
        }

        .ticketImage {
            display: block;
            width: 100%;
            height: auto;
            border: 1px solid #242424;
        }

        .authStatus {
            min-height: 20px;

            margin-top: 18px;

            color: #666;

            font-size: 12px;
            line-height: 1.4;
        }


        /* =========================================================
           HOME
        ========================================================= */

        #homeScreen {
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .home {
            width: 320px;
            max-width: 100%;
        }

        .homeTitle {
            margin-bottom: 30px;

            text-align: center;

            font-size: 28px;
            font-weight: 500;
        }

        .menu {
            width: 100%;
        }

        .menuButton {
            width: 100%;
            height: 52px;

            margin-bottom: 8px;

            background: #080808;
            color: #fff;

            border: 1px solid #242424;

            font-size: 13px;
            font-weight: 400;

            text-align: left;

            padding: 0 16px;
        }

        .menuButton:hover {
            background: #111;
        }

        .menuButton:active {
            background: #181818;
        }


        /* =========================================================
           PAGE HEADER
        ========================================================= */

        .page {
            flex-direction: column;

            padding:
                14px
                18px
                18px
                18px;
        }

        .header {
            position: relative;

            width: 100%;
            height: 48px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
        }

        .backButton {
            width: 40px;
            height: 40px;

            background: #080808;
            color: #fff;

            border: 1px solid #242424;

            font-size: 22px;
            line-height: 1;
        }

        .backButton:hover {
            background: #111;
        }

        .pageTitle {
            position: absolute;

            left: 50%;
            transform: translateX(-50%);

            font-size: 14px;
            font-weight: 400;
        }


        /* =========================================================
           GENERATION
        ========================================================= */

        #generationScreen {
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .generation {
            width: 320px;
            max-width: 100%;
        }

        .generationTitle {
            margin-bottom: 24px;

            font-size: 20px;
            font-weight: 400;

            text-align: center;
        }

        .codeInput {
            width: 100%;
            height: 58px;

            background: #050505;
            color: #fff;

            border: 1px solid #292929;

            outline: none;

            padding: 0 16px;

            font-size: 24px;
            letter-spacing: 8px;

            text-align: center;
        }

        .codeInput:focus {
            border-color: #555;
        }

        .codeInput::placeholder {
            color: #333;
        }

        .sendButton {
            width: 100%;
            height: 52px;

            margin-top: 8px;

            background: #fff;
            color: #000;

            border: 1px solid #fff;

            font-size: 13px;
        }

        .sendButton:disabled {
            opacity: .25;
            cursor: default;
        }

        .generationStatus {
            min-height: 18px;

            margin-top: 14px;

            color: #666;

            font-size: 12px;

            text-align: center;
        }


        /* =========================================================
           USER
        ========================================================= */

        .userPage {
            width: 320px;
            max-width: 100%;
            margin: auto;

            display: flex;
            flex-direction: column;
        }

        .userBlock {
            width: 100%;

            padding: 18px;

            background: #080808;

            border: 1px solid #242424;
        }

        .userLabel {
            margin-bottom: 10px;

            color: #666;

            font-size: 11px;
            letter-spacing: .4px;
        }

        .userAddress {
            color: #fff;

            font-size: 12px;
            line-height: 1.5;

            word-break: break-all;
        }

        .disconnectButton {
            width: 100%;
            height: 52px;

            margin-top: 10px;

            background: #080808;
            color: #fff;

            border: 1px solid #242424;

            font-size: 13px;
            font-weight: 400;
        }

        .disconnectButton:hover {
            background: #111;
        }

        .disconnectButton:active {
            background: #181818;
        }

        .userStatus {
            min-height: 18px;

            margin-top: 14px;

            color: #666;

            font-size: 12px;

            text-align: center;
        }


        /* =========================================================
           LOADING
        ========================================================= */

        #loading {
            position: fixed;
            inset: 0;

            z-index: 1000;

            display: none;

            align-items: center;
            justify-content: center;

            background: #000;
        }

        #loading.active {
            display: flex;
        }

        .loadingText {
            color: #777;
            font-size: 11px;
        }


        /* =========================================================
           MOBILE
        ========================================================= */


        .roomViewerLoader {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 34px;
            height: 34px;
            margin-left: -17px;
            margin-top: -17px;
            border: 2px solid rgba(255,255,255,.18);
            border-top-color: rgba(255,255,255,.95);
            border-radius: 50%;
            animation: roomViewerLoaderSpin .75s linear infinite;
            z-index: 40;
            pointer-events: none;
        }

        .roomViewerLoader.hidden {
            display: none;
        }

        @keyframes roomViewerLoaderSpin {
            to {
                transform: rotate(360deg);
            }
        }

        /* PC: mouse drag = look, keyboard = movement. */
        @media (hover: hover) and (pointer: fine) {
            #roomCanvas canvas {
                cursor: grab;
            }

            #roomCanvas canvas:active {
                cursor: grabbing;
            }
        }

        /* Touch: one finger = look, two fingers = movement. */
        @media (hover: none) and (pointer: coarse) {
            #roomCanvas canvas {
                touch-action: none;
                -webkit-user-select: none;
                user-select: none;
            }
        }

        @media (max-width: 500px) {

            .authTitle,
            .homeTitle {
                font-size: 24px;
            }
}


        /* =========================================================
           ROOMS
        ========================================================= */

        #roomScreen,
        #roomViewerScreen {
            background: #000;
            overflow: hidden;
            touch-action: none;
        }

        .roomGrid {
            width: 100%;
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 14px;
            overflow-y: auto;
            padding: 4px 2px 14px;
            scrollbar-width: thin;
        }

        .roomCard {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .roomItem {
            width: 100%;
            min-height: 110px;
            background: #080808;
            color: #fff;
            border: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 8px;
            font-size: 22px;
            font-weight: 400;
            transition:
                background .18s ease,
                border-color .18s ease,
                box-shadow .18s ease,
                transform .18s ease;
            clip-path: polygon(
                0 0,
                calc(100% - 10px) 0,
                100% 10px,
                100% 100%,
                10px 100%,
                0 calc(100% - 10px)
            );
        }

        .roomItem:hover {
            background: #101010;
            border-color: #666;
            box-shadow:
                0 0 10px rgba(255,255,255,.10),
                inset 0 0 12px rgba(255,255,255,.035);
            transform: translateY(-1px);
        }

        .roomItem:active {
            background: #181818;
            box-shadow: 0 0 16px rgba(255,255,255,.16);
            transform: translateY(0);
        }

        .roomItem {
            position: relative;
            overflow: hidden;
            padding: 0;
        }

        .roomItem::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,.08),
                rgba(0,0,0,.48)
            );
            pointer-events: none;
        }

        .roomIcon {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: .82;
            filter: saturate(.9) contrast(1.03);
            transition:
                opacity .18s ease,
                transform .28s ease;
        }

        .roomItem:hover .roomIcon {
            opacity: .94;
            transform: scale(1.025);
        }

        .roomItem > div,
        .roomItem > small {
            position: relative;
            z-index: 2;
        }

        .roomItem > div {
            text-shadow: 0 2px 8px #000;
        }

        .roomItem small {
            color: #ddd;
            text-shadow: 0 2px 8px #000;
            font-size: 9px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .roomBuyButton {
            width: 100%;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffd400;
            color: #000;
            border: 1px solid #ffd400;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .8px;
            text-decoration: none;
            transition:
                background .18s ease,
                box-shadow .18s ease,
                transform .18s ease;
            clip-path: polygon(
                0 0,
                calc(100% - 7px) 0,
                100% 7px,
                100% 100%,
                7px 100%,
                0 calc(100% - 7px)
            );
        }

        .roomBuyButton:hover {
            background: #ffe04a;
            box-shadow:
                0 0 8px rgba(255,212,0,.45),
                0 0 20px rgba(255,212,0,.20);
            transform: translateY(-1px);
        }

        .roomBuyButton:active {
            background: #e6bd00;
            box-shadow: 0 0 12px rgba(255,212,0,.35);
            transform: translateY(0);
        }

        .roomLoading {
            grid-column: 1 / -1;
            min-height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 18px;
            color: #555;
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .roomLoadingSpinner {
            width: 42px;
            height: 42px;
            border: 1px solid #333;
            border-top-color: #fff;
            border-right-color: #777;
            transform: rotate(45deg);
            animation: roomLoadingSpin .8s linear infinite;
            box-shadow: 0 0 14px rgba(255,255,255,.08);
        }

        @keyframes roomLoadingSpin {
            from { transform: rotate(45deg); }
            to { transform: rotate(405deg); }
        }

        .roomLoadingText {
            opacity: .75;
        }

        #roomCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
        }

        #roomCanvas canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .roomViewerHeader {
            position: absolute;
            z-index: 20;
            top: 14px;
            left: 14px;
            right: 14px;
            height: 40px;
            display: flex;
            align-items: center;
        }

        .roomViewerTitle {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: #fff;
            white-space: nowrap;
        }

        .roomStatus {
            position: absolute;
            z-index: 25;
            left: 50%;
            top: 76px;
            transform: translateX(-50%);
            width: min(88vw, 560px);
            padding: 12px 14px;
            background: rgba(0,0,0,.78);
            border: 1px solid rgba(255,255,255,.14);
            color: #bbb;
            text-align: center;
            font-size: 11px;
            line-height: 1.45;
            white-space: pre-line;
            pointer-events: none;
        }

        .roomHint {
            position: absolute;
            z-index: 20;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            width: min(92vw, 650px);
            padding: 8px 12px;
            background: rgba(0,0,0,.60);
            border: 1px solid rgba(255,255,255,.1);
            color: #777;
            text-align: center;
            font-size: 10px;
            line-height: 1.4;
            pointer-events: none;
        }

        /* =========================================================
           ROOM VIEWER — МИНИМАЛЬНОЕ УПРАВЛЕНИЕ
           На мобильном:
             1 палец  = осмотр
             2 пальца = перемещение по комнате
           ========================================================= */

        .roomViewerMenuButton {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(8,8,8,.82);
            color: #fff;
            border: 1px solid #242424;
            font-size: 21px;
            line-height: 1;
            z-index: 30;
            pointer-events: auto;
        }

        .roomViewerMenuButton:hover {
            background: #111;
        }

        .roomViewerMenuButton:active {
            background: #181818;
        }

        .roomGalleryOverlay {
            position: absolute;
            z-index: 50;
            inset: 0;
            display: none;
            flex-direction: column;
            background: rgba(0,0,0,.96);
            overflow: hidden;
        }

        .roomGalleryOverlay.active {
            display: flex;
        }

        .roomGalleryHeader {
            flex: 0 0 58px;
            display: flex;
            align-items: center;
            padding: 0 14px;
            border-bottom: 1px solid #242424;
            background: #000;
        }

        .roomGalleryTitle {
            margin-left: 14px;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: .5px;
        }

        .roomGalleryClose {
            width: 40px;
            height: 40px;
            background: #080808;
            color: #fff;
            border: 1px solid #242424;
            font-size: 20px;
        }

        .roomMenuActions {
            display: flex;
            gap: 8px;
            padding: 10px 12px;
            border-bottom: 1px solid #242424;
            background: #000;
        }

        .roomMenuAction {
            min-height: 38px;
            padding: 0 14px;
            background: #080808;
            color: #fff;
            border: 1px solid #292929;
            font-size: 9px;
            letter-spacing: 1px;
        }

        .roomMenuAction:hover,
        .roomMenuAction:active {
            background: #151515;
        }

        .roomGalleryList {
            flex: 1 1 auto;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scrollbar-width: thin;
        }

        .roomGalleryCard {
            position: relative;
            width: 100%;
            min-height: 150px;
            flex: 0 0 auto;
            overflow: hidden;
            padding: 0;
            background: #080808;
            border: 1px solid #292929;
            color: #fff;
            text-align: left;
            clip-path: polygon(
                0 0,
                calc(100% - 12px) 0,
                100% 12px,
                100% 100%,
                12px 100%,
                0 calc(100% - 12px)
            );
        }

        .roomGalleryCard img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: .78;
            display: block;
        }

        .roomGalleryCard::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,.06),
                rgba(0,0,0,.72)
            );
            pointer-events: none;
        }

        .roomGalleryCardContent {
            position: absolute;
            z-index: 2;
            left: 16px;
            right: 16px;
            bottom: 14px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 12px;
        }

        .roomGalleryCardNumber {
            font-size: 20px;
            font-weight: 400;
            text-shadow: 0 2px 8px #000;
        }

        .roomGalleryCardName {
            color: #bbb;
            font-size: 9px;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 2px 8px #000;
        }

        .roomGalleryEmpty,
        .roomGalleryLoading {
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 10px;
            letter-spacing: 1.5px;
        }

        @media (max-width: 500px) {
            .roomGalleryList {
                padding: 8px;
                gap: 8px;
            }

            .roomGalleryCard {
                min-height: 130px;
            }
        }

        @media (max-width: 500px) {
            .roomGrid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
                padding-left: 0;
                padding-right: 0;
            }

            .roomItem {
                min-height: 100px;
            }

            .roomBuyButton {
                height: 38px;
                font-size: 10px;
            }

            .roomHint {
                bottom: calc(146px + env(safe-area-inset-bottom));
                font-size: 9px;
            }

            .roomControls {
                bottom: calc(10px + env(safe-area-inset-bottom));
                height: 112px;
                padding: 0 8px;
            }

            .roomMovePad {
                width: 100px;
                height: 100px;
            }

            .roomLookPad {
                width: min(43vw, 250px);
                height: 100px;
            }

/* =============================================================
   TON ADDRESS
============================================================= */

function base64UrlToBytes(value) {

    let normalized =
        String(value)
            .replace(/-/g, "+")
            .replace(/_/g, "/");


    while (
        normalized.length % 4 !== 0
    ) {

        normalized += "=";

    }


    const binary =
        atob(normalized);


    const bytes =
        new Uint8Array(
            binary.length
        );


    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(i);

    }


    return bytes;

}


function normalizeTonAddress(address) {

    if (!address) {
        return "";
    }


    address =
        String(address).trim();


    /*
        Уже raw:
        0:64hex
    */

    if (
        /^-?\d+:[0-9a-fA-F]{64}$/
            .test(address)
    ) {

        const parts =
            address.split(":");


        return (
            parts[0] +
            ":" +
            parts[1].toLowerCase()
        );

    }


    /*
        Friendly:
        EQ...
        UQ...
    */

    try {

        const bytes =
            base64UrlToBytes(
                address
            );


        if (
            bytes.length !== 36
        ) {

            return address.toLowerCase();

        }


        let workchain =
            bytes[1];


        if (
            workchain === 255
        ) {

            workchain = -1;

        }


        let hash = "";


        for (
            let i = 2;
            i < 34;
            i++
        ) {

            hash +=
                bytes[i]
                    .toString(16)
                    .padStart(2, "0");

        }


        return (
            workchain +
            ":" +
            hash.toLowerCase()
        );

    } catch {

        return address.toLowerCase();

    }

}


const normalizedRequiredCollection =
    normalizeTonAddress(
        REQUIRED_COLLECTION
    );


/* =============================================================
   NFT CHECK
============================================================= */

async function checkCollectionNFT(
    walletAddress
) {
    /*
       Ищем ЛЮБОЙ NFT владельца из REQUIRED_COLLECTION.

       ВАЖНО:
       - не загружаем все NFT кошелька;
       - не запускаем длинный цикл по 100 страницам;
       - используем серверный фильтр TonAPI collection;
       - у запроса есть таймаут, поэтому экран не зависает
         бесконечно на "Проверка NFT...";
       - после получения ответа дополнительно проверяем
         адрес коллекции у найденного NFT.
    */

    if (!walletAddress) {
        return null;
    }

    const normalizedCollection =
        normalizeTonAddress(REQUIRED_COLLECTION);

    const normalizedRawCollection =
        normalizeTonAddress(REQUIRED_COLLECTION_RAW);

    function belongsToRequiredCollection(nft) {
        if (!nft || typeof nft !== "object") {
            return false;
        }

        const candidates = [
            nft.collection?.address,
            nft.collection_address,
            nft.collection?.raw_address,
            nft.collection?.friendly_address
        ].filter(Boolean);

        return candidates.some(address => {
            const normalized =
                normalizeTonAddress(address);

            return (
                normalized === normalizedCollection ||
                normalized === normalizedRawCollection
            );
        });
    }

    function extractNFTItems(data) {
        if (
            data &&
            Array.isArray(data.nft_items)
        ) {
            return data.nft_items;
        }

        if (
            data &&
            Array.isArray(data.items)
        ) {
            return data.items;
        }

        return [];
    }

    const filteredUrl =
        "https://tonapi.io/v2/accounts/" +
        encodeURIComponent(walletAddress) +
        "/nfts?collection=" +
        encodeURIComponent(REQUIRED_COLLECTION) +
        "&limit=100";

    console.log(
        "[NFT CHECK] Кошелёк:",
        walletAddress
    );

    console.log(
        "[NFT CHECK] Ищем любой NFT коллекции:",
        REQUIRED_COLLECTION
    );

    console.log(
        "[NFT CHECK] URL:",
        filteredUrl
    );

    /*
       Таймаут 15 секунд.
       Раньше обычный fetch мог ждать ответ бесконечно,
       из-за чего интерфейс оставался на "Проверка NFT...".
    */
    const controller =
        new AbortController();

    const timeoutId =
        setTimeout(
            () => {
                controller.abort();
            },
            15000
        );

    try {
        const response =
            await fetch(
                filteredUrl,
                {
                    method: "GET",
                    headers: {
                        "Accept":
                            "application/json"
                    },
                    signal:
                        controller.signal,
                    cache: "no-store"
                }
            );

        if (!response.ok) {
            throw new Error(
                "TonAPI HTTP " +
                response.status
            );
        }

        const data =
            await response.json();

        const nftItems =
            extractNFTItems(data);

        console.log(
            "[NFT CHECK] TonAPI вернул NFT:",
            nftItems.length
        );

        /*
           Достаточно одного NFT.
           Сам адрес NFT заранее неизвестен.
        */
        for (const nft of nftItems) {
            if (
                belongsToRequiredCollection(
                    nft
                )
            ) {
                console.log(
                    "[NFT CHECK] НАЙДЕН NFT НУЖНОЙ КОЛЛЕКЦИИ:",
                    nft.address ||
                    nft.nft_address ||
                    nft.item_address ||
                    nft
                );

                return nft;
            }
        }

        console.log(
            "[NFT CHECK] NFT нужной коллекции у кошелька не найден."
        );

        return null;

    } catch (error) {
        if (
            error &&
            error.name === "AbortError"
        ) {
            console.error(
                "[NFT CHECK] Таймаут TonAPI: 15 секунд."
            );

            throw new Error(
                "TonAPI не ответил за 15 секунд"
            );
        }

        console.error(
            "[NFT CHECK] Ошибка запроса:",
            error
        );

        throw error;

    } finally {
        clearTimeout(timeoutId);
    }
}

============================================================= */

generationCode.addEventListener(
    "input",
    () => {

        generationCode.value =
            generationCode.value
                .replace(/\D/g, "")
                .slice(0, 5);


        generationSubmit.disabled =
            generationCode.value.length !== 5;

    }
);


/* =============================================================
   GENERATION SEND
============================================================= */

generationSubmit.addEventListener(
    "click",
    async () => {

        if (
            !requireAccess()
        ) {
            return;
        }


        const code =
            generationCode.value.trim();


        if (
            !/^\d{5}$/.test(code)
        ) {

            generationStatus.textContent =
                "Введите 5 цифр";

            return;

        }


        if (!currentWallet) {

            generationStatus.textContent =
                "Кошелёк не подключён";

            return;

        }


        generationSubmit.disabled =
            true;


        generationStatus.textContent =
            "Отправка...";


        try {

            const response =
                await fetch(
                    GENERATION_API,
                    {

                        method:
                            "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                code:
                                    code,

                                wallet:
                                    currentWallet

                            })

                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                data.success !== true
            ) {

                throw new Error(
                    data.error ||
                    "Ошибка сервера"
                );

            }


            generationStatus.textContent =
                "Данные отправлены";


            generationCode.value =
                "";


        } catch (error) {

            console.error(
                "GENERATION ERROR:",
                error
            );


            generationStatus.textContent =
                "Ошибка отправки";


        } finally {

            generationSubmit.disabled =
                true;

        }

    }
);

    const points = [...roomTouchPointers.values()].slice(0, 2);

        centerX: (points[0].x + points[1].x) / 2,

function setRoomStatus(text, visible = true) {
    /*
        Текстовые статусы ROOM больше не показываются.
        Любой активный статус отображается одним анимированным
        индикатором. После завершения передаётся visible=false.
    */

    if (roomViewerLoader) {
        roomViewerLoader.classList.toggle("hidden", !visible);
        roomViewerLoader.setAttribute(
            "aria-hidden",

        );
