<head>

    content="width=device-width,

>

    content="#000000"
>

<title>AR</title>


<!-- Telegram Mini App -->

    src="https://telegram.org/js/telegram-web-app.js?63">
</script>


<style>

/* ==================================================
   BASE
================================================== */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    color: #fff;

    font-family:
        Arial,
        sans-serif;

    touch-action: none;

    -webkit-user-select: none;
    user-select: none;
}

body {

    position: fixed;

    inset: 0;
}

#app {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;
}


/* ==================================================
   START SCREEN
================================================== */

#startScreen {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    align-items: center;

    justify-content: center;

    padding:
        20px;

    background:
        #000;
}

.startContent {

    width: 100%;

    max-width: 360px;

    text-align: center;
}

.startContent h1 {

    margin:
        0 0 12px;

    font-size:
        42px;

    line-height:
        1;

    letter-spacing:
        8px;
}

.startContent p {

    margin:
        0 0 32px;

    color:
        #777;

    font-size:
        14px;
}

#startButton {

    width: 100%;

    height: 58px;

    border: 0;

    border-radius: 14px;

    background:
        #fff;

    color:
        #000;

    font-size:
        15px;

    font-weight:
        700;

    cursor:
        pointer;

    -webkit-tap-highlight-color:
        transparent;
}

#startButton:active {

    transform:
        scale(.98);
}

#startButton:disabled {

    opacity:
        .5;
}

#startStatus {

    min-height:
        18px;

    margin-top:
        14px;

    color:
        #777;

    font-size:
        12px;
}


/* ==================================================
   FALLBACK CAMERA
================================================== */

#camera {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: none;

    z-index: 1;

    background:
        #000;
}


/* ==================================================
   THREE CANVAS
================================================== */

#arCanvas {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    display: none;

    z-index: 5;

    pointer-events: none;
}


/* ==================================================
   AR INTERFACE
================================================== */

#arUI {

    position: fixed;

    inset: 0;

    z-index: 20;

    display: none;

    pointer-events: none;
}


/* ==================================================
   TOP BAR
================================================== */

#topBar {

    position: absolute;

    top:
        calc(
            12px +
            env(safe-area-inset-top)
        );

    left:
        12px;

    right:
        12px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;
}

#arStatus {

    max-width:
        calc(100% - 60px);

    padding:
        9px 14px;

    border-radius:
        20px;

    background:
        rgba(0,0,0,.65);

    color:
        #fff;

    font-size:
        12px;

    white-space:
        nowrap;

    overflow:
        hidden;

    text-overflow:
        ellipsis;

    backdrop-filter:
        blur(8px);
}

#closeButton {

    width:
        44px;

    height:
        44px;

    padding:
        0;

    border:
        0;

    border-radius:
        50%;

    background:
        rgba(0,0,0,.7);

    color:
        #fff;

    font-size:
        27px;

    line-height:
        44px;

    pointer-events:
        auto;
}


/* ==================================================
   RETICLE
================================================== */

#reticle {

    position:
        absolute;

    left:
        50%;

    top:
        50%;

    width:
        44px;

    height:
        44px;

    transform:
        translate(
            -50%,
            -50%
        );

    border:
        1px solid
        rgba(255,255,255,.8);

    border-radius:
        50%;

    transition:
        border-color .2s ease;
}

#reticle.found {

    border:
        2px solid
        #fff;
}


/* ==================================================
   BOTTOM
================================================== */

#bottomBar {

    position:
        absolute;

    left:
        20px;

    right:
        20px;

    bottom:
        calc(
            20px +
            env(safe-area-inset-bottom)
        );

    display:
        flex;

    justify-content:
        center;
}

#addModelButton {

    width:
        100%;

    max-width:
        360px;

    height:
        56px;

    border:
        1px solid
        rgba(255,255,255,.85);

    border-radius:
        14px;

    background:
        rgba(0,0,0,.78);

    color:
        #fff;

    font-size:
        14px;

    font-weight:
        700;

    pointer-events:
        auto;

    display:
        none;

    cursor:
        pointer;

    backdrop-filter:
        blur(8px);
}

#addModelButton:active {

    transform:
        scale(.98);
}

#addModelButton:disabled {

    opacity:
        .5;
}


/* ==================================================
   ERROR
================================================== */

#errorScreen {

    position:
        fixed;

    inset:
        0;

    z-index:
        500;

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    padding:
        25px;

    background:
        #000;

    color:
        #fff;

    text-align:
        center;
}

#errorText {

    max-width:
        380px;

    line-height:
        1.5;

    font-size:
        14px;
}

</style>

<body>


<div id="app">


<!-- ==================================================
     START
================================================== -->

<div id="startScreen">

    <div class="startContent">

        <h1>
            AR
        </h1>

        <p>
            Telegram AR
        </p>

        <button
            id="startButton"
            type="button"
        >
            ЗАПУСК
        </button>

        <div id="startStatus">
            Готово
        </div>

    </div>

</div>


<!-- ==================================================
     FALLBACK CAMERA
================================================== -->

<video
    id="camera"
    autoplay
    muted
    playsinline
></video>


<!-- ==================================================
     THREE
================================================== -->

<canvas
    id="arCanvas"
></canvas>


<!-- ==================================================
     AR UI
================================================== -->

<div id="arUI">


    <div id="topBar">

        <div id="arStatus">
            AR
        </div>


        <button
            id="closeButton"
            type="button"
        >
            ×
        </button>

    </div>


    <div id="reticle"></div>


    <div id="bottomBar">

        <button
            id="addModelButton"
            type="button"
        >
            ДОБАВИТЬ 3D МОДЕЛЬ
        </button>

    </div>


</div>


<!-- ==================================================
     ERROR
================================================== -->

<div id="errorScreen">

    <div id="errorText"></div>

</div>


</div>


<!-- ==================================================
     APPLICATION
================================================== -->

<script type="module">


/*
======================================================
THREE.JS
======================================================
*/

import * as THREE from
    "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


import {
    GLTFLoader
} from
    "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";


/*
======================================================
TELEGRAM
======================================================
*/

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;


/*
======================================================
DOM
======================================================
*/

const startScreen =
    document.getElementById(
        "startScreen"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const startStatus =
    document.getElementById(
        "startStatus"
    );

const cameraVideo =
    document.getElementById(
        "camera"
    );

const canvas =
    document.getElementById(
        "arCanvas"
    );

const arUI =
    document.getElementById(
        "arUI"
    );

const arStatus =
    document.getElementById(
        "arStatus"
    );

const reticle =
    document.getElementById(
        "reticle"
    );

const addModelButton =
    document.getElementById(
        "addModelButton"
    );

const closeButton =
    document.getElementById(
        "closeButton"
    );

const errorScreen =
    document.getElementById(
        "errorScreen"
    );

const errorText =
    document.getElementById(
        "errorText"
    );


/*
======================================================
STATE
======================================================
*/

let renderer = null;

let scene = null;

let xrCamera = null;

let xrSession = null;

let localFloorSpace = null;

let viewerSpace = null;

let hitTestSource = null;

let currentHit = null;

let anchor = null;

let creature = null;

let creatureLoaded = false;

let creaturePlaced = false;

let cameraStream = null;


/*
======================================================
TELEGRAM INIT
======================================================
*/

if (tg) {

    tg.ready();

    tg.expand();

    try {

        tg.setHeaderColor(
            "#000000"
        );

        tg.setBackgroundColor(
            "#000000"
        );

        tg.disableVerticalSwipes();

    } catch (_) {}

}


/*
======================================================
START BUTTON
======================================================
*/

startButton.addEventListener(
    "click",
    startApplication
);


/*
======================================================
START APPLICATION
======================================================
*/

async function startApplication() {

    startButton.disabled =
        true;

    startStatus.textContent =
        "Запуск...";


    try {

        /*
         * Создаём Three.js.
         */

        initThree();


        /*
         * Загружаем модель
         * параллельно с запуском AR.
         */

        loadCreature();


        /*
         * В первую очередь
         * пытаемся запустить
         * настоящее WebXR AR.
         */

        if (
            navigator.xr
        ) {

            await startWebXR();

        } else {

            /*
             * Только fallback
             * для обычной камеры.
             */

            await startCamera();

        }


        /*
         * Telegram motion.
         */

        startTelegramMotion();


        /*
         * UI.
         */

        startScreen.style.display =
            "none";

        arUI.style.display =
            "block";


    } catch (error) {

        console.error(
            "START ERROR:",
            error
        );


        /*
         * Если WebXR не запустился,
         * пытаемся открыть обычную
         * камеру.
         */

        try {

            await startCamera();

            startTelegramMotion();

            startScreen.style.display =
                "none";

            arUI.style.display =
                "block";

            arStatus.textContent =
                "КАМЕРА";

        } catch (cameraError) {

            console.error(
                "CAMERA ERROR:",
                cameraError
            );

            startButton.disabled =
                false;

            startStatus.textContent =
                "Готово";

            showError(
                cameraError.message ||
                "Камера недоступна"
            );

        }

    }

}


/*
======================================================
THREE INITIALIZATION
======================================================
*/

function initThree() {

    if (renderer) {
        return;
    }


    scene =
        new THREE.Scene();


    xrCamera =
        new THREE.PerspectiveCamera(

            70,

            window.innerWidth /
            window.innerHeight,

            0.01,

            100

        );


    renderer =
        new THREE.WebGLRenderer({

            canvas:
                canvas,

            alpha:
                true,

            antialias:
                true,

            powerPreference:
                "high-performance"

        });


    renderer.setPixelRatio(

        Math.min(
            window.devicePixelRatio,
            2
        )

    );


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    renderer.xr.enabled =
        true;


    /*
     * Освещение модели.
     */

    const hemisphereLight =
        new THREE.HemisphereLight(

            0xffffff,

            0x444444,

            2

        );


    scene.add(
        hemisphereLight
    );


    const directionalLight =
        new THREE.DirectionalLight(

            0xffffff,

            1.5

        );


    directionalLight.position.set(

        2,
        4,
        2

    );


    scene.add(
        directionalLight
    );

}


/*
======================================================
LOAD GLB
======================================================
*/

function loadCreature() {

    if (
        creatureLoaded
    ) {

        return;
    }


    const loader =
        new GLTFLoader();


    /*
     * ВАЖНО:
     *
     * Модель находится здесь:
     *
     * models/creature.glb
     */

    loader.load(

        "./models/creature.glb",


        function(gltf) {

            creature =
                gltf.scene;


            /*
             * Начальный масштаб.
             */

            creature.scale.set(

                0.5,
                0.5,
                0.5

            );


            /*
             * До размещения
             * объект невидим.
             */

            creature.visible =
                false;


            scene.add(
                creature
            );


            creatureLoaded =
                true;


            console.log(
                "creature.glb loaded"
            );


            /*
             * Если пользователь уже
             * нажал размещение,
             * показываем модель.
             */

            if (
                creaturePlaced
            ) {

                creature.visible =
                    true;

            }

        },


        function(progress) {

            if (
                progress.total
            ) {

                const percent =
                    Math.round(

                        progress.loaded /
                        progress.total *
                        100

                    );


                console.log(

                    "creature.glb:",
                    percent + "%"

                );

            }

        },


        function(error) {

            console.error(
                "creature.glb ERROR:",
                error
            );


            arStatus.textContent =
                "ОШИБКА МОДЕЛИ";

        }

    );

}


/*
======================================================
WEBXR AR
======================================================
*/

async function startWebXR() {

    /*
     * Сразу запрашиваем
     * immersive AR.
     *
     * Никакого отдельного
     * device-check здесь нет.
     */

    xrSession =
        await navigator.xr
            .requestSession(

                "immersive-ar",

                {

                    requiredFeatures: [

                        "local-floor",

                        "hit-test"

                    ],

                    optionalFeatures: [

                        "anchors",

                        "plane-detection",

                        "depth-sensing"

                    ]

                }

            );


    /*
     * Three.js начинает
     * работать с XR session.
     */

    await renderer.xr
        .setSession(
            xrSession
        );


    /*
     * Локальное пространство
     * помещения.
     */

    localFloorSpace =
        await xrSession
            .requestReferenceSpace(

                "local-floor"

            );


    /*
     * Пространство камеры
     * / viewer.
     */

    viewerSpace =
        await xrSession
            .requestReferenceSpace(

                "viewer"

            );


    /*
     * Источник hit-test.
     */

    hitTestSource =
        await xrSession
            .requestHitTestSource({

                space:
                    viewerSpace

            });


    /*
     * Показываем AR UI.
     */

    canvas.style.display =
        "block";


    addModelButton.style.display =
        "block";


    arStatus.textContent =
        "НАВЕДИТЕ НА ПОЛ";


    /*
     * AR frame loop.
     */

    renderer.setAnimationLoop(
        renderAR
    );


    /*
     * Обработка завершения
     * XR-сессии.
     */

    xrSession.addEventListener(

        "end",

        function() {

            xrSession =
                null;

            localFloorSpace =
                null;

            viewerSpace =
                null;

            hitTestSource =
                null;

            currentHit =
                null;

            anchor =
                null;

            renderer.setAnimationLoop(
                null
            );

        }

    );

}


/*
======================================================
AR FRAME
======================================================
*/

function renderAR(
    time,
    frame
) {

    if (
        !frame ||
        !localFloorSpace
    ) {

        return;
    }


    /*
     * ================================================
     * ПОИСК ПОВЕРХНОСТИ
     * ================================================
     */

    if (
        hitTestSource &&
        !creaturePlaced
    ) {

        const results =
            frame.getHitTestResults(

                hitTestSource

            );


        if (
            results.length > 0
        ) {

            currentHit =
                results[0];


            reticle.classList.add(
                "found"
            );


            arStatus.textContent =
                "ПОВЕРХНОСТЬ НАЙДЕНА";


        } else {

            currentHit =
                null;


            reticle.classList.remove(
                "found"
            );


            arStatus.textContent =
                "ИЩЕМ ПОВЕРХНОСТЬ";

        }

    }


    /*
     * ================================================
     * ANCHOR
     * ================================================
     */

    if (
        anchor &&
        creature
    ) {

        const pose =
            frame.getPose(

                anchor.anchorSpace,

                localFloorSpace

            );


        if (pose) {

            creature.matrix
                .fromArray(

                    pose.transform.matrix

                );


            creature.matrix
                .decompose(

                    creature.position,

                    creature.quaternion,

                    creature.scale

                );

        }

    }


    /*
     * ================================================
     * RENDER
     * ================================================
     */

    renderer.render(

        scene,

        xrCamera

    );

}


/*
======================================================
ADD MODEL BUTTON
======================================================
*/

addModelButton.addEventListener(

    "click",

    placeCreature

);


/*
======================================================
PLACE CREATURE
======================================================
*/

async function placeCreature() {

    /*
     * Модель должна быть загружена.
     */

    if (
        !creatureLoaded ||
        !creature
    ) {

        arStatus.textContent =
            "МОДЕЛЬ ЗАГРУЖАЕТСЯ";

        return;

    }


    /*
     * Поверхность должна
     * быть найдена.
     */

    if (
        !currentHit
    ) {

        arStatus.textContent =
            "НАВЕДИТЕ НА ПОЛ";

        return;

    }


    /*
     * Получаем локальную
     * позу поверхности.
     */

    const pose =
        currentHit.getPose(

            localFloorSpace

        );


    if (!pose) {

        arStatus.textContent =
            "ТОЧКА НЕ НАЙДЕНА";

        return;

    }


    /*
     * ================================================
     * УСТАНОВКА В ЛОКАЛЬНУЮ
     * КООРДИНАТУ
     * ================================================
     */

    creature.matrix
        .fromArray(

            pose.transform.matrix

        );


    creature.matrix
        .decompose(

            creature.position,

            creature.quaternion,

            creature.scale

        );


    /*
     * ================================================
     * ANCHOR
     * ================================================
     *
     * Anchor удерживает объект
     * в найденной мировой точке.
     */

    if (
        typeof currentHit.createAnchor ===
        "function"
    ) {

        try {

            anchor =
                await currentHit
                    .createAnchor();


            console.log(
                "XRAnchor created"
            );


        } catch (error) {

            console.warn(
                "XRAnchor unavailable:",
                error
            );


            anchor =
                null;

        }

    }


    /*
     * Показываем модель.
     */

    creature.visible =
        true;


    creaturePlaced =
        true;


    /*
     * Больше не нужно
     * искать новую поверхность.
     */

    currentHit =
        null;


    /*
     * Убираем hit-test source.
     */

    if (
        hitTestSource
    ) {

        try {

            hitTestSource.cancel();

        } catch (_) {}

        hitTestSource =
            null;

    }


    reticle.style.display =
        "none";


    addModelButton.style.display =
        "none";


    arStatus.textContent =

        anchor
            ? "МОДЕЛЬ ЗАКРЕПЛЕНА"
            : "МОДЕЛЬ РАЗМЕЩЕНА";

}


/*
======================================================
TELEGRAM MOTION
======================================================
*/

function startTelegramMotion() {

    if (!tg) {
        return;
    }


    /*
     * DEVICE ORIENTATION
     */

    if (
        tg.DeviceOrientation
    ) {

        try {

            tg.DeviceOrientation.start(

                {

                    refresh_rate:
                        50,

                    need_absolute:
                        false

                },

                function(ok) {

                    console.log(
                        "DeviceOrientation:",
                        ok
                    );

                }

            );

        } catch (error) {

            console.log(
                "DeviceOrientation:",
                error
            );

        }

    }


    /*
     * GYROSCOPE
     */

    if (
        tg.Gyroscope
    ) {

        try {

            tg.Gyroscope.start(

                {

                    refresh_rate:
                        50

                },

                function(ok) {

                    console.log(
                        "Gyroscope:",
                        ok
                    );

                }

            );

        } catch (error) {

            console.log(
                "Gyroscope:",
                error
            );

        }

    }


    /*
     * ACCELEROMETER
     */

    if (
        tg.Accelerometer
    ) {

        try {

            tg.Accelerometer.start(

                {

                    refresh_rate:
                        50

                },

                function(ok) {

                    console.log(
                        "Accelerometer:",
                        ok
                    );

                }

            );

        } catch (error) {

            console.log(
                "Accelerometer:",
                error
            );

        }

    }


    /*
     * GPS НЕ ИСПОЛЬЗУЕТСЯ.
     */

}


/*
======================================================
FALLBACK CAMERA
======================================================
*/

async function startCamera() {

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        throw new Error(
            "Camera API недоступен"
        );

    }


    cameraStream =
        await navigator
            .mediaDevices
            .getUserMedia({

                video: {

                    facingMode: {

                        ideal:
                            "environment"

                    },

                    width: {

                        ideal:
                            1920

                    },

                    height: {

                        ideal:
                            1080

                    },

                    frameRate: {

                        ideal:
                            30

                    }

                },

                audio:
                    false

            });


    cameraVideo.srcObject =
        cameraStream;


    await cameraVideo.play();


    cameraVideo.style.display =
        "block";


    /*
     * В fallback нет
     * настоящего world tracking.
     */

    arStatus.textContent =
        "КАМЕРА";

}


/*
======================================================
CLOSE
======================================================
*/

closeButton.addEventListener(

    "click",

    stopAR

);


async function stopAR() {

    /*
     * Anchor
     */

    if (
        anchor
    ) {

        try {

            anchor.delete();

        } catch (_) {}

        anchor =
            null;

    }


    /*
     * XR
     */

    if (
        xrSession
    ) {

        try {

            await xrSession.end();

        } catch (_) {}

        xrSession =
            null;

    }


    /*
     * Camera fallback
     */

    if (
        cameraStream
    ) {

        cameraStream
            .getTracks()
            .forEach(

                function(track) {

                    track.stop();

                }

            );


        cameraStream =
            null;

    }


    cameraVideo.srcObject =
        null;


    /*
     * Telegram sensors
     */

    if (tg) {

        try {

            tg.DeviceOrientation?.stop();

        } catch (_) {}


        try {

            tg.Gyroscope?.stop();

        } catch (_) {}


        try {

            tg.Accelerometer?.stop();

        } catch (_) {}


        try {

            tg.unlockOrientation();

        } catch (_) {}

    }


    /*
     * Renderer
     */

    if (
        renderer
    ) {

        renderer.setAnimationLoop(
            null
        );

    }


    /*
     * UI
     */

    cameraVideo.style.display =
        "none";

    canvas.style.display =
        "none";

    arUI.style.display =
        "none";

    startScreen.style.display =
        "flex";


    startButton.disabled =
        false;


    startStatus.textContent =
        "Готово";


    /*
     * State
     */

    creaturePlaced =
        false;

    currentHit =
        null;


    if (
        creature
    ) {

        creature.visible =
            false;

    }


    reticle.style.display =
        "block";

    reticle.classList.remove(
        "found"
    );

}


/*
======================================================
ERROR
======================================================
*/

function showError(
    message
) {

    errorText.textContent =
        message;

    errorScreen.style.display =
        "flex";

}


/*
======================================================
RESIZE
======================================================
*/

window.addEventListener(

    "resize",

    function() {

        if (
            renderer
        ) {

            renderer.setSize(

                window.innerWidth,

                window.innerHeight

            );

        }


        if (
            xrCamera
        ) {

            xrCamera.aspect =

                window.innerWidth /
                window.innerHeight;


            xrCamera.updateProjectionMatrix();

        }

    }

);

</script>

</body>
