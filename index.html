            );


            /*
             * При потере фокуса очищаем список клавиш.
             */
            addEventListener(
                "blur",
                () => keys.clear()
            );


            /*
             * Пересчитываем размер Canvas
             * при изменении размера окна.
             */
            addEventListener(
                "resize",
                resizeRoom
            );


            /*
             * Запускаем главный цикл комнаты.
             */
            requestAnimationFrame(roomLoop);
        }


        /*
         * FUNCTION: resizeRoom
         *
         * Назначение:
         * Подгоняет камеру и WebGLRenderer
         * под текущий размер окна.
         */
        function resizeRoom() {

            if (
                !roomRenderer ||
                !roomCamera
            ) {
                return;
            }


            roomCamera.aspect =
                innerWidth /
                innerHeight;


            roomCamera.updateProjectionMatrix();


            roomRenderer.setSize(
                innerWidth,
                innerHeight,
                false
            );
        }


        /*
         * FUNCTION: roomLoop
         *
         * Назначение:
         * Главный игровой цикл 3D-комнаты.
         *
         * Выполняет:
         * 1. Чтение клавиатуры.
         * 2. Чтение джойстика.
         * 3. Расчёт направления движения.
         * 4. Перемещение камеры.
         * 5. Ограничение камеры внутри комнаты.
         * 6. Обновление направления взгляда.
         * 7. Рендеринг Three.js-сцены.
         */
        function roomLoop() {

            /*
             * Следующий кадр.
             */
            requestAnimationFrame(roomLoop);


            /*
             * Если экран комнаты не активен,
             * ничего не рендерим.
             */
            if (
                !roomRenderer ||
                !roomViewerScreen
                    .classList
                    .contains("active")
            ) {
                return;
            }


            /*
             * Получаем время между кадрами.
             * Максимум ограничен 0.05 секунды.
             */
            const dt =
                Math.min(
                    roomClock.getDelta(),
                    .05
                );


            /*
             * Вперёд/назад:
             *
             * W / ArrowUp  — вперёд.
             * S / ArrowDown — назад.
             * roomPadY — джойстик.
             */
            let f =
                (
                    keys.has("KeyW") ||
                    keys.has("ArrowUp")
                        ? 1
                        : 0
                ) -
                (
                    keys.has("KeyS") ||
                    keys.has("ArrowDown")
                        ? 1
                        : 0
                ) -
                roomPadY;


            /*
             * Влево/вправо:
             *
             * D / ArrowRight — вправо.
             * A / ArrowLeft — влево.
             * roomPadX — джойстик.
             */
            let s =
                (
                    keys.has("KeyD") ||
                    keys.has("ArrowRight")
                        ? 1
                        : 0
                ) -
                (
                    keys.has("KeyA") ||
                    keys.has("ArrowLeft")
                        ? 1
                        : 0
                ) +
                roomPadX;


            /*
             * Нормализуем диагональное движение,
             * чтобы по диагонали скорость не увеличивалась.
             */
            const len =
                Math.hypot(f, s);


            if (len > 1) {

                f /= len;
                s /= len;
            }


            /*
             * Расчёт скорости движения.
             */
            const sp =
                ROOM_SPEED * dt;


            /*
             * Направление вперёд
             * относительно yaw камеры.
             */
            const fx =
                Math.sin(roomYaw);

            const fz =
                Math.cos(roomYaw);


            /*
             * Направление вправо
             * относительно yaw камеры.
             */
            const rx =
                Math.cos(roomYaw);

            const rz =
                -Math.sin(roomYaw);


            /*
             * Перемещение камеры по X/Z.
             */
            roomCamera.position.x +=
                (
                    fx * f +
                    rx * s
                ) * sp;

            roomCamera.position.z +=
                (
                    fz * f +
                    rz * s
                ) * sp;


            /*
             * Вертикальное движение:
             *
             * R — вверх.
             * F — вниз.
             * verticalInput — кнопки интерфейса.
             */
            const vert =
                (
                    keys.has("KeyR")
                        ? 1
                        : 0
                ) -
                (
                    keys.has("KeyF")
                        ? 1
                        : 0
                ) ||
                verticalInput;


            roomCamera.position.y +=
                vert * sp;


            /*
             * Не позволяем камере выйти за границы комнаты.
             */
            clampCamera();


            /*
             * Обновляем направление взгляда.
             */
            updateCamera();


            /*
             * Рендерим сцену.
             */
            roomRenderer.render(
                roomScene,
                roomCamera
            );
        }


        /* ============================================================
           BUILD ROOM
           ============================================================ */

        /*
         * FUNCTION: buildRoom
         *
         * Назначение:
         * Полностью собирает выбранную комнату:
         *
         * 1. Очищает предыдущую комнату.
         * 2. Запрашивает manifest с PC-сервера.
         * 3. Создаёт 6 поверхностей комнаты.
         * 4. Загружает 6 текстур.
         * 5. Получает информацию о 3D-модели.
         * 6. Загружает 3D-модель.
         * 7. Показывает итоговый статус.
         */
        async function buildRoom(item) {

            /*
             * Удаляем предыдущую комнату.
             */
            clearRoom();


            /*
             * Получаем папку текущей комнаты.
             */
            const folder =
                String(
                    item?.folder ||
                    item?.name ||
                    ""
                ).trim();


            roomStatus(
                `Запрос ROOM ${folder}...`
            );


            /*
             * Запрашиваем данные комнаты.
             */
            const data =
                await requestRoom(item);


            /*
             * Формируем URL текстур.
             */
            const textures =
                resolveTextures(data);


            /*
             * Создаём шесть поверхностей:
             *
             * 01_BACKGROUND — задняя стена.
             * 02_LEFT       — левая стена.
             * 03_RIGHT      — правая стена.
             * 04_FRONT      — передняя стена.
             * 05_SKY        — потолок.
             * 06_GROUND     — земля.
             */
            const surfaces = [

                surface(
                    ROOM_LENGTH,
                    ROOM_HEIGHT,
                    new THREE.Vector3(
                        0,
                        2,
                        3
                    ),
                    new THREE.Euler(
                        0,
                        Math.PI,
                        0
                    ),
                    "01_BACKGROUND"
                ),

                surface(
                    ROOM_WIDTH,
                    ROOM_HEIGHT,
                    new THREE.Vector3(
                        -3.5,
                        2,
                        0
                    ),
                    new THREE.Euler(
                        0,
                        Math.PI / 2,
                        0
                    ),
                    "02_LEFT"
                ),

                surface(
                    ROOM_WIDTH,
                    ROOM_HEIGHT,
                    new THREE.Vector3(
                        3.5,
                        2,
                        0
                    ),
                    new THREE.Euler(
                        0,
                        -Math.PI / 2,
                        0
                    ),
                    "03_RIGHT"
                ),

                surface(
                    ROOM_LENGTH,
                    ROOM_HEIGHT,
                    new THREE.Vector3(
                        0,
                        2,
                        -3
                    ),
                    new THREE.Euler(
                        0,
                        0,
                        0
                    ),
                    "04_FRONT"
                ),

                surface(
                    ROOM_LENGTH,
                    ROOM_WIDTH,
                    new THREE.Vector3(
                        0,
                        4,
                        0
                    ),
                    new THREE.Euler(
                        Math.PI / 2,
                        0,
                        0
                    ),
                    "05_SKY"
                ),

                surface(
                    ROOM_LENGTH,
                    ROOM_WIDTH,
                    new THREE.Vector3(
                        0,
                        0,
                        0
                    ),
                    new THREE.Euler(
                        -Math.PI / 2,
                        0,
                        0
                    ),
                    "06_GROUND"
                )
            ];


            /*
             * Добавляем все поверхности в сцену.
             */
            surfaces.forEach(
                x => roomScene.add(x)
            );


            /*
             * Начальное положение камеры.
             */
            roomCamera.position.set(
                0,
                ROOM_EYE_HEIGHT,
                1
            );


            roomYaw = Math.PI;
            roomPitch =
                roomRoll = 0;


            clampCamera();
            updateCamera();


            /*
             * Счётчик успешно загруженных текстур.
             */
            let n = 0;


            /*
             * Загружаем шесть текстур последовательно.
             */
            for (
                const [key, label]
                of [
                    ["back", "01_BACKGROUND"],
                    ["left", "02_LEFT"],
                    ["right", "03_RIGHT"],
                    ["front", "04_FRONT"],
                    ["ceiling", "05_SKY"],
                    ["floor", "06_GROUND"]
                ]
            ) {

                try {

                    roomStatus(
                        `ROOM ${folder}: ` +
                        `загрузка ${label}.png (${n}/6)`
                    );


                    /*
                     * Загружаем текстуру.
                     */
                    const t =
                        await loadTexture(
                            textures[key],
                            label
                        );


                    /*
                     * Находим соответствующую
                     * поверхность комнаты.
                     */
                    const m =
                        surfaces.find(
                            x =>
                                x.userData
                                    .roomSurface ===
                                label
                        );


                    /*
                     * Назначаем текстуру материалу.
                     */
                    m.material.map = t;

                    m.material.color.set(
                        0xffffff
                    );

                    m.material.needsUpdate =
                        true;


                    n++;

                } catch (e) {

                    /*
                     * Ошибка отдельной текстуры
                     * не останавливает загрузку остальных.
                     */
                    console.warn(e);
                }
            }


            roomStatus(
                `ROOM ${folder}: ` +
                `текстуры ${n}/6.\n` +
                `Загрузка 3D модели...`
            );


            /*
             * Получаем информацию о модели.
             */
            let modelInfo =
                data.model;


            /*
             * Если URL модели отсутствует,
             * запрашиваем его отдельно по ID.
             */
            if (!modelInfo?.url) {

                const id =
                    Number(
                        data.id || 0
                    );


                if (id) {

                    const r =
                        await fetch(
                            `${ROOMS_API}/` +
                            `${encodeURIComponent(folder)}/model` +
                            `?request_id=${id}`,
                            {
                                cache: "no-store"
                            }
                        );


                    if (r.ok) {

                        modelInfo =
                            await r.json();
                    }
                }
            }


            /*
             * Если модель ещё не готова,
             * ожидаем её появления на PC-сервере.
             */
            if (
                modelInfo?.ready === false &&
                modelInfo.url == null
            ) {

                roomStatus(
                    `ROOM ${folder}: ` +
                    `модель ожидается от PC-сервера`
                );

                return;
            }


            /*
             * Загружаем модель,
             * если сервер вернул URL.
             */
            if (modelInfo?.url) {

                modelInfo.room =
                    folder;

                await loadRoomModel(
                    modelInfo
                );
            }


            /*
             * Итоговый статус комнаты.
             */
            roomStatus(
                `ROOM ${folder} готов.\n` +
                `Текстуры: ${n}/6.\n` +
                `3D модель: ` +
                `${
                    modelInfo?.url
                        ? "загружена"
                        : "не получена"
                }`
            );


            /*
             * Через 2.2 секунды скрываем сообщение.
             */
            setTimeout(
                () => {

                    if (
                        roomViewerScreen
                            .classList
                            .contains("active")
                    ) {

                        roomStatus(
                            "",
                            false
                        );
                    }

                },
                2200
            );
        }


        /* ============================================================
           NAVIGATION
           ============================================================ */

        /*
         * Открытие списка комнат.
         */
        $("openRoom").onclick =
            async () => {

                if (!requireAccess()) {
                    return;
                }

                show(roomScreen);

                await loadRooms();
            };


        /*
         * Возврат из списка комнат
         * в главное меню.
         */
        $("roomBack").onclick =
            () => show(homeScreen);


        /*
         * Возврат из 3D-комнаты
         * к списку комнат.
         */
        $("roomViewerBack").onclick =
            () => {

                currentRoom = null;

                clearRoom();

                show(roomScreen);
            };


        /*
         * FUNCTION: openRoom
         *
         * Назначение:
         * Открывает выбранную комнату,
         * инициализирует 3D-просмотр
         * и запускает загрузку комнаты.
         *
         * INPUT:
         * i — индекс комнаты в массиве rooms.
         */
        function openRoom(i) {

            /*
             * Проверяем доступ.
             */
            if (!requireAccess()) {
                return;
            }


            /*
             * Получаем выбранную комнату.
             */
            currentRoom =
                rooms[i];


            /*
             * Получаем номер комнаты.
             */
            const n =
                roomNumber(
                    currentRoom,
                    i
                );


            /*
             * Устанавливаем заголовок.
             */
            roomViewerTitle.textContent =
                `ROOM ${n}`;


            /*
             * Показываем 3D-экран.
             */
            show(roomViewerScreen);


            /*
             * Создаём Three.js Viewer.
             */
            initRoomViewer();


            /*
             * Обновляем размер Canvas.
             */
            resizeRoom();


            /*
             * Загружаем содержимое комнаты.
             */
            buildRoom(currentRoom)
                .catch(e => {

                    console.error(e);

                    roomStatus(
                        `Ошибка ROOM: ${e.message}`
                    );
                });
        }


        /*
         * Открытие экрана генерации.
         */
        $("openGeneration").onclick =
            () => {

                if (!requireAccess()) {
                    return;
                }


                generationCode.value = "";

                generationStatus.textContent =
                    "";

                generationSubmit.disabled =
                    true;

                show(generationScreen);
            };


        /*
         * Возврат из генерации
         * в главное меню.
         */
        $("generationBack").onclick =
            () => show(homeScreen);


        /*
         * Открытие пользовательского экрана.
         */
        $("openUser").onclick =
            () => {

                if (!requireAccess()) {
                    return;
                }


                userWalletAddress.textContent =
                    currentWallet || "";


                show(userScreen);
            };


        /*
         * Возврат из пользовательского экрана.
         */
        $("userBack").onclick =
            () => show(homeScreen);


        /*
         * Отключение TON-кошелька.
         *
         * После отключения:
         * currentWallet = null
         * accessGranted = false
         *
         * Пользователь возвращается
         * на экран авторизации.
         */
        $("disconnectWallet").onclick =
            async () => {

                try {

                    await tonConnectUI.disconnect();

                } finally {

                    currentWallet = null;

                    accessGranted = false;

                    show(authScreen);
                }
            };

    </script>

</body>

</html>
