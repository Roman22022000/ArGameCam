/* =============================================================
   TON ADDRESS
============================================================= */

function base64UrlToBytes(value) {

    let normalized =
        String(value)
            .replace(/-/g, "+")
            .replace(/_/g, "/");


    while (
        normalized.length % 4 !== 0
    ) {

        normalized += "=";

    }


    const binary =
        atob(normalized);


    const bytes =
        new Uint8Array(
            binary.length
        );


    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(i);

    }


    return bytes;

}


function normalizeTonAddress(address) {

    if (!address) {
        return "";
    }


    address =
        String(address).trim();


    /*
        Уже raw:
        0:64hex
    */

    if (
        /^-?\d+:[0-9a-fA-F]{64}$/
            .test(address)
    ) {

        const parts =
            address.split(":");


        return (
            parts[0] +
            ":" +
            parts[1].toLowerCase()
        );

    }


    /*
        Friendly:
        EQ...
        UQ...
    */

    try {

        const bytes =
            base64UrlToBytes(
                address
            );


        if (
            bytes.length !== 36
        ) {

            return address.toLowerCase();

        }


        let workchain =
            bytes[1];


        if (
            workchain === 255
        ) {

            workchain = -1;

        }


        let hash = "";


        for (
            let i = 2;
            i < 34;
            i++
        ) {

            hash +=
                bytes[i]
                    .toString(16)
                    .padStart(2, "0");

        }


        return (
            workchain +
            ":" +
            hash.toLowerCase()
        );

    } catch {

        return address.toLowerCase();

    }

}


const normalizedRequiredCollection =
    normalizeTonAddress(
        REQUIRED_COLLECTION
    );


/* =============================================================
   NFT CHECK
============================================================= */

async function checkCollectionNFT(
    walletAddress
) {

    const url =
        "https://tonapi.io/v2/accounts/" +
        encodeURIComponent(
            walletAddress
        ) +
        "/nfts?limit=1000";


    const response =
        await fetch(url, {

            method: "GET",

            headers: {
                "Accept":
                    "application/json"
            }

        });


    if (!response.ok) {

        throw new Error(
            "TonAPI HTTP " +
            response.status
        );

    }


    const data =
        await response.json();


    const nftItems =
        Array.isArray(
            data.nft_items
        )
            ? data.nft_items
            : [];


    for (
        const nft of nftItems
    ) {

        const collectionAddress =
            nft.collection?.address ||
            nft.collection_address ||
            "";


        if (!collectionAddress) {
            continue;
        }


        const normalized =
            normalizeTonAddress(
                collectionAddress
            );


        if (
            normalized ===
                normalizedRequiredCollection
            ||
            normalized ===
                REQUIRED_COLLECTION_RAW
        ) {

            return true;

        }

    }


    return false;

}


/* =============================================================
   WALLET
============================================================= */

let currentWallet =
    null;

let accessGranted =
    false;

let checkingNFT =
    false;


async function processWallet(
    wallet
) {

    if (!wallet) {

        currentWallet =
            null;

        accessGranted =
            false;

        userWalletAddress.textContent =
            "";

        userStatus.textContent =
            "";

        authStatus.textContent =
            "Подключите TON-кошелёк";

        showScreen(
            authScreen
        );

        return;

    }


    if (
        checkingNFT
    ) {

        return;

    }


    if (
        !wallet.account ||
        !wallet.account.address
    ) {

        return;

    }


    currentWallet =
        wallet.account.address;


    accessGranted =
        false;

    checkingNFT =
        true;


    authStatus.textContent =
        "Проверка NFT...";


    loading.classList.add(
        "active"
    );


    try {

        const hasNFT =
            await checkCollectionNFT(
                currentWallet
            );


        if (!hasNFT) {

            accessGranted =
                false;


            authStatus.textContent =
                "NFT нужной коллекции не найден";


            showScreen(
                authScreen
            );


            return;

        }


        accessGranted =
            true;


        userWalletAddress.textContent =
            currentWallet;


        authStatus.textContent =
            "Доступ разрешён";


        showScreen(
            homeScreen
        );


    } catch (error) {

        console.error(
            "NFT CHECK ERROR:",
            error
        );


        accessGranted =
            false;


        authStatus.textContent =
            "Ошибка проверки NFT";


        showScreen(
            authScreen
        );


    } finally {

        checkingNFT =
            false;


        loading.classList.remove(
            "active"
        );

    }

/* =============================================================
   THREE.JS VIEWER

   Загрузка 3D моделей непосредственно из API GUI-сервера.
   Поддерживаются GLB, GLTF, FBX, OBJ и STL.
   Для GLTF/GLB используются материалы и встроенные текстуры.
   Для FBX/OBJ внешние изображения сопоставляются с файлами
   из /api/archive по имени файла.

   Размер сцены НЕ задаётся вручную.
   Границы рассчитываются по фактическим размерам загруженной
   модели. Граница невидимая и используется только для камеры.
============================================================= */

let scene =
    null;

let camera =
    null;

let renderer =
    null;

let controls =
    null;

let model =
    null;

let viewerOpenedFromArchive =
    false;

let modelBounds =
    null;

let modelCenter =
    new THREE.Vector3();

let modelRadius =
    1;

let cameraMinDistance =
    0.05;

let cameraMaxDistance =
    1000;

let archiveResourceMap =
    new Map();


const loadingManager =
    new THREE.LoadingManager();

const loader =
    new GLTFLoader(
        loadingManager
    );

const fbxLoader =
    new FBXLoader(
        loadingManager
    );

const objLoader =
    new OBJLoader(
        loadingManager
    );

const stlLoader =
    new STLLoader(
        loadingManager
    );


/* =============================================================
   RESOURCE MAP
============================================================= */

function resourceFileName(url) {

    try {

        const clean =
            String(url)
                .split("?")[0]
                .split("#")[0];

        return decodeURIComponent(
            clean
                .substring(
                    clean.lastIndexOf("/") + 1
                )
        ).toLowerCase();

    } catch (error) {

        return String(url)
            .toLowerCase();

    }

}


async function loadArchiveResources() {

    try {

        const response =
            await fetch(
                "https://api.araicameragame.party/api/archive",
                {
                    method: "GET",
                    cache: "no-store"
                }
            );

        if (!response.ok) {
            return;
        }

        const data =
            await response.json();

        const items =
            Array.isArray(data.items)
                ? data.items
                : [];

        archiveResourceMap.clear();

        items.forEach(
            item => {

                if (!item || !item.filename || !item.url) {
                    return;
                }

                const key =
                    resourceFileName(
                        item.filename
                    );

                const url =
                    new URL(
                        item.url,
                        "https://api.araicameragame.party"
                    ).href;

                /*
                   Сначала предпочитаем файл из папки texture.
                   Если такой файл отсутствует, оставляем первый
                   найденный файл с тем же именем.
                */
                const isTextureFolder =
                    String(item.folder || "")
                        .toLowerCase()
                        .includes("texture");

                if (
                    !archiveResourceMap.has(key) ||
                    isTextureFolder
                ) {
                    archiveResourceMap.set(
                        key,
                        url
                    );
                }

            }
        );

    } catch (error) {

        console.warn(
            "RESOURCE MAP ERROR:",
            error
        );

    }

}


/* =============================================================
   RESOURCE URL RESOLVER

   ВАЖНО:
   URL самой модели НЕ перенаправляется.
   Меняются только внешние ресурсы, например texture.png.
============================================================= */

loadingManager.setURLModifier(
    resourceUrl => {

        if (
            resourceUrl.startsWith("data:") ||
            resourceUrl.startsWith("blob:")
        ) {
            return resourceUrl;
        }

        const key =
            resourceFileName(
                resourceUrl
            );

        const mapped =
            archiveResourceMap.get(
                key
            );

        if (mapped) {
            return mapped;
        }

        return resourceUrl;

    }
);


/* =============================================================
   VIEWER INIT
============================================================= */

function initViewer() {

    if (renderer) {
        return;
    }


    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0x000000
        );


    camera =
        new THREE.PerspectiveCamera(
            45,
            window.innerWidth /
                window.innerHeight,
            0.01,
            10000
        );


    camera.position.set(
        0,
        0.3,
        3
    );


    renderer =
        new THREE.WebGLRenderer({
            antialias: true,
            alpha: false
        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    viewerCanvas.appendChild(
        renderer.domElement
    );


    controls =
        new OrbitControls(
            camera,
            renderer.domElement
        );


    controls.enableDamping =
        true;

    controls.enablePan =
        true;

    controls.minDistance =
        0.05;

    controls.maxDistance =
        10000;

    controls.screenSpacePanning =
        true;


    renderer.domElement.style.touchAction =
        "none";


    const ambient =
        new THREE.AmbientLight(
            0xffffff,
            2
        );


    scene.add(
        ambient
    );


    const light =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );


    light.position.set(
        4,
        5,
        4
    );


    scene.add(
        light
    );


    const light2 =
        new THREE.DirectionalLight(
            0xffffff,
            1.5
        );


    light2.position.set(
        -4,
        2,
        -4
    );


    scene.add(
        light2
    );


    window.addEventListener(
        "resize",
        resizeViewer
    );


    animateViewer();

}


function resizeViewer() {

    if (
        !camera ||
        !renderer
    ) {
        return;
    }


    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}


/* =============================================================
   MODEL RESOURCE CLEANUP
============================================================= */

function disposeModel(object) {

    if (!object) {
        return;
    }


    object.traverse(
        child => {

            if (child.geometry) {
                child.geometry.dispose();
            }

            if (!child.material) {
                return;
            }

            const materials =
                Array.isArray(
                    child.material
                )
                    ? child.material
                    : [child.material];

            materials.forEach(
                material => {

                    if (!material) {
                        return;
                    }

                    /*
                       Не удаляем texture здесь.
                       Одна и та же текстура может быть
                       использована несколькими материалами.
                    */

                    material.dispose();

                }
            );

        }
    );

}


function clearModel() {

    if (!model) {
        return;
    }


    scene.remove(
        model
    );


    disposeModel(
        model
    );


    model =
        null;


    modelBounds =
        null;

}


/* =============================================================
   MODEL NORMALIZATION

   Никаких 4x7x4.
   Модель масштабируется относительно собственного размера.
============================================================= */

function prepareModel(object) {

    const box =
        new THREE.Box3()
            .setFromObject(
                object
            );


    if (box.isEmpty()) {
        throw new Error(
            "У модели отсутствует геометрия."
        );
    }


    const center =
        box.getCenter(
            new THREE.Vector3()
        );


    const size =
        box.getSize(
            new THREE.Vector3()
        );


    const maxSize =
        Math.max(
            size.x,
            size.y,
            size.z
        );


    if (
        !Number.isFinite(maxSize) ||
        maxSize <= 0
    ) {
        throw new Error(
            "Некорректный размер 3D модели."
        );
    }


    object.position.sub(
        center
    );


    /*
       Единая нормализация.
       Не зависит от исходных размеров модели.
    */

    const targetSize =
        2.0;

    object.scale.setScalar(
        targetSize / maxSize
    );


    object.updateMatrixWorld(
        true
    );


    const finalBox =
        new THREE.Box3()
            .setFromObject(
                object
            );


    const finalCenter =
        finalBox.getCenter(
            new THREE.Vector3()
        );


    object.position.sub(
        finalCenter
    );


    object.updateMatrixWorld(
        true
    );


    modelBounds =
        new THREE.Box3()
            .setFromObject(
                object
            );


    modelCenter =
        modelBounds.getCenter(
            new THREE.Vector3()
        );


    const sphere =
        modelBounds.getBoundingSphere(
            new THREE.Sphere()
        );


    modelRadius =
        Math.max(
            sphere.radius,
            0.001
        );


    /*
       Невидимая граница рассчитывается
       только от фактического размера модели.
    */

    cameraMinDistance =
        Math.max(
            modelRadius * 0.18,
            0.03
        );

    cameraMaxDistance =
        Math.max(
            modelRadius * 20,
            20
        );


    controls.target.copy(
        modelCenter
    );


    const direction =
        new THREE.Vector3(
            0,
            0.15,
            1
        ).normalize();


    camera.position.copy(
        modelCenter
            .clone()
            .add(
                direction.multiplyScalar(
                    Math.max(
                        modelRadius * 3,
                        2.5
                    )
                )
            )
    );


    controls.minDistance =
        cameraMinDistance;

    controls.maxDistance =
        cameraMaxDistance;

    controls.update();


    object.traverse(
        child => {

            if (!child.isMesh) {
                return;
            }

            child.castShadow =
                true;

            child.receiveShadow =
                true;

            const materials =
                Array.isArray(
                    child.material
                )
                    ? child.material
                    : [child.material];

            materials.forEach(
                material => {

                    if (!material) {
                        return;
                    }

                    if (material.map) {
                        material.map.colorSpace =
                            THREE.SRGBColorSpace;
                    }

                    if (material.emissiveMap) {
                        material.emissiveMap.colorSpace =
                            THREE.SRGBColorSpace;
                    }

                    material.needsUpdate =
                        true;

                }
            );

        }
    );

}


/* =============================================================
   INVISIBLE SCENE LIMIT

   Ограничение строится по реальным координатам модели.
   Никаких фиксированных 4x7x4.
============================================================= */

function clampCameraToScene() {

    if (
        !camera ||
        !modelBounds
    ) {
        return;
    }


    const margin =
        Math.max(
            modelRadius * 0.35,
            0.15
        );


    const minX =
        modelBounds.min.x - margin;

    const maxX =
        modelBounds.max.x + margin;

    const minY =
        modelBounds.min.y - margin;

    const maxY =
        modelBounds.max.y + margin;

    const minZ =
        modelBounds.min.z - margin;

    const maxZ =
        modelBounds.max.z + margin;


    camera.position.x =
        THREE.MathUtils.clamp(
            camera.position.x,
            minX,
            maxX
        );

    camera.position.y =
        THREE.MathUtils.clamp(
            camera.position.y,
            minY,
            maxY
        );

    camera.position.z =
        THREE.MathUtils.clamp(
            camera.position.z,
            minZ,
            maxZ
        );


    const distance =
        camera.position.distanceTo(
            modelCenter
        );


    /*
       Не позволяем камере физически
       войти в общий объём модели.
       Это невидимое математическое
       ограничение, пользователю его не видно.
    */

    if (
        distance < cameraMinDistance
    ) {

        let direction =
            camera.position
                .clone()
                .sub(modelCenter);

        if (direction.lengthSq() < 0.000001) {
            direction.set(
                0,
                0,
                1
            );
        }

        direction.normalize();

        camera.position.copy(
            modelCenter
                .clone()
                .add(
                    direction.multiplyScalar(
                        cameraMinDistance
                    )
                )
        );

    }

}


/* =============================================================
   ANIMATION
============================================================= */

function animateViewer() {

    requestAnimationFrame(
        animateViewer
    );


    if (controls) {
        controls.update();
    }


    clampCameraToScene();


    if (
        renderer &&
        scene &&
        camera
    ) {

        renderer.render(
            scene,
            camera
        );

    }

}


/* =============================================================
   LOAD GLTF / GLB
============================================================= */

function loadGLTFModel(url) {

    return new Promise(
        (resolve, reject) => {

            loader.load(

                url,

                result => {
                    resolve(
                        result.scene
                    );
                },

                progress => {

                    if (
                        progress &&
                        progress.total > 0
                    ) {

                        const percent =
                            Math.round(
                                progress.loaded /
                                progress.total *
                                100
                            );

                        console.log(
                            "3D loading:",
                            percent + "%"
                        );

                    }

                },

                error => {
                    reject(error);
                }

            );

        }
    );

}

   LOAD FBX

function loadFBXModel(url) {

/* =============================================================

============================================================= */

function loadSTLModel(url) {

    return new Promise(
        (resolve, reject) => {

            stlLoader.load(

                url,

                geometry => {

                    geometry.computeVertexNormals();

                    const material =
                        new THREE.MeshStandardMaterial({
                            color: 0xffffff,
                            roughness: 0.65,
                            metalness: 0.05
                        });

                    const mesh =
                        new THREE.Mesh(
                            geometry,
                            material
                        );

                    resolve(mesh);

                },

                progress => {

                    if (
                        progress &&
                        progress.total > 0
                    ) {

                        console.log(
                            "STL loading:",
                            Math.round(
                                progress.loaded /
                                progress.total *
                                100
                            ) + "%"
                        );

                    }

                },

                error => {
                    reject(error);
                }

            );

        }
    );

}


/* =============================================================
   LOAD BY EXTENSION
============================================================= */

async function loadModelByExtension(
    item
) {

    const url =
        new URL(
            item.url,
            ARCHIVE_API
        ).href;


    const extension =
        (
            item.extension ||
            item.filename ||
            ""
        )
            .split("?")[0]
            .split(".")
            .pop()
            .toLowerCase();


    if (
        extension === "glb" ||
        extension === "gltf"
    ) {

        return loadGLTFModel(
            url
        );

    }


    if (
        extension === "fbx"
    ) {

        return loadFBXModel(
            url
        );

    }


    if (
        extension === "obj"
    ) {

        return loadOBJModel(
            url
        );

    }


    if (
        extension === "stl"
    ) {

        return loadSTLModel(
            url
        );

    }


    throw new Error(
        "Формат не поддерживается: ." +
        extension
    );

}


/* =============================================================
   OPEN ARCHIVE MODEL
============================================================= */

async function openArchiveViewer(index) {

    viewerOpenedFromArchive =
        true;


    if (!requireAccess()) {
        return;
    }


    const item =
        archiveModels[index];


    if (!item) {
        return;
    }


    viewerNumber.textContent =
        item.filename || "3D";


    showScreen(
        viewerScreen
    );


    initViewer();


    clearModel();


    try {

        if (
            archiveResourceMap.size === 0
        ) {
            await loadArchiveResources();
        }


        console.log(
            "LOAD MODEL:",
            item.filename,
            item.url
        );


        const object =
            await loadModelByExtension(
                item
            );


        if (!object) {
            throw new Error(
                "Сервер вернул пустую модель."
            );
        }


        prepareModel(
            object
        );


        model =
            object;


        scene.add(
            model
        );


        controls.target.copy(
            modelCenter
        );


        controls.update();


        console.log(
            "MODEL LOADED:",
            item.filename,
            modelBounds
        );

    } catch (error) {

        console.error(
            "ARCHIVE MODEL ERROR:",
            error
        );

        viewerNumber.textContent =
            "ОШИБКА: " +
            (
                item.filename ||
                "3D"
            );

        alert(
            "Не удалось загрузить 3D модель.\n\n" +
            "Файл: " +
            (
                item.filename ||
                "—"
            ) +
            "\n\nПричина: " +
            (
                error && error.message
                    ? error.message
                    : String(error)
            )
        );

    }

}


/* =============================================================
   OPEN GALLERY MODEL
============================================================= */

async function openViewer(index) {

    viewerOpenedFromArchive =
        false;


    if (!requireAccess()) {
        return;
    }


    const item =
        galleryItems[index];


    if (!item) {
        return;
    }


    viewerNumber.textContent =
        item.number;


    showScreen(
        viewerScreen
    );


    initViewer();


    clearModel();


    try {

        const object =
            await loadGLTFModel(
                MODEL_BASE +
                encodeURIComponent(
                    item.filename
                )
            );


        prepareModel(
            object
        );


        model =
            object;


        scene.add(
            model
        );


        controls.target.copy(
            modelCenter
        );


        controls.update();


    } catch (error) {

        console.error(
            "MODEL ERROR:",
            error
        );

        alert(
            "Не удалось загрузить модель:\n\n" +
            (
                error && error.message
                    ? error.message
                    : String(error)
            )
        );

    }

}


/* =============================================================
   ARCHIVE

   API /api/models уже формируется GUI-сервером.
   Сервер сканирует папку 3d_model автоматически.
============================================================= */

let archiveModels = [];


async function loadArchiveModels() {

    archiveStatus.textContent =
        "Загрузка 3D моделей...";

    archiveGrid.innerHTML =
        "";


    try {

        const response =
            await fetch(
                ARCHIVE_API,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {
            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const data =
            await response.json();


        archiveModels =
            Array.isArray(data.items)
                ? data.items
                : [];


        if (!archiveModels.length) {

            archiveStatus.textContent =
                "В архиве пока нет 3D моделей.";

            return;

        }


        archiveStatus.textContent =
            "Моделей: " +
            archiveModels.length;


        archiveModels.forEach(
            (item, index) => {

                const button =
                    document.createElement(
                        "button"
                    );

                button.type =
                    "button";

                button.className =
                    "archiveItem";


                const preview =
                    document.createElement(
                        "div"
                    );

                preview.className =
                    "archivePlaceholder";

                preview.textContent =
                    "3D";

                button.appendChild(
                    preview
                );


                const info =
                    document.createElement(
                        "div"
                    );

                info.className =
                    "archiveInfo";


                const name =
                    document.createElement(
                        "div"
                    );

                name.className =
                    "archiveName";

                name.textContent =
                    item.filename ||
                    "model";

                info.appendChild(
                    name
                );


                const folder =
                    document.createElement(
                        "div"
                    );

                folder.className =
                    "archiveFolder";

                folder.textContent =
                    (
                        item.folder ||
                        ""
                    ).toUpperCase();

                info.appendChild(
                    folder
                );


                const format =
                    document.createElement(
                        "div"
                    );

                format.className =
                    "archiveFolder";

                format.textContent =
                    (
                        item.extension ||
                        ""
                    ).toUpperCase();

                info.appendChild(
                    format
                );


                button.appendChild(
                    info
                );


                button.addEventListener(
                    "click",
                    () => {
                        openArchiveViewer(
                            index
                        );
                    }
                );


                archiveGrid.appendChild(
                    button
                );

            }
        );


        /*
           Загружаем карту текстур заранее.
           Сама модель при этом не загружается.
        */

        loadArchiveResources();

    } catch (error) {

        console.error(
            "ARCHIVE ERROR:",
            error
        );

        archiveStatus.textContent =
            "Не удалось получить архив.";

    }

}
