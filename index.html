<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="
        width=device-width,
        initial-scale=1,
        maximum-scale=1,
        user-scalable=no,
        viewport-fit=cover
    "
>

<meta
    name="theme-color"
    content="#000000"
>

<title>AR World 6DoF</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>


<style>

/* =========================================================
   RESET
========================================================= */

* {

    box-sizing: border-box;

    margin: 0;

    padding: 0;

    -webkit-tap-highlight-color: transparent;

}


html,
body {

    width: 100%;

    height: 100%;

    overflow: hidden;

    background: #000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    touch-action: none;

    user-select: none;

    -webkit-user-select: none;

}


/* =========================================================
   APP
========================================================= */

#app {

    position: fixed;

    inset: 0;

    overflow: hidden;

    background: #000;

}


/* =========================================================
   CAMERA VIDEO
========================================================= */

#camera {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    object-fit: cover;

    background: #000;

    z-index: 1;

    display: none;

}


/* =========================================================
   THREE CANVAS
========================================================= */

#threeCanvas {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    z-index: 2;

    display: none;

    pointer-events: none;

}


/* =========================================================
   START SCREEN
========================================================= */

#start {

    position: absolute;

    inset: 0;

    z-index: 100;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    padding: 25px;

    text-align: center;

    color: white;

    background:

        radial-gradient(

            circle at center,

            #273a44 0%,

            #11191e 55%,

            #050709 100%

        );

}


#start h1 {

    font-size: 38px;

    margin-bottom: 14px;

}


#start p {

    max-width: 390px;

    font-size: 14px;

    line-height: 1.55;

    opacity: .72;

    margin-bottom: 20px;

}


/* =========================================================
   BUTTON
========================================================= */

.mainButton {

    width: 285px;

    min-height: 54px;

    margin-top: 10px;

    border: none;

    border-radius: 15px;

    background: white;

    color: #111;

    font-size: 16px;

    font-weight: 700;

}


.mainButton:active {

    transform: scale(.97);

}


/* =========================================================
   STATUS
========================================================= */

#status {

    position: absolute;

    left: 50%;

    top:

        calc(

            60px +

            env(safe-area-inset-top)

        );

    transform:

        translateX(-50%);

    width:

        calc(100% - 30px);

    max-width: 500px;

    padding: 10px 14px;

    z-index: 50;

    border-radius: 12px;

    background:

        rgba(0,0,0,.68);

    color: white;

    text-align: center;

    font-size: 12px;

    backdrop-filter:
        blur(12px);

    pointer-events: none;

}


/* =========================================================
   TOP BAR
========================================================= */

#topBar {

    position: absolute;

    left: 12px;

    right: 12px;

    top:

        calc(

            10px +

            env(safe-area-inset-top)

        );

    z-index: 40;

    display: none;

    align-items: center;

    justify-content:
        space-between;

}


.badge {

    padding: 8px 11px;

    border-radius: 12px;

    background:

        rgba(0,0,0,.68);

    color: white;

    font-size: 11px;

    backdrop-filter:
        blur(10px);

}


/* =========================================================
   CLOSE
========================================================= */

#close {

    position: absolute;

    right: 12px;

    top:

        calc(

            58px +

            env(safe-area-inset-top)

        );

    z-index: 70;

    width: 43px;

    height: 43px;

    border: none;

    border-radius: 12px;

    background:

        rgba(0,0,0,.72);

    color: white;

    font-size: 22px;

    display: none;

}


/* =========================================================
   DEBUG
========================================================= */

#debug {

    position: absolute;

    left: 10px;

    top: 115px;

    z-index: 45;

    display: none;

    min-width: 190px;

    padding: 10px;

    border-radius: 10px;

    background:

        rgba(0,0,0,.72);

    color: white;

    font-family:
        monospace;

    font-size: 9px;

    line-height: 1.55;

    pointer-events: none;

}


/* =========================================================
   CONTROLS
========================================================= */

#controls {

    position: absolute;

    right: 10px;

    top: 115px;

    z-index: 50;

    display: none;

    flex-direction: column;

    gap: 7px;

}


.control {

    min-width: 58px;

    min-height: 44px;

    padding: 7px;

    border: none;

    border-radius: 12px;

    background:

        rgba(0,0,0,.72);

    color: white;

    font-size: 13px;

    backdrop-filter:
        blur(10px);

}


#placeButton {

    display: none;

    font-weight: bold;

}


/* =========================================================
   RETICLE
========================================================= */

#reticle {

    position: absolute;

    left: 50%;

    top: 50%;

    width: 44px;

    height: 44px;

    transform:
        translate(-50%,-50%);

    border:
        2px solid white;

    border-radius: 50%;

    z-index: 35;

    display: none;

    opacity: .8;

}


#reticle::before {

    content: "";

    position: absolute;

    left: 50%;

    top: 50%;

    width: 14px;

    height: 2px;

    transform:
        translate(-50%,-50%);

    background: white;

}


#reticle::after {

    content: "";

    position: absolute;

    left: 50%;

    top: 50%;

    width: 2px;

    height: 14px;

    transform:
        translate(-50%,-50%);

    background: white;

}


/* =========================================================
   SCENE PANEL
========================================================= */

#scenePanel {

    position: absolute;

    left: 0;

    right: 0;

    bottom: 0;

    z-index: 60;

    display: none;

    padding:

        10px

        10px

        calc(

            10px +

            env(safe-area-inset-bottom)

        );

    background:

        linear-gradient(

            to top,

            rgba(0,0,0,.97),

            rgba(0,0,0,.72)

        );

    backdrop-filter:
        blur(16px);

    color: white;

}


#sceneHeader {

    display: flex;

    align-items: center;

    justify-content:
        space-between;

    margin-bottom: 8px;

}


#sceneTitle {

    font-size: 13px;

    font-weight: bold;

}


#sceneHint {

    font-size: 10px;

    opacity: .55;

}


#sceneList {

    display: flex;

    gap: 8px;

    overflow-x: auto;

    scrollbar-width: none;

}


#sceneList::-webkit-scrollbar {

    display: none;

}


/* =========================================================
   SCENE CARD
========================================================= */

.sceneCard {

    flex: 0 0 82px;

    width: 82px;

    height: 88px;

    border:

        1px solid
        rgba(255,255,255,.15);

    border-radius: 13px;

    overflow: hidden;

    background:

        rgba(255,255,255,.08);

    color: white;

}


.sceneCard.active {

    border:
        2px solid white;

    background:

        rgba(255,255,255,.18);

}


.scenePreview {

    height: 58px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 26px;

    background:

        linear-gradient(

            135deg,

            #26343c,

            #101519

        );

}


.sceneName {

    height: 28px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 9px;

}

</style>

</head>

     THREE

<script type="importmap">

{

    "imports": {

        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

<script type="module">


import * as THREE
from "three";


import {
    GLTFLoader
}
from
"three/addons/loaders/GLTFLoader.js";



/* =========================================================
   TELEGRAM
========================================================= */

const tg =
    window.Telegram?.WebApp ||
    null;


if (
    tg
) {

    tg.ready();

    tg.expand();


    if (
        tg.disableVerticalSwipes
    ) {

        tg.disableVerticalSwipes();

    }

}



/* =========================================================
   ELEMENTS
========================================================= */

const startScreen =
    document.getElementById(
        "start"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const xrStartButton =
    document.getElementById(
        "xrStartButton"
    );


const cameraVideo =
    document.getElementById(
        "camera"
    );


const canvas =
    document.getElementById(
        "threeCanvas"
    );


const status =
    document.getElementById(
        "status"
    );


const topBar =
    document.getElementById(
        "topBar"
    );


const trackingBadge =
    document.getElementById(
        "trackingBadge"
    );


const debug =
    document.getElementById(
        "debug"
    );


const controls =
    document.getElementById(
        "controls"
    );


const placeButton =
    document.getElementById(
        "placeButton"
    );


const resetButton =
    document.getElementById(
        "resetButton"
    );


const minusButton =
    document.getElementById(
        "minusButton"
    );


const plusButton =
    document.getElementById(
        "plusButton"
    );


const closeButton =
    document.getElementById(
        "close"
    );


const scenePanel =
    document.getElementById(
        "scenePanel"
    );


const reticle =
    document.getElementById(
        "reticle"
    );



/* =========================================================
   THREE
========================================================= */

let renderer =
    null;


let scene =
    null;


let camera3D =
    null;


let model =
    null;



/* =========================================================
   MODEL
========================================================= */

let currentModel =
    "creature.glb";


let currentName =
    "Creature";


let modelScale =
    1;


/*
 * ЭТО КООРДИНАТА ОБЪЕКТА
 * В WORLD SPACE.
 *
 * После закрепления она
 * не изменяется при движении
 * телефона.
 */

const objectWorldPosition =
    new THREE.Vector3();


const objectWorldQuaternion =
    new THREE.Quaternion();


let objectLocked =
    false;



/* =========================================================
   TELEGRAM ORIENTATION
========================================================= */

let alpha =
    0;


let beta =
    0;


let gamma =
    0;


let orientationAvailable =
    false;


let orientationInitialized =
    false;


let initialOrientation =
    new THREE.Quaternion();


let currentOrientation =
    new THREE.Quaternion();


let relativeOrientation =
    new THREE.Quaternion();



/* =========================================================
   GYROSCOPE
========================================================= */

let gyroX =
    0;


let gyroY =
    0;


let gyroZ =
    0;



/* =========================================================
   ACCELEROMETER
========================================================= */

let accX =
    0;


let accY =
    0;


let accZ =
    0;


let accelerationAvailable =
    false;



/* =========================================================
   ESTIMATED CAMERA POSITION
========================================================= */

const estimatedCameraPosition =
    new THREE.Vector3();


const estimatedVelocity =
    new THREE.Vector3();


const estimatedAcceleration =
    new THREE.Vector3();


const gravityVector =
    new THREE.Vector3();


const gravityAccumulator =
    new THREE.Vector3();


let gravitySamples =
    0;


let gravityReady =
    false;


const GRAVITY_SAMPLE_COUNT =
    40;



/* =========================================================
   XR
========================================================= */

let xrSession =
    null;


let xrReferenceSpace =
    null;


let xrViewerSpace =
    null;


let xrHitTestSource =
    null;


let xrActive =
    false;


let xrObjectPlaced =
    false;


let xrHasHit =
    false;


let xrLastHitPosition =
    new THREE.Vector3();


let xrLastHitQuaternion =
    new THREE.Quaternion();



/* =========================================================
   TIME
========================================================= */

let previousTime =
    performance.now();



/* =========================================================
   HELPERS
========================================================= */

function setStatus(
    text
) {

    status.textContent =
        text;

}



/* =========================================================
   THREE INIT
========================================================= */

function initThree() {

    if (
        renderer
    ) {

        return;

    }


    scene =
        new THREE.Scene();


    camera3D =
        new THREE.PerspectiveCamera(

            60,

            window.innerWidth /
            window.innerHeight,

            0.01,

            1000

        );


    camera3D.position.set(

        0,
        0,
        0

    );


    camera3D.quaternion.identity();


    renderer =
        new THREE.WebGLRenderer({

            canvas:
                canvas,

            alpha:
                true,

            antialias:
                true

        });


    renderer.setPixelRatio(

        Math.min(

            window.devicePixelRatio,

            2

        )

    );


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    renderer.setClearColor(

        0x000000,

        0

    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    /*
     * Свет.
     */

    const hemisphere =
        new THREE.HemisphereLight(

            0xffffff,

            0x444444,

            2

        );


    scene.add(
        hemisphere
    );


    const directional =
        new THREE.DirectionalLight(

            0xffffff,

            2

        );


    directional.position.set(

        3,
        5,
        3

    );


    scene.add(
        directional
    );


    /*
     * Не привязываем модель
     * к камере.
     */

}



/* =========================================================
   LOAD MODEL
========================================================= */

function loadModel(
    filename,
    name
) {

    initThree();


    currentModel =
        filename;


    currentName =
        name;


    setStatus(

        "Загрузка " +
        name +
        "..."

    );


    if (
        model
    ) {

        scene.remove(
            model
        );

        model =
            null;

    }


    const loader =
        new GLTFLoader();


    loader.load(

        "./models/" +
        filename,


        gltf => {

            model =
                gltf.scene;


            model.scale.set(

                modelScale,
                modelScale,
                modelScale

            );


            /*
             * Если объект уже был
             * закреплён, новый объект
             * получает ту же мировую
             * координату.
             */

            if (
                objectLocked
            ) {

                model.position.copy(

                    objectWorldPosition

                );


                model.quaternion.copy(

                    objectWorldQuaternion

                );

            }
            else {

                /*
                 * Пока не закреплён —
                 * временная позиция
                 * перед камерой.
                 */

                const forward =
                    new THREE.Vector3(

                        0,
                        0,
                        -1

                    );


                forward.applyQuaternion(

                    camera3D.quaternion

                );


                model.position.copy(

                    camera3D.position

                );


                model.position.addScaledVector(

                    forward,

                    3

                );


                model.position.y -=
                    0.5;

            }


            scene.add(
                model
            );


            setStatus(

                name +
                " загружен"

            );

        },


        undefined,


        error => {

            console.error(
                error
            );


            setStatus(

                "Ошибка загрузки " +
                filename

            );

        }

    );

}



/* =========================================================
   DEVICE ORIENTATION
========================================================= */

function getOrientationQuaternion() {

    const euler =
        new THREE.Euler(

            beta,

            alpha,

            -gamma,

            "YXZ"

        );


    const quaternion =
        new THREE.Quaternion();


    quaternion.setFromEuler(
        euler
    );


    /*
     * Поворот экрана.
     */

    const screenAngle =

        window
            .screen
            ?.orientation
            ?.angle || 0;


    const screenQuaternion =
        new THREE.Quaternion();


    screenQuaternion.setFromAxisAngle(

        new THREE.Vector3(
            0,
            0,
            1
        ),

        THREE.MathUtils.degToRad(

            -screenAngle

        )

    );


    quaternion.multiply(
        screenQuaternion
    );


    return quaternion;

}



/* =========================================================
   UPDATE ORIENTATION
========================================================= */

function updateOrientation() {

    if (
        xrActive
    ) {

        return;

    }


    currentOrientation.copy(

        getOrientationQuaternion()

    );


    if (
        !orientationInitialized
    ) {

        initialOrientation.copy(

            currentOrientation

        );


        orientationInitialized =
            true;

    }


    const inverseInitial =

        initialOrientation
            .clone()
            .invert();


    relativeOrientation.copy(

        inverseInitial
            .multiply(

                currentOrientation

            )

    );


    /*
     * ВАЖНО:
     *
     * Меняем КАМЕРУ.
     *
     * Не модель.
     */

    camera3D.quaternion.slerp(

        relativeOrientation,

        0.25

    );

}



/* =========================================================
   TELEGRAM ORIENTATION
========================================================= */

function startTelegramOrientation() {

    if (
        !tg ||
        !tg.DeviceOrientation
    ) {

        return;

    }


    tg.DeviceOrientation.start(

        {

            refresh_rate:
                20,

            need_absolute:
                false

        },

        success => {

            console.log(

                "DeviceOrientation:",
                success

            );

        }

    );


    tg.onEvent(

        "deviceOrientationChanged",

        () => {

            const data =
                tg.DeviceOrientation;


            alpha =
                data.alpha || 0;


            beta =
                data.beta || 0;


            gamma =
                data.gamma || 0;


            orientationAvailable =
                true;

        }

    );


    tg.onEvent(

        "deviceOrientationFailed",

        error => {

            console.error(

                "Orientation:",
                error

            );

        }

    );

}



/* =========================================================
   TELEGRAM GYROSCOPE
========================================================= */

function startTelegramGyroscope() {

    if (
        !tg ||
        !tg.Gyroscope
    ) {

        return;

    }


    tg.Gyroscope.start(

        {

            refresh_rate:
                20

        },

        success => {

            console.log(

                "Gyroscope:",
                success

            );

        }

    );


    tg.onEvent(

        "gyroscopeChanged",

        () => {

            const data =
                tg.Gyroscope;


            gyroX =
                data.x || 0;


            gyroY =
                data.y || 0;


            gyroZ =
                data.z || 0;

        }

    );

}



/* =========================================================
   TELEGRAM ACCELEROMETER
========================================================= */

function startTelegramAccelerometer() {

    if (
        !tg ||
        !tg.Accelerometer
    ) {

        return;

    }


    tg.Accelerometer.start(

        {

            refresh_rate:
                20

        },

        success => {

            console.log(

                "Accelerometer:",
                success

            );

        }

    );


    tg.onEvent(

        "accelerometerChanged",

        () => {

            const data =
                tg.Accelerometer;


            accX =
                data.x || 0;


            accY =
                data.y || 0;


            accZ =
                data.z || 0;


            accelerationAvailable =
                true;

        }

    );

}



/* =========================================================
   BROWSER SENSOR FALLBACK
========================================================= */

function startBrowserSensors() {

    window.addEventListener(

        "deviceorientation",

        event => {

            if (
                orientationAvailable
            ) {

                return;

            }


            alpha =

                THREE.MathUtils
                    .degToRad(

                        event.alpha || 0

                    );


            beta =

                THREE.MathUtils
                    .degToRad(

                        event.beta || 0

                    );


            gamma =

                THREE.MathUtils
                    .degToRad(

                        event.gamma || 0

                    );


            orientationAvailable =
                true;

        },

        true

    );


    window.addEventListener(

        "devicemotion",

        event => {

            if (
                !accelerationAvailable &&
                event.acceleration
            ) {

                accX =
                    event.acceleration.x || 0;


                accY =
                    event.acceleration.y || 0;


                accZ =
                    event.acceleration.z || 0;


                accelerationAvailable =
                    true;

            }


            if (
                event.rotationRate
            ) {

                gyroX =

                    THREE.MathUtils
                        .degToRad(

                            event.rotationRate
                                .alpha || 0

                        );


                gyroY =

                    THREE.MathUtils
                        .degToRad(

                            event.rotationRate
                                .beta || 0

                        );


                gyroZ =

                    THREE.MathUtils
                        .degToRad(

                            event.rotationRate
                                .gamma || 0

                        );

            }

        },

        true

    );

}



/* =========================================================
   START SENSORS
========================================================= */

function startSensors() {

    startBrowserSensors();


    startTelegramOrientation();

    startTelegramGyroscope();

    startTelegramAccelerometer();


    setTimeout(

        () => {

            const states = [];


            if (
                orientationAvailable
            ) {

                states.push(
                    "ROT"
                );

            }


            if (
                Math.abs(gyroX) +
                Math.abs(gyroY) +
                Math.abs(gyroZ)
                > 0.001
            ) {

                states.push(
                    "GYRO"
                );

            }


            if (
                accelerationAvailable
            ) {

                states.push(
                    "ACC"
                );

            }


            trackingBadge.textContent =

                states.length

                    ? states.join(
                        " + "
                    )

                    : "NO SENSOR";

        },

        1500

    );

}



/* =========================================================
   ACCELEROMETER POSITION ESTIMATE
========================================================= */

function updateEstimatedPosition(
    dt
) {

    if (
        xrActive
    ) {

        return;

    }


    if (
        !accelerationAvailable
    ) {

        return;

    }


    const raw =
        new THREE.Vector3(

            accX,
            accY,
            accZ

        );


    /*
     * Переводим ускорение
     * в мировую систему.
     */

    raw.applyQuaternion(

        currentOrientation

    );


    /*
     * Калибровка gravity.
     */

    if (
        gravitySamples
        <
        GRAVITY_SAMPLE_COUNT
    ) {

        gravityAccumulator.add(
            raw
        );


        gravitySamples++;


        if (
            gravitySamples ===
            GRAVITY_SAMPLE_COUNT
        ) {

            gravity.copy(

                gravityAccumulator
                    .clone()
                    .multiplyScalar(

                        1 /
                        GRAVITY_SAMPLE_COUNT

                    )

            );


            gravityReady =
                true;

        }


        return;

    }


    if (
        !gravityReady
    ) {

        return;

    }


    /*
     * Убираем gravity.
     */

    estimatedAcceleration.copy(
        raw
    );


    estimatedAcceleration.sub(
        gravity
    );


    /*
     * Dead zone.
     */

    const deadZone =
        0.18;


    if (
        Math.abs(
            estimatedAcceleration.x
        )
        <
        deadZone
    ) {

        estimatedAcceleration.x =
            0;

    }


    if (
        Math.abs(
            estimatedAcceleration.y
        )
        <
        deadZone
    ) {

        estimatedAcceleration.y =
            0;

    }


    if (
        Math.abs(
            estimatedAcceleration.z
        )
        <
        deadZone
    ) {

        estimatedAcceleration.z =
            0;

    }


    /*
     * Acceleration -> velocity.
     */

    estimatedVelocity.addScaledVector(

        estimatedAcceleration,

        dt

    );


    /*
     * Сильное затухание.
     */

    estimatedVelocity.multiplyScalar(

        Math.pow(

            0.90,

            dt * 60

        )

    );


    /*
     * Ограничение.
     */

    if (
        estimatedVelocity.length()
        >
        1.5
    ) {

        estimatedVelocity.setLength(
            1.5
        );

    }


    /*
     * Velocity -> position.
     */

    estimatedCameraPosition
        .addScaledVector(

            estimatedVelocity,

            dt

        );


    /*
     * В sensor fallback
     * виртуальная камера
     * получает позицию.
     */

    camera3D.position.copy(

        estimatedCameraPosition

    );

}



/* =========================================================
   TRUE WEBXR
========================================================= */

async function startWebXR() {

    if (
        !navigator.xr
    ) {

        setStatus(

            "WebXR не поддерживается " +
            "этим браузером."

        );

        return;

    }


    let supported =
        false;


    try {

        supported =

            await navigator.xr
                .isSessionSupported(

                    "immersive-ar"

                );

    }
    catch (
        error
    ) {

        console.error(
            error
        );

    }


    if (
        !supported
    ) {

        setStatus(

            "immersive-ar недоступен. " +
            "Нужен совместимый Android/Chrome."

        );

        return;

    }


    try {

        initThree();


        /*
         * Настоящая AR-сессия.
         */

        xrSession =

            await navigator.xr
                .requestSession(

                    "immersive-ar",

                    {

                        requiredFeatures: [

                            "local",

                            "hit-test"

                        ],

                        optionalFeatures: [

                            "local-floor",

                            "dom-overlay"

                        ],

                        domOverlay: {

                            root:
                                document.body

                        }

                    }

                );


        xrActive =
            true;


        xrObjectPlaced =
            false;


        objectLocked =
            false;


        /*
         * Reference Space.
         *
         * local подходит для
         * небольшой области/комнаты.
         */

        xrReferenceSpace =

            await xrSession
                .requestReferenceSpace(

                    "local"

                );


        xrViewerSpace =

            await xrSession
                .requestReferenceSpace(

                    "viewer"

                );


        /*
         * Hit Test.
         */

        xrHitTestSource =

            await xrSession
                .requestHitTestSource({

                    space:
                        xrViewerSpace

                });


        /*
         * WebXR renderer.
         */

        renderer.xr.enabled =
            true;


        await renderer.xr
            .setSession(

                xrSession

            );


        /*
         * UI.
         */

        startScreen.style.display =
            "none";


        cameraVideo.style.display =
            "none";


        canvas.style.display =
            "block";


        topBar.style.display =
            "flex";


        controls.style.display =
            "flex";


        scenePanel.style.display =
            "block";


        closeButton.style.display =
            "block";


        placeButton.style.display =
            "block";


        reticle.style.display =
            "block";


        debug.style.display =
            "block";


        trackingBadge.textContent =
            "TRUE 6DoF";


        /*
         * Загружаем модель.
         */

        loadModel(

            currentModel,

            currentName

        );


        setStatus(

            "Наведите телефон на пол " +
            "или другую поверхность."

        );


        /*
         * XR select.
         */

        xrSession.addEventListener(

            "select",

            () => {

                if (
                    xrHasHit &&
                    !xrObjectPlaced
                ) {

                    lockXRObject();

                }

            }

        );


        xrSession.addEventListener(

            "end",

            () => {

                xrActive =
                    false;


                xrSession =
                    null;


                xrReferenceSpace =
                    null;


                xrViewerSpace =
                    null;


                xrHitTestSource =
                    null;


                xrObjectPlaced =
                    false;


                xrHasHit =
                    false;


                trackingBadge.textContent =
                    "AR END";


                reticle.style.display =
                    "none";

            }

        );


    }
    catch (
        error
    ) {

        console.error(
            "WebXR ERROR:",
            error
        );


        xrActive =
            false;


        setStatus(

            "WebXR ошибка: " +
            error.message

        );

    }

}



/* =========================================================
   XR FRAME
========================================================= */

function onXRFrame(
    time,
    frame
) {

    if (
        !xrSession ||
        !xrReferenceSpace
    ) {

        return;

    }


    /*
     * Получаем ПОЛОЖЕНИЕ
     * и ОРИЕНТАЦИЮ телефона.
     */

    const viewerPose =

        frame.getViewerPose(

            xrReferenceSpace

        );


    if (
        viewerPose
    ) {

        const transform =
            viewerPose
                .transform;


        const position =
            transform.position;


        const orientation =
            transform.orientation;


        /*
         * =================================================
         * НАСТОЯЩИЕ КООРДИНАТЫ ТЕЛЕФОНА
         * =================================================
         */

        camera3D.position.set(

            position.x,

            position.y,

            position.z

        );


        camera3D.quaternion.set(

            orientation.x,

            orientation.y,

            orientation.z,

            orientation.w

        );


        /*
         * DEBUG.
         */

        debug.innerHTML =

            "TRUE WEBXR 6DoF<br><br>" +

            "PHONE POSITION<br>" +

            "X: " +
            position.x.toFixed(3) +

            "<br>" +

            "Y: " +
            position.y.toFixed(3) +

            "<br>" +

            "Z: " +
            position.z.toFixed(3) +

            "<br><br>" +

            "OBJECT POSITION<br>" +

            "X: " +
            objectWorldPosition.x
                .toFixed(3) +

            "<br>" +

            "Y: " +
            objectWorldPosition.y
                .toFixed(3) +

            "<br>" +

            "Z: " +
            objectWorldPosition.z
                .toFixed(3);

    }


    /*
     * =================================================
     * HIT TEST
     * =================================================
     */

    if (
        xrHitTestSource
    ) {

        const hits =

            frame.getHitTestResults(

                xrHitTestSource

            );


        if (
            hits.length > 0
        ) {

            const hit =
                hits[0];


            const hitPose =

                hit.getPose(

                    xrReferenceSpace

                );


            if (
                hitPose
            ) {

                const p =
                    hitPose
                        .transform
                        .position;


                const q =
                    hitPose
                        .transform
                        .orientation;


                xrLastHitPosition.set(

                    p.x,

                    p.y,

                    p.z

                );


                xrLastHitQuaternion.set(

                    q.x,

                    q.y,

                    q.z,

                    q.w

                );


                xrHasHit =
                    true;


                /*
                 * Reticle.
                 */

                reticle.style.display =
                    "block";


                /*
                 * Пока НЕ закрепили —
                 * показываем предварительную
                 * позицию.
                 */

                if (
                    model &&
                    !xrObjectPlaced
                ) {

                    model.position.copy(

                        xrLastHitPosition

                    );


                    model.quaternion.copy(

                        xrLastHitQuaternion

                    );

                }

            }

        }
        else {

            xrHasHit =
                false;

        }

    }


    /*
     * =================================================
     * ПОСЛЕ ЗАКРЕПЛЕНИЯ
     *
     * НИЧЕГО НЕ ДЕЛАЕМ С MODEL.
     * =================================================
     *
     * Она остаётся в:
     *
     * objectWorldPosition
     *
     * =================================================
     */

}



/* =========================================================
   XR LOCK OBJECT
========================================================= */

function lockXRObject() {

    if (
        !model ||
        !xrHasHit
    ) {

        return;

    }


    /*
     * Записываем мировую
     * координату ОДИН РАЗ.
     */

    objectWorldPosition.copy(

        xrLastHitPosition

    );


    objectWorldQuaternion.copy(

        xrLastHitQuaternion

    );


    /*
     * Теперь объект закреплён.
     */

    model.position.copy(

        objectWorldPosition

    );


    model.quaternion.copy(

        objectWorldQuaternion

    );


    objectLocked =
        true;


    xrObjectPlaced =
        true;


    reticle.style.display =
        "none";


    setStatus(

        "СЦЕНА ЗАКРЕПЛЕНА. " +
        "Теперь можно ходить вокруг неё."

    );

}

async function startNormalCamera() {

            !navigator.mediaDevices ||
            !navigator.mediaDevices
                .getUserMedia
        ) {

            throw new Error(

                "getUserMedia недоступен"

            );

        }


        setStatus(

            "Запрашиваем камеру..."

        );


        const stream =

            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {

                            ideal:
                                "environment"

                        },

                        width: {

                            ideal:
                                1280

                        },

                        height: {

                            ideal:
                                720

                        }

                    },

                    audio:
                        false

                });


        cameraVideo.srcObject =
            stream;


        await cameraVideo.play();


        /*
         * UI.
         */

        startScreen.style.display =
            "none";


        cameraVideo.style.display =
            "block";


        canvas.style.display =
            "block";

            "block";


        debug.style.display =

        /*

         */

        initThree();


        /*
         * Sensors.
         */

        startSensors();


        /*
         * Сброс камеры.
         */

        resetTracking();


        /*
         * Загружаем модель.
         */

        loadModel(

            currentModel,

            currentName

        );


        setStatus(

            "Поворот телефона управляет " +
            "направлением камеры."

        );

    }
    catch (
        error
    ) {

        console.error(
            error
        );


        setStatus(

            "Камера: " +
            error.name +
            " — " +
            error.message

        );

    }

}



/* =========================================================
   RESET TRACKING
========================================================= */

function resetTracking() {

    estimatedCameraPosition.set(

        0,
        0,
        0

    );


    estimatedVelocity.set(

        0,
        0,
        0

    );


    estimatedAcceleration.set(

        0,
        0,
        0

    );


    gravity.set(

        0,
        0,
        0

    );


    gravityAccumulator.set(

        0,
        0,
        0

    );


    gravitySamples =
        0;


    gravityReady =
        false;


    orientationInitialized =
        false;


    if (
        camera3D
    ) {

        camera3D.position.set(

            0,
            0,
            0

        );


        camera3D.quaternion.identity();

    }


    previousTime =
        performance.now();

}



/* =========================================================
   PLACE NORMAL OBJECT
========================================================= */

function placeNormalObject() {

    if (
        !model ||
        xrActive
    ) {

        return;

    }


    /*
     * Направление взгляда.
     */

    const forward =
        new THREE.Vector3(

            0,
            0,
            -1

        );


    forward.applyQuaternion(

        camera3D.quaternion

    );


    /*
     * Фиксируем объект
     * относительно текущей
     * мировой позиции камеры.
     */

    objectWorldPosition.copy(

        camera3D.position

    );


    objectWorldPosition.addScaledVector(

        forward,

        3

    );


    objectWorldPosition.y -=
        0.5;


    /*
     * Фиксируем ориентацию.
     */

    objectWorldQuaternion.identity();


    /*
     * Записываем объект
     * в WORLD SPACE.
     */

    model.position.copy(

        objectWorldPosition

    );


    model.quaternion.copy(

        objectWorldQuaternion

    );


    objectLocked =
        true;


    setStatus(

        "СЦЕНА ЗАКРЕПЛЕНА. " +
        "Двигайтесь вокруг неё."

    );

}

function renderNormal() {

        !renderer ||
        !scene ||
        !camera3D

    const now =
        performance.now();


    let dt =

        (
            now -
            previousTime
        )
        /
        1000;


    previousTime =
        now;


    dt =
        Math.min(

            dt,

            0.05

    /*
     * Sensor mode.

    updateOrientation();


    updateEstimatedPosition(
        dt
    );

     * Рисуем.

    renderer.render(

        scene,

        camera3D

    );


    updateDebugNormal();

}

            "none";


        topBar.style.display =
            "none";


        controls.style.display =
            "none";


        scenePanel.style.display =
            "none";


        closeButton.style.display =
            "none";


        debug.style.display =
            "none";


        reticle.style.display =
            "none";


        startScreen.style.display =
            "flex";


        xrActive =
            false;


        xrObjectPlaced =
            false;


        objectLocked =
            false;


        trackingBadge.textContent =
            "OFF";


        setStatus(
            "Готово"
        );

    }

);



/* =========================================================
   WEBXR AVAILABILITY
========================================================= */

async function checkXR() {

    if (
        !navigator.xr
    ) {

        xrStartButton.style.display =
            "none";

        return;

    }


    try {

        const supported =

            await navigator.xr
                .isSessionSupported(

                    "immersive-ar"

                );


        if (
            !supported
        ) {

            xrStartButton.style.display =
                "none";

        }

    }
    catch {

        xrStartButton.style.display =
            "none";

    }

}



/* =========================================================
   INIT
========================================================= */

checkXR();


setStatus(
    "Готово"
);

</script>
