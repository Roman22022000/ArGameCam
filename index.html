<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>AR Game Cam</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    font-family: Arial, sans-serif;

    touch-action: none;
}

#app {

    position: relative;

    width: 100%;
    height: 100dvh;

    overflow: hidden;
}


/* =========================
   CAMERA
========================= */

#camera {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    background: #000;

    z-index: 1;
}


/* =========================
   THREE.JS
========================= */

#three {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 2;

    pointer-events: none;
}


/* =========================
   START
========================= */

#start {

    position: absolute;

    inset: 0;

    z-index: 20;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    padding: 25px;

    background: #111820;

    color: white;

    text-align: center;
}


#start h1 {

    font-size: 40px;

    margin-bottom: 15px;
}


#start p {

    max-width: 350px;

    line-height: 1.5;

    opacity: .7;

    margin-bottom: 30px;
}


button {

    border: 0;

    border-radius: 16px;

    padding: 17px 28px;

    background: white;

    color: #111;

    font-size: 18px;

    font-weight: bold;
}


/* =========================
   TOP
========================= */

#top {

    position: absolute;

    top: 15px;

    left: 15px;

    right: 15px;

    z-index: 10;

    display: none;

    justify-content: space-between;
}


.panel {

    padding: 10px 14px;

    border-radius: 12px;

    background: rgba(0,0,0,.6);

    color: white;

    backdrop-filter: blur(8px);
}


/* =========================
   CENTER RETICLE
========================= */

#reticle {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width: 45px;
    height: 45px;

    border: 2px solid white;

    border-radius: 50%;

    z-index: 5;

    display: none;

    pointer-events: none;
}


/* =========================
   STATUS
========================= */

#status {

    position: absolute;

    left: 50%;

    bottom: 80px;

    transform:
        translateX(-50%);

    z-index: 10;

    width: calc(100% - 40px);

    max-width: 400px;

    padding: 12px;

    border-radius: 12px;

    background: rgba(0,0,0,.7);

    color: white;

    text-align: center;
}


/* =========================
   CONTROLS
========================= */

#controls {

    position: absolute;

    bottom: 20px;

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 10;

    display: none;

    gap: 10px;
}


#controls button {

    padding: 12px 18px;

    font-size: 15px;
}

</style>

</head>


<body>


<div id="app">


<!-- =========================
     CAMERA
========================= -->

<video
    id="camera"
    autoplay
    playsinline
    muted>
</video>


<!-- =========================
     THREE
========================= -->

<canvas id="three"></canvas>


<!-- =========================
     START
========================= -->

<section id="start">

    <h1>AR GAME</h1>

    <p>

        Камера будет работать
        непосредственно внутри
        Telegram Mini App.

        <br><br>

        После запуска наведи телефон
        на окружающее пространство.

    </p>


    <button id="startButton">

        Включить камеру

    </button>

</section>


<!-- =========================
     TOP
========================= -->

<div id="top">

    <div class="panel">
        AR MODE
    </div>

    <div
        class="panel"
        id="user">
        Player
    </div>

</div>


<!-- =========================
     RETICLE
========================= -->

<div id="reticle"></div>


<!-- =========================
     STATUS
========================= -->

<div id="status">

    Камера выключена

</div>


<!-- =========================
     CONTROLS
========================= -->

<div id="controls">

    <button id="minus">
        −
    </button>

    <button id="reset">
        Центр
    </button>

    <button id="plus">
        +
    </button>

</div>


</div>


<script type="module">

/* ==================================================
   THREE.JS
================================================== */

import * as THREE
from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


import {
    GLTFLoader
}
from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


/* ==================================================
   TELEGRAM
================================================== */

const tg =
    window.Telegram?.WebApp;


if (tg) {

    tg.ready();

    tg.expand();

}


/* ==================================================
   ELEMENTS
================================================== */

const video =
    document.getElementById(
        "camera"
    );


const canvas =
    document.getElementById(
        "three"
    );


const start =
    document.getElementById(
        "start"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const status =
    document.getElementById(
        "status"
    );


const top =
    document.getElementById(
        "top"
    );


const controls =
    document.getElementById(
        "controls"
    );


const reticle =
    document.getElementById(
        "reticle"
    );


/* ==================================================
   TELEGRAM USER
================================================== */

if (
    tg?.initDataUnsafe?.user
) {

    const user =
        tg.initDataUnsafe.user;


    document.getElementById(
        "user"
    ).textContent =

        user.first_name ||

        user.username ||

        "Player";

}


/* ==================================================
   THREE VARIABLES
================================================== */

let scene;

let camera;

let renderer;

let model;

let modelRoot;

let modelLoaded = false;


/* ==================================================
   MODEL POSITION
================================================== */

let objectX = 0;

let objectY = 0;

let objectZ = -2;


/* ==================================================
   MODEL SCALE
================================================== */

let objectScale = 1;


/* ==================================================
   DEVICE ROTATION
================================================== */

let alpha = 0;

let beta = 0;

let gamma = 0;


/* ==================================================
   INIT THREE
================================================== */

function initThree() {


    scene =
        new THREE.Scene();


    camera =
        new THREE.PerspectiveCamera(
            60,
            window.innerWidth /
            window.innerHeight,
            0.01,
            100
        );


    renderer =
        new THREE.WebGLRenderer({

            canvas,

            alpha: true,

            antialias: true
        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    /* =========================
       LIGHT
    ========================= */

    const ambient =
        new THREE.AmbientLight(
            0xffffff,
            2
        );


    scene.add(
        ambient
    );


    const directional =
        new THREE.DirectionalLight(
            0xffffff,
            2
        );


    directional.position.set(
        2,
        4,
        2
    );


    scene.add(
        directional
    );


    /* =========================
       LOAD GLB
    ========================= */

    const loader =
        new GLTFLoader();


    loader.load(

        "./models/creature.glb",

        gltf => {

            model =
                gltf.scene;


            model.scale.set(
                1,
                1,
                1
            );


            model.position.set(
                0,
                0,
                -2
            );


            scene.add(
                model
            );


            modelLoaded =
                true;


            status.textContent =
                "Модель готова";


            console.log(
                "CREATURE GLB LOADED"
            );

        },


        undefined,

        error => {

            console.error(
                error
            );


            status.textContent =
                "Ошибка creature.glb";

        }

    );


    /* =========================
       LOOP
    ========================= */

    animate();

}


/* ==================================================
   ANIMATION
================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    if (
        model
    ) {

        model.position.x =
            objectX;


        model.position.y =
            objectY;


        model.position.z =
            objectZ;


        model.scale.set(
            objectScale,
            objectScale,
            objectScale
        );

    }


    renderer.render(
        scene,
        camera
    );

}


/* ==================================================
   CAMERA
================================================== */

async function startCamera() {


    try {

        status.textContent =
            "Запрашиваем камеру...";


        /*
         * Основная камера
         */

        const stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal:
                                "environment"
                        },

                        width: {
                            ideal: 1920
                        },

                        height: {
                            ideal: 1080
                        }

                    },

                    audio: false

                });


        video.srcObject =
            stream;


        await video.play();


        /*
         * UI
         */

        start.style.display =
            "none";


        top.style.display =
            "flex";


        controls.style.display =
            "flex";


        reticle.style.display =
            "block";


        status.textContent =
            "Камера включена";


        /*
         * Device Orientation
         */

        await enableOrientation();


    }
    catch (error) {

        console.error(
            "CAMERA ERROR:",
            error
        );


        status.textContent =
            "Камера недоступна: " +
            error.name;

    }

}


/* ==================================================
   DEVICE ORIENTATION
================================================== */

async function enableOrientation() {


    /*
     * iPhone требует
     * специального permission.
     */

    if (
        typeof DeviceOrientationEvent !==
        "undefined" &&

        typeof DeviceOrientationEvent
            .requestPermission ===
            "function"
    ) {

        try {

            const permission =
                await DeviceOrientationEvent
                    .requestPermission();


            if (
                permission !==
                "granted"
            ) {

                status.textContent =
                    "Доступ к датчикам запрещён.";

                return;

            }

        }
        catch (error) {

            console.error(
                error
            );

        }

    }


    window.addEventListener(

        "deviceorientation",

        event => {

            alpha =
                event.alpha || 0;

            beta =
                event.beta || 0;

            gamma =
                event.gamma || 0;


            updateCameraOrientation();

        },

        true

    );

}


/* ==================================================
   CAMERA ORIENTATION
================================================== */

function updateCameraOrientation() {


    /*
     * Переводим данные
     * телефона в вращение
     * Three.js камеры.
     */

    const alphaRad =
        THREE.MathUtils.degToRad(
            alpha
        );


    const betaRad =
        THREE.MathUtils.degToRad(
            beta
        );


    const gammaRad =
        THREE.MathUtils.degToRad(
            gamma
        );


    const euler =
        new THREE.Euler(
            betaRad,
            alphaRad,
            -gammaRad,
            "YXZ"
        );


    camera.rotation.copy(
        euler
    );

}


/* ==================================================
   START BUTTON
================================================== */

startButton.addEventListener(

    "click",

    async () => {

        initThree();

        await startCamera();

    }

);


/* ==================================================
   SCALE DOWN
================================================== */

document
    .getElementById("minus")
    .addEventListener(

        "click",

        () => {

            objectScale =
                Math.max(
                    0.1,
                    objectScale - 0.1
                );

        }

    );


/* ==================================================
   SCALE UP
================================================== */

document
    .getElementById("plus")
    .addEventListener(

        "click",

        () => {

            objectScale =
                Math.min(
                    5,
                    objectScale + 0.1
                );

        }

    );


/* ==================================================
   RESET
================================================== */

document
    .getElementById("reset")
    .addEventListener(

        "click",

        () => {

            objectX =
                0;

            objectY =
                0;

            objectZ =
                -2;

            objectScale =
                1;

            status.textContent =
                "Объект сброшен";

        }

    );


/* ==================================================
   TOUCH MOVE
================================================== */

let lastX = 0;

let lastY = 0;


canvas.addEventListener(

    "touchstart",

    event => {

        if (
            event.touches.length !== 1
        ) {

            return;

        }


        lastX =
            event.touches[0].clientX;


        lastY =
            event.touches[0].clientY;

    },

    {
        passive: true
    }

);


canvas.addEventListener(

    "touchmove",

    event => {

        if (
            event.touches.length !== 1
        ) {

            return;

        }


        const x =
            event.touches[0].clientX;


        const y =
            event.touches[0].clientY;


        const dx =
            x - lastX;


        const dy =
            y - lastY;


        objectX +=
            dx * 0.005;


        objectY -=
            dy * 0.005;


        lastX =
            x;


        lastY =
            y;

    },

    {
        passive: true
    }

);


/* ==================================================
   RESIZE
================================================== */

window.addEventListener(

    "resize",

    () => {

        if (!renderer) {
            return;
        }


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();

    }

);

</script>

</body>

</html>
