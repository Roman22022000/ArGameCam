<script type="module">

/* =====================================================
   IMPORTS
===================================================== */

import * as THREE
    from "three";

import {
    GLTFLoader
}
from "three/addons/loaders/GLTFLoader.js";

import {
    OrbitControls
}
from "three/addons/controls/OrbitControls.js";


/* =====================================================
   TELEGRAM
===================================================== */

const tg =
    window.Telegram?.WebApp || null;


if (tg) {

    tg.ready();

    tg.expand();

    if (tg.setHeaderColor) {
        tg.setHeaderColor("#000000");
    }

    if (tg.setBackgroundColor) {
        tg.setBackgroundColor("#000000");
    }

}


/* =====================================================
   SCREENS
===================================================== */

const homeScreen =
    document.getElementById(
        "homeScreen"
    );

const galleryScreen =
    document.getElementById(
        "galleryScreen"
    );

const viewerScreen =
    document.getElementById(
        "viewerScreen"
    );


function showScreen(screen) {

    document
        .querySelectorAll(".screen")
        .forEach(
            element => {

                element.classList.remove(
                    "active"
                );

            }
        );

    screen.classList.add(
        "active"
    );

}


/* =====================================================
   NAVIGATION
===================================================== */

document
    .getElementById("openGallery")
    .addEventListener(
        "click",
        () => {

            showScreen(
                galleryScreen
            );

        }
    );


document
    .getElementById("galleryBack")
    .addEventListener(
        "click",
        () => {

            stopSensors();

            showScreen(
                homeScreen
            );

        }
    );


document
    .getElementById("viewerBack")
    .addEventListener(
        "click",
        () => {

            stopSensors();

            descriptionPanel.classList.remove(
                "expanded"
            );

            showScreen(
                galleryScreen
            );

        }
    );


/* =====================================================
   THREE VARIABLES
===================================================== */

let scene = null;

let camera = null;

let renderer = null;

let controls = null;

let model = null;


/*
    Галереи по порядку.
    Здесь можно менять filename для каждой модели.
*/
const galleryItems = [
    {
        number: 1,
        filename: "creature.glb",
        description: "Описание первой сцены. Здесь можно разместить подробную информацию о цифровом существе, его происхождении, особенностях модели и концепции экспозиции."
    },
    {
        number: 2,
        filename: "creature.glb",
        description: "Описание второй сцены. Здесь можно разместить текст о второй экспозиции, истории объекта, художественной идее и деталях 3D-модели."
    },
    {
        number: 3,
        filename: "creature.glb",
        description: "Описание третьей сцены. Здесь можно разместить полный текст о третьем объекте, его характеристиках и месте в галерее."
    }
];

let currentGalleryIndex = 0;



/* =====================================================
   MODEL
===================================================== */

const MODEL_BASE =
    "https://raw.githubusercontent.com/" +
    "Roman22022000/ArGameCam/main/models/";


const gltfLoader =
    new GLTFLoader();


const MODEL_CENTER =
    new THREE.Vector3(
        0,
        0,
        0
    );


/* =====================================================
   CAMERA
===================================================== */

const CAMERA_RADIUS = 3;


/*
    Начальная высота камеры.
*/

const CAMERA_Y = 0.35;


/* =====================================================
   DEVICE ORIENTATION
===================================================== */

let orientationActive = false;

let orientationReceived = false;


/*
    Статус и данные сенсоров больше не выводятся
    на экран — интерфейс остаётся чистым.
*/
function setSensorStatus(text) {
    // UI intentionally hidden.
}

function setSensorData(alpha, beta, gamma) {
    // UI intentionally hidden.
}



/*
    Последние данные телефона.
*/

let deviceAlpha = 0;

let deviceBeta = 0;

let deviceGamma = 0;


/*
    Кватернион текущей ориентации
    телефона.
*/

const deviceQuaternion =
    new THREE.Quaternion();


/*
    Начальная ориентация телефона.

    Именно она становится
    нулевой точкой.
*/

const initialQuaternion =
    new THREE.Quaternion();


/*
    Относительная ориентация.
*/

const relativeQuaternion =
    new THREE.Quaternion();


/*
    Корректирующие объекты.
*/

const deviceEuler =
    new THREE.Euler(
        0,
        0,
        0,
        "YXZ"
    );


const zee =
    new THREE.Vector3(
        0,
        0,
        1
    );


const screenQuaternion =
    new THREE.Quaternion();


/*
    Коррекция DeviceOrientation
    для камеры Three.js.
*/

const cameraCorrection =
    new THREE.Quaternion(
        -Math.sqrt(0.5),
        0,
        0,
        Math.sqrt(0.5)
    );


/*
    Текущий угол экрана.
*/

let screenAngle = 0;


/* =====================================================
   CAMERA SENSOR STATE
===================================================== */

let sensorYaw = 0;

let sensorPitch = 0;

let targetYaw = 0;

let targetPitch = 0;


/*
    Плавность.

    Чем меньше значение,
    тем мягче движение.
*/

const SENSOR_SMOOTH = 0.12;


/* =====================================================
   GYROSCOPE
===================================================== */

let gyroscopeActive = false;

let lastGyroTime = 0;


/*
    Gyroscope используется как
    дополнительный источник
    плавности.

    Не заменяет orientation.
*/

let gyroYawVelocity = 0;

let gyroPitchVelocity = 0;


/* =====================================================
   THREE INIT
===================================================== */

function initThree() {

    const container =
        document.getElementById(
            "canvasContainer"
        );


    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0x000000
        );


    /* -------------------------------------------------
       CAMERA
    -------------------------------------------------- */

    camera =
        new THREE.PerspectiveCamera(
            45,
            window.innerWidth /
            window.innerHeight,
            0.01,
            1000
        );


    camera.position.set(
        0,
        CAMERA_Y,
        CAMERA_RADIUS
    );


    camera.lookAt(
        MODEL_CENTER
    );


    /* -------------------------------------------------
       LIGHT
    -------------------------------------------------- */

    const hemisphere =
        new THREE.HemisphereLight(
            0xffffff,
            0x222222,
            2.2
        );

    scene.add(
        hemisphere
    );


    const keyLight =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );

    keyLight.position.set(
        3,
        5,
        4
    );

    scene.add(
        keyLight
    );


    const fillLight =
        new THREE.DirectionalLight(
            0xffffff,
            1
        );

    fillLight.position.set(
        -4,
        2,
        -4
    );

    scene.add(
        fillLight
    );


    /* -------------------------------------------------
       RENDERER
    -------------------------------------------------- */

    renderer =
        new THREE.WebGLRenderer({

            antialias: true,

            powerPreference:
                "high-performance"

        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    container.appendChild(
        renderer.domElement
    );


    /* -------------------------------------------------
       MANUAL TOUCH CONTROL
    -------------------------------------------------- */

    controls =
        new OrbitControls(
            camera,
            renderer.domElement
        );


    controls.enableDamping =
        true;


    controls.dampingFactor =
        0.08;


    controls.enablePan =
        false;


    controls.minDistance =
        1.2;


    controls.maxDistance =
        7;


    controls.target.copy(
        MODEL_CENTER
    );


    controls.update();


    /* -------------------------------------------------
       RESIZE
    -------------------------------------------------- */

    window.addEventListener(
        "resize",
        onResize
    );


    updateScreenAngle();


    animate();

}


/* =====================================================
   LOAD MODEL
===================================================== */

function loadModel(filename) {

    const loader =
        document.getElementById(
            "loader"
        );


    const loaderText =
        document.getElementById(
            "loaderText"
        );


    loader.classList.remove(
        "hidden"
    );


    loaderText.textContent =
        "Загрузка 3D модели...";


    /*
        Удаляем предыдущую модель.
    */

    if (model) {

        scene.remove(
            model
        );


        model.traverse(
            object => {

                if (
                    object.isMesh
                ) {

                    if (
                        object.geometry
                    ) {

                        object.geometry.dispose();

                    }


                    if (
                        Array.isArray(
                            object.material
                        )
                    ) {

                        object.material
                            .forEach(
                                material => {

                                    material.dispose();

                                }
                            );

                    }
                    else if (
                        object.material
                    ) {

                        object.material.dispose();

                    }

                }

            }
        );


        model = null;

    }


    const url =
        MODEL_BASE +
        filename;


    gltfLoader.load(

        url,


        gltf => {

            model =
                gltf.scene;


            /*
                Bounding Box.
            */

            const box =
                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            const center =
                box.getCenter(
                    new THREE.Vector3()
                );


            const size =
                box.getSize(
                    new THREE.Vector3()
                );


            /*
                Перемещаем центр
                модели в 0,0,0.
            */

            model.position.sub(
                center
            );


            /*
                Нормализация размера.
            */

            const maxSize =
                Math.max(
                    size.x,
                    size.y,
                    size.z
                );


            if (
                maxSize > 0
            ) {

                model.scale.setScalar(
                    2 / maxSize
                );

            }


            /*
                Модель добавляется
                непосредственно в сцену.

                Она НЕ находится внутри камеры
                и НЕ вращается вместе с телефоном.
            */

            scene.add(
                model
            );


            resetCamera();

            loader.classList.add(
                "hidden"
            );

        },


        xhr => {

            if (
                xhr.total > 0
            ) {

                const percent =
                    Math.round(
                        xhr.loaded /
                        xhr.total *
                        100
                    );


                loaderText.textContent =
                    `Загрузка ${percent}%`;

            }

        },


        error => {

            console.error(
                "GLB error:",
                error
            );


            loaderText.textContent =
                "Ошибка загрузки модели";

        }

    );

}


/* =====================================================
   RESET CAMERA
===================================================== */

function resetCamera() {

    if (!camera) {
        return;
    }


    camera.position.set(
        0,
        CAMERA_Y,
        CAMERA_RADIUS
    );


    camera.lookAt(
        MODEL_CENTER
    );


    if (controls) {

        controls.target.copy(
            MODEL_CENTER
        );

        controls.update();

    }

}


/* =====================================================
   GALLERY BUTTONS + NAVIGATION
===================================================== */

const galleryButtons =
    document.querySelectorAll(
        ".numberButton"
    );

const currentGallery =
    document.getElementById(
        "currentGallery"
    );

const prevGallery =
    document.getElementById(
        "prevGallery"
    );

const nextGallery =
    document.getElementById(
        "nextGallery"
    );

const descriptionPanel =
    document.getElementById(
        "descriptionPanel"
    );

const descriptionHeader =
    document.getElementById(
        "descriptionHeader"
    );

const descriptionBody =
    document.getElementById(
        "descriptionBody"
    );


function updateGalleryNavigation() {

    const item =
        galleryItems[currentGalleryIndex];

    currentGallery.textContent =
        item.number;

    descriptionBody.textContent =
        item.description;

    descriptionPanel.classList.remove(
        "expanded"
    );

    prevGallery.style.opacity =
        currentGalleryIndex === 0 ? "0.35" : "1";

    nextGallery.style.opacity =
        currentGalleryIndex === galleryItems.length - 1
            ? "0.35"
            : "1";

}


function openGalleryItem(index) {

    if (
        index < 0 ||
        index >= galleryItems.length
    ) {
        return;
    }

    currentGalleryIndex = index;

    const item =
        galleryItems[currentGalleryIndex];


    updateGalleryNavigation();


    showScreen(
        viewerScreen
    );


    if (!renderer) {

        initThree();

    }


    loadModel(
        item.filename
    );


    /*
        Первый клик по номеру/стрелке
        одновременно разрешает запуск
        сенсоров телефона.
    */
    if (!orientationActive) {

        startSensors();

    }

}


galleryButtons.forEach(
    (button, index) => {

        button.addEventListener(
            "click",
            () => {

            }
        );

);


prevGallery.addEventListener(
    "click",

            currentGalleryIndex - 1
        );

);


nextGallery.addEventListener(

        );

updateGalleryNavigation();


descriptionHeader.addEventListener(

        );

/* =====================================================
   START SENSORS
===================================================== */

async function startSensors() {

    /*
        Сбрасываем калибровку.
    */

    orientationReceived = false;

    initialQuaternion.identity();

    relativeQuaternion.identity();

    sensorYaw = 0;

    sensorPitch = 0;

    targetYaw = 0;

    targetPitch = 0;


    /* =================================================
       TELEGRAM DEVICE ORIENTATION
    ================================================= */

    if (
        tg &&
        tg.DeviceOrientation &&
        typeof tg.DeviceOrientation.start ===
        "function"
    ) {

        /*
            Подписываемся на события.

            Важно:
            событие не передаёт data.

            Актуальные значения находятся
            в tg.DeviceOrientation.alpha/beta/gamma.
        */

        tg.onEvent(
            "deviceOrientationChanged",
            onTelegramOrientation
        );


        tg.onEvent(
            "deviceOrientationStarted",
            onTelegramOrientationStarted
        );


        tg.onEvent(
            "deviceOrientationFailed",
            onTelegramOrientationFailed
        );


        /*
            Запускаем Telegram orientation.

            refresh_rate 20 ms.

            need_absolute=false:
            для осмотра вокруг объекта
            нам не нужен магнитный север.
        */

        tg.DeviceOrientation.start({

            refresh_rate: 20,

            need_absolute: false

        });


        orientationActive = true;


        if (controls) {
            controls.enabled = false;
        }


        setSensorStatus(
            "Ожидание ориентации телефона..."
        );


        /*
            Дополнительно запускаем
            гироскоп Telegram.
        */

        startTelegramGyroscope();


        return;

    }


    /* =================================================
       BROWSER FALLBACK
    ================================================= */

    if (
        typeof DeviceOrientationEvent !==
        "undefined"
    ) {

        try {

            /*
                iOS.
            */

            if (
                typeof DeviceOrientationEvent
                    .requestPermission ===
                "function"
            ) {

                const permission =
                    await DeviceOrientationEvent
                        .requestPermission();


                if (
                    permission !==
                    "granted"
                ) {

                    setSensorStatus(
                        "Доступ к сенсорам запрещён"
                    );

                    return;

                }

            }


            window.addEventListener(
                "deviceorientation",
                onBrowserOrientation,
                true
            );


            orientationActive = true;


            if (controls) {
                controls.enabled = false;
            }


            setSensorStatus(
                "Браузерный сенсор активен"
            );


        }
        catch (error) {

            console.error(
                error
            );


            setSensorStatus(
                "Ошибка доступа к сенсору"
            );

        }

    }
    else {

        setSensorStatus(
            "Сенсор устройства не найден"
        );

    }

}


/* =====================================================
   TELEGRAM ORIENTATION STARTED
===================================================== */

function onTelegramOrientationStarted() {

    setSensorStatus(
        "Telegram: ориентация активна"
    );

}


/* =====================================================
   TELEGRAM ORIENTATION FAILED
===================================================== */

function onTelegramOrientationFailed(
    error
) {

    console.error(
        "Telegram orientation failed:",
        error
    );


    orientationActive = false;


    setSensorStatus(
        "Telegram: сенсор недоступен"
    );


    if (controls) {
        controls.enabled = true;
    }

}


/* =====================================================
   TELEGRAM ORIENTATION CHANGED
===================================================== */

function onTelegramOrientation() {

    if (!orientationActive) {
        return;
    }


    /*
        ВАЖНО:

        Telegram НЕ передаёт объект data
        в callback.

        Значения читаются из:

        tg.DeviceOrientation.alpha
        tg.DeviceOrientation.beta
        tg.DeviceOrientation.gamma
    */

    if (
        !tg.DeviceOrientation
    ) {
        return;
    }


    /*
        Telegram Mini Apps отдаёт alpha/beta/gamma
        уже в радианах. Не переводим их повторно
        из градусов.
    */

    const alpha =
        Number(
            tg.DeviceOrientation.alpha
        );


    const beta =
        Number(
            tg.DeviceOrientation.beta
        );


    const gamma =
        Number(
            tg.DeviceOrientation.gamma
        );


    if (
        !Number.isFinite(alpha) ||
        !Number.isFinite(beta) ||
        !Number.isFinite(gamma)
    ) {

        return;

    }


    deviceAlpha = alpha;

    deviceBeta = beta;

    deviceGamma = gamma;


    /*
        Показываем данные.
    */

    showSensorData(
        alpha,
        beta,
        gamma
    );


    /*
        Преобразуем три угла
        в quaternion.
    */

    setDeviceQuaternion(
        alpha,
        beta,
        gamma
    );


    /*
        Первый кадр = калибровка.

        Текущее положение телефона
        становится центром обзора.
    */

    if (!orientationReceived) {

        initialQuaternion.copy(
            deviceQuaternion
        );


        orientationReceived = true;


        setSensorStatus(
            "Телефон подключён"
        );


        return;

    }


    /*
        Получаем вращение относительно
        начального положения.
    */

    relativeQuaternion
        .copy(
            initialQuaternion
        )
        .invert()
        .multiply(
            deviceQuaternion
        );


    /*
        Из quaternion получаем
        направление движения камеры.
    */

    updateTargetFromQuaternion(
        relativeQuaternion
    );

}


/* =====================================================
   BROWSER ORIENTATION
===================================================== */

function onBrowserOrientation(
    event
) {

    if (!orientationActive) {
        return;
    }


    if (
        event.alpha === null ||
        event.beta === null ||
        event.gamma === null
    ) {

        return;
    }


    /*
        Browser API отдаёт градусы.

        Переводим в радианы.
    */

    const alpha =
        THREE.MathUtils.degToRad(
            event.alpha
        );


    const beta =
        THREE.MathUtils.degToRad(
            event.beta
        );


    const gamma =
        THREE.MathUtils.degToRad(
            event.gamma
        );


    showSensorData(
        alpha,
        beta,
        gamma
    );


    setDeviceQuaternion(
        alpha,
        beta,
        gamma
    );


    if (!orientationReceived) {

        initialQuaternion.copy(
            deviceQuaternion
        );


        orientationReceived = true;


        return;

    }


    relativeQuaternion
        .copy(
            initialQuaternion
        )
        .invert()
        .multiply(
            deviceQuaternion
        );


    updateTargetFromQuaternion(
        relativeQuaternion
    );

}


/* =====================================================
   CONVERT ORIENTATION TO QUATERNION
===================================================== */

function setDeviceQuaternion(
    alpha,
    beta,
    gamma
) {

    /*
        Стандартная схема
        DeviceOrientation.

        alpha = Z
        beta  = X
        gamma = Y
    */

    deviceEuler.set(
        beta,
        alpha,
        -gamma,
        "YXZ"
    );


    deviceQuaternion
        .setFromEuler(
            deviceEuler
        );


    /*
        Коррекция камеры.
    */

    deviceQuaternion
        .multiply(
            cameraCorrection
        );


    /*
        Учитываем ориентацию экрана.
    */

    updateScreenAngle();


    screenQuaternion
        .setFromAxisAngle(
            zee,
            -screenAngle
        );


    deviceQuaternion
        .multiply(
            screenQuaternion
        );

}


/* =====================================================
   QUATERNION → CAMERA TARGET
===================================================== */

function updateTargetFromQuaternion(
    quaternion
) {

    /*
        Берём направление, куда смотрит телефон.
        -Z — направление взгляда Three.js.
    */

    const forward =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    forward.applyQuaternion(
        quaternion
    );


    /*
        Горизонтальный поворот:
        телефон влево  -> yaw влево
        телефон вправо -> yaw вправо
    */

    const yaw =
        Math.atan2(
            forward.x,
            -forward.z
        );


    /*
        Вертикальный наклон:
        телефон вверх -> обзор поднимается
        телефон вниз  -> обзор опускается
    */

    const pitch =
        Math.asin(
            THREE.MathUtils.clamp(
                forward.y,
                -1,
                1
            )
        );


    targetYaw = yaw;

    targetPitch =
        THREE.MathUtils.clamp(
            pitch,
            -1.30,
            1.30
        );

}



/* =====================================================
   TELEGRAM GYROSCOPE
===================================================== */

function startTelegramGyroscope() {

    if (
        !tg ||
        !tg.Gyroscope ||
        typeof tg.Gyroscope.start !==
        "function"
    ) {

        return;
    }


    tg.onEvent(
        "gyroscopeChanged",
        onTelegramGyroscope
    );


    tg.onEvent(
        "gyroscopeStarted",
        () => {

            gyroscopeActive = true;

        }
    );


    tg.onEvent(
        "gyroscopeFailed",
        error => {

            console.warn(
                "Gyroscope failed:",
                error
            );

            gyroscopeActive = false;

        }
    );


    tg.Gyroscope.start({

        refresh_rate: 20

    });

}


/* =====================================================
   GYROSCOPE DATA
===================================================== */

function onTelegramGyroscope() {

    if (
        !gyroscopeActive ||
        !tg.Gyroscope
    ) {

        return;
    }


    /*
        Telegram Gyroscope:

        x = rad/s
        y = rad/s
        z = rad/s
    */

    const x =
        Number(
            tg.Gyroscope.x
        ) || 0;


    const y =
        Number(
            tg.Gyroscope.y
        ) || 0;


    const z =
        Number(
            tg.Gyroscope.z
        ) || 0;


    /*
        Гироскоп используется
        как показатель движения.

        Основная ориентация всё равно
        приходит из DeviceOrientation.
    */

    gyroYawVelocity = z;

    gyroPitchVelocity = x;

}


/* =====================================================
   SCREEN ORIENTATION
===================================================== */

function updateScreenAngle() {

    let angle = 0;


    if (
        screen.orientation &&
        typeof screen.orientation.angle ===
        "number"
    ) {

        angle =
            screen.orientation.angle;

    }
    else if (
        typeof window.orientation ===
        "number"
    ) {

        angle =
            window.orientation;

    }


    screenAngle =
        THREE.MathUtils.degToRad(
            angle
        );

}


/* =====================================================
   SENSOR CAMERA
===================================================== */

function updateSensorCamera() {

    if (
        !orientationActive ||
        !orientationReceived ||
        !camera
    ) {

        return;
    }


    /*
        Плавно следуем за ориентацией телефона.
    */

    sensorYaw +=
        shortestAngleDifference(
            sensorYaw,
            targetYaw
        ) * SENSOR_SMOOTH;


    sensorPitch +=
        (
            targetPitch -
            sensorPitch
        ) * SENSOR_SMOOTH;


    const horizontalRadius =
        Math.cos(
            sensorPitch
        ) * CAMERA_RADIUS;


    const x =
        Math.sin(
            sensorYaw
        ) * horizontalRadius;


    const y =
        CAMERA_Y +
        Math.sin(
            sensorPitch
        ) * CAMERA_RADIUS;


    const z =
        Math.cos(
            sensorYaw
        ) * horizontalRadius;


    camera.position.set(
        x,
        y,
        z
    );


    camera.lookAt(
        MODEL_CENTER
    );

}



/* =====================================================
   ANGLE DIFFERENCE
===================================================== */

function shortestAngleDifference(
    current,
    target
) {

    let difference =
        target -
        current;


    while (
        difference > Math.PI
    ) {

        difference -=
            Math.PI * 2;

    }


    while (
        difference < -Math.PI
    ) {

        difference +=
            Math.PI * 2;

    }


    return difference;

}


/* =====================================================
   DEBUG DATA
===================================================== */

function showSensorData(
    alpha,
    beta,
    gamma
) {

    setSensorData(
        alpha,
        beta,
        gamma
    );

}


/* =====================================================
   STOP SENSORS
===================================================== */


function stopSensors() {

    orientationActive = false;

    orientationReceived = false;

    gyroscopeActive = false;


    /*
        Telegram orientation.
    */

    if (
        tg &&
        tg.DeviceOrientation &&
        typeof tg.DeviceOrientation.stop ===
        "function"
    ) {

        try {

            tg.DeviceOrientation.stop();

        }
        catch (error) {

            console.warn(
                error
            );

        }

    }


    /*
        Telegram gyroscope.
    */

    if (
        tg &&
        tg.Gyroscope &&
        typeof tg.Gyroscope.stop ===
        "function"
    ) {

        try {

            tg.Gyroscope.stop();

        }
        catch (error) {

            console.warn(
                error
            );

        }

    }


    /*
        Удаляем Telegram events.
    */

    if (
        tg &&
        typeof tg.offEvent ===
        "function"
    ) {

        tg.offEvent(
            "deviceOrientationChanged",
            onTelegramOrientation
        );


        tg.offEvent(
            "deviceOrientationStarted",
            onTelegramOrientationStarted
        );


        tg.offEvent(
            "deviceOrientationFailed",
            onTelegramOrientationFailed
        );


        tg.offEvent(
            "gyroscopeChanged",
            onTelegramGyroscope
        );

    }


    /*
        Browser.
    */

    window.removeEventListener(
        "deviceorientation",
        onBrowserOrientation,
        true
    );


    /*
        Возвращаем OrbitControls.
    */

    if (controls) {

        controls.enabled = true;

    }


    /*
        Сброс.
    */

    initialQuaternion.identity();

    relativeQuaternion.identity();

    deviceQuaternion.identity();


    sensorYaw = 0;

    sensorPitch = 0;

    targetYaw = 0;

    targetPitch = 0;


    setSensorStatus(
        "Сенсоры выключены"
    );

}


/* =====================================================
   RESIZE
===================================================== */

function onResize() {

    if (
        !camera ||
        !renderer
    ) {

        return;
    }


    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}


/* =====================================================
   ANIMATION
===================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    /*
        Управление пальцем,
        если сенсоры выключены.
    */

    if (
        controls &&
        controls.enabled
    ) {

        controls.update();

    }


    /*
        Управление телефоном.
    */

    updateSensorCamera();


    /*
        Рендер.
    */

    if (
        renderer &&
        scene &&
        camera
    ) {

        renderer.render(
            scene,
            camera
        );

    }

}
