<script type="module">


/* =========================================================
   IMPORTS
========================================================== */

import * as THREE
    from "three";

import {
    GLTFLoader
}
from "three/addons/loaders/GLTFLoader.js";

import {
    OrbitControls
}
from "three/addons/controls/OrbitControls.js";



/* =========================================================
   TELEGRAM
========================================================== */

const tg =
    window.Telegram?.WebApp || null;


if (tg) {

    tg.ready();

    tg.expand();


    if (tg.setHeaderColor) {

        tg.setHeaderColor(
            "#000000"
        );

    }


    if (tg.setBackgroundColor) {

        tg.setBackgroundColor(
            "#000000"
        );

    }

}



/* =========================================================
   SCREENS
========================================================== */

const homeScreen =
    document.getElementById(
        "homeScreen"
    );


const galleryScreen =
    document.getElementById(
        "galleryScreen"
    );


const viewerScreen =
    document.getElementById(
        "viewerScreen"
    );



function showScreen(screen) {

    document
        .querySelectorAll(".screen")
        .forEach(
            element => {

                element.classList.remove(
                    "active"
                );

            }
        );


    screen.classList.add(
        "active"
    );

}



/* =========================================================
   NAVIGATION
========================================================== */

document
    .getElementById(
        "openGallery"
    )
    .addEventListener(
        "click",
        () => {

            showScreen(
                galleryScreen
            );

        }
    );


document
    .getElementById(
        "galleryBack"
    )
    .addEventListener(
        "click",
        () => {

            showScreen(
                homeScreen
            );

        }
    );


document
    .getElementById(
        "viewerBack"
    )
    .addEventListener(
        "click",
        () => {

            stopSensor();

            showScreen(
                galleryScreen
            );

        }
    );



/* =========================================================
   THREE VARIABLES
========================================================== */

let scene = null;

let camera = null;

let renderer = null;

let controls = null;

let model = null;

let animationId = null;



/* =========================================================
   MODEL
========================================================== */

const MODEL_BASE_URL =
    "https://raw.githubusercontent.com/" +
    "Roman22022000/ArGameCam/main/models/";


const gltfLoader =
    new GLTFLoader();



/* =========================================================
   MODEL CENTER
========================================================== */

const MODEL_CENTER =
    new THREE.Vector3(
        0,
        0,
        0
    );



/* =========================================================
   CAMERA
========================================================== */

const CAMERA_DISTANCE = 3;

const CAMERA_HEIGHT = 0.45;



/* =========================================================
   SENSOR VARIABLES
========================================================== */

let sensorEnabled = false;


/*
    Абсолютная ориентация телефона.
*/

let sensorAlpha = 0;

let sensorBeta = 0;

let sensorGamma = 0;


/*
    Начальная ориентация.

    Именно с неё начинается обзор.
*/

let startAlpha = null;

let startBeta = null;

let startGamma = null;


/*
    Целевые углы.
*/

let targetYaw = 0;

let targetPitch = 0;


/*
    Текущие углы.

    Они используются для плавности.
*/

let currentYaw = 0;

let currentPitch = 0;


/*
    Плавность.
*/

const SENSOR_SMOOTHING =
    0.14;



/* =========================================================
   THREE INIT
========================================================== */

function initThree() {

    const container =
        document.getElementById(
            "canvasContainer"
        );


    /* -----------------------------------------------------
       SCENE
    ------------------------------------------------------ */

    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0x000000
        );


    /* -----------------------------------------------------
       CAMERA
    ------------------------------------------------------ */

    camera =
        new THREE.PerspectiveCamera(
            45,
            window.innerWidth /
            window.innerHeight,
            0.01,
            1000
        );


    camera.position.set(
        0,
        CAMERA_HEIGHT,
        CAMERA_DISTANCE
    );


    camera.lookAt(
        MODEL_CENTER
    );


    /* -----------------------------------------------------
       LIGHT
    ------------------------------------------------------ */

    const hemisphereLight =
        new THREE.HemisphereLight(
            0xffffff,
            0x222222,
            2.2
        );


    scene.add(
        hemisphereLight
    );


    const keyLight =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );


    keyLight.position.set(
        3,
        5,
        4
    );


    scene.add(
        keyLight
    );


    const fillLight =
        new THREE.DirectionalLight(
            0xffffff,
            1
        );


    fillLight.position.set(
        -4,
        2,
        -4
    );


    scene.add(
        fillLight
    );


    /* -----------------------------------------------------
       RENDERER
    ------------------------------------------------------ */

    renderer =
        new THREE.WebGLRenderer({

            antialias: true,

            powerPreference:
                "high-performance"

        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    container.appendChild(
        renderer.domElement
    );


    /* -----------------------------------------------------
       TOUCH FALLBACK
    ------------------------------------------------------ */

    controls =
        new OrbitControls(
            camera,
            renderer.domElement
        );


    controls.enableDamping =
        true;


    controls.dampingFactor =
        0.08;


    controls.enablePan =
        false;


    controls.minDistance =
        1.3;


    controls.maxDistance =
        7;


    controls.target.copy(
        MODEL_CENTER
    );


    controls.update();


    /* -----------------------------------------------------
       RESIZE
    ------------------------------------------------------ */

    window.addEventListener(
        "resize",
        onResize
    );


    /* -----------------------------------------------------
       START LOOP
    ------------------------------------------------------ */

    animate();

}



/* =========================================================
   LOAD MODEL
========================================================== */

function loadModel(filename) {

    const loaderElement =
        document.getElementById(
            "loader"
        );


    const loaderText =
        document.getElementById(
            "loaderText"
        );


    loaderElement.classList.remove(
        "hidden"
    );


    loaderText.textContent =
        "Загрузка 3D модели...";


    /* -----------------------------------------------------
       DELETE OLD MODEL
    ------------------------------------------------------ */

    if (model) {

        scene.remove(
            model
        );


        model.traverse(
            object => {

                if (
                    object.isMesh
                ) {

                    if (
                        object.geometry
                    ) {

                        object.geometry.dispose();

                    }


                    if (
                        Array.isArray(
                            object.material
                        )
                    ) {

                        object.material
                            .forEach(
                                material => {

                                    material.dispose();

                                }
                            );

                    }
                    else if (
                        object.material
                    ) {

                        object.material.dispose();

                    }

                }

            }
        );


        model = null;

    }


    /* -----------------------------------------------------
       URL
    ------------------------------------------------------ */

    const url =
        MODEL_BASE_URL +
        filename;


    /* -----------------------------------------------------
       LOAD
    ------------------------------------------------------ */

    gltfLoader.load(

        url,


        function(gltf) {

            model =
                gltf.scene;


            /* -------------------------------------------------
               CALCULATE BOUNDING BOX
            -------------------------------------------------- */

            const box =
                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            const center =
                box.getCenter(
                    new THREE.Vector3()
                );


            const size =
                box.getSize(
                    new THREE.Vector3()
                );


            /* -------------------------------------------------
               MOVE MODEL CENTER TO 0,0,0
            -------------------------------------------------- */

            model.position.sub(
                center
            );


            /* -------------------------------------------------
               NORMALIZE SIZE
            -------------------------------------------------- */

            const maxSize =
                Math.max(
                    size.x,
                    size.y,
                    size.z
                );


            if (
                maxSize > 0
            ) {

                const desiredSize =
                    2;


                const scale =
                    desiredSize /
                    maxSize;


                model.scale.setScalar(
                    scale
                );

            }


            /* -------------------------------------------------
               ADD MODEL
            -------------------------------------------------- */

            scene.add(
                model
            );


            /* -------------------------------------------------
               RESET CAMERA
            -------------------------------------------------- */

            resetCamera();


            loaderElement.classList.add(
                "hidden"
            );

        },


        function(xhr) {

            if (
                xhr.total > 0
            ) {

                const progress =
                    Math.round(
                        (
                            xhr.loaded /
                            xhr.total
                        ) * 100
                    );


                loaderText.textContent =
                    `Загрузка ${progress}%`;

            }

        },


        function(error) {

            console.error(
                "GLB LOAD ERROR:",
                error
            );


            loaderText.textContent =
                "Ошибка загрузки модели";

        }

    );

}



/* =========================================================
   RESET CAMERA
========================================================== */

function resetCamera() {

    if (!camera) {
        return;
    }


    camera.position.set(
        0,
        CAMERA_HEIGHT,
        CAMERA_DISTANCE
    );


    camera.lookAt(
        MODEL_CENTER
    );


    if (controls) {

        controls.target.copy(
            MODEL_CENTER
        );

        controls.update();

    }


    currentYaw = 0;

    currentPitch = 0;

    targetYaw = 0;

    targetPitch = 0;

}



/* =========================================================
   GALLERY BUTTONS
========================================================== */

document
    .querySelectorAll(
        ".numberButton"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    const filename =
                        button.dataset.model;


                    document
                        .getElementById(
                            "viewerName"
                        )
                        .textContent =
                        "Creature " +
                        button.textContent;


                    showScreen(
                        viewerScreen
                    );


                    if (!renderer) {

                        initThree();

                    }


                    loadModel(
                        filename
                    );

                }
            );

        }
    );



/* =========================================================
   START SENSOR
========================================================== */

async function startSensor() {

    const status =
        document.getElementById(
            "sensorStatus"
        );


    const button =
        document.getElementById(
            "sensorButton"
        );


    /*
        Сбрасываем калибровку.
    */

    startAlpha = null;

    startBeta = null;

    startGamma = null;


    currentYaw = 0;

    currentPitch = 0;

    targetYaw = 0;

    targetPitch = 0;


    /* =====================================================
       TELEGRAM DEVICE ORIENTATION
    ====================================================== */

    if (
        tg &&
        tg.DeviceOrientation &&
        typeof tg.DeviceOrientation.start ===
        "function"
    ) {

        try {

            /*
                Подписываемся ДО запуска.
            */

            tg.onEvent(
                "deviceOrientationChanged",
                onTelegramOrientation
            );


            tg.onEvent(
                "deviceOrientationFailed",
                onTelegramOrientationFailed
            );


            /*
                Запуск.

                20 ms = до 50 обновлений/сек.

                need_absolute=true
                позволяет использовать абсолютную
                ориентацию, если устройство её поддерживает.
            */

            tg.DeviceOrientation.start({

                refresh_rate: 20,

                need_absolute: true

            });


            sensorEnabled = true;


            if (controls) {

                controls.enabled = false;

            }


            button.textContent =
                "Движение включено";


            status.textContent =
                "Сенсоры Telegram активны";


            return;

        }
        catch (error) {

            console.error(
                "Telegram sensor error:",
                error
            );

        }

    }


    /* =====================================================
       BROWSER FALLBACK
    ====================================================== */

    if (
        typeof DeviceOrientationEvent !==
        "undefined"
    ) {

        try {

            /*
                iOS Safari.
            */

            if (
                typeof DeviceOrientationEvent
                    .requestPermission ===
                "function"
            ) {

                const permission =
                    await DeviceOrientationEvent
                        .requestPermission();


                if (
                    permission !==
                    "granted"
                ) {

                    status.textContent =
                        "Доступ к сенсорам запрещён";

                    return;

                }

            }


            window.addEventListener(
                "deviceorientation",
                onBrowserOrientation,
                true
            );


            sensorEnabled = true;


            if (controls) {

                controls.enabled = false;

            }


            button.textContent =
                "Движение включено";


            status.textContent =
                "Сенсоры устройства активны";

        }
        catch (error) {

            console.error(
                "Browser sensor error:",
                error
            );


            status.textContent =
                "Ошибка доступа к сенсорам";

        }

    }
    else {

        status.textContent =
            "Сенсоры не поддерживаются";

    }

}



/* =========================================================
   TELEGRAM ORIENTATION EVENT
========================================================== */

function onTelegramOrientation(data) {

    if (!sensorEnabled) {
        return;
    }


    if (!data) {
        return;
    }


    /*
        Telegram отдаёт:

        alpha → Z
        beta  → X
        gamma → Y

        ЕДИНИЦЫ: радианы.
    */

    const alpha =
        Number(data.alpha) || 0;


    const beta =
        Number(data.beta) || 0;


    const gamma =
        Number(data.gamma) || 0;


    sensorAlpha = alpha;

    sensorBeta = beta;

    sensorGamma = gamma;


    /*
        Первое значение = нулевая точка.
    */

    if (
        startAlpha === null
    ) {

        startAlpha =
            alpha;


        startBeta =
            beta;


        startGamma =
            gamma;


        return;

    }


    /*
        Относительное вращение.
    */

    const deltaAlpha =
        normalizeAngle(
            alpha -
            startAlpha
        );


    const deltaBeta =
        normalizeAngle(
            beta -
            startBeta
        );


    /*
        ПОВОРОТ ТЕЛЕФОНА
        влево / вправо.
    */

    targetYaw =
        deltaAlpha;


    /*
        НАКЛОН ТЕЛЕФОНА
        вверх / вниз.
    */

    targetPitch =
        THREE.MathUtils.clamp(
            deltaBeta,
            -1.30,
            1.30
        );

}



/* =========================================================
   TELEGRAM SENSOR ERROR
========================================================== */

function onTelegramOrientationFailed(
    data
) {

    console.error(
        "Telegram DeviceOrientation failed:",
        data
    );


    sensorEnabled = false;


    const status =
        document.getElementById(
            "sensorStatus"
        );


    status.textContent =
        "Сенсор ориентации недоступен";


    if (controls) {

        controls.enabled = true;

    }

}



/* =========================================================
   BROWSER ORIENTATION
========================================================== */

function onBrowserOrientation(
    event
) {

    if (!sensorEnabled) {
        return;
    }


    if (
        event.alpha === null ||
        event.beta === null ||
        event.gamma === null
    ) {

        return;

    }


    /*
        Browser DeviceOrientation
        использует ГРАДУСЫ.

        Переводим в радианы.
    */

    const alpha =
        THREE.MathUtils.degToRad(
            event.alpha
        );


    const beta =
        THREE.MathUtils.degToRad(
            event.beta
        );


    const gamma =
        THREE.MathUtils.degToRad(
            event.gamma
        );


    if (
        startAlpha === null
    ) {

        startAlpha =
            alpha;


        startBeta =
            beta;


        startGamma =
            gamma;


        return;

    }


    const deltaAlpha =
        normalizeAngle(
            alpha -
            startAlpha
        );


    const deltaBeta =
        normalizeAngle(
            beta -
            startBeta
        );


    targetYaw =
        deltaAlpha;


    targetPitch =
        THREE.MathUtils.clamp(
            deltaBeta,
            -1.30,
            1.30
        );

}



/* =========================================================
   ANGLE NORMALIZATION
========================================================== */

function normalizeAngle(
    angle
) {

    while (
        angle > Math.PI
    ) {

        angle -=
            Math.PI * 2;

    }


    while (
        angle < -Math.PI
    ) {

        angle +=
            Math.PI * 2;

    }


    return angle;

}



/* =========================================================
   SENSOR CAMERA
========================================================== */

function updateSensorCamera() {

    if (
        !sensorEnabled ||
        !camera
    ) {

        return;

    }


    /*
        Плавность.

        Благодаря этому движение
        не дёргается.
    */

    currentYaw +=
        (
            targetYaw -
            currentYaw
        ) *
        SENSOR_SMOOTHING;


    currentPitch +=
        (
            targetPitch -
            currentPitch
        ) *
        SENSOR_SMOOTHING;


    /*
        Радиус вокруг модели.
    */

    const radius =
        CAMERA_DISTANCE;


    /*
        Горизонтальный радиус.
    */

    const horizontalRadius =
        Math.cos(
            currentPitch
        ) *
        radius;


    /*
        Положение камеры
        на сфере вокруг модели.
    */

    const x =
        Math.sin(
            currentYaw
        ) *
        horizontalRadius;


    const y =
        CAMERA_HEIGHT +
        Math.sin(
            currentPitch
        ) *
        radius;


    const z =
        Math.cos(
            currentYaw
        ) *
        horizontalRadius;


    /*
        Плавное перемещение.
    */

    camera.position.lerp(
        new THREE.Vector3(
            x,
            y,
            z
        ),
        SENSOR_SMOOTHING
    );


    /*
        Ключевой момент:

        камера ВСЕГДА смотрит
        в центр модели.

        Модель сама не вращается.
    */

    camera.lookAt(
        MODEL_CENTER
    );

}



/* =========================================================
   SENSOR BUTTON
========================================================== */

document
    .getElementById(
        "sensorButton"
    )
    .addEventListener(
        "click",
        async () => {

            if (
                sensorEnabled
            ) {

                return;

            }


            await startSensor();

        }
    );



/* =========================================================
   STOP SENSOR
========================================================== */

function stopSensor() {

    sensorEnabled = false;


    /*
        Telegram.
    */

    if (
        tg &&
        tg.DeviceOrientation &&
        typeof tg.DeviceOrientation.stop ===
        "function"
    ) {

        try {

            tg.DeviceOrientation.stop();

        }
        catch (error) {

            console.warn(
                error
            );

        }

    }


    /*
        Telegram events.
    */

    if (
        tg &&
        typeof tg.offEvent ===
        "function"
    ) {

        tg.offEvent(
            "deviceOrientationChanged",
            onTelegramOrientation
        );


        tg.offEvent(
            "deviceOrientationFailed",
            onTelegramOrientationFailed
        );

    }


    /*
        Browser.
    */

    window.removeEventListener(
        "deviceorientation",
        onBrowserOrientation,
        true
    );


    /*
        Возвращаем управление
        пальцем.
    */

    if (controls) {

        controls.enabled = true;

    }


    const button =
        document.getElementById(
            "sensorButton"
        );


    const status =
        document.getElementById(
            "sensorStatus"
        );


    button.textContent =
        "Включить движение телефона";


    status.textContent =
        "Сенсоры выключены";


    startAlpha = null;

    startBeta = null;

    startGamma = null;

}



/* =========================================================
   RESIZE
========================================================== */

function onResize() {

    if (
        !camera ||
        !renderer
    ) {

        return;

    }


    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}



/* =========================================================
   ANIMATION
========================================================== */

function animate() {

    animationId =
        requestAnimationFrame(
            animate
        );


    /*
        Обычное управление пальцем.
    */

    if (
        controls &&
        controls.enabled
    ) {

        controls.update();

    }


    /*
        Управление телефоном.
    */

    updateSensorCamera();


    /*
        Рендер.
    */

    if (
        renderer &&
        scene &&
        camera
    ) {

        renderer.render(
            scene,
            camera
        );

    }

}



</script>
