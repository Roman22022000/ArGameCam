<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        http-equiv="Permissions-Policy"
        content="camera=(self), microphone=(), xr-spatial-tracking=(self)"
    >

    <title>AR Game</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;

            font-family: Arial, sans-serif;

            touch-action: none;
        }

        #app {

            position: relative;

            width: 100%;
            height: 100dvh;

            overflow: hidden;

            background: #000;
        }

        /* =====================================
           CAMERA
        ===================================== */

        #camera {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            background: #000;

            z-index: 1;
        }

        /* =====================================
           3D CANVAS
        ===================================== */

        #canvas {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 2;

            pointer-events: auto;
        }

        /* =====================================
           START
        ===================================== */

        #start {

            position: absolute;

            inset: 0;

            z-index: 50;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            padding: 25px;

            background:
                radial-gradient(
                    circle,
                    #202a32,
                    #080b0d
                );

            color: white;

            text-align: center;
        }

        #start h1 {

            font-size: 44px;

            margin-bottom: 15px;
        }

        #start p {

            max-width: 370px;

            opacity: .7;

            line-height: 1.5;

            margin-bottom: 30px;
        }

        #cameraButton {

            min-width: 240px;

            min-height: 54px;

            border: 0;

            border-radius: 17px;

            background: white;

            color: #111;

            font-size: 18px;

            font-weight: 700;
        }

        /* =====================================
           UI
        ===================================== */

        #ui {

            position: absolute;

            inset: 0;

            z-index: 10;

            display: none;

            pointer-events: none;
        }

        #top {

            position: absolute;

            top:
                calc(
                    12px +
                    env(safe-area-inset-top)
                );

            left: 12px;

            right: 12px;

            display: flex;

            justify-content: space-between;
        }

        .badge {

            padding: 10px 14px;

            border-radius: 13px;

            background:
                rgba(0,0,0,.60);

            color: white;

            backdrop-filter: blur(10px);

            font-size: 14px;
        }

        /* =====================================
           STATUS
        ===================================== */

        #status {

            position: absolute;

            left: 50%;

            bottom:
                calc(
                    80px +
                    env(safe-area-inset-bottom)
                );

            transform:
                translateX(-50%);

            width:
                calc(100% - 40px);

            max-width: 430px;

            padding: 12px 15px;

            border-radius: 14px;

            background:
                rgba(0,0,0,.68);

            color: white;

            text-align: center;

            line-height: 1.4;

            backdrop-filter: blur(10px);
        }

        /* =====================================
           RETICLE
        ===================================== */

        #reticle {

            position: absolute;

            left: 50%;

            top: 50%;

            transform:
                translate(-50%, -50%);

            width: 48px;

            height: 48px;

            border:
                2px solid white;

            border-radius: 50%;

            display: none;
        }

        #reticle::before {

            content: "";

            position: absolute;

            left: 50%;

            top: 50%;

            width: 14px;

            height: 2px;

            transform:
                translate(-50%, -50%);

            background: white;
        }

        #reticle::after {

            content: "";

            position: absolute;

            left: 50%;

            top: 50%;

            width: 2px;

            height: 14px;

            transform:
                translate(-50%, -50%);

            background: white;
        }

        /* =====================================
           CONTROLS
        ===================================== */

        #controls {

            position: absolute;

            left: 50%;

            bottom:
                calc(
                    20px +
                    env(safe-area-inset-bottom)
                );

            transform:
                translateX(-50%);

            display: flex;

            gap: 8px;

            pointer-events: auto;
        }

        #controls button {

            min-width: 52px;

            min-height: 48px;

            border: 0;

            border-radius: 14px;

            background:
                rgba(0,0,0,.70);

            color: white;

            font-size: 18px;
        }

        #place {

            min-width: 180px !important;

            background: white !important;

            color: black !important;

            font-size: 16px !important;

            font-weight: 700;
        }

    </style>
</head>


<body>

<div id="app">


    <!-- =====================================
         CAMERA
    ===================================== -->

    <video
        id="camera"
        autoplay
        playsinline
        muted>
    </video>


    <!-- =====================================
         THREE.JS
    ===================================== -->

    <canvas id="canvas"></canvas>


    <!-- =====================================
         START
    ===================================== -->

    <section id="start">

        <h1>AR GAME</h1>

        <p>

            Камера и 3D-объект запускаются
            непосредственно внутри Telegram.

        </p>

        <button id="cameraButton">

            Включить камеру

        </button>

    </section>


    <!-- =====================================
         UI
    ===================================== -->

    <div id="ui">

        <div id="top">

            <div class="badge">
                AR GAME
            </div>

            <div
                class="badge"
                id="userName">

                Player

            </div>

        </div>


        <div id="reticle"></div>


        <div id="status">

            Камера запускается...

        </div>


        <div id="controls">

            <button id="minus">
                −
            </button>

            <button id="place">
                Поставить объект
            </button>

            <button id="plus">
                +
            </button>

        </div>

    </div>

</div>


<script type="module">

/* =====================================================
   THREE.JS
===================================================== */

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import { GLTFLoader } from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


/* =====================================================
   TELEGRAM
===================================================== */

const tg =
    window.Telegram?.WebApp;

if (tg) {

    tg.ready();

    tg.expand();

}


/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("camera");

const canvas =
    document.getElementById("canvas");

const start =
    document.getElementById("start");

const cameraButton =
    document.getElementById("cameraButton");

const ui =
    document.getElementById("ui");

const status =
    document.getElementById("status");

const reticle =
    document.getElementById("reticle");

const placeButton =
    document.getElementById("place");

const minusButton =
    document.getElementById("minus");

const plusButton =
    document.getElementById("plus");


/* =====================================================
   USER
===================================================== */

if (
    tg?.initDataUnsafe?.user
) {

    const user =
        tg.initDataUnsafe.user;

    document.getElementById(
        "userName"
    ).textContent =
        user.first_name ||
        user.username ||
        "Player";

}


/* =====================================================
   THREE
===================================================== */

let scene;

let camera3D;

let renderer;

let model;

let modelReady = false;

let scale = 1;


/* =====================================================
   SIMPLE AR POSITION
===================================================== */

let objectX = 0;

let objectY = 0;

let objectZ = -2;


/* =====================================================
   INIT THREE
===================================================== */

function initThree() {

    scene =
        new THREE.Scene();


    camera3D =
        new THREE.PerspectiveCamera(
            60,
            window.innerWidth /
            window.innerHeight,
            0.01,
            100
        );


    renderer =
        new THREE.WebGLRenderer({

            canvas,

            alpha: true,

            antialias: true

        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    /* =================================
       LIGHT
    ================================= */

    const ambient =
        new THREE.HemisphereLight(
            0xffffff,
            0x666666,
            2
        );

    scene.add(
        ambient
    );


    const directional =
        new THREE.DirectionalLight(
            0xffffff,
            2
        );

    directional.position.set(
        2,
        4,
        2
    );

    scene.add(
        directional
    );


    /* =================================
       LOAD MODEL
    ================================= */

    const loader =
        new GLTFLoader();


    loader.load(

        "./models/creature.glb",

        gltf => {

            model =
                gltf.scene;


            model.scale.set(
                scale,
                scale,
                scale
            );


            model.position.set(
                objectX,
                objectY,
                objectZ
            );


            scene.add(
                model
            );


            modelReady =
                true;


            status.textContent =
                "Камера включена. 3D-объект готов.";

        },


        undefined,

        error => {

            console.error(
                "GLB ERROR",
                error
            );


            status.textContent =
                "Ошибка загрузки creature.glb";

        }

    );


    animate();

}


/* =====================================================
   ANIMATION
===================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    if (model) {

        model.position.x =
            objectX;

        model.position.y =
            objectY;

        model.position.z =
            objectZ;

        model.scale.set(
            scale,
            scale,
            scale
        );

    }


    renderer.render(
        scene,
        camera3D
    );

}


/* =====================================================
   CAMERA
===================================================== */

async function startCamera() {

    cameraButton.disabled =
        true;


    status.textContent =
        "Запрашиваем доступ к камере...";


    try {

        /*
         * Сначала стандартная
         * камера WebView.
         */

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            throw new Error(
                "getUserMedia недоступен"
            );

        }


        const stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal:
                                "environment"
                        },

                        width: {
                            ideal: 1920
                        },

                        height: {
                            ideal: 1080
                        }

                    },

                    audio: false

                });


        video.srcObject =
            stream;


        await video.play();


        /*
         * Интерфейс
         */

        start.style.display =
            "none";


        ui.style.display =
            "block";


        reticle.style.display =
            "block";


        /*
         * Запускаем датчики
         */

        enableMotion();


        /*
         * Проверяем WebXR
         * уже ПОСЛЕ включения камеры.
         */

        checkWebXR();


    }
    catch (error) {

        console.error(
            "CAMERA ERROR:",
            error
        );


        cameraButton.disabled =
            false;


        status.textContent =
            "Камера не запустилась: " +
            error.name;

    }

}


/* =====================================================
   DEVICE MOTION
===================================================== */

async function enableMotion() {

    /*
     * iOS permission
     */

    if (
        typeof DeviceOrientationEvent !==
        "undefined" &&

        typeof DeviceOrientationEvent
            .requestPermission ===
        "function"
    ) {

        try {

            const permission =
                await DeviceOrientationEvent
                    .requestPermission();


            if (
                permission !==
                "granted"
            ) {

                return;

            }

        }
        catch (error) {

            console.error(
                error
            );

        }

    }


    window.addEventListener(

        "deviceorientation",

        event => {

            /*
             * Здесь получаем
             * ориентацию телефона.
             *
             * Это дополнительный
             * слой tracking.
             */

            const alpha =
                THREE.MathUtils.degToRad(
                    event.alpha || 0
                );

            const beta =
                THREE.MathUtils.degToRad(
                    event.beta || 0
                );

            const gamma =
                THREE.MathUtils.degToRad(
                    event.gamma || 0
                );


            const euler =
                new THREE.Euler(
                    beta,
                    alpha,
                    -gamma,
                    "YXZ"
                );


            /*
             * Плавно меняем
             * виртуальную камеру.
             */

            camera3D.quaternion.slerp(
                new THREE.Quaternion()
                    .setFromEuler(euler),
                0.15
            );

        },

        true

    );

}


/* =====================================================
   WEBXR CHECK
===================================================== */

async function checkWebXR() {

    if (
        !navigator.xr
    ) {

        status.textContent =
            "Камера работает. WebXR AR недоступен — используется режим камеры + 3D.";

        return;

    }


    try {

        const supported =
            await navigator.xr
                .isSessionSupported(
                    "immersive-ar"
                );


        if (supported) {

            status.textContent =
                "Камера включена. AR tracking доступен.";

            /*
             * Если immersive-ar есть,
             * здесь можно перейти
             * на настоящий XR-сеанс.
             */

        }
        else {

            status.textContent =
                "Камера работает. AR tracking недоступен в этом Telegram WebView.";

        }

    }
    catch (error) {

        console.error(
            "WebXR CHECK",
            error
        );


        status.textContent =
            "Камера работает. Используется режим 3D.";

    }

}


/* =====================================================
   PLACE
===================================================== */

placeButton.addEventListener(
    "click",
    () => {

        /*
         * Базовое положение
         * объекта перед камерой.
         */

        objectX = 0;

        objectY = 0;

        objectZ = -2;


        if (model) {

            model.visible =
                true;

        }


        status.textContent =
            "Объект размещён. Перемещайтесь вокруг него.";

    }
);


/* =====================================================
   SCALE DOWN
===================================================== */

minusButton.addEventListener(
    "click",
    () => {

        scale =
            Math.max(
                0.1,
                scale - 0.1
            );

    }
);


/* =====================================================
   SCALE UP
===================================================== */

plusButton.addEventListener(
    "click",
    () => {

        scale =
            Math.min(
                5,
                scale + 0.1
            );

    }
);


/* =====================================================
   TOUCH MOVE
===================================================== */

let lastX = null;

let lastY = null;


canvas.addEventListener(
    "pointerdown",
    event => {

        lastX =
            event.clientX;

        lastY =
            event.clientY;

    }
);


canvas.addEventListener(
    "pointermove",
    event => {

        if (
            lastX === null ||
            lastY === null
        ) {

            return;

        }


        const dx =
            event.clientX -
            lastX;

        const dy =
            event.clientY -
            lastY;


        objectX +=
            dx * 0.004;

        objectY -=
            dy * 0.004;


        lastX =
            event.clientX;

        lastY =
            event.clientY;

    }
);


canvas.addEventListener(
    "pointerup",
    () => {

        lastX =
            null;

        lastY =
            null;

    }
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        if (!renderer) {
            return;
        }


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        camera3D.aspect =
            window.innerWidth /
            window.innerHeight;


        camera3D.updateProjectionMatrix();

    }
);


/* =====================================================
   START
===================================================== */

initThree();


cameraButton.addEventListener(
    "click",
    startCamera
);

</script>

</body>
</html>
