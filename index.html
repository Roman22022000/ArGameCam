<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1,
    maximum-scale=1,
    user-scalable=no,
    viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>AR Space</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    font-family:
        Arial,
        sans-serif;

    touch-action: none;
}

body {
    position: fixed;
    inset: 0;
}

#app {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;
}


/* =========================================
   START
========================================= */

#startScreen {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #000;

    color: #fff;

    padding: 20px;
}

#startContent {

    width: 100%;
    max-width: 360px;

    text-align: center;
}

#startContent h1 {

    margin: 0 0 10px;

    font-size: 42px;

    letter-spacing: 7px;
}

#startContent p {

    margin: 0 0 35px;

    color: #777;

    font-size: 14px;
}

#startButton {

    width: 100%;

    height: 58px;

    border: 0;

    border-radius: 14px;

    background: #fff;

    color: #000;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;

    -webkit-tap-highlight-color:
        transparent;
}

#startButton:active {

    transform: scale(.98);
}

#startButton:disabled {

    opacity: .5;
}

#startStatus {

    margin-top: 14px;

    min-height: 18px;

    color: #777;

    font-size: 12px;
}


/* =========================================
   CAMERA
========================================= */

#camera {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: none;

    z-index: 1;

    background: #000;
}


/* =========================================
   THREE CANVAS
========================================= */

#arCanvas {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 2;

    display: none;

    pointer-events: none;
}


/* =========================================
   AR UI
========================================= */

#arUI {

    position: fixed;

    inset: 0;

    z-index: 10;

    display: none;

    pointer-events: none;
}


/* =========================================
   TOP
========================================= */

#topBar {

    position: absolute;

    top:
        calc(
            12px +
            env(safe-area-inset-top)
        );

    left: 12px;
    right: 12px;

    display: flex;

    align-items: center;

    justify-content:
        space-between;
}

#arStatus {

    padding:
        9px 14px;

    border-radius: 20px;

    background:
        rgba(0,0,0,.65);

    color: #fff;

    font-size: 12px;

    backdrop-filter:
        blur(10px);
}

#closeButton {

    width: 44px;
    height: 44px;

    border: 0;

    border-radius: 50%;

    background:
        rgba(0,0,0,.7);

    color: #fff;

    font-size: 27px;

    pointer-events: auto;
}


/* =========================================
   RETICLE
========================================= */

#reticle {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 42px;
    height: 42px;

    transform:
        translate(
            -50%,
            -50%
        );

    border:
        1px solid
        rgba(255,255,255,.8);

    border-radius: 50%;
}


/* =========================================
   PLACE BUTTON
========================================= */

#bottomBar {

    position: absolute;

    left: 20px;
    right: 20px;

    bottom:
        calc(
            20px +
            env(safe-area-inset-bottom)
        );

    display: flex;

    justify-content: center;
}

#addModelButton {

    width: 100%;

    max-width: 360px;

    height: 56px;

    border:
        1px solid
        rgba(255,255,255,.85);

    border-radius: 14px;

    background:
        rgba(0,0,0,.75);

    color: #fff;

    font-size: 14px;

    font-weight: 700;

    pointer-events: auto;

    display: none;

    -webkit-tap-highlight-color:
        transparent;
}

#addModelButton:active {

    transform: scale(.98);
}


/* =========================================
   ERROR
========================================= */

#errorScreen {

    position: fixed;

    inset: 0;

    z-index: 500;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 25px;

    background: #000;

    color: #fff;

    text-align: center;
}

#errorText {

    max-width: 380px;

    line-height: 1.5;

    font-size: 14px;
}

</style>
</head>


<body>


<div id="app">


    <!-- =====================================
         START
    ====================================== -->

    <section id="startScreen">

        <div id="startContent">

            <h1>
                AR
            </h1>

            <p>
                Telegram AR
            </p>

            <button
                id="startButton"
                type="button"
            >
                ЗАПУСК КАМЕРЫ
            </button>

            <div id="startStatus">
                Готово
            </div>

        </div>

    </section>


    <!-- =====================================
         CAMERA
    ====================================== -->

    <video
        id="camera"
        autoplay
        muted
        playsinline
    ></video>


    <!-- =====================================
         THREE
    ====================================== -->

    <canvas
        id="arCanvas"
    ></canvas>


    <!-- =====================================
         AR UI
    ====================================== -->

    <section id="arUI">


        <div id="topBar">

            <div id="arStatus">
                КАМЕРА
            </div>


            <button
                id="closeButton"
                type="button"
            >
                ×
            </button>

        </div>


        <div id="reticle"></div>


        <div id="bottomBar">

            <button
                id="addModelButton"
                type="button"
            >
                ДОБАВИТЬ 3D МОДЕЛЬ
            </button>

        </div>


    </section>


    <!-- =====================================
         ERROR
    ====================================== -->

    <section id="errorScreen">

        <div id="errorText"></div>

    </section>


</div>


<!-- =========================================
     THREE.JS
========================================= -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>


<script>

/* =================================================
   TELEGRAM
================================================= */

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;


/* =================================================
   ELEMENTS
================================================= */

const startScreen =
    document.getElementById(
        "startScreen"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const startStatus =
    document.getElementById(
        "startStatus"
    );

const cameraVideo =
    document.getElementById(
        "camera"
    );

const canvas =
    document.getElementById(
        "arCanvas"
    );

const arUI =
    document.getElementById(
        "arUI"
    );

const arStatus =
    document.getElementById(
        "arStatus"
    );

const addModelButton =
    document.getElementById(
        "addModelButton"
    );

const closeButton =
    document.getElementById(
        "closeButton"
    );

const errorScreen =
    document.getElementById(
        "errorScreen"
    );

const errorText =
    document.getElementById(
        "errorText"
    );


/* =================================================
   STATE
================================================= */

let cameraStream = null;

let renderer = null;

let scene = null;

let xrCamera = null;

let xrSession = null;

let xrReferenceSpace = null;

let viewerSpace = null;

let hitTestSource = null;

let currentHit = null;

let anchor = null;

let model = null;

let modelLoaded = false;

let modelPlaced = false;


/* =================================================
   TELEGRAM INIT
================================================= */

function initTelegram() {

    if (!tg) {
        return;
    }


    tg.ready();


    tg.expand();


    try {

        tg.setHeaderColor(
            "#000000"
        );

        tg.setBackgroundColor(
            "#000000"
        );

        tg.disableVerticalSwipes();

    } catch (_) {}

}

initTelegram();


/* =================================================
   START
================================================= */

startButton.addEventListener(
    "click",
    startApplication
);


async function startApplication() {

    startButton.disabled =
        true;

    startStatus.textContent =
        "Запуск камеры...";


    try {

        await startCamera();


        startMotion();


        initThree();


        loadCreature();


        startScreen.style.display =
            "none";


        cameraVideo.style.display =
            "block";


        arUI.style.display =
            "block";


        await startWebXR();


    } catch (error) {

        console.error(
            error
        );


        startButton.disabled =
            false;


        showError(
            error.message ||
            "Не удалось запустить камеру."
        );

    }

}


/* =================================================
   CAMERA
================================================= */

async function startCamera() {

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        throw new Error(
            "Camera API недоступен."
        );
    }


    cameraStream =
        await navigator
            .mediaDevices
            .getUserMedia({

                video: {

                    facingMode: {
                        ideal:
                            "environment"
                    },

                    width: {
                        ideal:
                            1920
                    },

                    height: {
                        ideal:
                            1080
                    },

                    frameRate: {
                        ideal:
                            30
                    }

                },

                audio: false

            });


    cameraVideo.srcObject =
        cameraStream;


    await cameraVideo.play();

}


/* =================================================
   TELEGRAM MOTION
================================================= */

function startMotion() {

    if (!tg) {
        return;
    }


    /*
     * Device Orientation
     */

    if (
        tg.DeviceOrientation
    ) {

        try {

            tg.DeviceOrientation.start(

                {
                    refresh_rate: 50,
                    need_absolute: false
                },

                function(ok) {

                    console.log(
                        "DeviceOrientation:",
                        ok
                    );

                }

            );

        } catch (error) {

            console.log(
                "DeviceOrientation:",
                error
            );

        }

    }


    /*
     * Gyroscope
     */

    if (
        tg.Gyroscope
    ) {

        try {

            tg.Gyroscope.start(

                {
                    refresh_rate: 50
                },

                function(ok) {

                    console.log(
                        "Gyroscope:",
                        ok
                    );

                }

            );

        } catch (error) {

            console.log(
                "Gyroscope:",
                error
            );

        }

    }


    /*
     * Accelerometer
     */

    if (
        tg.Accelerometer
    ) {

        try {

            tg.Accelerometer.start(

                {
                    refresh_rate: 50
                },

                function(ok) {

                    console.log(
                        "Accelerometer:",
                        ok
                    );

                }

            );

        } catch (error) {

            console.log(
                "Accelerometer:",
                error
            );

        }

    }


    /*
     * GPS НЕ ИСПОЛЬЗУЕМ.
     */


    try {

        tg.lockOrientation();

    } catch (_) {}

}


/* =================================================
   THREE INIT
================================================= */

function initThree() {

    if (renderer) {
        return;
    }


    scene =
        new THREE.Scene();


    renderer =
        new THREE.WebGLRenderer({

            canvas:
                canvas,

            alpha:
                true,

            antialias:
                true,

            powerPreference:
                "high-performance"

        });


    renderer.setPixelRatio(

        Math.min(
            window.devicePixelRatio,
            2
        )

    );


    renderer.setSize(

        window.innerWidth,
        window.innerHeight

    );


    renderer.xr.enabled =
        true;


    canvas.style.display =
        "block";


    /*
     * Camera
     */

    xrCamera =
        new THREE.PerspectiveCamera(

            70,

            window.innerWidth /
            window.innerHeight,

            0.01,

            100

        );


    scene.add(
        xrCamera
    );


    /*
     * Lighting
     */

    const hemisphere =
        new THREE.HemisphereLight(

            0xffffff,

            0x444444,

            2

        );


    scene.add(
        hemisphere
    );


    const directional =
        new THREE.DirectionalLight(

            0xffffff,

            1.5

        );


    directional.position.set(
        2,
        4,
        2
    );


    scene.add(
        directional
    );

}


/* =================================================
   LOAD CREATURE
================================================= */

function loadCreature() {

    const loader =
        new THREE.GLTFLoader();


    loader.load(

        "./models/creature.glb",


        function(gltf) {

            model =
                gltf.scene;


            /*
             * Начальный масштаб.
             */

            model.scale.set(

                0.5,
                0.5,
                0.5

            );


            model.visible =
                false;


            scene.add(
                model
            );


            modelLoaded =
                true;


            arStatus.textContent =
                "МОДЕЛЬ ГОТОВА";


            console.log(
                "creature.glb loaded"
            );

        },


        function(progress) {

            if (
                progress.total
            ) {

                const percent =
                    Math.round(

                        progress.loaded /
                        progress.total *
                        100

                    );


                console.log(
                    "creature.glb:",
                    percent + "%"
                );

            }

        },


        function(error) {

            console.error(
                "creature.glb:",
                error
            );


            arStatus.textContent =
                "ОШИБКА МОДЕЛИ";

        }

    );

}


/* =================================================
   WEBXR AR
================================================= */

async function startWebXR() {

    /*
     * WebXR является AR-слоем.
     */

    if (
        !navigator.xr
    ) {

        arStatus.textContent =
            "AR НЕ ДОСТУПЕН";

        return;

    }


    try {

        /*
         * Запускаем immersive AR.
         *
         * local-floor:
         * локальная система
         * координат пола.
         *
         * hit-test:
         * поиск реальной поверхности.
         */

        xrSession =
            await navigator.xr
                .requestSession(

                    "immersive-ar",

                    {

                        requiredFeatures: [

                            "local-floor",

                            "hit-test"

                        ],

                        optionalFeatures: [

                            "anchors"

                        ]

                    }

                );


        /*
         * Передаём XR-сессию
         * Three.js.
         */

        await renderer.xr
            .setSession(
                xrSession
            );


        /*
         * Local World Space
         */

        xrReferenceSpace =
            await xrSession
                .requestReferenceSpace(
                    "local-floor"
                );


        /*
         * Viewer Space
         */

        viewerSpace =
            await xrSession
                .requestReferenceSpace(
                    "viewer"
                );


        /*
         * Hit Test Source
         */

        hitTestSource =
            await xrSession
                .requestHitTestSource({

                    space:
                        viewerSpace

                });


        /*
         * Показываем кнопку.
         */

        addModelButton.style.display =
            "block";


        arStatus.textContent =
            "НАВЕДИТЕ НА ПОЛ";


        /*
         * AR render loop.
         */

        renderer.setAnimationLoop(
            renderAR
        );


        /*
         * Завершение AR.
         */

        xrSession.addEventListener(

            "end",

            function() {

                xrSession =
                    null;

                hitTestSource =
                    null;

                xrReferenceSpace =
                    null;

                viewerSpace =
                    null;

                currentHit =
                    null;

                anchor =
                    null;

                renderer.setAnimationLoop(
                    null
                );

            }

        );


    } catch (error) {

        console.error(
            "WebXR:",
            error
        );


        arStatus.textContent =
            "AR НЕДОСТУПЕН";

    }

}


/* =================================================
   AR FRAME
================================================= */

function renderAR(
    time,
    frame
) {

    if (
        !frame ||
        !xrReferenceSpace
    ) {

        return;
    }


    /*
     * Пока модель не установлена,
     * ищем поверхность пола.
     */

    if (
        hitTestSource &&
        !modelPlaced
    ) {

        const results =
            frame.getHitTestResults(
                hitTestSource
            );


        if (
            results.length > 0
        ) {

            currentHit =
                results[0];


            arStatus.textContent =
                "ПОВЕРХНОСТЬ НАЙДЕНА";


        } else {

            currentHit =
                null;


            arStatus.textContent =
                "ИЩЕМ ПОВЕРХНОСТЬ";

        }

    }


    /*
     * После создания Anchor
     * постоянно получаем его
     * актуальную мировую позу.
     */

    if (
        anchor &&
        model
    ) {

        const pose =
            frame.getPose(

                anchor.anchorSpace,

                xrReferenceSpace

            );


        if (pose) {

            model.matrix
                .fromArray(

                    pose.transform.matrix

                );


            model.matrix
                .decompose(

                    model.position,

                    model.quaternion,

                    model.scale

                );

        }

    }


    renderer.render(
        scene,
        xrCamera
    );

}


/* =================================================
   ADD MODEL BUTTON
================================================= */

addModelButton.addEventListener(

    "click",

    addModel

);


/* =================================================
   ADD MODEL
================================================= */

async function addModel() {

    /*
     * Проверяем загрузку
     * самой модели.
     */

    if (
        !modelLoaded ||
        !model
    ) {

        arStatus.textContent =
            "МОДЕЛЬ ЕЩЁ ЗАГРУЖАЕТСЯ";

        return;

    }


    /*
     * Проверяем найденную
     * поверхность.
     */

    if (
        !currentHit
    ) {

        arStatus.textContent =
            "НАВЕДИТЕ КАМЕРУ НА ПОЛ";

        return;

    }


    /*
     * Получаем локальную
     * позицию поверхности.
     */

    const pose =
        currentHit.getPose(
            xrReferenceSpace
        );


    if (!pose) {

        arStatus.textContent =
            "ПОВЕРХНОСТЬ НЕ ОПРЕДЕЛЕНА";

        return;

    }


    /*
     * Сначала ставим модель
     * точно в найденную точку.
     */

    model.matrix
        .fromArray(

            pose.transform.matrix

        );


    model.matrix
        .decompose(

            model.position,

            model.quaternion,

            model.scale

        );


    /*
     * Пытаемся создать Anchor.
     *
     * Anchor удерживает объект
     * в локальном пространстве.
     */

    if (
        typeof currentHit.createAnchor ===
        "function"
    ) {

        try {

            anchor =
                await currentHit
                    .createAnchor();


        } catch (error) {

            console.log(
                "Anchor unavailable:",
                error
            );


            anchor =
                null;

        }

    }


    /*
     * Показываем creature.
     */

    model.visible =
        true;


    modelPlaced =
        true;


    /*
     * Больше не ищем
     * новую точку пола.
     */

    currentHit =
        null;


    addModelButton.style.display =
        "none";


    arStatus.textContent =

        anchor
            ? "CREATURE ЗАКРЕПЛЁН"
            : "CREATURE РАЗМЕЩЁН";

}


/* =================================================
   CLOSE
================================================= */

closeButton.addEventListener(

    "click",

    stopAR

);


async function stopAR() {

    /*
     * Anchor
     */

    if (
        anchor
    ) {

        try {

            anchor.delete();

        } catch (_) {}

        anchor =
            null;

    }


    /*
     * XR
     */

    if (
        xrSession
    ) {

        try {

            await xrSession.end();

        } catch (_) {}

    }


    /*
     * Camera
     */

    if (
        cameraStream
    ) {

        cameraStream
            .getTracks()
            .forEach(

                function(track) {

                    track.stop();

                }

            );


        cameraStream =
            null;

    }


    cameraVideo.srcObject =
        null;


    /*
     * Telegram sensors
     */

    if (tg) {

        try {
            tg.DeviceOrientation?.stop();
        } catch (_) {}

        try {
            tg.Gyroscope?.stop();
        } catch (_) {}

        try {
            tg.Accelerometer?.stop();
        } catch (_) {}

        try {
            tg.unlockOrientation();
        } catch (_) {}

    }


    /*
     * Render
     */

    if (
        renderer
    ) {

        renderer.setAnimationLoop(
            null
        );

    }


    /*
     * UI
     */

    cameraVideo.style.display =
        "none";

    canvas.style.display =
        "none";

    arUI.style.display =
        "none";

    startScreen.style.display =
        "flex";

    startButton.disabled =
        false;

    startStatus.textContent =
        "Готово";


    /*
     * State
     */

    modelPlaced =
        false;

    currentHit =
        null;


    if (model) {

        model.visible =
            false;

    }

}


/* =================================================
   ERROR
================================================= */

function showError(
    message
) {

    errorText.textContent =
        message;

    errorScreen.style.display =
        "flex";

}


/* =================================================
   RESIZE
================================================= */

window.addEventListener(

    "resize",

    function() {

        if (
            renderer
        ) {

            renderer.setSize(

                window.innerWidth,

                window.innerHeight

            );

        }


        if (
            xrCamera
        ) {

            xrCamera.aspect =

                window.innerWidth /
                window.innerHeight;


            xrCamera.updateProjectionMatrix();

        }

    }

);

</script>

</body>
</html>
