const TON_MANIFEST =

const REQUIRED_COLLECTION =

const REQUIRED_COLLECTION_RAW =

/* =============================================================

/*

/* =============================================================
   TON ADDRESS
============================================================= */

function base64UrlToBytes(value) {

    let normalized =
        String(value)
            .replace(/-/g, "+")
            .replace(/_/g, "/");


    while (
        normalized.length % 4 !== 0
    ) {

        normalized += "=";

    }


    const binary =
        atob(normalized);


    const bytes =
        new Uint8Array(
            binary.length
        );


    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(i);

    }


    return bytes;

}


function normalizeTonAddress(address) {

    if (!address) {
        return "";
    }


    address =
        String(address).trim();


    /*
        Уже raw:
        0:64hex
    */

    if (
        /^-?\d+:[0-9a-fA-F]{64}$/
            .test(address)
    ) {

        const parts =
            address.split(":");


        return (
            parts[0] +
            ":" +
            parts[1].toLowerCase()
        );

    }


    /*
        Friendly:
        EQ...
        UQ...
    */

    try {

        const bytes =
            base64UrlToBytes(
                address
            );


        if (
            bytes.length !== 36
        ) {

            return address.toLowerCase();

        }


        let workchain =
            bytes[1];


        if (
            workchain === 255
        ) {

            workchain = -1;

        }


        let hash = "";


        for (
            let i = 2;
            i < 34;
            i++
        ) {

            hash +=
                bytes[i]
                    .toString(16)
                    .padStart(2, "0");

        }


        return (
            workchain +
            ":" +
            hash.toLowerCase()
        );

    } catch {

        return address.toLowerCase();

    }

}


const normalizedRequiredCollection =
    normalizeTonAddress(
        REQUIRED_COLLECTION
    );


/* =============================================================
   NFT CHECK
============================================================= */

async function checkCollectionNFT(
    walletAddress
) {

    const url =
        "https://tonapi.io/v2/accounts/" +
        encodeURIComponent(
            walletAddress
        ) +
        "/nfts?limit=1000";


    const response =
        await fetch(url, {

            method: "GET",

            headers: {
                "Accept":
                    "application/json"
            }

        });


    if (!response.ok) {

        throw new Error(
            "TonAPI HTTP " +
            response.status
        );

    }


    const data =
        await response.json();


    const nftItems =
        Array.isArray(
            data.nft_items
        )
            ? data.nft_items
            : [];


    for (
        const nft of nftItems
    ) {

        const collectionAddress =
            nft.collection?.address ||
            nft.collection_address ||
            "";


        if (!collectionAddress) {
            continue;
        }


        const normalized =
            normalizeTonAddress(
                collectionAddress
            );


        if (
            normalized ===
                normalizedRequiredCollection
            ||
            normalized ===
                REQUIRED_COLLECTION_RAW
        ) {

            return true;

        }

    }


    return false;

}


/* =============================================================
   WALLET
============================================================= */

let currentWallet =
    null;

let accessGranted =
    false;

let checkingNFT =
    false;


async function processWallet(
    wallet
) {

    if (!wallet) {

        currentWallet =
            null;

        accessGranted =
            false;

        userWalletAddress.textContent =
            "";

        userStatus.textContent =
            "";

        authStatus.textContent =
            "Подключите TON-кошелёк";

        showScreen(
            authScreen
        );

        return;

    }


    if (
        checkingNFT
    ) {

        return;

    }


    if (
        !wallet.account ||
        !wallet.account.address
    ) {

        return;

    }


    currentWallet =
        wallet.account.address;


    accessGranted =
        false;

    checkingNFT =
        true;


    authStatus.textContent =
        "Проверка NFT...";


    loading.classList.add(
        "active"
    );


    try {

        const hasNFT =
            await checkCollectionNFT(
                currentWallet
            );


        if (!hasNFT) {

            accessGranted =
                false;


            authStatus.textContent =
                "NFT нужной коллекции не найден";


            showScreen(
                authScreen
            );


            return;

        }


        accessGranted =
            true;


        userWalletAddress.textContent =
            currentWallet;


        authStatus.textContent =
            "Доступ разрешён";


        showScreen(
            homeScreen
        );


    } catch (error) {

        console.error(
            "NFT CHECK ERROR:",
            error
        );


        accessGranted =
            false;


        authStatus.textContent =
            "Ошибка проверки NFT";


        showScreen(
            authScreen
        );


    } finally {

let archiveModels = [];

async function loadArchiveModels() {

    archiveStatus.textContent =
        "Загрузка 3D моделей...";

    archiveGrid.innerHTML =
        "";

    try {

        const response =
            await fetch(
                ARCHIVE_API,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const data =
            await response.json();

        archiveModels =
            Array.isArray(data.items)
                ? data.items
                : [];

        if (!archiveModels.length) {

            archiveStatus.textContent =
                "В архиве пока нет 3D моделей.";

            return;
        }

        archiveStatus.textContent =
            "Моделей: " +
            archiveModels.length;

        archiveModels.forEach(
            (item, index) => {

                const button =
                    document.createElement(
                        "button"
                    );

                button.type =
                    "button";

                button.className =
                    "archiveItem";

                const preview =
                    document.createElement(
                        "div"
                    );

                preview.className =
                    "archivePlaceholder";

                preview.textContent =
                    "3D";

                button.appendChild(
                    preview
                );

                const info =
                    document.createElement(
                        "div"
                    );

                info.className =
                    "archiveInfo";

                const name =
                    document.createElement(
                        "div"
                    );

                name.className =
                    "archiveName";

                name.textContent =
                    item.filename || "model";

                const folder =
                    document.createElement(
                        "div"
                    );

                folder.className =
                    "archiveFolder";

                folder.textContent =
                    (
                        item.folder || ""
                    ).toUpperCase();

                info.appendChild(
                    name
                );

                info.appendChild(
                    folder
                );

                button.appendChild(
                    info
                );

                button.addEventListener(
                    "click",
                    () => {
                        openArchiveViewer(
                            index
                        );
                    }
                );

                archiveGrid.appendChild(
                    button
                );

            }
        );

    } catch (error) {

        console.error(
            "ARCHIVE ERROR:",
            error
        );

        archiveStatus.textContent =
            "Не удалось получить архив.";

    }

}


async function openArchiveViewer(index) {

    viewerOpenedFromArchive = true;

    if (!requireAccess()) {
        return;
    }

    const item =
        archiveModels[index];

    if (!item) {
        return;
    }

    currentModelItem = item;

    viewerNumber.textContent =
        item.filename || "3D";

    showScreen(viewerScreen);
    initViewer();
    clearCurrentModel();

    archiveStatus.textContent =
        "Загрузка модели: " +
        (item.filename || "model") + "...";

    try {

        const loadedObject =
            await loadArchiveModel(item);

        prepareModel(loadedObject);

        archiveStatus.textContent =
            "Модель загружена: " +
            (item.filename || "model");

    } catch (error) {

        console.error(
            "ARCHIVE MODEL ERROR:",
            error
        );

        archiveStatus.textContent =
            "Ошибка модели/текстур: " +
            (error.message || error);

        clearCurrentModel();
    }
}

/* =============================================================
   THREE.JS VIEWER
   Загрузка моделей из GUI-сервера.
   Поддержка GLB / GLTF / FBX / OBJ / STL.
   Внешние BIN / MTL / PNG / JPG / WEBP ресурсы
   запрашиваются через серверный resource endpoint.
============================================================= */

let scene = null;
let camera = null;
let renderer = null;
let controls = null;
let model = null;
let viewerOpenedFromArchive = false;
let currentModelItem = null;

const gltfLoader = new GLTFLoader();
const fbxLoader = new FBXLoader();
const objLoader = new OBJLoader();
const mtlLoader = new MTLLoader();
const stlLoader = new STLLoader();

const ARCHIVE_API_ORIGIN =
    new URL(ARCHIVE_API).origin;


/* =============================================================
   URL RESOURCE RESOLVER
============================================================= */

function getAbsoluteModelUrl(item) {

    if (!item || !item.url) {
        throw new Error("У модели отсутствует URL");
    }

    return new URL(
        item.url,
        ARCHIVE_API
    ).href;
}


function encodeResourcePath(value) {

    return String(value || "")
        .split("/")
        .filter(Boolean)
        .map(part => encodeURIComponent(part))
        .join("/");
}


function createResourceManager(item) {

    const manager = new THREE.LoadingManager();

    manager.setURLModifier(resourceUrl => {

        if (
            resourceUrl.startsWith("data:") ||
            resourceUrl.startsWith("blob:")
        ) {
            return resourceUrl;
        }

        let path = resourceUrl;

        try {

            const parsed = new URL(
                resourceUrl,
                getAbsoluteModelUrl(item)
            );

            /* Сам файл модели нельзя перенаправлять
               на resource endpoint. */
            if (
                parsed.href ===
                getAbsoluteModelUrl(item)
            ) {
                return parsed.href;
            }

            path = parsed.pathname;

            if (path.includes("/api/models/resource/")) {
                return parsed.href;
            }

            if (parsed.origin !== ARCHIVE_API_ORIGIN) {
                path = parsed.pathname;
            }

        } catch (error) {
            console.warn("RESOURCE URL:", resourceUrl, error);
        }

        const cleanPath =
            String(path)
                .split("?")[0]
                .split("#")[0]
                .replace(/^\/+/, "");

        const resourcePath =
            encodeResourcePath(
                cleanPath.split("/").pop() || cleanPath
            );

        return (
            ARCHIVE_API_ORIGIN +
            "/api/models/resource/" +
            encodeURIComponent(String(item.id)) +
            "/" +
            resourcePath
        );

    });

    return manager;
}


function createLoaderForItem(item) {

    const manager =
        createResourceManager(item);

    const extension =
        String(
            item.extension ||
            item.filename ||
            ""
        )
        .toLowerCase()
        .split("?")[0]
        .split(".")
        .pop();

    if (extension === "glb" || extension === "gltf") {
        return {
            type: extension,
            loader: new GLTFLoader(manager)
        };
    }

    if (extension === "fbx") {
        return {
            type: "fbx",
            loader: new FBXLoader(manager)
        };
    }

    if (extension === "obj") {
        return {
            type: "obj",
            loader: new OBJLoader(manager),
            manager
        };
    }

    if (extension === "stl") {
        return {
            type: "stl",
            loader: new STLLoader(manager)
        };
    }

    throw new Error(
        "Формат не поддерживается: " +
        extension
    );
}


/* =============================================================
   MODEL CLEANUP
============================================================= */

function disposeMaterial(material) {

    if (!material) {
        return;
    }

    const maps = [
        "map",
        "alphaMap",
        "aoMap",
        "bumpMap",
        "clearcoatMap",
        "clearcoatNormalMap",
        "clearcoatRoughnessMap",
        "displacementMap",
        "emissiveMap",
        "metalnessMap",
        "normalMap",
        "roughnessMap",
        "sheenColorMap",
        "sheenRoughnessMap",
        "specularColorMap",
        "specularIntensityMap",
        "transmissionMap"
    ];

    maps.forEach(key => {
        const texture = material[key];
        if (texture && texture.isTexture) {
            texture.dispose();
        }
    });

    material.dispose();
}


function clearCurrentModel() {

    if (!model || !scene) {
        model = null;
        return;
    }

    scene.remove(model);

    model.traverse(object => {

        if (object.geometry) {
            object.geometry.dispose();
        }

        if (object.material) {

            if (Array.isArray(object.material)) {
                object.material.forEach(disposeMaterial);
            } else {
                disposeMaterial(object.material);
            }

        }

    });

    model = null;
}


/* =============================================================
   MODEL NORMALIZATION
============================================================= */

function prepareModel(object) {

    if (!object) {
        throw new Error("Пустая 3D модель");
    }

    model = object;

    const box =
        new THREE.Box3().setFromObject(model);

    if (box.isEmpty()) {
        throw new Error("У модели нет видимой геометрии");
    }

    const center =
        box.getCenter(new THREE.Vector3());

    const size =
        box.getSize(new THREE.Vector3());

    model.position.sub(center);

    const maxSize =
        Math.max(size.x, size.y, size.z);

    if (
        Number.isFinite(maxSize) &&
        maxSize > 0
    ) {
        model.scale.setScalar(2 / maxSize);
    }

    model.traverse(object3d => {

        if (object3d.isMesh) {
            object3d.castShadow = true;
            object3d.receiveShadow = true;

            if (object3d.material) {

                const materials =
                    Array.isArray(object3d.material)
                        ? object3d.material
                        : [object3d.material];

                materials.forEach(material => {
                    material.side = THREE.DoubleSide;
                    material.needsUpdate = true;
                });
            }
        }

    });

    scene.add(model);

    controls.target.set(0, 0, 0);

    const normalizedBox =
        new THREE.Box3().setFromObject(model);

    const normalizedSize =
        normalizedBox.getSize(new THREE.Vector3());

    const radius =
        Math.max(
            normalizedSize.x,
            normalizedSize.y,
            normalizedSize.z
        ) * 0.5;

    controls.minDistance =
        Math.max(0.05, radius * 0.15);

    controls.maxDistance =
        Math.max(3, radius * 8);

    camera.position.set(
        0,
        Math.max(0.2, radius * 0.4),
        Math.max(2.5, radius * 2.5)
    );

    controls.update();
}


/* =============================================================
   OBJECT LOADER HELPERS
============================================================= */

function loadGLTF(item, url) {

    const result =
        createLoaderForItem(item);

    return new Promise((resolve, reject) => {

        result.loader.load(

            url,

            gltf => {
                resolve(gltf.scene);
            },

            progress => {
                if (progress && progress.total) {
                    const percent =
                        Math.round(
                            progress.loaded /
                            progress.total * 100
                        );

                    archiveStatus.textContent =
                        "Загрузка: " +
                        percent + "%";
                }
            },

            reject
        );

    });
}


function loadFBX(item, url) {

    const result =
        createLoaderForItem(item);

    return new Promise((resolve, reject) => {

        result.loader.load(
            url,
            resolve,
            progress => {
                if (progress && progress.total) {
                    archiveStatus.textContent =
                        "Загрузка: " +
                        Math.round(
                            progress.loaded /
                            progress.total * 100
                        ) + "%";
                }
            },
            reject
        );

    });
}


async function loadOBJ(item, url) {

    const manager =
        createResourceManager(item);

    const obj =
        new OBJLoader(manager);

    const mtl =
        new MTLLoader(manager);

    const filename =
        String(item.filename || "model.obj");

    const baseName =
        filename.replace(/\.[^.]+$/, "");

    const mtlUrl =
        ARCHIVE_API_ORIGIN +
        "/api/models/resource/" +
        encodeURIComponent(String(item.id)) +
        "/" +
        encodeURIComponent(baseName + ".mtl");

    let materials = null;

    try {

        materials = await new Promise(
            (resolve, reject) => {

                mtl.load(
                    mtlUrl,
                    resolve,
                    undefined,
                    reject
                );

            }
        );

        materials.preload();
        obj.setMaterials(materials);

    } catch (error) {
        console.warn(
            "MTL не найден, OBJ будет загружен без MTL:",
            error
        );
    }

    return await new Promise(
        (resolve, reject) => {

            obj.load(
                url,
                resolve,
                progress => {
                    if (progress && progress.total) {
                        archiveStatus.textContent =
                            "Загрузка: " +
                            Math.round(
                                progress.loaded /
                                progress.total * 100
                            ) + "%";
                    }
                },
                reject
            );

        }
    );
}


async function loadSTL(item, url) {

    const result =
        createLoaderForItem(item);

    return await new Promise(
        (resolve, reject) => {

            result.loader.load(
                url,
                geometry => {

                    const material =
                        new THREE.MeshStandardMaterial({
                            color: 0xffffff,
                            roughness: 0.7,
                            metalness: 0.05
                        });

                    resolve(
                        new THREE.Mesh(
                            geometry,
                            material
                        )
                    );
                },
                undefined,
                reject
            );

        }
    );
}


async function loadArchiveModel(item) {

    const url =
        getAbsoluteModelUrl(item);

    const extension =
        String(
            item.extension ||
            item.filename ||
            ""
        )
        .toLowerCase()
        .split(".")
        .pop();

    if (
        extension === "glb" ||
        extension === "gltf"
    ) {
        return await loadGLTF(item, url);
    }

    if (extension === "fbx") {
        return await loadFBX(item, url);
    }

    if (extension === "obj") {
        return await loadOBJ(item, url);
    }

    if (extension === "stl") {
        return await loadSTL(item, url);
    }

    throw new Error(
        "Неизвестный формат модели: " +
        extension
    );
}


/* =============================================================
   VIEWER INIT
============================================================= */

function initViewer() {

    if (renderer) {
        return;
    }

    scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(0x000000);

    camera =
        new THREE.PerspectiveCamera(
            45,
            window.innerWidth /
                window.innerHeight,
            0.01,
            1000
        );

    camera.position.set(0, 0.3, 3);

    renderer =
        new THREE.WebGLRenderer({
            antialias: true,
            alpha: false,
            powerPreference: "high-performance"
        });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;

    viewerCanvas.appendChild(
        renderer.domElement
    );

    controls =
        new OrbitControls(
            camera,
            renderer.domElement
        );

    controls.enableDamping = true;
    controls.enablePan = true;
    controls.minDistance = 0.05;
    controls.maxDistance = 100;
    controls.screenSpacePanning = true;

    const ambient =
        new THREE.AmbientLight(
            0xffffff,
            2
        );

    scene.add(ambient);

    const light =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );

    light.position.set(4, 5, 4);
    scene.add(light);

    const fill =
        new THREE.DirectionalLight(
            0xffffff,
            1.5
        );

    fill.position.set(-4, 2, -4);
    scene.add(fill);

    window.addEventListener(
        "resize",
        resizeViewer
    );

    animateViewer();
}


function resizeViewer() {

    if (!camera || !renderer) {
        return;
    }

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}


function animateViewer() {

    requestAnimationFrame(
        animateViewer
    );

    if (controls) {
        controls.update();
    }

    if (renderer && scene && camera) {
        renderer.render(
            scene,
            camera
        );
    }
}


/* =============================================================
   OPEN GALLERY MODEL
============================================================= */

async function openViewer(index) {

    viewerOpenedFromArchive = false;

    if (!requireAccess()) {
        return;
    }

    const item =
        galleryItems[index];

    if (!item) {
        return;

    viewerNumber.textContent =
        item.number;

    showScreen(viewerScreen);
    initViewer();
    clearCurrentModel();

    try {

        const url =
            MODEL_BASE +
            encodeURIComponent(
                item.filename
            );

        gltfLoader.load(
            url,
            gltf => {
                try {
                    prepareModel(gltf.scene);
                } catch (error) {
                    console.error(
                        "GALLERY PREPARE ERROR:",
                        error
                    );
                }
            },
            undefined,
            error => {
                console.error(
                    "GALLERY MODEL ERROR:",
                    error
                );
            }
        );

    } catch (error) {
        console.error(
            "GALLERY ERROR:",
            error
        );
    }
}
