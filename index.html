function roomNumberValue(item, index) {
    if (item && item.number !== undefined && item.number !== null) {
        return item.number;
    }

    if (item && item.name) {
        const match = String(item.name).match(/\d+/);
        if (match) return match[0];
    }

    if (item && item.folder) {
        const match = String(item.folder).match(/\d+/);
        if (match) return match[0];
    }

    return index + 1;
}

function roomName(item, index) {
    return String(
        item?.name ||
        item?.folder ||
        item?.title ||
        `room_${roomNumberValue(item, index)}`
    );
}

function roomFileUrl(folder, filename) {
    if (!filename) return "";

    if (
        String(filename).startsWith("http://") ||
        String(filename).startsWith("https://") ||
        String(filename).startsWith("data:")
    ) {
        return String(filename);
    }

    if (String(filename).startsWith("/api/rooms/")) {
        return new URL(String(filename), window.location.origin).href;
    }

    const cleanFolder = String(folder || "")
        .replace(/^\/+|\/+$/g, "");

    const cleanFile = String(filename)
        .replace(/^\/+/, "");

    return `${ROOMS_API}/file/${encodeURIComponent(cleanFolder)}/` +
        `${encodeURIComponent(PC_TEXTURE_FOLDER)}/` +
        `${cleanFile
            .split("/")
            .map(part => encodeURIComponent(part))
            .join("/")}`;
}

function getRoomFiles(item) {
    if (!item) return [];

    if (Array.isArray(item.files)) {
        return item.files.map(file => {
            if (typeof file === "string") {
                return {
                    name: file,
                    url: roomFileUrl(item.folder || item.name, file)
                };
            }

            return {
                name: file.name || file.filename || "",
                url: file.url || file.file_url || file.download_url ||
                    roomFileUrl(item.folder || item.name, file.name || file.filename)
            };
        });
    }

    if (item.textures && typeof item.textures === "object") {
        return Object.entries(item.textures).map(([key, value]) => ({
            name: key,
            url: typeof value === "string"
                ? value
                : value?.url || value?.file_url || ""
        }));
    }

    return [];
}
function normalizeRoomFileValue(folder, value) {
    if (!value) return "";

    if (typeof value === "object") {
        value =
            value.url ||
            value.file_url ||
            value.download_url ||
            value.filename ||
            value.name ||
            "";
    }

    if (!value) return "";

    const valueString = String(value);

    if (
        valueString.startsWith("http://") ||
        valueString.startsWith("https://") ||
        valueString.startsWith("data:")
    ) {
        return valueString;
    }

    if (valueString.startsWith("/api/rooms/")) {
        return new URL(
            valueString,
            window.location.origin
        ).href;
    }

    return roomFileUrl(folder, valueString);
}

function getRoomManifestFiles(item) {
    if (!item) return [];

    const folder =
        item.folder ||
        item.name ||
        "";

    const result = [];

    if (Array.isArray(item.files)) {
        item.files.forEach(file => {
            if (typeof file === "string") {
                result.push({
                    name: file,
                    url: normalizeRoomFileValue(folder, file)
                });
                return;
            }

            if (file && typeof file === "object") {
                const name =
                    file.name ||
                    file.filename ||
                    "";

                result.push({
                    name,
                    url: normalizeRoomFileValue(
                        folder,
                        file.url ||
                        file.file_url ||
                        file.download_url ||
                        name
                    )
                });
            }
        });
    }

    if (item.textures && typeof item.textures === "object") {
        Object.entries(item.textures).forEach(([key, value]) => {
            result.push({
                name: key,
                url: normalizeRoomFileValue(folder, value)
            });
        });
    }

    return result.filter(file => file.url);
}

function findRoomFileByNames(files, names) {
    const normalized = names.map(name =>
        String(name)
            .toLowerCase()
            .replace(/\.[^.]+$/, "")
            .replace(/[^a-z0-9а-яё]/gi, "")
    );

    for (const file of files) {
        const fileName = String(file.name || "")
            .toLowerCase()
            .replace(/\.[^.]+$/, "")
            .replace(/[^a-z0-9а-яё]/gi, "");

        for (const wanted of normalized) {
            if (fileName === wanted) {
                return file.url;
            }
        }
    }

    return "";
}

function resolveRoomTextures(item) {
    const folder = String(item?.folder || item?.name || "").trim();

    if (!folder) {
        return {
            back: "",
            left: "",
            right: "",
            front: "",
            ceiling: "",
            floor: ""
        };
    }

    /*
        ВАЖНО:
        Имена файлов на PC фиксированы и соответствуют вашей папке:

        Desktop/3d/3d/fon_room/<room>/03_ROOM_TEXTURE_GENERATION/
            01_BACKGROUND.png -> BACK
            02_LEFT.png       -> LEFT
            03_RIGHT.png      -> RIGHT
            04_FRONT.png      -> FRONT
            05_SKY.png        -> CEILING
            06_GROUND.png     -> FLOOR

        Не пытаемся угадывать названия файлов.
        Всегда строим URL напрямую через PC Flask API.
    */
    const files = {
        back: "01_BACKGROUND.png",
        left: "02_LEFT.png",
        right: "03_RIGHT.png",
        front: "04_FRONT.png",
        ceiling: "05_SKY.png",
        floor: "06_GROUND.png"
    };

    const result = {};

    Object.entries(files).forEach(([surface, filename]) => {
        result[surface] = roomFileUrl(folder, filename);
    });

    /*
        Если Flask вернул конкретные URL, используем их.
        Но только если URL действительно задан сервером.
    */
    const direct = item?.textures;

    if (direct && typeof direct === "object") {
        const serverFields = {
            back: direct.background || direct.back || direct.rear,
            left: direct.left,
            right: direct.right,
            front: direct.front || direct.forward,
            ceiling: direct.sky || direct.ceiling || direct.top,
            floor: direct.ground || direct.floor || direct.bottom
        };

        Object.entries(serverFields).forEach(([surface, value]) => {
            if (typeof value === "string" && value.trim()) {
                result[surface] = normalizeRoomFileValue(folder, value);
            } else if (value && typeof value === "object") {
                const url =
                    value.url ||
                    value.file_url ||
                    value.download_url ||
                    "";

                if (url) {
                    result[surface] = normalizeRoomFileValue(folder, url);
                }
            }
        });
    }

    return result;
}

async function fetchRoomManifest(item) {
    const folder = String(item?.folder || item?.name || "").trim();

    if (!folder) {
        throw new Error("У комнаты отсутствует folder/name");
    }

    /*
        Сразу показываем состояние запроса, чтобы интерфейс
        никогда не оставался на старом тексте "Загрузка комнат...".
    */
    setRoomStatus(
        `Запрос ROOM "${folder}" на PC-сервер...`,
        true
    );

    const url = `${ROOMS_API}/${encodeURIComponent(folder)}`;

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 10000);

    try {
        const response = await fetch(url, {
            method: "GET",
            cache: "no-store",
            headers: {
                "Accept": "application/json"
            },
            signal: controller.signal
        });

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        const manifest = data?.room || data;

        if (!manifest || typeof manifest !== "object") {
            throw new Error("Сервер вернул пустой manifest комнаты");
        }

        return {
            ...item,
            ...manifest,
            folder: manifest.folder || item.folder || folder,
            name: manifest.name || item.name || folder
        };

    } catch (error) {
        if (error?.name === "AbortError") {
            throw new Error(
                `Тайм-аут запроса manifest комнаты: ${folder}`
            );
        }

        throw new Error(
            `Не удалось получить ROOM ${folder}: ${error?.message || error}`
        );

    } finally {
        clearTimeout(timeout);
    }
}

async function requestRoomFromPC(item) {
    const folder = String(item?.folder || item?.name || "").trim();

    if (!folder) {
        throw new Error("Не указана папка комнаты");
    }

    const wallet =
        typeof currentWallet !== "undefined" && currentWallet
            ? String(currentWallet)
            : "";

    /*
        =========================================================
        ЯВНО ПЕРЕДАЁМ PC/API-СЕРВЕРУ СПИСОК НУЖНЫХ ФАЙЛОВ ROOM.

        Сервер получает:
            room
            wallet
            files

        files содержит реальные имена файлов из:
        <room>/03_ROOM_TEXTURE_GENERATION/

        model_folder указывает:
        <room>/02_3D_OBJECT_GENERATION/

        Это не отправка PNG из браузера на сервер.
        Это запрос PC-серверу: отдай файлы из этих папок.
        =========================================================
    */
    const textureFiles = [
        "01_BACKGROUND.png",
        "02_LEFT.png",
        "03_RIGHT.png",
        "04_FRONT.png",
        "05_SKY.png",
        "06_GROUND.png"
    ];

    const url = `${ROOMS_API}/request`;

    console.log(
        "[ROOM REQUEST] POST:",
        url
    );

    console.log(
        "[ROOM REQUEST] folder:",
        folder
    );

    console.log(
        "[ROOM REQUEST] wallet:",
        wallet || "(wallet не указан)"
    );

    console.log(
        "[ROOM REQUEST] texture files:",
        textureFiles
    );

    const controller = new AbortController();

    const timeout = setTimeout(
        () => controller.abort(),
        20000
    );

    try {

        const response = await fetch(url, {
            method: "POST",
            cache: "no-store",
            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
            },

            /*
                Сохраняем прежние поля room/wallet
                и дополнительно передаём список текстур.
            */
            body: JSON.stringify({
                room: folder,
                wallet: wallet,
                files: textureFiles,
                texture_files: textureFiles,

                /*
                   Источники на PC-сервере:
                   02_3D_OBJECT_GENERATION -> model.glb
                   03_ROOM_TEXTURE_GENERATION -> 6 PNG
                */
                model_folder: PC_MODEL_FOLDER,
                texture_folder: PC_TEXTURE_FOLDER
            }),

            signal: controller.signal
        });

        console.log(
            "[ROOM REQUEST] HTTP:",
            response.status
        );

        if (!response.ok) {
            throw new Error(
                `ROOM REQUEST HTTP ${response.status}`
            );
        }

        const data = await response.json();

        console.log(
            "[ROOM REQUEST] RESPONSE:",
            data
        );

        if (data?.success === false) {
            throw new Error(
                data.error ||
                "PC-сервер отклонил ROOM-запрос"
            );
        }

        const manifest =
            data?.room ||
            data?.manifest ||
            data;

        if (
            !manifest ||
            typeof manifest !== "object"
        ) {
            throw new Error(
                "PC-сервер не вернул manifest комнаты"
            );
        }

        /*
            =====================================================
            ВАЖНО:
            Иногда POST /request отвечает только ID запроса,
            а список файлов появляется через обычный GET ROOM.

            Поэтому после POST дополнительно проверяем manifest.
            =====================================================
        */

        let result = {
            ...item,
            ...manifest,
            folder:
                manifest.folder ||
                item.folder ||
                folder,
            name:
                manifest.name ||
                item.name ||
                folder
        };

        const hasFiles =
            Array.isArray(result.files) &&
            result.files.length > 0;

        const hasTextures =
            result.textures &&
            typeof result.textures === "object" &&
            Object.keys(result.textures).length > 0;

        const hasDirectModel =
            result.model &&
            typeof result.model === "object" &&
            result.model.url;

        if (
            !hasFiles &&
            !hasTextures &&
            !hasDirectModel
        ) {

            console.log(
                "[ROOM REQUEST] POST не содержит файлов. " +
                "Запрашиваем полный manifest через GET."
            );

            try {

                const manifestData =
                    await fetchRoomManifest(result);

                result = {
                    ...result,
                    ...manifestData,
                    folder:
                        manifestData.folder ||
                        result.folder ||
                        folder,
                    name:
                        manifestData.name ||
                        result.name ||
                        folder
                };

                console.log(
                    "[ROOM REQUEST] GET manifest:",
                    result
                );

            } catch (manifestError) {

                console.warn(
                    "[ROOM REQUEST] GET manifest не получен:",
                    manifestError
                );

                /*
                    Не отменяем ROOM полностью.
                    Даже если GET manifest не сработал,
                    resolveRoomTextures() ниже построит прямые
                    /api/rooms/file/... URL.
                */
            }
        }

        /*
            =====================================================
            ПОКАЗЫВАЕМ ТОЧНЫЕ URL ШЕСТИ ТЕКСТУР.
            Это сразу видно в DevTools Console.
            =====================================================
        */

        const resolvedTextures =
            resolveRoomTextures(result);

        console.log(
            "[ROOM TEXTURES] resolved:",
            resolvedTextures
        );

        Object.entries(resolvedTextures)
            .forEach(([key, textureUrl]) => {

                console.log(
                    `[ROOM TEXTURE REQUEST] ${key}:`,
                    textureUrl
                );

            });

        /*
            Сохраняем рассчитанные URL обратно
            в manifest, чтобы buildRoom использовал
            именно эти адреса.
        */

        result.room_texture_urls =
            resolvedTextures;

        return result;

    } catch (error) {

        if (error?.name === "AbortError") {
            throw new Error(
                "Тайм-аут ROOM-запроса к PC-серверу (20 секунд)"
            );
        }

        console.error(
            "[ROOM REQUEST ERROR]",
            error
        );

        throw error;

    } finally {
        clearTimeout(timeout);
    }
}

function loadRoomTexture(url, label = "texture") {
    return new Promise(resolve => {
        if (!url) {
            resolve({
                texture: null,
                label,
                url: "",
                error: "URL/данные текстуры не заданы"
            });
            return;
        }

        let finished = false;
        const finish = result => {
            if (finished) return;
            finished = true;
            resolve(result);
        };

        /*
           Новая схема ROOM: Python-сервер передаёт PNG/JPG прямо
           внутри manifest как data:image/...;base64,... .
           Поэтому для таких URL НЕ делаем отдельный fetch к
           /api/rooms/file/... . Это устраняет зависание Cloudflare
           на бинарном endpoint.
        */
        const isEmbedded =
            typeof url === "string" &&
            url.startsWith("data:image/");

        if (isEmbedded) {
            setRoomStatus(`Декодирование ${label}.png...`, true);

            const timeout = setTimeout(() => {
                finish({
                    texture: null,
                    label,
                    url: "embedded-data",
                    error: "Тайм-аут декодирования встроенной текстуры 12 секунд"
                });
            }, 60000);

            roomTextureLoader.load(
                url,
                texture => {
                    clearTimeout(timeout);

                    texture.colorSpace = THREE.SRGBColorSpace;
                    texture.wrapS = THREE.ClampToEdgeWrapping;
                    texture.wrapT = THREE.ClampToEdgeWrapping;
                    texture.anisotropy = roomRenderer
                        ? Math.min(
                            roomRenderer.capabilities.getMaxAnisotropy(),
                            4
                        )
                        : 1;
                    texture.needsUpdate = true;

                    finish({
                        texture,
                        label,
                        url: "embedded-data",
                        error: null
                    });
                },
                undefined,
                error => {
                    clearTimeout(timeout);
                    finish({
                        texture: null,
                        label,
                        url: "embedded-data",
                        error: "Three.js не смог декодировать встроенную текстуру"
                    });
                }
            );
            return;
        }

        /* Основной режим: бинарная загрузка PNG через Flask API. */
        let finishedHttp = false;
        const controller = new AbortController();
        const timeout = setTimeout(() => {
            controller.abort();
            if (!finishedHttp) {
                finishedHttp = true;
                finish({
                    texture: null,
                    label,
                    url,
                    error: "Тайм-аут HTTP-загрузки изображения 60 секунд"
                });
            }
        }, 60000);

        setRoomStatus(`Получение ${label}.png с PC...`, true);

        fetch(url, {
            method: "GET",
            cache: "no-store",
            headers: {
                "Accept": "image/png,image/jpeg,image/webp,image/*,*/*;q=0.8"
            },
            signal: controller.signal
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                return response.blob();
            })
            .then(blob => {
                if (finishedHttp) return;
                const objectUrl = URL.createObjectURL(blob);

                roomTextureLoader.load(
                    objectUrl,
                    texture => {
                        clearTimeout(timeout);
                        finishedHttp = true;
                        URL.revokeObjectURL(objectUrl);

                        texture.colorSpace = THREE.SRGBColorSpace;
                        texture.wrapS = THREE.ClampToEdgeWrapping;
                        texture.wrapT = THREE.ClampToEdgeWrapping;
                        texture.anisotropy = roomRenderer
                            ? Math.min(
                                roomRenderer.capabilities.getMaxAnisotropy(),
                                4
                            )
                            : 1;
                        texture.needsUpdate = true;

                        finish({
                            texture,
                            label,
                            url,
                            error: null
                        });
                    },
                    undefined,
                    error => {
                        clearTimeout(timeout);
                        finishedHttp = true;
                        URL.revokeObjectURL(objectUrl);

                        finish({
                            texture: null,
                            label,
                            url,
                            error: "Three.js не смог декодировать изображение"
                        });
                    }
                );
            })
            .catch(error => {
                clearTimeout(timeout);
                finishedHttp = true;

                finish({
                    texture: null,
                    label,
                    url,
                    error: error?.message ||
                        "Ошибка получения изображения через API"
                });
            });
    });
}

function createRoomSurface(
    width,
    height,
    position,
    rotation,
    texture,
    label
) {
    const geometry = new THREE.PlaneGeometry(width, height);

    const material = new THREE.MeshBasicMaterial({
        map: texture || null,
        color: texture ? 0xffffff : 0x222222,
        side: THREE.DoubleSide,
        transparent: false,
        depthWrite: true,
        depthTest: true
    });

    const mesh = new THREE.Mesh(geometry, material);

    mesh.position.copy(position);
    mesh.rotation.set(rotation.x, rotation.y, rotation.z);

    mesh.userData.roomSurface = true;
    mesh.userData.roomSurfaceName = label;

    return mesh;
}

function clearRoomScene() {
    if (!roomScene) return;

    const removable = [];

    roomScene.traverse(object => {
        if (object.userData && object.userData.roomSurface) {
            removable.push(object);
        }
    });

    removable.forEach(object => {
        roomScene.remove(object);

        if (object.geometry) {
            object.geometry.dispose();
        }

        if (object.material) {
            const material = object.material;

            if (material.map) {
                material.map.dispose();
            }

            material.dispose();
        }
    });

    /* Удаляем только созданный ROOM-свет. */
    const lights = [];

    roomScene.traverse(object => {
        if (object.userData && object.userData.roomLight) {
            lights.push(object);
        }
    });

    lights.forEach(light => roomScene.remove(light));
}

let roomModel = null;
let roomModelLoadToken = 0;
let roomRequestId = null;

function disposeRoomModel() {
    if (!roomModel) return;

    if (roomScene) {
        roomScene.remove(roomModel);
    }

    roomModel.traverse(object => {
        if (object.geometry) {
            object.geometry.dispose();
        }

        if (object.material) {
            const materials = Array.isArray(object.material)
                ? object.material
                : [object.material];

            materials.forEach(material => {
                if (!material) return;

                const textureKeys = [
                    "map", "normalMap", "roughnessMap", "metalnessMap",
                    "emissiveMap", "aoMap", "alphaMap", "bumpMap",
                    "displacementMap", "clearcoatMap", "clearcoatNormalMap",
                    "clearcoatRoughnessMap", "iridescenceThicknessMap",
                    "sheenColorMap", "sheenRoughnessMap", "specularColorMap",
                    "specularIntensityMap", "transmissionMap", "thicknessMap"
                ];

                textureKeys.forEach(key => {
                    if (material[key] && material[key].isTexture) {
                        material[key].dispose();
                    }
                });

                material.dispose();
            });
        }
    });

    roomModel = null;
}

function prepareRoomModel(loadedModel) {
    const box = new THREE.Box3().setFromObject(loadedModel);
    const size = box.getSize(new THREE.Vector3());

    if (!Number.isFinite(size.x) || !Number.isFinite(size.y) ||
        !Number.isFinite(size.z) || Math.max(size.x, size.y, size.z) <= 0) {
        throw new Error("3D модель не содержит корректной геометрии");
    }

    /* Сначала нормализуем модель, затем ставим её по центру комнаты. */
    const maxSize = Math.max(size.x, size.y, size.z);
    const targetSize = 3.2;
    loadedModel.scale.setScalar(targetSize / maxSize);
    loadedModel.updateMatrixWorld(true);

    const normalizedBox = new THREE.Box3().setFromObject(loadedModel);
    const center = normalizedBox.getCenter(new THREE.Vector3());
    const min = normalizedBox.min;

    /* X/Z = центр комнаты, Y = пол комнаты. */
    loadedModel.position.x -= center.x;
    loadedModel.position.z -= center.z;
    loadedModel.position.y -= min.y;
    loadedModel.updateMatrixWorld(true);

    loadedModel.traverse(object => {
        if (!object.isMesh) return;
        object.castShadow = false;
        object.receiveShadow = false;
        if (object.material) {
            const materials = Array.isArray(object.material)
                ? object.material
                : [object.material];

            materials.forEach(material => {
                if (!material) return;

                /* GLB должен получать свет сцены. */
                if ("envMapIntensity" in material) {
                    material.envMapIntensity = 0.7;
                }

                /*
                   Если конкретный GLB использует MeshBasicMaterial,
                   он игнорирует источники света. Переводим только такие
                   материалы в MeshStandardMaterial, сохраняя основную
                   текстуру и базовые параметры.
                */
                if (material.isMeshBasicMaterial) {
                    const standard = new THREE.MeshStandardMaterial({
                        map: material.map || null,
                        color: material.color ? material.color.clone() : new THREE.Color(0xffffff),
                        transparent: material.transparent,
                        opacity: material.opacity,
                        side: material.side,
                        alphaTest: material.alphaTest,
                        depthWrite: material.depthWrite,
                        depthTest: material.depthTest,
                        roughness: 0.85,
                        metalness: 0.0
                    });

                    if (material.map) {
                        standard.map = material.map;
                    }

                    object.material = Array.isArray(object.material)
                        ? object.material.map(item => item === material ? standard : item)
                        : standard;

                    material.dispose();
                    standard.needsUpdate = true;
                } else {
                    material.needsUpdate = true;
                }
            });
        }
    });

    return loadedModel;
}

async function loadRoomModel(modelInfo) {
    /*
       ================================================================
       ЕДИНАЯ ЗАГРУЗКА 3D-МОДЕЛИ ROOM + ЕЁ ТЕКСТУР
       ================================================================

       Серверная структура:

           ROOM/<room>/3d_model/model.glb
           ROOM/<room>/3d_model/<texture files>

       Основной URL модели приходит от PC-сервера в modelInfo.url.

       Если GLB содержит встроенные текстуры — GLTFLoader получает их
       непосредственно из GLB.

       Если GLB содержит внешние PNG/JPG/WebP — LoadingManager
       перенаправляет каждый ресурс на:

           /api/rooms/model-resource/<room>/<filename>

       Это важно: endpoint model-file используется только для GLB,
       а endpoint model-resource — для файлов, на которые ссылается GLB.

       Таким образом модель и её текстуры загружаются как единый ROOM
       package, независимо от того, встроены текстуры в GLB или лежат
       рядом с model.glb.
       ================================================================
    */

    const token = ++roomModelLoadToken;

    const modelData =
        modelInfo?.model &&
        typeof modelInfo.model === "object"
            ? modelInfo.model
            : modelInfo || {};

    const modelId = Number(
        modelInfo?.model_id ||
        modelData?.model_id ||
        0
    );

    const roomName = String(
        modelInfo?.room ||
        modelData?.room ||
        currentRoom?.folder ||
        currentRoom?.name ||
        ""
    ).trim();

    const encodedRoom = encodeURIComponent(roomName);

    /*
       ---------------------------------------------------------------
       1. Определяем URL GLB
       ---------------------------------------------------------------
    */

    let url = String(
        modelInfo?.url ||
        modelData?.url ||
        ""
    ).trim();

    const filename = String(
        modelInfo?.filename ||
        modelData?.filename ||
        "model.glb"
    ).trim();

    /*
       Если сервер прислал только имя файла, строим правильный
       endpoint model-file самостоятельно.
    */
    if (!url && roomName && filename) {
        /*
           model-file на PC-сервере берёт модель из:
           <room>/02_3D_OBJECT_GENERATION/<filename>
        */
        url =
            `${PUBLIC_API_BASE}/api/rooms/model-file/` +
            `${encodedRoom}/` +
            filename
                .split("/")
                .filter(Boolean)
                .map(part => encodeURIComponent(part))
                .join("/");
    }

    /*
       Резерв для старой схемы общего архива моделей.
    */
    if (!url && modelId > 0) {
        url =
            `${PUBLIC_API_BASE}/api/models/file/${modelId}`;
    }

    if (!url) {
        throw new Error(
            "Сервер не вернул URL 3D модели"
        );
    }

    setRoomStatus(
        `Получена 3D модель ${filename}.\n` +
        `Загрузка модели и текстур...`,
        true
    );

    /*
       ---------------------------------------------------------------
       2. LoadingManager
       ---------------------------------------------------------------

       URLModifier работает ДО фактического HTTP-запроса ресурса.
       Поэтому мы можем исправить неправильные пути текстур,
       записанные внутри GLB.
    */
    const manager = new THREE.LoadingManager();

    manager.onStart = (itemUrl, itemsLoaded, itemsTotal) => {
        console.log(
            "[ROOM GLB] загрузка:",
            itemUrl,
            `${itemsLoaded}/${itemsTotal}`
        );
    };

    manager.onProgress = (itemUrl, itemsLoaded, itemsTotal) => {
        console.log(
            "[ROOM RESOURCE]",
            itemUrl,
            `${itemsLoaded}/${itemsTotal}`
        );
    };

    manager.onError = itemUrl => {
        console.error(
            "[ROOM RESOURCE ERROR]",
            itemUrl
        );
    };

    manager.setURLModifier(originalUrl => {
        if (!originalUrl) {
            return originalUrl;
        }

        /*
           Встроенные data/blob ресурсы не трогаем.
        */
        if (
            originalUrl.startsWith("data:") ||
            originalUrl.startsWith("blob:")
        ) {
            return originalUrl;
        }

        const clean = String(originalUrl)
            .split("?")[0];

        let decoded = clean;

        try {
            decoded = decodeURIComponent(clean);
        } catch {
            // Оставляем исходную строку.
        }

        /*
           ------------------------------------------------------------
           Если сервер уже дал правильный model-resource URL,
           ничего не меняем.
           ------------------------------------------------------------
        */
        if (
            decoded.includes(
                "/api/rooms/model-resource/"
            )
        ) {
            return originalUrl;
        }

        /*
           ------------------------------------------------------------
           ROOM-модель
           ------------------------------------------------------------
        */
        if (roomName) {
            let resourcePath = "";

            const decodedModelMarker =
                `/api/rooms/model-file/${roomName}/`;

            const encodedModelMarker =
                `/api/rooms/model-file/${encodedRoom}/`;

            const decodedIndex =
                decoded.indexOf(decodedModelMarker);

            const encodedIndex =
                clean.indexOf(encodedModelMarker);

            /*
               GLTFLoader может получить абсолютный URL модели
               и построить от него URL текстуры.
            */
            if (decodedIndex >= 0) {
                resourcePath =
                    decoded.slice(
                        decodedIndex +
                        decodedModelMarker.length
                    );
            } else if (encodedIndex >= 0) {
                try {
                    resourcePath =
                        decodeURIComponent(
                            clean.slice(
                                encodedIndex +
                                encodedModelMarker.length
                            )
                        );
                } catch {
                    resourcePath =
                        clean.slice(
                            encodedIndex +
                            encodedModelMarker.length
                        );
                }
            }

            /*
               Если это относительный URI внутри GLB,
               например:

                   texture.png
                   textures/albedo.png

               берём его как путь ресурса.
            */
            if (!resourcePath) {
                resourcePath =
                    decoded
                        .replace(/^.*\//, "");
            }

            resourcePath =
                resourcePath
                    .split("?")[0]
                    .replace(/^\/+/, "");

            /*
               model.glb не должен запрашиваться как текстура.
            */
            if (
                !resourcePath ||
                resourcePath
                    .toLowerCase()
                    .endsWith("/model.glb")
            ) {
                return originalUrl;
            }

            const byPath =
                modelData?.texture_urls_by_path || {};

            const byName =
                modelData?.texture_urls_by_name || {};

            const normalizedPath =
                resourcePath.toLowerCase();

            const resourceName =
                resourcePath
                    .split("/")
                    .pop()
                    .toLowerCase();

            /*
               Приоритет №1:
               точный URL, который прислал сервер.
            */
            if (byPath[normalizedPath]) {
                return new URL(
                    byPath[normalizedPath],
                    PUBLIC_API_BASE
                ).href;
            }

            /*
               Приоритет №2:
               URL по имени файла.
            */
            if (byName[resourceName]) {
                return new URL(
                    byName[resourceName],
                    PUBLIC_API_BASE
                ).href;
            }

            /*
               Приоритет №3:
               основной endpoint model-resource.
            */
            const resourceBase =
                modelData?.resource_base_url ||
                modelInfo?.resource_base_url ||
                `${PUBLIC_API_BASE}/api/rooms/model-resource/${encodedRoom}/`;

            const absoluteBase =
                new URL(
                    resourceBase,
                    PUBLIC_API_BASE
                ).href;

            /*
               Кодируем каждый сегмент отдельно.
               Слеши между папками сохраняются.
            */
            const encodedResourcePath =
                resourcePath
                    .split("/")
                    .filter(Boolean)
                    .map(part =>
                        encodeURIComponent(part)
                    )
                    .join("/");

            const finalUrl =
                absoluteBase.endsWith("/")
                    ? absoluteBase + encodedResourcePath
                    : absoluteBase + "/" + encodedResourcePath;

            console.log(
                "[ROOM TEXTURE RESOLVE]",
                originalUrl,
                "=>",
                finalUrl
            );

            return finalUrl;
        }

        /*
           ------------------------------------------------------------
           Старая схема archive model
           ------------------------------------------------------------
        */
        if (modelId > 0) {
            if (
                decoded.includes(
                    `/api/models/resource/${modelId}/`
                )
            ) {
                return originalUrl;
            }

            const resourceName =
                decoded
                    .split("/")
                    .pop();

            if (!resourceName) {
                return originalUrl;
            }

            return (
                `${PUBLIC_API_BASE}/api/models/resource/` +
                `${modelId}/` +
                encodeURIComponent(resourceName)
            );
        }

        return originalUrl;
    });

    /*
       ---------------------------------------------------------------
       3. Создаём отдельный GLTFLoader именно для этой ROOM
       ---------------------------------------------------------------
    */
    const roomLoader =
        new GLTFLoader(manager);

    /*
       Если сервер передал resource_base_url,
       задаём его GLTFLoader как базовый путь.
       URLModifier всё равно имеет приоритет для проблемных URI.
    */
    const resourceBase =
        modelData?.resource_base_url ||
        modelInfo?.resource_base_url ||
        (
            roomName
                ? `${PUBLIC_API_BASE}/api/rooms/model-resource/${encodedRoom}/`
                : ""
        );

    if (resourceBase) {
        roomLoader.setResourcePath(
            new URL(
                resourceBase,
                PUBLIC_API_BASE
            ).href
        );
    }

    /*
       Не используем URL напрямую с cache-busting в середине пути.
       Параметр добавляем только к окончательному URL GLB.
    */
    const modelUrl =
        url +
        (
            url.includes("?")
                ? "&"
                : "?"
        ) +
        "v=" +
        Date.now();

    console.log(
        "[ROOM MODEL REQUEST]",
        modelUrl
    );

    /*
       ---------------------------------------------------------------
       4. Загружаем GLB
       ---------------------------------------------------------------
    */
    const gltf =
        await new Promise((resolve, reject) => {

            roomLoader.load(
                modelUrl,

                loaded => {
                    console.log(
                        "[ROOM MODEL LOADED]",
                        loaded
                    );

                    resolve(loaded);
                },

                xhr => {
                    if (
                        xhr &&
                        xhr.total > 0
                    ) {
                        const percent =
                            Math.round(
                                xhr.loaded /
                                xhr.total *
                                100
                            );

                        setRoomStatus(
                            `Загрузка 3D модели: ${percent}%`,
                            true
                        );
                    } else {
                        setRoomStatus(
                            "Загрузка 3D модели и текстур...",
                            true
                        );
                    }
                },

                error => {
                    console.error(
                        "[ROOM MODEL LOAD ERROR]",
                        error
                    );

                    reject(
                        new Error(
                            "Ошибка загрузки GLB: " +
                            (
                                error?.message ||
                                error?.statusText ||
                                error
                            )
                        )
                    );
                }
            );
        });

    /*
       Пользователь мог выйти из ROOM во время загрузки.
       Старый результат не должен попадать в новую комнату.
    */
    if (
        token !== roomModelLoadToken
    ) {
        return false;
    }

    /*
       ---------------------------------------------------------------
       5. Удаляем предыдущую модель
       ---------------------------------------------------------------
    */
    disposeRoomModel();

    /*
       ---------------------------------------------------------------
       6. Подготавливаем новую модель
       ---------------------------------------------------------------
    */
    roomModel =
        prepareRoomModel(
            gltf.scene
        );

    roomModel.userData.roomModel = true;

    /*
       Сохраняем информацию о загруженных ресурсах.
    */
    roomModel.userData.room = roomName;
    roomModel.userData.modelFilename = filename;
    roomModel.userData.modelUrl = url;

    /*
       ---------------------------------------------------------------
       7. Проверяем материалы и текстуры
       ---------------------------------------------------------------
    */
    let meshCount = 0;
    let texturedMeshCount = 0;
    let materialCount = 0;

    roomModel.traverse(object => {

        if (!object.isMesh) {
            return;
        }

        meshCount++;

        const materials =
            Array.isArray(object.material)
                ? object.material
                : [object.material];

        materials.forEach(material => {

            if (!material) {
                return;
            }

            materialCount++;

            if (
                material.map &&
                material.map.isTexture
            ) {
                texturedMeshCount++;

                material.map.colorSpace =
                    THREE.SRGBColorSpace;

                material.map.needsUpdate = true;
            }

            if (
                material.emissiveMap &&
                material.emissiveMap.isTexture
            ) {
                material.emissiveMap.colorSpace =
                    THREE.SRGBColorSpace;

                material.emissiveMap.needsUpdate =
                    true;
            }

            material.needsUpdate = true;
        });
    });

    console.log(
        "[ROOM MODEL MATERIALS]",
        {
            meshCount,
            materialCount,
            texturedMeshCount
        }
    );

    /*
       ---------------------------------------------------------------
       8. Добавляем модель в сцену
       ---------------------------------------------------------------
    */
    roomScene.add(roomModel);

    /*
       ---------------------------------------------------------------
       9. Финальный статус
       ---------------------------------------------------------------
    */
    setRoomStatus(
        `ROOM готов.\n` +
        `3D модель: ${filename}\n` +
        `Объектов: ${meshCount}\n` +
        `Материалов: ${materialCount}\n` +
        `Текстурированных объектов: ${texturedMeshCount}`,
        true
    );

    console.log(
        "[ROOM MODEL COMPLETE]",
        {
            room: roomName,
            filename,
            url,
            meshCount,
            materialCount,
            texturedMeshCount
        }
    );

    setTimeout(() => {
        if (
            roomViewerScreen.classList.contains(
                "active"
            )
        ) {
            setRoomStatus(
                "",
                false
            );
        }
    }, 3000);

    return true;
}

async function requestRoomModelFromPC(roomData, folder) {
    const requestId = Number(roomData?.id || 0);
    if (!requestId) {
        throw new Error("PC-сервер не вернул ID ROOM-запроса");
    }

    roomRequestId = requestId;
    const endpoint = `${ROOMS_API}/${encodeURIComponent(folder)}/model?request_id=${requestId}`;

    setRoomStatus(
        `ROOM ${folder}: отправлен запрос 3D модели на PC-сервер...`,
        true
    );

    const response = await fetch(endpoint, {
        method: "GET",
        mode: "cors",
        cache: "no-store",
        headers: { "Accept": "application/json" }
    });

    if (!response.ok) {
        throw new Error(`ROOM MODEL HTTP ${response.status}`);
    }

    const data = await response.json();
    if (data?.ready && data?.url) {
        return data;
    }

    return null;
}


async function waitForRoomModel(roomData, folder) {
    const requestId = Number(roomData?.id);
    if (!requestId) {
        setRoomStatus(
            `ROOM ${folder}: текстуры загружены 6/6.\nОжидается запрос модели.`,
            true
        );
        return;
    }

    roomRequestId = requestId;
    const endpoint = `${ROOMS_API}/${encodeURIComponent(folder)}/model?request_id=${requestId}`;
    const started = Date.now();
    const maxWait = 10 * 60 * 1000;

    setRoomStatus(
        `ROOM ${folder}: текстуры 6/6.\nОжидание 3D модели от PC-сервера...`,
        true
    );

    while (Date.now() - started < maxWait) {
        try {
            const response = await fetch(endpoint, {
                method: "GET",
                    cache: "no-store",
                headers: { "Accept": "application/json" }
            });

            if (response.ok) {
                const data = await response.json();
                if (data?.ready && data?.url) {
                    await loadRoomModel(data);
                    return;
                }
            }
        } catch (error) {
            console.warn("ROOM MODEL POLL ERROR:", error);
        }

        await new Promise(resolve => setTimeout(resolve, 2000));
    }

    setRoomStatus(
        `ROOM ${folder}: текстуры 6/6.\n3D модель пока не отправлена с PC-сервера.`,
        true
    );
}

async function buildRoom(item) {
    clearRoomScene();
    disposeRoomModel();

    const folder = String(item?.folder || item?.name || "").trim();
    if (!folder) {
        throw new Error("У ROOM отсутствует имя папки");
    }

    /* =========================================================
       1. ПОЛУЧАЕМ MANIFEST КОМНАТЫ С PC
       ========================================================= */
    setRoomStatus(`ROOM ${folder}`, true);

    let roomData;
    try {
        roomData = await requestRoomFromPC(item);
    } catch (postError) {
        // POST обязателен: именно он фиксирует ROOM-запрос в GUI.
        // GET не используем как тихий fallback, чтобы не потерять
        // единый протокол загрузки комнаты.
        throw postError;
    }

    const textures =
        roomData?.room_texture_urls &&
        typeof roomData.room_texture_urls === "object"
            ? roomData.room_texture_urls
            : resolveRoomTextures(roomData);

    console.log(
        "[ROOM BUILD] folder:",
        folder
    );

    console.log(
        "[ROOM BUILD] texture URLs:",
        textures
    );

    /* =========================================================
       2. СРАЗУ ПОЛУЧАЕМ 3D МОДЕЛЬ ИЗ ТОЙ ЖЕ ПАПКИ ROOM.
       Сервер уже добавляет найденный .glb в manifest.
       Используем его напрямую. Если старый сервер не прислал
       model, делаем отдельный запрос /model как резерв.
       ========================================================= */
    const roomModelPromise = (async () => {
        const directModel = roomData?.model;
        if (directModel?.url) {
            return {
                ...directModel,
                success: true,
                ready: true,
                room: folder,
                request_id: Number(roomData?.id || 0),
                model_id: 0,
                filename: directModel.filename || "room.glb",
                extension: ".glb",
                size: Number(directModel.size || 0),
                url: directModel.url,
                source: "same_room_folder"
            };
        }
        return await requestRoomModelFromPC(roomData, folder);
    })();

    /* =========================================================
       3. СНАЧАЛА СОЗДАЁМ ГЕОМЕТРИЮ КОМНАТЫ.
       Не ждём загрузки PNG. Поэтому комната появляется сразу.

       X = 7 м
       Z = 6 м
       Y = 4 м
       ========================================================= */
    const textureMap = {
        "01_BACKGROUND": null,
        "02_LEFT": null,
        "03_RIGHT": null,
        "04_FRONT": null,
        "05_SKY": null,
        "06_GROUND": null
    };

    const surfaces = [
        createRoomSurface(
            ROOM_LENGTH,
            ROOM_HEIGHT,
            new THREE.Vector3(0, ROOM_HEIGHT / 2, ROOM_WIDTH / 2),
            new THREE.Euler(0, Math.PI, 0),
            null,
            "01_BACKGROUND"
        ),
        createRoomSurface(
            ROOM_WIDTH,
            ROOM_HEIGHT,
            new THREE.Vector3(-ROOM_LENGTH / 2, ROOM_HEIGHT / 2, 0),
            new THREE.Euler(0, Math.PI / 2, 0),
            null,
            "02_LEFT"
        ),
        createRoomSurface(
            ROOM_WIDTH,
            ROOM_HEIGHT,
            new THREE.Vector3(ROOM_LENGTH / 2, ROOM_HEIGHT / 2, 0),
            new THREE.Euler(0, -Math.PI / 2, 0),
            null,
            "03_RIGHT"
        ),
        createRoomSurface(
            ROOM_LENGTH,
            ROOM_HEIGHT,
            new THREE.Vector3(0, ROOM_HEIGHT / 2, -ROOM_WIDTH / 2),
            new THREE.Euler(0, 0, 0),
            null,
            "04_FRONT"
        ),
        createRoomSurface(
            ROOM_LENGTH,
            ROOM_WIDTH,
            new THREE.Vector3(0, ROOM_HEIGHT, 0),
            new THREE.Euler(Math.PI / 2, 0, 0),
            null,
            "05_SKY"
        ),
        createRoomSurface(
            ROOM_LENGTH,
            ROOM_WIDTH,
            new THREE.Vector3(0, 0, 0),
            new THREE.Euler(-Math.PI / 2, 0, 0),
            null,
            "06_GROUND"
        )
    ];

    surfaces.forEach(surface => roomScene.add(surface));

    /* =========================================================
       ОСВЕЩЕНИЕ ВНУТРИ ROOM

       Поверхности ROOM остаются MeshBasicMaterial, поэтому их
       нарисованные текстуры не меняются от света.

       GLB-модель использует освещаемые материалы (MeshStandardMaterial
       / MeshPhysicalMaterial), поэтому ей нужен реальный свет сцены.
       Добавляем мягкий общий свет + верхний свет + два заполняющих
       источника внутри комнаты. Это делает текстуры GLB видимыми
       без жёстких чёрных участков.
       ========================================================= */

    const ambient = new THREE.AmbientLight(0xffffff, 1.35);
    ambient.userData.roomLight = true;
    roomScene.add(ambient);

    const hemisphere = new THREE.HemisphereLight(
        0xffffff,
        0x555555,
        1.15
    );
    hemisphere.position.set(0, ROOM_HEIGHT, 0);
    hemisphere.userData.roomLight = true;
    roomScene.add(hemisphere);

    const ceilingLight = new THREE.PointLight(
        0xffffff,
        18.0,
        14.0,
        2.0
    );
    ceilingLight.position.set(0, ROOM_HEIGHT - 0.25, 0);
    ceilingLight.userData.roomLight = true;
    roomScene.add(ceilingLight);

    const frontLight = new THREE.PointLight(
        0xffffff,
        7.0,
        10.0,
        2.0
    );
    frontLight.position.set(0, 2.5, ROOM_WIDTH * 0.30);
    frontLight.userData.roomLight = true;
    roomScene.add(frontLight);

    const fillLight = new THREE.PointLight(
        0xffffff,
        5.0,
        10.0,
        2.0
    );
    fillLight.position.set(-ROOM_LENGTH * 0.25, 2.0, -ROOM_WIDTH * 0.20);
    fillLight.userData.roomLight = true;
    roomScene.add(fillLight);

    /* Камера внутри комнаты. */
    roomCamera.position.set(0, ROOM_EYE_HEIGHT, 0);
    roomYaw = Math.PI;
    roomPitch = 0;
    roomRoll = 0;
    roomVerticalInput = 0;
    roomVerticalButtonInput = 0;

    clampRoomCamera();
    updateRoomCameraRotation();
    resizeRoomViewer();

    setRoomStatus(
        `ROOM ${folder} создан: 7 × 6 × 4 м.\n` +
        `Загрузка 6 текстур с PC-сервера...`,
        true
    );

    /* =========================================================
       3. ЗАГРУЖАЕМ PNG ПО ОДНОМУ И СРАЗУ НАКЛАДЫВАЕМ.
       Комната уже видна даже во время загрузки.
       ========================================================= */
    const textureEntries = [
        ["back", "01_BACKGROUND"],
        ["left", "02_LEFT"],
        ["right", "03_RIGHT"],
        ["front", "04_FRONT"],
        ["ceiling", "05_SKY"],
        ["floor", "06_GROUND"]
    ];

    const surfaceByLabel = {};
    surfaces.forEach(surface => {
        surfaceByLabel[surface.userData.roomSurfaceName] = surface;
    });

    const results = [];
    let loadedCount = 0;

    for (const [key, label] of textureEntries) {
        const url = textures[key];

        setRoomStatus(
            `ROOM ${folder}: ${loadedCount}/6\n` +
            `Получение ${label}.png с PC-сервера...`,
            true
        );

        const result = await loadRoomTexture(url, label);
        results.push(result);

        if (result.texture) {
            loadedCount++;
            textureMap[label] = result.texture;

            const surface = surfaceByLabel[label];
            if (surface && surface.material) {
                surface.material.map = result.texture;
                surface.material.color.set(0xffffff);
                surface.material.needsUpdate = true;
            }
        }

        setRoomStatus(
            `ROOM ${folder}`,
            true
        );
    }

    const errors = results.filter(result => !result.texture);

    // Получаем ответ на ранее отправленный запрос модели.
    try {
        const modelData = await roomModelPromise;

        if (modelData?.ready && modelData?.url) {
            await loadRoomModel(modelData);
        } else {
            await waitForRoomModel(roomData, folder);
        }
    } catch (modelError) {
        console.error("ROOM MODEL REQUEST ERROR:", modelError);
        setRoomStatus(
            `ROOM ${folder}: запрос 3D модели не выполнен.\n` +
            `${modelError?.message || modelError}`,
            true
        );
    }

    if (errors.length) {
        /*
            Ошибки всё равно не выводим текстом в ROOM.
            Индикатор завершает работу после попытки загрузки
            всех ресурсов.
        */
    }

    setRoomStatus("", false);
}

function isMobileDevice() {
    const userAgent = navigator.userAgent || navigator.vendor || window.opera || "";

    return /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini|mobile/i.test(
        userAgent
    ) || (
        navigator.maxTouchPoints > 1 &&
        /macintosh/i.test(userAgent)
    );
}

function initRoomViewer() {
    if (roomRenderer) return;

    roomScene = new THREE.Scene();
    roomScene.background = new THREE.Color(0x000000);

    roomCamera = new THREE.PerspectiveCamera(
        70,
        1,
        0.03,
        100
    );

    roomRenderer = new THREE.WebGLRenderer({
        antialias: !isMobileDevice(),
        alpha: false,
        powerPreference: "high-performance",
        precision: isMobileDevice() ? "mediump" : "highp"
    });

    const pixelRatio = isMobileDevice()
        ? Math.min(window.devicePixelRatio || 1, 1.35)
        : Math.min(window.devicePixelRatio || 1, 1.75);

    roomRenderer.setPixelRatio(pixelRatio);
    roomRenderer.setSize(
        roomCanvas.clientWidth || window.innerWidth,
        roomCanvas.clientHeight || window.innerHeight,
        false
    );
    roomRenderer.outputColorSpace = THREE.SRGBColorSpace;
    roomRenderer.toneMapping = THREE.ACESFilmicToneMapping;
    /* Небольшое повышение экспозиции помогает видеть детали GLB. */
    roomRenderer.toneMappingExposure = 1.15;

    roomCanvas.appendChild(roomRenderer.domElement);

    roomClock = new THREE.Clock();

    /*
        Мобильное управление без экранных джойстиков:

        1 палец:
            движение пальца = осмотр комнаты

        2 пальца:
            движение обоих пальцев = перемещение камеры
            по X/Z относительно направления взгляда.

        Это позволяет управлять ROOM непосредственно
        поверх изображения и не закрывать экран лишними кнопками.
    */
    roomRenderer.domElement.addEventListener("pointerdown", event => {
        if (event.pointerType === "mouse") {
            roomMouseDown = true;
            roomLastMouseX = event.clientX;
            roomLastMouseY = event.clientY;
            roomRenderer.domElement.setPointerCapture?.(event.pointerId);
            return;
        }

        roomTouchPointers.set(event.pointerId, {
            x: event.clientX,
            y: event.clientY
        });

        roomRenderer.domElement.setPointerCapture?.(event.pointerId);

        if (roomTouchPointers.size === 1) {
            roomLookPointerId = event.pointerId;
            roomLookLastX = event.clientX;
            roomLookLastY = event.clientY;
        } else if (roomTouchPointers.size === 2) {
            roomLookPointerId = null;
            roomTwoFingerState = createTwoFingerState();
        }
    });

    roomRenderer.domElement.addEventListener("pointermove", event => {
        if (event.pointerType === "mouse") {
            if (!roomMouseDown) return;

            const dx = event.clientX - roomLastMouseX;
            const dy = event.clientY - roomLastMouseY;

            roomLastMouseX = event.clientX;
            roomLastMouseY = event.clientY;

            roomYaw -= dx * ROOM_LOOK_SPEED;
            roomPitch -= dy * ROOM_LOOK_SPEED;

            roomPitch = THREE.MathUtils.clamp(
                roomPitch,
                -Math.PI / 2 + 0.05,
                Math.PI / 2 - 0.05
            );

            updateRoomCameraRotation();
            return;
        }

        if (!roomTouchPointers.has(event.pointerId)) return;

        roomTouchPointers.set(event.pointerId, {
            x: event.clientX,
            y: event.clientY
        });

        if (roomTouchPointers.size >= 2) {
            const state = getTwoFingerState();

            if (!state) return;

            if (!roomTwoFingerState) {
                roomTwoFingerState = state;
                return;
            }

            const dx = state.centerX - roomTwoFingerState.centerX;
            const dy = state.centerY - roomTwoFingerState.centerY;

            const moveScale = ROOM_SPEED * 0.012;

            const forwardX = Math.sin(roomYaw);
            const forwardZ = Math.cos(roomYaw);

            const rightX = Math.cos(roomYaw);
            const rightZ = -Math.sin(roomYaw);

            /*
                Свайп вверх  = вперёд
                Свайп вниз  = назад
                Свайп влево = влево
                Свайп вправо = вправо
            */
            roomCamera.position.x +=
                (rightX * dx + forwardX * -dy) * moveScale;

            roomCamera.position.z +=
                (rightZ * dx + forwardZ * -dy) * moveScale;

            clampRoomCamera();

            roomTwoFingerState = state;
            return;
        }

        if (
            roomTouchPointers.size === 1 &&
            event.pointerId === roomLookPointerId
        ) {
            const dx = event.clientX - roomLookLastX;
            const dy = event.clientY - roomLookLastY;

            roomLookLastX = event.clientX;
            roomLookLastY = event.clientY;

            roomYaw -= dx * ROOM_LOOK_SPEED;
            roomPitch -= dy * ROOM_LOOK_SPEED;

            roomPitch = THREE.MathUtils.clamp(
                roomPitch,
                -Math.PI / 2 + 0.05,
                Math.PI / 2 - 0.05
            );

            updateRoomCameraRotation();
        }
    });

    roomRenderer.domElement.addEventListener("pointerup", event => {
        if (event.pointerType === "mouse") {
            roomMouseDown = false;
            return;
        }

        roomTouchPointers.delete(event.pointerId);

        if (roomTouchPointers.size === 1) {
            const remaining = [...roomTouchPointers.entries()][0];

            roomLookPointerId = remaining[0];
            roomLookLastX = remaining[1].x;
            roomLookLastY = remaining[1].y;
            roomTwoFingerState = null;
        } else {
            roomLookPointerId = null;
            roomTwoFingerState = null;
        }
    });

    roomRenderer.domElement.addEventListener("pointercancel", event => {
        roomTouchPointers.delete(event.pointerId);

        if (roomTouchPointers.size < 2) {
            roomTwoFingerState = null;
        }

        if (roomTouchPointers.size === 1) {
            const remaining = [...roomTouchPointers.entries()][0];
            roomLookPointerId = remaining[0];
            roomLookLastX = remaining[1].x;
            roomLookLastY = remaining[1].y;
        } else {
            roomLookPointerId = null;
        }
    });

    window.addEventListener("keydown", event => {
        if (roomViewerScreen.classList.contains("active")) {
            roomKeyboard.add(event.code);
        }
    });

    window.addEventListener("keyup", event => {
        roomKeyboard.delete(event.code);
    });

    window.addEventListener("blur", () => {
        roomKeyboard.clear();
        roomMouseDown = false;
        roomVerticalInput = 0;
        roomVerticalButtonInput = 0;
    });

    resizeRoomViewer();
    roomAnimationFrame = requestAnimationFrame(roomRenderLoop);
}

let roomMovePointerX = 0;
let roomMovePointerY = 0;

function updateRoomCameraRotation() {
    if (!roomCamera) return;

    const direction = new THREE.Vector3(
        Math.sin(roomYaw) * Math.cos(roomPitch),
        Math.sin(roomPitch),
        Math.cos(roomYaw) * Math.cos(roomPitch)
    );

    roomCamera.lookAt(
        roomCamera.position.x + direction.x,
        roomCamera.position.y + direction.y,
        roomCamera.position.z + direction.z
    );

    /*
        Roll — вращение камеры вокруг собственной оси взгляда.
        Сначала сохраняем ориентацию направления, затем
        применяем дополнительный поворот вокруг локальной оси Z.
    */
    const baseQuaternion =
        roomCamera.quaternion.clone();

    const rollQuaternion =
        new THREE.Quaternion().setFromAxisAngle(
            new THREE.Vector3(0, 0, 1),
            roomRoll
        );

    roomCamera.quaternion
        .copy(baseQuaternion)
        .multiply(rollQuaternion);
}

function clampRoomCamera() {
    if (!roomCamera) return;

    roomCamera.position.x = THREE.MathUtils.clamp(
        roomCamera.position.x,
        -ROOM_LENGTH / 2 + ROOM_CAMERA_RADIUS,
        ROOM_LENGTH / 2 - ROOM_CAMERA_RADIUS
    );

    roomCamera.position.z = THREE.MathUtils.clamp(
        roomCamera.position.z,
        -ROOM_WIDTH / 2 + ROOM_CAMERA_RADIUS,
        ROOM_WIDTH / 2 - ROOM_CAMERA_RADIUS
    );

    roomCamera.position.y = THREE.MathUtils.clamp(
        roomCamera.position.y,
        0.35,
        ROOM_HEIGHT - 0.35
    );
}

function updateRoomMovement(dt) {
    if (!roomCamera) return;

    let forward = 0;
    let strafe = 0;

    if (roomKeyboard.has("KeyW") || roomKeyboard.has("ArrowUp")) forward += 1;
    if (roomKeyboard.has("KeyS") || roomKeyboard.has("ArrowDown")) forward -= 1;
    if (roomKeyboard.has("KeyA") || roomKeyboard.has("ArrowLeft")) strafe -= 1;
    if (roomKeyboard.has("KeyD") || roomKeyboard.has("ArrowRight")) strafe += 1;

    const keyboardVertical =
        (roomKeyboard.has("KeyR") ? 1 : 0) -
        (roomKeyboard.has("KeyF") ? 1 : 0);

    roomVerticalInput =
        keyboardVertical !== 0
            ? keyboardVertical
            : roomVerticalButtonInput;

    const length = Math.hypot(strafe, forward);
    if (length > 1) {
        strafe /= length;
        forward /= length;
    }

    if (Math.abs(strafe) < 0.001 && Math.abs(forward) < 0.001) {
        clampRoomCamera();
        return;
    }

    const speed = ROOM_SPEED * dt;

    const forwardX = Math.sin(roomYaw);
    const forwardZ = Math.cos(roomYaw);

    const rightX = Math.cos(roomYaw);
    const rightZ = -Math.sin(roomYaw);

    roomCamera.position.x +=
        (forwardX * forward + rightX * strafe) * speed;

    roomCamera.position.z +=
        (forwardZ * forward + rightZ * strafe) * speed;

    if (roomVerticalInput !== 0) {
        roomCamera.position.y +=
            roomVerticalInput * speed;
    }

    clampRoomCamera();
}

function roomRenderLoop() {
    roomAnimationFrame = requestAnimationFrame(roomRenderLoop);

    if (!roomRenderer || !roomScene || !roomCamera) return;

    const dt = Math.min(roomClock?.getDelta() || 0.016, 0.05);

    if (roomViewerScreen.classList.contains("active")) {
        updateRoomMovement(dt);
        updateRoomCameraRotation();
        roomRenderer.render(roomScene, roomCamera);
    }
}

function resizeRoomViewer() {
    if (!roomRenderer || !roomCamera) return;

    const width = roomCanvas.clientWidth || window.innerWidth;
    const height = roomCanvas.clientHeight || window.innerHeight;

    roomCamera.aspect = width / height;
    roomCamera.updateProjectionMatrix();
    roomRenderer.setSize(width, height, false);
}

function getRoomGalleryImage(item) {
    const folder = String(
        item?.folder ||
        item?.name ||
        ""
    ).trim();

    const directIcon = String(
        item?.icon_url ||
        item?.icon?.url ||
        ""
    ).trim();

    if (directIcon) return directIcon;

    if (!folder) return "";

    return roomFileUrl(
        folder,
        "01_BACKGROUND.png"
    );
}

function openRoomGallery() {
    if (!roomGalleryOverlay || !roomGalleryList) return;

    roomGalleryOverlay.classList.add("active");
    roomGalleryOverlay.setAttribute("aria-hidden", "false");

    roomGalleryList.style.display = "flex";
    renderRoomGallery();
}

function closeRoomGallery() {
    if (!roomGalleryOverlay) return;

    roomGalleryOverlay.classList.remove("active");
    roomGalleryOverlay.setAttribute("aria-hidden", "true");
}

function renderRoomGallery() {
    if (!roomGalleryList) return;

    if (!rooms.length) {
        roomGalleryList.innerHTML = `
            <div class="roomGalleryEmpty">
                ROOM EMPTY
            </div>
        `;
        return;
    }

    roomGalleryList.innerHTML = "";

    rooms.forEach((item, index) => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "roomGalleryCard";

        const imageUrl = getRoomGalleryImage(item);

        if (imageUrl) {
            const image = document.createElement("img");
            image.src = imageUrl;
            image.alt = "";
            image.loading = "lazy";
            image.decoding = "async";

            image.addEventListener(
                "error",
                () => image.remove(),
                { once: true }
            );

            card.appendChild(image);
        }

        const content = document.createElement("div");
        content.className = "roomGalleryCardContent";

        const number = document.createElement("div");
        number.className = "roomGalleryCardNumber";
        number.textContent =
            `ROOM ${roomNumberValue(item, index)}`;

        const name = document.createElement("div");
        name.className = "roomGalleryCardName";
        name.textContent =
            roomName(item, index);

        content.appendChild(number);
        content.appendChild(name);
        card.appendChild(content);

        card.addEventListener("click", () => {
            closeRoomGallery();
            openRoom(index);
        });

        roomGalleryList.appendChild(card);
    });
}

async function loadRooms() {
    roomStatus.textContent = "";
    roomStatus.style.display = "none";

    roomGrid.innerHTML = `
        <div class="roomLoading" aria-label="Загрузка комнат">
            <div class="roomLoadingSpinner"></div>
            <div class="roomLoadingText">ROOM</div>
        </div>
    `;

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 12000);

    try {
        const response = await fetch(
            `${ROOMS_API}?t=${Date.now()}`,
            {
                method: "GET",
                cache: "no-store",
                headers: {
                    "Accept": "application/json"
                },
                signal: controller.signal
            }
        );

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        rooms = Array.isArray(data)
            ? data
            : Array.isArray(data.items)
                ? data.items
                : Array.isArray(data.rooms)
                    ? data.rooms
                    : [];

        rooms = rooms.filter(Boolean);

        if (!rooms.length) {
            roomGrid.innerHTML = `
                <div class="roomLoading">
                    <div class="roomLoadingText">ROOM EMPTY</div>
                </div>
            `;
            return;
        }

        roomGrid.innerHTML = "";

        rooms.forEach((item, index) => {
            const folder = String(
                item?.folder ||
                item?.name ||
                ""
            ).trim();

            const card = document.createElement("div");
            card.className = "roomCard";

            const button = document.createElement("button");
            button.type = "button";
            button.className = "roomItem";

            const iconUrl = String(
                item?.icon_url ||
                item?.icon?.url ||
                ""
            ).trim();

            if (iconUrl) {
                const icon = document.createElement("img");
                icon.className = "roomIcon";
                icon.alt = "";
                icon.loading = "lazy";
                icon.decoding = "async";
                icon.src = iconUrl;

                icon.addEventListener(
                    "error",
                    () => {
                        icon.remove();
                    },
                    { once: true }
                );

                button.appendChild(icon);
            }

            const number = document.createElement("div");
            number.textContent = roomNumberValue(
                item,
                index
            );

            const name = document.createElement("small");
            name.textContent =
                folder ||
                `room_${index + 1}`;

            button.appendChild(number);
            button.appendChild(name);

            button.addEventListener(
                "click",
                () => {
                    openRoom(index);
                }
            );

            const buyLink = document.createElement("a");
            buyLink.className = "roomBuyButton";
            buyLink.textContent = "КУПИТЬ";
            buyLink.target = "_blank";
            buyLink.rel = "noopener noreferrer";

            const nftLink =
                String(
                    ROOM_NFT_LINKS[index] || ""
                ).trim();

            if (nftLink) {
                buyLink.href = nftLink;
            } else {
                buyLink.href = "#";
                buyLink.addEventListener(
                    "click",
                    event => {
                        event.preventDefault();
                    }
                );
            }

            card.appendChild(button);
            card.appendChild(buyLink);
            roomGrid.appendChild(card);
        });

        renderRoomGallery();

    } catch (error) {
        console.error(
            "ROOM LIST ERROR:",
            error
        );

        roomGrid.innerHTML = `
            <div class="roomLoading">
                <div class="roomLoadingText">
                    ROOM ERROR
                </div>
            </div>
        `;
    } finally {
        clearTimeout(timeout);
    }
}

function openRoom(index) {
    if (!requireAccess()) return;

    const item = rooms[index];
    if (!item) return;

    currentRoom = item;

    const number = roomNumberValue(item, index);
    const name = roomName(item, index);

    roomViewerTitle.textContent = `ROOM ${number}`;

    showScreen(roomViewerScreen);

    /*
        Статус устанавливаем ДО инициализации Three.js.
        Если WebGL/renderer даст ошибку, пользователь всё равно
        увидит реальную ошибку вместо вечного "Загрузка комнаты...".
    */
    setRoomStatus(
        `ROOM ${name}`,
        true
    );

    try {
        initRoomViewer();
        resizeRoomViewer();
    } catch (viewerError) {

        console.error(
            "[ROOM VIEWER INIT ERROR]",
            viewerError
        );

        setRoomStatus(
            `Ошибка инициализации ROOM viewer.\n\n` +
            `${viewerError?.message || viewerError}`,
            true
        );

        return;
    }

    buildRoom(item).catch(error => {
        console.error("ROOM BUILD ERROR:", error);

        setRoomStatus("", false);
        console.error(
            "ROOM LOAD FAILED:",
            error
        );
    });
}

    .catch(
        error => {
            console.error(
                "TON RESTORE ERROR:",
                error
            );
        }
    );


/* =============================================================
   RESTORE
============================================================= */

tonConnectUI.connectionRestored
    .then(
        restored => {

            console.log(
                "TON connection restored:",
                restored
            );

        }
    )
    .catch(
        error => {

            console.error(
                "TON RESTORE ERROR:",
                error
            );

        }
    );


window.addEventListener(
    "resize",
    () => {

        if (
            camXRCamera &&
            !camFallbackMode
        ) {
            camXRCamera.aspect =
                window.innerWidth /
                window.innerHeight;

            camXRCamera.updateProjectionMatrix();
        }

        if (
            camXRCamera &&
            camFallbackMode
        ) {
            camXRCamera.aspect =
                window.innerWidth /
                window.innerHeight;

            camXRCamera.updateProjectionMatrix();
        }

        if (
            camXRRenderer
        ) {
            camXRRenderer.setSize(
                window.innerWidth,
                window.innerHeight,
                false
            );
        }
    },
    {
        passive: true
    }
);

</script>
