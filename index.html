            margin: 0;
            padding: 0;

/*

/* =============================================================
   TON ADDRESS
============================================================= */

function base64UrlToBytes(value) {

    let normalized =
        String(value)
            .replace(/-/g, "+")
            .replace(/_/g, "/");


    while (
        normalized.length % 4 !== 0
    ) {

        normalized += "=";

    }


    const binary =
        atob(normalized);


    const bytes =
        new Uint8Array(
            binary.length
        );


    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(i);

    }


    return bytes;

}


function normalizeTonAddress(address) {

    if (!address) {
        return "";
    }


    address =
        String(address).trim();


    /*
        Уже raw:
        0:64hex
    */

    if (
        /^-?\d+:[0-9a-fA-F]{64}$/
            .test(address)
    ) {

        const parts =
            address.split(":");


        return (
            parts[0] +
            ":" +
            parts[1].toLowerCase()
        );

    }


    /*
        Friendly:
        EQ...
        UQ...
    */

    try {

        const bytes =
            base64UrlToBytes(
                address
            );


        if (
            bytes.length !== 36
        ) {

            return address.toLowerCase();

        }


        let workchain =
            bytes[1];


        if (
            workchain === 255
        ) {

            workchain = -1;

        }


        let hash = "";


        for (
            let i = 2;
            i < 34;
            i++
        ) {

            hash +=
                bytes[i]
                    .toString(16)
                    .padStart(2, "0");

        }


        return (
            workchain +
            ":" +
            hash.toLowerCase()
        );

    } catch {

        return address.toLowerCase();

    }

}

/* =============================================================
   NFT CHECK
============================================================= */

async function checkCollectionNFT(
    walletAddress
) {

    const url =
        "https://tonapi.io/v2/accounts/" +
        encodeURIComponent(
            walletAddress
        ) +
        "/nfts?limit=1000";


    const response =
        await fetch(url, {

            method: "GET",

            headers: {
                "Accept":
                    "application/json"
            }

        });


    if (!response.ok) {

        throw new Error(
            "TonAPI HTTP " +
            response.status
        );

    }


    const data =
        await response.json();


    const nftItems =
        Array.isArray(
            data.nft_items
        )
            ? data.nft_items
            : [];


    for (
        const nft of nftItems
    ) {

        const collectionAddress =
            nft.collection?.address ||
            nft.collection_address ||
            "";


        if (!collectionAddress) {
            continue;
        }


        const normalized =
            normalizeTonAddress(
                collectionAddress
            );


        if (
            normalized ===
                normalizedRequiredCollection
            ||
            normalized ===
                REQUIRED_COLLECTION_RAW
        ) {

            return true;

        }

    }


    return false;

}

let currentWallet =
    null;

let accessGranted =
    false;

let checkingNFT =
    false;


async function processWallet(
    wallet
) {

    if (!wallet) {

        currentWallet =
            null;

        accessGranted =
            false;

        userWalletAddress.textContent =
            "";

        userStatus.textContent =
            "";

        authStatus.textContent =
            "Подключите TON-кошелёк";

        showScreen(
            authScreen
        );

        return;

    }


    if (
        checkingNFT
    ) {

        return;

    }


    if (
        !wallet.account ||
        !wallet.account.address
    ) {

        return;

    }


    currentWallet =
        wallet.account.address;


    accessGranted =
        false;

    checkingNFT =
        true;


    authStatus.textContent =
        "Проверка NFT...";


    loading.classList.add(
        "active"
    );


    try {

        const hasNFT =
            await checkCollectionNFT(
                currentWallet
            );


        if (!hasNFT) {

            accessGranted =
                false;


            authStatus.textContent =
                "NFT нужной коллекции не найден";


            showScreen(
                authScreen
            );


            return;

        }


        accessGranted =
            true;


        userWalletAddress.textContent =
            currentWallet;


        authStatus.textContent =
            "Доступ разрешён";


        showScreen(
            homeScreen
        );


    } catch (error) {

        console.error(
            "NFT CHECK ERROR:",
            error
        );


        accessGranted =
            false;


        authStatus.textContent =
            "Ошибка проверки NFT";


        showScreen(
            authScreen
        );


    } finally {

        checkingNFT =
            false;


        loading.classList.remove(
            "active"
        );

    }

}

let archiveModels = [];
let archiveRefreshTimer = null;
let lastArchiveSignature = "";

function getArchiveModelUrl(item) {

    if (!item) return "";

    // API возвращает /api/models/file/<id>.
    // Всегда собираем полный URL на API-домене.
    if (item.id !== undefined && item.id !== null) {
        return (
            ARCHIVE_API.replace(/\/$/, "") +
            "/file/" +
            encodeURIComponent(String(item.id))
        );
    }

    if (item.url) {
        const value = String(item.url);

        if (/^https?:\/\//i.test(value)) {
            return value;
        }

        return (
            ARCHIVE_API.replace(/\/$/, "") +
            "/" +
            value.replace(/^\/+/, "")
        );
    }

    return "";
}

function getModelExtension(item) {

    const name = String(
        item?.filename ||
        item?.name ||
        item?.file ||
        ""
    ).toLowerCase();

    return name.split(".").pop();
}

function getArchiveSignature(items) {

    return items.map(item => (
        String(item.id ?? "") + "|" +
        String(item.filename ?? item.name ?? "") + "|" +
        String(item.url ?? "")
    )).join("||");
}

async function loadArchiveModels(silent = false) {

    if (!silent) {
        archiveStatus.textContent =
            "Загрузка 3D моделей...";
    }

    try {

        const response = await fetch(
            ARCHIVE_API,
            {
                method: "GET",
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const data = await response.json();

        const items = Array.isArray(data.items)
            ? data.items
            : Array.isArray(data)
                ? data
                : [];

        const signature = getArchiveSignature(items);

        archiveModels = items;

        if (!archiveModels.length) {
            archiveStatus.textContent =
                "В архиве пока нет 3D моделей.";
            archiveGrid.innerHTML = "";
            lastArchiveSignature = signature;
            return;
        }

        if (silent && signature === lastArchiveSignature) {
            return;
        }

        lastArchiveSignature = signature;
        archiveGrid.innerHTML = "";

        archiveStatus.textContent =
            "Моделей: " + archiveModels.length;

        archiveModels.forEach((item, index) => {

            const button = document.createElement("button");
            button.type = "button";
            button.className = "archiveItem";

            const preview = document.createElement("div");
            preview.className = "archivePlaceholder";
            preview.textContent =
                getModelExtension(item).toUpperCase() || "3D";
            button.appendChild(preview);

            const info = document.createElement("div");
            info.className = "archiveInfo";

            const name = document.createElement("div");
            name.className = "archiveName";
            name.textContent =
                item.filename || item.name || "model";

            const folder = document.createElement("div");
            folder.className = "archiveFolder";
            folder.textContent =
                String(item.folder || getModelExtension(item) || "3D").toUpperCase();

            info.appendChild(name);
            info.appendChild(folder);
            button.appendChild(info);

            button.addEventListener("click", () => {
                openArchiveViewer(index);
            });

            archiveGrid.appendChild(button);
        });

    } catch (error) {

        console.error("ARCHIVE ERROR:", error);

        if (!silent || !archiveModels.length) {
            archiveStatus.textContent =
                "Не удалось получить архив: " +
                (error.message || error);
        }
    }
}

function startArchiveAutoRefresh() {

    if (archiveRefreshTimer) {
        return;
    }

    loadArchiveModels(false);

    archiveRefreshTimer = setInterval(() => {
        loadArchiveModels(true);
    }, 2000);
}

function stopArchiveAutoRefresh() {

    if (archiveRefreshTimer) {
        clearInterval(archiveRefreshTimer);
        archiveRefreshTimer = null;
    }
}

function openArchiveViewer(index) {

    viewerOpenedFromArchive = true;

    const item = archiveModels[index];

    if (!item) {
        return;
    }

    viewerNumber.textContent =
        item.filename || item.name || "3D";

    showScreen(viewerScreen);
    initViewer();
    loadArchiveModel(item);
}

function disposeObject(object) {

    if (!object) {
        return;
    }

    object.traverse(child => {

        if (child.geometry) {
            child.geometry.dispose();
        }

        if (child.material) {

            const materials = Array.isArray(child.material)
                ? child.material
                : [child.material];

            materials.forEach(material => {

                if (material.map) {
                    material.map.dispose();
                }

                if (material.normalMap) {
                    material.normalMap.dispose();
                }

                if (material.roughnessMap) {
                    material.roughnessMap.dispose();
                }

                if (material.metalnessMap) {
                    material.metalnessMap.dispose();
                }

                if (material.emissiveMap) {
                    material.emissiveMap.dispose();
                }

                material.dispose();
            });
        }
    });
}

function clearCurrentModel() {

    if (!model || !scene) {
        model = null;
        return;
    }

    scene.remove(model);
    disposeObject(model);
    model = null;
}

function prepareModel(object) {

    if (!object) {
        throw new Error("Модель не содержит объектов.");
    }

    // Сохраняем ВСЕ дочерние объекты сцены. Ничего не удаляем.
    object.updateMatrixWorld(true);

    modelBox.setFromObject(object);

    if (modelBox.isEmpty()) {
        throw new Error("У модели нет видимой геометрии.");
    }

    modelBox.getCenter(modelCenter);
    modelBox.getSize(modelSize);

    object.position.sub(modelCenter);
    object.updateMatrixWorld(true);

    const maxDimension = Math.max(
        modelSize.x,
        modelSize.y,
        modelSize.z
    );

    if (maxDimension > 0 && Number.isFinite(maxDimension)) {
        object.scale.setScalar(4 / maxDimension);
    }

    object.updateMatrixWorld(true);

    // После масштабирования получаем реальную границу для ходьбы.
    modelBox.setFromObject(object);

    object.traverse(child => {

        if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;

            // Если материал полностью чёрный/без освещения, оставляем его,
            // но добавляем базовую emissive только при необходимости.
            if (child.material) {
                const materials = Array.isArray(child.material)
                    ? child.material
                    : [child.material];

                materials.forEach(material => {
                    if (material.color) {
                        material.color.set(material.color);
                    }
                    material.needsUpdate = true;
                });
            }
        }
    });

    scene.add(object);
    model = object;

    // Ставим камеру перед моделью, а не внутри неё.
    const size = modelBox.getSize(new THREE.Vector3());
    const height = Math.max(size.y, 2);

    camera.position.set(
        0,
        Math.max(1.6, Math.min(height * 0.35, 3)),
        Math.max(2.5, Math.min(height * 0.8, 6))
    );

    // PointerLockControls работает непосредственно с камерой.
    camera.position.set(
        0,
        Math.max(1.6, Math.min(height * 0.35, 3)),
        Math.max(2.5, Math.min(height * 0.8, 6))
    );

    camera.rotation.set(0, 0, 0);

    // Смотрим в сторону центра сцены.
    camera.lookAt(
        0,
        Math.max(0, Math.min(height * 0.15, 1)),
        0
    );
}

function getResourceBaseUrl(item) {

    if (item?.id !== undefined && item?.id !== null) {
        return (
            ARCHIVE_API.replace(/\/$/, "") +
            "/resource/" +
            encodeURIComponent(item.id) +
            "/"
        );
    }

    return getArchiveModelUrl(item);
}

function makeResourceManager(item) {

    const manager = new THREE.LoadingManager();
    const resourceBase = getResourceBaseUrl(item);

    manager.setURLModifier(url => {

        // Встроенные ресурсы GLB/GLTF.
        if (
            url.startsWith("blob:") ||
            url.startsWith("data:")
        ) {
            return url;
        }

        try {
            const parsed = new URL(
                url,
                resourceBase
            );

            // Уже наш API resource URL.
            if (
                parsed.origin === new URL(resourceBase).origin &&
                parsed.pathname.includes("/api/models/resource/")
            ) {
                return parsed.href;
            }

            const filename =
                decodeURIComponent(
                    parsed.pathname.split("/").pop() || ""
                );

            if (filename) {
                return (
                    resourceBase +
                    encodeURIComponent(filename)
                );
            }
        } catch (error) {
            console.warn(
                "RESOURCE URL ERROR:",
                error
            );
        }

        return url;
    });

    return manager;
}

async function fetchModelBytes(url) {

    const requestUrl =
        url + (url.includes("?") ? "&" : "?") +
        "_3d=" + Date.now();

    let response;

    try {
        response = await fetch(
            requestUrl,
            {
                method: "GET",
                mode: "cors",
                credentials: "omit",
                cache: "no-store",
                redirect: "follow",
                headers: {
                    "Accept": "model/gltf-binary, model/gltf+json, application/octet-stream, */*"
                }
            }
        );
    } catch (error) {
        throw new Error(
            "Ошибка CORS/сети при загрузке модели.\n" +
            "API: " + url + "\n" +
            "Проверь /api/cors-test и /api/models/file/<ID>.\n" +
            "Браузер: " + (error?.message || String(error))
        );
    }

    if (!response.ok) {
        throw new Error(
            "API вернул HTTP " + response.status + ".\n" +
            "URL: " + url
        );
    }

    const contentType =
        response.headers.get("content-type") || "";

    const contentLength = Number(
        response.headers.get("content-length") || 0
    );

    console.log("3D RESPONSE:", {
        status: response.status,
        contentType,
        contentLength,
        cors: response.headers.get("access-control-allow-origin")
    });

    if (!response.body) {
        const buffer = await response.arrayBuffer();
        if (!buffer.byteLength) {
            throw new Error("API вернул пустой файл модели.");
        }
        return buffer;
    }

    const reader = response.body.getReader();
    const chunks = [];
    let total = 0;

    while (true) {
        const { value, done } = await reader.read();
        if (done) break;

        if (value && value.byteLength) {
            chunks.push(value);
            total += value.byteLength;

            const expected = contentLength || 0;
            if (expected > 0) {
                const percent = Math.min(
                    100,
                    Math.round((total / expected) * 100)
                );
                viewerLoading.textContent =
                    "ЗАГРУЗКА 3D МОДЕЛИ " + percent + "%";
            }
        }
    }

    if (!total) {
        throw new Error("API вернул пустой файл модели.");
    }

    const buffer = new Uint8Array(total);
    let offset = 0;

    for (const chunk of chunks) {
        buffer.set(chunk, offset);
        offset += chunk.byteLength;
    }

    console.log("3D MODEL DOWNLOADED:", total, "bytes");

    return buffer.buffer;
}

function parseOBJ(buffer) {

    const text = new TextDecoder("utf-8").decode(buffer);
    return objLoader.parse(text);
}

function parseSTL(buffer) {

    const geometry = stlLoader.parse(buffer);

    geometry.computeVertexNormals();

    const material = new THREE.MeshStandardMaterial({
        color: 0xbcbcbc,
        metalness: 0.05,
        roughness: 0.75,
        side: THREE.DoubleSide
    });

    return new THREE.Mesh(
        geometry,
        material
    );
}

async function parseModelByExtension(item, url, buffer) {

    const extension = getModelExtension(item);

    if (extension === "glb" || extension === "gltf") {

        const manager = makeResourceManager(item);
        const loader = new GLTFLoader(manager);

        return await new Promise((resolve, reject) => {

            const basePath = url.substring(
                0,
                url.lastIndexOf("/") + 1
            );

            loader.parse(
                buffer,
                basePath,
                gltf => resolve(gltf.scene),
                error => reject(error || new Error("GLTF parse error"))
            );
        });
    }

    if (extension === "fbx") {

        const manager = makeResourceManager(item);
        const loader = new FBXLoader(manager);
        return loader.parse(buffer, getResourceBaseUrl(item));
    }

    if (extension === "obj") {

        // OBJ geometry загружается без MTL, поэтому объект отображается
        // даже если рядом пока нет файла материалов/текстур.
        return parseOBJ(buffer);
    }

    if (extension === "stl") {
        return parseSTL(buffer);
    }

    // Попытка GLTF для неизвестного расширения.
    const manager = makeResourceManager(item);
    const loader = new GLTFLoader(manager);

    return await new Promise((resolve, reject) => {
        loader.parse(
            buffer,
            url.substring(0, url.lastIndexOf("/") + 1),
            gltf => resolve(gltf.scene),
            error => reject(error || new Error("Unknown 3D format"))
        );
    });
}

async function loadArchiveModel(item) {

    currentModelItem = item;
    hideViewerError();
    showViewerLoading(true);
    clearCurrentModel();

    const url = getArchiveModelUrl(item);

    if (!url) {
        showViewerLoading(false);
        showViewerError("У модели отсутствует URL загрузки.");
        return;
    }

    console.log("LOAD 3D MODEL:", url);

    try {

        const buffer = await fetchModelBytes(url);
        const object = await parseModelByExtension(
            item,
            url,
            buffer
        );

        prepareModel(object);

        showViewerLoading(false);

    } catch (error) {

        console.error(
            "ARCHIVE MODEL ERROR:",
            error
        );

        showViewerLoading(false);

        showViewerError(
            "Не удалось отобразить 3D модель.\n" +
            (error?.message || String(error))
        );
    }
}

function initViewer() {

    if (renderer) {
        return;
    }

    scene = new THREE.Scene();

    scene.background = new THREE.Color(0x000000);

    camera = new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.01,
        2000
    );

    camera.position.set(0, 1.7, 4);

    renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false,
        powerPreference: "high-performance",
        preserveDrawingBuffer: false
    });

    renderer.domElement.setAttribute(
        "aria-label",
        "3D viewer"
    );

    renderer.domElement.addEventListener(
        "webglcontextlost",
        event => {
            event.preventDefault();
            showViewerError(
                "WebGL контекст телефона был потерян. " +
                "Обновите страницу и откройте модель снова."
            );
        },
        false
    );

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    viewerCanvas.appendChild(renderer.domElement);

    walkControls = new PointerLockControls(
        camera,
        renderer.domElement
    );

    // PointerLockControls управляет камерой напрямую.
    scene.add(walkControls.getObject());

    walkControls.addEventListener("lock", () => {
        viewerHelp.style.display = "none";
    });

    walkControls.addEventListener("unlock", () => {
        viewerHelp.style.display = "block";
    });

    renderer.domElement.addEventListener("click", () => {
        if (window.innerWidth > 700 && !walkControls.isLocked) {
            walkControls.lock();
        }
    });

    const ambient = new THREE.HemisphereLight(
        0xffffff,
        0x333333,
        2.4
    );

    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(
        0xffffff,
        4
    );

    keyLight.position.set(5, 8, 5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);

    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(
        0xffffff,
        1.5
    );

    fillLight.position.set(-5, 4, -4);
    scene.add(fillLight);

    // Небольшая сетка пола даёт ощущение пространства, но не меняет модель.
    const grid = new THREE.GridHelper(
        100,
        100,
        0x333333,
        0x161616
    );

    grid.position.y = -0.001;
    scene.add(grid);

    window.addEventListener(
        "resize",
        resizeViewer
    );

    window.addEventListener(
        "keydown",
        onViewerKeyDown
    );

    window.addEventListener(
        "keyup",
        onViewerKeyUp
    );

    // Сенсорные кнопки для мобильного движения.
    viewerTouch.querySelectorAll("button").forEach(button => {

        const code = button.dataset.key;

        const press = event => {
            event.preventDefault();
            keys[code] = true;
        };

        const release = event => {
            event.preventDefault();
            keys[code] = false;
        };

        button.addEventListener("pointerdown", press);
        button.addEventListener("pointerup", release);
        button.addEventListener("pointercancel", release);
        button.addEventListener("pointerleave", release);
    });

    if (window.innerWidth <= 700) {
        viewerTouch.style.display = "grid";
    }

    setupMobileLook();

    animateViewer();
}

let mobileLookActive = false;
let mobileLookPointerId = null;
let mobileLastX = 0;
let mobileLastY = 0;

function setupMobileLook() {

    const pad = document.getElementById("viewerLookPad");
    if (!pad) return;

    pad.style.pointerEvents = window.innerWidth <= 700 ? "auto" : "none";

    pad.addEventListener("pointerdown", event => {
        if (window.innerWidth > 700) return;
        if (event.target.closest("button")) return;

        mobileLookActive = true;
        mobileLookPointerId = event.pointerId;
        mobileLastX = event.clientX;
        mobileLastY = event.clientY;

        try {
            pad.setPointerCapture(event.pointerId);
        } catch (_) {}

        event.preventDefault();
    }, { passive: false });

    pad.addEventListener("pointermove", event => {
        if (!mobileLookActive) return;
        if (event.pointerId !== mobileLookPointerId) return;
        if (!camera) return;

        const dx = event.clientX - mobileLastX;
        const dy = event.clientY - mobileLastY;

        mobileLastX = event.clientX;
        mobileLastY = event.clientY;

        camera.rotation.y -= dx * 0.004;
        camera.rotation.x -= dy * 0.004;
        camera.rotation.x = Math.max(
            -Math.PI * 0.48,
            Math.min(Math.PI * 0.48, camera.rotation.x)
        );

        event.preventDefault();
    }, { passive: false });

    const stop = event => {
        if (event.pointerId !== mobileLookPointerId) return;
        mobileLookActive = false;
        mobileLookPointerId = null;
        event.preventDefault();
    };

    pad.addEventListener("pointerup", stop, { passive: false });
    pad.addEventListener("pointercancel", stop, { passive: false });
    pad.addEventListener("lostpointercapture", () => {
        mobileLookActive = false;
        mobileLookPointerId = null;
    });
}


function onViewerKeyDown(event) {

    if (event.code === "Escape") {
        return;
    }

    keys[event.code] = true;

    if (
        [
            "KeyW",
            "KeyA",
            "KeyS",
            "KeyD",
            "Space",
            "ControlLeft",
            "ControlRight",
            "ShiftLeft",
            "ShiftRight"
        ].includes(event.code)
    ) {
        event.preventDefault();
    }
}

function onViewerKeyUp(event) {
    keys[event.code] = false;
}

function updateWalking(delta) {

    if (!walkControls) {
        return;
    }

    const speed =
        (keys.ShiftLeft || keys.ShiftRight)
            ? 8
            : 4;

    walkDirection.set(0, 0, 0);

    if (keys.KeyW) walkDirection.z -= 1;
    if (keys.KeyS) walkDirection.z += 1;
    if (keys.KeyA) walkDirection.x -= 1;
    if (keys.KeyD) walkDirection.x += 1;

    if (walkDirection.lengthSq() > 0) {
        walkDirection.normalize();
        walkControls.moveRight(
            walkDirection.x * speed * delta
        );
        walkControls.moveForward(
            -walkDirection.z * speed * delta
        );
    }

    if (keys.Space) {
        walkControls.getObject().position.y +=
            speed * delta;
    }

    if (keys.ControlLeft || keys.ControlRight) {
        walkControls.getObject().position.y -=
            speed * delta;
    }

    // Минимальная высота камеры.
    walkControls.getObject().position.y = Math.max(
        0.25,
        walkControls.getObject().position.y
    );
}

function resizeViewer() {

    const pad = document.getElementById("viewerLookPad");
    if (pad) {
        pad.style.pointerEvents = window.innerWidth <= 700 ? "auto" : "none";
    }

    if (!camera || !renderer) {
        return;
    }

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}

function animateViewer() {

    requestAnimationFrame(animateViewer);

    const delta = Math.min(
        clock.getDelta(),
        0.05
    );

    updateWalking(delta);

    if (renderer && scene && camera) {
        renderer.render(
            scene,
            camera
        );
    }
}

/* =============================================================
   OPEN GALLERY MODEL
============================================================= */

function openViewer(index) {

    viewerOpenedFromArchive = false;

    if (!requireAccess()) {
        return;
    }

    const item = galleryItems[index];

    if (!item) {
        return;
    }

    viewerNumber.textContent = item.number;
    showScreen(viewerScreen);
    initViewer();

    const archiveStyleItem = {
        ...item,
        filename: item.filename,
        url: MODEL_BASE + encodeURIComponent(item.filename)
    };

    loadArchiveModel(archiveStyleItem);
}
