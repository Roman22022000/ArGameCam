<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1,
    maximum-scale=1,
    user-scalable=no,
    viewport-fit=cover"
>

<title>AR</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
}

#app {
    width: 100%;
    height: 100%;
    position: fixed;
    inset: 0;
}

/* START */

#start {
    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    background: #000;

    z-index: 10;
}

#startContent {
    width: 100%;
    max-width: 360px;
    text-align: center;
}

#start h1 {
    margin: 0 0 10px;
    font-size: 42px;
    letter-spacing: 6px;
}

#start p {
    margin: 0 0 35px;
    color: #888;
}

#startButton {
    width: 100%;
    height: 58px;

    border: 0;
    border-radius: 14px;

    background: #fff;
    color: #000;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;
}

#status {
    margin-top: 15px;
    color: #777;
    font-size: 12px;
}


/* CAMERA */

#camera {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: none;

    z-index: 1;
}


/* AR */

#ar {
    position: absolute;
    inset: 0;

    display: none;

    z-index: 2;

    pointer-events: none;
}

#top {
    position: absolute;

    top: 20px;
    left: 15px;
    right: 15px;

    display: flex;
    justify-content: space-between;
}

#arStatus {
    padding: 9px 14px;

    border-radius: 20px;

    background: rgba(0,0,0,.6);

    font-size: 12px;
}

#close {
    width: 44px;
    height: 44px;

    border: 0;
    border-radius: 50%;

    background: rgba(0,0,0,.7);

    color: white;

    font-size: 26px;

    pointer-events: auto;
}


/* SENSOR DATA */

#data {
    position: absolute;

    left: 15px;
    bottom: 15px;

    padding: 10px;

    background: rgba(0,0,0,.6);

    border-radius: 8px;

    font-family: monospace;
    font-size: 10px;

    line-height: 1.5;
}

</style>

</head>


<body>


<div id="app">


    <!-- START -->

    <div id="start">

        <div id="startContent">

            <h1>AR</h1>

            <p>
                Telegram AR
            </p>

            <button
                id="startButton"
                type="button"
            >
                ЗАПУСК КАМЕРЫ
            </button>

            <div id="status">
                Готово
            </div>

        </div>

    </div>


    <!-- CAMERA -->

    <video
        id="camera"
        autoplay
        muted
        playsinline
    ></video>


    <!-- AR -->

    <div id="ar">


        <div id="top">

            <div id="arStatus">
                CAMERA
            </div>

            <button
                id="close"
                type="button"
            >
                ×
            </button>

        </div>


        <div id="data">

            Orientation:
            <span id="orientation">
                0 / 0 / 0
            </span>

            <br>

            Gyro:
            <span id="gyro">
                0 / 0 / 0
            </span>

            <br>

            Accel:
            <span id="accel">
                0 / 0 / 0
            </span>

            <br>

            GPS:
            <span id="gps">
                —
            </span>

        </div>


    </div>

</div>


<script>

/* =================================================
   TELEGRAM
================================================= */

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;


/* =================================================
   ELEMENTS
================================================= */

const start =
    document.getElementById("start");

const startButton =
    document.getElementById("startButton");

const status =
    document.getElementById("status");

const camera =
    document.getElementById("camera");

const ar =
    document.getElementById("ar");

const arStatus =
    document.getElementById("arStatus");

const close =
    document.getElementById("close");

const orientation =
    document.getElementById("orientation");

const gyro =
    document.getElementById("gyro");

const accel =
    document.getElementById("accel");

const gps =
    document.getElementById("gps");


/* =================================================
   TELEGRAM INIT
================================================= */

if (tg) {

    tg.ready();

    tg.expand();

    tg.setHeaderColor("#000000");

    tg.setBackgroundColor("#000000");

}


/* =================================================
   CAMERA
================================================= */

async function startCamera() {

    status.textContent =
        "Запуск камеры...";


    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    facingMode: {
                        ideal: "environment"
                    }

                },

                audio: false

            });


        camera.srcObject =
            stream;


        await camera.play();


        start.style.display =
            "none";


        camera.style.display =
            "block";


        ar.style.display =
            "block";


        arStatus.textContent =
            "CAMERA";


        status.textContent =
            "Камера запущена";


        startSensors();


    } catch (error) {

        console.error(error);


        status.textContent =
            "Камера не запустилась: " +
            error.name;

    }

}


/* =================================================
   TELEGRAM MOTION
================================================= */

function startSensors() {

    if (!tg) {
        return;
    }


    /* ORIENTATION */

    if (
        tg.DeviceOrientation
    ) {

        tg.DeviceOrientation.start(

            {
                refresh_rate: 50,
                need_absolute: true
            },

            function(ok) {

                console.log(
                    "Orientation:",
                    ok
                );

            }

        );


        tg.onEvent(
            "deviceOrientationChanged",
            function() {

                const d =
                    tg.DeviceOrientation;


                orientation.textContent =

                    Number(d.alpha).toFixed(2) +
                    " / " +

                    Number(d.beta).toFixed(2) +
                    " / " +

                    Number(d.gamma).toFixed(2);

            }
        );

    }


    /* GYROSCOPE */

    if (
        tg.Gyroscope
    ) {

        tg.Gyroscope.start(

            {
                refresh_rate: 50
            },

            function(ok) {

                console.log(
                    "Gyroscope:",
                    ok
                );

            }

        );


        tg.onEvent(
            "gyroscopeChanged",
            function() {

                const g =
                    tg.Gyroscope;


                gyro.textContent =

                    Number(g.x).toFixed(2) +
                    " / " +

                    Number(g.y).toFixed(2) +
                    " / " +

                    Number(g.z).toFixed(2);

            }
        );

    }


    /* ACCELEROMETER */

    if (
        tg.Accelerometer
    ) {

        tg.Accelerometer.start(

            {
                refresh_rate: 50
            },

            function(ok) {

                console.log(
                    "Accelerometer:",
                    ok
                );

            }

        );


        tg.onEvent(
            "accelerometerChanged",
            function() {

                const a =
                    tg.Accelerometer;


                accel.textContent =

                    Number(a.x).toFixed(2) +
                    " / " +

                    Number(a.y).toFixed(2) +
                    " / " +

                    Number(a.z).toFixed(2);

            }
        );

    }


    /* GPS */

    if (
        tg.LocationManager
    ) {

        tg.LocationManager.init(
            function() {

                tg.LocationManager.getLocation(
                    function(location) {

                        if (!location) {
                            return;
                        }


                        gps.textContent =

                            Number(
                                location.latitude
                            ).toFixed(6) +

                            " / " +

                            Number(
                                location.longitude
                            ).toFixed(6);

                    }
                );

            }
        );

    }


    /* LOCK ORIENTATION */

    try {

        tg.lockOrientation();

    } catch (_) {}

}


/* =================================================
   STOP
================================================= */

function stopCamera() {

    if (
        camera.srcObject
    ) {

        camera.srcObject
            .getTracks()
            .forEach(
                function(track) {

                    track.stop();

                }
            );

        camera.srcObject =
            null;

    }


    if (tg) {

        try {
            tg.DeviceOrientation?.stop();
        } catch (_) {}

        try {
            tg.Gyroscope?.stop();
        } catch (_) {}

        try {
            tg.Accelerometer?.stop();
        } catch (_) {}

        try {
            tg.unlockOrientation();
        } catch (_) {}

    }


    camera.style.display =
        "none";

    ar.style.display =
        "none";

    start.style.display =
        "flex";

    status.textContent =
        "Готово";

}


/* =================================================
   BUTTONS
================================================= */

startButton.onclick =
    function() {

        startCamera();

    };


close.onclick =
    function() {

        stopCamera();

    };


/* =================================================
   DEBUG
================================================= */

console.log(
    "AR Mini App loaded"
);

</script>

</body>

</html>
