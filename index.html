<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1,
           maximum-scale=1,
           user-scalable=no,
           viewport-fit=cover"
>

<title>AR Space</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
    font-family: Arial, sans-serif;
}

#app {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

/* =========================
   START
========================= */

#startScreen {
    position: fixed;
    inset: 0;
    z-index: 100;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #000;
    color: #fff;

    padding: 20px;
}

.startContent {
    width: 100%;
    max-width: 360px;
    text-align: center;
}

.startContent h1 {
    margin: 0 0 12px;
    font-size: 42px;
    letter-spacing: 7px;
}

.startContent p {
    margin: 0 0 35px;
    color: #777;
}

#startButton {
    width: 100%;
    height: 58px;

    border: 0;
    border-radius: 14px;

    background: #fff;
    color: #000;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

#startButton:active {
    transform: scale(.98);
}

#startStatus {
    margin-top: 14px;
    min-height: 18px;
    color: #777;
    font-size: 12px;
}


/* =========================
   CAMERA
========================= */

#camera {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: none;

    z-index: 1;

    background: #000;
}


/* =========================
   THREE CANVAS
========================= */

#arCanvas {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 2;

    pointer-events: none;
}


/* =========================
   AR UI
========================= */

#arUI {
    position: fixed;
    inset: 0;

    z-index: 10;

    display: none;

    pointer-events: none;
}

#topBar {
    position: absolute;

    top: 15px;
    left: 15px;
    right: 15px;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

#arStatus {
    padding: 9px 14px;

    border-radius: 20px;

    background: rgba(0,0,0,.65);

    color: #fff;

    font-size: 12px;
}

#closeButton {
    width: 44px;
    height: 44px;

    border: 0;
    border-radius: 50%;

    background: rgba(0,0,0,.7);

    color: #fff;

    font-size: 27px;

    pointer-events: auto;
}


/* =========================
   RETICLE
========================= */

#reticle {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 42px;
    height: 42px;

    transform:
        translate(-50%, -50%);

    border:
        1px solid
        rgba(255,255,255,.8);

    border-radius: 50%;
}


/* =========================
   PLACE BUTTON
========================= */

#bottomBar {
    position: absolute;

    left: 20px;
    right: 20px;

    bottom: 20px;

    display: flex;
    justify-content: center;
}

#placeButton {
    width: 100%;
    max-width: 360px;

    height: 56px;

    border: 1px solid rgba(255,255,255,.8);

    border-radius: 14px;

    background: rgba(0,0,0,.75);

    color: #fff;

    font-size: 14px;
    font-weight: bold;

    pointer-events: auto;

    display: none;
}

#placeButton:active {
    transform: scale(.98);
}


/* =========================
   ERROR
========================= */

#error {
    position: fixed;
    inset: 0;

    z-index: 200;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 25px;

    background: #000;

    color: #fff;

    text-align: center;
}

#errorText {
    max-width: 400px;
    line-height: 1.5;
}
</style>
</head>


<body>

<div id="app">

    <!-- START -->

    <div id="startScreen">

        <div class="startContent">

            <h1>AR</h1>

            <p>Telegram AR</p>

            <button
                id="startButton"
                type="button"
            >
                ЗАПУСК КАМЕРЫ
            </button>

            <div id="startStatus">
                Готово
            </div>

        </div>

    </div>


    <!-- CAMERA -->

    <video
        id="camera"
        autoplay
        muted
        playsinline
    ></video>


    <!-- THREE -->

    <canvas
        id="arCanvas"
    ></canvas>


    <!-- AR UI -->

    <div id="arUI">

        <div id="topBar">

            <div id="arStatus">
                КАМЕРА
            </div>

            <button
                id="closeButton"
                type="button"
            >
                ×
            </button>

        </div>


        <div id="reticle"></div>


        <div id="bottomBar">

            <button
                id="placeButton"
                type="button"
            >
                РАЗМЕСТИТЬ 3D МОДЕЛЬ
            </button>

        </div>

    </div>


    <!-- ERROR -->

    <div id="error">

        <div id="errorText"></div>

    </div>

</div>


<!-- =====================================================
     THREE.JS
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>


<script>

/* =====================================================
   TELEGRAM
===================================================== */

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;


/* =====================================================
   ELEMENTS
===================================================== */

const startScreen =
    document.getElementById(
        "startScreen"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const startStatus =
    document.getElementById(
        "startStatus"
    );

const cameraVideo =
    document.getElementById(
        "camera"
    );

const canvas =
    document.getElementById(
        "arCanvas"
    );

const arUI =
    document.getElementById(
        "arUI"
    );

const arStatus =
    document.getElementById(
        "arStatus"
    );

const placeButton =
    document.getElementById(
        "placeButton"
    );

const closeButton =
    document.getElementById(
        "closeButton"
    );

const errorScreen =
    document.getElementById(
        "error"
    );

const errorText =
    document.getElementById(
        "errorText"
    );


/* =====================================================
   STATE
===================================================== */

let cameraStream = null;

let xrSession = null;

let xrReferenceSpace = null;

let viewerSpace = null;

let hitTestSource = null;

let currentHit = null;

let anchor = null;

let model = null;

let modelLoaded = false;

let modelPlaced = false;

let renderer = null;

let scene = null;

let camera3D = null;


/* =====================================================
   INIT TELEGRAM
===================================================== */

function initTelegram() {

    if (!tg) {
        return;
    }

    tg.ready();

    tg.expand();

    try {
        tg.setHeaderColor("#000000");
        tg.setBackgroundColor("#000000");
        tg.disableVerticalSwipes();
    } catch (e) {}

}

initTelegram();


/* =====================================================
   START BUTTON
===================================================== */

startButton.addEventListener(
    "click",
    startApplication
);


/* =====================================================
   START APPLICATION
===================================================== */

async function startApplication() {

    startButton.disabled = true;

    startStatus.textContent =
        "Запуск камеры...";


    try {

        /*
         * Камера.
         */

        await startCamera();


        /*
         * Telegram motion.
         */

        startMotion();


        /*
         * Three.js.
         */

        initThree();


        /*
         * Загружаем модель.
         */

        loadModel();


        /*
         * UI.
         */

        startScreen.style.display =
            "none";

        cameraVideo.style.display =
            "block";

        arUI.style.display =
            "block";


        /*
         * Настоящий WebXR AR.
         */

        await startWebXR();


    } catch (error) {

        console.error(
            error
        );

        showError(
            error.message ||
            "Не удалось запустить камеру"
        );

        startButton.disabled =
            false;
    }

}


/* =====================================================
   CAMERA
===================================================== */

async function startCamera() {

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        throw new Error(
            "Камера недоступна в этом WebView"
        );
    }


    cameraStream =
        await navigator
            .mediaDevices
            .getUserMedia({

                video: {

                    facingMode: {
                        ideal:
                            "environment"
                    },

                    width: {
                        ideal: 1920
                    },

                    height: {
                        ideal: 1080
                    },

                    frameRate: {
                        ideal: 30
                    }

                },

                audio: false

            });


    cameraVideo.srcObject =
        cameraStream;


    await cameraVideo.play();

}


/* =====================================================
   TELEGRAM MOTION
===================================================== */

function startMotion() {

    if (!tg) {
        return;
    }


    /*
     * DEVICE ORIENTATION
     */

    if (
        tg.DeviceOrientation
    ) {

        try {

            tg.DeviceOrientation.start(

                {
                    refresh_rate: 50,
                    need_absolute: false
                },

                function(ok) {

                    console.log(
                        "DeviceOrientation",
                        ok
                    );

                }

            );

        } catch (e) {

            console.log(
                "DeviceOrientation error",
                e
            );

        }

    }


    /*
     * GYROSCOPE
     */

    if (
        tg.Gyroscope
    ) {

        try {

            tg.Gyroscope.start(

                {
                    refresh_rate: 50
                },

                function(ok) {

                    console.log(
                        "Gyroscope",
                        ok
                    );

                }

            );

        } catch (e) {

            console.log(
                "Gyroscope error",
                e
            );

        }

    }


    /*
     * ACCELEROMETER
     */

    if (
        tg.Accelerometer
    ) {

        try {

            tg.Accelerometer.start(

                {
                    refresh_rate: 50
                },

                function(ok) {

                    console.log(
                        "Accelerometer",
                        ok
                    );

                }

            );

        } catch (e) {

            console.log(
                "Accelerometer error",
                e
            );

        }

    }


    /*
     * Не используем GPS.
     */

}


/* =====================================================
   THREE INITIALIZATION
===================================================== */

function initThree() {

    if (renderer) {
        return;
    }


    renderer =
        new THREE.WebGLRenderer({

            canvas:
                canvas,

            alpha: true,

            antialias: true

        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    /*
     * WebXR.
     */

    renderer.xr.enabled =
        true;


    /*
     * Scene.
     */

    scene =
        new THREE.Scene();


    /*
     * Camera.
     */

    camera3D =
        new THREE.PerspectiveCamera(

            70,

            window.innerWidth /
            window.innerHeight,

            0.01,

            100

        );


    scene.add(
        camera3D
    );


    /*
     * Свет.
     */

    const hemisphere =
        new THREE.HemisphereLight(
            0xffffff,
            0x444444,
            2
        );


    scene.add(
        hemisphere
    );


    const directional =
        new THREE.DirectionalLight(
            0xffffff,
            1.5
        );


    directional.position.set(
        2,
        4,
        2
    );


    scene.add(
        directional
    );

}


/* =====================================================
   LOAD GLB
===================================================== */

function loadModel() {

    const loader =
        new THREE.GLTFLoader();


    loader.load(

        "./models/creature.glb",

        function(gltf) {

            model =
                gltf.scene;


            /*
             * Начальный масштаб.
             *
             * Можно изменить позже.
             */

            model.scale.set(
                0.5,
                0.5,
                0.5
            );


            model.visible =
                false;


            scene.add(
                model
            );


            modelLoaded =
                true;


            arStatus.textContent =
                "МОДЕЛЬ ГОТОВА";


            console.log(
                "creature.glb loaded"
            );

        },

        function(progress) {

            if (
                progress.total
            ) {

                const percent =
                    Math.round(

                        progress.loaded /
                        progress.total *
                        100

                    );


                console.log(
                    "GLB",
                    percent + "%"
                );

            }

        },

        function(error) {

            console.error(
                "GLB ERROR",
                error
            );


            arStatus.textContent =
                "ОШИБКА МОДЕЛИ";

        }

    );

}


/* =====================================================
   WEBXR
===================================================== */

async function startWebXR() {

    /*
     * Если WebXR отсутствует,
     * камера остаётся рабочей.
     */

    if (
        !navigator.xr
    ) {

        arStatus.textContent =
            "AR НЕДОСТУПЕН";

        return;

    }


    try {

        /*
         * Запрашиваем AR.
         *
         * Никакой проверки
         * устройства до этого
         * не выполняем.
         */

        xrSession =
            await navigator.xr
                .requestSession(

                    "immersive-ar",

                    {

                        requiredFeatures: [
                            "local-floor",
                            "hit-test"
                        ],

                        optionalFeatures: [
                            "anchors"
                        ]

                    }

                );


        /*
         * Передаём XR session
         * Three.js.
         */

        await renderer.xr
            .setSession(
                xrSession
            );


        /*
         * Локальное пространство.
         */

        xrReferenceSpace =
            await xrSession
                .requestReferenceSpace(
                    "local-floor"
                );


        /*
         * Пространство камеры.
         */

        viewerSpace =
            await xrSession
                .requestReferenceSpace(
                    "viewer"
                );


        /*
         * Hit Test.
         */

        hitTestSource =
            await xrSession
                .requestHitTestSource({

                    space:
                        viewerSpace

                });


        /*
         * Кнопка размещения.
         */

        placeButton.style.display =
            "block";


        arStatus.textContent =
            "НАВЕДИТЕ НА ПОЛ";


        /*
         * AR render loop.
         */

        renderer.setAnimationLoop(
            renderAR
        );


        /*
         * Завершение AR.
         */

        xrSession.addEventListener(
            "end",
            function() {

                xrSession =
                    null;

                hitTestSource =
                    null;

                xrReferenceSpace =
                    null;

                viewerSpace =
                    null;

                currentHit =
                    null;

                anchor =
                    null;

                renderer.setAnimationLoop(
                    null
                );

            }
        );


    } catch (error) {

        console.error(
            "WebXR ERROR",
            error
        );


        /*
         * Не ломаем камеру,
         * если WebXR недоступен.
         */

        arStatus.textContent =
            "КАМЕРА ГОТОВА";

    }

}


/* =====================================================
   AR FRAME
===================================================== */

function renderAR(
    time,
    frame
) {

    if (
        !xrReferenceSpace ||
        !frame
    ) {
        return;
    }


    /*
     * ИЩЕМ ПОВЕРХНОСТЬ
     */

    if (
        hitTestSource &&
        !modelPlaced
    ) {

        const hits =
            frame.getHitTestResults(
                hitTestSource
            );


        if (
            hits.length > 0
        ) {

            currentHit =
                hits[0];


            arStatus.textContent =
                "ПОВЕРХНОСТЬ НАЙДЕНА";

        } else {

            currentHit =
                null;


            arStatus.textContent =
                "ИЩЕМ ПОВЕРХНОСТЬ";

        }

    }


    /*
     * ПОСЛЕ РАЗМЕЩЕНИЯ
     *
     * Anchor отслеживает
     * локальную мировую точку.
     */

    if (
        anchor &&
        model
    ) {

        const pose =
            frame.getPose(

                anchor.anchorSpace,

                xrReferenceSpace

            );


        if (pose) {

            model.matrix
                .fromArray(
                    pose.transform.matrix
                );


            model.matrix
                .decompose(

                    model.position,

                    model.quaternion,

                    model.scale

                );

        }

    }


    renderer.render(
        scene,
        camera3D
    );

}


/* =====================================================
   PLACE MODEL
===================================================== */

placeButton.addEventListener(
    "click",
    placeModel
);


async function placeModel() {

    if (
        !modelLoaded
    ) {

        arStatus.textContent =
            "МОДЕЛЬ ЗАГРУЖАЕТСЯ";

        return;
    }


    if (
        !currentHit
    ) {

        arStatus.textContent =
            "НАВЕДИТЕ НА ПОЛ";

        return;
    }


    /*
     * Получаем локальную
     * мировую позицию пола.
     */

    const pose =
        currentHit.getPose(
            xrReferenceSpace
        );


    if (!pose) {
        return;
    }


    /*
     * Сначала устанавливаем
     * объект в найденную точку.
     */

    model.matrix
        .fromArray(
            pose.transform.matrix
        );


    model.matrix
        .decompose(

            model.position,

            model.quaternion,

            model.scale

        );


    /*
     * Создаём Anchor.
     */

    if (
        typeof currentHit.createAnchor ===
        "function"
    ) {

        try {

            anchor =
                await currentHit
                    .createAnchor();

        } catch (error) {

            console.log(
                "Anchor unavailable",
                error
            );

            anchor =
                null;

        }

    }


    /*
     * Показываем объект.
     */

    model.visible =
        true;


    modelPlaced =
        true;


    placeButton.style.display =
        "none";


    arStatus.textContent =
        anchor
            ? "CREATURE ЗАКРЕПЛЁН"
            : "CREATURE РАЗМЕЩЁН";

}


/* =====================================================
   CLOSE
===================================================== */

closeButton.addEventListener(
    "click",
    stopAR
);


async function stopAR() {

    /*
     * Anchor.
     */

    if (
        anchor
    ) {

        try {

            anchor.delete();

        } catch (_) {}

        anchor =
            null;

    }


    /*
     * XR.
     */

    if (
        xrSession
    ) {

        try {

            await xrSession.end();

        } catch (_) {}

    }


    /*
     * Camera.
     */

    if (
        cameraStream
    ) {

        cameraStream
            .getTracks()
            .forEach(
                function(track) {

                    track.stop();

                }
            );


        cameraStream =
            null;

    }


    /*
     * Motion.
     */

    if (tg) {

        try {
            tg.DeviceOrientation?.stop();
        } catch (_) {}

        try {
            tg.Gyroscope?.stop();
        } catch (_) {}

        try {
            tg.Accelerometer?.stop();
        } catch (_) {}

        try {
            tg.unlockOrientation();
        } catch (_) {}

    }


    /*
     * UI.
     */

    cameraVideo.srcObject =
        null;

    cameraVideo.style.display =
        "none";

    arUI.style.display =
        "none";

    startScreen.style.display =
        "flex";

    startButton.disabled =
        false;

    startStatus.textContent =
        "Готово";


    modelPlaced =
        false;

    currentHit =
        null;


    if (model) {

        model.visible =
            false;

    }

}


/* =====================================================
   ERROR
===================================================== */

function showError(
    message
) {

    errorText.textContent =
        message;

    errorScreen.style.display =
        "flex";

}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    function() {

        if (
            renderer
        ) {

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

        }


        if (
            camera3D
        ) {

            camera3D.aspect =
                window.innerWidth /
                window.innerHeight;


            camera3D.updateProjectionMatrix();

        }

    }
);

</script>

</body>
</html>
